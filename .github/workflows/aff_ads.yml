name: Render Premium Skincare Motion Ad

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64 fonts-liberation \
            fonts-inter fonts-noto-core

      - name: Install Remotion
        run: |
          set -euo pipefail
          npm init -y
          npm install remotion @remotion/cli @remotion/bundler @remotion/renderer \
            react react-dom typescript @types/react @types/react-dom

      - name: Prepare project
        run: |
          set -euo pipefail
          mkdir -p src public out

          if [ -f produk.png ]; then
            cp produk.png public/product.png
          elif [ -f produk.jpg ]; then
            cp produk.jpg public/product.jpg
            sed -i "s#product.png#product.jpg#g" src/PremiumSkincare.tsx 2>/dev/null || true
          else
            echo "ERROR: produk.png or produk.jpg not found in repository root."
            exit 1
          fi

      - name: Write Remotion config
        run: |
          cat > remotion.config.ts <<'EOF'
          import { Config } from "@remotion/cli/config";

          Config.setVideoImageFormat("jpeg");
          Config.setOverwriteOutput(true);
          Config.setConcurrency(2);
          Config.setChromiumOpenGlRenderer("angle");
          Config.setJpegQuality(96);
          EOF

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "module": "ESNext",
              "jsx": "react-jsx",
              "strict": true,
              "moduleResolution": "node",
              "esModuleInterop": true,
              "skipLibCheck": true,
              "lib": ["DOM", "ES2020"]
            }
          }
          EOF

      - name: Write Remotion entry
        run: |
          cat > src/index.ts <<'EOF'
          import { registerRoot } from "remotion";
          import { PremiumSkincare } from "./PremiumSkincare";

          retention-days: 2
