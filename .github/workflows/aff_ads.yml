name: Render Mind-Blowing Skincare Video (Remotion)

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies (Chromium + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64 fonts-liberation \
            fonts-noto-color-emoji fonts-inter fonts-noto-core

      - name: Install dependencies
        run: |
          npm init -y
          npm install remotion @remotion/cli @remotion/bundler @remotion/renderer react react-dom typescript @types/react @types/react-dom

      - name: Create Remotion project
        run: |
          mkdir -p src public out

          if [ -f produk.png ]; then
            cp produk.png public/produk.png
            echo "✅ produk.png copied"
          else
            echo "❌ produk.png NOT found in root!"
            exit 1
          fi

          cat > remotion.config.ts <<'EOF'
          import { Config } from '@remotion/cli/config';
          Config.setVideoImageFormat('jpeg');
          Config.setOverwriteOutput(true);
          Config.setConcurrency(2);
          Config.setChromiumOpenGlRenderer('angle');
          Config.setJpegQuality(95);
          EOF

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "module": "ESNext",
              "jsx": "react-jsx",
              "strict": true,
              "moduleResolution": "node",
              "esModuleInterop": true,
              "skipLibCheck": true,
              "lib": ["DOM", "ES2020"]
            }
          }
          EOF

          cat > src/Root.tsx <<'EOF'
          import { Composition } from 'remotion';
          import { MindBlowingSkincare } from './MindBlowingSkincare';

          export const RemotionRoot: React.FC = () => (
            <Composition
              id="MindBlowingSkincare"
              component={MindBlowingSkincare}
              durationInFrames={900}
              fps={30}
              width={1080}
              height={1920}
            />
          );
          EOF

          cat > src/index.ts <<'EOF'
          import { registerRoot } from 'remotion';
          import { RemotionRoot } from './Root';
          registerRoot(RemotionRoot);
          EOF

          cat > src/MindBlowingSkincare.tsx <<'EOF'
          import React, { useMemo } from 'react';
          import {
            AbsoluteFill,
            Img,
            Sequence,
            interpolate,
            useCurrentFrame,
            spring,
            staticFile,
            Easing,
            random,
          } from 'remotion';

          const PRODUCT = staticFile('produk.png');

          // ================= PALETTE =================
          const CORAL = '#E8756A';
          const CORAL_DEEP = '#B54A3F';
          const CORAL_GLOW = '#FF9A8B';
          const CREAM = '#FBF3EC';
          const INK = '#1A1414';
          const GOLD = '#E8C28A';
          const GOLD_DEEP = '#B88A4E';

          // ================= EASING LIBRARY =================
          const ease = {
            smooth: Easing.bezier(0.22, 1, 0.36, 1),
            dramatic: Easing.bezier(0.83, 0, 0.17, 1),
            cine: Easing.bezier(0.65, 0, 0.35, 1),
            expo: Easing.bezier(0.16, 1, 0.3, 1),
            back: Easing.bezier(0.34, 1.56, 0.64, 1),
          };

          // ================= HELPERS =================
          const useFade = (inF: number, outF: number, dur: number) => {
            const f = useCurrentFrame();
            return interpolate(f, [0, inF, dur - outF, dur], [0, 1, 1, 0], {
              extrapolateLeft: 'clamp',
              extrapolateRight: 'clamp',
            });
          };

          // Handheld camera shake
          const useShake = (intensity = 3, speed = 1) => {
            const f = useCurrentFrame();
            return {
              x: Math.sin(f * 0.7 * speed) * intensity + Math.cos(f * 1.3 * speed) * intensity * 0.4,
              y: Math.cos(f * 0.9 * speed) * intensity + Math.sin(f * 1.1 * speed) * intensity * 0.4,
              rot: Math.sin(f * 0.5 * speed) * 0.15,
            };
          };

          // ================= VIRTUAL CAMERA RIG =================
          const CameraRig: React.FC<{
            children: React.ReactNode;
            dolly?: number;      // z-axis (mendekat/menjauh)
            orbit?: number;      // Y-axis rotation
            tilt?: number;       // X-axis rotation
            pan?: number;        // translate X
            shake?: number;      // handheld intensity
            fade?: number;       // fade mask
          }> = ({ children, dolly = 0, orbit = 0, tilt = 0, pan = 0, shake = 0, fade = 1 }) => {
            const f = useCurrentFrame();
            const sh = useShake(shake, 1);

            return (
              <AbsoluteFill
                style={{
                  opacity: fade,
                  perspective: 2400,
                  perspectiveOrigin: '50% 50%',
                }}
              >
                <AbsoluteFill
                  style={{
                    transform: `
                      translateX(${pan + sh.x}px)
                      translateY(${sh.y}px)
                      translateZ(${dolly}px)
                      rotateY(${orbit}deg)
                      rotateX(${tilt}deg)
                      rotateZ(${sh.rot}deg)
                    `,
                    transformStyle: 'preserve-3d',
                    willChange: 'transform',
                  }}
                >
                  {children}
                </AbsoluteFill>
              </AbsoluteFill>
            );
          };

          // ================= LAYERED PARALLAX BG =================
          const ParallaxAurora: React.FC<{ variant?: 'light' | 'cream' | 'coral' | 'dark' }> = ({
            variant = 'light',
          }) => {
            const f = useCurrentFrame();
            const t = f / 30;
            const wave = (o: number) =>
              Math.sin(t * 0.5 + o) * 22 + Math.cos(t * 0.35 + o * 2) * 14;

            const palettes = {
              light: ['#FFF0E8', CORAL_GLOW, CREAM, '#F0D8CC'],
              cream: ['#FFF5EC', CORAL_GLOW, '#F0D8CC', '#E8CFC0'],
              coral: [CORAL_GLOW, CORAL, CORAL_DEEP, '#7A2E28'],
              dark: ['#4A2E28', CORAL_DEEP, '#2A1815', '#120A08'],
            };
            const p = palettes[variant];

            return (
              <AbsoluteFill style={{ overflow: 'hidden' }}>
                {/* Layer 0: base gradient */}
                <AbsoluteFill
                  style={{
                    background: `linear-gradient(135deg, ${p[2]} 0%, ${p[0]} 100%)`,
                  }}
                />
                {/* Layer 1: slow blob (jauh) */}
                <div
                  style={{
                    position: 'absolute',
                    left: `${15 + wave(0) * 0.4}%`,
                    top: `${20 + wave(1) * 0.4}%`,
                    width: 1100,
                    height: 1100,
                    borderRadius: '50%',
                    background: `radial-gradient(circle, ${p[0]}BB, transparent 70%)`,
                    filter: 'blur(120px)',
                    transform: 'translateZ(-300px)',
                  }}
                />
                {/* Layer 2: mid blob */}
                <div
                  style={{
                    position: 'absolute',
                    right: `${5 + wave(2)}%`,
                    bottom: `${10 + wave(3)}%`,
                    width: 900,
                    height: 900,
                    borderRadius: '50%',
                    background: `radial-gradient(circle, ${p[1]}AA, transparent 70%)`,
                    filter: 'blur(100px)',
                  }}
                />
                {/* Layer 3: foreground blob */}
                <div
                  style={{
                    position: 'absolute',
                    left: `${45 + wave(4) * 1.4}%`,
                    bottom: `${35 + wave(5) * 1.2}%`,
                    width: 700,
                    height: 700,
                    borderRadius: '50%',
                    background: `radial-gradient(circle, ${p[0]}88, transparent 70%)`,
                    filter: 'blur(90px)',
                    transform: 'translateZ(200px)',
                  }}
                />
              </AbsoluteFill>
            );
          };

          // ================= VOLUMETRIC LIGHT RAYS =================
          const VolumetricRays: React.FC<{ intensity?: number }> = ({ intensity = 1 }) => {
            const f = useCurrentFrame();
            const rays = 7;
            return (
              <AbsoluteFill
                style={{
                  overflow: 'hidden',
                  pointerEvents: 'none',
                  mixBlendMode: 'screen',
                  opacity: intensity,
                }}
              >
                {Array.from({ length: rays }).map((_, i) => {
                  const baseX = (i / rays) * 100 + 8;
                  const sway = Math.sin((f + i * 20) / 60) * 4;
                  const width = 60 + random(`w-${i}`) * 90;
                  const op = 0.06 + random(`o-${i}`) * 0.08;
                  return (
                    <div
                      key={i}
                      style={{
                        position: 'absolute',
                        top: '-15%',
                        left: `${baseX + sway}%`,
                        width,
                        height: '130%',
                        background: `linear-gradient(180deg, ${GOLD}${Math.round(op * 255).toString(16).padStart(2, '0')} 0%, transparent 80%)`,
                        transform: `rotate(${10 + random(`r-${i}`) * 15}deg)`,
                        filter: 'blur(18px)',
                      }}
                    />
                  );
                })}
              </AbsoluteFill>
            );
          };

          // ================= BOKEH PARTICLES (parallax layers) =================
          const BokehField: React.FC<{
            count?: number;
            color?: string;
            depth?: 'near' | 'mid' | 'far';
          }> = ({ count = 24, color = CORAL_GLOW, depth = 'mid' }) => {
            const f = useCurrentFrame();
            const speedMap = { near: 1.4, mid: 0.8, far: 0.4 };
            const sizeMap = { near: 1.4, mid: 1, far: 0.6 };
            const blurMap = { near: 2, mid: 6, far: 14 };

            const particles = useMemo(
              () =>
                Array.from({ length: count }).map((_, i) => ({
                  x: random(`x-${depth}-${i}`) * 100,
                  y: random(`y-${depth}-${i}`) * 100,
                  s: (20 + random(`s-${depth}-${i}`) * 70) * sizeMap[depth],
                  sp: (0.3 + random(`sp-${depth}-${i}`) * 0.7) * speedMap[depth],
                  d: random(`d-${depth}-${i}`) * 200,
                  o: 0.15 + random(`o-${depth}-${i}`) * 0.35,
                })),
              [count, depth]
            );

            return (
              <AbsoluteFill style={{ overflow: 'hidden', pointerEvents: 'none' }}>
                {particles.map((p, i) => {
                  const y = (p.y - ((f - p.d) * p.sp) / 20) % 120;
                  const wobble = Math.sin((f + i * 30) / 55) * 24;
                  return (
                    <div
                      key={i}
                      style={{
                        position: 'absolute',
                        left: `${p.x}%`,
                        top: `${y}%`,
                        width: p.s,
                        height: p.s,
                        borderRadius: '50%',
                        background: `radial-gradient(circle, ${color}${Math.round(p.o * 255).toString(16).padStart(2, '0')}, transparent 70%)`,
                        filter: `blur(${blurMap[depth]}px)`,
                        transform: `translateX(${wobble}px)`,
                      }}
                    />
                  );
                })}
              </AbsoluteFill>
            );
          };

          // ================= LENS FLARE =================
          const LensFlare: React.FC<{ x?: number; y?: number; delay?: number; intensity?: number }> = ({
            x = 50,
            y = 40,
            delay = 0,
            intensity = 1,
          }) => {
            const f = useCurrentFrame();
            const local = f - delay;
            if (local < 0 || local > 120) return null;
            const p = interpolate(local, [0, 60, 120], [0, 1, 0]);
            return (
              <AbsoluteFill style={{ pointerEvents: 'none', mixBlendMode: 'screen', opacity: p * intensity }}>
                {/* Core flare */}
                <div
                  style={{
                    position: 'absolute',
                    left: `${x}%`,
                    top: `${y}%`,
                    width: 400,
                    height: 400,
                    transform: 'translate(-50%, -50%)',
                    borderRadius: '50%',
                    background: `radial-gradient(circle, ${GOLD}CC 0%, ${CORAL_GLOW}55 30%, transparent 65%)`,
                    filter: 'blur(20px)',
                  }}
                />
                {/* Anamorphic horizontal streak */}
                <div
                  style={{
                    position: 'absolute',
                    left: 0,
                    right: 0,
                    top: `${y}%`,
                    height: 6,
                    background: `linear-gradient(90deg, transparent 20%, ${GOLD}DD 50%, transparent 80%)`,
                    filter: 'blur(3px)',
                    transform: `translateY(-50%) scaleY(${p})`,
                  }}
                />
                {/* Secondary ghost flares */}
                {[1, 2, 3].map((g) => (
                  <div
                    key={g}
                    style={{
                      position: 'absolute',
                      left: `${x + (g % 2 === 0 ? 15 : -12) * g}%`,
                      top: `${y + g * 8}%`,
                      width: 40 + g * 15,
                      height: 40 + g * 15,
                      transform: 'translate(-50%, -50%)',
                      borderRadius: '50%',
                      background: `radial-gradient(circle, ${CORAL_GLOW}AA, transparent 70%)`,
                      opacity: 0.5 / g,
                    }}
                  />
                ))}
              </AbsoluteFill>
            );
          };

          // ================= BLOOM OVERLAY =================
          const Bloom: React.FC<{ intensity?: number }> = ({ intensity = 0.18 }) => {
            const f = useCurrentFrame();
            const pulse = 1 + Math.sin(f / 12) * 0.1;
            return (
              <AbsoluteFill
                style={{
                  pointerEvents: 'none',
                  mixBlendMode: 'screen',
                  background: `radial-gradient(circle at 50% 40%, rgba(255,200,160,${intensity * pulse}), transparent 60%)`,
                  zIndex: 145,
                }}
              />
            );
          };

          // ================= PRODUCT 3D HERO =================
          const Product3DHero: React.FC<{
            delay?: number;
            scale?: number;
            rotateY?: number;
            rotateZ?: number;
            yOffset?: number;
            tiltX?: number;
            showGlow?: boolean;
          }> = ({
            delay = 0,
            scale = 1,
            rotateY = 0,
            rotateZ = 0,
            yOffset = 0,
            tiltX = 0,
            showGlow = true,
          }) => {
            const f = useCurrentFrame();
            const local = f - delay;
            const float = Math.sin(local / 22) * 18;
            const sway = Math.sin(local / 32) * 5;
            const pop = spring({
              frame: local,
              fps: 30,
              config: { damping: 14, stiffness: 80, mass: 1.3 },
            });
            const s = interpolate(pop, [0, 1], [0.5, 1]) * scale;
            const yR = rotateY + sway;
            const zR = rotateZ + Math.sin(local / 40) * 2;
            const xR = tiltX + Math.cos(local / 50) * 1.5;

            return (
              <AbsoluteFill
                style={{
                  justifyContent: 'center',
                  alignItems: 'center',
                  perspective: 2000,
                }}
              >
                <div
                  style={{
                    transform: `
                      translateY(${float + yOffset}px)
                      scale(${s})
                      rotateY(${yR}deg)
                      rotateX(${xR}deg)
                      rotateZ(${zR}deg)
                    `,
                    opacity: pop,
                    transformStyle: 'preserve-3d',
                    position: 'relative',
                  }}
                >
                  {showGlow && (
                    <div
                      style={{
                        position: 'absolute',
                        inset: -80,
                        borderRadius: '50%',
                        background: `radial-gradient(circle, ${CORAL_GLOW}66, transparent 65%)`,
                        filter: 'blur(60px)',
                        transform: 'translateZ(-100px)',
                      }}
                    />
                  )}
                  <div
                    style={{
                      position: 'absolute',
                      bottom: -70,
                      left: '10%',
                      right: '10%',
                      height: 70,
                      borderRadius: '50%',
                      background: `radial-gradient(ellipse, ${CORAL_DEEP}66, transparent 70%)`,
                      filter: 'blur(28px)',
                      transform: `scale(${1 + Math.sin(local / 25) * 0.06})`,
                    }}
                  />
                  <Img
                    src={PRODUCT}
                    style={{
                      width: 920,
                      objectFit: 'contain',
                      filter: `
                        drop-shadow(0 50px 70px rgba(150,50,40,0.45))
                        drop-shadow(0 15px 30px rgba(0,0,0,0.2))
                        drop-shadow(0 0 60px ${CORAL_GLOW}55)
                      `,
                    }}
                  />
                </div>
              </AbsoluteFill>
            );
          };

          // ================= KINETIC TEXT (mask reveal + per-char spring) =================
          const KineticText: React.FC<{
            text: string;
            delay?: number;
            fontSize?: number;
            color?: string;
            weight?: number;
            letterSpacing?: number;
            stagger?: number;
            maskReveal?: boolean;
            glow?: boolean;
          }> = ({
            text,
            delay = 0,
            fontSize = 90,
            color = INK,
            weight = 900,
            letterSpacing = -2,
            stagger = 2,
            maskReveal = false,
            glow = false,
          }) => {
            const f = useCurrentFrame();
            const chars = text.split('');

            return (
              <div
                style={{
                  display: 'flex',
                  flexWrap: 'wrap',
                  justifyContent: 'center',
                  gap: '0.02em',
                  fontFamily: 'Inter, system-ui, sans-serif',
                  fontSize,
                  fontWeight: weight,
                  color,
                  letterSpacing,
                  lineHeight: 1.05,
                  textShadow: glow
                    ? `0 0 40px ${color}AA, 0 0 80px ${color}55`
                    : '0 4px 30px rgba(0,0,0,0.08)',
                }}
              >
                {chars.map((c, i) => {
                  const s = spring({
                    frame: f - delay - i * stagger,
                    fps: 30,
                    config: { damping: 12, stiffness: 140 },
                  });
                  const y = interpolate(s, [0, 1], [100, 0]);
                  const op = maskReveal ? 1 : s;
                  const rot = interpolate(s, [0, 1], [10, 0]);
                  const clip = maskReveal
                    ? `inset(${interpolate(s, [0, 1], [100, 0])}% 0% 0% 0%)`
                    : 'none';
                  return (
                    <span
                      key={i}
                      style={{
                        display: 'inline-block',
                        transform: `translateY(${y}px) rotate(${rot}deg)`,
                        opacity: op,
                        clipPath: clip,
                      }}
                    >
                      {c === ' ' ? '\u00A0' : c}
                    </span>
                  );
                })}
              </div>
            );
          };

          // ================= PRO SUBTITLE BAR =================
          const SubtitleBar: React.FC<{
            text: string;
            delay?: number;
            dur?: number;
            accent?: string;
          }> = ({ text, delay = 0, dur = 90, accent = CORAL }) => {
            const f = useCurrentFrame();
            const local = f - delay;
            if (local < 0 || local > dur) return null;

            const slideIn = spring({
              frame: local,
              fps: 30,
              config: { damping: 14, stiffness: 120 },
            });
            const slideOut = spring({
              frame: local - (dur - 15),
              fps: 30,
              config: { damping: 14 },
            });
            const x = interpolate(slideIn, [0, 1], [-80, 0]) - slideOut * 80;
            const opacity = slideIn - slideOut;

            return (
              <div
                style={{
                  position: 'absolute',
                  bottom: 150,
                  left: 60,
                  right: 60,
                  display: 'flex',
                  justifyContent: 'center',
                  opacity,
                  transform: `translateX(${x}px)`,
                  zIndex: 170,
                }}
              >
                <div
                  style={{
                    background: 'rgba(20,10,10,0.78)',
                    backdropFilter: 'blur(20px)',
                    padding: '18px 42px',
                    borderRadius: 20,
                    borderLeft: `5px solid ${accent}`,
                    fontFamily: 'Inter, sans-serif',
                    fontSize: 40,
                    fontWeight: 700,
                    color: '#FFFFFF',
                    letterSpacing: -0.5,
                    boxShadow: `0 20px 50px rgba(0,0,0,0.35), 0 0 40px ${accent}55`,
                    textAlign: 'center',
                  }}
                >
                  {text}
                </div>
              </div>
            );
          };
          EOF

                    // ================= RACK FOCUS WRAPPER =================
          const RackFocus: React.FC<{
            children: React.ReactNode;
            startBlur?: number;
            endBlur?: number;
            focusFrame?: number;
            dur?: number;
          }> = ({ children, startBlur = 12, endBlur = 0, focusFrame = 30, dur = 120 }) => {
            const f = useCurrentFrame();
            const blur = interpolate(f, [0, focusFrame, dur], [startBlur, 0, endBlur], {
              extrapolateLeft: 'clamp',
              extrapolateRight: 'clamp',
            });
            return (
              <AbsoluteFill style={{ filter: `blur(${blur}px)` }}>{children}</AbsoluteFill>
            );
          };

          // ================= SPEED RAMP WRAPPER =================
          const SpeedRamp: React.FC<{
            children: React.ReactNode;
            slowStart?: number;
            slowEnd?: number;
            duration: number;
          }> = ({ children, slowStart = 0, slowEnd = 60, duration }) => {
            const f = useCurrentFrame();
            // Simulasi speed ramp dengan scale dinamis
            const ramp = interpolate(
              f,
              [slowStart, slowEnd, duration],
              [1.0, 1.05, 1.12],
              { easing: ease.cine, extrapolateLeft: 'clamp', extrapolateRight: 'clamp' }
            );
            return (
              <AbsoluteFill style={{ transform: `scale(${ramp})` }}>
                {children}
              </AbsoluteFill>
            );
          };

          // ================= CHROMATIC ABERRATION FILTER =================
          const ChromaticLayer: React.FC<{ intensity?: number }> = ({ intensity = 1 }) => {
            const f = useCurrentFrame();
            const shift = Math.sin(f / 40) * 2 * intensity;
            return (
              <AbsoluteFill style={{ pointerEvents: 'none', mixBlendMode: 'screen', opacity: 0.08 }}>
                <AbsoluteFill
                  style={{
                    background: 'rgba(255,80,60,0.4)',
                    transform: `translate(${shift}px, ${shift * 0.5}px)`,
                    mixBlendMode: 'screen',
                  }}
                />
                <AbsoluteFill
                  style={{
                    background: 'rgba(60,140,255,0.4)',
                    transform: `translate(${-shift}px, ${-shift * 0.5}px)`,
                    mixBlendMode: 'screen',
                  }}
                />
              </AbsoluteFill>
            );
          };

          // ================= SHOT 1: CINEMATIC OPENING =================
          const ShotOpening: React.FC<{ dur: number }> = ({ dur }) => {
            const opacity = useFade(20, 20, dur);
            const f = useCurrentFrame();
            const dolly = interpolate(f, [0, dur], [-200, 60], { easing: ease.cine });
            const tilt = interpolate(f, [0, dur], [8, -2], { easing: ease.smooth });

            return (
              <AbsoluteFill style={{ opacity }}>
                <CameraRig dolly={dolly} tilt={tilt} shake={2} fade={1}>
                  <ParallaxAurora variant="light" />
                  <BokehField count={18} color={CORAL_GLOW} depth="far" />
                  <BokehField count={14} color={GOLD} depth="mid" />
                  <VolumetricRays intensity={0.9} />

                  <Product3DHero
                    delay={15}
                    scale={1.02}
                    rotateY={0}
                    showGlow
                  />

                  <BokehField count={8} color="#FFF5EC" depth="near" />
                </CameraRig>

                <LensFlare x={30} y={28} delay={10} intensity={1.1} />
                <LensFlare x={78} y={72} delay={40} intensity={0.7} />

                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-start',
                    alignItems: 'center',
                    paddingTop: 160,
                    gap: 18,
                    zIndex: 175,
                  }}
                >
                  <KineticText
                    text="KULIT KUSAM"
                    delay={15}
                    fontSize={120}
                    color={CORAL_DEEP}
                    maskReveal
                    glow
                  />
                  <KineticText
                    text="Bikin PD Kamu Hilang?"
                    delay={60}
                    fontSize={52}
                    color={INK}
                    weight={600}
                    letterSpacing={-1}
                  />
                </AbsoluteFill>

                <SubtitleBar text="Solusi premium dari HS Beauty ✨" delay={95} dur={50} />
              </AbsoluteFill>
            );
          };

          // ================= SHOT 2: 3D ORBIT REVEAL =================
          const ShotOrbitReveal: React.FC<{ dur: number }> = ({ dur }) => {
            const opacity = useFade(15, 15, dur);
            const f = useCurrentFrame();
            const orbit = interpolate(f, [0, dur], [-25, 25], { easing: ease.smooth });
            const dolly = interpolate(f, [0, dur], [-100, 80], { easing: ease.cine });

            return (
              <AbsoluteFill style={{ opacity }}>
                <CameraRig dolly={dolly} orbit={orbit} shake={1.5}>
                  <ParallaxAurora variant="cream" />
                  <BokehField count={22} color={GOLD} depth="mid" />
                  <VolumetricRays intensity={1.2} />

                  <Product3DHero
                    delay={0}
                    rotateY={0}
                    rotateZ={0}
                    scale={1.05}
                    showGlow
                  />
                </CameraRig>

                <LensFlare x={50} y={25} delay={20} intensity={1.3} />

                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-end',
                    alignItems: 'center',
                    paddingBottom: 300,
                    gap: 20,
                    zIndex: 175,
                  }}
                >
                  <KineticText
                    text="NEW BRIGHTENING"
                    delay={20}
                    fontSize={64}
                    color={CORAL_DEEP}
                    weight={800}
                    letterSpacing={8}
                    maskReveal
                  />
                  <KineticText
                    text="SERIES"
                    delay={45}
                    fontSize={96}
                    color={INK}
                    weight={900}
                    letterSpacing={20}
                    maskReveal
                  />
                </AbsoluteFill>

                <SubtitleBar text="4 produk • 1 paket lengkap" delay={75} dur={40} />
              </AbsoluteFill>
            );
          };

          // ================= SHOT 3: STEP 01 FACIAL WASH =================
          const ShotStep1: React.FC<{ dur: number }> = ({ dur }) => {
            const opacity = useFade(15, 15, dur);
            const f = useCurrentFrame();
            const zoom = interpolate(f, [0, dur], [1.15, 1.45], { easing: ease.cine });
            const pan = interpolate(f, [0, dur], [0, -180], { easing: ease.cine });

            return (
              <AbsoluteFill style={{ opacity }}>
                <CameraRig dolly={interpolate(f, [0, dur], [0, 200], { easing: ease.cine })} shake={2}>
                  <ParallaxAurora variant="light" />
                  <BokehField count={16} color={CORAL_GLOW} depth="mid" />
                  <VolumetricRays intensity={0.8} />

                  <AbsoluteFill
                    style={{
                      justifyContent: 'center',
                      alignItems: 'center',
                      transform: `scale(${zoom}) translateX(${pan}px)`,
                    }}
                  >
                    <Img
                      src={PRODUCT}
                      style={{
                        width: 950,
                        objectFit: 'contain',
                        filter: 'drop-shadow(0 40px 60px rgba(150,50,40,0.45)) drop-shadow(0 0 40px rgba(255,180,150,0.35))',
                      }}
                    />
                  </AbsoluteFill>
                </CameraRig>

                <LensFlare x={25} y={45} delay={15} intensity={0.9} />

                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-end',
                    alignItems: 'center',
                    paddingBottom: 300,
                    gap: 16,
                    zIndex: 175,
                  }}
                >
                  <div
                    style={{
                      padding: '12px 36px',
                      background: `linear-gradient(90deg, ${CORAL}, ${CORAL_DEEP})`,
                      borderRadius: 999,
                      color: 'white',
                      fontFamily: 'Inter, sans-serif',
                      fontWeight: 800,
                      fontSize: 30,
                      letterSpacing: 6,
                      boxShadow: `0 15px 40px ${CORAL}88`,
                    }}
                  >
                    STEP 01
                  </div>
                  <KineticText
                    text="FACIAL WASH"
                    delay={15}
                    fontSize={82}
                    color={INK}
                    maskReveal
                  />
                  <KineticText
                    text="Glycolic Acid"
                    delay={40}
                    fontSize={42}
                    color={CORAL_DEEP}
                    weight={600}
                    letterSpacing={2}
                  />
                </AbsoluteFill>

                <SubtitleBar text="Angkat kotoran + sel kulit mati" delay={65} dur={40} />
              </AbsoluteFill>
            );
          };

          // ================= SHOT 4: STEP 02 DAY CREAM =================
          const ShotStep2: React.FC<{ dur: number }> = ({ dur }) => {
            const opacity = useFade(15, 15, dur);
            const f = useCurrentFrame();
            const zoom = interpolate(f, [0, dur], [1.15, 1.42], { easing: ease.cine });

            return (
              <AbsoluteFill style={{ opacity }}>
                <CameraRig dolly={interpolate(f, [0, dur], [-80, 160], { easing: ease.cine })} shake={2}>
                  <ParallaxAurora variant="cream" />
                  <BokehField count={22} color={GOLD} depth="mid" />
                  <BokehField count={10} color={CORAL_GLOW} depth="near" />
                  <VolumetricRays intensity={1.3} />

                  <AbsoluteFill
                    style={{
                      justifyContent: 'center',
                      alignItems: 'center',
                      transform: `scale(${zoom})`,
                    }}
                  >
                    <Img
                      src={PRODUCT}
                      style={{
                        width: 950,
                        objectFit: 'contain',
                        filter: 'drop-shadow(0 40px 60px rgba(150,50,40,0.45)) drop-shadow(0 0 60px rgba(255,180,150,0.4))',
                      }}
                    />
                  </AbsoluteFill>
                </CameraRig>

                <LensFlare x={50} y={30} delay={20} intensity={1.4} />

                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-end',
                    alignItems: 'center',
                    paddingBottom: 300,
                    gap: 16,
                    zIndex: 175,
                  }}
                >
                  <div
                    style={{
                      padding: '12px 36px',
                      background: `linear-gradient(90deg, ${CORAL}, ${CORAL_DEEP})`,
                      borderRadius: 999,
                      color: 'white',
                      fontFamily: 'Inter, sans-serif',
                      fontWeight: 800,
                      fontSize: 30,
                      letterSpacing: 6,
                      boxShadow: `0 15px 40px ${CORAL}88`,
                    }}
                  >
                    STEP 02
                  </div>
                  <KineticText text="DAY CREAM" delay={15} fontSize={82} color={INK} maskReveal />
                  <KineticText
                    text="Niacinamide • Ceramide"
                    delay={40}
                    fontSize={38}
                    color={CORAL_DEEP}
                    weight={600}
                    letterSpacing={1}
                  />
                </AbsoluteFill>

                <SubtitleBar text="Glowing sepanjang hari" delay={65} dur={40} />
              </AbsoluteFill>
            );
          };

          // ================= SHOT 5: STEP 03 NIGHT CREAM =================
          const ShotStep3: React.FC<{ dur: number }> = ({ dur }) => {
            const opacity = useFade(15, 15, dur);
            const f = useCurrentFrame();
            const zoom = interpolate(f, [0, dur], [1.15, 1.42], { easing: ease.cine });
            const pan = interpolate(f, [0, dur], [0, 180], { easing: ease.cine });

            return (
              <AbsoluteFill style={{ opacity }}>
                <CameraRig dolly={interpolate(f, [0, dur], [0, 220], { easing: ease.cine })} shake={2.5}>
                  <ParallaxAurora variant="dark" />
                  <BokehField count={20} color={GOLD} depth="mid" />
                  <BokehField count={8} color={GOLD_DEEP} depth="far" />
                  <VolumetricRays intensity={0.6} />

                  <AbsoluteFill
                    style={{
                      justifyContent: 'center',
                      alignItems: 'center',
                      transform: `scale(${zoom}) translateX(${pan}px)`,
                    }}
                  >
                    <Img
                      src={PRODUCT}
                      style={{
                        width: 950,
                        objectFit: 'contain',
                        filter:
                          'drop-shadow(0 40px 60px rgba(0,0,0,0.65)) drop-shadow(0 0 70px rgba(255,180,150,0.5))',
                      }}
                    />
                  </AbsoluteFill>
                </CameraRig>

                <LensFlare x={70} y={35} delay={20} intensity={1.2} />

                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-end',
                    alignItems: 'center',
                    paddingBottom: 300,
                    gap: 16,
                    zIndex: 175,
                  }}
                >
                  <div
                    style={{
                      padding: '12px 36px',
                      background: `linear-gradient(90deg, ${GOLD}, ${GOLD_DEEP})`,
                      borderRadius: 999,
                      color: CORAL_DEEP,
                      fontFamily: 'Inter, sans-serif',
                      fontWeight: 800,
                      fontSize: 30,
                      letterSpacing: 6,
                      boxShadow: `0 15px 40px ${GOLD}88`,
                    }}
                  >
                    STEP 03
                  </div>
                  <KineticText text="NIGHT CREAM" delay={15} fontSize={82} color="#FFFFFF" maskReveal glow />
                  <KineticText
                    text="Hyaluronic Acid"
                    delay={40}
                    fontSize={44}
                    color={GOLD}
                    weight={600}
                    letterSpacing={2}
                  />
                </AbsoluteFill>

                <SubtitleBar text="Regenerasi kulit saat tidur" delay={65} dur={40} accent={GOLD} />
              </AbsoluteFill>
            );
          };

          // ================= SHOT 6: BONUS TONER =================
          const ShotBonusToner: React.FC<{ dur: number }> = ({ dur }) => {
            const opacity = useFade(15, 15, dur);
            const f = useCurrentFrame();
            const rotateY = interpolate(f, [0, dur], [15, -15], { easing: ease.smooth });

            return (
              <AbsoluteFill style={{ opacity }}>
                <CameraRig dolly={interpolate(f, [0, dur], [-100, 120], { easing: ease.cine })} shake={1.5}>
                  <ParallaxAurora variant="cream" />
                  <BokehField count={26} color={CORAL_GLOW} depth="mid" />
                  <BokehField count={14} color={GOLD} depth="near" />
                  <VolumetricRays intensity={1.1} />

                  <Product3DHero
                    delay={0}
                    rotateY={rotateY}
                    scale={0.98}
                    showGlow
                  />
                </CameraRig>

                <LensFlare x={35} y={50} delay={15} intensity={1.0} />
                <LensFlare x={65} y={55} delay={35} intensity={0.8} />

                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-end',
                    alignItems: 'center',
                    paddingBottom: 300,
                    gap: 16,
                    zIndex: 175,
                  }}
                >
                  <div
                    style={{
                      padding: '12px 36px',
                      background: `linear-gradient(90deg, ${GOLD}, ${CORAL})`,
                      borderRadius: 999,
                      color: 'white',
                      fontFamily: 'Inter, sans-serif',
                      fontWeight: 800,
                      fontSize: 30,
                      letterSpacing: 6,
                      boxShadow: `0 15px 40px ${CORAL}88`,
                    }}
                  >
                    BONUS
                  </div>
                  <KineticText
                    text="TONER BRIGHTENING"
                    delay={15}
                    fontSize={68}
                    color={INK}
                    maskReveal
                  />
                  <KineticText
                    text="Hyaluronic Acid"
                    delay={40}
                    fontSize={40}
                    color={CORAL_DEEP}
                    weight={600}
                  />
                </AbsoluteFill>

                <SubtitleBar text="Bonus eksklusif — mencerahkan" delay={65} dur={40} />
              </AbsoluteFill>
            );
          };

          // ================= SHOT 7: BEFORE / AFTER =================
          const ShotBeforeAfter: React.FC<{ dur: number }> = ({ dur }) => {
            const opacity = useFade(15, 15, dur);
            const f = useCurrentFrame();
            const reveal = interpolate(f, [15, 100], [50, 0], {
              easing: ease.smooth,
              extrapolateLeft: 'clamp',
              extrapolateRight: 'clamp',
            });

            return (
              <AbsoluteFill style={{ opacity }}>
                <CameraRig dolly={interpolate(f, [0, dur], [-50, 80], { easing: ease.cine })} shake={2}>
                  <ParallaxAurora variant="light" />
                  <BokehField count={20} color={GOLD} depth="mid" />
                  <VolumetricRays intensity={1.0} />

                  {/* Before layer */}
                  <AbsoluteFill
                    style={{
                      justifyContent: 'center',
                      alignItems: 'center',
                      filter: 'saturate(0.5) brightness(0.82) contrast(0.9)',
                      clipPath: `inset(0 ${100 - reveal}% 0 0)`,
                    }}
                  >
                    <Img
                      src={PRODUCT}
                      style={{
                        width: 950,
                        objectFit: 'contain',
                        filter: 'drop-shadow(0 40px 60px rgba(80,40,30,0.55))',
                      }}
                    />
                  </AbsoluteFill>

                  {/* After layer */}
                  <AbsoluteFill
                    style={{
                      justifyContent: 'center',
                      alignItems: 'center',
                      clipPath: `inset(0 0 0 ${reveal}%)`,
                    }}
                  >
                    <Img
                      src={PRODUCT}
                      style={{
                        width: 950,
                        objectFit: 'contain',
                        filter:
                          'drop-shadow(0 40px 60px rgba(150,50,40,0.5)) drop-shadow(0 0 70px rgba(255,180,150,0.65)) saturate(1.35) brightness(1.12)',
                      }}
                    />
                  </AbsoluteFill>

                  {/* Slider line */}
                  <div
                    style={{
                      position: 'absolute',
                      top: '15%',
                      bottom: '15%',
                      left: `${reveal}%`,
                      width: 6,
                      background: `linear-gradient(180deg, transparent, ${GOLD}, ${CORAL_GLOW}, ${GOLD}, transparent)`,
                      boxShadow: `0 0 40px ${GOLD}, 0 0 80px ${CORAL_GLOW}`,
                      transform: 'translateX(-50%)',
                    }}
                  />
                </CameraRig>

                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-start',
                    alignItems: 'center',
                    paddingTop: 260,
                    zIndex: 175,
                  }}
                >
                  <KineticText
                    text="GLOWING DARI HARI 1"
                    delay={20}
                    fontSize={74}
                    color={INK}
                    maskReveal
                    glow
                  />
                </AbsoluteFill>

                <SubtitleBar text="Beda yang bisa kamu lihat ✨" delay={60} dur={50} />
              </AbsoluteFill>
            );
          };

          // ================= SHOT 8: PREMIUM CTA =================
          const ShotPremiumCTA: React.FC<{ dur: number }> = ({ dur }) => {
            const opacity = useFade(20, 20, dur);
            const f = useCurrentFrame();
            const pulse = 1 + Math.sin(f / 8) * 0.045;
            const glowPulse = 0.6 + (Math.sin(f / 10) + 1) * 0.2;
            const float = Math.sin(f / 22) * 14;
            const orbit = interpolate(f, [0, dur], [-8, 8], { easing: ease.smooth });

            return (
              <AbsoluteFill style={{ opacity }}>
                <CameraRig dolly={interpolate(f, [0, dur], [0, 180], { easing: ease.cine })} orbit={orbit} shake={1.5}>
                  <ParallaxAurora variant="coral" />
                  <BokehField count={30} color="#FFFFFF" depth="mid" />
                  <BokehField count={14} color={GOLD} depth="near" />
                  <VolumetricRays intensity={1.4} />

                  <AbsoluteFill
                    style={{
                      justifyContent: 'center',
                      alignItems: 'center',
                      transform: `translateY(${float - 180}px)`,
                    }}
                  >
                    <Img
                      src={PRODUCT}
                      style={{
                        width: 900,
                        objectFit: 'contain',
                        filter: `
                          drop-shadow(0 60px 90px rgba(0,0,0,0.55))
                          drop-shadow(0 0 80px rgba(255,255,255,${glowPulse}))
                        `,
                      }}
                    />
                  </AbsoluteFill>
                </CameraRig>

                <LensFlare x={50} y={35} delay={10} intensity={1.5} />
                <LensFlare x={20} y={65} delay={30} intensity={0.9} />
                <LensFlare x={82} y={60} delay={50} intensity={0.9} />

                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-end',
                    alignItems: 'center',
                    paddingBottom: 180,
                    gap: 24,
                    zIndex: 175,
                  }}
                >
                  <KineticText
                    text="4 PRODUK • 1 PAKET"
                    delay={15}
                    fontSize={56}
                    color="#FFFFFF"
                    weight={800}
                    letterSpacing={6}
                    maskReveal
                    glow
                  />

                  <div
                    style={{
                      fontFamily: 'Inter, sans-serif',
                      fontSize: 34,
                      fontWeight: 600,
                      color: '#FFFFFF',
                      background: 'rgba(255,255,255,0.22)',
                      padding: '14px 44px',
                      borderRadius: 999,
                      backdropFilter: 'blur(24px)',
                      border: '2px solid rgba(255,255,255,0.55)',
                      letterSpacing: 1,
                    }}
                  >
                    Harga Spesial Hari Ini 🎁
                  </div>

                  <div
                    style={{
                      fontFamily: 'Inter, sans-serif',
                      fontSize: 68,
                      fontWeight: 900,
                      color: CORAL_DEEP,
                      background: '#FFFFFF',
                      padding: '30px 76px',
                      borderRadius: 60,
                      transform: `scale(${pulse})`,
                      boxShadow: `0 30px 80px rgba(0,0,0,0.45), 0 0 0 10px rgba(255,255,255,0.15)`,
                      letterSpacing: -1,
                    }}
                  >
                    🛒 KLIK LINK DI BIO
                  </div>

                  <div
                    style={{
                      fontFamily: 'Inter, sans-serif',
                      fontSize: 28,
                      fontWeight: 600,
                      color: '#FFFFFF',
                      opacity: 0.9,
                      letterSpacing: 4,
                    }}
                  >
                    GRATIS ONGKIR • COD • BONUS TONER
                  </div>
                </AbsoluteFill>
              </AbsoluteFill>
            );
          };

          // ================= TRANSISI CINEMATIC =================
          const CinematicWhip: React.FC<{
            start: number;
            dur?: number;
            direction?: 'left' | 'right';
          }> = ({ start, dur = 16, direction = 'right' }) => {
            const f = useCurrentFrame();
            const local = f - start;
            if (local < 0 || local > dur) return null;
            const p = interpolate(local, [0, dur], [0, 1], { easing: ease.expo });
            const blur = interpolate(p, [0, 0.5, 1], [0, 70, 0]);
            const x =
              direction === 'right'
                ? interpolate(p, [0, 1], [-140, 140])
                : interpolate(p, [0, 1], [140, -140]);
            const opacity = interpolate(p, [0, 0.25, 0.75, 1], [0, 1, 1, 0]);
            const rOff = x * 0.18;
            const bOff = -x * 0.18;

            return (
              <AbsoluteFill style={{ pointerEvents: 'none', zIndex: 200, opacity }}>
                <div
                  style={{
                    position: 'absolute',
                    inset: 0,
                    background: `linear-gradient(${x > 0 ? 90 : -90}deg, transparent 25%, rgba(255,180,150,0.95) 50%, transparent 75%)`,
                    filter: `blur(${blur}px)`,
                    transform: `translateX(${x}%)`,
                  }}
                />
                <div
                  style={{
                    position: 'absolute',
                    inset: 0,
                    background: `linear-gradient(${x > 0 ? 90 : -90}deg, transparent 30%, rgba(120,200,255,0.7) 50%, transparent 70%)`,
                    filter: `blur(${blur * 1.2}px)`,
                    transform: `translateX(${x + bOff}%)`,
                    mixBlendMode: 'screen',
                  }}
                />
                <div
                  style={{
                    position: 'absolute',
                    inset: 0,
                    background: `linear-gradient(${x > 0 ? 90 : -90}deg, transparent 35%, rgba(255,120,100,0.6) 50%, transparent 65%)`,
                    filter: `blur(${blur}px)`,
                    transform: `translateX(${x + rOff}%)`,
                    mixBlendMode: 'screen',
                  }}
                />
              </AbsoluteFill>
            );
          };

          // ================= FILM GRAIN =================
          const FilmGrain: React.FC = () => {
            const f = useCurrentFrame();
            const seed = f % 6;
            return (
              <AbsoluteFill
                style={{
                  pointerEvents: 'none',
                  opacity: 0.05,
                  mixBlendMode: 'overlay',
                  zIndex: 150,
                  backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' seed='${seed}'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")`,
                }}
              />
            );
          };

          // ================= COLOR GRADE (teal & orange) =================
          const ColorGrade: React.FC = () => (
            <AbsoluteFill
              style={{
                pointerEvents: 'none',
                zIndex: 140,
                background: `
                  linear-gradient(180deg,
                    rgba(255,200,150,0.10) 0%,
                    transparent 25%,
                    transparent 70%,
                    rgba(40,20,25,0.35) 100%)
                `,
                mixBlendMode: 'multiply',
              }}
            />
          );

          // ================= VIGNETTE =================
          const Vignette: React.FC = () => (
            <AbsoluteFill
              style={{
                background:
                  'radial-gradient(ellipse at center, transparent 42%, rgba(60,20,15,0.42) 100%)',
                pointerEvents: 'none',
                zIndex: 130,
              }}
            />
          );

          // ================= LETTERBOX =================
          const Letterbox: React.FC<{ size?: number }> = ({ size = 70 }) => (
            <>
              <div
                style={{
                  position: 'absolute',
                  top: 0,
                  left: 0,
                  right: 0,
                  height: size,
                  background: '#0A0606',
                  zIndex: 160,
                }}
              />
              <div
                style={{
                  position: 'absolute',
                  bottom: 0,
                  left: 0,
                  right: 0,
                  height: size,
                  background: '#0A0606',
                  zIndex: 160,
                }}
              />
            </>
          );

          // ================= MAIN COMPOSITION =================
          export const MindBlowingSkincare: React.FC = () => {
            // Durasi per shot (@30fps) — total 900 frame = 30 detik
            const D1 = 150; // 0-5s    Cinematic opening
            const D2 = 120; // 5-9s    3D orbit reveal
            const D3 = 105; // 9-12.5s Step 01
            const D4 = 105; // 12.5-16 Step 02
            const D5 = 105; // 16-19.5 Step 03
            const D6 = 90;  // 19.5-22.5 Bonus
            const D7 = 105; // 22.5-26 Before/After
            const D8 = 120; // 26-30   Premium CTA

            const S1 = 0;
            const S2 = S1 + D1;
            const S3 = S2 + D2;
            const S4 = S3 + D3;
            const S5 = S4 + D4;
            const S6 = S5 + D5;
            const S7 = S6 + D6;
            const S8 = S7 + D7;

            return (
              <AbsoluteFill style={{ backgroundColor: CREAM }}>
                <Sequence from={S1} durationInFrames={D1}>
                  <ShotOpening dur={D1} />
                </Sequence>
                <Sequence from={S2} durationInFrames={D2}>
                  <ShotOrbitReveal dur={D2} />
                </Sequence>
                <Sequence from={S3} durationInFrames={D3}>
                  <ShotStep1 dur={D3} />
                </Sequence>
                <Sequence from={S4} durationInFrames={D4}>
                  <ShotStep2 dur={D4} />
                </Sequence>
                <Sequence from={S5} durationInFrames={D5}>
                  <ShotStep3 dur={D5} />
                </Sequence>
                <Sequence from={S6} durationInFrames={D6}>
                  <ShotBonusToner dur={D6} />
                </Sequence>
                <Sequence from={S7} durationInFrames={D7}>
                  <ShotBeforeAfter dur={D7} />
                </Sequence>
                <Sequence from={S8} durationInFrames={D8}>
                  <ShotPremiumCTA dur={D8} />
                </Sequence>

                {/* Transisi sinematik */}
                <CinematicWhip start={S2 - 8} direction="right" />
                <CinematicWhip start={S3 - 8} direction="left" />
                <CinematicWhip start={S4 - 8} direction="right" />
                <CinematicWhip start={S5 - 8} direction="left" />
                <CinematicWhip start={S6 - 8} direction="right" />
                <CinematicWhip start={S7 - 8} direction="left" />
                <CinematicWhip start={S8 - 8} direction="right" />

                {/* Post-processing */}
                <ChromaticLayer intensity={0.8} />
                <Bloom intensity={0.2} />
                <ColorGrade />
                <Vignette />
                <FilmGrain />
                <Letterbox size={70} />
              </AbsoluteFill>
            );
          };
          EOF

      - name: Bundle
        run: npx remotion bundle src/index.ts --out-dir=out/bundle

      - name: Render video
        run: |
          npx remotion render \
            src/index.ts \
            MindBlowingSkincare \
            out/mindblowing-skincare.mp4 \
            --codec=h264 \
            --crf=15 \
            --concurrency=2 \
            --pixel-format=yuv420p

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindblowing-skincare-video
          path: out/mindblowing-skincare.mp4
          retention-days: 30
