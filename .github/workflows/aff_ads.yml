      - name: Install npm packages
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run build

      - name: Render 1080x1920 commercial
        run: |
          npx remotion render \
            src/index.tsx \
            PremiumSkincare \
            out/premium-skincare-skin-engineered.mp4 \
            --codec=h264 \
            --crf=15 \
            --concurrency=2 \
            --pixel-format=yuv420p

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: premium-skincare-skin-engineered
          path: out/premium-skincare-skin-engineered.mp4
          if-no-files-found: error
          retention-days: 7
