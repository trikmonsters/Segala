name: Manim Squirrel Icon Render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libcairo2-dev libpango1.0-dev ffmpeg freeglut3-dev xvfb

      - name: Install Manim
        run: pip install manim

      - name: Write scene code
        run: |
          cat > scene.py << 'PYEOF'
          from manim import *

          config.pixel_height = 1080
          config.pixel_width = 1080
          config.frame_height = 8.0
          config.frame_width = 8.0


          class IconSquirrel(Scene):
              def construct(self):
                  self.camera.background_color = "#ffffff"
                  stroke_color = "#1a1a1a"
                  stroke_width = 2
                  fill_color = "#1a1a1a"
                  fill_opacity = 0.05

                  base_pos = RIGHT * 0.8

                  # --- Ekor ---
                  tail_outer = Ellipse(width=3.8, height=6.0).move_to(LEFT * 1.5 + UP * 1.2).rotate(15 * DEGREES)
                  tail_inner = Ellipse(width=2.2, height=4.5).move_to(LEFT * 1.2 + UP * 0.8).rotate(15 * DEGREES)
                  tail_group = VGroup(tail_outer, tail_inner)

                  # --- Tubuh ---
                  body = RoundedRectangle(width=2.6, height=3.4, corner_radius=1.2).move_to(base_pos + DOWN * 0.5)

                  # --- Kepala ---
                  head = Ellipse(width=3.2, height=2.6).move_to(base_pos + UP * 1.4)

                  ear_l = RoundedRectangle(width=0.6, height=1.1, corner_radius=0.3).move_to(base_pos + UP * 2.6 + LEFT * 0.9).rotate(25 * DEGREES)
                  ear_r = RoundedRectangle(width=0.6, height=1.1, corner_radius=0.3).move_to(base_pos + UP * 2.6 + RIGHT * 0.9).rotate(-25 * DEGREES)

                  eye_l = Circle(radius=0.35).move_to(base_pos + UP * 1.6 + LEFT * 0.6)
                  eye_r = Circle(radius=0.35).move_to(base_pos + UP * 1.6 + RIGHT * 0.6)
                  pupil_l = Circle(radius=0.1).move_to(base_pos + UP * 1.65 + LEFT * 0.55)
                  pupil_r = Circle(radius=0.1).move_to(base_pos + UP * 1.65 + RIGHT * 0.55)

                  nose = Ellipse(width=0.6, height=0.35).move_to(base_pos + UP * 0.9)
                  mouth_l = ArcBetweenPoints(nose.get_bottom(), nose.get_bottom() + DOWN * 0.4 + LEFT * 0.6, angle=PI / 2.5)
                  mouth_r = ArcBetweenPoints(nose.get_bottom(), nose.get_bottom() + DOWN * 0.4 + RIGHT * 0.6, angle=-PI / 2.5)

                  head_group = VGroup(ear_l, ear_r, head, eye_l, eye_r, pupil_l, pupil_r, nose, mouth_l, mouth_r)

                  # --- Lengan & Kacang ---
                  acorn_nut = Ellipse(width=0.7, height=0.9).move_to(base_pos + DOWN * 0.4)
                  acorn_cap = ArcBetweenPoints(acorn_nut.get_left() + UP * 0.2, acorn_nut.get_right() + UP * 0.2, angle=PI).move_to(base_pos + DOWN * 0.1)

                  arm_l = RoundedRectangle(width=1.4, height=0.5, corner_radius=0.25).move_to(base_pos + DOWN * 0.2 + LEFT * 0.9).rotate(30 * DEGREES)
                  arm_r = RoundedRectangle(width=1.4, height=0.5, corner_radius=0.25).move_to(base_pos + DOWN * 0.2 + RIGHT * 0.9).rotate(-30 * DEGREES)

                  center_group = VGroup(arm_l, arm_r, acorn_nut, acorn_cap)

                  # --- Kaki ---
                  leg_l = Ellipse(width=1.1, height=1.6).move_to(base_pos + DOWN * 1.8 + LEFT * 1.0).rotate(25 * DEGREES)
                  leg_r = Ellipse(width=1.1, height=1.6).move_to(base_pos + DOWN * 1.8 + RIGHT * 1.0).rotate(-25 * DEGREES)
                  foot_l = RoundedRectangle(width=1.1, height=0.4, corner_radius=0.2).move_to(base_pos + DOWN * 2.5 + LEFT * 0.9)
                  foot_r = RoundedRectangle(width=1.1, height=0.4, corner_radius=0.2).move_to(base_pos + DOWN * 2.5 + RIGHT * 0.9)

                  leg_group = VGroup(leg_l, leg_r, foot_l, foot_r)

                  # --- Dahan ---
                  branch_main = Line(LEFT * 4.5, RIGHT * 4.5).move_to(DOWN * 2.7)
                  branch_detail = Line(LEFT * 3.0, RIGHT * 1.0).move_to(DOWN * 2.9)
                  branch_group = VGroup(branch_main, branch_detail)

                  # --- Grouping & Styling ---
                  squirrel = VGroup(tail_group, body, head_group, leg_group, center_group)
                  full_icon = VGroup(squirrel, branch_group)

                  full_icon.set_color(stroke_color)
                  full_icon.set_stroke(width=stroke_width)

                  full_icon.move_to(ORIGIN)
                  full_icon.scale(0.85)

                  # --- Fill Layer ---
                  shapes_to_fill = VGroup(
                      tail_outer, tail_inner, body, head, ear_l, ear_r,
                      eye_l, eye_r, nose, acorn_nut, arm_l, arm_r, leg_l, leg_r, foot_l, foot_r
                  ).copy()

                  shapes_to_fill.set_stroke(width=0)
                  shapes_to_fill.set_fill(color=fill_color, opacity=fill_opacity)

                  # --- Animasi ---
                  self.play(
                      LaggedStart(
                          Create(branch_group),
                          Create(tail_group),
                          Create(body),
                          Create(leg_group),
                          Create(head_group),
                          Create(center_group),
                          lag_ratio=0.15
                      ),
                      run_time=3.5,
                      rate_func=smooth
                  )

                  self.wait(0.2)

                  self.play(FadeIn(shapes_to_fill), run_time=2.0)

                  self.wait(2)
          PYEOF

      - name: Validate Python syntax
        run: |
          python -m py_compile scene.py
          echo "Syntax OK"

      - name: Render with Manim
        run: |
          xvfb-run -a manim -qh --disable_caching scene.py IconSquirrel

      - name: Find and rename output
        run: |
          mkdir -p output
          FOUND=$(find media/videos -name "*.mp4" | head -1)
          if [ -z "$FOUND" ]; then
            echo "ERROR: Tidak ada MP4 yang dihasilkan"
            exit 1
          fi
          mv "$FOUND" output/squirrel.mp4
          ls -lh output/

      - name: Create Release and Upload MP4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: squirrel-${{ github.run_number }}
          name: "Squirrel Icon ${{ github.run_number }}"
          body: |
            Render Manim IconSquirrel
            Run: #${{ github.run_number }}
          files: output/squirrel.mp4
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
