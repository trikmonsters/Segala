name: Manim Squirrel Smooth Render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libcairo2-dev libpango1.0-dev ffmpeg freeglut3-dev xvfb

      - name: Install Python packages
        run: pip install manim shapely

      - name: Write scene code
        run: |
          cat > scene.py << 'PYEOF'
          from manim import *
          from shapely.geometry import Polygon as SPolygon
          from shapely.ops import unary_union
          import numpy as np

          config.pixel_height = 1080
          config.pixel_width = 1080
          config.frame_height = 8.0
          config.frame_width = 8.0


          def shapely_to_vmobject(geom, stroke_color="#1a1a1a",
                                  stroke_width=2.5,
                                  fill_color="#1a1a1a",
                                  fill_opacity=1.0):
              """
              Konversi shapely Polygon/MultiPolygon ke VMobject Manim.
              Pakai set_points_smoothly untuk kurva halus.
              """
              mob = VMobject()
              mob.set_stroke(color=stroke_color, width=stroke_width)
              mob.set_fill(color=fill_color, opacity=fill_opacity)

              polygons = []
              if geom.geom_type == "Polygon":
                  polygons = [geom]
              elif geom.geom_type == "MultiPolygon":
                  polygons = list(geom.geoms)

              all_points = []
              for poly in polygons:
                  exterior = list(poly.exterior.coords)
                  # Sampel ulang jadi lebih padat untuk smoothing
                  arr = np.array([[p[0], p[1], 0.0] for p in exterior])
                  all_points.append(arr)

              if all_points:
                  combined = np.vstack(all_points)
                  # set_points_smoothly untuk kurva halus
                  mob.set_points_smoothly(combined)

              return mob


          def make_poly(points):
              return SPolygon(points)


          # ============================================================
          # Titik-titik polygon halus (banyak titik untuk kurva natural)
          # ============================================================

          # --- Ekor: kurva S besar di kiri ---
          TAIL = [
              (-1.0, 1.5), (-1.3, 2.0), (-1.7, 2.5), (-2.2, 2.9),
              (-2.8, 3.1), (-3.4, 3.0), (-3.9, 2.6), (-4.1, 2.0),
              (-4.2, 1.3), (-4.1, 0.5), (-3.9, -0.3), (-3.6, -1.0),
              (-3.1, -1.6), (-2.5, -2.0), (-1.8, -2.2), (-1.2, -2.0),
              (-0.8, -1.5), (-0.7, -0.9), (-0.8, -0.2), (-1.0, 0.5),
              (-1.1, 1.0),
          ]

          # --- Badan: oval besar ---
          BODY = [
              (-0.9, 1.6), (-0.4, 1.9), (0.3, 2.0), (0.9, 1.8),
              (1.3, 1.3), (1.5, 0.6), (1.5, -0.2), (1.3, -1.0),
              (1.0, -1.7), (0.5, -2.2), (-0.2, -2.3), (-0.9, -2.1),
              (-1.4, -1.6), (-1.6, -0.9), (-1.6, -0.1), (-1.4, 0.7),
              (-1.2, 1.3),
          ]

          # --- Kepala: oval ---
          HEAD = [
              (-0.9, 2.4), (-0.5, 2.8), (0.1, 3.0), (0.7, 2.9),
              (1.2, 2.5), (1.4, 2.0), (1.3, 1.5), (0.9, 1.2),
              (0.3, 1.1), (-0.3, 1.2), (-0.7, 1.6), (-0.9, 2.0),
          ]

          # --- Telinga kiri: segitiga membulat ---
          EAR_L = [
              (-1.0, 2.6), (-1.3, 3.1), (-1.4, 3.5), (-1.2, 3.7),
              (-0.9, 3.5), (-0.7, 3.0), (-0.7, 2.6),
          ]

          # --- Telinga kanan ---
          EAR_R = [
              (0.2, 2.9), (0.3, 3.4), (0.6, 3.7), (0.9, 3.6),
              (1.0, 3.2), (0.9, 2.7), (0.6, 2.5),
          ]

          # --- Kaki kiri ---
          LEG_L = [
              (-0.9, -1.5), (-1.3, -1.8), (-1.5, -2.3), (-1.3, -2.7),
              (-0.9, -2.9), (-0.4, -2.8), (-0.2, -2.4), (-0.3, -1.9),
              (-0.6, -1.5),
          ]

          # --- Kaki kanan ---
          LEG_R = [
              (0.3, -1.7), (0.1, -2.1), (0.2, -2.6), (0.5, -2.9),
              (0.9, -2.9), (1.2, -2.6), (1.2, -2.1), (0.9, -1.7),
              (0.6, -1.5),
          ]

          # --- Lengan kiri ---
          ARM_L = [
              (-0.8, 0.7), (-1.1, 0.4), (-1.2, 0.0), (-1.0, -0.4),
              (-0.6, -0.5), (-0.3, -0.2), (-0.2, 0.3), (-0.4, 0.7),
          ]

          # --- Lengan kanan ---
          ARM_R = [
              (0.4, 0.7), (0.7, 0.5), (0.9, 0.1), (0.8, -0.3),
              (0.4, -0.5), (0.1, -0.3), (0.0, 0.2), (0.1, 0.6),
          ]


          class SquirrelSmooth(Scene):
              def construct(self):
                  self.camera.background_color = "#F5F5F7"

                  STROKE = "#1a1a1a"
                  FILL = "#1a1a1a"
                  WHITE = "#FFFFFF"

                  # ------------------------------------------------------------
                  # 1. Union siluet utama
                  # ------------------------------------------------------------
                  parts = [
                      make_poly(TAIL),
                      make_poly(BODY),
                      make_poly(HEAD),
                      make_poly(EAR_L),
                      make_poly(EAR_R),
                      make_poly(LEG_L),
                      make_poly(LEG_R),
                      make_poly(ARM_L),
                      make_poly(ARM_R),
                  ]
                  merged = unary_union(parts)
                  print(f"Merged: {merged.geom_type}")

                  silhouette = shapely_to_vmobject(
                      merged,
                      stroke_color=STROKE,
                      stroke_width=2.5,
                      fill_color=FILL,
                      fill_opacity=1.0,
                  )
                  silhouette.move_to(ORIGIN)
                  silhouette.scale(0.9)

                  # ------------------------------------------------------------
                  # 2. Detail di atas siluet (tidak di-union)
                  # ------------------------------------------------------------
                  # Mata putih
                  eye_l = Circle(radius=0.28, stroke_width=2.5,
                                 stroke_color=STROKE,
                                 fill_color=WHITE, fill_opacity=1.0)
                  eye_l.move_to(np.array([-0.35, 2.1, 0]))

                  eye_r = Circle(radius=0.28, stroke_width=2.5,
                                 stroke_color=STROKE,
                                 fill_color=WHITE, fill_opacity=1.0)
                  eye_r.move_to(np.array([0.45, 2.1, 0]))

                  # Pupil
                  pupil_l = Circle(radius=0.11, stroke_width=0,
                                   fill_color=STROKE, fill_opacity=1.0)
                  pupil_l.move_to(np.array([-0.32, 2.15, 0]))

                  pupil_r = Circle(radius=0.11, stroke_width=0,
                                   fill_color=STROKE, fill_opacity=1.0)
                  pupil_r.move_to(np.array([0.48, 2.15, 0]))

                  # Hidung
                  nose = Ellipse(width=0.32, height=0.20,
                                 stroke_width=2.0,
                                 stroke_color=STROKE,
                                 fill_color=STROKE, fill_opacity=1.0)
                  nose.move_to(np.array([0.05, 1.55, 0]))

                  # Mulut (dua arc)
                  mouth_l = ArcBetweenPoints(
                      np.array([0.05, 1.45, 0]),
                      np.array([-0.25, 1.15, 0]),
                      angle=PI / 3,
                      stroke_color=STROKE,
                      stroke_width=2.0,
                  )
                  mouth_r = ArcBetweenPoints(
                      np.array([0.05, 1.45, 0]),
                      np.array([0.35, 1.15, 0]),
                      angle=-PI / 3,
                      stroke_color=STROKE,
                      stroke_width=2.0,
                  )

                  # Kacang (di depan badan, di bawah mulut)
                  acorn_nut = Ellipse(width=0.55, height=0.75,
                                      stroke_width=2.5,
                                      stroke_color=STROKE,
                                      fill_color="#C9A66B",
                                      fill_opacity=1.0)
                  acorn_nut.move_to(np.array([0.05, 0.55, 0]))

                  acorn_cap = ArcBetweenPoints(
                      np.array([-0.28, 0.85, 0]),
                      np.array([0.38, 0.85, 0]),
                      angle=PI,
                      stroke_color=STROKE,
                      stroke_width=2.5,
                  )
                  acorn_cap.set_fill(STROKE, opacity=1.0)

                  # ------------------------------------------------------------
                  # 3. Z-order: siluet di belakang, detail di depan
                  # ------------------------------------------------------------
                  silhouette.set_z_index(0)
                  for d in [eye_l, eye_r, pupil_l, pupil_r,
                            nose, mouth_l, mouth_r,
                            acorn_nut, acorn_cap]:
                      d.set_z_index(1)

                  details = VGroup(
                      eye_l, eye_r, pupil_l, pupil_r,
                      nose, mouth_l, mouth_r,
                      acorn_nut, acorn_cap,
                  )

                  # ------------------------------------------------------------
                  # 4. Animasi
                  # ------------------------------------------------------------
                  self.play(
                      DrawBorderThenFill(silhouette),
                      run_time=3.5,
                      rate_func=smooth,
                  )
                  self.play(
                      FadeIn(details, shift=UP * 0.2),
                      run_time=1.5,
                      rate_func=smooth,
                  )
                  self.wait(2)
          PYEOF

      - name: Validate Python syntax
        run: |
          python -m py_compile scene.py
          echo "Syntax OK"

      - name: Render with Manim
        run: |
          xvfb-run -a manim -qh --disable_caching scene.py SquirrelSmooth

      - name: Find and rename output
        run: |
          mkdir -p output
          FOUND=$(find media/videos -name "*.mp4" | head -1)
          if [ -z "$FOUND" ]; then
            echo "ERROR: Tidak ada MP4 yang dihasilkan"
            exit 1
          fi
          mv "$FOUND" output/squirrel-smooth.mp4
          ls -lh output/

      - name: Create Release and Upload MP4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: squirrel-smooth-${{ github.run_number }}
          name: "Squirrel Smooth ${{ github.run_number }}"
          body: |
            Render Manim Squirrel smooth silhouette + detail
            Run: #${{ github.run_number }}
          files: output/squirrel-smooth.mp4
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
