name: Manim Squirrel Union Render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libcairo2-dev libpango1.0-dev ffmpeg freeglut3-dev xvfb

      - name: Install Python packages
        run: pip install manim shapely

      - name: Write scene code
        run: |
          cat > scene.py << 'PYEOF'
          from manim import *
          from shapely.geometry import Polygon as SPolygon
          from shapely.ops import unary_union
          import numpy as np

          config.pixel_height = 1080
          config.pixel_width = 1080
          config.frame_height = 8.0
          config.frame_width = 8.0


          # ============================================================
          # Helper: konversi shapely geometry -> Manim VMobject
          # ============================================================
          def shapely_to_vmobject(geom, stroke_color="#1a1a1a",
                                  stroke_width=2.5,
                                  fill_color="#1a1a1a",
                                  fill_opacity=1.0):
              """
              Konversi shapely Polygon / MultiPolygon ke VMobject Manim.
              Mendukung polygon dengan holes (interior rings).
              """
              mob = VMobject()
              mob.set_stroke(color=stroke_color, width=stroke_width)
              mob.set_fill(color=fill_color, opacity=fill_opacity)

              polygons = []
              if geom.geom_type == "Polygon":
                  polygons = [geom]
              elif geom.geom_type == "MultiPolygon":
                  polygons = list(geom.geoms)
              else:
                  raise ValueError(f"Unsupported geometry: {geom.geom_type}")

              all_points = []
              for poly in polygons:
                  # Exterior ring
                  exterior = list(poly.exterior.coords)
                  # Konversi ke array numpy [x, y, 0]
                  arr = np.array([[p[0], p[1], 0.0] for p in exterior])
                  all_points.append(arr)

                  # Interior rings (holes) - opsional, tapi kita skip dulu
                  # untuk kesederhanaan

              # Gabung semua titik jadi satu path
              if all_points:
                  combined = np.vstack(all_points)
                  mob.set_points_as_corners(combined)

              return mob


          # ============================================================
          # Helper: buat shapely Polygon dari titik-titik Manim
          # ============================================================
          def make_poly(points):
              """points: list of (x, y) tuples"""
              return SPolygon(points)


          class SquirrelUnion(Scene):
              def construct(self):
                  self.camera.background_color = "#F5F5F7"

                  STROKE = "#1a1a1a"
                  FILL = "#1a1a1a"
                  ACCENT = "#FFFFFF"

                  # ------------------------------------------------------------
                  # 1. Definisikan bagian-bagian tupai sebagai shapely Polygon
                  #    Semua koordinat dalam sistem Manim (origin di tengah).
                  #    Shapely butuh polygon yang valid (tidak self-intersect),
                  #    jadi kita buat tiap bagian sebagai polygon terpisah,
                  #    lalu union semua.
                  # ------------------------------------------------------------

                  # --- Ekor besar (polygon melengkung) ---
                  tail = make_poly([
                      (-2.8, 2.8), (-3.6, 2.0), (-3.9, 0.8), (-3.7, -0.6),
                      (-3.0, -1.8), (-2.0, -2.4), (-1.2, -2.2), (-1.0, -1.2),
                      (-1.4, 0.2), (-1.8, 1.4), (-2.3, 2.3),
                  ])

                  # --- Badan ---
                  body = make_poly([
                      (-1.2, 1.6), (0.6, 1.8), (1.4, 1.2), (1.6, 0.0),
                      (1.4, -1.4), (0.8, -2.2), (-0.4, -2.4), (-1.4, -1.8),
                      (-1.6, -0.4), (-1.4, 1.0),
                  ])

                  # --- Kepala ---
                  head = make_poly([
                      (-1.2, 2.4), (-0.2, 2.9), (0.9, 2.8), (1.6, 2.2),
                      (1.8, 1.6), (1.4, 1.2), (-0.4, 1.2), (-1.2, 1.6),
                  ])

                  # --- Telinga kiri ---
                  ear_l = make_poly([
                      (-1.3, 2.5), (-1.7, 3.2), (-1.4, 3.6), (-1.0, 3.3),
                      (-0.9, 2.7),
                  ])

                  # --- Telinga kanan ---
                  ear_r = make_poly([
                      (0.4, 2.9), (0.6, 3.6), (1.0, 3.8), (1.3, 3.4),
                      (1.1, 2.8),
                  ])

                  # --- Kaki kiri ---
                  leg_l = make_poly([
                      (-1.2, -1.4), (-1.8, -1.6), (-2.0, -2.4), (-1.6, -2.8),
                      (-0.8, -2.8), (-0.6, -2.0),
                  ])

                  # --- Kaki kanan ---
                  leg_r = make_poly([
                      (0.4, -1.6), (1.0, -1.8), (1.4, -2.4), (1.0, -2.8),
                      (0.2, -2.8), (0.0, -2.0),
                  ])

                  # --- Lengan kiri (memegang kacang) ---
                  arm_l = make_poly([
                      (-1.2, 0.6), (-1.6, 0.2), (-1.4, -0.4), (-0.8, -0.4),
                      (-0.4, 0.2), (-0.6, 0.6),
                  ])

                  # --- Lengan kanan ---
                  arm_r = make_poly([
                      (0.4, 0.6), (0.8, 0.4), (1.0, -0.2), (0.6, -0.6),
                      (0.0, -0.4), (-0.2, 0.2),
                  ])

                  # --- Kacang (di tengah, di depan badan) ---
                  acorn = make_poly([
                      (-0.4, -0.6), (-0.6, -1.0), (-0.4, -1.4), (0.0, -1.5),
                      (0.4, -1.3), (0.5, -0.9), (0.3, -0.6),
                  ])

                  # ------------------------------------------------------------
                  # 2. Union semua polygon jadi satu geometry
                  # ------------------------------------------------------------
                  parts = [tail, body, head, ear_l, ear_r,
                           leg_l, leg_r, arm_l, arm_r, acorn]
                  merged = unary_union(parts)

                  print(f"Merged geometry type: {merged.geom_type}")
                  print(f"Number of polygons: {len(merged.geoms) if merged.geom_type == 'MultiPolygon' else 1}")

                  # ------------------------------------------------------------
                  # 3. Konversi ke VMobject Manim
                  # ------------------------------------------------------------
                  squirrel = shapely_to_vmobject(
                      merged,
                      stroke_color=STROKE,
                      stroke_width=2.5,
                      fill_color=FILL,
                      fill_opacity=1.0,
                  )

                  squirrel.move_to(ORIGIN)
                  squirrel.scale(0.9)

                  # ------------------------------------------------------------
                  # 4. Animasi
                  # ------------------------------------------------------------
                  self.play(
                      DrawBorderThenFill(squirrel),
                      run_time=4.0,
                      rate_func=smooth,
                  )

                  self.wait(2)
          PYEOF

      - name: Validate Python syntax
        run: |
          python -m py_compile scene.py
          echo "Syntax OK"

      - name: Render with Manim
        run: |
          xvfb-run -a manim -qh --disable_caching scene.py SquirrelUnion

      - name: Find and rename output
        run: |
          mkdir -p output
          FOUND=$(find media/videos -name "*.mp4" | head -1)
          if [ -z "$FOUND" ]; then
            echo "ERROR: Tidak ada MP4 yang dihasilkan"
            exit 1
          fi
          mv "$FOUND" output/squirrel-union.mp4
          ls -lh output/

      - name: Create Release and Upload MP4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: squirrel-union-${{ github.run_number }}
          name: "Squirrel Union ${{ github.run_number }}"
          body: |
            Render Manim Squirrel dengan pendekatan union path
            Run: #${{ github.run_number }}
          files: output/squirrel-union.mp4
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
