name: Manim Render (Manual Input)

on:
  workflow_dispatch:
    inputs:
      scene_code:
        description: 'Tempel kode Manim lengkap di sini (dari "from manim import *" sampai akhir)'
        required: true
        type: string
      scene_class:
        description: 'Nama class Scene yang mau dirender'
        required: true
        default: 'IconKeyScene'
        type: string
      quality:
        description: 'Kualitas render'
        required: true
        default: 'qh'
        type: choice
        options:
          - ql
          - qm
          - qh
          - qk
      output_name:
        description: 'Nama file output (tanpa .mp4)'
        required: true
        default: 'render'
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libcairo2-dev libpango1.0-dev ffmpeg freeglut3-dev xvfb

      - name: Install Manim
        run: pip install manim

      - name: Write scene code from input
        env:
          SCENE_CODE: ${{ inputs.scene_code }}
        run: |
          printf '%s\n' "$SCENE_CODE" > scene.py
          echo "=== Preview 20 baris pertama ==="
          head -20 scene.py
          echo "=== Total baris ==="
          wc -l scene.py

      - name: Validate Python syntax
        run: |
          python -m py_compile scene.py
          echo "Syntax OK"

      - name: Render with Manim
        env:
          SCENE_CLASS: ${{ inputs.scene_class }}
          QUALITY: ${{ inputs.quality }}
        run: |
          xvfb-run -a manim -$QUALITY --disable_caching scene.py "$SCENE_CLASS"

      - name: Find and rename output
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          mkdir -p output
          FOUND=$(find media/videos -name "*.mp4" | head -1)
          if [ -z "$FOUND" ]; then
            echo "ERROR: Tidak ada MP4 yang dihasilkan"
            exit 1
          fi
          mv "$FOUND" "output/${OUTPUT_NAME}.mp4"
          echo "Output: output/${OUTPUT_NAME}.mp4"
          ls -lh output/

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: manim-${{ inputs.output_name }}
          path: output/*.mp4
          retention-days: 7
