name: Process Video with Whisper & Gemini API

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL Video (RedNote / YouTube)'
        required: true
        type: string

jobs:
  process-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg Binary
        run: |
          mkdir -p ~/.local/bin
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ --strip-components=1 -C ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install yt-dlp Binary
        run: |
          mkdir -p ~/.local/bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/.local/bin/yt-dlp
          chmod +x ~/.local/bin/yt-dlp
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install demucs faster-whisper

      - name: Download Video with yt-dlp
        run: |
          mkdir -p downloads
          yt-dlp -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
                 --merge-output-format mp4 \
                 -o "downloads/input_video.mp4" \
                 "${{ inputs.url }}"

      - name: Extract Vocals using Demucs
        run: |
          demucs --two-stems=vocals downloads/input_video.mp4 -o separated/

      - name: Transcribe Vocals to Chinese SRT (Faster-Whisper)
        run: |
          cat << 'EOF' > transcribe.py
          from faster_whisper import WhisperModel
          import os

          vocal_path = "separated/htdemucs/input_video/vocals.wav"
          model = WhisperModel("medium", device="cpu", compute_type="int8")

          segments, info = model.transcribe(
              vocal_path,
              language="zh",
              vad_filter=True,
              vad_parameters=dict(min_silence_duration_ms=500)
          )

          def format_time(seconds):
              hrs = int(seconds // 3600)
              mins = int((seconds % 3600) // 60)
              secs = int(seconds % 60)
              msecs = int((seconds - int(seconds)) * 1000)
              return f"{hrs:02d}:{mins:02d}:{secs:02d},{msecs:03d}"

          os.makedirs("downloads", exist_ok=True)
          with open("downloads/subtitle_zh.srt", "w", encoding="utf-8") as f:
              for i, segment in enumerate(segments, start=1):
                  start = format_time(segment.start)
                  end = format_time(segment.end)
                  f.write(f"{i}\n{start} --> {end}\n{segment.text.strip()}\n\n")
          print("Transkripsi bahasa Tionghoa selesai!")
          EOF
          python transcribe.py

      - name: Translate SRT to English via AI Studio API (curl)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e -E

          # Pastikan file subtitle ada
          if [ ! -f "downloads/subtitle_zh.srt" ]; then
            echo "File downloads/subtitle_zh.srt tidak ditemukan!"
            exit 1
          fi

          # Buat file skrip Python sederhana untuk menyiapkan prompt JSON secara aman (escaped characters)
          python3 -c '
          import json

          with open("downloads/subtitle_zh.srt", "r", encoding="utf-8") as f:
              zh_srt_content = f.read()

          prompt = f"""You are a professional translator. Below is an SRT subtitle file in Chinese. 
          Translate all Chinese subtitle lines into clear and natural English.
          CRITICAL REQUIREMENTS:
          1. Maintain the EXACT SAME SRT format, sequence numbers, and timestamps.
          2. DO NOT alter, skip, or merge any timestamp lines (e.g., 00:00:01,000 --> 00:00:04,000).
          3. Output ONLY the translated SRT text without any markdown code blocks or explanations.

          Chinese SRT Content:
          {zh_srt_content}"""

          payload = {
              "model": "models/gemini-3.6-flash",
              "input": prompt,
              "generation_config": {
                  "max_output_tokens": 65536
              }
          }

          with open("request.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          '

          # Eksekusi cURL seperti instruksi AI Studio
          curl -s -S \
            -X POST \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/interactions?key=${GEMINI_API_KEY}" \
            -d '@request.json' > response.json

          # Ekstrak hasil teks terjemahan dari respons JSON
          python3 -c '
          import json, re

          with open("response.json", "r", encoding="utf-8") as f:
              res = json.load(f)

          # Mengambil teks dari respons endpoint interactions
          try:
              translated_text = ""
              if "outputs" in res and len(res["outputs"]) > 0:
                  translated_text = res["outputs"][-1].get("text", "")
              elif "candidates" in res:
                  translated_text = res["candidates"][0]["content"]["parts"][0]["text"]
              else:
                  print("Full Response Error:", res)
                  raise ValueError("Format respons tidak dikenali")

              # Bersihkan pembungkus markdown jika ada
              translated_text = translated_text.strip()
              if translated_text.startswith("```"):
                  lines = translated_text.split("\n")
                  translated_text = "\n".join(lines[1:-1])

              with open("downloads/subtitle_en.srt", "w", encoding="utf-8") as f:
                  f.write(translated_text)
              print("Berhasil menerjemahkan subtitle ke English via cURL AI Studio!")
          except Exception as e:
              print(f"Error parsing response: {e}")
              exit(1)
          '

      - name: Upload Video & Subtitles as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-video-package
          path: |
            downloads/input_video.mp4
            downloads/subtitle_zh.srt
            downloads/subtitle_en.srt
          retention-days: 7
