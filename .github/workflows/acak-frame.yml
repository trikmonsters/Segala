name: Resequence Fashion Shoes Showcase Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL Video YouTube Shorts Review Produk'
        default: 'https://youtube.com/shorts/VORoFc_x_Ls'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download-and-edit-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg Binary
        run: |
          mkdir -p ~/.local/bin
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ --strip-components=1 -C ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade pip
          pip install yt-dlp

      - name: Create Downloads Cookie File
        env:
          COOKIES_TEXT: ${{ secrets.COOKIE }}
        run: |
          mkdir -p downloads
          echo "$COOKIES_TEXT" > ./cookies.txt

      - name: Download Video via yt-dlp
        run: |
          set -e
          yt-dlp --cookies ./cookies.txt \
                 --remote-components ejs:github \
                 -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
                 --merge-output-format mp4 \
                 -o "video_raw.mp4" \
                 "${{ github.event.inputs.video_url }}"

      - name: Resequence Video with FFmpeg
        run: |
          ffmpeg -i video_raw.mp4 -filter_complex \
          "[0:v]trim=start=18:end=20.5,setpts=PTS-STARTPTS[v1]; [0:a]atrim=start=18:end=20.5,asetpts=PTS-STARTPTS[a1]; \
           [0:v]trim=start=3:end=7,setpts=PTS-STARTPTS[v2]; [0:a]atrim=start=3:end=7,asetpts=PTS-STARTPTS[a2]; \
           [0:v]trim=start=7:end=9.5,setpts=PTS-STARTPTS[v3]; [0:a]atrim=start=7:end=9.5,asetpts=PTS-STARTPTS[a3]; \
           [0:v]trim=start=0:end=3,setpts=PTS-STARTPTS[v4]; [0:a]atrim=start=0:end=3,asetpts=PTS-STARTPTS[a4]; \
           [0:v]trim=start=9.5:end=18,setpts=PTS-STARTPTS[v5]; [0:a]atrim=start=9.5:end=18,asetpts=PTS-STARTPTS[a5]; \
           [0:v]trim=start=18:end=27,setpts=PTS-STARTPTS[v6]; [0:a]atrim=start=18:end=27,asetpts=PTS-STARTPTS[a6]; \
           [v1][a1][v2][a2][v3][a3][v4][a4][v5][a5][v6][a6]concat=n=6:v=1:a=1[vconcat][aconcat]; \
           [vconcat]minterpolate=fps=30:mi_mode=mci:mc_mode=aobmc:me_mode=bidir[v]" \
          -map "[v]" -map "[aconcat]" video_resequenced.mp4

      - name: Upload Processed Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resequenced-fashion-video
          path: video_resequenced.mp4
          retention-days: 1
