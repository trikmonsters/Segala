name: Advanced Video Resequencing (Unique Content Transformation)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL Video YouTube Shorts'
        default: 'https://youtube.com/shorts/VORoFc_x_Ls'
        required: true
        type: string

permissions:
  contents: write

jobs:
  transform-and-edit-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg Binary
        run: |
          mkdir -p ~/.local/bin
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ --strip-components=1 -C ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade pip
          pip install yt-dlp

      - name: Create Downloads Cookie File
        env:
          COOKIES_TEXT: ${{ secrets.COOKIE }}
        run: |
          mkdir -p downloads
          echo "$COOKIES_TEXT" > ./cookies.txt

      - name: Download Video via yt-dlp
        run: |
          set -e
          yt-dlp --cookies ./cookies.txt \
                 --remote-components ejs:github \
                 -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
                 --merge-output-format mp4 \
                 -o "video_raw.mp4" \
                 "${{ github.event.inputs.video_url }}"

      - name: Execute Robust FFmpeg Transformation
        run: |
          ffmpeg -y -i video_raw.mp4 -filter_complex \
          "[0:v]trim=start=9.5:end=12,setpts=0.9*PTS-STARTPTS,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,format=yuv420p[v1]; \
           [0:v]trim=start=5:end=7,setpts=1.15*PTS-STARTPTS,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,format=yuv420p[v2]; \
           [0:v]trim=start=22:end=26,setpts=PTS-STARTPTS,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,format=yuv420p[v3]; \
           [0:v]trim=start=7:end=9.5,setpts=0.9*PTS-STARTPTS,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,format=yuv420p[v4]; \
           [0:v]trim=start=3:end=5,setpts=PTS-STARTPTS,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,format=yuv420p[v5]; \
           [0:v]trim=start=18:end=22,setpts=1.1*PTS-STARTPTS,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,format=yuv420p[v6]; \
           [v1][v2][v3][v4][v5][v6]concat=n=6:v=1:a=0[v]" \
          -map "[v]" \
          -c:v libx264 \
          -preset fast \
          -crf 20 \
          -pix_fmt yuv420p \
          -movflags +faststart \
          video_unique_transformed.mp4

      - name: Upload Processed Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unique-transformed-video
          path: video_unique_transformed.mp4
          retention-days: 1
