name: Auto Viral Video (Script -> Voice Clone -> Align -> Burn Subtitle)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topik/brief untuk narasi (dipakai Gemini kalau manual_narration_text kosong)"
        required: false
        type: string
        default: "Ucapkan selamat pagi singkat dan sambutan hangat untuk video test 15 detik."
      manual_narration_text:
        description: "Isi manual kalau mau skip Gemini (kosongkan untuk auto-generate)"
        required: false
        type: string
        default: ""
      gemini_model:
        description: "Model id Gemini (REST generateContent)"
        required: true
        type: string
        default: "gemini-3.5-flash-lite"
      max_words:
        description: "Batas kata narasi (jaga durasi ~15s)"
        required: true
        type: string
        default: "40"
      language:
        description: "Bahasa TTS (target US -> English)"
        required: true
        type: choice
        default: "English"
        options:
          - "English"
          - "Auto"
          - "Chinese"
          - "French"
          - "German"
          - "Spanish"
      ref_audio_path:
        description: "Path file suara referensi di repo ini (commit dulu sebelum run)"
        required: true
        type: string
        default: "MyVoice.wav"
      ref_text:
        description: "Transkrip persis audio referensi suara (kosongkan untuk mode x-vector-only)"
        required: false
        type: string
        default: "I'm at my 10-year college reunion today, but the emotion I feel is not what I expected. I really thought I would enjoy reminiscing and seeing all the old spots, whether it was a significant memory or something more mundane. But the emotion I feel is a little bit more complex. The nostalgia is more like grief—grief over how fast time seems to go by. I cannot believe it's been 10 years, but I think it's good to feel like this every once in a while because it reminds us to savor the present moment. But I don't know if that'll make us feel any different when we look back 10 years from today; at least we'll know that we paid attention."
      model_size:
        description: "Ukuran model TTS (0.6B jauh lebih cepat di CPU)"
        required: true
        type: choice
        default: "0.6B"
        options:
          - "0.6B"
          - "1.7B"
      quant:
        description: "Kuantisasi GGUF TTS (BF16 = kualitas terbaik, paling lambat di CPU)"
        required: true
        type: choice
        default: "BF16"
        options:
          - "BF16"
          - "Q8_0"
          - "Q4_K_M"
      alignment_model:
        description: "NeMo model untuk word-level alignment"
        required: false
        default: "stt_en_fastconformer_hybrid_large_pc"
      video_path:
        description: "Path video di repo (root) yang mau dikasih audio+subtitle"
        required: true
        default: "subtitle.mp4"
      max_speed_factor:
        description: "Batas maksimal kecepatan saat men-speed-up sebagian video (mis. 1.5 = maksimal 1.5x)"
        required: true
        type: string
        default: "1.5"
      duration_tolerance_seconds:
        description: "Kalau audio cuma lebih pendek dari video sebesar ini (detik) atau kurang, video dibiarkan full apa adanya (tidak di-speed-up/crop)"
        required: true
        type: string
        default: "3"
      output_video_name:
        description: "Nama file video hasil akhir"
        required: false
        default: "output.mp4"

jobs:
  # ---------------------------------------------------------------------
  # JOB 1: generate narration script (Gemini) or use manual text
  # ---------------------------------------------------------------------
  generate-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Use manual narration text (skip Gemini)
        if: ${{ inputs.manual_narration_text != '' }}
        env:
          MANUAL_TEXT: ${{ inputs.manual_narration_text }}
        run: |
          mkdir -p work
          printf '%s' "$MANUAL_TEXT" > work/script.txt
          echo "Pakai teks manual:"
          cat work/script.txt

      - name: Generate narration via Gemini API
        if: ${{ inputs.manual_narration_text == '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.gemini_model }}
          TOPIC: ${{ inputs.topic }}
          MAX_WORDS: ${{ inputs.max_words }}
          NARRATION_LANGUAGE: ${{ inputs.language }}
        run: |
          mkdir -p work
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Secret GEMINI_API_KEY belum di-set di repo settings."
            exit 1
          fi
          PROMPT="Write a short spoken-style narration script about: ${TOPIC}. \
          Write it strictly in ${NARRATION_LANGUAGE}, targeted at a US audience \
          (natural American phrasing, no other language mixed in). \
          Hard limit: under ${MAX_WORDS} words. Plain sentences only, no markdown, \
          no emojis, no headers, no quotation marks, just the narration text itself, \
          ready to be read aloud by a text-to-speech voice."

          jq -n --arg prompt "$PROMPT" \
            '{contents:[{parts:[{text:$prompt}]}]}' > work/gemini_request.json

          curl -sS -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @work/gemini_request.json \
            -o work/gemini_response.json

          if ! jq -e '.candidates[0].content.parts[0].text' work/gemini_response.json > /dev/null 2>&1; then
            echo "::error::Gemini response tidak berisi teks yang diharapkan. Isi respons:"
            cat work/gemini_response.json
            exit 1
          fi

          jq -r '.candidates[0].content.parts[0].text' work/gemini_response.json \
            | sed '/^[[:space:]]*$/d' > work/script.txt

          echo "===== NARASI HASIL GEMINI ====="
          cat work/script.txt
          echo "================================"

      - name: Upload narration script
        uses: actions/upload-artifact@v4
        with:
          name: narration-script
          path: work/script.txt
          retention-days: 7

  # ---------------------------------------------------------------------
  # JOB 2: voice clone TTS using the generated/manual script
  # ---------------------------------------------------------------------
  clone-voice:
    needs: generate-script
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download narration script
        uses: actions/download-artifact@v4
        with:
          name: narration-script
          path: work

      - name: Cek file referensi suara ada
        run: |
          if [ ! -f "${{ inputs.ref_audio_path }}" ]; then
            echo "::error::File referensi '${{ inputs.ref_audio_path }}' tidak ditemukan di repo. Commit dulu file suaranya sebelum run workflow ini."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip & model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/faster-qwen3-tts
          key: qwen3tts-${{ inputs.model_size }}-${{ inputs.quant }}-${{ runner.os }}

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build patchelf

      - name: Clone qwentts-cpp-python + qwentts.cpp (native source, pinned to ABI v2)
        run: |
          git clone --depth 1 https://github.com/andimarafioti/qwentts-cpp-python.git /tmp/qwentts-cpp-python
          git clone https://github.com/ServeurpersoCom/qwentts.cpp.git /tmp/qwentts.cpp
          cd /tmp/qwentts.cpp
          git checkout 5ce30d34a40f1105f7a05e7d861a6bee9efe2ac6
          git submodule update --init --recursive

      - name: Build native qwentts.cpp for this runner's CPU (AMX disabled)
        run: |
          cd /tmp/qwentts-cpp-python
          python scripts/build_native.py \
            --source /tmp/qwentts.cpp \
            --backend cpu \
            --clean \
            --cmake-arg=-GNinja \
            --cmake-arg=-DGGML_NATIVE=ON \
            --cmake-arg=-DGGML_CPU_ALL_VARIANTS=OFF \
            --cmake-arg=-DGGML_AMX_TILE=OFF \
            --cmake-arg=-DGGML_AMX_INT8=OFF \
            --cmake-arg=-DGGML_AMX_BF16=OFF

      - name: Install qwentts-cpp-python (from local build) + faster-qwen3-tts
        run: |
          pip install --upgrade pip
          pip install /tmp/qwentts-cpp-python
          pip install "faster-qwen3-tts[ggml]"

      - name: Generate voice clone from script.txt
        env:
          LANGUAGE: ${{ inputs.language }}
          REF_AUDIO: ${{ inputs.ref_audio_path }}
          REF_TEXT: ${{ inputs.ref_text }}
          MODEL_SIZE: ${{ inputs.model_size }}
          QUANT: ${{ inputs.quant }}
        run: |
          mkdir -p outputs
          TEXT="$(cat work/script.txt)"
          XVEC_FLAG=""
          if [ -z "$REF_TEXT" ]; then
            XVEC_FLAG="--xvec-only"
            echo "Ref-text kosong -> pakai mode x-vector-only"
          fi
          faster-qwen3-tts --backend ggml --quant "$QUANT" clone \
            --model "Qwen/Qwen3-TTS-12Hz-${MODEL_SIZE}-Base" \
            --ref-audio "$REF_AUDIO" \
            --ref-text "$REF_TEXT" \
            $XVEC_FLAG \
            --text "$TEXT" \
            --language "$LANGUAGE" \
            --output outputs/output_clone.wav

      - name: Upload hasil audio
        uses: actions/upload-artifact@v4
        with:
          name: voice-clone-output
          path: outputs/output_clone.wav
          retention-days: 14

  # ---------------------------------------------------------------------
  # JOB 3: word-level forced alignment -> SRT (text sudah pasti dari job 1,
  # jadi langsung align-only, tidak perlu transcribe ulang dengan Canary-Qwen)
  # ---------------------------------------------------------------------
  align-subtitle:
    needs: [generate-script, clone-voice]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      NEMO_CACHE_DIR: ${{ github.workspace }}/.cache/nemo
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download narration script
        uses: actions/download-artifact@v4
        with:
          name: narration-script
          path: work

      - name: Download cloned voice audio
        uses: actions/download-artifact@v4
        with:
          name: voice-clone-output
          path: work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg, libsndfile)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-align-only
          restore-keys: |
            ${{ runner.os }}-pip-align-only

      - name: Cache downloaded model checkpoints (NeMo)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/huggingface
            ${{ github.workspace }}/.cache/nemo
          key: model-cache-align-only-${{ inputs.alignment_model }}

      - name: Install dependencies (align-only, no ASR needed)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "nemo_toolkit[asr]"
          pip install soundfile

      - name: Fetch only the NeMo Forced Aligner tool (sparse checkout, fast)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA/NeMo.git nfa_repo
          cd nfa_repo
          git sparse-checkout set tools/nemo_forced_aligner

      - name: Convert cloned audio to 16kHz mono WAV
        run: |
          ffmpeg -y -i work/output_clone.wav -ar 16000 -ac 1 -c:a pcm_s16le work/audio_16k.wav

      - name: Clean text (strip emoji, hashtags, mentions, stray symbols)
        run: |
          python - << 'PYEOF'
          import re
          with open("work/script.txt", "r", encoding="utf-8") as f:
              text = f.read()
          emoji_pattern = re.compile(
              "["
              "\U0001F300-\U0001F5FF"
              "\U0001F600-\U0001F64F"
              "\U0001F680-\U0001F6FF"
              "\U0001F700-\U0001F77F"
              "\U0001F780-\U0001F7FF"
              "\U0001F800-\U0001F8FF"
              "\U0001F900-\U0001F9FF"
              "\U0001FA00-\U0001FA6F"
              "\U0001FA70-\U0001FAFF"
              "\U00002600-\U000026FF"
              "\U00002700-\U000027BF"
              "\U0001F1E0-\U0001F1FF"
              "\U00002190-\U000021FF"
              "\U00002300-\U000023FF"
              "\U0000FE00-\U0000FE0F"
              "\U0001F000-\U0001F0FF"
              "]+",
              flags=re.UNICODE,
          )
          text = emoji_pattern.sub(" ", text)
          text = re.sub(r"[#@](\w+)", r"\1", text, flags=re.UNICODE)
          text = re.sub(r"[^\w\s.,!?'-]", " ", text, flags=re.UNICODE)
          text = re.sub(r"([.,!?])\1+", r"\1", text)
          text = re.sub(r"\s+", " ", text).strip()
          with open("work/script_clean.txt", "w", encoding="utf-8") as f:
              f.write(text)
          print("Cleaned reference text:")
          print(text)
          PYEOF

      - name: Build NFA manifest from cleaned text
        run: |
          python - << 'PYEOF'
          import json
          with open("work/script_clean.txt", "r", encoding="utf-8") as f:
              text = f.read().strip()
          if not text:
              raise RuntimeError("Reference text kosong setelah cleaning.")
          manifest = {
              "audio_filepath": "work/audio_16k.wav",
              "text": text,
          }
          with open("work/manifest.json", "w", encoding="utf-8") as f:
              f.write(json.dumps(manifest) + "\n")
          print("Manifest written:", manifest)
          PYEOF

      - name: Run NeMo Forced Aligner
        run: |
          python nfa_repo/tools/nemo_forced_aligner/align.py \
            pretrained_name="${{ inputs.alignment_model }}" \
            manifest_filepath="work/manifest.json" \
            output_dir="work/nfa_output" \
            save_output_file_formats=["ctm"] \
            ctm_file_config.remove_blank_tokens=true

      - name: Convert word-level CTM to word-by-word SRT
        run: |
          python - << 'PYEOF'
          import glob
          STRIP_CHARS = ".,!?'-\""
          def fmt_ts(seconds: float) -> str:
              if seconds < 0:
                  seconds = 0
              ms_total = round(seconds * 1000)
              hh, rem = divmod(ms_total, 3_600_000)
              mm, rem = divmod(rem, 60_000)
              ss, ms = divmod(rem, 1000)
              return f"{hh:02d}:{mm:02d}:{ss:02d},{ms:03d}"
          ctm_files = glob.glob("work/nfa_output/ctm/words/*.ctm")
          if not ctm_files:
              raise RuntimeError("No CTM output found - alignment likely failed.")
          raw_entries = []
          with open(ctm_files[0], "r", encoding="utf-8") as f:
              for line in f:
                  parts = line.strip().split()
                  if len(parts) < 5:
                      continue
                  start = float(parts[2])
                  duration = float(parts[3])
                  word = parts[4]
                  raw_entries.append((start, start + duration, word))
          entries = []
          for start, end, word in raw_entries:
              clean_word = word.strip(STRIP_CHARS)
              if not clean_word:
                  continue
              entries.append((start, end, clean_word.upper()))
          out_path = "work/subtitle.srt"
          with open(out_path, "w", encoding="utf-8") as f:
              for i, (start, end, word) in enumerate(entries, start=1):
                  f.write(f"{i}\n{fmt_ts(start)} --> {fmt_ts(end)}\n{word}\n\n")
          print(f"Wrote {len(entries)} word-level subtitle entries to {out_path}")
          PYEOF

      - name: Upload SRT artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-by-word-srt
          path: work/subtitle.srt
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # JOB 4: mux cloned audio onto video.mp4, then burn subtitle
  # ---------------------------------------------------------------------
  burn-subtitle:
    needs: [clone-voice, align-subtitle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download cloned voice audio
        uses: actions/download-artifact@v4
        with:
          name: voice-clone-output
          path: work

      - name: Download SRT
        uses: actions/download-artifact@v4
        with:
          name: word-by-word-srt
          path: work

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig

      - name: Download display fonts (Shrikhand & Ultra)
        run: |
          mkdir -p ~/.fonts
          curl -L -o ~/.fonts/Shrikhand-Regular.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/shrikhand/Shrikhand-Regular.ttf"
          curl -L -o ~/.fonts/Ultra-Regular.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/ultra/Ultra-Regular.ttf"
          fc-cache -f ~/.fonts
          fc-list | grep -Ei "shrikhand|ultra"

      - name: Verify input files exist
        run: |
          ls -la "${{ inputs.video_path }}" work/output_clone.wav work/subtitle.srt

      - name: Decide precise-duration strategy (loop / partial speed-up / crop fallback)
        run: |
          python3 - << 'PYEOF'
          import json, math, subprocess

          video_path = "${{ inputs.video_path }}"
          audio_path = "work/output_clone.wav"
          MAX_SPEED = float("${{ inputs.max_speed_factor }}")
          TOLERANCE_SEC = float("${{ inputs.duration_tolerance_seconds }}")

          def ffprobe_json(path, args):
              cmd = ["ffprobe", "-v", "error", "-print_format", "json"] + args + [path]
              out = subprocess.check_output(cmd)
              return json.loads(out)

          audio_dur = float(ffprobe_json(audio_path, ["-show_entries", "format=duration"])["format"]["duration"])

          vdata = ffprobe_json(video_path, ["-select_streams", "v:0",
                                             "-show_entries", "stream=r_frame_rate,duration"])
          vstream = vdata["streams"][0]
          num, den = vstream["r_frame_rate"].split("/")
          fps = float(num) / float(den)
          video_dur = float(vstream["duration"]) if vstream.get("duration") else \
              float(ffprobe_json(video_path, ["-show_entries", "format=duration"])["format"]["duration"])

          video_frames = int(round(video_dur * fps))
          target_frames = int(round(audio_dur * fps))

          print(f"Audio: {audio_dur:.3f}s | Video: {video_dur:.3f}s @ {fps:.3f}fps "
                f"({video_frames} frames) | Target: {target_frames} frames | max speed: {MAX_SPEED}x")

          mode = None
          filt = None

          if video_frames <= target_frames:
              # Audio is longer than (or equal to) the video: loop a highlight
              # segment (middle third) enough times to cover the gap, then trim.
              extra_frames = target_frames - video_frames
              seg_size = max(1, video_frames // 3)
              seg_start = max(0, (video_frames - seg_size) // 2)
              loops = math.ceil(extra_frames / seg_size) if extra_frames > 0 else 0
              if loops > 0:
                  filt = (f"loop=loop={loops}:size={seg_size}:start={seg_start},"
                          f"trim=end_frame={target_frames},setpts=PTS-STARTPTS")
                  print(f"Strategy: LOOP highlight [{seg_start}:{seg_start + seg_size}] x{loops}, "
                        f"trim to {target_frames} frames")
              else:
                  filt = f"trim=end_frame={target_frames},setpts=PTS-STARTPTS"
                  print(f"Strategy: exact match already, trim to {target_frames} frames")
              mode = "simple"
          else:
              # Audio is shorter than the video.
              cut_needed = video_frames - target_frames
              tolerance_frames = round(TOLERANCE_SEC * fps)

              if cut_needed <= tolerance_frames:
                  # Shortfall is small (a few seconds or less) - narration
                  # already covers the video fine, no need to alter it at
                  # all. Keep the video full-length; audio just ends early.
                  mode = "passthrough"
                  filt = None
                  print(f"Strategy: PASSTHROUGH - shortfall of {cut_needed} frames "
                        f"({cut_needed / fps:.2f}s) is within tolerance "
                        f"({TOLERANCE_SEC:.2f}s) - video kept as-is")
              else:
                  # Speed up only a centered portion of the video, escalating
                  # 1/4 -> 1/3 -> 1/2 -> full, stopping at the smallest portion
                  # whose required speed stays within max_speed_factor. Rest
                  # of the video stays untouched, so we never overshoot past
                  # the audio's duration.
                  chosen = None
                  for frac in (0.25, 1 / 3, 0.5, 1.0):
                      sub_frames = max(1, round(video_frames * frac))
                      denom = sub_frames - cut_needed
                      if denom <= 0:
                          continue  # this portion alone can't absorb the needed cut
                      speed = sub_frames / denom
                      if speed <= MAX_SPEED:
                          chosen = (frac, sub_frames, speed)
                          break

                  if chosen is None:
                      # Even speeding up the whole video isn't enough within the
                      # speed cap -> fall back to a safe centered crop instead of
                      # an unnaturally fast clip.
                      start_frame = max(0, (video_frames - target_frames) // 2)
                      end_frame = start_frame + target_frames
                      filt = f"trim=start_frame={start_frame}:end_frame={end_frame},setpts=PTS-STARTPTS"
                      mode = "simple"
                      print(f"Strategy: FALLBACK CROP (speed cap {MAX_SPEED}x not enough even on full "
                            f"video), frames [{start_frame}:{end_frame}]")
                  else:
                      frac, sub_frames, speed = chosen
                      sub_start = max(0, (video_frames - sub_frames) // 2)
                      sub_end = sub_start + sub_frames
                      parts, labels = [], []
                      if sub_start > 0:
                          parts.append(f"[0:v]trim=start_frame=0:end_frame={sub_start},setpts=PTS-STARTPTS[a]")
                          labels.append("[a]")
                      parts.append(f"[0:v]trim=start_frame={sub_start}:end_frame={sub_end},"
                                   f"setpts=(PTS-STARTPTS)/{speed}[b]")
                      labels.append("[b]")
                      if sub_end < video_frames:
                          parts.append(f"[0:v]trim=start_frame={sub_end}:end_frame={video_frames},"
                                       f"setpts=PTS-STARTPTS[c]")
                          labels.append("[c]")
                      concat = "".join(labels) + f"concat=n={len(labels)}:v=1:a=0[outv]"
                      filt = ";".join(parts) + ";" + concat
                      mode = "complex"
                      print(f"Strategy: SPEED UP centered ~{frac:.2f} of video (frames "
                            f"[{sub_start}:{sub_end}]) by {speed:.3f}x, rest untouched")

          with open("work/video_filter_mode.txt", "w") as f:
              f.write(mode)
          with open("work/video_filter.txt", "w") as f:
              f.write(filt or "")
          PYEOF
          echo "Mode: $(cat work/video_filter_mode.txt)"
          echo "Filter dipakai:"
          cat work/video_filter.txt

      - name: Mux cloned audio onto precisely-timed video
        run: |
          MODE="$(cat work/video_filter_mode.txt)"
          VF="$(cat work/video_filter.txt)"
          if [ "$MODE" = "complex" ]; then
            ffmpeg -y -i "${{ inputs.video_path }}" -i work/output_clone.wav \
              -filter_complex "$VF" \
              -map "[outv]" -map 1:a:0 \
              -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
              -c:a aac -b:a 192k -shortest \
              work/video_with_audio.mp4
          elif [ "$MODE" = "passthrough" ]; then
            # Video kept exactly as-is (no filter, no re-encode of video needed);
            # no -shortest so the video plays out in full even after narration ends.
            ffmpeg -y -i "${{ inputs.video_path }}" -i work/output_clone.wav \
              -map 0:v:0 -map 1:a:0 \
              -c:v copy \
              -c:a aac -b:a 192k \
              work/video_with_audio.mp4
          else
            ffmpeg -y -i "${{ inputs.video_path }}" -i work/output_clone.wav \
              -filter:v "$VF" \
              -map 0:v:0 -map 1:a:0 \
              -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
              -c:a aac -b:a 192k -shortest \
              work/video_with_audio.mp4
          fi

      - name: Burn subtitle into video
        run: |
          ffmpeg -y -i work/video_with_audio.mp4 \
            -vf "subtitles=work/subtitle.srt:fontsdir=/root/.fonts:force_style='FontName=Shrikhand,FontSize=13,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2.2,Shadow=0,Alignment=2,MarginV=75'" \
            -c:a copy "${{ inputs.output_video_name }}"

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtitled-video
          path: ${{ inputs.output_video_name }}
          retention-days: 14
