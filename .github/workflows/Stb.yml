name: Blender Ninja Gauntlet AAA (9:16 Preview + Game-ready Export)

on:
  workflow_dispatch:
    inputs:
      frame_end:
        description: "Frame terakhir (30 fps; 150 = 5 detik)"
        required: false
        default: "150"
      samples:
        description: "Cycles samples (48 = bagus, 96 = AAA preview)"
        required: false
        default: "64"
      width:
        description: "Lebar render (px)"
        required: false
        default: "720"
      height:
        description: "Tinggi render (px) — 9:16"
        required: false
        default: "1280"
      shards:
        description: "Job paralel (naikkan bila lambat)"
        required: false
        default: "6"
      export_fbx:
        description: "Export FBX + GLB siap game engine (true/false)"
        required: false
        default: "true"
      add_rig:
        description: "Tambah armature sederhana (true/false)"
        required: false
        default: "true"

env:
  BLENDER_VERSION: "4.2.3"
  BLENDER_SERIES: "4.2"
  FRAME_END: ${{ github.event.inputs.frame_end || '150' }}
  SAMPLES: ${{ github.event.inputs.samples || '64' }}
  WIDTH: ${{ github.event.inputs.width || '720' }}
  HEIGHT: ${{ github.event.inputs.height || '1280' }}
  SHARDS: ${{ github.event.inputs.shards || '6' }}
  EXPORT_FBX: ${{ github.event.inputs.export_fbx || 'true' }}
  ADD_RIG: ${{ github.event.inputs.add_rig || 'true' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shard_list: ${{ steps.gen.outputs.list }}
    steps:
      - id: gen
        run: |
          n=${SHARDS}
          list=$(python3 -c "import json;print(json.dumps(list(range($n))))")
          echo "list=$list" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -fL -o blender.tar.xz \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p /opt/blender
          tar -xJf blender.tar.xz -C /opt/blender --strip-components=1

      - run: echo "/opt/blender" >> "$GITHUB_PATH"

      - run: mkdir -p output/frames output/export

      - name: Compute shard range
        id: range
        run: |
          python3 -c "
          total = int('${FRAME_END}'); shards = int('${SHARDS}'); shard = int('${{ matrix.shard }}')
          per = -(-total // shards)
          start = shard * per + 1
          end = min(total, start + per - 1)
          print(f'start={start}'); print(f'end={end}')
          " >> "$GITHUB_OUTPUT"

      - name: Write Blender script (Ninja Gauntlet AAA)
        run: |
          cat > generate_gauntlet.py << 'PYEOF'
          import bpy, math, os
          from mathutils import Vector

          TOTAL_FRAMES = int(os.environ["FRAME_END"])
          SAMPLES      = int(os.environ["SAMPLES"])
          WIDTH        = int(os.environ["WIDTH"])
          HEIGHT       = int(os.environ["HEIGHT"])
          SHARD_START  = int(os.environ["SHARD_START"])
          SHARD_END    = int(os.environ["SHARD_END"])
          EXPORT_FBX   = os.environ.get("EXPORT_FBX", "true").lower() == "true"
          ADD_RIG      = os.environ.get("ADD_RIG", "true").lower() == "true"

          bpy.ops.wm.read_factory_settings(use_empty=True)
          scene = bpy.context.scene

          # ============================================================
          # SKALA NYATA (meter) — siap dipakai Unreal/Unity 1:1
          # ============================================================
          ARM_LEN   = 0.30
          PALM_W    = 0.09
          PALM_T    = 0.035
          FINGER_L  = 0.075

          # ============================================================
          # PBR MATERIALS — detail procedural "mahal"
          # ============================================================
          def make_pbr(name, base, rough=0.6, metal=0.0,
                       noise_scale=200.0, noise_strength=0.04,
                       bump_strength=0.15, brushed=False, weave=False):
              mat = bpy.data.materials.new(name=name)
              mat.use_nodes = True
              nt = mat.node_tree; nodes = nt.nodes; links = nt.links
              nodes.clear()

              out   = nodes.new('ShaderNodeOutputMaterial')
              bsdf  = nodes.new('ShaderNodeBsdfPrincipled')
              bsdf.inputs["Base Color"].default_value = (*base, 1)
              bsdf.inputs["Roughness"].default_value  = rough
              bsdf.inputs["Metallic"].default_value   = metal

              # --- Detail 1: noise grain (pori kulit / serat kain) ---
              tex_co  = nodes.new('ShaderNodeTexCoord')
              noise   = nodes.new('ShaderNodeTexNoise')
              noise.inputs["Scale"].default_value = noise_scale
              noise.inputs["Detail"].default_value = 6.0
              noise.inputs["Roughness"].default_value = 0.55

              # --- Detail 2 (opsional): brushed metal / weave cloth ---
              if brushed:
                  wave = nodes.new('ShaderNodeTexWave')
                  wave.wave_type = 'BANDS'; wave.bands_direction = 'X'
                  wave.inputs["Scale"].default_value = 400.0
                  wave.inputs["Distortion"].default_value = 2.0
                  mixn = nodes.new('ShaderNodeMixRGB')
                  mixn.blend_type = 'MULTIPLY'; mixn.inputs["Fac"].default_value = 0.35
                  links.new(noise.outputs["Fac"], mixn.inputs["Color1"])
                  links.new(wave.outputs["Color"],  mixn.inputs["Color2"])
                  detail_out = mixn.outputs["Color"]
              elif weave:
                  checker = nodes.new('ShaderNodeTexChecker')
                  checker.inputs["Scale"].default_value = 500.0
                  checker.inputs["Color1"].default_value = (0.02,0.02,0.02,1)
                  checker.inputs["Color2"].default_value = (0.06,0.06,0.06,1)
                  mixn = nodes.new('ShaderNodeMixRGB')
                  mixn.blend_type = 'MULTIPLY'; mixn.inputs["Fac"].default_value = 0.4
                  links.new(noise.outputs["Fac"], mixn.inputs["Color1"])
                  links.new(checker.outputs["Color"], mixn.inputs["Color2"])
                  detail_out = mixn.outputs["Color"]
              else:
                  detail_out = noise.outputs["Fac"]

              links.new(tex_co.outputs["Object"], noise.inputs["Vector"])

              # --- Bump mikro ---
              bump = nodes.new('ShaderNodeBump')
              bump.inputs["Strength"].default_value = bump_strength
              bump.inputs["Distance"].default_value = 0.002
              links.new(detail_out, bump.inputs["Height"])

              # --- Roughness variation tipis (kesan worn) ---
              rough_ramp = nodes.new('ShaderNodeValToRGB')
              rough_ramp.color_ramp.elements[0].color = (rough*0.85,)*3 + (1,)
              rough_ramp.color_ramp.elements[1].color = (min(1, rough*1.15),)*3 + (1,)
              links.new(detail_out, rough_ramp.inputs["Fac"])
              links.new(rough_ramp.outputs["Color"], bsdf.inputs["Roughness"])

              links.new(bump.outputs["Normal"], bsdf.inputs["Normal"])
              links.new(bsdf.outputs["BSDF"], out.inputs["Surface"])
              return mat

          MAT_LEATHER = make_pbr("Ninja_Leather_Black",
                                 (0.018, 0.018, 0.022), rough=0.72, metal=0.0,
                                 noise_scale=250, noise_strength=0.05,
                                 bump_strength=0.25)
          MAT_CLOTH   = make_pbr("Ninja_Cloth_Wrap",
                                 (0.03, 0.03, 0.04), rough=0.92, metal=0.0,
                                 noise_scale=350, bump_strength=0.3, weave=True)
          MAT_METAL   = make_pbr("Ninja_Edge_Metal",
                                 (0.62, 0.62, 0.66), rough=0.28, metal=1.0,
                                 noise_scale=600, bump_strength=0.08, brushed=True)
          MAT_ACCENT  = make_pbr("Ninja_Clan_Red",
                                 (0.55, 0.03, 0.05), rough=0.55, metal=0.0,
                                 noise_scale=300, bump_strength=0.1)

          # ============================================================
          # HELPER GEOMETRI
          # ============================================================
          parts = []

          def add_cube(name, loc, size, mat, bevel=0.0025, subsurf=0,
                       rot=(0,0,0)):
              bpy.ops.mesh.primitive_cube_add(size=1, location=loc, rotation=rot)
              o = bpy.context.active_object
              o.name = name; o.scale = size
              bpy.ops.object.transform_apply(scale=True)
              if bevel > 0:
                  m = o.modifiers.new("Bevel", 'BEVEL'); m.width = bevel
                  m.segments = 3; m.limit_method = 'ANGLE'
              if subsurf > 0:
                  m2 = o.modifiers.new("Subsurf", 'SUBSURF')
                  m2.levels = subsurf; m2.render_levels = subsurf
              o.data.materials.append(mat)
              parts.append(o); return o

          def add_cyl(name, loc, radius, depth, mat, rot=(0,0,0), verts=32):
              bpy.ops.mesh.primitive_cylinder_add(radius=radius, depth=depth,
                                                  location=loc, rotation=rot, vertices=verts)
              o = bpy.context.active_object; o.name = name
              o.data.materials.append(mat); parts.append(o); return o

          # ============================================================
          # 1. FOREARM GUARD
          # ============================================================
          add_cube("Forearm_Guard",
                   (0, 0, ARM_LEN*0.5),
                   (PALM_W*1.05, PALM_T*1.2, ARM_LEN*0.55),
                   MAT_LEATHER, bevel=0.005, subsurf=1)

          add_cube("Forearm_EdgePlate",
                   (0, -PALM_T*0.65, ARM_LEN*0.45),
                   (PALM_W*0.7, 0.004, ARM_LEN*0.4),
                   MAT_METAL, bevel=0.002)

          add_cube("Forearm_ClanMark",
                   (0, -PALM_T*0.68, ARM_LEN*0.45),
                   (0.006, 0.003, ARM_LEN*0.3),
                   MAT_ACCENT, bevel=0.001)

          # ============================================================
          # 2. WRIST WRAP
          # ============================================================
          for i in range(3):
              z = ARM_LEN*0.15 + i*0.018
              add_cyl(f"Wrist_Wrap_{i}", (0, 0, z),
                      PALM_W*0.62, 0.012, MAT_CLOTH, verts=32)

          # ============================================================
          # 3. PALM GLOVE + KNUCKLE
          # ============================================================
          add_cube("Palm_Glove",
                   (0, 0, ARM_LEN + PALM_T*0.5),
                   (PALM_W, PALM_T, PALM_T*0.9),
                   MAT_LEATHER, bevel=0.006, subsurf=2)

          add_cube("Knuckle_Guard",
                   (0, -PALM_T*0.45, ARM_LEN + PALM_T*0.5),
                   (PALM_W*0.9, PALM_T*0.3, PALM_T*0.5),
                   MAT_METAL, bevel=0.003)

          # ============================================================
          # 4. FINGER SHELLS (4 jari, 3 segmen) + CLAW TIP
          # ============================================================
          finger_x = [-PALM_W*0.36, -PALM_W*0.12, PALM_W*0.12, PALM_W*0.36]
          finger_meta = []  # untuk rig nanti
          for fi, fx in enumerate(finger_x):
              z_cursor = ARM_LEN + PALM_T*0.5
              y_cursor = -PALM_T*0.5
              for seg in range(3):
                  seg_len = FINGER_L * (0.42 if seg == 0 else 0.30 if seg == 1 else 0.28)
                  bend = math.radians(15 + seg*20)
                  dz = math.cos(bend)*seg_len*0.5
                  dy = -math.sin(bend)*seg_len*0.5
                  loc = (fx, y_cursor + dy, z_cursor + dz)
                  add_cube(f"Finger_{fi}_Seg_{seg}", loc,
                           (0.016, 0.014, seg_len*0.95),
                           MAT_LEATHER, bevel=0.002, rot=(bend,0,0))
                  z_cursor += math.cos(bend)*seg_len
                  y_cursor -= math.sin(bend)*seg_len
                  if seg == 2:
                      add_cube(f"Finger_{fi}_ClawTip",
                               (fx, y_cursor - 0.006, z_cursor + 0.004),
                               (0.012, 0.010, 0.008),
                               MAT_METAL, bevel=0.001, rot=(bend,0,0))
              finger_meta.append((fx, ARM_LEN + PALM_T*0.5))

          # Thumb
          add_cube("Thumb_Seg_0",
                   (-PALM_W*0.55, -PALM_T*0.3, ARM_LEN + PALM_T*0.3),
                   (0.020, 0.016, FINGER_L*0.45),
                   MAT_LEATHER, bevel=0.002, rot=(0, math.radians(35), 0))
          add_cube("Thumb_Seg_1",
                   (-PALM_W*0.62, -PALM_T*0.45, ARM_LEN + PALM_T*0.3 + FINGER_L*0.42),
                   (0.018, 0.014, FINGER_L*0.4),
                   MAT_LEATHER, bevel=0.002, rot=(0, math.radians(55), 0))

          # ============================================================
          # 5. BLADE MOUNT + KUNAI DUMMY
          # ============================================================
          add_cube("Blade_Mount",
                   (0, -PALM_T*0.85, ARM_LEN*0.4),
                   (0.018, 0.010, 0.08),
                   MAT_METAL, bevel=0.002)
          add_cube("Kunai_Blade",
                   (0, -PALM_T*0.95, ARM_LEN*0.4 + 0.04),
                   (0.006, 0.003, 0.06),
                   MAT_METAL, bevel=0.001)
          add_cyl("Kunai_Ring",
                  (0, -PALM_T*0.95, ARM_LEN*0.4 - 0.04),
                  0.010, 0.004, MAT_METAL, rot=(math.radians(90),0,0), verts=24)

          # ============================================================
          # 6. JOIN + APPLY MODIFIER + UV UNWRAP
          # ============================================================
          bpy.ops.object.select_all(action='DESELECT')
          for p in parts:
              p.select_set(True)
          bpy.context.view_layer.objects.active = parts[0]
          bpy.ops.object.join()
          gauntlet = bpy.context.active_object
          gauntlet.name = "Ninja_Gauntlet"

          # Apply semua modifier agar UV & export bersih
          bpy.ops.object.convert(target='MESH')

          # Smart UV Project + pack islands
          bpy.ops.object.mode_set(mode='EDIT')
          bpy.ops.mesh.select_all(action='SELECT')
          bpy.ops.uv.smart_project(angle_limit=math.radians(66),
                                   island_margin=0.02,
                                   correct_aspect=True,
                                   scale_to_bounds=True)
          bpy.ops.uv.pack_islands(margin=0.01)
          bpy.ops.object.mode_set(mode='OBJECT')

          # Origin ke tengah lengan
          scene.cursor.location = (0, 0, ARM_LEN*0.5)
          bpy.ops.object.origin_set(type='ORIGIN_CURSOR')
          scene.cursor.location = (0, 0, 0)

          # Weighted Normal untuk shading halus bersih (AAA)
          wn = gauntlet.modifiers.new("WeightedNormal", 'WEIGHTED_NORMAL')
          wn.keep_sharp = True
          bpy.ops.object.modifier_apply(modifier=wn.name)

          # Shade smooth + auto smooth LINTAS VERSI (fix error 4.2)
          bpy.ops.object.shade_smooth()
          if hasattr(gauntlet.data, "use_auto_smooth"):
              # Blender <= 4.0
              gauntlet.data.use_auto_smooth = True
              gauntlet.data.auto_smooth_angle = math.radians(35)
          else:
              # Blender >= 4.1
              try:
                  bpy.ops.object.shade_auto_smooth(angle=math.radians(35))
              except (RuntimeError, AttributeError):
                  pass

          # ============================================================
          # 7. ARMATURE SEDERHANA (opsional, rig-ready)
          # ============================================================
          arm_obj = None
          if ADD_RIG:
              bpy.ops.object.armature_add(enter_editmode=True,
                                          location=(0,0,0))
              arm_obj = bpy.context.active_object
              arm_obj.name = "Ninja_Gauntlet_Rig"
              arm = arm_obj.data
              # Hapus bone default
              for b in list(arm.edit_bones):
                  arm.edit_bones.remove(b)

              # Root (wrist)
              wrist = arm.edit_bones.new("Wrist")
              wrist.head = (0, 0, ARM_LEN*0.15)
              wrist.tail = (0, 0, ARM_LEN + PALM_T*0.5)

              # 5 finger chains (thumb + 4)
              finger_heads = [(fx, -PALM_T*0.5, ARM_LEN + PALM_T*0.5)
                              for fx, _ in finger_meta]
              finger_heads.append((-PALM_W*0.55, -PALM_T*0.3,
                                   ARM_LEN + PALM_T*0.3))
              for i, head in enumerate(finger_heads):
                  parent = wrist
                  prev = None
                  for seg in range(3):
                      bname = f"Finger_{i}_Seg_{seg}"
                      b = arm.edit_bones.new(bname)
                      b.head = (head[0], head[1], head[2] + seg*FINGER_L*0.3)
                      b.tail = (head[0], head[1], head[2] + (seg+1)*FINGER_L*0.3)
                      b.parent = prev if prev else parent
                      b.use_connect = bool(prev)
                      prev = b

              bpy.ops.object.mode_set(mode='OBJECT')

              # Parent mesh ke armature + vertex groups otomatis (envelope)
              bpy.ops.object.select_all(action='DESELECT')
              gauntlet.select_set(True)
              arm_obj.select_set(True)
              bpy.context.view_layer.objects.active = arm_obj
              try:
                  bpy.ops.object.parent_set(type='ARMATURE_AUTO')
              except RuntimeError:
                  # Fallback: parenting tanpa auto weight
                  bpy.ops.object.parent_set(type='ARMATURE_NAME')

          # ============================================================
          # 8. STUDIO AAA (HDRI-like world + 3-point + floor)
          # ============================================================
          bpy.ops.mesh.primitive_plane_add(size=2, location=(0, 0, -0.001))
          floor = bpy.context.active_object
          floor.name = "Studio_Floor"
          floor.data.materials.append(
              make_pbr("Studio_Gray", (0.15, 0.15, 0.17), rough=0.35))

          # World gradient studio
          world = bpy.data.worlds.new("World"); scene.world = world
          world.use_nodes = True
          nt = world.node_tree; nt.nodes.clear()
          tc  = nt.nodes.new('ShaderNodeTexCoord')
          grad= nt.nodes.new('ShaderNodeTexGradient')
          ramp= nt.nodes.new('ShaderNodeValToRGB')
          ramp.color_ramp.elements[0].color = (0.02, 0.02, 0.03, 1)
          ramp.color_ramp.elements[1].color = (0.10, 0.12, 0.18, 1)
          bg  = nt.nodes.new('ShaderNodeBackground')
          bg.inputs["Strength"].default_value = 0.5
          wo  = nt.nodes.new('ShaderNodeOutputWorld')
          nt.links.new(tc.outputs["Generated"], grad.inputs["Vector"])
          nt.links.new(grad.outputs["Color"], ramp.inputs["Fac"])
          nt.links.new(ramp.outputs["Color"], bg.inputs["Color"])
          nt.links.new(bg.outputs["Background"], wo.inputs["Surface"])

          def add_area(name, loc, energy, size, color):
              bpy.ops.object.light_add(type='AREA', location=loc)
              L = bpy.context.active_object; L.name = name
              L.data.energy = energy; L.data.size = size; L.data.color = color
              d = Vector((0,0,ARM_LEN*0.5)) - L.location
              L.rotation_euler = d.to_track_quat('-Z','Y').to_euler()
              return L

          add_area("Key",  (0.25, -0.25, 0.35),  80, 0.25, (1.0, 0.95, 0.90))
          add_area("Fill", (-0.30, -0.15, 0.25), 30, 0.30, (0.70, 0.80, 1.00))
          add_area("Rim",  (0.00,  0.30, 0.40), 100, 0.20, (1.00, 0.85, 0.70))

          # Kamera 9:16
          bpy.ops.object.camera_add(location=(0.35, -0.45, 0.28))
          cam = bpy.context.active_object
          d = Vector((0,0,ARM_LEN*0.55)) - cam.location
          cam.rotation_euler = d.to_track_quat('-Z','Y').to_euler()
          cam.data.lens = 55
          scene.camera = cam

          # ============================================================
          # 9. RENDER SETTINGS — OPTIMASI
          # ============================================================
          scene.render.engine = 'CYCLES'
          scene.cycles.device = 'CPU'
          scene.cycles.samples = SAMPLES
          scene.cycles.use_denoising = True
          try:
              scene.cycles.denoiser = 'OPENIMAGEDENOISE'
          except Exception:
              pass
          scene.cycles.use_adaptive_sampling = True
          scene.cycles.adaptive_threshold = 0.03
          scene.cycles.max_bounces = 6
          scene.cycles.diffuse_bounces = 3
          scene.cycles.glossy_bounces = 3
          scene.cycles.transmission_bounces = 2
          scene.cycles.caustics_reflective = False
          scene.cycles.caustics_refractive = False
          scene.render.use_persistent_data = True
          scene.render.resolution_x = WIDTH
          scene.render.resolution_y = HEIGHT
          scene.render.resolution_percentage = 100
          scene.render.fps = 30
          scene.frame_start = SHARD_START
          scene.frame_end   = SHARD_END
          scene.render.image_settings.file_format = 'PNG'
          scene.render.image_settings.color_mode = 'RGB'
          scene.render.image_settings.color_depth = '8'
          scene.view_settings.view_transform = 'AgX'
          try:
              scene.view_settings.look = 'AgX - Medium High Contrast'
          except Exception:
              pass

          # ============================================================
          # 10. TURNTABLE LOOP
          # ============================================================
          for frame in range(SHARD_START, SHARD_END + 1):
              scene.frame_set(frame)
              t = (frame - 1) / max(1, TOTAL_FRAMES - 1)
              gauntlet.rotation_euler = (0, 0, t * math.tau)
              gauntlet.location = (0, 0, math.sin(t * math.tau) * 0.005)
              scene.render.filepath = f'output/frames/frame_{frame:06d}.png'
              bpy.ops.render.render(write_still=True)

          # ============================================================
          # 11. EXPORT FBX + GLB (hanya shard 0)
          # ============================================================
          if EXPORT_FBX and SHARD_START == 1:
              bpy.ops.object.select_all(action='DESELECT')
              gauntlet.select_set(True)
              if arm_obj: arm_obj.select_set(True)
              bpy.context.view_layer.objects.active = gauntlet
              try:
                  bpy.ops.export_scene.fbx(
                      filepath='output/export/Ninja_Gauntlet.fbx',
                      use_selection=True,
                      apply_scale_options='FBX_SCALE_ALL',
                      mesh_smooth_type='FACE',
                      bake_anim=False,
                      add_leaf_bones=True,
                  )
              except Exception as e:
                  print("FBX export warning:", e)

              try:
                  bpy.ops.export_scene.gltf(
                      filepath='output/export/Ninja_Gauntlet.glb',
                      use_selection=True,
                      export_format='GLB',
                      export_apply=True,
                  )
              except Exception as e:
                  print("GLB export warning:", e)

          print(f"Shard done: frames {SHARD_START}-{SHARD_END}")
          PYEOF

      - name: Run Blender headless
        env:
          FRAME_END: ${{ env.FRAME_END }}
          SAMPLES: ${{ env.SAMPLES }}
          WIDTH: ${{ env.WIDTH }}
          HEIGHT: ${{ env.HEIGHT }}
          SHARD_START: ${{ steps.range.outputs.start }}
          SHARD_END: ${{ steps.range.outputs.end }}
          EXPORT_FBX: ${{ env.EXPORT_FBX }}
          ADD_RIG: ${{ env.ADD_RIG }}
        run: |
          blender --background --python-exit-code 1 --python generate_gauntlet.py

      - name: Upload shard frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-shard-${{ matrix.shard }}
          path: output/frames/
          retention-days: 3

      - name: Upload FBX/GLB
        if: hashFiles('output/export/*.fbx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-model-fbx-glb
          path: output/export/
          retention-days: 14

  combine:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/download-artifact@v4
        with:
          pattern: frames-shard-*
          path: all_frames_downloads
          merge-multiple: false

      - name: Merge & renumber frames
        run: |
          mkdir -p all_frames
          python3 << 'PYEOF'
          import glob, os, re, shutil
          files = glob.glob('all_frames_downloads/**/frame_*.png', recursive=True)
          def num(p):
              m = re.search(r'frame_(\d+)\.png$', os.path.basename(p))
              return int(m.group(1)) if m else None
          nf = sorted([(num(f), f) for f in files if num(f) is not None], key=lambda x: x[0])
          seen, idx = set(), 1
          for n, f in nf:
              if n in seen: continue
              seen.add(n)
              shutil.copy2(f, f"all_frames/frame_{idx:06d}.png")
              idx += 1
          print(f"Total unik: {len(seen)}")
          PYEOF

      - name: Verify frames
        run: |
          c=$(ls all_frames/frame_*.png 2>/dev/null | wc -l)
          echo "Frames: $c"
          [ "$c" -ge 2 ] || { echo "::error::Frame < 2"; exit 1; }

      - name: Encode MP4
        run: |
          mkdir -p output
          ffmpeg -y -framerate 30 -start_number 1 \
            -i 'all_frames/frame_%06d.png' \
            -c:v libx264 -pix_fmt yuv420p -crf 16 -preset slow \
            -movflags +faststart \
            output/ninja_gauntlet_preview.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: output/ninja_gauntlet_preview.mp4
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: frames-png-merged
          path: all_frames/
          retention-days: 14
