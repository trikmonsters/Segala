name: Blender Ninja Gauntlet AAA Preview (9:16, Image + Video)

on:
  workflow_dispatch:
    inputs:
      frame_end:
        description: "Frame terakhir (30 fps, 150 = 5 detik)"
        required: false
        default: "150"
      samples:
        description: "Cycles samples"
        required: false
        default: "48"
      width:
        description: "Lebar render (px)"
        required: false
        default: "720"
      height:
        description: "Tinggi render (px) — 9:16"
        required: false
        default: "1280"
      shards:
        description: "Job paralel"
        required: false
        default: "5"
      export_fbx:
        description: "Export FBX siap game engine? (true/false)"
        required: false
        default: "true"

env:
  BLENDER_VERSION: "4.2.3"
  BLENDER_SERIES: "4.2"
  FRAME_END: ${{ github.event.inputs.frame_end || '150' }}
  SAMPLES: ${{ github.event.inputs.samples || '48' }}
  WIDTH: ${{ github.event.inputs.width || '720' }}
  HEIGHT: ${{ github.event.inputs.height || '1280' }}
  SHARDS: ${{ github.event.inputs.shards || '5' }}
  EXPORT_FBX: ${{ github.event.inputs.export_fbx || 'true' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shard_list: ${{ steps.gen.outputs.list }}
    steps:
      - id: gen
        run: |
          n=${SHARDS}
          list=$(python3 -c "import json;print(json.dumps(list(range($n))))")
          echo "list=$list" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -fL -o blender.tar.xz \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p /opt/blender
          tar -xJf blender.tar.xz -C /opt/blender --strip-components=1

      - run: echo "/opt/blender" >> "$GITHUB_PATH"

      - run: mkdir -p output/frames output/export

      - name: Compute shard range
        id: range
        run: |
          python3 -c "
          total = int('${FRAME_END}'); shards = int('${SHARDS}'); shard = int('${{ matrix.shard }}')
          per = -(-total // shards)
          start = shard * per + 1
          end = min(total, start + per - 1)
          print(f'start={start}'); print(f'end={end}')
          " >> "$GITHUB_OUTPUT"

      - name: Write Blender script (Ninja Gauntlet)
        run: |
          cat > generate_gauntlet.py << 'PYEOF'
          import bpy, math, os
          from mathutils import Vector

          TOTAL_FRAMES = int(os.environ["FRAME_END"])
          SAMPLES      = int(os.environ["SAMPLES"])
          WIDTH        = int(os.environ["WIDTH"])
          HEIGHT       = int(os.environ["HEIGHT"])
          SHARD_START  = int(os.environ["SHARD_START"])
          SHARD_END    = int(os.environ["SHARD_END"])
          EXPORT_FBX   = os.environ.get("EXPORT_FBX", "true").lower() == "true"

          bpy.ops.wm.read_factory_settings(use_empty=True)
          scene = bpy.context.scene

          # ============================================================
          # SKALA NYATA (meter) — siap dipakai di Unreal/Unity 1:1
          # Panjang lengan 0.30 m, lebar telapak 0.09 m
          # ============================================================
          ARM_LEN   = 0.30
          PALM_W    = 0.09
          PALM_T    = 0.035
          FINGER_L  = 0.075

          # ============================================================
          # PBR MATERIALS (siap game engine)
          # ============================================================
          def make_pbr(name, base, rough=0.6, metal=0.0, spec=0.5):
              mat = bpy.data.materials.new(name=name)
              mat.use_nodes = True
              b = mat.node_tree.nodes["Principled BSDF"]
              b.inputs["Base Color"].default_value = (*base, 1)
              b.inputs["Roughness"].default_value = rough
              b.inputs["Metallic"].default_value = metal
              # Specular IOR Level (Blender 4.x)
              if "Specular IOR Level" in b.inputs:
                  b.inputs["Specular IOR Level"].default_value = spec
              return mat

          MAT_LEATHER = make_pbr("Ninja_Leather_Black", (0.02, 0.02, 0.025), rough=0.75, metal=0.0)
          MAT_CLOTH   = make_pbr("Ninja_Cloth_Wrap",    (0.04, 0.04, 0.05),  rough=0.9,  metal=0.0)
          MAT_METAL   = make_pbr("Ninja_Edge_Metal",    (0.65, 0.65, 0.68),  rough=0.25, metal=1.0)
          MAT_ACCENT  = make_pbr("Ninja_Clan_Red",      (0.55, 0.03, 0.05),  rough=0.55, metal=0.0)
          MAT_SKIN    = make_pbr("Ninja_Skin_Shadow",   (0.18, 0.12, 0.10),  rough=0.6,  metal=0.0)

          # ============================================================
          # HELPER
          # ============================================================
          def add_cube(name, loc, size, mat, bevel=0.003, subsurf=0):
              bpy.ops.mesh.primitive_cube_add(size=1, location=loc)
              o = bpy.context.active_object
              o.name = name
              o.scale = size
              bpy.ops.object.transform_apply(scale=True)
              if bevel > 0:
                  m = o.modifiers.new("Bevel", 'BEVEL'); m.width = bevel; m.segments = 3
              if subsurf > 0:
                  m2 = o.modifiers.new("Subsurf", 'SUBSURF'); m2.levels = subsurf; m2.render_levels = subsurf
              o.data.materials.append(mat)
              return o

          def add_cylinder(name, loc, radius, depth, mat, rot=(0,0,0), verts=32):
              bpy.ops.mesh.primitive_cylinder_add(radius=radius, depth=depth,
                                                  location=loc, rotation=rot, vertices=verts)
              o = bpy.context.active_object
              o.name = name
              o.data.materials.append(mat)
              return o

          def add_sphere(name, loc, radius, mat, scale=(1,1,1)):
              bpy.ops.mesh.primitive_uv_sphere_add(radius=radius, location=loc, segments=32, ring_count=16)
              o = bpy.context.active_object
              o.name = name
              o.scale = scale
              bpy.ops.object.transform_apply(scale=True)
              o.data.materials.append(mat)
              return o

          parts = []

          # ============================================================
          # 1. FOREARM GUARD (pelindung lengan)
          # ============================================================
          forearm = add_cube("Forearm_Guard",
                              (0, 0, ARM_LEN*0.5),
                              (PALM_W*1.05, PALM_T*1.2, ARM_LEN*0.55),
                              MAT_LEATHER, bevel=0.005, subsurf=1)
          parts.append(forearm)

          # Plat logam di punggung lengan (edge guard)
          edge_plate = add_cube("Forearm_EdgePlate",
                                (0, -PALM_T*0.65, ARM_LEN*0.45),
                                (PALM_W*0.7, 0.004, ARM_LEN*0.4),
                                MAT_METAL, bevel=0.002)
          parts.append(edge_plate)

          # Aksen merah vertikal (clan mark)
          accent = add_cube("Forearm_ClanMark",
                            (0, -PALM_T*0.68, ARM_LEN*0.45),
                            (0.006, 0.003, ARM_LEN*0.3),
                            MAT_ACCENT, bevel=0.001)
          parts.append(accent)

          # ============================================================
          # 2. WRIST WRAP (ikatan kain pergelangan)
          # ============================================================
          for i in range(3):
              z = ARM_LEN*0.15 + i*0.018
              wrap = add_cylinder(f"Wrist_Wrap_{i}",
                                    (0, 0, z),
                                    PALM_W*0.62, 0.012,
                                    MAT_CLOTH, rot=(0,0,0), verts=24)
              parts.append(wrap)

          # ============================================================
          # 3. PALM GLOVE (telapak)
          # ============================================================
          palm = add_cube("Palm_Glove",
                          (0, 0, ARM_LEN + PALM_T*0.5),
                          (PALM_W, PALM_T, PALM_T*0.9),
                          MAT_LEATHER, bevel=0.006, subsurf=2)
          parts.append(palm)

          # Knuckle guard (pelindung buku jari)
          knuckle = add_cube("Knuckle_Guard",
                              (0, -PALM_T*0.45, ARM_LEN + PALM_T*0.5),
                              (PALM_W*0.9, PALM_T*0.3, PALM_T*0.5),
                              MAT_METAL, bevel=0.003)
          parts.append(knuckle)

          # ============================================================
          # 4. FINGER SHELLS (4 jari + jempol) — segmentasi 3 sendi
          # ============================================================
          finger_x = [-PALM_W*0.36, -PALM_W*0.12, PALM_W*0.12, PALM_W*0.36]
          for fi, fx in enumerate(finger_x):
              for seg in range(3):
                  seg_len = FINGER_L * (0.42 if seg == 0 else 0.30 if seg == 1 else 0.28)
                  seg_z = ARM_LEN + PALM_T*0.5 + sum(
                      FINGER_L * (0.42 if s == 0 else 0.30 if s == 1 else 0.28)
                      for s in range(seg)
                  ) + seg_len*0.5
                  # Jari sedikit menekuk ke depan
                  bend = math.radians(15 + seg*20)
                  finger = add_cube(f"Finger_{fi}_Seg_{seg}",
                                    (fx, -PALM_T*0.5 + math.sin(bend)*seg_len*0.3, seg_z),
                                    (0.016, 0.014, seg_len*0.95),
                                    MAT_LEATHER, bevel=0.002)
                  finger.rotation_euler = (bend, 0, 0)
                  parts.append(finger)
                  # Pelat logam di ujung jari (claw tip)
                  if seg == 2:
                      tip = add_cube(f"Finger_{fi}_ClawTip",
                                      (fx, -PALM_T*0.5 + math.sin(bend)*seg_len*0.3 - 0.006,
                                       seg_z + seg_len*0.45),
                                      (0.012, 0.010, 0.008),
                                      MAT_METAL, bevel=0.001)
                      tip.rotation_euler = (bend, 0, 0)
                      parts.append(tip)

          # Jempol (thumb) — 2 segmen, di sisi kiri
          thumb_base_z = ARM_LEN + PALM_T*0.3
          thumb1 = add_cube("Thumb_Seg_0",
                            (-PALM_W*0.55, -PALM_T*0.3, thumb_base_z),
                            (0.020, 0.016, FINGER_L*0.45),
                            MAT_LEATHER, bevel=0.002)
          thumb1.rotation_euler = (0, math.radians(35), 0)
          parts.append(thumb1)
          thumb2 = add_cube("Thumb_Seg_1",
                            (-PALM_W*0.62, -PALM_T*0.45, thumb_base_z + FINGER_L*0.42),
                            (0.018, 0.014, FINGER_L*0.4),
                            MAT_LEATHER, bevel=0.002)
          thumb2.rotation_euler = (0, math.radians(55), 0)
          parts.append(thumb2)

          # ============================================================
          # 5. BLADE MOUNT (slot kunai di punggung lengan)
          # ============================================================
          blade_mount = add_cube("Blade_Mount",
                                  (0, -PALM_T*0.85, ARM_LEN*0.4),
                                  (0.018, 0.010, 0.08),
                                  MAT_METAL, bevel=0.002)
          parts.append(blade_mount)

          # Kunai dummy (bisa dihapus di game engine)
          kunai_blade = add_cube("Kunai_Blade",
                                  (0, -PALM_T*0.95, ARM_LEN*0.4 + 0.04),
                                  (0.006, 0.003, 0.06),
                                  MAT_METAL, bevel=0.001)
          parts.append(kunai_blade)
          kunai_ring = add_cylinder("Kunai_Ring",
                                      (0, -PALM_T*0.95, ARM_LEN*0.4 - 0.04),
                                      0.010, 0.004, MAT_METAL, rot=(math.radians(90),0,0), verts=16)
          parts.append(kunai_ring)

          # ============================================================
          # 6. GABUNG + UV UNWRAP + ORIGIN
          # ============================================================
          bpy.ops.object.select_all(action='DESELECT')
          for p in parts:
              p.select_set(True)
          bpy.context.view_layer.objects.active = parts[0]
          bpy.ops.object.join()
          gauntlet = bpy.context.active_object
          gauntlet.name = "Ninja_Gauntlet"

          # Apply modifiers agar UV unwrap & export bersih
          bpy.ops.object.convert(target='MESH')

          # Smart UV Project
          bpy.ops.object.mode_set(mode='EDIT')
          bpy.ops.mesh.select_all(action='SELECT')
          bpy.ops.uv.smart_project(angle_limit=math.radians(66), island_margin=0.02)
          bpy.ops.object.mode_set(mode='OBJECT')

          # Origin ke tengah agar rotasi turntable rapi
          scene.cursor.location = (0, 0, ARM_LEN*0.5)
          bpy.ops.object.origin_set(type='ORIGIN_CURSOR')
          scene.cursor.location = (0, 0, 0)

          # Shade smooth + auto smooth untuk look AAA
          bpy.ops.object.shade_smooth()
          try:
              gauntlet.data.use_auto_smooth = True
              gauntlet.data.auto_smooth_angle = math.radians(35)
          except AttributeError:
              # Blender 4.1+ pakai modifier Smooth by Angle
              m = gauntlet.modifiers.new("SmoothByAngle", 'SMOOTH_BY_ANGLE')
              if hasattr(m, "angle"): m.angle = math.radians(35)

          # ============================================================
          # 7. STUDIO SETUP (preview AAA)
          # ============================================================
          # Lantai netral
          bpy.ops.mesh.primitive_plane_add(size=2, location=(0, 0, -0.001))
          floor = bpy.context.active_object
          floor.name = "Studio_Floor"
          floor.data.materials.append(make_pbr("StudioGray", (0.18, 0.18, 0.20), rough=0.4))

          # HDRI-like world
          world = bpy.data.worlds.new("World"); scene.world = world
          world.use_nodes = True
          bg = world.node_tree.nodes["Background"]
          bg.inputs["Color"].default_value = (0.05, 0.06, 0.09, 1)
          bg.inputs["Strength"].default_value = 0.4

          # 3-point lighting
          def add_area(name, loc, energy, size, color):
              bpy.ops.object.light_add(type='AREA', location=loc)
              L = bpy.context.active_object
              L.name = name
              L.data.energy = energy
              L.data.size = size
              L.data.color = color
              # Arahkan ke objek
              direction = Vector((0,0,ARM_LEN*0.5)) - L.location
              L.rotation_euler = direction.to_track_quat('-Z','Y').to_euler()
              return L

          add_area("Key",  (0.25, -0.25, 0.35), 60, 0.25, (1.0, 0.95, 0.9))
          add_area("Fill", (-0.30, -0.15, 0.25), 25, 0.30, (0.7, 0.8, 1.0))
          add_area("Rim",  (0.0,   0.30, 0.40), 80, 0.20, (1.0, 0.85, 0.7))

          # Kamera 9:16
          bpy.ops.object.camera_add(location=(0.35, -0.45, 0.28))
          cam = bpy.context.active_object
          direction = Vector((0,0,ARM_LEN*0.55)) - cam.location
          cam.rotation_euler = direction.to_track_quat('-Z','Y').to_euler()
          cam.data.lens = 55
          scene.camera = cam

          # Render settings
          scene.render.engine = 'CYCLES'
          scene.cycles.device = 'CPU'
          scene.cycles.samples = SAMPLES
          scene.cycles.use_denoising = True
          scene.cycles.use_adaptive_sampling = True
          scene.cycles.adaptive_threshold = 0.04
          scene.render.use_persistent_data = True
          scene.render.resolution_x = WIDTH
          scene.render.resolution_y = HEIGHT
          scene.render.fps = 30
          scene.frame_start = SHARD_START
          scene.frame_end   = SHARD_END
          scene.render.image_settings.file_format = 'PNG'
          scene.view_settings.view_transform = 'AgX'  # look AAA filmik
          scene.view_settings.look = 'AgX - Medium High Contrast'

          # ============================================================
          # 8. TURNTABLE ANIMATION
          # ============================================================
          for frame in range(SHARD_START, SHARD_END + 1):
              scene.frame_set(frame)
              t = (frame - 1) / max(1, TOTAL_FRAMES - 1)
              gauntlet.rotation_euler = (0, 0, t * math.tau)
              gauntlet.location = (0, 0, math.sin(t * math.tau) * 0.005)
              scene.render.filepath = f'output/frames/frame_{frame:06d}.png'
              bpy.ops.render.render(write_still=True)

          # ============================================================
          # 9. EXPORT FBX (siap game engine) — hanya di shard 0
          # ============================================================
          if EXPORT_FBX and SHARD_START == 1:
              bpy.ops.object.select_all(action='DESELECT')
              gauntlet.select_set(True)
              bpy.context.view_layer.objects.active = gauntlet
              bpy.ops.export_scene.fbx(
                  filepath='output/export/Ninja_Gauntlet.fbx',
                  use_selection=True,
                  apply_scale_options='FBX_SCALE_ALL',
                  mesh_smooth_type='FACE',
                  bake_anim=False,
              )
              bpy.ops.export_scene.gltf(
                  filepath='output/export/Ninja_Gauntlet.glb',
                  use_selection=True,
                  export_format='GLB',
              )

          print(f"Shard done: frames {SHARD_START}-{SHARD_END}")
          PYEOF

      - name: Run Blender headless
        env:
          FRAME_END: ${{ env.FRAME_END }}
          SAMPLES: ${{ env.SAMPLES }}
          WIDTH: ${{ env.WIDTH }}
          HEIGHT: ${{ env.HEIGHT }}
          SHARD_START: ${{ steps.range.outputs.start }}
          SHARD_END: ${{ steps.range.outputs.end }}
          EXPORT_FBX: ${{ env.EXPORT_FBX }}
        run: |
          blender --background --python-exit-code 1 --python generate_gauntlet.py

      - name: Upload shard frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-shard-${{ matrix.shard }}
          path: output/frames/
          retention-days: 3

      - name: Upload FBX/GLB (jika ada)
        if: hashFiles('output/export/*.fbx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-model-fbx-glb
          path: output/export/
          retention-days: 14

  combine:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/download-artifact@v4
        with:
          pattern: frames-shard-*
          path: all_frames_downloads
          merge-multiple: false

      - name: Merge & renumber frames
        run: |
          mkdir -p all_frames
          python3 << 'PYEOF'
          import glob, os, re, shutil
          files = glob.glob('all_frames_downloads/**/frame_*.png', recursive=True)
          def num(p):
              m = re.search(r'frame_(\d+)\.png$', os.path.basename(p))
              return int(m.group(1)) if m else None
          nf = sorted([(num(f), f) for f in files if num(f) is not None], key=lambda x: x[0])
          seen, idx = set(), 1
          for n, f in nf:
              if n in seen: continue
              seen.add(n)
              shutil.copy2(f, f"all_frames/frame_{idx:06d}.png")
              idx += 1
          print(f"Total unik: {len(seen)}")
          PYEOF

      - name: Verify
        run: |
          c=$(ls all_frames/frame_*.png 2>/dev/null | wc -l)
          echo "Frames: $c"
          [ "$c" -ge 2 ] || { echo "::error::Frame < 2"; exit 1; }

      - name: Encode MP4
        run: |
          mkdir -p output
          ffmpeg -y -framerate 30 -start_number 1 \
            -i 'all_frames/frame_%06d.png' \
            -c:v libx264 -pix_fmt yuv420p -crf 16 -preset slow \
            output/ninja_gauntlet_preview.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: output/ninja_gauntlet_preview.mp4
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: frames-png-merged
          path: all_frames/
          retention-days: 14
