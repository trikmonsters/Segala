name: Render Premium Stickman Cinematic

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Durasi video (detik, 6-15)'
        required: true
        default: '10'
        type: string

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ===============================================================
      # 1. package.json
      # ===============================================================
      - name: Create package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "premium-stickman",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "render": "remotion render PremiumStickman out/premium.mp4"
            },
            "dependencies": {
              "@remotion/cli": "4.0.230",
              "@remotion/google-fonts": "4.0.230",
              "@remotion/shapes": "4.0.230",
              "@remotion/noise": "4.0.230",
              "@remotion/paths": "4.0.230",
              "react": "18.3.1",
              "react-dom": "18.3.1",
              "remotion": "4.0.230"
            },
            "devDependencies": {
              "@types/react": "18.3.3",
              "typescript": "5.5.4"
            }
          }
          EOF

      # ===============================================================
      # 2. tsconfig.json
      # ===============================================================
      - name: Create tsconfig.json
        run: |
          cat > tsconfig.json << 'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "lib": ["DOM", "ES2020"],
              "jsx": "react-jsx",
              "module": "ESNext",
              "moduleResolution": "node",
              "strict": true,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true,
              "noEmit": true
            }
          }
          EOF

      # ===============================================================
      # 3. remotion.config.ts
      # ===============================================================
      - name: Create remotion.config.ts
        run: |
          cat > remotion.config.ts << 'EOF'
          import { Config } from '@remotion/cli/config';

          Config.setVideoImageFormat('jpeg');
          Config.setJpegQuality(95);
          Config.setOverwriteOutput(true);
          Config.setCodec('h264');
          Config.setCrf(16);
          Config.setPixelFormat('yuv420p');
          Config.setColorSpace('bt709');
          EOF

      # ===============================================================
      # 4. src/index.ts
      # ===============================================================
      - name: Create src/index.ts
        run: |
          mkdir -p src
          cat > src/index.ts << 'EOF'
          import { registerRoot } from 'remotion';
          import { RemotionRoot } from './Root';

          registerRoot(RemotionRoot);
          EOF

      # ===============================================================
      # 5. src/Root.tsx  (10 detik @ 30fps = 300 frame, 9:16)
      # ===============================================================
      - name: Create src/Root.tsx
        run: |
          cat > src/Root.tsx << 'EOF'
          import { Composition } from 'remotion';
          import { PremiumStickman } from './PremiumStickman';

          export const RemotionRoot: React.FC = () => {
            return (
              <>
                <Composition
                  id="PremiumStickman"
                  component={PremiumStickman}
                  durationInFrames={300}
                  fps={30}
                  width={1080}
                  height={1920}
                  defaultProps={{}}
                />
              </>
            );
          };
          EOF

      # ===============================================================
      # 6. src/PremiumStickman.tsx
      #    - Cinematic stickman (SVG dengan gradient + glow)
      #    - Particle gold floating
      #    - Kinetic typography premium
      #    - Camera shake + zoom (dolly)
      #    - Vignette + film grain + light sweep
      # ===============================================================
      - name: Create src/PremiumStickman.tsx
        run: |
          cat > src/PremiumStickman.tsx << 'EOF'
          import React, { useMemo } from 'react';
          import {
            AbsoluteFill,
            interpolate,
            spring,
            useCurrentFrame,
            useVideoConfig,
            Sequence,
            Easing,
            random,
          } from 'remotion';
          import { noise2D } from '@remotion/noise';

          // =============================================================
          // KONFIGURASI TEMA PREMIUM
          // =============================================================
          const THEME = {
            gold: '#D4AF37',
            goldLight: '#F5E6A8',
            goldDeep: '#8B6914',
            ink: '#0A0A0F',
            inkSoft: '#14141C',
            cream: '#F5F0E1',
            accent: '#C9A227',
          };

          // =============================================================
          // BACKGROUND: gradient mesh + bokeh + light sweep
          // =============================================================
          const CinematicBackground: React.FC = () => {
            const frame = useCurrentFrame();

            // Slow drift light sweep
            const sweepX = interpolate(frame, [0, 300], [-30, 130]);

            return (
              <AbsoluteFill style={{ background: THEME.ink }}>
                {/* Radial gradient utama - gold glow dari tengah belakang */}
                <AbsoluteFill
                  style={{
                    background: `radial-gradient(ellipse 70% 55% at 50% 45%, ${THEME.goldDeep}55 0%, transparent 70%)`,
                  }}
                />

                {/* Radial vignette dark */}
                <AbsoluteFill
                  style={{
                    background:
                      'radial-gradient(ellipse at center, transparent 30%, #000000 100%)',
                    opacity: 0.85,
                  }}
                />

                {/* Bokeh gold lembut - parallax */}
                {Array.from({ length: 18 }).map((_, i) => {
                  const seed = i * 7.3;
                  const x = random(`bx-${i}`) * 1080;
                  const y = random(`by-${i}`) * 1920;
                  const size = 60 + random(`bs-${i}`) * 220;
                  const drift = Math.sin(frame * 0.012 + seed) * 60;
                  const opacity = 0.04 + random(`bo-${i}`) * 0.09;
                  return (
                    <div
                      key={i}
                      style={{
                        position: 'absolute',
                        left: x + drift,
                        top: y + drift * 0.4,
                        width: size,
                        height: size,
                        borderRadius: '50%',
                        background: `radial-gradient(circle, ${THEME.gold} 0%, transparent 70%)`,
                        opacity,
                        filter: 'blur(20px)',
                      }}
                    />
                  );
                })}

                {/* Light sweep diagonal */}
                <div
                  style={{
                    position: 'absolute',
                    top: '-50%',
                    left: `${sweepX}%`,
                    width: '40%',
                    height: '200%',
                    background: `linear-gradient(90deg, transparent, ${THEME.goldLight}22, transparent)`,
                    transform: 'rotate(15deg)',
                    filter: 'blur(40px)',
                  }}
                />
              </AbsoluteFill>
            );
          };

          // =============================================================
          // PARTICLE GOLD FLOATING (motion premium)
          // =============================================================
          const GoldParticles: React.FC = () => {
            const frame = useCurrentFrame();
            const count = 40;

            return (
              <AbsoluteFill>
                {Array.from({ length: count }).map((_, i) => {
                  const baseX = random(`px-${i}`) * 1080;
                  const baseY = random(`py-${i}`) * 1920;
                  const speed = 0.4 + random(`ps-${i}`) * 1.6;
                  const size = 2 + random(`pz-${i}`) * 5;
                  const y = (baseY - frame * speed) % 1920;
                  const xWobble =
                    Math.sin(frame * 0.03 + i) * 40;
                  const opacity =
                    (0.3 + random(`po-${i}`) * 0.7) *
                    interpolate(
                      y,
                      [0, 200, 1700, 1920],
                      [0, 1, 1, 0],
                      { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' }
                    );
                  return (
                    <div
                      key={i}
                      style={{
                        position: 'absolute',
                        left: baseX + xWobble,
                        top: y < 0 ? y + 1920 : y,
                        width: size,
                        height: size,
                        borderRadius: '50%',
                        background: THEME.goldLight,
                        boxShadow: `0 0 ${size * 4}px ${THEME.gold}, 0 0 ${
                          size * 8
                        }px ${THEME.gold}66`,
                        opacity,
                      }}
                    />
                  );
                })}
              </AbsoluteFill>
            );
          };

          // =============================================================
          // STICKMAN PREMIUM
          // - Gradien gold pada garis tubuh
          // - Glow lembut
          // - Detail: mata glow, aksen
          // =============================================================
          const PremiumStickman: React.FC<{
            armLeft: number;
            armRight: number;
            legLeft: number;
            legRight: number;
            headTilt: number;
            glow: number;
          }> = ({ armLeft, armRight, legLeft, legRight, headTilt, glow }) => {
            return (
              <svg
                viewBox="-140 -220 280 440"
                width={520}
                height={820}
                style={{
                  overflow: 'visible',
                  filter: `drop-shadow(0 0 24px ${THEME.gold}${Math.round(
                    glow * 200
                  )
                    .toString(16)
                    .padStart(2, '0')}) drop-shadow(0 0 60px ${THEME.gold}66)`,
                }}
              >
                <defs>
                  <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor={THEME.goldLight} />
                    <stop offset="50%" stopColor={THEME.gold} />
                    <stop offset="100%" stopColor={THEME.goldDeep} />
                  </linearGradient>
                  <radialGradient id="headGrad" cx="0.4" cy="0.35">
                    <stop offset="0%" stopColor={THEME.goldLight} />
                    <stop offset="60%" stopColor={THEME.gold} />
                    <stop offset="100%" stopColor={THEME.goldDeep} />
                  </radialGradient>
                  <filter id="softGlow">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feMerge>
                      <feMergeNode in="blur" />
                      <feMergeNode in="SourceGraphic" />
                    </feMerge>
                  </filter>
                </defs>

                <g
                  stroke="url(#bodyGrad)"
                  strokeWidth={11}
                  strokeLinecap="round"
                  fill="none"
                  filter="url(#softGlow)"
                >
                  {/* Kepala dengan gradien */}
                  <circle
                    cx={0}
                    cy={-150}
                    r={52}
                    fill="url(#headGrad)"
                    stroke={THEME.goldDeep}
                    strokeWidth={4}
                  />

                  {/* Mata glow */}
                  <circle cx={-18} cy={-160} r={6} fill={THEME.ink} stroke="none" />
                  <circle cx={18} cy={-160} r={6} fill={THEME.ink} stroke="none" />
                  <circle cx={-18} cy={-160} r={2.5} fill={THEME.goldLight} stroke="none" />
                  <circle cx={18} cy={-160} r={2.5} fill={THEME.goldLight} stroke="none" />

                  {/* Mulut confident */}
                  <path
                    d="M -20 -128 Q 0 -114 20 -128"
                    stroke={THEME.ink}
                    strokeWidth={4}
                    fill="none"
                  />

                  {/* Badan */}
                  <line x1={0} y1={-95} x2={0} y2={70} />

                  {/* Tangan kiri */}
                  <g transform={`rotate(${armLeft} 0 -70)`}>
                    <line x1={0} y1={-70} x2={-85} y2={25} />
                  </g>
                  {/* Tangan kanan */}
                  <g transform={`rotate(${armRight} 0 -70)`}>
                    <line x1={0} y1={-70} x2={85} y2={25} />
                  </g>

                  {/* Kaki kiri */}
                  <g transform={`rotate(${legLeft} 0 70)`}>
                    <line x1={0} y1={70} x2={-55} y2={185} />
                  </g>
                  {/* Kaki kanan */}
                  <g transform={`rotate(${legRight} 0 70)`}>
                    <line x1={0} y1={70} x2={55} y2={185} />
                  </g>
                </g>
              </svg>
            );
          };

          // =============================================================
          // KINETIC TYPOGRAPHY PREMIUM
          // =============================================================
          const KineticText: React.FC<{
            text: string;
            delay: number;
            size?: number;
            letterSpacing?: number;
            variant?: 'hero' | 'sub' | 'tag';
          }> = ({ text, delay, size = 130, letterSpacing = -2, variant = 'hero' }) => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();

            const chars = text.split('');
            const baseStyle: React.CSSProperties = {
              fontFamily:
                variant === 'hero'
                  ? '"Times New Roman", Georgia, serif'
                  : 'Inter, Helvetica, Arial, sans-serif',
              fontWeight: variant === 'hero' ? 900 : 600,
              fontSize: size,
              letterSpacing,
              lineHeight: 0.95,
              color: THEME.cream,
              textTransform: 'uppercase',
            };

            return (
              <div style={{ display: 'flex', justifyContent: 'center', flexWrap: 'wrap' }}>
                {chars.map((c, i) => {
                  const s = spring({
                    frame: frame - delay - i * 2,
                    fps,
                    config: { damping: 12, stiffness: 120 },
                  });
                  const y = interpolate(s, [0, 1], [60, 0]);
                  const o = interpolate(s, [0, 0.6], [0, 1], {
                    extrapolateLeft: 'clamp',
                    extrapolateRight: 'clamp',
                  });
                  const blur = interpolate(s, [0, 1], [12, 0]);
                  return (
                    <span
                      key={i}
                      style={{
                        ...baseStyle,
                        display: 'inline-block',
                        transform: `translateY(${y}px)`,
                        opacity: o,
                        filter: `blur(${blur}px)`,
                        color: variant === 'hero' ? THEME.cream : THEME.gold,
                        textShadow:
                          variant === 'hero'
                            ? `0 0 40px ${THEME.gold}44`
                            : 'none',
                      }}
                    >
                      {c === ' ' ? '\u00A0' : c}
                    </span>
                  );
                })}
              </div>
            );
          };

          // =============================================================
          // GARIS EMAS DEKORATIF (sub-ornament)
          // =============================================================
          const GoldDivider: React.FC<{ delay: number; width?: number }> = ({
            delay,
            width = 420,
          }) => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();
            const s = spring({ frame: frame - delay, fps, config: { damping: 20 } });
            const w = interpolate(s, [0, 1], [0, width]);
            return (
              <div
                style={{
                  height: 2,
                  width: w,
                  background: `linear-gradient(90deg, transparent, ${THEME.gold}, transparent)`,
                  boxShadow: `0 0 20px ${THEME.gold}88`,
                  margin: '28px auto',
                }}
              />
            );
          };

          // =============================================================
          // FILM GRAIN + VIGNETTE (post-processing feel)
          // =============================================================
          const FilmGrain: React.FC = () => {
            const frame = useCurrentFrame();
            const opacity = 0.06 + Math.abs(noise2D('grain', frame, 0)) * 0.04;
            return (
              <AbsoluteFill
                style={{
                  backgroundImage:
                    'url("data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22 numOctaves=%222%22/></filter><rect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/></svg>")',
                  opacity,
                  mixBlendMode: 'overlay',
                  pointerEvents: 'none',
                }}
              />
            );
          };

          // =============================================================
          // KOMPONEN UTAMA
          // =============================================================
          export const PremiumStickman: React.FC = () => {
            const frame = useCurrentFrame();
            const { fps, durationInFrames } = useVideoConfig();

            // -------- CAMERA SHAKE (noise based, halus) --------
            const shakeX = noise2D('sx', frame * 0.05, 0) * 6;
            const shakeY = noise2D('sy', frame * 0.05, 0) * 6;

            // -------- DOLLY ZOOM (slow push-in) --------
            const zoom = interpolate(
              frame,
              [0, durationInFrames],
              [1.08, 1.0],
              { easing: Easing.bezier(0.4, 0, 0.2, 1) }
            );

            // -------- ENTRANCE STICKMAN --------
            const entry = spring({
              frame: frame - 20,
              fps,
              config: { damping: 14, stiffness: 90 },
            });
            const translateY = interpolate(entry, [0, 1], [420, 0]);

            // -------- ANIMASI TUBUH --------
            const breathe = Math.sin(frame * 0.06) * 2;
            const confidentSway = Math.sin(frame * 0.045) * 6;

            // Fase 1 (0-120): pose diam elegan
            // Fase 2 (120-180): angkat tangan (flex)
            // Fase 3 (180-240): tunjuk ke kamera
            // Fase 4 (240-300): turunkan tangan, sikap akhir

            const flexSpring = spring({
              frame: frame - 120,
              fps,
              config: { damping: 12, stiffness: 110 },
            });
            const pointSpring = spring({
              frame: frame - 190,
              fps,
              config: { damping: 12, stiffness: 130 },
            });
            const restSpring = spring({
              frame: frame - 255,
              fps,
              config: { damping: 14, stiffness: 100 },
            });

            let armLeft = -10 + confidentSway;
            let armRight = 10 - confidentSway;
            let headTilt = confidentSway * 0.2;

            // Fase flex: kedua tangan ke atas
            armLeft += interpolate(flexSpring, [0, 1], [0, -130]);
            armRight += interpolate(flexSpring, [0, 1], [0, 130]);

            // Fase point: tangan kanan menunjuk ke kamera (ke bawah)
            const pointAmount = interpolate(pointSpring, [0, 1], [0, 1]) *
              interpolate(restSpring, [0, 1], [1, 0]);
            armRight += pointAmount * -60;
            headTilt += pointAmount * 6;

            // Rest: kembali netral
            const restAmount = interpolate(restSpring, [0, 1], [0, 1]);
            armLeft = armLeft * (1 - restAmount * 0.6);
            armRight = armRight * (1 - restAmount * 0.6);

            const legLeft = Math.sin(frame * 0.05) * 3;
            const legRight = -Math.sin(frame * 0.05) * 3;

            // Glow intensity naik saat flex
            const glow = 0.35 + interpolate(flexSpring, [0, 1], [0, 0.5]);

            // -------- TEKS PREMIUM (kinetic) --------
            // Frame 0-90: hero text "MOVE IN SILENCE"
            // Frame 90-180: "LET RESULTS SPEAK"
            // Frame 180-300: "@YOURHANDLE"

            return (
              <AbsoluteFill
                style={{
                  background: THEME.ink,
                  transform: `scale(${zoom}) translate(${shakeX}px, ${shakeY}px)`,
                  overflow: 'hidden',
                }}
              >
                <CinematicBackground />
                <GoldParticles />

                {/* STICKMAN - center, sedikit ke bawah */}
                <AbsoluteFill
                  style={{
                    justifyContent: 'center',
                    alignItems: 'center',
                  }}
                >
                  <div
                    style={{
                      transform: `translateY(${translateY + breathe}px)`,
                      marginTop: 160,
                    }}
                  >
                    <PremiumStickman
                      armLeft={armLeft}
                      armRight={armRight}
                      legLeft={legLeft}
                      legRight={legRight}
                      headTilt={headTilt}
                      glow={glow}
                    />
                  </div>
                </AbsoluteFill>

                {/* TEKS HERO - atas */}
                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-start',
                    alignItems: 'center',
                    paddingTop: 180,
                  }}
                >
                  <Sequence from={0} durationInFrames={95}>
                    <KineticText text="MOVE IN" delay={10} size={140} />
                    <KineticText text="SILENCE" delay={26} size={140} />
                  </Sequence>

                  <Sequence from={95} durationInFrames={90}>
                    <KineticText text="LET" delay={0} size={140} />
                    <KineticText text="RESULTS" delay={10} size={140} />
                    <KineticText text="SPEAK" delay={26} size={140} />
                  </Sequence>

                  <Sequence from={185} durationInFrames={115}>
                    <KineticText text="@YOURHANDLE" delay={0} size={72} variant="sub" />
                    <GoldDivider delay={20} width={520} />
                    <KineticText text="PREMIUM SERIES" delay={40} size={40} variant="tag" />
                  </Sequence>
                </AbsoluteFill>

                {/* Subtitle bawah - selalu ada */}
                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-end',
                    alignItems: 'center',
                    paddingBottom: 120,
                  }}
                >
                  <div
                    style={{
                      fontFamily: 'Inter, Helvetica, Arial, sans-serif',
                      fontSize: 26,
                      letterSpacing: 8,
                      color: THEME.gold,
                      opacity: interpolate(frame, [0, 30], [0, 1], {
                        extrapolateRight: 'clamp',
                      }),
                      textTransform: 'uppercase',
                      fontWeight: 500,
                    }}
                  >
                    · CINEMATIC · MINDSET · 2026 ·
                  </div>
                </AbsoluteFill>

                {/* Post processing overlay */}
                <FilmGrain />

                {/* Vignette final (di atas semua) */}
                <AbsoluteFill
                  style={{
                    background:
                      'radial-gradient(ellipse at center, transparent 40%, #000000cc 100%)',
                    pointerEvents: 'none',
                  }}
                />
              </AbsoluteFill>
            );
          };
          EOF

      # ===============================================================
      # 7. Install
      # ===============================================================
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ===============================================================
      # 8. Render
      # ===============================================================
      - name: Render video
        run: |
          npx remotion render PremiumStickman out/premium.mp4 \
            --codec=h264 \
            --crf=16 \
            --concurrency=2 \
            --pixel-format=yuv420p

      # ===============================================================
      # 9. Upload artifact
      # ===============================================================
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: premium-stickman-cinematic
          path: out/premium.mp4
          retention-days: 7
