name: Render Premium Cinematic Stickman

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi release (mis: v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      title:
        description: 'Judul release'
        required: true
        default: 'Premium Cinematic Stickman'
        type: string

permissions:
  contents: write

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ===============================================================
      # 1. package.json
      # ===============================================================
      - name: Create package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "premium-cinematic-stickman",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "render": "remotion render PremiumCinematic out/premium.mp4"
            },
            "dependencies": {
              "@remotion/cli": "4.0.230",
              "@remotion/noise": "4.0.230",
              "react": "18.3.1",
              "react-dom": "18.3.1",
              "remotion": "4.0.230"
            },
            "devDependencies": {
              "@types/react": "18.3.3",
              "typescript": "5.5.4"
            }
          }
          EOF

      # ===============================================================
      # 2. tsconfig.json
      # ===============================================================
      - name: Create tsconfig.json
        run: |
          cat > tsconfig.json << 'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "lib": ["DOM", "ES2020"],
              "jsx": "react-jsx",
              "module": "ESNext",
              "moduleResolution": "node",
              "strict": true,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true,
              "noEmit": true
            }
          }
          EOF

      # ===============================================================
      # 3. remotion.config.ts
      # ===============================================================
      - name: Create remotion.config.ts
        run: |
          cat > remotion.config.ts << 'EOF'
          import { Config } from '@remotion/cli/config';

          Config.setVideoImageFormat('jpeg');
          Config.setJpegQuality(98);
          Config.setOverwriteOutput(true);
          Config.setCodec('h264');
          Config.setCrf(15);
          Config.setPixelFormat('yuv420p');
          Config.setColorSpace('bt709');
          EOF

      # ===============================================================
      # 4. src/index.ts
      # ===============================================================
      - name: Create src/index.ts
        run: |
          mkdir -p src
          cat > src/index.ts << 'EOF'
          import { registerRoot } from 'remotion';
          import { RemotionRoot } from './Root';

          registerRoot(RemotionRoot);
          EOF

      # ===============================================================
      # 5. src/Root.tsx  (12s @ 30fps = 360 frame, 1080x1920)
      # ===============================================================
      - name: Create src/Root.tsx
        run: |
          cat > src/Root.tsx << 'EOF'
          import { Composition } from 'remotion';
          import { PremiumCinematic } from './PremiumCinematic';

          export const RemotionRoot: React.FC = () => {
            return (
              <>
                <Composition
                  id="PremiumCinematic"
                  component={PremiumCinematic}
                  durationInFrames={360}
                  fps={30}
                  width={1080}
                  height={1920}
                  defaultProps={{}}
                />
              </>
            );
          };
          EOF

      # ===============================================================
      # 6. src/theme.ts
      # ===============================================================
      - name: Create src/theme.ts
        run: |
          cat > src/theme.ts << 'EOF'
          export const THEME = {
            gold: '#D4AF37',
            goldLight: '#F5E6A8',
            goldBright: '#FFE9A0',
            goldDeep: '#8B6914',
            ink: '#07070B',
            inkSoft: '#12121A',
            cream: '#F5F0E1',
            champagne: '#E8D8B0',
            shadow: '#000000',
          } as const;
          EOF

      # ===============================================================
      # 7. src/atoms.tsx  (background, particle, overlay)
      # ===============================================================
      - name: Create src/atoms.tsx
        run: |
          cat > src/atoms.tsx << 'EOF'
          import React from 'react';
          import { AbsoluteFill, interpolate, useCurrentFrame } from 'remotion';
          import { noise2D } from '@remotion/noise';
          import { THEME } from './theme';

          export const CinematicBackground: React.FC<{ intensity?: number }> = ({
            intensity = 1,
          }) => {
            const frame = useCurrentFrame();
            const sweepX = interpolate(frame, [0, 360], [-40, 140], {
              extrapolateRight: 'clamp',
            });

            return (
              <AbsoluteFill style={{ background: THEME.ink }}>
                <AbsoluteFill
                  style={{
                    background: `radial-gradient(ellipse 75% 55% at 50% 42%, ${THEME.goldDeep}66 0%, transparent 68%)`,
                    opacity: intensity,
                  }}
                />
                {Array.from({ length: 24 }).map((_, i) => {
                  const seed = i * 5.37;
                  const x = (Math.sin(seed) * 0.5 + 0.5) * 1080;
                  const y = (Math.cos(seed * 1.7) * 0.5 + 0.5) * 1920;
                  const size = 80 + Math.abs(Math.sin(seed * 2.1)) * 260;
                  const drift = Math.sin(frame * 0.008 + seed) * 80;
                  const opacity =
                    (0.03 + Math.abs(Math.cos(seed)) * 0.07) * intensity;
                  return (
                    <div
                      key={`bokeh-${i}`}
                      style={{
                        position: 'absolute',
                        left: x + drift,
                        top: y + drift * 0.3,
                        width: size,
                        height: size,
                        borderRadius: '50%',
                        background: `radial-gradient(circle, ${THEME.gold} 0%, transparent 72%)`,
                        opacity,
                        filter: 'blur(28px)',
                      }}
                    />
                  );
                })}
                <div
                  style={{
                    position: 'absolute',
                    top: '-60%',
                    left: `${sweepX}%`,
                    width: '42%',
                    height: '220%',
                    background: `linear-gradient(90deg, transparent 0%, ${THEME.goldBright}1f 45%, transparent 100%)`,
                    transform: 'rotate(14deg)',
                    filter: 'blur(48px)',
                    opacity: intensity,
                  }}
                />
                <AbsoluteFill
                  style={{
                    backgroundImage:
                      'linear-gradient(rgba(212,175,55,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(212,175,55,0.035) 1px, transparent 1px)',
                    backgroundSize: '90px 90px',
                    opacity: 0.6 * intensity,
                  }}
                />
              </AbsoluteFill>
            );
          };

          export const GoldParticles: React.FC<{ count?: number }> = ({
            count = 55,
          }) => {
            const frame = useCurrentFrame();
            return (
              <AbsoluteFill>
                {Array.from({ length: count }).map((_, i) => {
                  const seed = i * 3.19;
                  const baseX = (Math.sin(seed) * 0.5 + 0.5) * 1080;
                  const baseY = (Math.cos(seed * 1.3) * 0.5 + 0.5) * 1920;
                  const speed = 0.3 + Math.abs(Math.sin(seed * 0.7)) * 1.8;
                  const size = 2 + Math.abs(Math.cos(seed)) * 5;
                  const y = (baseY - frame * speed) % 1920;
                  const xWobble = Math.sin(frame * 0.025 + i) * 45;
                  const flicker = 0.5 + 0.5 * Math.sin(frame * 0.15 + i);
                  const opacity =
                    (0.35 + Math.abs(Math.sin(seed)) * 0.65) *
                    flicker *
                    interpolate(y, [0, 200, 1700, 1920], [0, 1, 1, 0], {
                      extrapolateLeft: 'clamp',
                      extrapolateRight: 'clamp',
                    });
                  return (
                    <div
                      key={`p-${i}`}
                      style={{
                        position: 'absolute',
                        left: baseX + xWobble,
                        top: y < 0 ? y + 1920 : y,
                        width: size,
                        height: size,
                        borderRadius: '50%',
                        background: THEME.goldLight,
                        boxShadow: `0 0 ${size * 4}px ${THEME.gold}, 0 0 ${
                          size * 10
                        }px ${THEME.gold}55`,
                        opacity,
                      }}
                    />
                  );
                })}
              </AbsoluteFill>
            );
          };

          export const FilmGrain: React.FC = () => {
            const frame = useCurrentFrame();
            const opacity = 0.055 + Math.abs(noise2D('grain', frame * 0.7, 0)) * 0.04;
            return (
              <AbsoluteFill
                style={{
                  backgroundImage:
                    'url("data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22 numOctaves=%222%22/></filter><rect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/></svg>")',
                  opacity,
                  mixBlendMode: 'overlay',
                  pointerEvents: 'none',
                }}
              />
            );
          };

          export const Letterbox: React.FC<{ barHeight?: number }> = ({
            barHeight = 90,
          }) => (
            <>
              <div
                style={{
                  position: 'absolute',
                  top: 0,
                  left: 0,
                  right: 0,
                  height: barHeight,
                  background: '#000',
                  zIndex: 40,
                }}
              />
              <div
                style={{
                  position: 'absolute',
                  bottom: 0,
                  left: 0,
                  right: 0,
                  height: barHeight,
                  background: '#000',
                  zIndex: 40,
                }}
              />
            </>
          );

          export const VignetteLayer: React.FC = () => (
            <>
              <AbsoluteFill
                style={{
                  background:
                    'radial-gradient(ellipse at center, transparent 42%, #000000dd 100%)',
                  pointerEvents: 'none',
                  zIndex: 30,
                }}
              />
              <AbsoluteFill
                style={{
                  background:
                    'linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.45) 100%)',
                  pointerEvents: 'none',
                  zIndex: 31,
                }}
              />
            </>
          );

          export const LensFlare: React.FC<{
            x?: number;
            y?: number;
            size?: number;
          }> = ({ x = 70, y = 25, size = 500 }) => {
            const frame = useCurrentFrame();
            const pulse = 0.9 + 0.1 * Math.sin(frame * 0.06);
            return (
              <div
                style={{
                  position: 'absolute',
                  left: `${x}%`,
                  top: `${y}%`,
                  width: size * pulse,
                  height: size * pulse,
                  transform: 'translate(-50%, -50%)',
                  background: `radial-gradient(circle, ${THEME.goldBright}aa 0%, ${THEME.gold}44 30%, transparent 70%)`,
                  filter: 'blur(18px)',
                  opacity: 0.55,
                  pointerEvents: 'none',
                  zIndex: 25,
                  mixBlendMode: 'screen',
                }}
              />
            );
          };
          EOF

      # ===============================================================
      # 8. src/StickmanFigure.tsx
      # ===============================================================
      - name: Create src/StickmanFigure.tsx
        run: |
          cat > src/StickmanFigure.tsx << 'EOF'
          import React from 'react';
          import { THEME } from './theme';

          export const StickmanFigure: React.FC<{
            armLeft: number;
            armRight: number;
            legLeft: number;
            legRight: number;
            headTilt: number;
            glow: number;
            scale?: number;
          }> = ({ armLeft, armRight, legLeft, legRight, headTilt, glow, scale = 1 }) => {
            const glowAlpha = Math.round(glow * 220)
              .toString(16)
              .padStart(2, '0');

            return (
              <svg
                viewBox="-160 -240 320 480"
                width={560 * scale}
                height={880 * scale}
                style={{
                  overflow: 'visible',
                  filter: `drop-shadow(0 0 24px ${THEME.gold}${glowAlpha}) drop-shadow(0 0 70px ${THEME.gold}66) drop-shadow(0 30px 40px rgba(0,0,0,0.55))`,
                }}
              >
                <defs>
                  <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor={THEME.goldBright} />
                    <stop offset="35%" stopColor={THEME.gold} />
                    <stop offset="100%" stopColor={THEME.goldDeep} />
                  </linearGradient>
                  <radialGradient id="headGrad" cx="0.35" cy="0.3">
                    <stop offset="0%" stopColor={THEME.goldBright} />
                    <stop offset="55%" stopColor={THEME.gold} />
                    <stop offset="100%" stopColor={THEME.goldDeep} />
                  </radialGradient>
                  <linearGradient id="bodySheen" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0" />
                    <stop offset="45%" stopColor="#FFFFFF" stopOpacity="0.55" />
                    <stop offset="55%" stopColor="#FFFFFF" stopOpacity="0.55" />
                    <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0" />
                  </linearGradient>
                  <filter id="softGlow">
                    <feGaussianBlur stdDeviation="2.6" result="blur" />
                    <feMerge>
                      <feMergeNode in="blur" />
                      <feMergeNode in="SourceGraphic" />
                    </feMerge>
                  </filter>
                </defs>

                <ellipse
                  cx={0}
                  cy={210}
                  rx={120}
                  ry={16}
                  fill={THEME.shadow}
                  opacity={0.55}
                  style={{ filter: 'blur(10px)' }}
                />

                <g
                  stroke="url(#bodyGrad)"
                  strokeWidth={12}
                  strokeLinecap="round"
                  fill="none"
                  filter="url(#softGlow)"
                  transform={`rotate(${headTilt} 0 -155)`}
                >
                  <circle
                    cx={0}
                    cy={-155}
                    r={54}
                    fill="url(#headGrad)"
                    stroke={THEME.goldDeep}
                    strokeWidth={4}
                  />
                  <ellipse
                    cx={-14}
                    cy={-180}
                    rx={20}
                    ry={10}
                    fill="#FFFFFF"
                    opacity={0.35}
                    stroke="none"
                  />
                  <circle cx={-19} cy={-165} r={6.5} fill={THEME.ink} stroke="none" />
                  <circle cx={19} cy={-165} r={6.5} fill={THEME.ink} stroke="none" />
                  <circle cx={-19} cy={-165} r={2.6} fill={THEME.goldBright} stroke="none" />
                  <circle cx={19} cy={-165} r={2.6} fill={THEME.goldBright} stroke="none" />
                  <path
                    d="M -22 -132 Q 0 -116 22 -132"
                    stroke={THEME.ink}
                    strokeWidth={4.5}
                    fill="none"
                  />
                  <line x1={0} y1={-100} x2={0} y2={72} />
                  <g transform={`rotate(${armLeft} 0 -72)`}>
                    <line x1={0} y1={-72} x2={-88} y2={28} />
                  </g>
                  <g transform={`rotate(${armRight} 0 -72)`}>
                    <line x1={0} y1={-72} x2={88} y2={28} />
                  </g>
                  <g transform={`rotate(${legLeft} 0 72)`}>
                    <line x1={0} y1={72} x2={-58} y2={190} />
                  </g>
                  <g transform={`rotate(${legRight} 0 72)`}>
                    <line x1={0} y1={72} x2={58} y2={190} />
                  </g>
                  <line
                    x1={0}
                    y1={-100}
                    x2={0}
                    y2={72}
                    stroke="url(#bodySheen)"
                    strokeWidth={5}
                    opacity={0.5}
                  />
                </g>
              </svg>
            );
          };
          EOF

      # ===============================================================
      # 9. src/Typography.tsx
      # ===============================================================
      - name: Create src/Typography.tsx
        run: |
          cat > src/Typography.tsx << 'EOF'
          import React from 'react';
          import { interpolate, spring, useCurrentFrame, useVideoConfig } from 'remotion';
          import { THEME } from './theme';

          export const KineticText: React.FC<{
            text: string;
            delay: number;
            size?: number;
            letterSpacing?: number;
            variant?: 'hero' | 'sub' | 'tag';
            stagger?: number;
          }> = ({
            text,
            delay,
            size = 130,
            letterSpacing = -2,
            variant = 'hero',
            stagger = 2,
          }) => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();
            const chars = text.split('');
            const baseStyle: React.CSSProperties = {
              fontFamily:
                variant === 'hero'
                  ? '"Times New Roman", Georgia, serif'
                  : 'Inter, Helvetica, Arial, sans-serif',
              fontWeight: variant === 'hero' ? 900 : variant === 'sub' ? 700 : 500,
              fontSize: size,
              letterSpacing,
              lineHeight: 0.92,
              color: THEME.cream,
              textTransform: 'uppercase',
            };

            return (
              <div
                style={{
                  display: 'flex',
                  justifyContent: 'center',
                  flexWrap: 'wrap',
                  textAlign: 'center',
                }}
              >
                {chars.map((c, i) => {
                  const s = spring({
                    frame: frame - delay - i * stagger,
                    fps,
                    config: { damping: 12, stiffness: 120 },
                  });
                  const y = interpolate(s, [0, 1], [70, 0]);
                  const o = interpolate(s, [0, 0.55], [0, 1], {
                    extrapolateLeft: 'clamp',
                    extrapolateRight: 'clamp',
                  });
                  const blur = interpolate(s, [0, 1], [14, 0]);
                  const rot = interpolate(s, [0, 1], [8, 0]);
                  return (
                    <span
                      key={i}
                      style={{
                        ...baseStyle,
                        display: 'inline-block',
                        transform: `translateY(${y}px) rotate(${rot}deg)`,
                        opacity: o,
                        filter: `blur(${blur}px)`,
                        color:
                          variant === 'hero'
                            ? THEME.cream
                            : variant === 'sub'
                            ? THEME.gold
                            : THEME.champagne,
                        textShadow:
                          variant === 'hero'
                            ? `0 0 50px ${THEME.gold}55, 0 2px 8px rgba(0,0,0,0.6)`
                            : `0 0 30px ${THEME.gold}33`,
                      }}
                    >
                      {c === ' ' ? '\u00A0' : c}
                    </span>
                  );
                })}
              </div>
            );
          };

          export const GoldDivider: React.FC<{ delay: number; width?: number }> = ({
            delay,
            width = 420,
          }) => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();
            const s = spring({ frame: frame - delay, fps, config: { damping: 20 } });
            const w = interpolate(s, [0, 1], [0, width]);
            return (
              <div
                style={{
                  height: 2,
                  width: w,
                  background: `linear-gradient(90deg, transparent, ${THEME.gold}, ${THEME.goldBright}, ${THEME.gold}, transparent)`,
                  boxShadow: `0 0 24px ${THEME.gold}aa`,
                  margin: '26px auto',
                }}
              />
            );
          };

          export const OrnamentCorner: React.FC<{
            delay: number;
            position: 'tl' | 'tr' | 'bl' | 'br';
          }> = ({ delay, position }) => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();
            const s = spring({ frame: frame - delay, fps, config: { damping: 20 } });
            const opacity = interpolate(s, [0, 1], [0, 1], {
              extrapolateLeft: 'clamp',
              extrapolateRight: 'clamp',
            });
            const size = interpolate(s, [0, 1], [0, 90]);

            const posStyle: React.CSSProperties = {};
            if (position === 'tl') {
              posStyle.top = 130;
              posStyle.left = 60;
              posStyle.borderTop = `2px solid ${THEME.gold}`;
              posStyle.borderLeft = `2px solid ${THEME.gold}`;
            } else if (position === 'tr') {
              posStyle.top = 130;
              posStyle.right = 60;
              posStyle.borderTop = `2px solid ${THEME.gold}`;
              posStyle.borderRight = `2px solid ${THEME.gold}`;
            } else if (position === 'bl') {
              posStyle.bottom = 130;
              posStyle.left = 60;
              posStyle.borderBottom = `2px solid ${THEME.gold}`;
              posStyle.borderLeft = `2px solid ${THEME.gold}`;
            } else {
              posStyle.bottom = 130;
              posStyle.right = 60;
              posStyle.borderBottom = `2px solid ${THEME.gold}`;
              posStyle.borderRight = `2px solid ${THEME.gold}`;
            }

            return (
              <div
                style={{
                  position: 'absolute',
                  width: size,
                  height: size,
                  opacity,
                  boxShadow: `inset 0 0 20px ${THEME.gold}33`,
                  ...posStyle,
                }}
              />
            );
          };
          EOF

      # ===============================================================
      # 10. src/PremiumCinematic.tsx  (komposisi utama, 4 scene)
      # ===============================================================
      - name: Create src/PremiumCinematic.tsx
        run: |
          cat > src/PremiumCinematic.tsx << 'EOF'
          import React from 'react';
          import {
            AbsoluteFill,
            interpolate,
            spring,
            useCurrentFrame,
            useVideoConfig,
            Sequence,
            Easing,
          } from 'remotion';
          import { noise2D } from '@remotion/noise';
          import {
            CinematicBackground,
            GoldParticles,
            FilmGrain,
            Letterbox,
            VignetteLayer,
            LensFlare,
          } from './atoms';
          import { StickmanFigure } from './StickmanFigure';
          import { KineticText, GoldDivider, OrnamentCorner } from './Typography';

          // ---------------- SCENE 1: ENTRANCE (0-90) ----------------
          const Scene1: React.FC = () => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();
            const entry = spring({
              frame: frame - 15,
              fps,
              config: { damping: 14, stiffness: 90 },
            });
            const translateY = interpolate(entry, [0, 1], [520, 0]);
            const breathe = Math.sin(frame * 0.06) * 2.5;
            const sway = Math.sin(frame * 0.045) * 6;

            return (
              <>
                <AbsoluteFill
                  style={{ justifyContent: 'center', alignItems: 'center' }}
                >
                  <div
                    style={{
                      transform: `translateY(${translateY + breathe}px)`,
                      marginTop: 140,
                    }}
                  >
                    <StickmanFigure
                      armLeft={-10 + sway}
                      armRight={10 - sway}
                      legLeft={Math.sin(frame * 0.05) * 3}
                      legRight={-Math.sin(frame * 0.05) * 3}
                      headTilt={sway * 0.2}
                      glow={0.45}
                    />
                  </div>
                </AbsoluteFill>
                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-start',
                    alignItems: 'center',
                    paddingTop: 210,
                  }}
                >
                  <KineticText text="MOVE IN" delay={20} size={148} />
                  <KineticText text="SILENCE" delay={38} size={148} />
                </AbsoluteFill>
              </>
            );
          };

          // ---------------- SCENE 2: FLEX (90-180) ----------------
          const Scene2: React.FC = () => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();
            const flex = spring({
              frame: frame - 10,
              fps,
              config: { damping: 10, stiffness: 110 },
            });
            const glow = 0.4 + interpolate(flex, [0, 1], [0, 0.55]);
            const armLeft = -10 + interpolate(flex, [0, 1], [0, -135]);
            const armRight = 10 + interpolate(flex, [0, 1], [0, 135]);
            const bodyPulse = 1 + interpolate(flex, [0, 1], [0, 0.04]);

            return (
              <>
                <AbsoluteFill
                  style={{ justifyContent: 'center', alignItems: 'center' }}
                >
                  <div style={{ transform: `scale(${bodyPulse})`, marginTop: 140 }}>
                    <StickmanFigure
                      armLeft={armLeft}
                      armRight={armRight}
                      legLeft={Math.sin(frame * 0.08) * 4}
                      legRight={-Math.sin(frame * 0.08) * 4}
                      headTilt={-2}
                      glow={glow}
                    />
                  </div>
                </AbsoluteFill>
                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-start',
                    alignItems: 'center',
                    paddingTop: 210,
                  }}
                >
                  <KineticText text="LET" delay={0} size={148} />
                  <KineticText text="RESULTS" delay={10} size={148} />
                  <KineticText text="SPEAK" delay={30} size={148} />
                </AbsoluteFill>
              </>
            );
          };

          // ---------------- SCENE 3: POINT (180-270) ----------------
          const Scene3: React.FC = () => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();
            const point = spring({
              frame: frame - 10,
              fps,
              config: { damping: 11, stiffness: 130 },
            });
            const armRight = 10 + interpolate(point, [0, 1], [0, -75]);
            const headTilt = interpolate(point, [0, 1], [0, 7]);

            return (
              <>
                <AbsoluteFill
                  style={{ justifyContent: 'center', alignItems: 'center' }}
                >
                  <div style={{ marginTop: 140 }}>
                    <StickmanFigure
                      armLeft={-20}
                      armRight={armRight}
                      legLeft={Math.sin(frame * 0.05) * 3}
                      legRight={-Math.sin(frame * 0.05) * 3}
                      headTilt={headTilt}
                      glow={0.6}
                    />
                  </div>
                </AbsoluteFill>
                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-start',
                    alignItems: 'center',
                    paddingTop: 240,
                  }}
                >
                  <KineticText text="IT'S YOUR" delay={0} size={110} />
                  <KineticText text="TIME" delay={18} size={160} />
                </AbsoluteFill>
              </>
            );
          };

          // ---------------- SCENE 4: END CARD (270-360) ----------------
          const Scene4: React.FC = () => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();
            const rest = spring({
              frame: frame - 5,
              fps,
              config: { damping: 14, stiffness: 100 },
            });
            const armLeft = -20 * (1 - interpolate(rest, [0, 1], [0, 0.7]));
            const armRight = 20 * (1 - interpolate(rest, [0, 1], [0, 0.7]));

            return (
              <>
                <AbsoluteFill
                  style={{ justifyContent: 'center', alignItems: 'center' }}
                >
                  <div
                    style={{
                      transform: `translateY(${interpolate(
                        rest,
                        [0, 1],
                        [60, 0]
                      )}px)`,
                      marginTop: 260,
                      opacity: interpolate(rest, [0, 1], [0, 1], {
                        extrapolateLeft: 'clamp',
                        extrapolateRight: 'clamp',
                      }),
                    }}
                  >
                    <StickmanFigure
                      armLeft={armLeft}
                      armRight={armRight}
                      legLeft={0}
                      legRight={0}
                      headTilt={0}
                      glow={0.4}
                      scale={0.9}
                    />
                  </div>
                </AbsoluteFill>
                <AbsoluteFill
                  style={{
                    justifyContent: 'flex-start',
                    alignItems: 'center',
                    paddingTop: 320,
                  }}
                >
                  <KineticText text="@YOURHANDLE" delay={0} size={78} variant="sub" />
                  <GoldDivider delay={20} width={560} />
                  <KineticText
                    text="PREMIUM SERIES · 2026"
                    delay={40}
                    size={38}
                    variant="tag"
                    letterSpacing={6}
                  />
                </AbsoluteFill>
              </>
            );
          };

          // ---------------- KOMPOSISI UTAMA ----------------
          export const PremiumCinematic: React.FC = () => {
            const frame = useCurrentFrame();
            const shakeX = noise2D('sx', frame * 0.05, 0) * 5;
            const shakeY = noise2D('sy', frame * 0.05, 0) * 5;
            const zoom = interpolate(frame, [0, 360], [1.09, 1.0], {
              easing: Easing.bezier(0.4, 0, 0.2, 1),
            });

            return (
              <AbsoluteFill
                style={{
                  background: '#07070B',
                  transform: `scale(${zoom}) translate(${shakeX}px, ${shakeY}px)`,
                  overflow: 'hidden',
                }}
              >
                <CinematicBackground />
                <GoldParticles />

                <Sequence from={0} durationInFrames={90}>
                  <Scene1 />
                </Sequence>
                <Sequence from={90} durationInFrames={90}>
                  <Scene2 />
                </Sequence>
                <Sequence from={180} durationInFrames={90}>
                  <Scene3 />
                </Sequence>
                <Sequence from={270} durationInFrames={90}>
                  <Scene4 />
                </Sequence>

                <LensFlare x={72} y={22} size={520} />
                <FilmGrain />

                {/* Ornamen sudut muncul di scene 4 */}
                <Sequence from={280}>
                  <OrnamentCorner delay={0} position="tl" />
                  <OrnamentCorner delay={8} position="tr" />
                  <OrnamentCorner delay={16} position="bl" />
                  <OrnamentCorner delay={24} position="br" />
                </Sequence>

                <Letterbox barHeight={90} />
                <VignetteLayer />

                {/* Footer kredit kecil */}
                <div
                  style={{
                    position: 'absolute',
                    bottom: 120,
                    width: '100%',
                    textAlign: 'center',
                    fontFamily: 'Inter, Helvetica, Arial, sans-serif',
                    fontSize: 22,
                    letterSpacing: 8,
                    color: '#D4AF37',
                    opacity: interpolate(frame, [0, 30], [0, 1], {
                      extrapolateRight: 'clamp',
                    }),
                    textTransform: 'uppercase',
                    fontWeight: 500,
                    zIndex: 45,
                  }}
                >
                  · CINEMATIC · MINDSET · 2026 ·
                </div>
              </AbsoluteFill>
            );
          };
          EOF

      # ===============================================================
      # 11. Install dependencies
      # ===============================================================
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ===============================================================
      # 12. Type check (mencegah error bundling)
      # ===============================================================
      - name: Type check
        run: npx tsc --noEmit

      # ===============================================================
      # 13. Render video 9:16
      # ===============================================================
      - name: Render video
        run: |
          npx remotion render PremiumCinematic out/premium-cinematic-stickman.mp4 \
            --codec=h264 \
            --crf=15 \
            --concurrency=2 \
            --pixel-format=yuv420p

      # ===============================================================
      # 14. Upload ke GitHub Release (bukan artifact, bukan zip)
      # ===============================================================
      - name: Create Release & Upload MP4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.title }} ${{ github.event.inputs.version }}
          body: |
            ## 🎬 Premium Cinematic Stickman

            Video vertikal 9:16 (1080×1920), 12 detik, 30fps, H.264 CRF 15.
            Siap upload ke TikTok / Instagram Reels / YouTube Shorts.

            **Download:** lihat file MP4 di bawah.
          files: out/premium-cinematic-stickman.mp4
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
