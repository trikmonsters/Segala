name: Vectorize Image to SVG Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag untuk release (misal: v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      output_name:
        description: 'Nama file SVG (tanpa .svg)'
        required: true
        default: 'vectorized'
        type: string

permissions:
  contents: write

jobs:
  vectorize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install VTracer
        run: pip install vtracer

      - name: Download image
        run: |
          curl -L "https://i.pinimg.com/736x/ba/53/9d/ba539da3426ce5359601138c02258f1d.jpg" -o input_image.jpg

      - name: Convert image to SVG
        run: |
          python -c "
          import vtracer
          vtracer.convert_image_to_svg_py(
              'input_image.jpg',
              '${{ github.event.inputs.output_name }}.svg',
              colormode='color',
              color_precision=6,
              filter_speckle=4,
              layer_difference=16,
              corner_threshold=60,
              length_threshold=4.0,
              splice_threshold=45,
              path_precision=3
          )
          "

      - name: Verify SVG
        run: |
          ls -lh ${{ github.event.inputs.output_name }}.svg
          head -c 200 ${{ github.event.inputs.output_name }}.svg

      - name: Create Release & Upload SVG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: "Vectorized SVG - ${{ github.event.inputs.tag_name }}"
          body: |
            Hasil vektorisasi otomatis dari:
            https://i.pinimg.com/736x/ba/53/9d/ba539da3426ce5359601138c02258f1d.jpg

            Dibuat dengan VTracer.
          files: ${{ github.event.inputs.output_name }}.svg
          draft: false
          prerelease: false
