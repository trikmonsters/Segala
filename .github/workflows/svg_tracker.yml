name: Vectorize Image to SVG Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag untuk release (misal: v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      output_name:
        description: 'Nama file SVG (tanpa .svg)'
        required: true
        default: 'vectorized'
        type: string

permissions:
  contents: write

jobs:
  vectorize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install VTracer
        run: |
          pip install vtracer
          python -c "import vtracer; print('VTracer version:', vtracer.__version__ if hasattr(vtracer, '__version__') else 'unknown')"

      - name: Download image
        run: |
          curl -L -A "Mozilla/5.0" "https://i.pinimg.com/736x/ba/53/9d/ba539da3426ce5359601138c02258f1d.jpg" -o input_image.jpg
          ls -lh input_image.jpg
          file input_image.jpg

      - name: Convert image to SVG
        run: |
          python << 'EOF'
          import vtracer
          import os
          import traceback
          
          output_file = "${{ github.event.inputs.output_name }}.svg"
          try:
              vtracer.convert_image_to_svg_py(
                  'input_image.jpg',
                  output_file,
                  colormode='color',
                  color_precision=8,
                  filter_speckle=2,
                  layer_difference=4,
                  corner_threshold=60,
                  length_threshold=2.0,
                  splice_threshold=45,
                  path_precision=5
              )
              if os.path.exists(output_file):
                  print(f"✅ SVG created: {output_file} ({os.path.getsize(output_file)} bytes)")
              else:
                  raise FileNotFoundError(f"VTracer selesai tapi file {output_file} tidak ditemukan")
          except Exception as e:
              print(f"❌ Error: {e}")
              traceback.print_exc()
              raise
          EOF

      - name: Verify SVG
        run: |
          if [ ! -f "${{ github.event.inputs.output_name }}.svg" ]; then
            echo "❌ File SVG tidak ditemukan!"
            ls -la
            exit 1
          fi
          ls -lh ${{ github.event.inputs.output_name }}.svg
          head -c 300 ${{ github.event.inputs.output_name }}.svg

      - name: Create Release & Upload SVG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: "Vectorized SVG - ${{ github.event.inputs.tag_name }}"
          body: |
            Hasil vektorisasi otomatis dari:
            https://i.pinimg.com/736x/ba/53/9d/ba539da3426ce5359601138c02258f1d.jpg

            Dibuat dengan VTracer.
          files: ${{ github.event.inputs.output_name }}.svg
          draft: false
          prerelease: false
