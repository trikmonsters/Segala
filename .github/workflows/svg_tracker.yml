name: Vectorize with Background Removal & Custom Background

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL of the source image'
        required: true
        default: 'https://i.pinimg.com/736x/ba/53/9d/ba539da3426ce5359601138c02258f1d.jpg'
        type: string
      output_name:
        description: 'Output SVG file name (without .svg)'
        required: true
        default: 'vectorized'
        type: string
      bg_color:
        description: 'Background color (hex, e.g., #ffffff, #000000, #FF5733)'
        required: true
        default: '#ffffff'
        type: string
      bg_opacity:
        description: 'Background opacity (0-100)'
        required: true
        default: '100'
        type: string

permissions:
  contents: write

jobs:
  vectorize-with-bg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install vtracer
          pip install torch torchvision transformers pillow numpy
          pip install "transformers>=4.48.0"
          # Optional: SVGO via npm for optimization
          npm install -g svgo

      - name: Download source image
        run: |
          curl -L -A "Mozilla/5.0" "${{ github.event.inputs.image_url }}" -o source_image.jpg
          file source_image.jpg

      - name: Remove background with RMBG-2.0
        run: |
          python << 'EOF'
          import torch
          from transformers import AutoModelForImageSegmentation
          from torchvision import transforms
          from PIL import Image
          
          # Load RMBG-2.0 model
          print("Loading RMBG-2.0 model...")
          model = AutoModelForImageSegmentation.from_pretrained(
              'briaai/RMBG-2.0', 
              trust_remote_code=True
          )
          device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
          model.to(device)
          model.eval()
          print(f"Model loaded on {device}")
          
          # Image transform
          transform = transforms.Compose([
              transforms.Resize((1024, 1024)),
              transforms.ToTensor(),
              transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225])
          ])
          
          # Load and process image
          image = Image.open('source_image.jpg').convert('RGB')
          original_size = image.size
          
          input_tensor = transform(image).unsqueeze(0).to(device)
          
          with torch.no_grad():
              preds = model(input_tensor)[-1].sigmoid().cpu()
          
          # Generate mask
          pred = preds[0].squeeze()
          mask = transforms.ToPILImage()(pred).resize(original_size)
          
          # Apply mask to create RGBA image (transparent background)
          image_rgba = image.convert('RGBA')
          image_rgba.putalpha(mask)
          image_rgba.save('image_no_bg.png')
          print("Background removed. RGBA image saved.")
          EOF

      - name: Composite with custom background color
        run: |
          python << 'EOF'
          from PIL import Image
          import re
          
          # Parse color inputs
          bg_hex = "${{ github.event.inputs.bg_color }}".lstrip('#')
          bg_opacity = int("${{ github.event.inputs.bg_opacity }}")
          
          # Convert hex to RGB
          if len(bg_hex) == 3:
              bg_hex = ''.join([c*2 for c in bg_hex])
          bg_rgb = tuple(int(bg_hex[i:i+2], 16) for i in (0, 2, 4))
          bg_alpha = int(255 * bg_opacity / 100)
          
          print(f"Background color: RGB{bg_rgb}, Alpha: {bg_alpha}")
          
          # Load image with transparency
          image = Image.open('image_no_bg.png').convert('RGBA')
          width, height = image.size
          
          # Create background layer
          background = Image.new('RGBA', (width, height), bg_rgb + (bg_alpha,))
          
          # Composite: background behind foreground
          result = Image.alpha_composite(background, image)
          
          # Save as RGB (flattened) for tracing
          result_rgb = result.convert('RGB')
          result_rgb.save('image_with_bg.jpg', quality=95)
          
          # Also save transparent version for potential use
          result.save('image_with_bg_rgba.png')
          print(f"Composite saved: {width}x{height}")
          EOF

      - name: Vectorize with VTracer (optimized parameters)
        run: |
          python << 'EOF'
          import vtracer
          import os
          
          output = "${{ github.event.inputs.output_name }}.svg"
          
          vtracer.convert_image_to_svg_py(
              'image_with_bg.jpg',
              output,
              colormode='color',
              color_precision=8,
              filter_speckle=2,
              layer_difference=4,
              corner_threshold=60,
              length_threshold=2.0,
              splice_threshold=45,
              path_precision=5
          )
          
          size = os.path.getsize(output)
          print(f"SVG created: {output} ({size:,} bytes)")
          EOF

      - name: Optimize SVG with SVGO
        run: |
          svgo "${{ github.event.inputs.output_name }}.svg" \
            --multipass \
            --precision=2 \
            --enable=removeMetadata,removeComments,cleanupNumericValues,convertPathData,collapseGroups \
            -o "${{ github.event.inputs.output_name }}_optimized.svg"
          
          ls -lh "${{ github.event.inputs.output_name }}_optimized.svg"

      - name: Verify output
        run: |
          if [ ! -f "${{ github.event.inputs.output_name }}_optimized.svg" ]; then
            echo "❌ Optimized SVG not found!"
            ls -la
            exit 1
          fi
          echo "✅ Output files:"
          ls -lh *.svg *.png *.jpg 2>/dev/null || true
          echo ""
          echo "SVG header preview:"
          head -c 200 "${{ github.event.inputs.output_name }}_optimized.svg"

      - name: Create Release with SVG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.output_name }}-v${{ github.run_number }}
          name: "Vectorized SVG - ${{ github.event.inputs.output_name }}"
          body: |
            ## Vectorization Result
            
            **Source:** ${{ github.event.inputs.image_url }}
            **Background Color:** ${{ github.event.inputs.bg_color }} (opacity: ${{ github.event.inputs.bg_opacity }}%)
            **Output:** ${{ github.event.inputs.output_name }}_optimized.svg
            
            Processed with RMBG-2.0 + VTracer + SVGO.
          files: |
            ${{ github.event.inputs.output_name }}_optimized.svg
            ${{ github.event.inputs.output_name }}.svg
            image_no_bg.png
            image_with_bg.jpg
          draft: false
          prerelease: false
