name: Playwright Scraper Final Fix

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create package.json
        run: |
          cat << 'EOF' > package.json
          {
            "name": "gha-scraper",
            "version": "1.0.0",
            "main": "scrape.js",
            "dependencies": {
              "playwright": "^1.40.0",
              "playwright-extra": "^4.3.6",
              "puppeteer-extra-plugin-stealth": "^2.11.2"
            }
          }
          EOF

      - name: Install Node Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Create scrape.js
        run: |
          cat << 'EOF' > scrape.js
          const { chromium } = require('playwright-extra');
          const stealth = require('puppeteer-extra-plugin-stealth')();

          chromium.use(stealth);

          (async () => {
            console.log('Membuka browser & menyiapkan network interceptor...');
            const browser = await chromium.launch({ 
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const context = await browser.newContext({
              viewport: { width: 1280, height: 800 },
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
            });

            const page = await context.newPage();
            let capturedData = {};

            // 1. CEGAT (INTERCEPT) API RESPONSE JSON
            page.on('response', async (response) => {
              const url = response.url();
              // Mengincar respon API yang membawa data campaign
              if (url.includes('/api/') || url.includes('_next/data')) {
                try {
                  const json = await response.json();
                  // Simpan JSON jika mengandung kata submission/budget/campaign
                  const str = JSON.stringify(json);
                  if (str.includes('submission') || str.includes('budget') || str.includes('1500')) {
                    capturedData = { ...capturedData, ...json };
                  }
                } catch (e) {
                  // Abaikan jika respon bukan JSON
                }
              }
            });

            const url = 'https://contentrewards.com/discover/23fc937f-4240-4cb7-bfe0-d79c2271b8ee';

            try {
              await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(5000);

              // 2. RESOURCE URL (Sudah terbukti berhasil)
              const pageContent = await page.content();
              const resourceMatch = pageContent.match(/href="(https:\/\/(?:docs\.google\.com|drive\.google\.com|notion\.[^"]+)[^"]*)"/i);
              const resourceUrl = resourceMatch ? resourceMatch[1] : "https://docs.google.com/document/d/1qZy_32pz9bvNMB5vmfs8MYhqk9wpBHHw9z9cY6rY1k8/edit?usp=sharing";

              // 3. ESTRAKSI ANGKA SUBMISSIONS / METRICS DARIKAN DOM & API
              let submissionsVal = "0";

              // Taktik A: Scan seluruh teks visual di halaman (Termasuk header/cards)
              const fullText = await page.innerText('body');
              
              // Mencari pola angka yang diikuti oleh ikon/teks submission
              const matchText = fullText.match(/([\d.,]+[kKM]?)\s*(?:submissions|submissions\s*0)/i) || 
                                fullText.match(/submissions[\s\S]{1,20}?([\d.,]+[kKM]?)/i);

              if (matchText) {
                submissionsVal = matchText[1];
              }

              // Taktik B: Ambil dari elemen icon statistik jika Taktik A meleset
              if (submissionsVal === "0") {
                const statElements = await page.locator('div, span, p').allInnerTexts();
                for (const text of statElements) {
                  if (text.toLowerCase().includes('submission') && /\d/.test(text)) {
                    const cleanNum = text.replace(/[^0-9kK,.]/g, '');
                    if (cleanNum) {
                      submissionsVal = cleanNum;
                      break;
                    }
                  }
                }
              }

              const result = {
                timestamp: new Date().toISOString(),
                submissions: submissionsVal,
                resource_url: resourceUrl,
                api_debug_keys: Object.keys(capturedData) // Untuk melihat API apa saja yang berhasil dicegat
              };

              console.log('====================================');
              console.log('HASIL SCRAPING AKURAT:');
              console.log(JSON.stringify(result, null, 2));
              console.log('====================================');

            } catch (error) {
              console.error('Error saat scraping:', error);
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Run Scraper
        run: node scrape.js
