name: Playwright Scraper Fix

on:
  workflow_dispatch:


jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create package.json
        run: |
          cat << 'EOF' > package.json
          {
            "name": "gha-scraper",
            "version": "1.0.0",
            "main": "scrape.js",
            "dependencies": {
              "playwright": "^1.40.0",
              "playwright-extra": "^4.3.6",
              "puppeteer-extra-plugin-stealth": "^2.11.2"
            }
          }
          EOF

      - name: Install Node Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Create scrape.js
        run: |
          cat << 'EOF' > scrape.js
          const { chromium } = require('playwright-extra');
          const stealth = require('puppeteer-extra-plugin-stealth')();

          chromium.use(stealth);

          (async () => {
            console.log('Membuka browser...');
            const browser = await chromium.launch({ 
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const context = await browser.newContext({
              viewport: { width: 1280, height: 800 },
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
            });

            const page = await context.newPage();
            const url = 'https://contentrewards.com/discover/23fc937f-4240-4cb7-bfe0-d79c2271b8ee';

            try {
              await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(3000);

              // 1. CARI LINK RESOURCE (Scroll ke bawah dulu agar elemen ter-load)
              await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight / 2));
              await page.waitForTimeout(1000);

              let resourceUrl = "Tidak ditemukan";
              
              // Mencari tag <a> yang membungkus teks 'Content Guidelines' atau mengandung link drive/docs
              const resourceAnchor = page.locator('a:has-text("Content Guidelines"), a[href*="docs.google.com"], a[href*="drive.google.com"]').first();
              
              if (await resourceAnchor.count() > 0) {
                resourceUrl = await resourceAnchor.getAttribute('href');
              } else {
                // Fallback: Cari via evaluate regex dari seluruh HTML halaman
                const pageContent = await page.content();
                const match = pageContent.match(/href="(https:\/\/(?:docs\.google\.com|drive\.google\.com|notion\.[^"]+)[^"]*)"/i);
                if (match) resourceUrl = match[1];
              }

              // 2. PINDAH KE TAB ANALYTICS & SUBMISSIONS
              // Scroll kembali ke atas
              await page.evaluate(() => window.scrollTo(0, 0));

              const analyticsTab = page.locator('button', { hasText: /^Analytics$/i });
              if (await analyticsTab.isVisible()) {
                await analyticsTab.click({ force: true });
                await page.waitForTimeout(2000);
              }

              const submissionsTab = page.locator('button', { hasText: /^Submissions$/i });
              if (await submissionsTab.isVisible()) {
                await submissionsTab.click({ force: true });
                await page.waitForTimeout(2000);
              }

              // Tunggu rendering chart/angka selesai
              await page.waitForTimeout(4000);

              // 3. AMBIL ANGKA SUBMISSIONS
              let submissionsVal = "0";

              // Taktik 1: Ambil elemen yang ada di atas teks 'Submissions'
              const subTextLabel = page.locator('text=/^Submissions$/i').first();
              if (await subTextLabel.isVisible()) {
                // Ambil parent container dari teks 'Submissions' lalu ekstrak angkanya
                const parentText = await subTextLabel.locator('xpath=..').innerText();
                const lines = parentText.split('\n').map(s => s.trim()).filter(Boolean);
                // Cari elemen bertipe angka/k/M (misal: "1.5k" atau "1500")
                const matchedNum = lines.find(line => /^[\d.,]+[kKM]?$/i.test(line));
                if (matchedNum) submissionsVal = matchedNum;
              }

              // Taktik 2: Jika taktik 1 gagal, scan seluruh teks halaman yang berformat angka + Submissions
              if (submissionsVal === "0") {
                const bodyText = await page.innerText('body');
                const matchSub = bodyText.match(/([\d.,]+[kKM]?)\s*\n?\s*Submissions/i);
                if (matchSub) submissionsVal = matchSub[1];
              }

              const result = {
                timestamp: new Date().toISOString(),
                submissions: submissionsVal,
                resource_url: resourceUrl
              };

              console.log('====================================');
              console.log('HASIL SCRAPING BERSINAR:');
              console.log(JSON.stringify(result, null, 2));
              console.log('====================================');

            } catch (error) {
              console.error('Error saat scraping:', error);
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Run Scraper
        run: node scrape.js
