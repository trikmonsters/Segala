name: Playwright Scraper Number-Flow Fix

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create package.json
        run: |
          cat << 'EOF' > package.json
          {
            "name": "gha-scraper",
            "version": "1.0.0",
            "main": "scrape.js",
            "dependencies": {
              "playwright": "^1.40.0",
              "playwright-extra": "^4.3.6",
              "puppeteer-extra-plugin-stealth": "^2.11.2"
            }
          }
          EOF

      - name: Install Node Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Create scrape.js
        run: |
          cat << 'EOF' > scrape.js
          const { chromium } = require('playwright-extra');
          const stealth = require('puppeteer-extra-plugin-stealth')();

          chromium.use(stealth);

          (async () => {
            console.log('Membuka browser...');
            const browser = await chromium.launch({ 
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const context = await browser.newContext({
              viewport: { width: 1280, height: 800 },
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
            });

            const page = await context.newPage();
            const url = 'https://contentrewards.com/discover/23fc937f-4240-4cb7-bfe0-d79c2271b8ee';

            try {
              await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(3000);

              // 1. KLIK TAB ANALYTICS
              const analyticsBtn = page.locator('button[data-tab="analytics"]');
              if (await analyticsBtn.isVisible()) {
                await analyticsBtn.click({ force: true });
                await page.waitForTimeout(2000);
              }

              // 2. KLIK SUB-TAB SUBMISSIONS
              const subTab = page.locator('button:has-text("Submissions")').first();
              if (await subTab.isVisible()) {
                await subTab.click({ force: true });
                await page.waitForTimeout(2000);
              }

              // Tunggu animasi number-flow selesai bergulir
              await page.waitForTimeout(4000);

              // 3. ESTRAKSI LINK RESOURCE
              let resourceUrl = "Tidak ditemukan";
              const pageContent = await page.content();
              const matchDoc = pageContent.match(/href="(https:\/\/(?:docs\.google\.com|drive\.google\.com)[^"]*)"/i);
              if (matchDoc) resourceUrl = matchDoc[1];

              // 4. ESTRAKSI ANGKA DARI NUMBER-FLOW REACT
              let submissionsVal = await page.evaluate(() => {
                // Trik A: Cari elemen <number-flow> atau elemen dengan atribut number-flow
                const nfElements = document.querySelectorAll('number-flow, [data-number-flow], [class*="number-flow"]');
                
                for (const el of nfElements) {
                  // Cek Atribut Utama number-flow
                  const val = el.getAttribute('value') || 
                              el.getAttribute('aria-label') || 
                              el.getAttribute('data-value');
                  if (val) return val;

                  // Cek apakah angka tersimpan di dataset React internal
                  if (el.dataset && el.dataset.value) return el.dataset.value;
                }

                // Trik B: Jika tidak menggunakan custom tag, cari komponen di sekitar tulisan "Submissions"
                const subLabel = Array.from(document.querySelectorAll('*')).find(
                  el => el.children.length === 0 && el.textContent.trim().toLowerCase() === 'submissions'
                );

                if (subLabel && subLabel.parentElement) {
                  const parent = subLabel.parentElement;
                  // Cari elemen number-flow atau angka di dalam parent container
                  const nfInside = parent.querySelector('number-flow, [aria-label], [value]');
                  if (nfInside) {
                    return nfInside.getAttribute('value') || nfInside.getAttribute('aria-label');
                  }
                  
                  // Ambil seluruh textContent dari parent jika terpaksa
                  return parent.textContent.replace(/submissions/i, '').trim();
                }

                return "0";
              });

              const result = {
                timestamp: new Date().toISOString(),
                submissions: submissionsVal,
                resource_url: resourceUrl
              };

              console.log('====================================');
              console.log('HASIL SCRAPING NUMBER-FLOW:');
              console.log(JSON.stringify(result, null, 2));
              console.log('====================================');

            } catch (error) {
              console.error('Error saat scraping:', error);
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Run Scraper
        run: node scrape.js
