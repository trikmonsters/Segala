name: Playwright Scraper Final Exact Selector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create package.json
        run: |
          cat << 'EOF' > package.json
          {
            "name": "gha-scraper",
            "version": "1.0.0",
            "main": "scrape.js",
            "dependencies": {
              "playwright": "^1.40.0",
              "playwright-extra": "^4.3.6",
              "puppeteer-extra-plugin-stealth": "^2.11.2"
            }
          }
          EOF

      - name: Install Node Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Create scrape.js
        run: |
          cat << 'EOF' > scrape.js
          const { chromium } = require('playwright-extra');
          const stealth = require('puppeteer-extra-plugin-stealth')();

          chromium.use(stealth);

          (async () => {
            console.log('Membuka browser...');
            const browser = await chromium.launch({ 
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const context = await browser.newContext({
              viewport: { width: 1280, height: 800 },
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
            });

            const page = await context.newPage();
            const url = 'https://contentrewards.com/discover/23fc937f-4240-4cb7-bfe0-d79c2271b8ee';

            try {
              await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(3000);

              // 1. KLIK TAB ANALYTICS (Menggunakan data-tab="analytics")
              console.log('Mengeklik tab Analytics...');
              const analyticsBtn = page.locator('button[data-tab="analytics"]');
              if (await analyticsBtn.isVisible()) {
                await analyticsBtn.click({ force: true });
                await page.waitForTimeout(2000);
              }

              // 2. KLIK SUB-TAB SUBMISSIONS (JIKA ADA TOGGLE SUBMISSIONS)
              console.log('Mengeklik sub-tab Submissions...');
              const subTab = page.locator('button:has-text("Submissions"), [data-tab="submissions"]').first();
              if (await subTab.isVisible()) {
                await subTab.click({ force: true });
                await page.waitForTimeout(2000);
              }

              // Tunggu angka terisi/berubah dari 0 ke data aktual
              await page.waitForTimeout(4000);

              // 3. ESTRAKSI LINK RESOURCE
              let resourceUrl = "Tidak ditemukan";
              const resourceAnchor = page.locator('a:has-text("Content Guidelines"), a[href*="docs.google.com"]').first();
              if (await resourceAnchor.count() > 0) {
                resourceUrl = await resourceAnchor.getAttribute('href');
              } else {
                const pageContent = await page.content();
                const match = pageContent.match(/href="(https:\/\/(?:docs\.google\.com|drive\.google\.com)[^"]*)"/i);
                if (match) resourceUrl = match[1];
              }

              // 4. ESTRAKSI ANGKA SUBMISSIONS (LANGSUNG DARI DOM ANALYTICS)
              let submissionsVal = "0";

              // Taktik 1: Ambil elemen angka persis di dalam container Analytics
              const submissionsBlock = page.locator('text=/Submissions/i').locator('xpath=..');
              if (await submissionsBlock.count() > 0) {
                const rawText = await submissionsBlock.innerText();
                const cleanText = rawText.replace(/Submissions/i, '').trim();
                if (cleanText) submissionsVal = cleanText;
              }

              // Taktik 2: Jika masih kosong, scan angka terdekat di area analytics
              if (submissionsVal === "0" || submissionsVal === "") {
                const pageText = await page.innerText('body');
                const match = pageText.match(/([\d.,]+[kKM]?)\s*\n?\s*Submissions/i);
                if (match) submissionsVal = match[1];
              }

              const result = {
                timestamp: new Date().toISOString(),
                submissions: submissionsVal,
                resource_url: resourceUrl
              };

              console.log('====================================');
              console.log('HASIL SCRAPING TARGETED:');
              console.log(JSON.stringify(result, null, 2));
              console.log('====================================');

            } catch (error) {
              console.error('Error saat scraping:', error);
            } finally {
              await browser.close();
            }
          })();
          EOF

      - name: Run Scraper
        run: node scrape.js
