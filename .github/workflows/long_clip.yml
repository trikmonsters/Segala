name: Long to Clips
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL YouTube / Shorts'
        required: true
        type: string
      sections:
        description: 'Potongan Menit (contoh: 03:07-03:23, 06:19-06:29)'
        required: false
        type: string
        default: ''
jobs:
  download-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install FFmpeg resmi via apt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # Setup Deno (~2 detik)
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Install yt-dlp Binary (~2 detik)
      - name: Install yt-dlp Binary
        run: |
          mkdir -p ~/.local/bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/.local/bin/yt-dlp
          chmod +x ~/.local/bin/yt-dlp
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create Cookie File from Secret
        env:
          COOKIES_TEXT: ${{ secrets.COOKIE }}
        run: |
          echo "$COOKIES_TEXT" > ./cookies.txt
          
      - name: Download Sections with yt-dlp (loop per section)
        env:
          RAW_SECTIONS: ${{ inputs.sections }}
          URL: ${{ inputs.url }}
        run: |
          set -e
          mkdir -p downloads/clips

          YTDLP_BASE_ARGS=(
            --cookies ./cookies.txt
            --remote-components ejs:github
            --force-keyframes-at-cuts
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best"
            --merge-output-format mp4
            --no-continue
            --force-overwrites
          )

          if [ -z "$RAW_SECTIONS" ]; then
            echo "Tidak ada sections diberikan, download full video sebagai satu clip."
            yt-dlp "${YTDLP_BASE_ARGS[@]}" \
              -o "downloads/clips/clip_000.%(ext)s" \
              "$URL"
            exit 0
          fi

          CLEANED=$(echo "$RAW_SECTIONS" | sed 's/s//g')
          IFS=',' read -ra ADDR <<< "$CLEANED"

          i=0
          for sec in "${ADDR[@]}"; do
            TRIMMED=$(echo "$sec" | xargs)
            if [ -n "$TRIMMED" ]; then
              IDX=$(printf "%03d" "$i")
              echo "=== [$IDX] Mengunduh section: $TRIMMED ==="
              yt-dlp "${YTDLP_BASE_ARGS[@]}" \
                --download-sections "*$TRIMMED" \
                -o "downloads/clips/clip_${IDX}.%(ext)s" \
                "$URL"
              i=$((i+1))
            fi
          done

          echo "--- Total clip terunduh: $i ---"
          ls -la downloads/clips/

      - name: Merge Clips into One Highlight Video
        run: |
          mkdir -p output
          cd downloads/clips
          
          rm -f concat.txt
          for file in $(ls -1 *.mp4 | sort); do
            echo "file '$PWD/$file'" >> concat.txt
          done
          
          echo "--- Daftar Klip yang Akan Digabung ---"
          cat concat.txt
          
          ffmpeg -f concat -safe 0 -i concat.txt \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=20:5[bg];[0:v]crop=iw*0.8:ih,scale=1080:-1[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2" \
            -c:v libx264 -preset slow -crf 18 -c:a aac -b:a 192k \
            ../../output/highlight_compilation.mp4
            
      - name: Upload Highlight Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: highlight-kill-video
          path: output/highlight_compilation.mp4
          retention-days: 2

      - name: Upload Individual Clips as Artifact (opsional, untuk cek per klip)
        uses: actions/upload-artifact@v4
        with:
          name: individual-clips
          path: downloads/clips/*.mp4
          retention-days: 2
