name: Long to Clips

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL YouTube / Shorts'
        required: true
        type: string
      sections:
        description: 'Potongan Menit (contoh: 03:07-03:23, 06:19-06:29)'
        required: false
        type: string
        default: ''

jobs:
  download-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install FFmpeg resmi via apt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # Setup Deno (~2 detik)
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Install yt-dlp Binary (~2 detik)
      - name: Install yt-dlp Binary
        run: |
          mkdir -p ~/.local/bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/.local/bin/yt-dlp
          chmod +x ~/.local/bin/yt-dlp
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create Cookie File from Secret
        env:
          COOKIES_TEXT: ${{ secrets.COOKIE }}
        run: |
          echo "$COOKIES_TEXT" > ./cookies.txt

      - name: Download Sections with yt-dlp
        env:
          RAW_SECTIONS: ${{ inputs.sections }}
          URL: ${{ inputs.url }}
        run: |
          mkdir -p downloads/clips

          YTDLP_ARGS=(
            --cookies ./cookies.txt
            --remote-components ejs:github
            --force-keyframes-at-cuts
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best"
            --merge-output-format mp4
            -o "downloads/clips/clip_%(section_number)03d.%(ext)s"
          )

          if [ -n "$RAW_SECTIONS" ]; then
            CLEANED=$(echo "$RAW_SECTIONS" | sed 's/s//g')
            IFS=',' read -ra ADDR <<< "$CLEANED"
            for sec in "${ADDR[@]}"; do
              TRIMMED=$(echo "$sec" | xargs)
              if [ -n "$TRIMMED" ]; then
                YTDLP_ARGS+=(--download-sections "*$TRIMMED")
              fi
            done
          fi

          echo "Menjalankan yt-dlp..."
          yt-dlp "${YTDLP_ARGS[@]}" "$URL"

      # Penggabungan Klip Menjadi 1 Video Utuh Menggunakan FFmpeg
      - name: Merge Clips into One Highlight Video
        run: |
          mkdir -p output
          cd downloads/clips

          # Buat file concat.txt berisi daftar seluruh file mp4 yang terurut
          for file in $(ls -1 *.mp4 | sort); do
            echo "file '$PWD/$file'" >> concat.txt
          done

          echo "--- Daftar Klip yang Akan Digabung ---"
          cat concat.txt

          # Gabungkan klip dengan re-encoding agar transisi audio & video mulus dan tidak corrupt
          ffmpeg -f concat -safe 0 -i concat.txt -c:v libx264 -preset fast -crf 22 -c:a aac -b:a 192k ../../output/highlight_compilation.mp4

      - name: Upload Highlight Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: highlight-kill-video
          path: output/highlight_compilation.mp4
          retention-days: 7
