name: Vectorize dengan Background Remover & Custom Background

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL gambar sumber'
        required: true
        default: 'https://i.pinimg.com/736x/ba/53/9d/ba539da3426ce5359601138c02258f1d.jpg'
        type: string
      output_name:
        description: 'Nama file SVG (tanpa .svg)'
        required: true
        default: 'vectorized'
        type: string
      bg_color:
        description: 'Warna background (hex, contoh: #ffffff, #000000, #FF5733)'
        required: true
        default: '#ffffff'
        type: string
      bg_opacity:
        description: 'Opacity background (0-100)'
        required: true
        default: '100'
        type: string
      model_name:
        description: 'Model rembg (birefnet-general, isnet-general-use, u2net)'
        required: true
        default: 'birefnet-general'
        type: choice
        options:
          - birefnet-general
          - isnet-general-use
          - u2net
          - u2netp

permissions:
  contents: write

jobs:
  vectorize-with-bg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "rembg[cpu]" pillow vtracer numpy
          npm install -g svgo

      - name: Download gambar sumber
        run: |
          curl -L -A "Mozilla/5.0" "${{ github.event.inputs.image_url }}" -o source_image.jpg
          file source_image.jpg

      - name: Hapus background dengan rembg
        run: |
          python << 'EOF'
          from rembg import remove, new_session
          from PIL import Image
          import os

          model_name = "${{ github.event.inputs.model_name }}"
          print(f"Memuat model: {model_name}")

          session = new_session(model_name)

          input_image = Image.open('source_image.jpg').convert('RGB')
          print(f"Ukuran gambar asli: {input_image.size}")

          output_image = remove(
              input_image,
              session=session,
              alpha_matting=True,
              alpha_matting_foreground_threshold=240,
              alpha_matting_background_threshold=10,
              alpha_matting_erode_size=10,
          )

          output_image.save('image_no_bg.png')
          print(f"Background dihapus. Mode: {output_image.mode}, Size: {output_image.size}")
          EOF

      - name: Verifikasi hasil background removal
        run: |
          python << 'EOF'
          from PIL import Image
          img = Image.open('image_no_bg.png')
          print(f"Mode: {img.mode}, Size: {img.size}")
          if img.mode == 'RGBA':
              print("✅ Alpha channel terdeteksi (background transparan)")
          else:
              print("⚠️ Tidak ada alpha channel")
          EOF

      - name: Gabungkan dengan warna background custom
        run: |
          python << 'EOF'
          from PIL import Image

          bg_hex = "${{ github.event.inputs.bg_color }}".lstrip('#')
          bg_opacity = int("${{ github.event.inputs.bg_opacity }}")

          if len(bg_hex) == 3:
              bg_hex = ''.join([c*2 for c in bg_hex])
          bg_rgb = tuple(int(bg_hex[i:i+2], 16) for i in (0, 2, 4))
          bg_alpha = int(255 * bg_opacity / 100)

          print(f"Warna background: RGB{bg_rgb}, Alpha: {bg_alpha}")

          image = Image.open('image_no_bg.png').convert('RGBA')
          width, height = image.size

          background = Image.new('RGBA', (width, height), bg_rgb + (bg_alpha,))

          result = Image.alpha_composite(background, image)

          result_rgb = result.convert('RGB')
          result_rgb.save('image_with_bg.jpg', quality=95)
          result.save('image_with_bg_rgba.png')
          print(f"Komposit disimpan: {width}x{height}")
          EOF

      - name: Vectorize dengan VTracer
        run: |
          python << 'EOF'
          import vtracer
          import os

          output = "${{ github.event.inputs.output_name }}.svg"

          vtracer.convert_image_to_svg_py(
              'image_with_bg.jpg',
              output,
              colormode='color',
              color_precision=8,
              filter_speckle=2,
              layer_difference=4,
              corner_threshold=60,
              length_threshold=2.0,
              splice_threshold=45,
              path_precision=5
          )

          size = os.path.getsize(output)
          print(f"SVG dibuat: {output} ({size:,} bytes)")
          EOF

      - name: Buat SVGO config
        run: |
          cat > svgo.config.mjs << 'EOF'
          export default {
            multipass: true,
            precision: 2,
            plugins: [
              'preset-default',
              'removeComments',
              'removeMetadata',
              'cleanupNumericValues',
              'convertPathData',
              'collapseGroups'
            ]
          };
          EOF
          cat svgo.config.mjs

      - name: Optimize SVG dengan SVGO
        run: |
          svgo -c svgo.config.mjs \
            -i "${{ github.event.inputs.output_name }}.svg" \
            -o "${{ github.event.inputs.output_name }}_optimized.svg"

          ls -lh "${{ github.event.inputs.output_name }}_optimized.svg"

      - name: Verifikasi output
        run: |
          if [ ! -f "${{ github.event.inputs.output_name }}_optimized.svg" ]; then
            echo "❌ SVG optimized tidak ditemukan!"
            ls -la
            exit 1
          fi
          echo "✅ File output:"
          ls -lh *.svg *.png *.jpg 2>/dev/null || true
          echo ""
          echo "Preview header SVG:"
          head -c 200 "${{ github.event.inputs.output_name }}_optimized.svg"

      - name: Buat Release dengan SVG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.output_name }}-v${{ github.run_number }}
          name: "Vectorized SVG - ${{ github.event.inputs.output_name }}"
          body: |
            ## Hasil Vektorisasi

            **Sumber:** ${{ github.event.inputs.image_url }}
            **Model rembg:** ${{ github.event.inputs.model_name }}
            **Warna Background:** ${{ github.event.inputs.bg_color }} (opacity: ${{ github.event.inputs.bg_opacity }}%)
            **Output:** ${{ github.event.inputs.output_name }}_optimized.svg

            Diproses dengan rembg + VTracer + SVGO.
          files: |
            ${{ github.event.inputs.output_name }}_optimized.svg
            ${{ github.event.inputs.output_name }}.svg
            image_no_bg.png
            image_with_bg.jpg
          draft: false
          prerelease: false
