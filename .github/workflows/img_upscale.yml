name: Vectorize with Inkscape Simplify

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL gambar sumber'
        required: true
        default: 'https://i.pinimg.com/736x/ba/53/9d/ba539da3426ce5359601138c02258f1d.jpg'
        type: string
      output_name:
        description: 'Nama file SVG (tanpa .svg)'
        required: true
        default: 'vectorized'
        type: string
      bg_color:
        description: 'Warna background (hex, contoh: #ffffff)'
        required: true
        default: '#ffffff'
        type: string
      bg_opacity:
        description: 'Opacity background (0-100)'
        required: true
        default: '100'
        type: string
      model_name:
        description: 'Model rembg'
        required: true
        default: 'birefnet-general'
        type: choice
        options:
          - birefnet-general
          - isnet-general-use
          - u2net
          - u2netp

permissions:
  contents: write

jobs:
  vectorize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "rembg[cpu]" pillow vtracer numpy
          sudo apt-get update
          sudo apt-get install -y inkscape
          npm install -g svgo

      - name: Download gambar
        run: |
          curl -L -A "Mozilla/5.0" "${{ github.event.inputs.image_url }}" -o source_image.jpg
          file source_image.jpg

      - name: Hapus background (rembg)
        run: |
          python << 'EOF'
          from rembg import remove, new_session
          from PIL import Image

          session = new_session("${{ github.event.inputs.model_name }}")
          input_image = Image.open('source_image.jpg').convert('RGB')
          output_image = remove(
              input_image,
              session=session,
              alpha_matting=True,
              alpha_matting_foreground_threshold=240,
              alpha_matting_background_threshold=10,
              alpha_matting_erode_size=10,
          )
          output_image.save('image_no_bg.png')
          print(f"Background dihapus: {output_image.size}")
          EOF

      - name: Gabungkan background custom
        run: |
          python << 'EOF'
          from PIL import Image

          bg_hex = "${{ github.event.inputs.bg_color }}".lstrip('#')
          bg_opacity = int("${{ github.event.inputs.bg_opacity }}")
          if len(bg_hex) == 3:
              bg_hex = ''.join([c*2 for c in bg_hex])
          bg_rgb = tuple(int(bg_hex[i:i+2], 16) for i in (0, 2, 4))
          bg_alpha = int(255 * bg_opacity / 100)

          image = Image.open('image_no_bg.png').convert('RGBA')
          width, height = image.size
          background = Image.new('RGBA', (width, height), bg_rgb + (bg_alpha,))
          result = Image.alpha_composite(background, image)
          result.convert('RGB').save('image_with_bg.jpg', quality=95)
          print(f"Komposit: {width}x{height}")
          EOF

      - name: Vectorize dengan VTracer
        run: |
          python << 'EOF'
          import vtracer, os
          output = "${{ github.event.inputs.output_name }}.svg"
          vtracer.convert_image_to_svg_py(
              'image_with_bg.jpg',
              output,
              colormode='color',
              color_precision=8,
              filter_speckle=2,
              layer_difference=4,
              corner_threshold=60,
              length_threshold=2.0,
              splice_threshold=45,
              path_precision=5
          )
          print(f"SVG: {output} ({os.path.getsize(output):,} bytes)")
          EOF

      - name: Simplify path dengan Inkscape
        run: |
          inkscape "${{ github.event.inputs.output_name }}.svg" \
            --batch-process \
            --actions='select-all;path-simplify;export-plain-svg' \
            --export-filename="${{ github.event.inputs.output_name }}_simplified.svg"
          ls -lh "${{ github.event.inputs.output_name }}_simplified.svg"

      - name: Buat SVGO config
        run: |
          cat > svgo.config.mjs << 'EOF'
          export default {
            multipass: true,
            precision: 2,
            plugins: [
              'preset-default',
              'removeComments',
              'removeMetadata',
              'cleanupNumericValues',
              'convertPathData',
              'collapseGroups'
            ]
          };
          EOF

      - name: Optimize SVG dengan SVGO
        run: |
          svgo --config svgo.config.mjs \
            -i "${{ github.event.inputs.output_name }}_simplified.svg" \
            -o "${{ github.event.inputs.output_name }}_optimized.svg"
          ls -lh "${{ github.event.inputs.output_name }}_optimized.svg"

      - name: Verifikasi output
        run: |
          if [ ! -f "${{ github.event.inputs.output_name }}_optimized.svg" ]; then
            echo "❌ SVG optimized tidak ditemukan!"
            ls -la
            exit 1
          fi
          echo "✅ File output:"
          ls -lh *.svg *.png *.jpg 2>/dev/null || true

      - name: Buat Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.output_name }}-v${{ github.run_number }}
          name: "Vectorized SVG - ${{ github.event.inputs.output_name }}"
          body: |
            ## Hasil Vektorisasi (dengan Inkscape Simplify)
            **Sumber:** ${{ github.event.inputs.image_url }}
            **Model rembg:** ${{ github.event.inputs.model_name }}
            **Output:** ${{ github.event.inputs.output_name }}_optimized.svg
          files: |
            ${{ github.event.inputs.output_name }}_optimized.svg
            ${{ github.event.inputs.output_name }}.svg
            image_no_bg.png
            image_with_bg.jpg
          draft: false
          prerelease: false
