name: Vectorize dengan Background Remover & Custom Background

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL gambar sumber'
        required: true
        default: 'https://i.pinimg.com/736x/ba/53/9d/ba539da3426ce5359601138c02258f1d.jpg'
        type: string
      output_name:
        description: 'Nama file SVG (tanpa .svg)'
        required: true
        default: 'vectorized'
        type: string
      bg_color:
        description: 'Warna background (hex, contoh: #ffffff, #000000, #FF5733)'
        required: true
        default: '#ffffff'
        type: string
      bg_opacity:
        description: 'Opacity background (0-100)'
        required: true
        default: '100'
        type: string

permissions:
  contents: write

jobs:
  vectorize-with-bg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install vtracer
          pip install torch torchvision transformers pillow numpy
          pip install "transformers>=4.48.0"
          npm install -g svgo

      - name: Download gambar sumber
        run: |
          curl -L -A "Mozilla/5.0" "${{ github.event.inputs.image_url }}" -o source_image.jpg
          file source_image.jpg

      - name: Hapus background dengan RMBG-2.0
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import torch
          from transformers import AutoModelForImageSegmentation
          from torchvision import transforms
          from PIL import Image
          
          token = os.environ["HF_TOKEN"]
          
          print("Memuat model RMBG-2.0...")
          model = AutoModelForImageSegmentation.from_pretrained(
              'briaai/RMBG-2.0',
              trust_remote_code=True,
              token=token
          )
          device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
          model.to(device)
          model.eval()
          print(f"Model dimuat di {device}")
          
          transform = transforms.Compose([
              transforms.Resize((1024, 1024)),
              transforms.ToTensor(),
              transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225])
          ])
          
          image = Image.open('source_image.jpg').convert('RGB')
          original_size = image.size
          
          input_tensor = transform(image).unsqueeze(0).to(device)
          
          with torch.no_grad():
              preds = model(input_tensor)[-1].sigmoid().cpu()
          
          pred = preds[0].squeeze()
          mask = transforms.ToPILImage()(pred).resize(original_size)
          
          image_rgba = image.convert('RGBA')
          image_rgba.putalpha(mask)
          image_rgba.save('image_no_bg.png')
          print("Background dihapus. Gambar RGBA disimpan.")
          EOF

      - name: Gabungkan dengan warna background custom
        run: |
          python << 'EOF'
          from PIL import Image
          
          bg_hex = "${{ github.event.inputs.bg_color }}".lstrip('#')
          bg_opacity = int("${{ github.event.inputs.bg_opacity }}")
          
          if len(bg_hex) == 3:
              bg_hex = ''.join([c*2 for c in bg_hex])
          bg_rgb = tuple(int(bg_hex[i:i+2], 16) for i in (0, 2, 4))
          bg_alpha = int(255 * bg_opacity / 100)
          
          print(f"Warna background: RGB{bg_rgb}, Alpha: {bg_alpha}")
          
          image = Image.open('image_no_bg.png').convert('RGBA')
          width, height = image.size
          
          background = Image.new('RGBA', (width, height), bg_rgb + (bg_alpha,))
          
          result = Image.alpha_composite(background, image)
          
          result_rgb = result.convert('RGB')
          result_rgb.save('image_with_bg.jpg', quality=95)
          result.save('image_with_bg_rgba.png')
          print(f"Komposit disimpan: {width}x{height}")
          EOF

      - name: Vectorize dengan VTracer (parameter optimized)
        run: |
          python << 'EOF'
          import vtracer
          import os
          
          output = "${{ github.event.inputs.output_name }}.svg"
          
          vtracer.convert_image_to_svg_py(
              'image_with_bg.jpg',
              output,
              colormode='color',
              color_precision=8,
              filter_speckle=2,
              layer_difference=4,
              corner_threshold=60,
              length_threshold=2.0,
              splice_threshold=45,
              path_precision=5
          )
          
          size = os.path.getsize(output)
          print(f"SVG dibuat: {output} ({size:,} bytes)")
          EOF

      - name: Optimize SVG dengan SVGO
        run: |
          svgo "${{ github.event.inputs.output_name }}.svg" \
            --multipass \
            --precision=2 \
            --enable=removeMetadata,removeComments,cleanupNumericValues,convertPathData,collapseGroups \
            -o "${{ github.event.inputs.output_name }}_optimized.svg"
          
          ls -lh "${{ github.event.inputs.output_name }}_optimized.svg"

      - name: Verifikasi output
        run: |
          if [ ! -f "${{ github.event.inputs.output_name }}_optimized.svg" ]; then
            echo "❌ SVG optimized tidak ditemukan!"
            ls -la
            exit 1
          fi
          echo "✅ File output:"
          ls -lh *.svg *.png *.jpg 2>/dev/null || true
          echo ""
          echo "Preview header SVG:"
          head -c 200 "${{ github.event.inputs.output_name }}_optimized.svg"

      - name: Buat Release dengan SVG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.output_name }}-v${{ github.run_number }}
          name: "Vectorized SVG - ${{ github.event.inputs.output_name }}"
          body: |
            ## Hasil Vektorisasi
            
            **Sumber:** ${{ github.event.inputs.image_url }}
            **Warna Background:** ${{ github.event.inputs.bg_color }} (opacity: ${{ github.event.inputs.bg_opacity }}%)
            **Output:** ${{ github.event.inputs.output_name }}_optimized.svg
            
            Diproses dengan RMBG-2.0 + VTracer + SVGO.
          files: |
            ${{ github.event.inputs.output_name }}_optimized.svg
            ${{ github.event.inputs.output_name }}.svg
            image_no_bg.png
            image_with_bg.jpg
          draft: false
          prerelease: false
