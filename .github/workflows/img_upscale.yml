name: Upscale Image (Real-ESRGAN x4plus)

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL gambar input'
        required: true
        default: 'https://example.com/input.jpg'

permissions:
  contents: write

jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install dependencies (Vulkan + curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip libvulkan1 mesa-vulkan-drivers

      - name: Download Real-ESRGAN NCNN binary
        run: |
          curl -fL -o realesrgan.zip \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          unzip realesrgan.zip
          chmod +x realesrgan-ncnn-vulkan

      - name: Download input image from URL
        run: |
          curl -fL -o input.jpg "${{ github.event.inputs.image_url }}"
          ls -lh input.jpg

      - name: Run RealESRGAN x4plus
        run: |
          ./realesrgan-ncnn-vulkan \
            -i input.jpg \
            -o output.png \
            -n realesrgan-x4plus \
            -s 4 \
            -t 256 \
            -v
          ls -lh output.png

      - name: Upload to GitHub Release (no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: upscale-${{ github.run_number }}
          name: "Upscaled Image #${{ github.run_number }}"
          files: output.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
