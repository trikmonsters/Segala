name: Blender 3D Render to Video

on:
  workflow_dispatch:


jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Write Blender script
        run: |
          cat > generate_scene.py << 'PYEOF'
          import bpy
          import math
          import random
          from mathutils import Vector

          # ---------- Reset ke scene kosong (aman untuk Blender 5.x) ----------
          bpy.ops.wm.read_factory_settings(use_empty=True)
          scene = bpy.context.scene

          # ---------- World ----------
          world = bpy.data.worlds.new("World")
          scene.world = world
          world.use_nodes = True
          bg = world.node_tree.nodes.get('Background')
          if bg is None:
              bg = world.node_tree.nodes.new('ShaderNodeBackground')
              output = world.node_tree.nodes.get('World Output')
              world.node_tree.links.new(bg.outputs[0], output.inputs[0])
          bg.inputs[0].default_value = (0.02, 0.02, 0.05, 1)
          bg.inputs[1].default_value = 0.3

          # ---------- Render settings ----------
          scene.render.engine = 'BLENDER_EEVEE_NEXT'
          scene.render.resolution_x = 1080
          scene.render.resolution_y = 1080
          scene.render.fps = 30
          scene.frame_start = 1
          scene.frame_end = 120

          scene.render.image_settings.file_format = 'PNG'
          scene.render.filepath = '/workspace/output/frame_'

          # ---------- Main metal torus ----------
          bpy.ops.mesh.primitive_torus_add(
              major_radius=2.0,
              minor_radius=0.35,
              major_segments=96,
              minor_segments=32,
              location=(0, 0, 0)
          )
          torus = bpy.context.active_object

          mat = bpy.data.materials.new(name="Metal")
          mat.use_nodes = True
          bsdf = mat.node_tree.nodes.get('Principled BSDF')
          bsdf.inputs['Base Color'].default_value = (0.05, 0.05, 0.08, 1)
          bsdf.inputs['Metallic'].default_value = 1.0
          bsdf.inputs['Roughness'].default_value = 0.25
          torus.data.materials.append(mat)

          for v in torus.data.vertices:
              v.co.x += random.uniform(-0.05, 0.05)
              v.co.y += random.uniform(-0.05, 0.05)
              v.co.z += random.uniform(-0.05, 0.05)

          # ---------- Glowing particle ring ----------
          particles = []
          for i in range(36):
              angle = (i / 36) * math.tau
              r = 2.8
              x = r * math.cos(angle)
              y = r * math.sin(angle)
              z = random.uniform(-0.3, 0.3)
              bpy.ops.mesh.primitive_uv_sphere_add(radius=0.08, location=(x, y, z))
              p = bpy.context.active_object

              pmat = bpy.data.materials.new(name=f"Glow{i}")
              pmat.use_nodes = True
              emit = pmat.node_tree.nodes.new('ShaderNodeEmission')
              emit.inputs['Color'].default_value = (0.2, 0.6, 1.0, 1)
              emit.inputs['Strength'].default_value = 4.0
              pmat.node_tree.links.new(emit.outputs[0], pmat.node_tree.nodes['Material Output'].inputs[0])
              p.data.materials.append(pmat)

              particles.append((p, angle, z))

          # ---------- Camera ----------
          bpy.ops.object.camera_add(location=(0, -6.5, 2.2))
          cam = bpy.context.active_object
          cam.rotation_euler = (math.radians(72), 0, 0)
          scene.camera = cam

          # ---------- Lights ----------
          bpy.ops.object.light_add(type='AREA', location=(4, -4, 5))
          key = bpy.context.active_object
          key.data.energy = 800
          key.data.size = 3

          bpy.ops.object.light_add(type='AREA', location=(-4, 3, 3))
          fill = bpy.context.active_object
          fill.data.energy = 400
          fill.data.size = 4

          # ---------- Animation ----------
          for frame in range(scene.frame_start, scene.frame_end + 1):
              scene.frame_set(frame)
              t = (frame - 1) / (scene.frame_end - 1)

              torus.rotation_euler = (
                  math.sin(t * math.tau) * 0.15,
                  t * math.tau * 0.5,
                  math.cos(t * math.tau) * 0.15
              )

              for p, base_angle, base_z in particles:
                  angle = base_angle + t * math.tau * 1.2
                  r = 2.8 + math.sin(t * math.tau * 2 + base_angle) * 0.15
                  p.location = (
                      r * math.cos(angle),
                      r * math.sin(angle),
                      base_z + math.sin(t * math.tau * 3 + base_angle) * 0.5
                  )

              cam.location.y = -6.5 + math.sin(t * math.tau) * 0.5
              cam.location.z = 2.2 + math.cos(t * math.tau) * 0.3

          # ---------- Render ----------
          bpy.ops.render.render(animation=True)
          print("Rendering complete.")
          PYEOF

      - name: Run Blender headless render
        run: |
          mkdir -p output/frames
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            blendergrid/blender \
            --background \
            --python /workspace/generate_scene.py

      - name: Move PNG frames into subfolder
        run: |
          mv output/frame_*.png output/frames/ || true
          echo "Total frames:"
          ls output/frames/ | wc -l

      - name: Convert PNG frames to MP4
        run: |
          ffmpeg -y -framerate 30 \
            -i output/frames/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p \
            -crf 18 -preset slow \
            output/creative_animation.mp4

      - name: Upload MP4 video
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: output/creative_animation.mp4
          retention-days: 7

      - name: Upload PNG frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-png
          path: output/frames/
          retention-days: 7
