name: Blender 3D Pro Render (Image + Video)

on:
  workflow_dispatch:
    inputs:
      frame_end:
        description: "Frame terakhir animasi"
        required: false
        default: "150"
      samples:
        description: "Jumlah Cycles samples (kualitas vs waktu render)"
        required: false
        default: "60"
  

env:
  BLENDER_VERSION: "4.2.3"
  BLENDER_SERIES: "4.2"
  HDRI_URL: "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache Blender install
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download & install Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -fL -o blender.tar.xz \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p /opt/blender
          tar -xJf blender.tar.xz -C /opt/blender --strip-components=1

      - name: Add Blender to PATH
        run: echo "/opt/blender" >> "$GITHUB_PATH"

      - name: Verify Blender version
        run: blender --version

      - name: Prepare folders
        run: mkdir -p assets output/frames output/stills

      # Environment HDRI bikin refleksi & lighting jauh lebih realistis
      # dibanding cuma world background flat color.
      - name: Download HDRI environment
        run: curl -fL -o assets/studio.hdr "${HDRI_URL}"

      - name: Write Blender script
        run: |
          cat > generate_scene.py << 'PYEOF'
          import bpy
          import math
          import random
          import os

          random.seed(7)

          FRAME_END = int(os.environ.get("FRAME_END", "150"))
          SAMPLES = int(os.environ.get("SAMPLES", "128"))

          bpy.ops.wm.read_factory_settings(use_empty=True)
          scene = bpy.context.scene

          # ---------- World: HDRI environment lighting ----------
          world = bpy.data.worlds.new("World")
          scene.world = world
          world.use_nodes = True
          nt = world.node_tree
          nt.nodes.clear()

          env_tex = nt.nodes.new('ShaderNodeTexEnvironment')
          env_tex.image = bpy.data.images.load(os.path.abspath("assets/studio.hdr"))
          mapping = nt.nodes.new('ShaderNodeMapping')
          tex_coord = nt.nodes.new('ShaderNodeTexCoord')
          background = nt.nodes.new('ShaderNodeBackground')
          world_out = nt.nodes.new('ShaderNodeOutputWorld')

          background.inputs['Strength'].default_value = 1.1
          nt.links.new(tex_coord.outputs['Generated'], mapping.inputs['Vector'])
          nt.links.new(mapping.outputs['Vector'], env_tex.inputs['Vector'])
          nt.links.new(env_tex.outputs['Color'], background.inputs['Color'])
          nt.links.new(background.outputs['Background'], world_out.inputs['Surface'])

          # ---------- Render settings ----------
          scene.render.engine = 'CYCLES'
          scene.cycles.device = 'CPU'
          scene.cycles.samples = SAMPLES
          scene.cycles.use_denoising = True
          scene.cycles.use_adaptive_sampling = True

          scene.render.resolution_x = 1920
          scene.render.resolution_y = 1920
          scene.render.fps = 30
          scene.frame_start = 1
          scene.frame_end = FRAME_END

          scene.render.image_settings.file_format = 'PNG'
          scene.render.image_settings.color_depth = '16'
          scene.render.filepath = 'output/frames/frame_'

          scene.view_settings.view_transform = 'AgX'  # color science lebih sinematik
          scene.view_settings.look = 'AgX - Medium High Contrast'

          # ---------- Hero object: brushed metal torus knot ----------
          bpy.ops.mesh.primitive_torus_add(
              major_radius=2.0, minor_radius=0.5,
              major_segments=128, minor_segments=48,
              location=(0, 0, 0)
          )
          hero = bpy.context.active_object
          hero.name = "HeroObject"

          bevel = hero.modifiers.new(name="Bevel", type='BEVEL')
          bevel.width = 0.01
          bevel.segments = 3
          subsurf = hero.modifiers.new(name="Subsurf", type='SUBSURF')
          subsurf.levels = 2

          mat = bpy.data.materials.new(name="BrushedMetal")
          mat.use_nodes = True
          nodes = mat.node_tree.nodes
          bsdf = nodes.get('Principled BSDF')
          bsdf.inputs['Base Color'].default_value = (0.55, 0.56, 0.6, 1)
          bsdf.inputs['Metallic'].default_value = 1.0
          bsdf.inputs['Roughness'].default_value = 0.18
          bsdf.inputs['Anisotropic'].default_value = 0.6
          hero.data.materials.append(mat)

          # ---------- Orbiting glass spheres ----------
          glass_mat = bpy.data.materials.new(name="Glass")
          glass_mat.use_nodes = True
          gbsdf = glass_mat.node_tree.nodes.get('Principled BSDF')
          gbsdf.inputs['Transmission Weight'].default_value = 1.0
          gbsdf.inputs['Roughness'].default_value = 0.02
          gbsdf.inputs['IOR'].default_value = 1.45

          orbiters = []
          count = 24
          for i in range(count):
              angle = (i / count) * math.tau
              r = 3.4
              x, y = r * math.cos(angle), r * math.sin(angle)
              z = random.uniform(-0.4, 0.4)
              bpy.ops.mesh.primitive_ico_sphere_add(
                  radius=0.14, subdivisions=3, location=(x, y, z)
              )
              sph = bpy.context.active_object
              sph.data.materials.append(glass_mat)
              orbiters.append((sph, angle, z))

          # ---------- Accent emission ring ----------
          emit_mat = bpy.data.materials.new(name="AccentGlow")
          emit_mat.use_nodes = True
          enodes = emit_mat.node_tree.nodes
          enodes.clear()
          emit = enodes.new('ShaderNodeEmission')
          emit.inputs['Color'].default_value = (0.25, 0.65, 1.0, 1)
          emit.inputs['Strength'].default_value = 6.0
          eout = enodes.new('ShaderNodeOutputMaterial')
          emit_mat.node_tree.links.new(emit.outputs[0], eout.inputs['Surface'])

          bpy.ops.mesh.primitive_torus_add(
              major_radius=3.4, minor_radius=0.015,
              major_segments=128, minor_segments=8,
              location=(0, 0, 0)
          )
          ring = bpy.context.active_object
          ring.data.materials.append(emit_mat)

          # ---------- Camera with depth of field ----------
          bpy.ops.object.camera_add(location=(0, -8.5, 2.6))
          cam = bpy.context.active_object
          cam.rotation_euler = (math.radians(74), 0, 0)
          cam.data.dof.use_dof = True
          cam.data.dof.focus_distance = 8.5
          cam.data.dof.aperture_fstop = 2.0
          cam.data.lens = 70
          scene.camera = cam

          # ---------- Fill lights (complement the HDRI) ----------
          bpy.ops.object.light_add(type='AREA', location=(5, -3, 6))
          key = bpy.context.active_object
          key.data.energy = 500
          key.data.size = 4

          bpy.ops.object.light_add(type='AREA', location=(-5, 4, 3))
          rim = bpy.context.active_object
          rim.data.energy = 300
          rim.data.size = 3
          rim.data.color = (0.6, 0.8, 1.0)

          # ---------- Animation ----------
          for frame in range(scene.frame_start, scene.frame_end + 1):
              scene.frame_set(frame)
              t = (frame - 1) / (scene.frame_end - 1)

              hero.rotation_euler = (
                  math.sin(t * math.tau) * 0.15,
                  t * math.tau * 0.4,
                  math.cos(t * math.tau) * 0.15
              )

              for sph, base_angle, base_z in orbiters:
                  angle = base_angle + t * math.tau * 0.9
                  r = 3.4 + math.sin(t * math.tau * 2 + base_angle) * 0.12
                  sph.location = (
                      r * math.cos(angle),
                      r * math.sin(angle),
                      base_z + math.sin(t * math.tau * 3 + base_angle) * 0.35
                  )
                  sph.rotation_euler = (0, 0, angle)

              cam.location.x = math.sin(t * math.tau * 0.5) * 0.6
              cam.location.z = 2.6 + math.cos(t * math.tau) * 0.25

          # ---------- Render animation ----------
          bpy.ops.render.render(animation=True)

          # ---------- Render one high-res "hero" still frame ----------
          scene.frame_set(int(scene.frame_end * 0.35))
          scene.render.resolution_x = 3840
          scene.render.resolution_y = 3840
          scene.render.filepath = 'output/stills/hero_shot.png'
          bpy.ops.render.render(write_still=True)

          print("Rendering complete.")
          PYEOF

      - name: Run Blender headless render
        env:
          FRAME_END: ${{ github.event.inputs.frame_end || '150' }}
          SAMPLES: ${{ github.event.inputs.samples || '128' }}
        run: |
          blender --background \
            --python-exit-code 1 \
            --python generate_scene.py

      - name: Verify frames were generated
        run: |
          count=$(ls output/frames/frame_*.png 2>/dev/null | wc -l)
          echo "Total frames: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::Tidak ada frame PNG yang dihasilkan. Render gagal."
            exit 1
          fi
          if [ ! -f output/stills/hero_shot.png ]; then
            echo "::error::Hero still image tidak ditemukan. Render gagal."
            exit 1
          fi

      - name: Convert PNG frames to MP4
        run: |
          ffmpeg -y -framerate 30 \
            -i output/frames/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p \
            -crf 16 -preset slow \
            output/creative_animation.mp4

      - name: Upload MP4 video
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: output/creative_animation.mp4
          retention-days: 14

      - name: Upload hero still image
        uses: actions/upload-artifact@v4
        with:
          name: hero-image
          path: output/stills/hero_shot.png
          retention-days: 14

      - name: Upload PNG frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-png
          path: output/frames/
          retention-days: 14
