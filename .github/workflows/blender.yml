name: Blender 3D Pro Render (Parallel, Image + Video)

on:
  workflow_dispatch:
    inputs:
      frame_end:
        description: "Jumlah frame"
        required: true
        default: "120"

      samples:
        description: "Cycles samples"
        required: true
        default: "32"

      resolution:
        description: "Resolution square"
        required: true
        default: "1280"

      shards:
        description: "Jumlah parallel shards"
        required: true
        default: "5"

env:
  BLENDER_VERSION: "4.2.3"
  BLENDER_SERIES: "4.2"

  HDRI_URL: "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr"

  FRAME_END: ${{ inputs.frame_end }}
  SAMPLES: ${{ inputs.samples }}
  RESOLUTION: ${{ inputs.resolution }}
  SHARDS: ${{ inputs.shards }}


jobs:

  # ============================================================
  # PLAN SHARDS
  # ============================================================

  plan:
    runs-on: ubuntu-latest

    outputs:
      shard_list: ${{ steps.generate.outputs.list }}

    steps:

      - name: Generate shard list
        id: generate
        env:
          TOTAL_SHARDS: ${{ env.SHARDS }}
          TOTAL_FRAMES: ${{ env.FRAME_END }}

        run: |

          set -e

          n="${TOTAL_SHARDS}"
          frames="${TOTAL_FRAMES}"

          if ! [[ "$n" =~ ^[0-9]+$ ]]; then
            echo "::error::SHARDS harus berupa angka."
            exit 1
          fi

          if ! [[ "$frames" =~ ^[0-9]+$ ]]; then
            echo "::error::FRAME_END harus berupa angka."
            exit 1
          fi

          if [ "$n" -lt 1 ]; then
            echo "::error::SHARDS harus minimal 1."
            exit 1
          fi

          if [ "$frames" -lt 1 ]; then
            echo "::error::FRAME_END harus minimal 1."
            exit 1
          fi

          if [ "$n" -gt "$frames" ]; then
            echo "::error::SHARDS ($n) tidak boleh lebih besar dari FRAME_END ($frames)."
            exit 1
          fi

          list="["

          for ((i=0; i<n; i++)); do

            if [ "$i" -gt 0 ]; then
              list="${list},"
            fi

            list="${list}${i}"

          done

          list="${list}]"

          echo "Shard list: $list"

          echo "list=$list" >> "$GITHUB_OUTPUT"


  # ============================================================
  # PARALLEL BLENDER RENDER
  # ============================================================

  render:
    needs: plan

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shard_list) }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # INSTALL BLENDER
      # ========================================================

      - name: Install Blender
        shell: bash
        run: |

          set -e

          wget -q \
            "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            -O blender.tar.xz

          tar -xf blender.tar.xz

          mv "blender-${BLENDER_VERSION}-linux-x64" blender

          echo "$GITHUB_WORKSPACE/blender" >> "$GITHUB_PATH"

          "$GITHUB_WORKSPACE/blender/blender" --version


      # ========================================================
      # COMPUTE FRAME RANGE
      # ========================================================

      - name: Compute frame range for this shard
        id: range

        env:
          TOTAL_FRAMES: ${{ env.FRAME_END }}
          TOTAL_SHARDS: ${{ env.SHARDS }}
          CURRENT_SHARD: ${{ matrix.shard }}

        shell: bash
        run: |

          set -e

          python3 << 'PY' >> "$GITHUB_OUTPUT"

          import os

          total = int(os.environ["TOTAL_FRAMES"])
          shards = int(os.environ["TOTAL_SHARDS"])
          shard = int(os.environ["CURRENT_SHARD"])

          per = (total + shards - 1) // shards

          start = shard * per + 1
          end = min(total, start + per - 1)

          print(f"start={start}")
          print(f"end={end}")

          PY


      # ========================================================
      # SHOW RANGE
      # ========================================================

      - name: Show shard frame range
        shell: bash
        run: |

          echo "============================================"
          echo "Shard        : ${{ matrix.shard }}"
          echo "Frame start  : ${{ steps.range.outputs.start }}"
          echo "Frame end    : ${{ steps.range.outputs.end }}"
          echo "============================================"


      # ========================================================
      # DOWNLOAD HDRI
      # ========================================================

      - name: Download HDRI
        shell: bash
        run: |

          set -e

          mkdir -p assets

          wget -q \
            "$HDRI_URL" \
            -O assets/studio.hdr

          test -s assets/studio.hdr


      # ========================================================
      # CREATE BLENDER SCRIPT
      # ========================================================

      - name: Create Blender render script
        shell: bash
        env:
          START_FRAME: ${{ steps.range.outputs.start }}
          END_FRAME: ${{ steps.range.outputs.end }}

        run: |

          cat > render.py << 'PY'

          import bpy
          import math
          import os

          from mathutils import Vector


          # ====================================================
          # ENVIRONMENT
          # ====================================================

          start_frame = int(os.environ["START_FRAME"])
          end_frame = int(os.environ["END_FRAME"])

          samples = int(os.environ["SAMPLES"])
          resolution = int(os.environ["RESOLUTION"])

          hdr_path = os.path.abspath("assets/studio.hdr")

          output_dir = os.path.abspath("output/frames")

          os.makedirs(output_dir, exist_ok=True)


          # ====================================================
          # RESET
          # ====================================================

          bpy.ops.wm.read_factory_settings(use_empty=True)

          scene = bpy.context.scene


          # ====================================================
          # RENDER SETTINGS
          # ====================================================

          scene.render.engine = "BLENDER_EEVEE_NEXT"

          scene.render.resolution_x = resolution
          scene.render.resolution_y = resolution
          scene.render.resolution_percentage = 100

          scene.render.image_settings.file_format = "PNG"

          scene.render.fps = 30

          scene.render.film_transparent = False


          # ====================================================
          # COLOR MANAGEMENT
          # ====================================================

          try:
              scene.view_settings.look = "AgX - Medium High Contrast"
          except Exception:
              pass


          # ====================================================
          # WORLD / HDRI
          # ====================================================

          world = bpy.data.worlds.new("World")

          scene.world = world

          world.use_nodes = True

          nodes = world.node_tree.nodes
          links = world.node_tree.links

          nodes.clear()

          output = nodes.new("ShaderNodeOutputWorld")
          background = nodes.new("ShaderNodeBackground")
          environment = nodes.new("ShaderNodeTexEnvironment")

          environment.image = bpy.data.images.load(
              hdr_path,
              check_existing=True
          )

          background.inputs["Strength"].default_value = 0.35

          links.new(
              environment.outputs["Color"],
              background.inputs["Color"]
          )

          links.new(
              background.outputs["Background"],
              output.inputs["Surface"]
          )


          # ====================================================
          # MATERIAL HELPER
          # ====================================================

          def create_material(
              name,
              base_color,
              metallic=0.0,
              roughness=0.5,
              emission=None,
              emission_strength=0.0
          ):

              mat = bpy.data.materials.new(name)

              mat.use_nodes = True

              bsdf = mat.node_tree.nodes.get("Principled BSDF")

              bsdf.inputs["Base Color"].default_value = (
                  base_color[0],
                  base_color[1],
                  base_color[2],
                  1.0
              )

              bsdf.inputs["Metallic"].default_value = metallic

              bsdf.inputs["Roughness"].default_value = roughness

              if emission is not None:

                  bsdf.inputs["Emission Color"].default_value = (
                      emission[0],
                      emission[1],
                      emission[2],
                      1.0
                  )

                  bsdf.inputs["Emission Strength"].default_value = (
                      emission_strength
                  )

              return mat


          # ====================================================
          # HERO TORUS
          # ====================================================

          bpy.ops.mesh.primitive_torus_add(
              major_radius=2.0,
              minor_radius=0.45,
              major_segments=96,
              minor_segments=32,
              location=(0, 0, 0)
          )

          hero = bpy.context.object

          hero.name = "Hero_Object"

          hero.data.materials.append(
              create_material(
                  "Hero_Metal",
                  (0.08, 0.12, 0.18),
                  metallic=0.92,
                  roughness=0.18
              )
          )


          # ====================================================
          # HERO BEVEL
          # ====================================================

          bevel = hero.modifiers.new(
              name="Precision Bevel",
              type="BEVEL"
          )

          bevel.width = 0.08
          bevel.segments = 3


          # ====================================================
          # EMISSIVE INNER RING
          # ====================================================

          bpy.ops.mesh.primitive_torus_add(
              major_radius=1.55,
              minor_radius=0.06,
              major_segments=96,
              minor_segments=16,
              location=(0, 0, 0)
          )

          glow_ring = bpy.context.object

          glow_ring.name = "Glow_Ring"

          glow_ring.data.materials.append(
              create_material(
                  "Glow_Material",
                  (0.03, 0.08, 0.15),
                  metallic=0.1,
                  roughness=0.2,
                  emission=(0.0, 0.35, 1.0),
                  emission_strength=8.0
              )
          )


          # ====================================================
          # ORBITER MATERIAL
          # ====================================================

          orb_material = create_material(
              "Orbiter_Glass",
              (0.12, 0.22, 0.32),
              metallic=0.35,
              roughness=0.12,
              emission=(0.0, 0.08, 0.2),
              emission_strength=1.5
          )


          # ====================================================
          # ORBITER SPHERES
          # ====================================================

          orbiters = []

          for i in range(6):

              angle = (math.pi * 2.0 / 6.0) * i

              radius = 3.6

              x = math.cos(angle) * radius
              y = math.sin(angle) * radius

              z = 0.2 + math.sin(angle * 2.0) * 0.5

              bpy.ops.mesh.primitive_uv_sphere_add(
                  segments=48,
                  ring_count=24,
                  radius=0.25,
                  location=(x, y, z)
              )

              orb = bpy.context.object

              orb.name = f"Orbiter_{i:02d}"

              orb.data.materials.append(orb_material)

              orbiters.append(orb)


          # ====================================================
          # FLOOR
          # ====================================================

          floor_material = create_material(
              "Floor_Material",
              (0.015, 0.02, 0.03),
              metallic=0.15,
              roughness=0.28
          )

          bpy.ops.mesh.primitive_plane_add(
              size=30,
              location=(0, 0, -1.0)
          )

          floor = bpy.context.object

          floor.name = "Floor"

          floor.data.materials.append(floor_material)


          # ====================================================
          # CAMERA
          # ====================================================

          bpy.ops.object.camera_add(
              location=(8.5, -8.5, 5.5)
          )

          camera = bpy.context.object

          camera.name = "Camera"

          scene.camera = camera

          camera.data.lens = 52


          # ====================================================
          # CAMERA LOOK AT
          # ====================================================

          def look_at(obj, target):

              direction = Vector(target) - obj.location

              obj.rotation_euler = direction.to_track_quat(
                  "-Z",
                  "Y"
              ).to_euler()


          look_at(
              camera,
              (0, 0, 0)
          )


          # ====================================================
          # AREA LIGHT HELPER
          # ====================================================

          def create_area_light(
              name,
              location,
              energy,
              size,
              color
          ):

              bpy.ops.object.light_add(
                  type="AREA",
                  location=location
              )

              light = bpy.context.object

              light.name = name

              light.data.energy = energy

              light.data.shape = "DISK"

              light.data.size = size

              light.data.color = color

              look_at(
                  light,
                  (0, 0, 0)
              )

              return light


          # ====================================================
          # LIGHTS
          # ====================================================

          create_area_light(
              "Key_Light",
              (4, -4, 7),
              1100,
              5,
              (0.75, 0.88, 1.0)
          )

          create_area_light(
              "Fill_Light",
              (-5, -2, 3),
              800,
              4,
              (0.35, 0.55, 1.0)
          )

          create_area_light(
              "Rim_Light",
              (2, 5, 5),
              1200,
              4,
              (0.2, 0.45, 1.0)
          )


          # ====================================================
          # FRAME LOOP
          # ====================================================

          total_frames = max(1, end_frame - start_frame + 1)

          print(
              f"Rendering frames {start_frame} -> {end_frame}"
          )

          for frame in range(start_frame, end_frame + 1):

              scene.frame_set(frame)

              local_frame = frame - start_frame

              t = local_frame / max(1, total_frames - 1)

              angle = t * math.pi * 2.0


              # ----------------------------------------------
              # HERO ROTATION
              # ----------------------------------------------

              hero.rotation_euler[0] = angle * 0.55

              hero.rotation_euler[1] = angle * 0.35

              hero.rotation_euler[2] = angle * 1.15


              # ----------------------------------------------
              # HERO FLOATING MOTION
              # ----------------------------------------------

              hero.location.z = (
                  math.sin(angle * 2.0) * 0.22
              )


              # ----------------------------------------------
              # GLOW RING
              # ----------------------------------------------

              glow_ring.rotation_euler[0] = angle * 0.35

              glow_ring.rotation_euler[1] = angle * 0.25

              glow_ring.rotation_euler[2] = angle * 1.25

              glow_ring.location.z = hero.location.z


              # ----------------------------------------------
              # ORBITERS
              # ----------------------------------------------

              for i, orb in enumerate(orbiters):

                  base_angle = (
                      math.pi * 2.0 / len(orbiters)
                  ) * i

                  orb_angle = (
                      base_angle +
                      angle * (0.55 + i * 0.025)
                  )

                  radius = 3.6 + math.sin(
                      angle * 1.5 + i
                  ) * 0.35

                  orb.location.x = (
                      math.cos(orb_angle) * radius
                  )

                  orb.location.y = (
                      math.sin(orb_angle) * radius
                  )

                  orb.location.z = (
                      0.25 +
                      math.sin(
                          angle * 2.0 + i
                      ) * 0.75
                  )


              # ----------------------------------------------
              # CAMERA MOTION
              # ----------------------------------------------

              camera_angle = (
                  -math.pi / 4.0 +
                  angle * 0.18
              )

              camera_radius = 11.0

              camera.location.x = (
                  math.cos(camera_angle) *
                  camera_radius
              )

              camera.location.y = (
                  math.sin(camera_angle) *
                  camera_radius
              )

              camera.location.z = (
                  4.8 +
                  math.sin(angle) * 1.0
              )

              look_at(
                  camera,
                  (
                      0,
                      0,
                      hero.location.z
                  )
              )


              # ----------------------------------------------
              # OUTPUT
              # ----------------------------------------------

              filename = os.path.join(
                  output_dir,
                  f"frame_{frame:06d}.png"
              )

              scene.render.filepath = filename

              bpy.ops.render.render(
                  write_still=True
              )

              if not os.path.isfile(filename):

                  raise RuntimeError(
                      f"Frame tidak berhasil dibuat: {filename}"
                  )

              print(
                  f"Completed frame {frame}: {filename}"
              )


          print(
              f"Shard selesai: {start_frame} -> {end_frame}"
          )

          PY


      # ========================================================
      # RENDER
      # ========================================================

      - name: Render Blender frames
        env:
          START_FRAME: ${{ steps.range.outputs.start }}
          END_FRAME: ${{ steps.range.outputs.end }}

        shell: bash
        run: |

          set -e

          blender \
            --background \
            --python render.py


      # ========================================================
      # VERIFY SHARD
      # ========================================================

      - name: Verify shard frames
        env:
          START_FRAME: ${{ steps.range.outputs.start }}
          END_FRAME: ${{ steps.range.outputs.end }}

        shell: bash
        run: |

          set -e

          expected=$((END_FRAME - START_FRAME + 1))

          actual=$(find output/frames \
            -maxdepth 1 \
            -type f \
            -name 'frame_*.png' \
            | wc -l)

          echo "Expected frames: $expected"
          echo "Actual frames  : $actual"

          if [ "$actual" -ne "$expected" ]; then
            echo "::error::Jumlah frame shard tidak sesuai."
            exit 1
          fi


      # ========================================================
      # UPLOAD SHARD
      # ========================================================

      - name: Upload shard frames
        uses: actions/upload-artifact@v4

        with:
          name: frames-shard-${{ matrix.shard }}
          path: output/frames
          if-no-files-found: error
          compression-level: 0


  # ============================================================
  # COMBINE ALL SHARDS
  # ============================================================

  combine:
    needs: render

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # DOWNLOAD ALL SHARDS
      # ========================================================

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4

        with:
          pattern: frames-shard-*
          path: all_frames_downloads
          merge-multiple: false


      # ========================================================
      # MERGE FRAMES
      # ========================================================

      - name: Merge shard frames
        shell: bash
        run: |

          set -e

          mkdir -p all_frames

          found=0

          while IFS= read -r -d '' file; do

            filename="$(basename "$file")"

            destination="all_frames/$filename"

            if [ -e "$destination" ]; then
              echo "::error::Duplicate frame ditemukan: $filename"
              exit 1
            fi

            cp "$file" "$destination"

            found=$((found + 1))

          done < <(
            find all_frames_downloads \
              -type f \
              -name 'frame_*.png' \
              -print0
          )

          echo "Total merged frames: $found"

          if [ "$found" -eq 0 ]; then
            echo "::error::Tidak ada frame yang ditemukan."
            exit 1
          fi


      # ========================================================
      # VERIFY FRAME COUNT
      # ========================================================

      - name: Verify all frames
        env:
          EXPECTED_FRAMES: ${{ env.FRAME_END }}

        shell: bash
        run: |

          set -e

          expected="$EXPECTED_FRAMES"

          actual=$(find all_frames \
            -maxdepth 1 \
            -type f \
            -name 'frame_*.png' \
            | wc -l)

          echo "Expected total frames: $expected"
          echo "Actual total frames  : $actual"

          if [ "$actual" -ne "$expected" ]; then
            echo "::error::Total frame tidak sesuai."
            exit 1
          fi


      # ========================================================
      # CHECK MISSING / EXTRA / DUPLICATE
      # ========================================================

      - name: Validate frame sequence
        env:
          EXPECTED_FRAMES: ${{ env.FRAME_END }}

        shell: bash
        run: |

          set -e

          python3 << 'PY'

          import os
          import re
          import sys

          expected = int(os.environ["EXPECTED_FRAMES"])

          files = os.listdir("all_frames")

          pattern = re.compile(
              r"^frame_(\d{6})\.png$"
          )

          numbers = []

          for filename in files:

              match = pattern.match(filename)

              if match:
                  numbers.append(
                      int(match.group(1))
                  )

          numbers.sort()

          expected_numbers = list(
              range(1, expected + 1)
          )

          if numbers != expected_numbers:

              missing = sorted(
                  set(expected_numbers) -
                  set(numbers)
              )

              extra = sorted(
                  set(numbers) -
                  set(expected_numbers)
              )

              print(
                  "ERROR: Sequence frame tidak valid."
              )

              if missing:
                  print(
                      "Missing frames:",
                      missing[:50]
                  )

              if extra:
                  print(
                      "Extra frames:",
                      extra[:50]
                  )

              sys.exit(1)

          print(
              f"Frame sequence valid: 1 -> {expected}"
          )

          PY


      # ========================================================
      # NORMALIZE FRAME SEQUENCE
      # ========================================================

      - name: Normalize frames
        shell: bash
        run: |

          set -e

          mkdir -p normalized_frames

          find all_frames \
            -maxdepth 1 \
            -type f \
            -name 'frame_*.png' \
            -print0 |
          sort -z |
          while IFS= read -r -d '' file; do

            filename="$(basename "$file")"

            number="${filename#frame_}"
            number="${number%.png}"

            destination="normalized_frames/frame_${number}.png"

            cp "$file" "$destination"

          done


      # ========================================================
      # VERIFY NORMALIZED FRAMES
      # ========================================================

      - name: Verify normalized frames
        env:
          EXPECTED_FRAMES: ${{ env.FRAME_END }}

        shell: bash
        run: |

          set -e

          expected="$EXPECTED_FRAMES"

          actual=$(find normalized_frames \
            -maxdepth 1 \
            -type f \
            -name 'frame_*.png' \
            | wc -l)

          echo "Expected normalized frames: $expected"
          echo "Actual normalized frames  : $actual"

          if [ "$actual" -ne "$expected" ]; then
            echo "::error::Normalized frame count tidak sesuai."
            exit 1
          fi


      # ========================================================
      # INSTALL FFMPEG
      # ========================================================

      - name: Install FFmpeg
        shell: bash
        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y ffmpeg


      # ========================================================
      # CREATE OUTPUT DIRECTORY
      # ========================================================

      - name: Prepare video output
        shell: bash
        run: |

          mkdir -p output


      # ========================================================
      # CREATE MP4
      # ========================================================

      - name: Create MP4
        shell: bash
        run: |

          set -e

          ffmpeg -y \
            -framerate 30 \
            -start_number 1 \
            -i "normalized_frames/frame_%06d.png" \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -crf 18 \
            -preset slow \
            -movflags +faststart \
            "output/creative_animation.mp4"


      # ========================================================
      # VERIFY MP4
      # ========================================================

      - name: Verify MP4
        shell: bash
        run: |

          set -e

          video="output/creative_animation.mp4"

          if [ ! -f "$video" ]; then
            echo "::error::MP4 tidak ditemukan."
            exit 1
          fi

          size=$(stat -c%s "$video")

          echo "MP4 size: $size bytes"

          if [ "$size" -le 0 ]; then
            echo "::error::MP4 kosong."
            exit 1
          fi

          ffprobe \
            -v error \
            -show_entries \
              format=duration,size \
            -show_entries \
              stream=codec_name,width,height,r_frame_rate,nb_frames \
            -of default=noprint_wrappers=1 \
            "$video"


      # ========================================================
      # UPLOAD FINAL VIDEO
      # ========================================================

      - name: Upload final MP4
        uses: actions/upload-artifact@v4

        with:
          name: blender-final-video
          path: output/creative_animation.mp4
          if-no-files-found: error
          compression-level: 0


      # ========================================================
      # UPLOAD MERGED FRAMES
      # ========================================================

      - name: Upload merged frames
        uses: actions/upload-artifact@v4

        with:
          name: blender-all-frames
          path: normalized_frames
          if-no-files-found: error
          compression-level: 0
