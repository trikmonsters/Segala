name: Blender 3D Pro Render (Parallel, Image + Video)

on:
  workflow_dispatch:
    inputs:
      frame_end:
        description: "Frame terakhir animasi"
        required: false
        default: "120"
      samples:
        description: "Jumlah Cycles samples"
        required: false
        default: "32"
      resolution:
        description: "Resolusi render (persegi), misal 1280"
        required: false
        default: "1280"
      shards:
        description: "Jumlah job paralel untuk membagi frame"
        required: false
        default: "5"

env:
  BLENDER_VERSION: "4.2.3"
  BLENDER_SERIES: "4.2"
  HDRI_URL: "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr"
  FRAME_END: ${{ github.event.inputs.frame_end || '120' }}
  SAMPLES: ${{ github.event.inputs.samples || '32' }}
  RESOLUTION: ${{ github.event.inputs.resolution || '1280' }}
  SHARDS: ${{ github.event.inputs.shards || '5' }}

jobs:
  # Job kecil hanya untuk menghasilkan daftar shard index [0, 1, 2, ...]
  # dipakai sebagai matrix di job render.
  plan:
    runs-on: ubuntu-latest
    outputs:
      shard_list: ${{ steps.gen.outputs.list }}
    steps:
      - id: gen
        run: |
          n=${SHARDS}
          list=$(python3 -c "import json;print(json.dumps(list(range($n))))")
          echo "list=$list" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shard_list) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Blender install
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download & install Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -fL -o blender.tar.xz \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p /opt/blender
          tar -xJf blender.tar.xz -C /opt/blender --strip-components=1

      - name: Add Blender to PATH
        run: echo "/opt/blender" >> "$GITHUB_PATH"

      - name: Prepare folders
        run: mkdir -p assets output/frames output/stills

      - name: Download HDRI environment
        run: curl -fL -o assets/studio.hdr "${HDRI_URL}"

      # Hitung frame awal/akhir untuk shard ini. Animasi (posisi objek per t)
      # tetap dihitung berdasarkan TOTAL_FRAMES supaya gerakan mulus dan
      # tersambung antar shard, hanya rentang frame yang di-render dibagi.
      - name: Compute frame range for this shard
        id: range
        run: |
          python3 -c "
          total = int('${FRAME_END}')
          shards = int('${SHARDS}')
          shard = int('${{ matrix.shard }}')
          per = -(-total // shards)  # ceil division
          start = shard * per + 1
          end = min(total, start + per - 1)
          print(f'start={start}')
          print(f'end={end}')
          " >> "$GITHUB_OUTPUT"

      - name: Write Blender script
        run: |
          cat > generate_scene.py << 'PYEOF'
          import bpy
          import math
          import random
          import os

          random.seed(7)

          TOTAL_FRAMES = int(os.environ["FRAME_END"])
          SAMPLES = int(os.environ["SAMPLES"])
          RES = int(os.environ["RESOLUTION"])
          SHARD_START = int(os.environ["SHARD_START"])
          SHARD_END = int(os.environ["SHARD_END"])

          bpy.ops.wm.read_factory_settings(use_empty=True)
          scene = bpy.context.scene

          # ---------- World: HDRI environment lighting ----------
          world = bpy.data.worlds.new("World")
          scene.world = world
          world.use_nodes = True
          nt = world.node_tree
          nt.nodes.clear()

          env_tex = nt.nodes.new('ShaderNodeTexEnvironment')
          env_tex.image = bpy.data.images.load(os.path.abspath("assets/studio.hdr"))
          mapping = nt.nodes.new('ShaderNodeMapping')
          tex_coord = nt.nodes.new('ShaderNodeTexCoord')
          background = nt.nodes.new('ShaderNodeBackground')
          world_out = nt.nodes.new('ShaderNodeOutputWorld')

          background.inputs['Strength'].default_value = 1.1
          nt.links.new(tex_coord.outputs['Generated'], mapping.inputs['Vector'])
          nt.links.new(mapping.outputs['Vector'], env_tex.inputs['Vector'])
          nt.links.new(env_tex.outputs['Color'], background.inputs['Color'])
          nt.links.new(background.outputs['Background'], world_out.inputs['Surface'])

          # ---------- Render settings (dioptimalkan untuk kecepatan) ----------
          scene.render.engine = 'CYCLES'
          scene.cycles.device = 'CPU'
          scene.cycles.samples = SAMPLES
          scene.cycles.use_denoising = True
          scene.cycles.use_adaptive_sampling = True
          scene.cycles.adaptive_threshold = 0.05  # berhenti lebih cepat kalau sudah cukup bersih
          scene.render.use_persistent_data = True  # hindari rebuild BVH tiap frame

          scene.render.resolution_x = RES
          scene.render.resolution_y = RES
          scene.render.fps = 30

          scene.render.image_settings.file_format = 'PNG'
          scene.render.filepath = 'output/frames/frame_'
          scene.view_settings.view_transform = 'AgX'
          scene.view_settings.look = 'AgX - Medium High Contrast'

          # frame_start/frame_end HANYA menentukan rentang yang dirender
          # shard ini, tapi animasi 't' tetap dihitung dari TOTAL_FRAMES.
          scene.frame_start = SHARD_START
          scene.frame_end = SHARD_END

          # ---------- Hero object ----------
          bpy.ops.mesh.primitive_torus_add(
              major_radius=2.0, minor_radius=0.5,
              major_segments=96, minor_segments=32,
              location=(0, 0, 0)
          )
          hero = bpy.context.active_object
          bevel = hero.modifiers.new(name="Bevel", type='BEVEL')
          bevel.width = 0.01
          bevel.segments = 2

          mat = bpy.data.materials.new(name="BrushedMetal")
          mat.use_nodes = True
          bsdf = mat.node_tree.nodes.get('Principled BSDF')
          bsdf.inputs['Base Color'].default_value = (0.55, 0.56, 0.6, 1)
          bsdf.inputs['Metallic'].default_value = 1.0
          bsdf.inputs['Roughness'].default_value = 0.18
          hero.data.materials.append(mat)

          # ---------- Orbiting glass spheres ----------
          glass_mat = bpy.data.materials.new(name="Glass")
          glass_mat.use_nodes = True
          gbsdf = glass_mat.node_tree.nodes.get('Principled BSDF')
          gbsdf.inputs['Transmission Weight'].default_value = 1.0
          gbsdf.inputs['Roughness'].default_value = 0.02
          gbsdf.inputs['IOR'].default_value = 1.45

          orbiters = []
          count = 20
          for i in range(count):
              angle = (i / count) * math.tau
              r = 3.4
              x, y = r * math.cos(angle), r * math.sin(angle)
              z = random.uniform(-0.4, 0.4)
              bpy.ops.mesh.primitive_ico_sphere_add(
                  radius=0.14, subdivisions=2, location=(x, y, z)
              )
              sph = bpy.context.active_object
              sph.data.materials.append(glass_mat)
              orbiters.append((sph, angle, z))

          # ---------- Accent emission ring ----------
          emit_mat = bpy.data.materials.new(name="AccentGlow")
          emit_mat.use_nodes = True
          enodes = emit_mat.node_tree.nodes
          enodes.clear()
          emit = enodes.new('ShaderNodeEmission')
          emit.inputs['Color'].default_value = (0.25, 0.65, 1.0, 1)
          emit.inputs['Strength'].default_value = 6.0
          eout = enodes.new('ShaderNodeOutputMaterial')
          emit_mat.node_tree.links.new(emit.outputs[0], eout.inputs['Surface'])

          bpy.ops.mesh.primitive_torus_add(
              major_radius=3.4, minor_radius=0.015,
              major_segments=96, minor_segments=6,
              location=(0, 0, 0)
          )
          ring = bpy.context.active_object
          ring.data.materials.append(emit_mat)

          # ---------- Camera ----------
          bpy.ops.object.camera_add(location=(0, -8.5, 2.6))
          cam = bpy.context.active_object
          cam.rotation_euler = (math.radians(74), 0, 0)
          cam.data.dof.use_dof = True
          cam.data.dof.focus_distance = 8.5
          cam.data.dof.aperture_fstop = 2.0
          cam.data.lens = 70
          scene.camera = cam

          # ---------- Lights ----------
          bpy.ops.object.light_add(type='AREA', location=(5, -3, 6))
          key = bpy.context.active_object
          key.data.energy = 500
          key.data.size = 4

          bpy.ops.object.light_add(type='AREA', location=(-5, 4, 3))
          rim = bpy.context.active_object
          rim.data.energy = 300
          rim.data.size = 3
          rim.data.color = (0.6, 0.8, 1.0)

          # ---------- Animate & render only this shard's frame range ----------
          for frame in range(SHARD_START, SHARD_END + 1):
              scene.frame_set(frame)
              t = (frame - 1) / (TOTAL_FRAMES - 1)  # posisi global 0..1

              hero.rotation_euler = (
                  math.sin(t * math.tau) * 0.15,
                  t * math.tau * 0.4,
                  math.cos(t * math.tau) * 0.15
              )

              for sph, base_angle, base_z in orbiters:
                  angle = base_angle + t * math.tau * 0.9
                  r = 3.4 + math.sin(t * math.tau * 2 + base_angle) * 0.12
                  sph.location = (
                      r * math.cos(angle),
                      r * math.sin(angle),
                      base_z + math.sin(t * math.tau * 3 + base_angle) * 0.35
                  )
                  sph.rotation_euler = (0, 0, angle)

              cam.location.x = math.sin(t * math.tau * 0.5) * 0.6
              cam.location.z = 2.6 + math.cos(t * math.tau) * 0.25

              bpy.context.scene.frame_current = frame
              bpy.ops.render.render(write_still=True)

          print(f"Shard done: frames {SHARD_START}-{SHARD_END}")
          PYEOF

      - name: Run Blender headless render (this shard only)
        env:
          FRAME_END: ${{ env.FRAME_END }}
          SAMPLES: ${{ env.SAMPLES }}
          RESOLUTION: ${{ env.RESOLUTION }}
          SHARD_START: ${{ steps.range.outputs.start }}
          SHARD_END: ${{ steps.range.outputs.end }}
        run: |
          blender --background --python-exit-code 1 --python generate_scene.py

      - name: Upload shard frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-shard-${{ matrix.shard }}
          path: output/frames/
          retention-days: 3

  combine:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download all frame shards
        uses: actions/download-artifact@v4
        with:
          pattern: frames-shard-*
          path: all_frames
          merge-multiple: true

      - name: Verify frames
        run: |
          count=$(ls all_frames/frame_*.png 2>/dev/null | wc -l)
          echo "Total frames merged: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::Tidak ada frame ditemukan dari shard manapun."
            exit 1
          fi

      - name: Convert PNG frames to MP4
        run: |
          mkdir -p output
          # FIX: pakai glob, bukan pattern numerik %04d. %04d mengharuskan
          # file pertama bernama index 0000 (frame_0000.png) atau ffmpeg
          # gagal "no file with path ... in range 0-4" walau semua frame
          # sebenarnya ada dan berurutan. Glob tidak punya masalah itu.
          ffmpeg -y -framerate 30 \
            -pattern_type glob -i 'all_frames/frame_*.png' \
            -c:v libx264 -pix_fmt yuv420p \
            -crf 18 -preset slow \
            output/creative_animation.mp4

      - name: Upload MP4 video
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: output/creative_animation.mp4
          retention-days: 14

      - name: Upload merged frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-png-merged
          path: all_frames/
          retention-days: 14
