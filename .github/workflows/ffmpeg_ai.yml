name: Ultimate Realistic Video & Image Upscaler (CPU Only)

on:
  workflow_dispatch: # Jalankan manual lewat tombol di GitHub Actions

jobs:
  upscale-process:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg curl unzip

    - name: Download and Setup Portable Real-ESRGAN NCNN
      run: |
        # Menggunakan curl -L agar file zip terunduh dengan benar dan tidak tersangkut halaman HTML
        curl -L -o realesrgan-ncnn-vulkan.zip https://github.com
        unzip realesrgan-ncnn-vulkan.zip
        chmod +x ./realesrgan-ncnn-vulkan

    - name: Process Media Using EOF Automation
      run: |
        cat << 'EOF' > run_upscale.sh
        #!/bin/bash
        
        # 1. PROSES GAMBAR (agri.jpg)
        if [ -f "agri.jpg" ]; then
          echo "=== Menemukan agri.jpg! Memulai Upscaling Gambar Realistis ==="
          # Menggunakan 2 thread core CPU (-j 2:2:2) agar optimal di GitHub Actions
          ./realesrgan-ncnn-vulkan -i agri.jpg -o hasil_agri_realistic.jpg -n realesr-animevideov3 -s 2 -j 2:2:2
          echo "Sukses: Hasil gambar disimpan ke 'hasil_agri_realistic.jpg'"
        else
          echo "INFO: File 'agri.jpg' tidak ditemukan di root repository."
        fi

        # 2. PROSES VIDEO (vids.mp4)
        if [ -f "vids.mp4" ]; then
          echo "=== Menemukan vids.mp4! Mengekstrak Frame ==="
          mkdir -p input_frames output_frames
          
          # Ekstrak video menjadi frame gambar PNG kualitas tertinggi
          ffmpeg -i vids.mp4 input_frames/frame_%05d.png
          
          echo "Memulai Upscaling Frame Video Berbasis AI Realistis (Mohon Tunggu)..."
          ./realesrgan-ncnn-vulkan -i input_frames -o output_frames -n realesr-animevideov3 -s 2 -f png -j 2:2:2
          
          echo "Menyatukan Kembali Menjadi Video Baru..."
          ffmpeg -framerate 30 -i output_frames/frame_%05d.png -i vids.mp4 -map 0:v -map 1:a? -c:v libx264 -pix_fmt yuv420p hasil_vids_realistic.mp4
          echo "Sukses: Hasil video disimpan ke 'hasil_vids_realistic.mp4'"
        else
          echo "INFO: File 'vids.mp4' tidak ditemukan di root repository."
        fi
        EOF

        # Jalankan script bash EOF yang baru dibuat
        chmod +x run_upscale.sh
        ./run_upscale.sh

    - name: Upload Finished Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AI-Upscaled-Media-Results
        path: |
          hasil_agri_realistic.jpg
          hasil_vids_realistic.mp4
