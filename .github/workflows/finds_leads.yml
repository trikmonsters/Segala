name: Find AC Leads in Australia

on:
  # Memungkinkan Anda menjalankan manual dari tab Actions untuk tes
  workflow_dispatch:

jobs:
  search-leads:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Lead Finder Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > lead_finder.py
          import os
          from google import genai
          
          # Inisialisasi Client
          client = genai.Client(
              api_key=os.environ.get("GEMINI_API_KEY"),
          )
          
          # Konfigurasi Tools: Google Search dan Google Maps
          # Maps sangat berguna untuk menemukan bisnis lokal (leads)
          tools = [
              {'type': 'google_search'},
              {'type': 'google_maps'},
          ]
          
          # Safety Settings (Standar)
          safety_settings = [
              {
                  'type': 'HARM_CATEGORY_SEXUALLY_EXPLICIT',
                  'threshold': 'BLOCK_MEDIUM_AND_ABOVE',
              },
          ]
          
          # Konfigurasi Generasi
          generation_config = {
              'max_output_tokens': 65536,
              'thinking_level': 'high',
          }
          
          # PROMPT: Fokus pada Jasa AC di Australia
          # Catatan: Gemini Maps Grounding hanya mendukung bahasa Inggris
          prompt = """
          You are a B2B lead generation specialist. I need you to find potential business leads for an Air Conditioning (HVAC) service company in Australia.
          
          Please use Google Maps to find:
          1. Property Management Companies in Sydney, Melbourne, and Brisbane. (They often need AC maintenance for rental properties).
          2. Real Estate Agencies in major Australian cities. (They need AC servicing for sales inspections and rentals).
          3. Small to Medium Business offices (like co-working spaces or retail shops) in Australia that likely have commercial AC units.
          
          For each lead, provide:
          - Business Name
          - Category/Industry
          - Location (Suburb/City)
          - A brief reason why they are a good lead for AC services (e.g., "Manages 50+ rental properties").
          - If available, a link to their Google Maps listing or website.
          
          Please provide a list of at least 5-10 leads.
          """
          
          # Eksekusi Interaksi
          interaction = client.interactions.create(
              model='models/gemini-3.8-flash',
              input=prompt,
              tools=tools,
              safety_settings=safety_settings,
              generation_config=generation_config,
          )
          
          # Cetak Hasil
          # Karena output Maps mungkin memiliki anotasi/sumber, kita cetak langkah terakhir
          print("=== HASIL PENCARIAN LEADS ===")
          # Cek apakah ada konten teks di output
          last_step = interaction.steps[-1]
          if last_step.type == 'model_output':
              for block in last_step.content:
                  if block.type == 'text':
                      print(block.text)
          
          print("\n=== SELESAI ===")
          EOF
          
          python lead_finder.py
