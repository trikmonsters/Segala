          const cam14 = (p: number): CamSpec => camLerp({p: [-.8, 1.0, 6.5], l: [0, 6, 0], fov: 86}, {p: [1.28, 7.75, 2.0], l: [1.28, 7.75, 0], fov: 60}, eio(p));
          // 15 — agen sendirian: lelah tapi tenang
