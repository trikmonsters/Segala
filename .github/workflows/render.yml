              else if (eyes === 'sleepy' || blink) { c.strokeStyle = ink; c.lineWidth = .026 * S; c.beginPath(); c.moveTo(cx - .05 * S, cy); c.lineTo(cx + .05 * S, cy + 2); c.stroke(); }
              else { c.fillStyle = ink; c.beginPath(); c.ellipse(cx + lk[0] * .02 * S, cy + lk[1] * .02 * S, .028 * S, .034 * S, 0, 0, 6.3); c.fill(); }
