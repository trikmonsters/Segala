          import React from 'react';
          import {useVideoConfig} from 'remotion';
          import cap from './captions.json';
          import {CAPTION_STACK} from './fonts.generated';
          import {LANG} from './lib/i18n';
          // Caption gaya referensi: SATU KATA per tampilan, putih tebal + outline hitam + bayangan, di tengah horizontal, sekitar 70% tinggi layar.
          // Ukuran dasar 78px pada lebar 1080 (diukur dari video referensi). Kata panjang dikecilkan otomatis agar muat.
          const RTL = ['ar', 'he', 'fa', 'ur'].includes(LANG.split('-')[0]);
          const ring = (r: number, n = 28) => Array.from({length: n}, (_, i) => { const a = (i / n) * Math.PI * 2; return `${(Math.cos(a) * r).toFixed(1)}px ${(Math.sin(a) * r).toFixed(1)}px 0 #000`; }).join(',');
          const SHADOW = ring(7.5) + "," + ring(4, 16) + ',0 9px 0 rgba(0,0,0,.45),0 12px 14px rgba(0,0,0,.35)';
          export const wordAt = (t: number): string | null => {
            const ws: {w: string; s: number; e: number}[] = (cap as any).words || [];
            let idx = -1; for (let i = 0; i < ws.length; i++) { if (ws[i].s <= t) idx = i; else break; }
            if (idx < 0) return null;
            const w = ws[idx], next = ws[idx + 1], hold = next ? Math.min(w.e + 0.28, next.s) : w.e + 0.28;
            return t < Math.max(w.e, hold) ? w.w : null;
          };
          export const Captions: React.FC<{t: number}> = ({t}) => {
            const {width, height} = useVideoConfig(); const text = wordAt(t); if (!text) return null;
            const n = [...text].length, base = 88 * (width / 1080), size = Math.min(base, (width * .88) / Math.max(1, n * .66));
            return (
              <div style={{position: 'absolute', left: 0, right: 0, top: height * 0.704, transform: 'translateY(-50%)', textAlign: 'center', pointerEvents: 'none'}}>
                <span lang={LANG} dir={RTL ? 'rtl' : 'ltr'} style={{fontFamily: CAPTION_STACK, fontWeight: 800, fontSize: size, lineHeight: 1.1, color: '#fff', letterSpacing: '-0.5px', textShadow: SHADOW, whiteSpace: 'nowrap'}}>{text}</span>
              </div>
            );
          };
          EOF_FILE
