# ==========================================================================================
#  Render Reel Cartoon 3D (Remotion + three.js)  ->  GitHub Release   (TANPA artifact)
#  Satu file ini sudah berisi seluruh mesin (arsip base64 di langkah "Unpack engine").
#
#  CARA PAKAI
#   1. Simpan file ini di repo Anda sebagai  .github/workflows/render.yml
#   2. (opsional) taruh di repo:  audio/narasi.mp3 | script.txt | overlay/src/shots.tsx | lang/<kode>.json
#   3. Actions -> "Render Reel" -> Run workflow, isi form. Hasil: Releases -> tag video-<nomor-run>.
#
#  MASUKAN (urutan prioritas)
#   AUDIO  (WAJIB): input audio_url  >  file pertama di folder audio/  >  centang sample_audio (demo suara TTS lokal)
#   NASKAH (teks persis narasi, untuk caption): input script  >  script_url  >  script.txt / naskah.txt di repo
#          Bahasa Inggris boleh tanpa naskah bila use_asr dicentang. Bahasa lain: naskah WAJIB.
#   STORYBOARD: overlay/** di repo (menimpa berkas mesin, mis. overlay/src/shots.tsx)  >  shots_url  >  contoh bawaan.
#   TERJEMAHAN teks benda: lang/<kode>.json di repo (salinan src/lang/en.json yang diterjemahkan).
#
#  MODE  preview = hanya contact-sheet framing (±3-5 menit) diunggah ke Release (pre-release).
#        full    = video penuh MP4 + narasi diunggah ke Release.
#  Catatan: workflow tidak memakai upload-artifact. Izin 'contents: write' dipakai untuk membuat Release.
# ==========================================================================================
name: Render Reel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = video penuh | preview = contact sheet framing saja'
        type: choice
        default: full
        options: [full, preview]
      lang:
        description: 'Kode bahasa video (default en). Contoh: en, id, ja, ar, hi, th, ko, zh'
        type: string
        default: en
      audio_url:
        description: 'URL LANGSUNG ke audio narasi (mp3/wav/m4a). Kosong = pakai audio/ di repo'
        type: string
        default: ''
      script:
        description: 'Naskah persis narasi (satu baris). Kosong = script_url atau script.txt di repo'
        type: string
        default: ''
      script_url:
        description: 'URL langsung ke file teks naskah (opsional)'
        type: string
        default: ''
      shots_url:
        description: 'URL langsung (raw) ke shots.tsx (opsional; overlay/src/shots.tsx di repo lebih diutamakan)'
        type: string
        default: ''
      use_asr:
        description: 'Transkripsi otomatis untuk memperhalus waktu caption (HANYA bahasa Inggris)'
        type: boolean
        default: false
      sample_audio:
        description: 'DEMO: buat audio contoh dengan suara TTS (hanya bila tidak ada audio lain)'
        type: boolean
        default: false
      video_name:
        description: 'Nama berkas keluaran (tanpa .mp4)'
        type: string
        default: reel
      release_tag:
        description: 'Tag Release. Kosong = video-<nomor-run> (preview-<nomor-run> untuk mode preview)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: render-reel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      IN_MODE: ${{ inputs.mode }}
      IN_LANG: ${{ inputs.lang }}
      IN_AUDIO_URL: ${{ inputs.audio_url }}
      IN_SCRIPT: ${{ inputs.script }}
      IN_SCRIPT_URL: ${{ inputs.script_url }}
      IN_SHOTS_URL: ${{ inputs.shots_url }}
      IN_ASR: ${{ inputs.use_asr }}
      IN_SAMPLE: ${{ inputs.sample_audio }}
      IN_NAME: ${{ inputs.video_name }}
      IN_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout (membaca audio/, script.txt, overlay/ milik Anda)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: System dependencies (ffmpeg, Pillow)
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg python3-pip fonts-liberation
          python3 -m pip install --break-system-packages --quiet pillow

      - name: Unpack engine
