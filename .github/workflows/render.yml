            <Room w={3.6} d={4.2} h={2.6} pal="night" /><Win pos={[0, 1.5, .06]} w={1.8} h={1.2} /><Art kind="calx" w={.45} pos={[-1.35, 1.6, .04]} /><Art kind="fuji" w={.7} pos={[-1.77, 1.55, 2.2]} rot={[0, PI / 2, 0]} frame="#6a4a3a" /><Art kind="cert" w={.4} pos={[1.4, 1.75, .04]} frame="#c9a23a" />
            <Desk pos={[.7, 0, 1.6]} w={1.4} d={.8} col="#b89a6a" rot={-PI / 2}><Monitor pos={[.0, 0, -.2]} rot={PI / 2} kind="sheet" /><Papers pos={[.2, 0, .2]} /><Art kind="photo" w={.2} pos={[.05, .08, -.35]} rot={[-.2, PI / 2 + .3, 0]} frame="#d6b24a" fw={.015} /></Desk>
