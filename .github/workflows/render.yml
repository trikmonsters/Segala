          import * as THREE from 'three';
          import React from 'react';
          import {mergeVertices} from 'three/examples/jsm/utils/BufferGeometryUtils.js';
          import {RoundedBoxGeometry} from 'three/examples/jsm/geometries/RoundedBoxGeometry.js';

          export const INK = '#15121f';
          let _STYLE: 'toon' | 'real' = 'toon';
          export const setStyle = (s: 'toon' | 'real') => { _STYLE = s; };
          export const getStyle = () => _STYLE;
          export const clamp = (x: number, a = 0, b = 1) => Math.min(b, Math.max(a, x));
          export const lerp = (a: number, b: number, t: number) => a + (b - a) * t;
          export const eo3 = (x: number) => 1 - Math.pow(1 - x, 3);
          export const eio = (x: number) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
          export const prog = (u: number, a: number, b: number) => clamp((u - a) / (b - a));
          export const rnd = (i: number) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
          export function shade(hex: string, k: number) {
            const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
            if (k < 1) { r *= k; g *= k; b *= k; } else { const q = k - 1; r += (255 - r) * q; g += (255 - g) * q; b += (255 - b) * q; }
            const h = (v: number) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0');
            return '#' + h(r) + h(g) + h(b);
          }
          // ---------- geometri ber-cache ----------
          const gc = new Map<string, THREE.BufferGeometry>();
          const cached = (k: string, f: () => THREE.BufferGeometry) => { let g = gc.get(k); if (!g) { g = f(); gc.set(k, g); } return g; };
          export const G = {
            box: (w: number, h: number, d: number) => cached(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d)),
            rbox: (w: number, h: number, d: number, r = 0.03) => cached(`rb${w},${h},${d},${r}`, () => new RoundedBoxGeometry(w, h, d, 3, r)),
            sph: (r: number, ws = 28, hs = 20) => cached(`s${r},${ws},${hs}`, () => new THREE.SphereGeometry(r, ws, hs)),
            cyl: (rt: number, rb: number, h: number, seg = 20) => cached(`c${rt},${rb},${h},${seg}`, () => new THREE.CylinderGeometry(rt, rb, h, seg)),
            cap: (r: number, len: number) => cached(`cp${r},${len}`, () => new THREE.CapsuleGeometry(r, len, 8, 18)),
            cone: (r: number, h: number, seg = 12) => cached(`cn${r},${h},${seg}`, () => new THREE.ConeGeometry(r, h, seg)),
            tor: (r: number, t: number, a = Math.PI * 2) => cached(`t${r},${t},${a}`, () => new THREE.TorusGeometry(r, t, 10, 28, a)),
            plane: (w: number, h: number) => cached(`p${w},${h}`, () => new THREE.PlaneGeometry(w, h)),
          };
          const oc = new Map<THREE.BufferGeometry, THREE.BufferGeometry>();
          function olGeo(g: THREE.BufferGeometry) {
            let o = oc.get(g);
            if (!o) { o = g.clone(); o.deleteAttribute('normal'); o.deleteAttribute('uv'); o = mergeVertices(o, 1e-4); o.computeVertexNormals(); oc.set(g, o); }
            return o;
          }
          // ---------- material toon + outline layar-konstan ----------
          let grad: THREE.DataTexture | null = null;
          const gradient = () => {
            if (!grad) { const d = new Uint8Array([85, 150, 210, 255]); grad = new THREE.DataTexture(d, 4, 1, THREE.RedFormat); grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true; }
            return grad;
          };
          const tm = new Map<string, THREE.Material>();
          export function toon(color: string, map?: THREE.Texture, emi?: string, extra: any = {}) {
            const key = _STYLE + color + (map ? map.uuid : '') + (emi || '') + JSON.stringify(extra);
            let m = tm.get(key);
            if (!m) {
              m = _STYLE === 'real'
                ? new THREE.MeshStandardMaterial({color, map, roughness: extra.roughness ?? .72, metalness: extra.metalness ?? .02, emissive: emi || '#000000', ...extra})
                : new THREE.MeshToonMaterial({color, map, gradientMap: gradient(), emissive: emi || '#000000', ...extra});
              tm.set(key, m);
            }
            return m;
          }
          const om = new Map<string, THREE.ShaderMaterial>();
          export function ol(thick: number, color = INK) {
            const key = thick + color; let m = om.get(key);
            if (!m) {
              m = new THREE.ShaderMaterial({
                side: THREE.BackSide, toneMapped: false,
                uniforms: {uT: {value: thick}, uC: {value: new THREE.Color(color)}, uA: {value: 9 / 16}},
                vertexShader: `uniform float uT;uniform float uA;void main(){vec4 c=projectionMatrix*modelViewMatrix*vec4(position,1.0);vec3 n=normalize(normalMatrix*normal);vec2 d=normalize(n.xy+vec2(1e-5));c.xy+=d*vec2(uT/uA,uT)*c.w;gl_Position=c;}`,
                fragmentShader: `uniform vec3 uC;void main(){gl_FragColor=vec4(uC,1.0);}`,
              });
              om.set(key, m);
            }
            return m;
          }
          // Mesh toon + outline. g=geometri, c=warna
          export const T: React.FC<any> = ({g, c, t = 0.0052, o = true, map, emi, cast = true, recv = true, extra, children, ...rest}) => (
            <mesh geometry={g} material={toon(c, map, emi, extra)} castShadow={cast} receiveShadow={recv} {...rest}>
              {o && _STYLE === 'toon' && <mesh geometry={olGeo(g)} material={ol(t)} />}
              {children}
            </mesh>
          );
          // mesh polos tanpa lighting (emisif/glow)
          export const Flat: React.FC<any> = ({g, c, op = 1, add = false, ...rest}) => (
            <mesh geometry={g} {...rest}>
              <meshBasicMaterial color={c} transparent={op < 1 || add} opacity={op} depthWrite={!add && op >= 1} blending={add ? THREE.AdditiveBlending : THREE.NormalBlending} toneMapped={false} side={THREE.DoubleSide} />
            </mesh>
          );
          export type V3 = [number, number, number];
          export type CamSpec = {p: V3; l: V3; fov: number; roll?: number};
          export const camLerp = (a: CamSpec, b: CamSpec, t: number): CamSpec => ({
            p: [lerp(a.p[0], b.p[0], t), lerp(a.p[1], b.p[1], t), lerp(a.p[2], b.p[2], t)],
            l: [lerp(a.l[0], b.l[0], t), lerp(a.l[1], b.l[1], t), lerp(a.l[2], b.l[2], t)],
            fov: lerp(a.fov, b.fov, t), roll: lerp(a.roll || 0, b.roll || 0, t),
          });
          export const handheld = (c: CamSpec, u: number, a = 0.012): CamSpec => ({
            ...c, p: [c.p[0] + Math.sin(u * 1.7) * a, c.p[1] + Math.cos(u * 1.3) * a, c.p[2]],
            l: [c.l[0] + Math.sin(u * 2.1) * a * 1.5, c.l[1] + Math.cos(u * 1.9) * a * 1.5, c.l[2]],
          });
          EOF_FILE
          mkdir -p _reel/src/lib
          cat > _reel/src/lib/i18n.ts <<'EOF_FILE'
          import en from '../lang/en.json';
          import cap from '../captions.json';
          // Bahasa video = cap.lang (kode ISO, mis. "en", "id", "ja"). Teks pada benda dunia mengikuti kamus src/lang/<kode>.json (menimpa en.json).
          const ctx = (require as any).context('../lang', false, /\.json$/);
          export const LANG: string = (cap as any).lang || 'en';
          const over = ctx.keys().includes('./' + LANG + '.json') ? ctx('./' + LANG + '.json') : ctx.keys().includes('./' + LANG.split('-')[0] + '.json') ? ctx('./' + LANG.split('-')[0] + '.json') : {};
          const L: Record<string, string> = {...(en as any), ...over};
          export const s = (k: string, d?: string): string => L[k] ?? d ?? k;
          export const locale = () => (LANG === 'zh' ? 'zh-CN' : LANG);
