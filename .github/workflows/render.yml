      # ── (Opsional) Tempat langkah render Anda ──────────────────────────────
      # Di sinilah engine dijalankan, misalnya:
      #   cd _reel && npm ci && npx remotion render <entry> out.mp4
      # Karena audio dihapus, pastikan perintah render TIDAK meneruskan argumen audio.
      #
      # Contoh (sesuaikan dengan engine Anda):
      #
      # - name: Render video (bisu)
      #   run: |
      #     set -euo pipefail
      #     cd _reel
      #     npm ci
      #     node scripts/render.mjs \
      #       --mode "$IN_MODE" \
      #       --lang "$IN_LANG" \
      #       --name "$IN_NAME" \
      #       --out "$GITHUB_WORKSPACE/out/${IN_NAME}.mp4" \
      #       --shots-url "$IN_SHOTS_URL" \
      #       --no-audio \
      #       --no-captions
      # ───────────────────────────────────────────────────────────────────────

      - name: Create Release & upload MP4
        run: |
          set -euo pipefail
          TAG="${IN_TAG}"
          if [ -z "$TAG" ]; then
            if [ "$IN_MODE" = "preview" ]; then TAG="preview-${GITHUB_RUN_NUMBER}"; else TAG="video-${GITHUB_RUN_NUMBER}"; fi
          fi
          PRE=""
          if [ "$IN_MODE" = "preview" ]; then PRE="--prerelease"; fi
          FILE="$GITHUB_WORKSPACE/out/${IN_NAME}.mp4"
          if [ ! -f "$FILE" ]; then echo "::error::Berkas keluaran tidak ditemukan: $FILE"; exit 1; fi
          gh release create "$TAG" "$FILE" \
            --title "$TAG" \
            --notes "Render mode=${IN_MODE} lang=${IN_LANG} (tanpa audio)" \
            $PRE
