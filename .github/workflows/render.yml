            office: {wall: '#f2f5fb', wallL: '#e4e9f3', wallR: '#fbfcff', floor: '#3a66e6', floor2: '#2f5be0', ceil: '#ffffff', line: '#b4bfd8', base: '#5aa0ff', style: 'panel', sky: '#bfe6ff', amb: '#ffffff', ambI: 1.35, sun: '#ffffff', sunI: 1.6},
            boss: {wall: '#a65e36', wallL: '#8a4a2c', wallR: '#b66c40', floor: '#4a2c3a', floor2: '#3a2230', ceil: '#d9b48a', line: '#5a2c18', base: '#3b2012', style: 'boards', sky: '#ffcf8a', amb: '#ffe2c0', ambI: 1.0, sun: '#ffb870', sunI: 1.8},
            night: {wall: '#2f4ea6', wallL: '#26429a', wallR: '#3556b6', floor: '#1c2c78', floor2: '#16246a', ceil: '#2e46a0', line: '#142660', base: '#3b5fd0', style: 'brick', sky: '#1b2a7a', amb: '#7f9aff', ambI: .95, sun: '#8fa8ff', sunI: .9},
            dusk: {wall: '#8566bc', wallL: '#7457ac', wallR: '#9676cc', floor: '#463a80', floor2: '#382e70', ceil: '#a58ad0', line: '#4b3a80', base: '#e28a5a', style: 'brick', sky: '#f6a35a', amb: '#ffc8a0', ambI: 1.05, sun: '#ffb070', sunI: 1.5},
          };
          export const Room: React.FC<{w: number; d: number; h: number; pal: string; lamp?: boolean}> = ({w, d, h, pal, lamp = true}) => {
            const P = PALS[pal];
            const wallTex = (col: string, rep: [number, number]) => P.style === 'brick' ? brick(col, P.line, rep) : P.style === 'boards' ? boards(col, P.line, [rep[0] * 1.7, 1]) : panels(col, P.line, [rep[0] * .8, rep[1] * .8]);
            const wm = (col: string, rep: [number, number]) => toon('#ffffff', wallTex(col, rep));
            return (
              <group>
                <mesh position={[0, h / 2, 0]} material={wm(P.wall, [w / 2, h / 2])} receiveShadow><planeGeometry args={[w, h]} /></mesh>
                <mesh position={[0, h / 2, d]} rotation={[0, Math.PI, 0]} material={wm(P.wall, [w / 2, h / 2])} receiveShadow><planeGeometry args={[w, h]} /></mesh>
                <mesh position={[-w / 2, h / 2, d / 2]} rotation={[0, Math.PI / 2, 0]} material={wm(P.wallL, [d / 2, h / 2])} receiveShadow><planeGeometry args={[d, h]} /></mesh>
                <mesh position={[w / 2, h / 2, d / 2]} rotation={[0, -Math.PI / 2, 0]} material={wm(P.wallR, [d / 2, h / 2])} receiveShadow><planeGeometry args={[d, h]} /></mesh>
                <mesh position={[0, 0, d / 2]} rotation={[-Math.PI / 2, 0, 0]} material={toon('#ffffff', P.style === 'panel' ? carpet(P.floor, [w / 1.2, d / 1.2]) : tiles(P.floor, P.floor2, shade(P.floor2, .7), [w / 1.2, d / 1.2]))} receiveShadow><planeGeometry args={[w, d]} /></mesh>
                <mesh position={[0, h, d / 2]} rotation={[Math.PI / 2, 0, 0]} material={toon('#ffffff', panels(P.ceil, shade(P.ceil, .78), [w / 1.2, d / 1.2]))}><planeGeometry args={[w, d]} /></mesh>
                {/* list dinding */}
                <T g={G.box(w, .13, .04)} position={[0, .065, .02]} c={P.base} t={.003} /><T g={G.box(.04, .13, d)} position={[-w / 2 + .02, .065, d / 2]} c={P.base} t={.003} /><T g={G.box(.04, .13, d)} position={[w / 2 - .02, .065, d / 2]} c={P.base} t={.003} />
                {/* panel lampu plafon */}
                {Array.from({length: Math.max(2, Math.floor(d / 2))}).map((_, i) => <mesh key={i} position={[0, h - .015, 1 + i * 2]} rotation={[Math.PI / 2, 0, 0]}><planeGeometry args={[Math.min(1.6, w * .4), .55]} /><meshBasicMaterial color={pal === 'night' ? '#b8c8ff' : '#fffbe8'} toneMapped={false} /></mesh>)}
              </group>
            );
          };
          export const Pt: React.FC<any> = ({intensity = 3, ...r}) => <pointLight intensity={intensity * (getStyle() === 'real' ? 1.9 : 1)} decay={2} {...r} />;
          export const Lights: React.FC<{pal: string; w?: number; d?: number; sunPos?: V3; extra?: React.ReactNode; sunOn?: boolean}> = ({pal, sunPos = [2, 4, 4], extra, sunOn = true}) => {
            const P = PALS[pal], real = getStyle() === 'real';
            return (<>
              <ambientLight color={P.amb} intensity={P.ambI * (real ? (pal === 'night' ? .75 : .38) : .55)} />
              <hemisphereLight args={[P.sky, P.floor, P.ambI * (real ? (pal === 'night' ? 1.1 : .8) : .55)]} />
              {sunOn && <directionalLight color={P.sun} intensity={P.sunI * (real ? 1.55 : 1)} position={sunPos} castShadow shadow-mapSize={[2048, 2048]} shadow-camera-left={-6} shadow-camera-right={6} shadow-camera-top={6} shadow-camera-bottom={-6} shadow-camera-near={.5} shadow-camera-far={16} shadow-bias={-.0005} shadow-normalBias={.02} shadow-radius={real ? 5 : 1} />}
              {extra}
            </>);
          };
