            <Character {...CHARS.agent} id="ag15" glasses={false} top="#f4f4f8" pos={[-.3, 0, 1.6]} rotY={PI / 2 - .25} pose={{...POSE.sit, lean: .08, hx: .12, hz: -.1}} face={{eyes: 'sleepy', mouth: 'smile'}} prop="cup" t={u} />
            <Steam pos={[.15, 1.0, 1.9]} t={u} />
