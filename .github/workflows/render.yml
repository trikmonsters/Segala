              <Room w={4.4} d={6} h={2.8} pal="day" /><Door pos={[0, 0, .02]} w={1.2} open={o * .88} hole="#fff6c8" plate="plateSales" exit /><Glow p={[0, 1.2, .6]} s={3.4} c="#fff6c8" o={.6 * o} />
              <Beam pts={[[2.1, 2.1, 1.4], [2.1, 2.1, 3.0], [.4, .02, 3.6], [.4, .02, 2.0]]} o={.25} /><Plant pos={[-1.8, 0, 1.2]} s={1.2} /><Art kind="climb" w={.7} pos={[-2.17, 1.7, 3.0]} rot={[0, PI / 2, 0]} /><Art kind="whiteboard" w={1.0} pos={[1.4, 1.7, .04]} frame="#cfd6e4" /><Art kind="cal7" w={.4} pos={[-1.4, 1.7, .04]} />
              {o > 0 && <Character id="b16" top="#444a66" suit pants="#333a55" hair="spiky" hairCol="#5a3a22" pos={[.35, 0, 1.0]} pose={POSE.shock} face={{eyes: 'wide', mouth: 'o'}} sweat t={u} />}
              <Character {...CHARS.agent} id="ag16" pos={[-.55, 0, 2.6]} pose={mixPose(POSE.stand, POSE.hold, e)} face={{mouth: 'grin'}} prop={e > 0 ? 'env' : undefined} t={u} />
              <Confetti t={u} c={[0, 3, 2.5]} n={26} />
            </>);
          };
          export const SHOTS: Shot[] = [
            {d: 2.0, cam: (p) => camLerp({p: [0, 1.3, 5.6], l: [0, 1.1, 2.4], fov: 72, roll: .05}, {p: [0, 1.45, 4.1], l: [0, 1.25, 2.4], fov: 72, roll: 0}, eo3(p)), Scene: S1, g: {tint: '#1a2a8a', ti: .18, vig: .65}},
            {d: 1.8, at: 'boss', cam: (p) => camLerp({p: [-.3, .85, 3.7], l: [0, 1.2, 1.3], fov: 72}, {p: [0, .95, 2.9], l: [0, 1.25, 1.3], fov: 72}, eo3(p)), Scene: S2, g: {tint: '#ff9a3a', ti: .1, vig: .55, flash: .5}},
            {d: 1.6, at: 'stand', cam: (p) => cam3(p), Scene: S3, g: {tint: '#1a2a8a', ti: .18, vig: .65}},
            {d: 1.6, at: 'night', cam: (p) => camLerp({p: [1.2, 1.45, 4.5], l: [-.3, .9, 1.8], fov: 70, roll: -.04}, {p: [.7, 1.4, 3.9], l: [-.25, .9, 1.8], fov: 70}, eo3(p)), Scene: S4, g: {tint: '#0a1450', ti: .25, vig: .75}},
            {d: 1.4, at: 'app', cam: () => ({p: [0, 0, 2.7], l: [0, 0, 0], fov: 52}), Scene: S5, g: {vig: .6}, hh: .004},
            {d: 2.0, at: 'next', cam: (p) => camLerp({p: [.3, .7, 6.0], l: [0, 1.2, 1.5], fov: 78, roll: .03}, {p: [0, .85, 4.8], l: [0, 1.2, 1.5], fov: 78, roll: -.03}, eo3(p)), Scene: S6, g: {tint: '#ffe27a', ti: .06, vig: .45, flash: .8}},
            {d: 1.8, at: 'whole', cam: (p) => camLerp({p: [-.8, 1.5, 8.2], l: [-.2, 1.1, 1], fov: 70}, {p: [.8, 1.5, 8.2], l: [.2, 1.1, 1], fov: 70}, eio(p)), Scene: S7, g: {vig: .3}},
            {d: 1.8, at: 'slides', cam: (p) => camLerp({p: [.8, 1.7, 5.2], l: [.15, 1.0, 1.6], fov: 66}, {p: [.4, 1.6, 4.6], l: [.1, 1.0, 1.6], fov: 66}, eo3(p)), Scene: S8, g: {tint: '#ff9a3a', ti: .08, vig: .5}},
            {d: 1.8, at: 'panics', cam: (p) => dz(p), Scene: S9, g: {tint: '#ff2a2a', ti: .12, vig: .75, flash: .6, lines: (p: number, u: number) => (u > .35 ? .8 : 0)}, hh: .004},
            {d: 2.2, at: 'you', cam: (p) => camLerp({p: [1.2, 1.1, 3.7], l: [.1, .95, 1.8], fov: 62}, {p: [-.4, 1.2, 3.7], l: [.1, .95, 1.8], fov: 62}, eio(p)), Scene: S10, g: {tint: '#ffe27a', ti: .07, vig: .4}},
            {d: 1.8, at: 'phone', cam: (p) => camLerp({p: [0, 1.4, 4.6], l: [0, 1.2, 1.5], fov: 72, roll: .06}, {p: [0, 1.3, 3.7], l: [0, 1.2, 1.5], fov: 72, roll: -.02}, eo3(p)), Scene: S11, g: {tint: '#e28a5a', ti: .15, vig: .65}},
            {d: .6, at: 'door', cam: (p) => camLerp({p: [0, 1.3, 5.0], l: [0, 1.3, 1], fov: 76, roll: .1}, {p: [0, 1.35, 4.5], l: [0, 1.3, 1], fov: 76, roll: .03}, eo3(p)), Scene: Mont('day', 'bald', '#fff', 0, 1), g: {vig: .5, flash: .8}},
            {d: .6, cam: (p) => camLerp({p: [0, 1.3, 5.2], l: [0, 1.3, 1], fov: 76, roll: -.1}, {p: [0, 1.35, 4.6], l: [0, 1.3, 1], fov: 76, roll: -.03}, eo3(p)), Scene: Mont('office', 'spiky', '#5a3a22', 0, 2), g: {vig: .5, flash: .8}},
            {d: .6, cam: (p) => camLerp({p: [.4, .8, 5.2], l: [0, 1.4, 1], fov: 76, roll: .07}, {p: [.2, .9, 4.6], l: [0, 1.4, 1], fov: 76, roll: 0}, eo3(p)), Scene: Mont('boss', 'boss', '#b9b9c6', 0, 3), g: {vig: .5, flash: .8}},
            {d: 1.8, at: 'money', cam: cam13, Scene: S13, g: {vig: .5}},
            {d: 2.6, at: 'tall', cam: cam14, Scene: S14, g: {tint: '#2a2a8c', ti: .1, vig: .55}, hh: .004},
            {d: 2.0, at: 'one', cam: (p) => camLerp({p: [.5, 1.15, 3.4], l: [.1, 1.0, 1.6], fov: 66}, {p: [.1, 1.3, 4.0], l: [.1, 1.0, 1.6], fov: 66}, eo3(p)), Scene: S15, g: {tint: '#ff9a3a', ti: .08, vig: .7}},
            {d: 2.6, at: 'then', cam: (p) => camLerp({p: [0, 1.0, 5.6], l: [0, 1.2, 1.5], fov: 76}, {p: [0, 1.2, 4.7], l: [0, 1.2, 1.5], fov: 76, roll: .02}, eo3(p)), Scene: S16, g: {tint: '#ffe27a', ti: .05, vig: .45}},
          ];
          EOF_FILE
          mkdir -p _reel/src
          cat > _reel/src/timeline.ts <<'EOF_FILE'
          import {SHOTS} from './shots';
          import cap from './captions.json';
          // Linimasa mengikuti panjang audio. Tiap shot punya bobot `d` (detik rancangan) dan opsional `at`:
          //   at: 'kata'  -> shot dimulai tepat saat kata itu (kemunculan pertama setelah shot sebelumnya) diucapkan
          //   at: 12.5    -> shot dimulai di detik 12.5
          // Shot tanpa `at` dibagi proporsional (berdasar d) di antara jangkar terdekat.
          export const TAIL = 0.6;
          export const AUDIO_S: number = (cap as any).duration || 10;
          export const TOTAL_S = AUDIO_S + TAIL;
          const norm = (w: string) => w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
          export type TShot = (typeof SHOTS)[number] & {a: number; D: number; dd: number};
          export const TL: TShot[] = (() => {
            const n = SHOTS.length; if (!n) return [];
            const words: {w: string; s: number}[] = (cap as any).words || [];
            const anchor: (number | null)[] = Array(n).fill(null); anchor[0] = 0; let wi = 0;
            for (let i = 1; i < n; i++) { const at = (SHOTS[i] as any).at;
              if (typeof at === 'number') anchor[i] = Math.max(0, Math.min(TOTAL_S - .5, at));
              else if (typeof at === 'string') { const q = norm(at); for (let k = wi; k < words.length; k++) if (norm(words[k].w) === q) { anchor[i] = words[k].s; wi = k + 1; break; } } }
            let last = 0; for (let i = 1; i < n; i++) if (anchor[i] != null) { if ((anchor[i] as number) < last + .25) anchor[i] = null; else last = anchor[i] as number; }
            const idx: number[] = []; anchor.forEach((a, i) => a != null && idx.push(i)); idx.push(n);
            const starts: number[] = Array(n).fill(0), ends: number[] = Array(n).fill(0);
            for (let g = 0; g < idx.length - 1; g++) { const a = idx[g], b = idx[g + 1], t0 = anchor[a] as number, t1 = b < n ? (anchor[b] as number) : TOTAL_S;
              const wsum = SHOTS.slice(a, b).reduce((x, s) => x + s.d, 0); let t = t0; for (let i = a; i < b; i++) { starts[i] = t; t += ((t1 - t0) * SHOTS[i].d) / wsum; ends[i] = t; } }
            return SHOTS.map((s, i) => ({...s, a: starts[i], D: ends[i] - starts[i], dd: s.d}));
          })();
          EOF_FILE

      - name: Collect inputs (audio, naskah, storyboard, bahasa)
        run: |
          set -euo pipefail
          WS="$PWD"; cd _reel
          LANGC="${IN_LANG:-en}"; LANGC="$(printf '%s' "$LANGC" | tr -d '[:space:]')"; [ -n "$LANGC" ] || LANGC=en
          echo "LANGC=$LANGC" >> "$GITHUB_ENV"
          # ---- AUDIO (wajib) ----
          AUDIO=""
          if [ -n "$IN_AUDIO_URL" ]; then
            curl -fL --retry 3 -o example/audio_in "$IN_AUDIO_URL"; AUDIO=example/audio_in
          elif ls "$WS"/audio/* >/dev/null 2>&1; then
            AUDIO="$(ls "$WS"/audio/* | head -1)"
          elif [ "$IN_SAMPLE" = "true" ]; then
            python3 -m pip install --break-system-packages --quiet sherpa-onnx soundfile numpy
            python3 scripts/make_sample_audio.py example/narration_en.txt example/sample.wav 1.15 2>/dev/null
            AUDIO=example/sample.wav
          else
            echo "::error title=Audio wajib::Berikan audio_url, atau taruh file di folder audio/ pada repo, atau centang sample_audio untuk demo."
            exit 1
          fi
          # ---- NASKAH ----
          SARG=""
          if [ -n "$IN_SCRIPT" ]; then printf '%s\n' "$IN_SCRIPT" > input_script.txt; SARG="--script input_script.txt"
          elif [ -n "$IN_SCRIPT_URL" ]; then curl -fL --retry 3 -o input_script.txt "$IN_SCRIPT_URL"; SARG="--script input_script.txt"
          elif [ -f "$WS/script.txt" ]; then cp "$WS/script.txt" input_script.txt; SARG="--script input_script.txt"
          elif [ -f "$WS/naskah.txt" ]; then cp "$WS/naskah.txt" input_script.txt; SARG="--script input_script.txt"
          elif [ "$AUDIO" = "example/sample.wav" ]; then cp example/narration_en.txt input_script.txt; SARG="--script input_script.txt"
          fi
          AARG=""
          if [ "$IN_ASR" = "true" ]; then
            if [ "$LANGC" = "en" ] || [ "${LANGC%%-*}" = "en" ]; then AARG="--asr"; python3 -m pip install --break-system-packages --quiet sherpa-onnx soundfile numpy
            else echo "::warning::use_asr hanya untuk bahasa Inggris; diabaikan."; fi
          fi
          if [ -z "$SARG" ] && [ -z "$AARG" ]; then
            echo "::error title=Naskah wajib::Isi input script / script_url, atau script.txt di repo (bahasa Inggris boleh centang use_asr)."; exit 1
          fi
          echo "AUDIO=$AUDIO" >> "$GITHUB_ENV"; echo "SARG=$SARG" >> "$GITHUB_ENV"; echo "AARG=$AARG" >> "$GITHUB_ENV"
          # ---- STORYBOARD / OVERLAY / TERJEMAHAN ----
          if [ -n "$IN_SHOTS_URL" ]; then curl -fL --retry 3 -o src/shots.tsx "$IN_SHOTS_URL"; fi
          if [ -d "$WS/overlay" ]; then cp -a "$WS/overlay/." ./; echo "overlay diterapkan:"; (cd "$WS/overlay" && find . -type f | head -50); fi
          if ls "$WS"/lang/*.json >/dev/null 2>&1; then cp "$WS"/lang/*.json src/lang/; fi
          echo "audio=$AUDIO | bahasa=$LANGC | skrip='${SARG:-tidak ada}' | asr='${AARG:-tidak}'"

      - name: Install npm packages
        working-directory: _reel
        run: |
          set -euxo pipefail
          npm install --no-audit --no-fund

      - name: Install Chromium (Playwright, termasuk library sistem)
        run: |
          set -euxo pipefail
          npx --yes playwright install --with-deps chromium
          CH="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chromium-*' | head -1)"
          test -x "$CH"
          echo "CHROME=$CH" >> "$GITHUB_ENV"; echo "Chrome: $CH"

      - name: Prepare audio + caption + font
        working-directory: _reel
        run: |
          set -euo pipefail
          sh scripts/prepare.sh "$AUDIO" $SARG --lang "$LANGC" $AARG
          node -e "const c=require('./src/captions.json');console.log('caption:',c.words.length,'kata | durasi audio',c.duration,'dtk | sumber',c.source)"

      - name: Render preview (contact sheet)
        if: ${{ inputs.mode == 'preview' }}
        working-directory: _reel
        run: |
          set -euo pipefail
          TIMES="$(node -e "const c=require('./src/captions.json');const T=c.duration+0.6;const n=12;console.log(Array.from({length:n},(_,i)=>+(0.4+i*(T-0.9)/(n-1)).toFixed(2)).join(','))")"
          echo "waktu: $TIMES"
          node scripts/preview.mjs "$TIMES" 0.35 prev Reel
          python3 scripts/sheet2.py prev "preview_${IN_NAME}.png" 6
          mkdir -p out && mv "preview_${IN_NAME}.png" out/

      - name: Render video (penuh)
        if: ${{ inputs.mode == 'full' }}
        working-directory: _reel
        run: |
          set -euo pipefail
          CONC="$(nproc)"; [ "$CONC" -gt 4 ] && CONC=4
          echo "concurrency=$CONC"
          mkdir -p out
          npx remotion render src/index.ts Reel out/video_silent.mp4 --muted \
            --browser-executable="$CHROME" --gl=swangle --concurrency="$CONC" --codec=h264 --crf=18 --log=info
          ffmpeg -v error -y -i out/video_silent.mp4 -i public/narration.wav -map 0:v -map 1:a \
            -c:v copy -af apad -c:a aac -b:a 192k -shortest "out/${IN_NAME}.mp4"
          rm -f out/video_silent.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,width,height -of default=nw=1 "out/${IN_NAME}.mp4"

      - name: Publish to GitHub Release (tanpa artifact)
        working-directory: _reel
        run: |
          set -euo pipefail
          NAME="${IN_NAME:-reel}"
          if [ "$IN_MODE" = "preview" ]; then FILE="out/preview_${NAME}.png"; DEFTAG="preview-$GITHUB_RUN_NUMBER"; PRE="--prerelease"; KIND="Pratinjau framing"
          else FILE="out/${NAME}.mp4"; DEFTAG="video-$GITHUB_RUN_NUMBER"; PRE=""; KIND="Video"; fi
          TAG="${IN_TAG:-$DEFTAG}"
          test -f "$FILE"
          DUR="$(node -e "console.log(require('./src/captions.json').duration)")"
          SRC="$(node -e "console.log(require('./src/captions.json').source)")"
          cat > notes.md <<NOTES
          ${KIND} dibuat oleh workflow **Render Reel** (run #${GITHUB_RUN_NUMBER}).

          - bahasa: \`${LANGC}\`
          - durasi audio: ${DUR} dtk
          - sumber waktu caption: \`${SRC}\`
          - commit: ${GITHUB_SHA}
          - log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "${KIND}: ${NAME} (${TAG})" --notes-file notes.md $PRE
          fi
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "### ${KIND} siap" >> "$GITHUB_STEP_SUMMARY"; echo "[$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: $URL"
