              c.beginPath(); c.arc(112, 130, 12, 0, 6.3); c.fill(); c.beginPath(); c.moveTo(112, 146); c.lineTo(106, 188); c.moveTo(112, 150); c.lineTo(86, 172); c.moveTo(112, 150); c.lineTo(138, 166); c.lineTo(150, 144); c.moveTo(106, 188); c.lineTo(86, 222); c.moveTo(106, 188); c.lineTo(134, 214); c.lineTo(128, 236); c.stroke();
