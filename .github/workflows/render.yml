            {Array.from({length: 11}).flatMap((_, ii) => Array.from({length: 17}).map((_, j) => { const i = ii - 5, r = rnd(ii * 13 + j * 7 + 1), tgt = i === 1 && j === 5, lit = r > .4 || tgt; return (<group key={ii * 20 + j} position={[i * 1.28, .6 + j * 1.45, .02]}>
