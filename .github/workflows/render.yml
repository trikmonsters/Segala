          import * as THREE from 'three';
          import {rnd, shade} from './core';
          const cache = new Map<string, THREE.CanvasTexture>();
          export function tex(key: string, w: number, h: number, draw: (c: CanvasRenderingContext2D) => void, rep: [number, number] = [1, 1], repeat = true) {
            const k = key + rep.join('x'); let t = cache.get(k); if (t) return t;
            const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d')!);
            t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
            if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
            cache.set(k, t); return t;
          }
          export const brick = (base: string, line: string, rep: [number, number]) => tex('br' + base + line, 512, 512, c => {
            c.fillStyle = line; c.fillRect(0, 0, 512, 512);
            for (let r = 0; r < 8; r++) for (let i = -1; i < 5; i++) {
              const v = (rnd(r * 7 + i + 3) - 0.5) * 0.16; c.fillStyle = shade(base, 1 + v); c.fillRect(i * 128 + (r % 2) * 64 + 3, r * 64 + 3, 122, 58);
              c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(i * 128 + (r % 2) * 64 + 3, r * 64 + 3, 122, 7);
            }
          }, rep);
          export const tiles = (a: string, b: string, line: string, rep: [number, number]) => tex('tl' + a + b + line, 512, 512, c => {
            for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) { c.fillStyle = (i + j) % 2 ? a : b; c.fillRect(i * 256, j * 256, 256, 256); c.fillStyle = 'rgba(255,255,255,.08)'; c.fillRect(i * 256 + 8, j * 256 + 8, 240, 10); }
            c.strokeStyle = line; c.lineWidth = 8; c.strokeRect(0, 0, 512, 512); c.beginPath(); c.moveTo(256, 0); c.lineTo(256, 512); c.moveTo(0, 256); c.lineTo(512, 256); c.stroke();
          }, rep);
          export const panels = (base: string, line: string, rep: [number, number]) => tex('pn' + base + line, 512, 512, c => {
            c.fillStyle = base; c.fillRect(0, 0, 512, 512); c.strokeStyle = line; c.lineWidth = 5; c.strokeRect(0, 0, 512, 512); c.beginPath(); c.moveTo(256, 0); c.lineTo(256, 512); c.moveTo(0, 256); c.lineTo(512, 256); c.stroke();
          }, rep);
          export const boards = (base: string, line: string, rep: [number, number]) => tex('bd' + base + line, 512, 512, c => {
            for (let i = 0; i < 4; i++) { c.fillStyle = shade(base, 1 + (rnd(i + 9) - 0.5) * 0.18); c.fillRect(i * 128, 0, 128, 512); c.fillStyle = line; c.fillRect(i * 128, 0, 5, 512);
              c.strokeStyle = 'rgba(0,0,0,.12)'; c.lineWidth = 2; for (let k = 0; k < 6; k++) { c.beginPath(); c.moveTo(i * 128 + 20 + k * 16, 0); c.bezierCurveTo(i * 128 + 30 + k * 16, 170, i * 128 + 10 + k * 16, 340, i * 128 + 24 + k * 16, 512); c.stroke(); } }
          }, rep);
          export const carpet = (base: string, rep: [number, number]) => tex('cp' + base, 256, 256, c => {
            c.fillStyle = base; c.fillRect(0, 0, 256, 256); for (let i = 0; i < 900; i++) { c.fillStyle = `rgba(255,255,255,${rnd(i) * 0.08})`; c.fillRect(rnd(i + 1) * 256, rnd(i + 2) * 256, 3, 3); }
          }, rep);
          export const glowTex = () => tex('glow', 256, 256, c => {
            const g = c.createRadialGradient(128, 128, 0, 128, 128, 128); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
            c.fillStyle = g; c.fillRect(0, 0, 256, 256);
          }, [1, 1], false);
          export const skyTex = (c0: string, c1: string, c2: string) => tex('sky' + c0 + c1 + c2, 8, 512, c => {
            const g = c.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, c0); g.addColorStop(0.55, c1); g.addColorStop(1, c2); c.fillStyle = g; c.fillRect(0, 0, 8, 512);
          }, [1, 1], false);
