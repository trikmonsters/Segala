name: reel-3d-srt
on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'URL langsung audio narasi (mp3/wav/m4a)'
        required: true
        type: string
      srt_url:
        description: 'URL langsung file SRT (subtitle Inggris)'
        required: true
        type: string
      video_name:
        description: 'Nama keluaran (tanpa .mp4)'
        required: false
        default: 'reel'
        type: string
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      IN_AUDIO: ${{ inputs.audio_url }}
      IN_SRT: ${{ inputs.srt_url }}
      IN_NAME: ${{ inputs.video_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
      - run: |
          set -e
          mkdir -p public build
          curl -fL "$IN_AUDIO" -o build/audio_in
          curl -fL "$IN_SRT" -o build/narration.srt
          file build/audio_in || true
          head -20 build/narration.srt
      - run: |
          set -e
          ffmpeg -v error -y -i build/audio_in -vn -ac 2 -ar 48000 -c:a pcm_s16le public/narration.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1 public/narration.wav
      - run: |
          set -e
          rm -rf src scripts out chunks
          mkdir -p src/lib scripts out chunks
          cat > package.json <<'EOF'
          {
           "name": "reel-3d-srt",
           "version": "1.0.0",
           "private": true,
           "dependencies": {
            "@react-three/fiber": "^8.17.10",
            "@remotion/bundler": "^4.0.250",
            "@remotion/cli": "^4.0.250",
            "@remotion/renderer": "^4.0.250",
            "@remotion/three": "^4.0.250",
            "@types/react": "18.3.3",
            "@types/three": "0.169.0",
            "react": "^18.3.1",
            "react-dom": "^18.3.1",
            "remotion": "^4.0.250",
            "three": "^0.169.0",
            "typescript": "5.5.4",
            "@fontsource/montserrat": "^5.1.0",
            "@fontsource/inter": "^5.1.0"
           },
           "overrides": { "webpack": "5.83.1" }
          }
          EOF
          cat > tsconfig.json <<'EOF'
          {"compilerOptions":{"target":"ES2020","module":"ESNext","moduleResolution":"bundler","jsx":"react-jsx","strict":false,"skipLibCheck":true,"esModuleInterop":true,"types":["react"]}}
          EOF
          cat > src/fonts.ts <<'EOF'
          export const loadFonts = async () => {
            const d: any = document;
            await Promise.all(['800','700','600'].map(w => d.fonts.load(`${w} 40px "Montserrat"`, 'Aa0123456789').catch(()=>null)));
            await d.fonts.ready;
          };
          EOF
          cat > src/index.ts <<'EOF'
          import '@fontsource/montserrat/800.css';
          import '@fontsource/montserrat/700.css';
          import '@fontsource/inter/400.css';
          import '@fontsource/inter/600.css';
          import {registerRoot} from 'remotion';
          import {Root} from './Root';
          registerRoot(Root);
          EOF
          cat > src/lib/core.tsx <<'EOF'
          import * as THREE from 'three';
          export type V3 = [number, number, number];
          export type CamSpec = {p: V3; l: V3; fov: number; roll?: number};
          export const eo3 = (p: number) => { const c = Math.min(1, Math.max(0, p)); return c < .5 ? 2*c*c : 1 - Math.pow(-2*c+2, 2)/2; };
          export const lerp = (a: number, b: number, t: number) => a + (b-a)*t;
          export const clamp = (x: number, a: number, b: number) => Math.min(b, Math.max(a, x));
          export const camLerp = (a: CamSpec, b: CamSpec, t: number): CamSpec => ({
            p: [lerp(a.p[0], b.p[0], t), lerp(a.p[1], b.p[1], t), lerp(a.p[2], b.p[2], t)],
            l: [lerp(a.l[0], b.l[0], t), lerp(a.l[1], b.l[1], t), lerp(a.l[2], b.l[2], t)],
            fov: lerp(a.fov, b.fov, t), roll: lerp(a.roll||0, b.roll||0, t)
          });
          export const handheld = (c: CamSpec, t: number, amp = .006): CamSpec => ({
            ...c,
            p: [c.p[0]+Math.sin(t*1.7)*amp, c.p[1]+Math.sin(t*2.3+1)*amp, c.p[2]+Math.sin(t*1.1+2)*amp],
            l: [c.l[0]+Math.sin(t*1.3)*amp*.4, c.l[1]+Math.sin(t*1.9+1)*amp*.4, c.l[2]]
          });
          export const MAT = (color: string, opts: any = {}) => new THREE.MeshPhysicalMaterial({
            color: new THREE.Color(color),
            roughness: opts.roughness ?? .55,
            metalness: opts.metalness ?? 0,
            clearcoat: opts.clearcoat ?? 0,
            clearcoatRoughness: opts.clearcoatRoughness ?? .3,
            emissive: new THREE.Color(opts.emissive ?? '#000000'),
            emissiveIntensity: opts.emissiveIntensity ?? 0,
            transparent: opts.transparent ?? false,
            opacity: opts.opacity ?? 1,
          });
          export {THREE};
          EOF
          cat > src/lib/Character.tsx <<'EOF'
          import React from 'react';
          import * as THREE from 'three';
          import {MAT, V3} from './core';
          export type Arm = [number, number, number];
          export type Pose = {sitH: number; lean: number; aL: Arm; aR: Arm; lL: Arm; lR: Arm};
          const d = (x: number) => x * Math.PI / 180;
          const base = (o: Partial<Pose>): Pose => ({sitH: 0, lean: 0, aL: [d(6), d(12), d(18)], aR: [d(6), d(12), d(18)], lL: [0, d(2), 0], lR: [0, d(2), 0], ...o});
          export const POSE: Record<string, Pose> = {
            stand: base({}),
            hold: base({lean: d(3)}),
            sit: base({sitH: 1, aL: [d(30), d(10), d(75)], aR: [d(30), d(10), d(75)], lL: [d(90), d(3), d(90)], lR: [d(90), d(3), d(90)]}),
            cheer: base({aL: [d(10), d(150), d(10)], aR: [d(10), d(150), d(10)]}),
            wave: base({aR: [d(10), d(150), d(70)]}),
          };
          const D = {headR: .14, SY: 1.1, torsoW: .40, torsoH: .50, torsoD: .24, shX: .22, arm1: .30, arm2: .27, hand: .052,
                     thigh: .45, shin: .43, ankle: .06, hipX: .10, rL1: .078, rL2: .058, foot: [.11,.08,.27], neckL: .08, rN: .052, pelW: .36, pelH: .2, seat: .485};
          const Bone: React.FC<{a: THREE.Vector3; b: THREE.Vector3; r: number; c: string; metal?: number}> = ({a, b, r, c, metal=0}) => {
            const len = Math.max(.001, a.distanceTo(b));
            const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), b.clone().sub(a).normalize());
            return <mesh position={a.clone().add(b).multiplyScalar(.5).toArray() as V3} quaternion={q} material={MAT(c, {roughness: .6 - metal*.2, metalness: metal})} castShadow>
              <capsuleGeometry args={[r, len, 8, 16]} /></mesh>;
          };
          const Joint: React.FC<{p: THREE.Vector3; r: number; c: string}> = ({p, r, c}) =>
            <mesh position={p.toArray() as V3} material={MAT(c, {roughness: .65})} castShadow><sphereGeometry args={[r*1.1, 18, 14]} /></mesh>;
          const useFace = (id: string, skin: string, expr: string) => {
            const key = id + expr;
            const cache = (useFace as any).cache || ((useFace as any).cache = new Map());
            if (cache.has(key)) return cache.get(key);
            const cv = document.createElement('canvas'); cv.width = 512; cv.height = 512;
            const c = cv.getContext('2d')!;
            c.fillStyle = skin; c.fillRect(0,0,512,512);
            const cx=256, ey=200, my=340;
            c.strokeStyle = '#2a1a16'; c.fillStyle = '#2a1a16'; c.lineWidth = 8;
            const eye = (x: number, mode: string) => {
              if (mode === 'happy') { c.beginPath(); c.arc(x, ey+8, 26, Math.PI*1.1, Math.PI*1.9); c.stroke(); }
              else if (mode === 'sleepy') { c.beginPath(); c.moveTo(x-26, ey); c.lineTo(x+26, ey); c.stroke(); }
              else { c.fillStyle = '#fff'; c.beginPath(); c.ellipse(x, ey, 30, 22, 0, 0, 6.3); c.fill(); c.fillStyle='#2a1a10'; c.beginPath(); c.arc(x, ey, 14, 0, 6.3); c.fill(); c.fillStyle='#000'; c.beginPath(); c.arc(x, ey, 7, 0, 6.3); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(x-6, ey-6, 3, 0, 6.3); c.fill(); }
            };
            if (expr === 'happy') { eye(cx-70,'happy'); eye(cx+70,'happy'); c.beginPath(); c.arc(cx, my-10, 50, .2, Math.PI-.2); c.stroke(); }
            else if (expr === 'shock') { eye(cx-70,'wide'); eye(cx+70,'wide'); c.beginPath(); c.ellipse(cx, my, 22, 32, 0, 0, 6.3); c.fillStyle='#3a1218'; c.fill(); }
            else if (expr === 'think') { eye(cx-70,'sleepy'); eye(cx+70,'dot'); c.beginPath(); c.moveTo(cx-30, my+8); c.lineTo(cx+30, my+8); c.stroke(); }
            else { eye(cx-70,'dot'); eye(cx+70,'dot'); c.beginPath(); c.arc(cx, my-10, 40, .15, Math.PI-.15); c.stroke(); }
            const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; cache.set(key, tx); return tx;
          };
          export type CharP = {id: string; pos: V3; rotY?: number; pose?: Pose; top?: string; pants?: string; skin?: string; hair?: string;
                               expr?: 'neutral'|'happy'|'shock'|'think'; t?: number; wL?: V3; wR?: V3; fL?: V3; fR?: V3;};
          export const Character: React.FC<CharP> = (p) => {
            const t = p.t || 0, pose = p.pose || POSE.stand;
            const skin = p.skin || '#e8b98f', top = p.top || '#e08a5a', pants = p.pants || '#2c3550', hair = p.hair || '#2a1d18';
            const face = useFace(p.id, skin, p.expr || 'neutral');
            const stand = D.thigh+D.shin+D.ankle;
            const hip = pose.sitH > .5 ? D.seat : stand + Math.sin(t*1.8)*.006;
            const lean = pose.lean;
            const P = new THREE.Vector3(0, hip, 0);
            const rot = new THREE.Euler(-lean, 0, 0);
            const toLocal = (v: THREE.Vector3) => v.clone().applyEuler(rot).add(P);
            const shY = .07 + D.torsoH - .05, neckBase = .07 + D.torsoH, headC = neckBase + D.neckL + D.headR*D.SY*.88;
            const sL = toLocal(new THREE.Vector3(-D.shX, shY, 0)), sR = toLocal(new THREE.Vector3(D.shX, shY, 0));
            const ik = (S: THREE.Vector3, W: THREE.Vector3, L1: number, L2: number, pole: THREE.Vector3) => {
              const dv = W.clone().sub(S); let dist = dv.length();
              const dMax = L1+L2-.001, Wc = W.clone();
              if (dist > dMax) { Wc.copy(S).add(dv.multiplyScalar(dMax/dist)); dist = dMax; }
              const dir = Wc.clone().sub(S).normalize();
              const a = (L1*L1-L2*L2+dist*dist)/(2*dist), h = Math.sqrt(Math.max(0, L1*L1-a*a));
              const mid = S.clone().add(dir.clone().multiplyScalar(a));
              const pp = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
              return {E: mid.add(pp.multiplyScalar(h)), W: Wc};
            };
            const fkA = (S: THREE.Vector3, side: number, a: Arm) => {
              const q1 = new THREE.Quaternion().setFromEuler(new THREE.Euler(-a[0], 0, side*a[1]));
              const q2 = new THREE.Quaternion().setFromEuler(new THREE.Euler(-a[2], 0, 0));
              const E = S.clone().add(new THREE.Vector3(0,-1,0).applyQuaternion(q1).multiplyScalar(D.arm1));
              const W = E.clone().add(new THREE.Vector3(0,-1,0).applyQuaternion(q2).applyQuaternion(q1).multiplyScalar(D.arm2));
              return {E, W};
            };
            const fkL = (H: THREE.Vector3, side: number, l: Arm) => {
              const q1 = new THREE.Quaternion().setFromEuler(new THREE.Euler(-l[0], 0, side*l[1]));
              const q2 = new THREE.Quaternion().setFromEuler(new THREE.Euler(l[2], 0, 0));
              const E = H.clone().add(new THREE.Vector3(0,-1,0).applyQuaternion(q1).multiplyScalar(D.thigh));
              const W = E.clone().add(new THREE.Vector3(0,-1,0).applyQuaternion(q2).applyQuaternion(q1).multiplyScalar(D.shin));
              return {E, W};
            };
            const defL = toLocal(new THREE.Vector3(-D.shX-.08, hip-.15, .06));
            const defR = toLocal(new THREE.Vector3(D.shX+.08, hip-.15, .06));
            const aL = p.wL ? ik(sL, new THREE.Vector3(...p.wL), D.arm1, D.arm2, new THREE.Vector3(-1,.1,-.3)) : (pose.sitH ? fkA(sL,-1,pose.aL) : ik(sL, defL, D.arm1, D.arm2, new THREE.Vector3(-1,.1,-.3)));
            const aR = p.wR ? ik(sR, new THREE.Vector3(...p.wR), D.arm1, D.arm2, new THREE.Vector3(1,.1,-.3)) : (pose.sitH ? fkA(sR,1,pose.aR) : ik(sR, defR, D.arm1, D.arm2, new THREE.Vector3(1,.1,-.3)));
            const hL = new THREE.Vector3(-D.hipX, hip-.02, 0), hR = new THREE.Vector3(D.hipX, hip-.02, 0);
            const clampF = (v?: V3) => v ? new THREE.Vector3(v[0], Math.max(v[1], D.ankle+.02), v[2]) : null;
            const fL = clampF(p.fL), fR = clampF(p.fR);
            const lL = fL ? ik(hL, fL, D.thigh, D.shin, new THREE.Vector3(0,1,.4)) : fkL(hL,-1,pose.lL);
            const lR = fR ? ik(hR, fR, D.thigh, D.shin, new THREE.Vector3(0,1,.4)) : fkL(hR,1,pose.lR);
            return (
              <group position={p.pos} rotation={[0, p.rotY || 0, 0]}>
                <Joint p={hL} r={D.rL1} c={pants} /><Joint p={hR} r={D.rL1} c={pants} />
                <Bone a={hL} b={lL.E} r={D.rL1} c={pants} /><Joint p={lL.E} r={D.rL1*.95} c={pants} /><Bone a={lL.E} b={lL.W} r={D.rL2} c={pants} />
                <Bone a={hR} b={lR.E} r={D.rL1} c={pants} /><Joint p={lR.E} r={D.rL1*.95} c={pants} /><Bone a={lR.E} b={lR.W} r={D.rL2} c={pants} />
                {[lL.W, lR.W].map((A,i) => (
                  <mesh key={i} position={[A.x, Math.max(A.y-.03,.02), A.z+.05]} material={MAT('#1a1825', {roughness:.4, clearcoat:.2})} castShadow>
                    <boxGeometry args={D.foot} /></mesh>
                ))}
                <mesh position={[0, hip+D.pelH*.35, 0]} material={MAT(pants, {roughness:.7})} castShadow>
                  <boxGeometry args={[D.pelW, D.pelH, D.torsoD*.95]} /></mesh>
                <group position={P.toArray() as V3} quaternion={new THREE.Quaternion().setFromEuler(rot)}>
                  <mesh position={[0, .07+D.torsoH/2, 0]} material={MAT(top, {roughness:.5, clearcoat:.1})} castShadow receiveShadow>
                    <boxGeometry args={[D.torsoW, D.torsoH, D.torsoD]} /></mesh>
                  <mesh position={[0, neckBase+D.neckL*.5, 0]} material={MAT(skin, {roughness:.7})} castShadow>
                    <cylinderGeometry args={[D.rN,D.rN,D.neckL,20]} /></mesh>
                  <group position={[0, headC, 0]}>
                    <mesh scale={[1,D.SY,1]} castShadow>
                      <sphereGeometry args={[D.headR, 40, 30]} />
                      <meshPhysicalMaterial map={face} roughness={.6} clearcoat={.2} />
                    </mesh>
                    <mesh material={MAT(hair, {roughness:.85})} castShadow>
                      <sphereGeometry args={[D.headR*1.06, 32, 20, 0, Math.PI*2, 0, Math.PI*.62]} /></mesh>
                  </group>
                  <Joint p={sL} r={.05} c={top} /><Joint p={sR} r={.05} c={top} />
                  <Bone a={sL} b={aL.E} r={.048} c={top} /><Joint p={aL.E} r={.048} c={top} /><Bone a={aL.E} b={aL.W} r={.040} c={top} /><Joint p={aL.W} r={D.hand} c={skin} />
                  <Bone a={sR} b={aR.E} r={.048} c={top} /><Joint p={aR.E} r={.048} c={top} /><Bone a={aR.E} b={aR.W} r={.040} c={top} /><Joint p={aR.W} r={D.hand} c={skin} />
                </group>
              </group>
            );
          };
          EOF
          cat > src/lib/Set.tsx <<'EOF'
          import React, {useMemo} from 'react';
          import * as THREE from 'three';
          import {MAT, V3} from './core';
          export const Room: React.FC<{w:number; d:number; h:number; wall:string; floor:string}> = ({w,d,h,wall,floor}) => (
            <group>
              <mesh rotation={[-Math.PI/2,0,0]} position={[0,0,d/2]} receiveShadow>
                <planeGeometry args={[w,d]} /><meshPhysicalMaterial color={floor} roughness={.4} metalness={.05} clearcoat={.4} /></mesh>
              <mesh position={[0,h/2,0]} receiveShadow>
                <planeGeometry args={[w,h]} /><meshPhysicalMaterial color={wall} roughness={.9} /></mesh>
              <mesh rotation={[0,Math.PI/2,0]} position={[-w/2,h/2,d/2]} receiveShadow>
                <planeGeometry args={[d,h]} /><meshPhysicalMaterial color={wall} roughness={.9} /></mesh>
              <mesh rotation={[0,-Math.PI/2,0]} position={[w/2,h/2,d/2]} receiveShadow>
                <planeGeometry args={[d,h]} /><meshPhysicalMaterial color={wall} roughness={.9} /></mesh>
            </group>
          );
          export const Lights: React.FC<{sun?: number; amb?: number; tint?: string}> = ({sun=1.4, amb=.4, tint='#ffd6a0'}) => (
            <>
              <ambientLight intensity={amb} color="#9a8ab0" />
              <hemisphereLight args={['#ffd6a0', '#2a2038', amb*1.2]} />
              <directionalLight position={[3,5,4]} intensity={sun} color={tint} castShadow
                shadow-mapSize={[1024,1024]} shadow-camera-left={-6} shadow-camera-right={6}
                shadow-camera-top={6} shadow-camera-bottom={-6} shadow-bias={-.0005} shadow-normalBias={.02} />
              <pointLight position={[-2,2.5,2]} intensity={.8} color="#7a6aff" distance={9} />
              <pointLight position={[2,2,1]} intensity={.6} color="#ff9a5a" distance={7} />
            </>
          );
          export const Desk: React.FC<{pos:V3; w:number; d:number; col:string}> = ({pos,w,d,col}) => (
            <group position={pos}>
              <mesh position={[0,.77,0]} material={MAT(col, {roughness:.35, clearcoat:.3})} castShadow receiveShadow>
                <boxGeometry args={[w,.05,d]} /></mesh>
              {[[-1,-1],[1,-1],[-1,1],[1,1]].map(([x,z],i) => (
                <mesh key={i} position={[x*(w/2-.06), .38, z*(d/2-.06)]} material={MAT('#1a1525', {metalness:.7, roughness:.3})} castShadow>
                  <boxGeometry args={[.05,.76,.05]} /></mesh>
              ))}
            </group>
          );
          export const Chair: React.FC<{pos:V3; rot?:number; col?:string}> = ({pos, rot=0, col='#2a2038'}) => (
            <group position={pos} rotation={[0,rot,0]}>
              <mesh position={[0,.44,0]} material={MAT(col,{roughness:.7})} castShadow><boxGeometry args={[.44,.07,.44]} /></mesh>
              <mesh position={[0,.72,-.19]} material={MAT(col,{roughness:.7})} castShadow><boxGeometry args={[.44,.52,.07]} /></mesh>
              <mesh position={[0,.22,0]} material={MAT('#1a1525',{metalness:.8,roughness:.3})}><cylinderGeometry args={[.03,.03,.44,16]} /></mesh>
            </group>
          );
          const makeScreen = (type: string) => {
            const cv = document.createElement('canvas'); cv.width = 640; cv.height = 400;
            const c = cv.getContext('2d')!;
            c.fillStyle = '#0a1020'; c.fillRect(0,0,640,400);
            if (type === 'chat') {
              c.fillStyle = '#141a30'; c.fillRect(0,0,640,60);
              c.fillStyle = '#e0e8ff'; c.font = 'bold 26px Inter'; c.fillText('Messages', 24, 40);
              [['AI HATE?', '#ff5577'], ['#trending', '#ffaa44'], ['Explain yourself', '#88bbff']].forEach(([txt,col], i) => {
                c.fillStyle = '#1e2a45'; c.beginPath(); c.roundRect(24, 100+i*85, 460, 64, 20); c.fill();
                c.fillStyle = col as string; c.font = '20px Inter'; c.fillText(txt as string, 44, 140+i*85);
              });
            } else if (type === 'chart') {
              c.fillStyle = '#e0e8ff'; c.font = 'bold 30px Inter'; c.fillText('ENGAGEMENT', 30, 50);
              const pts = [40,110,70,160,200,260,300,380];
              c.strokeStyle = '#4ac0b0'; c.lineWidth = 6; c.beginPath();
              pts.forEach((y,i) => { const x = 40+i*80; if(i===0)c.moveTo(x,380-y); else c.lineTo(x,380-y); }); c.stroke();
              c.fillStyle = '#4ac0b0'; pts.forEach((y,i) => { c.beginPath(); c.arc(40+i*80,380-y,10,0,6.3); c.fill(); });
            } else if (type === 'slide') {
              c.fillStyle = '#1a2040'; c.fillRect(0,0,640,400);
              c.fillStyle = '#ffd9a0'; c.font = 'bold 42px Inter'; c.fillText('PROBLEM SOLVING', 40, 100);
              c.fillStyle = '#88bbff'; c.font = '26px Inter';
              ['1. Understand', '2. Break down', '3. Prompt clearly', '4. Verify'].forEach((s,i) => c.fillText(s, 60, 180+i*48));
            }
            const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
          };
          export const Monitor: React.FC<{pos:V3; rot?:V3; kind:string; s?:number}> = ({pos, rot=[0,0,0], kind, s=1}) => {
            const tex = useMemo(() => makeScreen(kind), [kind]);
            return (
              <group position={pos} rotation={rot} scale={s}>
                <mesh material={MAT('#0a0a12',{roughness:.15,metalness:.4,clearcoat:.8})} castShadow><boxGeometry args={[.66,.44,.03]} /></mesh>
                <mesh position={[0,0,.017]} material={new THREE.MeshBasicMaterial({map: tex, toneMapped: false})}>
                  <planeGeometry args={[.62,.40]} /></mesh>
                <mesh position={[0,-.23,0]} material={MAT('#1a1a22',{metalness:.9,roughness:.25})}>
                  <cylinderGeometry args={[.02,.03,.06,16]} /></mesh>
              </group>
            );
          };
          export const WallArt: React.FC<{kind:string; pos:V3; w:number}> = ({kind,pos,w}) => {
            const tex = useMemo(() => makeScreen(kind), [kind]);
            const h = w*0.625;
            return (
              <group position={pos}>
                <mesh material={MAT('#2a2038',{roughness:.5})}><boxGeometry args={[w+.05,h+.05,.02]} /></mesh>
                <mesh position={[0,0,.012]} material={new THREE.MeshBasicMaterial({map: tex, toneMapped: false})}>
                  <planeGeometry args={[w,h]} /></mesh>
              </group>
            );
          };
          EOF
          cat > src/caption.tsx <<'EOF'
          import React from 'react';
          import {useVideoConfig} from 'remotion';
          import {TL} from './timeline';
          export const Captions: React.FC<{t:number}> = ({t}) => {
            const {width, height} = useVideoConfig();
            let cur = '';
            for (const s of TL) if (t >= s.a && t < s.a + s.D) { cur = s.text; break; }
            if (!cur) return null;
            const size = Math.min(72 * (width/1080), (width*.9) / Math.max(8, cur.length*.62));
            return (
              <div style={{position:'absolute', left:0, right:0, top:height*.75, transform:'translateY(-50%)', textAlign:'center'}}>
                <span style={{fontFamily:'Montserrat, Inter, sans-serif', fontWeight:800, fontSize:size, lineHeight:1.15, color:'#fff',
                  textShadow:'0 0 8px #000, 0 4px 0 rgba(0,0,0,.85), 0 8px 12px rgba(0,0,0,.5)'}}>{cur}</span>
              </div>
            );
          };
          EOF
          cat > src/Reel.tsx <<'EOF'
          import React from 'react';
          import * as THREE from 'three';
          import {AbsoluteFill, useCurrentFrame, useVideoConfig, delayRender, continueRender} from 'remotion';
          import {ThreeCanvas} from '@remotion/three';
          import {useThree} from '@react-three/fiber';
          import {TL, TOTAL_S} from './timeline';
          import {CamSpec, handheld} from './lib/core';
          import {Captions} from './caption';
          import {loadFonts} from './fonts';
          const Rig: React.FC<{cam:CamSpec}> = ({cam}) => {
            const {camera} = useThree();
            React.useLayoutEffect(() => {
              const c = camera as THREE.PerspectiveCamera;
              c.position.set(...cam.p); c.up.set(0,1,0); c.lookAt(...cam.l);
              c.rotateZ(cam.roll||0); c.fov = cam.fov; c.near = .05; c.far = 100; c.updateProjectionMatrix();
            });
            return null;
          };
          const cameraFor = (idx:number, p:number): CamSpec => {
            const sway = Math.sin(idx*.7)*.2;
            const fov = 44 + 6*Math.sin(idx*.9);
            const z = 4.6 - .6*Math.sin(idx*1.3);
            return {p:[sway, 1.5, z], l:[0, 1.15, 2.2], fov, roll: (idx%2?1:-1)*.02};
          };
          export const Reel: React.FC = () => {
            const [ready, setReady] = React.useState(false);
            const [h] = React.useState(() => delayRender('fonts'));
            React.useEffect(() => { loadFonts().then(()=>setReady(true)).catch(()=>setReady(true)).finally(()=>continueRender(h)); }, []);
            const f = useCurrentFrame(); const {width, height, fps} = useVideoConfig();
            const t = Math.min(f/fps, TOTAL_S-.001);
            if (!ready) return null;
            let idx = 0; for (let i=0;i<TL.length;i++) if (t >= TL[i].a) idx = i;
            const sh = TL[idx]; const p = Math.min(1,(t-sh.a)/sh.D);
            const cam = handheld(cameraFor(idx, p), t, .006);
            return (
              <AbsoluteFill style={{background:'#000'}}>
                <ThreeCanvas width={width} height={height} shadows
                  gl={{antialias:true, toneMapping: THREE.ACESFilmicToneMapping, toneMappingExposure: 1.1, preserveDrawingBuffer: true}}
                  camera={{fov:cam.fov, position:cam.p, near:.05, far:100}}>
                  <Rig cam={cam} />
                  <sh.Scene p={p} u={t-sh.a} />
                </ThreeCanvas>
                <AbsoluteFill style={{background:'radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%)'}} />
                <AbsoluteFill style={{background:'linear-gradient(to bottom, rgba(255,255,255,.06), rgba(0,0,0,0) 40%, rgba(0,0,0,.22))'}} />
                <Captions t={t} />
              </AbsoluteFill>
            );
          };
          EOF
          cat > src/Root.tsx <<'EOF'
          import React from 'react';
          import {Composition} from 'remotion';
          import {Reel} from './Reel';
          import {TOTAL_S} from './timeline';
          export const Root: React.FC = () => <Composition id="Reel" component={Reel}
            durationInFrames={Math.max(30, Math.ceil(TOTAL_S*30))} fps={30} width={1080} height={1920} />;
          EOF
      - run: |
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const srt = fs.readFileSync('build/narration.srt', 'utf8');
          const blocks = [];
          const re = /(\d{2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2})[,.](\d{3})([\s\S]*?)(?=\n{2,}|\n*$)/g;
          let m;
          while ((m = re.exec(srt)) !== null) {
            const s = (+m[1])*3600 + (+m[2])*60 + (+m[3]) + (+m[4])/1000;
            const e = (+m[5])*3600 + (+m[6])*60 + (+m[7]) + (+m[8])/1000;
            const text = (m[9]||'').trim().replace(/\s+/g,' ');
            if (text && e > s) blocks.push({start: s, end: e, text});
          }
          if (!blocks.length) { console.error('SRT kosong / tidak valid'); process.exit(1); }
          console.log('blocks', blocks.length, 'duration', blocks[blocks.length-1].end.toFixed(2));
          fs.writeFileSync('src/blocks.generated.ts',
            'import React from "react";\n' +
            'import {Character, POSE} from "./lib/Character";\n' +
            'import {Room, Lights, Desk, Chair, Monitor, WallArt} from "./lib/Set";\n' +
            'const SceneBase: React.FC<{children: React.ReactNode}> = ({children}) => (\n' +
            '  <>\n' +
            '    <color attach="background" args={["#1a1626"]} />\n' +
            '    <Lights sun={1.4} amb={.4} tint="#ffd6a0" />\n' +
            '    <Room w={8} d={8} h={3.2} wall="#3a3052" floor="#2a2438" />\n' +
            '    {children}\n' +
            '  </>\n' +
            ');\n' +
            'export type Block = {start:number; end:number; text:string};\n' +
            'export const BLOCKS: Block[] = ' + JSON.stringify(blocks, null, 0) + ';\n' +
            'export const SceneFor = (text: string): React.FC<{p:number;u:number}> => ({u}) => {\n' +
            '  const hasMeeting = /app|resign|phone|stranger|sunglasses/i.test(text);\n' +
            '  const hasChart = /trend|spread|office|money/i.test(text);\n' +
            '  const hasRelief = /free|calm|tired|knock|fixes/i.test(text);\n' +
            '  if (hasMeeting) return (\n' +
            '    <SceneBase>\n' +
            '      <Desk pos={[0,0,2.2]} w={1.8} d={.9} col="#3a2a4a" />\n' +
            '      <Monitor pos={[0,.77,2.2]} kind="chat" s={1.1} />\n' +
            '      <Chair pos={[0,0,1.8]} rot={Math.PI} />\n' +
            '      <Character id="u1" pos={[0,0,1.8]} rotY={0} pose={POSE.sit} t={u}\n' +
            '        wL={[-.22,.83,-.25]} wR={[.22,.83,-.25]}\n' +
            '        fL={[-.12,.06,.05]} fR={[.12,.06,.05]}\n' +
            '        top="#e08a5a" expr="shock" />\n' +
            '    </SceneBase>\n' +
            '  );\n' +
            '  if (hasChart) return (\n' +
            '    <SceneBase>\n' +
            '      <WallArt kind="chart" pos={[0,1.6,.06]} w={1.6} />\n' +
            '      <Character id="u2" pos={[-.6,0,2.2]} rotY={.3} pose={POSE.cheer} t={u} top="#4ac0b0" expr="happy" />\n' +
            '    </SceneBase>\n' +
            '  );\n' +
            '  if (hasRelief) return (\n' +
            '    <SceneBase>\n' +
            '      <Desk pos={[0,0,2.2]} w={1.8} d={.9} col="#3a2a4a" />\n' +
            '      <Chair pos={[0,0,1.8]} rot={Math.PI} />\n' +
            '      <Character id="u1" pos={[0,0,1.8]} rotY={0} pose={POSE.sit} t={u}\n' +
            '        wL={[-.22,.83,-.25]} wR={[.22,.83,-.25]}\n' +
            '        fL={[-.12,.06,.05]} fR={[.12,.06,.05]}\n' +
            '        top="#e08a5a" expr="think" />\n' +
            '    </SceneBase>\n' +
            '  );\n' +
            '  return (\n' +
            '    <SceneBase>\n' +
            '      <Desk pos={[0,0,2.2]} w={1.6} d={.8} col="#3a2a4a" />\n' +
            '      <Monitor pos={[0,.77,2.2]} kind="slide" s={.95} />\n' +
            '      <Chair pos={[0,0,1.8]} rot={Math.PI} />\n' +
            '      <Character id="u1" pos={[0,0,1.8]} rotY={0} pose={POSE.sit} t={u}\n' +
            '        wL={[-.2,.83,-.25]} wR={[.2,.83,-.25]}\n' +
            '        fL={[-.12,.06,.05]} fR={[.12,.06,.05]}\n' +
            '        top="#e08a5a" expr="neutral" />\n' +
            '    </SceneBase>\n' +
            '  );\n' +
            '};\n'
          );
          NODE
          cat > src/timeline.ts <<'EOF'
          import React from 'react';
          import {BLOCKS, SceneFor, Block} from './blocks.generated';
          export type TLEntry = {a:number; D:number; text:string; Scene: React.FC<{p:number;u:number}>};
          export const TL: TLEntry[] = BLOCKS.map((b: Block) => ({a:b.start, D:b.end-b.start, text:b.text, Scene: SceneFor(b.text)}));
          export const TOTAL_S = BLOCKS.length ? BLOCKS[BLOCKS.length-1].end : 1;
          export {BLOCKS};
          EOF
      - run: |
          set -e
          mkdir -p build/sfx
          ffmpeg -v error -y -f lavfi -i "anoisesrc=d=0.35:c=pink:r=48000:a=0.3" -af "highpass=f=300,lowpass=f=3000,afade=t=in:d=0.03,afade=t=out:st=0.25:d=0.1,volume=2.5" build/sfx/whoosh.wav
          ffmpeg -v error -y -f lavfi -i "sine=f=1800:d=0.08:r=48000" -af "afade=t=out:st=0.02:d=0.06,volume=1.8" build/sfx/click.wav
          ffmpeg -v error -y -f lavfi -i "sine=f=880:d=0.12:r=48000" -f lavfi -i "sine=f=1320:d=0.13:r=48000" -filter_complex "[0][1]concat=n=2:v=0:a=1,afade=t=out:st=0.18:d=0.07,volume=1.6" build/sfx/notif.wav
          ffmpeg -v error -y -f lavfi -i "sine=f=880:d=0.6:r=48000" -f lavfi -i "sine=f=1108:d=0.6:r=48000" -f lavfi -i "sine=f=1320:d=0.6:r=48000" -filter_complex "[0][1][2]amix=inputs=3:duration=longest,afade=t=out:st=0.3:d=0.3,volume=1.2" build/sfx/ding.wav
          ffmpeg -v error -y -f lavfi -i "anoisesrc=d=1.2:c=white:r=48000:a=0.25" -af "highpass=f=800,lowpass=f=6000,afade=t=in:d=0.9,afade=t=out:st=1.1:d=0.1,volume=2.2" build/sfx/riser.wav
          ffmpeg -v error -y -f lavfi -i "sine=f=60:d=0.5:r=48000" -af "afade=t=out:st=0.05:d=0.45,volume=3.5" build/sfx/impact.wav
          ls -l build/sfx
      - run: |
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const blocks = JSON.parse(fs.readFileSync('src/blocks.generated.ts','utf8').match(/BLOCKS:\s*Block\[\]\s*=\s*(\[[\s\S]*?\]);/)[1]);
          const SFX = 'build/sfx/';
          const cues = [];
          blocks.forEach((b, i) => {
            cues.push({file: 'whoosh.wav', at: Math.max(0, b.start - 0.05), vol: 0.55});
            if (/app|phone|chat|message/i.test(b.text)) cues.push({file: 'notif.wav', at: b.start + 0.15, vol: 0.5});
            if (/click|type|prompt/i.test(b.text)) cues.push({file: 'click.wav', at: b.start + 0.1, vol: 0.6});
            if (/free|calm|works|done|solution|solved/i.test(b.text)) cues.push({file: 'ding.wav', at: b.start + 0.3, vol: 0.55});
            if (/money|night|alone|climax|moment/i.test(b.text)) {
              cues.push({file: 'riser.wav', at: Math.max(0, b.start - 0.6), vol: 0.5});
              cues.push({file: 'impact.wav', at: b.start, vol: 0.7});
            }
          });
          const inputs = cues.map((c,i) => `-i ${SFX}${c.file}`).join(' ');
          const chains = cues.map((c,i) => `[${i+1}:a]adelay=${Math.round(c.at*1000)}|${Math.round(c.at*1000)},volume=${c.vol}[s${i}]`).join(';');
          const mixIn = cues.map((_,i)=>`[s${i}]`).join('') + `[0:a]`;
          const n = cues.length + 1;
          const filter = `[0:a]anull[base];${chains};${mixIn}amix=inputs=${n}:duration=longest:dropout_transition=0,alimiter=limit=0.95[aout]`;
          fs.writeFileSync('build/mix.sh', `#!/bin/sh\nset -e\nffmpeg -v error -y -i public/narration.wav ${inputs} -filter_complex "${filter}" -map "[aout]" -c:a pcm_s16le public/mix.wav\n`);
          NODE
          sh build/mix.sh
          ffprobe -v error -show_entries format=duration -of default=nw=1 public/mix.wav
      - run: |
          set -e
          npm install --no-audit --no-fund
      - run: |
          set -e
          npx remotion still src/index.ts Reel out/test.png --frame=30 --gl=swangle --concurrency=1 --log=info
          ls -l out/test.png
      - run: |
          set -e
          FRAMES=$(node -e "const fs=require('fs');const m=fs.readFileSync('src/blocks.generated.ts','utf8');const b=JSON.parse(m.match(/BLOCKS:\s*Block\[\]\s*=\s*(\[[\s\S]*?\]);/)[1]);const d=b[b.length-1].end;console.log(Math.ceil((d+0.6)*30))")
          echo "FRAMES=$FRAMES"
          CHR=$(ls /opt/pw-browsers/chromium-*/chrome-linux64/chrome 2>/dev/null | head -1)
          mkdir -p chunks
          s=0; i=0
          while [ $s -lt $FRAMES ]; do
            e=$((s+50)); [ $e -ge $FRAMES ] && e=$((FRAMES-1))
            f=chunks/c_$(printf %03d $i).mp4
            if [ ! -f $f ]; then
              npx remotion render src/index.ts Reel chunks/tmp_$i.mp4 --frames=$s-$e --muted \
                ${CHR:+--browser-executable=$CHR} --gl=swangle --concurrency=1 \
                --codec=h264 --crf=17 --log=info > chunks/log_$i.txt 2>&1 \
                && mv chunks/tmp_$i.mp4 $f || { echo GAGAL; cat chunks/log_$i.txt; exit 1; }
            fi
            i=$((i+1)); s=$((e+1))
          done
          ls chunks/c_*.mp4 | sort | sed "s#chunks/##; s/^/file '/; s/$/'/" > chunks/list.txt
          ffmpeg -v error -y -f concat -safe 0 -i chunks/list.txt -c copy out/video_silent.mp4
      - run: |
          set -e
          ffmpeg -v error -y -i out/video_silent.mp4 -i public/mix.wav \
            -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest "out/$IN_NAME.mp4"
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of default=nw=1 "out/$IN_NAME.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: reel-3d-srt
          path: |
            out/${{ env.IN_NAME }}.mp4
            out/test.png
          retention-days: 7
