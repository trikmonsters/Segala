# Render Reel Cartoon 3D (Remotion + three.js) -> GitHub Release (tanpa artifact)
# Simpan sebagai .github/workflows/render.yml. Seluruh kode proyek ditulis apa adanya (teks biasa) pada langkah "Write project files".
name: Render Reel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = video penuh | preview = contact sheet framing saja'
        type: choice
        default: full
        options: [full, preview]
      lang:
        description: 'Kode bahasa video (default en). Contoh: en, id, ja, ar, hi, th, ko, zh'
        type: string
        default: en
      audio_url:
        description: 'URL LANGSUNG ke audio narasi (mp3/wav/m4a). Kosong = pakai audio/ di repo'
        type: string
        default: ''
      script:
        description: 'Naskah persis narasi (satu baris). Kosong = script_url atau script.txt di repo'
        type: string
        default: ''
      script_url:
        description: 'URL langsung ke file teks naskah (opsional)'
        type: string
        default: ''
      shots_url:
        description: 'URL langsung (raw) ke shots.tsx (opsional; overlay/src/shots.tsx di repo lebih diutamakan)'
        type: string
        default: ''
      use_asr:
        description: 'Transkripsi otomatis untuk memperhalus waktu caption (HANYA bahasa Inggris)'
        type: boolean
        default: false
      sample_audio:
        description: 'DEMO: buat audio contoh dengan suara TTS (hanya bila tidak ada audio lain)'
        type: boolean
        default: false
      video_name:
        description: 'Nama berkas keluaran (tanpa .mp4)'
        type: string
        default: reel
      release_tag:
        description: 'Tag Release. Kosong = video-<nomor-run> (preview-<nomor-run> untuk mode preview)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: render-reel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      IN_MODE: ${{ inputs.mode }}
      IN_LANG: ${{ inputs.lang }}
      IN_AUDIO_URL: ${{ inputs.audio_url }}
      IN_SCRIPT: ${{ inputs.script }}
      IN_SCRIPT_URL: ${{ inputs.script_url }}
      IN_SHOTS_URL: ${{ inputs.shots_url }}
      IN_ASR: ${{ inputs.use_asr }}
      IN_SAMPLE: ${{ inputs.sample_audio }}
      IN_NAME: ${{ inputs.video_name }}
      IN_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout (membaca audio/, script.txt, overlay/ milik Anda)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: System dependencies (ffmpeg, Pillow)
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg python3-pip fonts-liberation
          python3 -m pip install --break-system-packages --quiet pillow

      - name: Write project files (config and example)
        run: |
          set -euo pipefail
          mkdir -p _reel/example
          cat > _reel/example/narration_en.txt <<'EOF_FILE'
          In Japan, quitting your job can feel impossible. Your boss smiles, and you freeze. You stand at his door, letter in hand, and cannot knock. One night, you find an app. We resign for you. The next morning, a stranger in sunglasses walks in. The whole office stares. He slides your letter across the desk, and your boss panics. You? Feet up. Free. But his phone never stops ringing. Door after door after door. The money rolls in. Yet in a tall building at night, one man sits alone, tired but calm. Then he fixes his tie, and knocks again.
          EOF_FILE
          mkdir -p _reel
          cat > _reel/package.json <<'EOF_FILE'
          {
           "name": "reel-cartoon-3d",
           "version": "1.0.0",
           "private": true,
           "dependencies": {
            "@react-three/drei": "9.122.0",
            "@react-three/fiber": "8.18.0",
            "@remotion/bundler": "4.0.545",
            "@remotion/cli": "4.0.545",
            "@remotion/renderer": "4.0.545",
            "@remotion/three": "4.0.545",
            "@types/react": "18.3.3",
            "@types/three": "0.169.0",
            "react": "18.3.1",
            "react-dom": "18.3.1",
            "remotion": "4.0.545",
            "three": "0.169.0",
            "typescript": "5.5.4",
            "@fontsource/montserrat": "5.3.0",
            "@fontsource/oswald": "5.3.0",
            "@fontsource/inter": "5.3.0",
            "@fontsource/caveat": "5.3.0"
           },
           "overrides": {
            "webpack": "5.83.1"
           }
          }
          EOF_FILE
          mkdir -p _reel
          cat > _reel/tsconfig.json <<'EOF_FILE'
          {"compilerOptions":{"target":"ES2020","module":"ESNext","moduleResolution":"bundler","jsx":"react-jsx","strict":false,"skipLibCheck":true,"esModuleInterop":true,"types":["react"]}}
          EOF_FILE

      - name: Write project files (scripts)
        run: |
          set -euo pipefail
          mkdir -p _reel/scripts
          cat > _reel/scripts/align.mjs <<'EOF_FILE'
          #!/usr/bin/env node
          // Audio (+ naskah) -> src/captions.json  { lang, duration, source, words:[{w,s,e}] }
          // pemakaian: node scripts/align.mjs --audio public/narration.wav --lang en [--script naskah.txt] [--asr build/asr.json] [--out src/captions.json]
          // Mode: (1) naskah saja  -> waktu dari energi suara (semua bahasa)   (2) ASR saja -> kata dari ASR   (3) naskah + ASR -> teks naskah, waktu dari ASR
          import {spawnSync} from 'child_process'; import fs from 'fs';
          const arg = (k, d) => { const i = process.argv.indexOf('--' + k); return i > 0 ? process.argv[i + 1] : d; };
          const audio = arg('audio'), out = arg('out', 'src/captions.json'), lang = arg('lang', 'en'), scriptF = arg('script'), asrF = arg('asr');
          const die = m => { console.error('ERROR:', m); process.exit(1); };
          if (!audio || !fs.existsSync(audio)) die('--audio tidak ditemukan');
          if (!scriptF && !asrF) die('butuh --script (naskah) atau --asr (hasil transkripsi). Tanpa keduanya kata tidak diketahui.');
          // ---------- 1. decode audio ----------
          const r = spawnSync('ffmpeg', ['-v', 'error', '-i', audio, '-ac', '1', '-ar', '16000', '-f', 's16le', '-'], {maxBuffer: 1 << 30}); if (r.status !== 0) die('ffmpeg gagal: ' + r.stderr);
          const buf = Buffer.from(r.stdout); const pcm = new Int16Array(buf.buffer.slice(buf.byteOffset, buf.byteOffset + buf.length - (buf.length % 2)));
          const duration = pcm.length / 16000, FR = 160, nF = Math.floor(pcm.length / FR);
          const db = new Float32Array(nF); for (let i = 0; i < nF; i++) { let s = 0; for (let k = 0; k < FR; k++) { const v = pcm[i * FR + k] / 32768; s += v * v; } db[i] = 20 * Math.log10(Math.sqrt(s / FR) + 1e-9); }
          const sorted = [...db].sort((a, b) => a - b), pct = p => sorted[Math.min(nF - 1, Math.floor(p * nF))];
          const noise = pct(.1), peak = pct(.95), thr = noise + (peak - noise) * .28;
          let sp = Array.from(db, v => v > thr);
          const fillGaps = (maxLen) => { let i = 0; while (i < nF) { if (!sp[i]) { let j = i; while (j < nF && !sp[j]) j++; if (i > 0 && j < nF && j - i < maxLen) for (let k = i; k < j; k++) sp[k] = true; i = j; } else i++; } };
          fillGaps(12);
          { let i = 0; while (i < nF) { if (sp[i]) { let j = i; while (j < nF && sp[j]) j++; if (j - i < 6) for (let k = i; k < j; k++) sp[k] = false; i = j; } else i++; } }
          const spans = []; { let i = 0; while (i < nF) { if (sp[i]) { let j = i; while (j < nF && sp[j]) j++; spans.push({s: i / 100, e: j / 100}); i = j; } else i++; } }
          if (!spans.length) die('tidak ada suara terdeteksi di audio');
          const gaps = []; for (let i = 0; i < spans.length - 1; i++) if (spans[i + 1].s - spans[i].e >= .2) gaps.push({s: spans[i].e, e: spans[i + 1].s});
          // ---------- 2. kata ----------
          const PREFIX = /^[“‘"'(\[{«¿¡「『（$€£¥₹₩#@]+$/;
          function tokenize(text) {
            const seg = new Intl.Segmenter(lang, {granularity: 'word'}), words = []; let prefix = '', prevSpace = true;
            for (const {segment, isWordLike} of seg.segment(text.replace(/\s+/g, ' ').trim())) {
              if (isWordLike) { words.push(prefix + segment); prefix = ''; prevSpace = false; continue; }
              const t = segment.trim(); if (!t) { prevSpace = true; continue; }
              if (PREFIX.test(t) && (prevSpace || !words.length || prefix)) { prefix += t; prevSpace = false; continue; }
              if (words.length) words[words.length - 1] += t; else prefix += t; prevSpace = false;
            }
            return words;
          }
          const strip = w => w.replace(/[^\p{L}\p{N}]/gu, '');
          const CJK = /[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af\u0e00-\u0e7f]/g;
          function weight(w) { const c = strip(w); if (!c) return .3; const cj = (c.match(CJK) || []).length; if (cj > c.length / 2) return cj * 1.0 + .3; const v = (c.toLowerCase().match(/[aeiouyáéíóúàèìòùâêîôûäëïöüãõåæœаеёиоуыэюя]+/g) || []).length; return Math.max(1, v) + c.length * .12 + .3; }
          const strong = w => /[.!?。！？…]["'”’)\]」』）]*$/.test(w);
          // ---------- 3. pemetaan berbobot ke sumbu-bicara ----------
          const clipSpans = (a, b) => spans.map(x => ({s: Math.max(x.s, a), e: Math.min(x.e, b)})).filter(x => x.e - x.s > .02);
          const len = sp => sp.reduce((a, x) => a + x.e - x.s, 0);
          const toTime = (sp, x, side) => { let acc = 0; for (const q of sp) { const l = q.e - q.s; if (side === 'R' ? x < acc + l : x <= acc + l) return q.s + Math.max(0, x - acc); acc += l; } return sp[sp.length - 1].e; };
          function mapGroup(ws, a, b) { let sp = clipSpans(a, b); if (!sp.length) sp = [{s: a, e: Math.max(b, a + .2)}]; const W = ws.map(weight), tot = W.reduce((x, y) => x + y, 0), L = len(sp); let c = 0; return ws.map((w, i) => { const s = toTime(sp, c / tot * L, 'R'); c += W[i]; const e = toTime(sp, c / tot * L, 'L'); return {w, s, e: Math.max(e, s + .08)}; }); }
          function alignScript(words) {
            const W = words.map(weight), cum = [0]; W.forEach(x => cum.push(cum[cum.length - 1] + x)); const tot = cum[W.length];
            const groups = []; let g0 = 0, T0 = spans[0].s, used = -1; const tol = Math.max(.8, duration * .08); let anchors = 0;
            for (let k = 0; k < words.length - 1; k++) { if (!strong(words[k])) continue;
              const sp = clipSpans(T0, spans[spans.length - 1].e), L = len(sp), f = (cum[k + 1] - cum[g0]) / (tot - cum[g0]), tp = toTime(sp, f * L, 'L');
              let best = -1, bd = 1e9; gaps.forEach((g, gi) => { if (gi <= used || g.s < T0 + .15) return; const d = Math.abs((g.s + g.e) / 2 - tp); if (d < bd && d < tol) { bd = d; best = gi; } });
              if (best >= 0) { groups.push({ws: words.slice(g0, k + 1), a: T0, b: gaps[best].s}); T0 = gaps[best].e; g0 = k + 1; used = best; anchors++; } }
            groups.push({ws: words.slice(g0), a: T0, b: spans[spans.length - 1].e });
            console.log(`penyelarasan energi: ${words.length} kata, ${spans.length} segmen suara, ${gaps.length} jeda, ${anchors} jangkar kalimat`);
            return groups.flatMap(g => mapGroup(g.ws, g.a, g.b));
          }
          // ---------- 4. ASR ----------
          function lev(a, b) { const m = a.length, n = b.length; const d = Array.from({length: m + 1}, (_, i) => [i, ...Array(n).fill(0)]); for (let j = 0; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; }
          function hybrid(sw, asr) {
            const A = asr.map(x => strip(x.w).toLowerCase()), S = sw.map(x => strip(x).toLowerCase()), m = S.length, n = A.length;
            const sc = Array.from({length: m + 1}, () => Array(n + 1).fill(0)), tb = Array.from({length: m + 1}, () => Array(n + 1).fill(0));
            for (let i = 1; i <= m; i++) { sc[i][0] = -i; tb[i][0] = 1; } for (let j = 1; j <= n; j++) { sc[0][j] = -j; tb[0][j] = 2; }
            const sim = (a, b) => a === b ? 2 : (a && b && lev(a, b) <= Math.max(1, Math.floor(Math.max(a.length, b.length) / 3))) ? 1 : -1;
            for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) { const d = sc[i - 1][j - 1] + sim(S[i - 1], A[j - 1]), u = sc[i - 1][j] - 1, l = sc[i][j - 1] - 1; if (d >= u && d >= l) { sc[i][j] = d; tb[i][j] = 0; } else if (u >= l) { sc[i][j] = u; tb[i][j] = 1; } else { sc[i][j] = l; tb[i][j] = 2; } }
            const match = Array(m).fill(-1); let i = m, j = n; while (i > 0 || j > 0) { const t = tb[i][j]; if (i > 0 && j > 0 && t === 0) { if (sim(S[i - 1], A[j - 1]) > 0) match[i - 1] = j - 1; i--; j--; } else if (i > 0 && (t === 1 || j === 0)) i--; else j--; }
            const res = sw.map((w, k) => match[k] >= 0 ? {w, s: asr[match[k]].s, e: asr[match[k]].e} : {w, s: NaN, e: NaN});
            let k = 0; while (k < res.length) { if (!Number.isNaN(res[k].s)) { k++; continue; } let q = k; while (q < res.length && Number.isNaN(res[q].s)) q++; const a = k > 0 ? res[k - 1].e : spans[0].s, b = q < res.length ? res[q].s : spans[spans.length - 1].e; const part = mapGroup(sw.slice(k, q), a, Math.max(b, a + .1)); for (let z = k; z < q; z++) res[z] = part[z - k]; k = q; }
            console.log(`hibrid: ${match.filter(x => x >= 0).length}/${m} kata naskah cocok dengan ASR`); return res;
          }
          let words, source;
          const asr = asrF ? JSON.parse(fs.readFileSync(asrF, 'utf8')) : null;
          if (scriptF) { const sw = tokenize(fs.readFileSync(scriptF, 'utf8')); if (!sw.length) die('naskah kosong'); words = asr && asr.length ? hybrid(sw, asr) : alignScript(sw); source = asr && asr.length ? 'script+asr' : 'script+energy'; }
          else { words = asr.map(x => ({...x})); source = 'asr'; let startSent = true; words.forEach((x, i) => { let w = x.w.toLowerCase(); if (startSent) w = w.charAt(0).toUpperCase() + w.slice(1); if (w === 'i') w = 'I'; const gap = i + 1 < words.length ? words[i + 1].s - x.e : 9; startSent = gap > .5 || i + 1 === words.length; if (startSent && !/[.!?]$/.test(w)) w += '.'; x.w = w; }); }
          // rapikan: monoton, durasi minimum
          for (let i = 0; i < words.length; i++) { if (i && words[i].s < words[i - 1].s) words[i].s = words[i - 1].s; if (words[i].e < words[i].s + .08) words[i].e = words[i].s + .08; if (i + 1 < words.length && words[i].e > words[i + 1].s + .02) words[i].e = Math.max(words[i].s + .05, words[i + 1].s); }
          const round = x => Math.round(x * 1000) / 1000;
          fs.writeFileSync(out, JSON.stringify({lang, duration: round(duration), source, speech: {noiseDb: round(noise), peakDb: round(peak)}, words: words.map(x => ({w: x.w, s: round(x.s), e: round(x.e)}))}, null, 1));
          console.log(`OK -> ${out} | bahasa=${lang} | durasi=${duration.toFixed(2)}s | kata=${words.length} | sumber=${source}`);
          EOF_FILE
          mkdir -p _reel/scripts
          cat > _reel/scripts/asr_sherpa.py <<'EOF_FILE'
          #!/usr/bin/env python3
          """ASR bahasa Inggris dengan timestamp per kata (sherpa-onnx, model dari GitHub Releases; Hugging Face tidak diperlukan).
          pemakaian: python3 scripts/asr_sherpa.py audio.wav build/asr.json
          Hanya untuk bahasa Inggris. Bahasa lain: berikan naskah (--script) ke prepare.sh."""
          import sys, os, json, subprocess, tarfile, urllib.request, tempfile
          audio, out = sys.argv[1], sys.argv[2]
          cache = os.path.expanduser('~/.cache/reel-cartoon-3d'); os.makedirs(cache, exist_ok=True)
          name = 'sherpa-onnx-zipformer-gigaspeech-2023-12-12'; mdir = os.path.join(cache, name)
          if not os.path.isdir(mdir):
              url = f'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/{name}.tar.bz2'; tgz = os.path.join(cache, name + '.tar.bz2')
              print('mengunduh model ASR (±300MB, sekali saja)...'); urllib.request.urlretrieve(url, tgz)
              with tarfile.open(tgz) as t: t.extractall(cache)
              os.remove(tgz)
          import numpy as np, sherpa_onnx
          wav = tempfile.mktemp(suffix='.wav'); subprocess.run(['ffmpeg', '-v', 'error', '-y', '-i', audio, '-ac', '1', '-ar', '16000', wav], check=True)
          import wave
          with wave.open(wav) as w: sr = w.getframerate(); x = np.frombuffer(w.readframes(w.getnframes()), dtype=np.int16).astype(np.float32) / 32768
          m = mdir + '/'
          rec = sherpa_onnx.OfflineRecognizer.from_transducer(encoder=m + 'encoder-epoch-30-avg-1.int8.onnx', decoder=m + 'decoder-epoch-30-avg-1.int8.onnx', joiner=m + 'joiner-epoch-30-avg-1.int8.onnx', tokens=m + 'tokens.txt', num_threads=2, decoding_method='greedy_search')
          CH = 30 * sr; words = []
          for off in range(0, len(x), CH):  # potongan 30 dtk agar memori aman
              st = rec.create_stream(); st.accept_waveform(sr, x[off:off + CH]); rec.decode_stream(st); r = st.result; t0 = off / sr; cur = None
              for tok, ts in zip(r.tokens, r.timestamps):
                  if tok.startswith(' ') or cur is None:
                      if cur: words.append(cur)
                      cur = {'w': tok.strip(), 's': t0 + ts, 'e': t0 + ts + .15}
                  else: cur['w'] += tok; cur['e'] = t0 + ts + .15
              if cur: words.append(cur)
          for i in range(len(words) - 1): words[i]['e'] = min(words[i]['e'], words[i + 1]['s'])
          json.dump(words, open(out, 'w'), ensure_ascii=False, indent=1); print('ASR:', len(words), 'kata ->', out)
          EOF_FILE
          mkdir -p _reel/scripts
          cat > _reel/scripts/make_sample_audio.py <<'EOF_FILE'
          #!/usr/bin/env python3
          """Membuat audio narasi CONTOH (suara TTS lokal, tanpa akun/API) dari sebuah file teks.
          pemakaian: python3 scripts/make_sample_audio.py example/narration_en.txt public/narration.wav [kecepatan=1.0]
          Butuh: pip install sherpa-onnx soundfile numpy. Model VITS-LJS (±100MB) diunduh dari GitHub Releases sekali saja ke ~/.cache/reel-cartoon-3d.
          Hanya Inggris. Untuk video sungguhan, pakai rekaman/narasi Anda sendiri (lihat SKILL.md)."""
          import sys, os, tarfile, urllib.request
          import numpy as np, soundfile as sf, sherpa_onnx
          txt, out = sys.argv[1], sys.argv[2]; speed = float(sys.argv[3]) if len(sys.argv) > 3 else 1.0
          cache = os.path.expanduser('~/.cache/reel-cartoon-3d'); os.makedirs(cache, exist_ok=True); d = os.path.join(cache, 'vits-ljs')
          if not os.path.isdir(d):
              tgz = os.path.join(cache, 'vits-ljs.tar.bz2'); print('mengunduh model TTS...'); urllib.request.urlretrieve('https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-ljs.tar.bz2', tgz)
              with tarfile.open(tgz) as t: t.extractall(cache)
          d += '/'
          cfg = sherpa_onnx.OfflineTtsConfig(model=sherpa_onnx.OfflineTtsModelConfig(vits=sherpa_onnx.OfflineTtsVitsModelConfig(model=d + 'vits-ljs.onnx', lexicon=d + 'lexicon.txt', tokens=d + 'tokens.txt'), num_threads=2))
          tts = sherpa_onnx.OfflineTts(cfg); text = open(txt, encoding='utf8').read().strip()
          a = tts.generate(text, sid=0, speed=speed); s = np.array(a.samples, dtype=np.float32)
          os.makedirs(os.path.dirname(out) or '.', exist_ok=True); sf.write(out, s, a.sample_rate); print('OK', out, round(len(s) / a.sample_rate, 2), 'detik')
          EOF_FILE
          mkdir -p _reel/scripts
          cat > _reel/scripts/prepare.sh <<'EOF_FILE'
          #!/bin/sh
          # Menyiapkan audio + caption.   pemakaian:  scripts/prepare.sh AUDIO [--script naskah.txt] [--lang en] [--asr]
          # Jalankan dari folder proyek (yang berisi package.json). Hasil: public/narration.wav, src/captions.json, src/fonts.generated.ts
          AUDIO="$1"; shift; LANG_CODE=en; SCRIPT=""; ASR=0
          while [ $# -gt 0 ]; do case "$1" in --script) SCRIPT="$2"; shift 2;; --lang) LANG_CODE="$2"; shift 2;; --asr) ASR=1; shift;; *) echo "argumen tak dikenal: $1"; exit 1;; esac; done
          [ -f "$AUDIO" ] || { echo "ERROR: file audio tidak ada: $AUDIO"; exit 1; }
          [ -z "$SCRIPT" ] && [ $ASR -eq 0 ] && { echo "ERROR: butuh --script naskah ATAU --asr (khusus Inggris)"; exit 1; }
          mkdir -p public build
          ffmpeg -v error -y -i "$AUDIO" -vn -ac 2 -ar 48000 -c:a pcm_s16le public/narration.wav || exit 1
          ASRARG=""
          if [ $ASR -eq 1 ]; then python3 scripts/asr_sherpa.py public/narration.wav build/asr.json && ASRARG="--asr build/asr.json" || echo "PERINGATAN: ASR gagal"; fi
          [ -z "$SCRIPT" ] && [ -z "$ASRARG" ] && { echo "ERROR: ASR gagal dan tidak ada naskah"; exit 1; }
          SARG=""; [ -n "$SCRIPT" ] && SARG="--script $SCRIPT"
          node scripts/align.mjs --audio public/narration.wav --lang "$LANG_CODE" $SARG $ASRARG --out src/captions.json || exit 1
          node scripts/setup-fonts.mjs "$LANG_CODE" || exit 1
          EOF_FILE
          mkdir -p _reel/scripts
          cat > _reel/scripts/preview.mjs <<'EOF_FILE'
          import {bundle} from '@remotion/bundler';
          import {renderStill, selectComposition, openBrowser} from '@remotion/renderer';
          import fs from 'fs';
          const CHR=process.env.CHROME||undefined;
