# ==========================================================================================
#  Render Reel Cartoon 3D (Remotion + three.js) -> GitHub Release  (TANPA AUDIO / TANPA ASR)
#  Satu file ini berisi seluruh mesin (arsip base64 di langkah "Unpack engine").
#
#  CARA PAKAI
#   1. Simpan sebagai  .github/workflows/render.yml
#   2. (opsional) taruh storyboard di repo:  overlay/src/shots.tsx
#   3. Actions -> "Render Reel" -> Run workflow. Hasil: Releases -> tag video-<nomor-run>.
#
#  CATATAN
#   - Video dihasilkan BISU (tanpa narasi, tanpa caption, tanpa transkrip).
#   - Tidak ada dependensi audio (audio_url / script / use_asr / sample_audio dihapus).
#   - ffmpeg tetap dipasang karena dipakai engine untuk encode MP4.
#   - upload-artifact TIDAK dipakai; izin contents:write untuk membuat Release.
# ==========================================================================================
name: Render Reel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = video penuh | preview = contact sheet framing saja'
        type: choice
        default: full
        options: [full, preview]
      lang:
        description: 'Kode bahasa video (default en). Contoh: en, id, ja, ar, hi, th, ko, zh'
        type: string
        default: en
      shots_url:
        description: 'URL langsung (raw) ke shots.tsx (opsional; overlay/src/shots.tsx di repo lebih diutamakan)'
        type: string
        default: ''
      video_name:
        description: 'Nama berkas keluaran (tanpa .mp4)'
        type: string
        default: reel
      release_tag:
        description: 'Tag Release. Kosong = video-<nomor-run> (preview-<nomor-run> untuk mode preview)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: render-reel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      IN_MODE: ${{ inputs.mode }}
      IN_LANG: ${{ inputs.lang }}
      IN_SHOTS_URL: ${{ inputs.shots_url }}
      IN_NAME: ${{ inputs.video_name }}
      IN_TAG: ${{ inputs.release_tag }}
      # Penanda untuk engine: render tanpa audio & tanpa caption
      REEL_NO_AUDIO: "1"
      REEL_NO_CAPTIONS: "1"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout (membaca overlay/ milik Anda)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: System dependencies (ffmpeg, Pillow)
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg python3-pip fonts-liberation
          python3 -m pip install --break-system-packages --quiet pillow

