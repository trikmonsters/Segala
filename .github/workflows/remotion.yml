          import React, { useLayoutEffect, useRef } from 'react';
          import { AbsoluteFill, useCurrentFrame, useVideoConfig } from 'remotion';
          import { drawGrain, drawVignette, mixHex } from './kit';

          export type Colors = { primary: string; secondary: string; accent: string; bg: string };

          export type DrawState = {
            w: number;
            h: number;
            cx: number;
            cy: number;
            u: number;          // unit scale ≈ min(w,h)/1000
            phase: number;      // 0..1, posisi loop (satu-satunya sumber waktu)
            seconds: number;    // durasi loop dalam detik
            portrait: boolean;
            ratio: '16:9' | '9:16';
            colors: Colors;
          };

          export type DrawFn = (ctx: CanvasRenderingContext2D, s: DrawState) => void;

          // finish: 'full' = backdrop + vignette + grain | 'clean' = hanya warna latar polos (hitam / chroma green)
          export const CanvasScene: React.FC<{ draw: DrawFn; colors: Colors; finish?: 'full' | 'clean' }> = ({ draw, colors, finish = 'full' }) => {
            const ref = useRef<HTMLCanvasElement>(null);
            const frame = useCurrentFrame();
            const { width, height, fps, durationInFrames } = useVideoConfig();

            useLayoutEffect(() => {
              const canvas = ref.current;
              if (!canvas) return;
              const ctx = canvas.getContext('2d');
              if (!ctx) return;

              ctx.setTransform(1, 0, 0, 1, 0, 0);
              ctx.globalAlpha = 1;
              ctx.globalCompositeOperation = 'source-over';
              ctx.fillStyle = colors.bg;
              ctx.fillRect(0, 0, width, height);

              if (finish === 'full') {
                const g = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height) * 0.7);
                g.addColorStop(0, mixHex(colors.bg, colors.primary, 0.1));
                g.addColorStop(1, colors.bg);
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, width, height);
              }

              const aspect = width / height;

              const ratio: '16:9' | '9:16' = aspect >= 1 ? '16:9' : '9:16';

              const s: DrawState = {
                w: width,
                h: height,
                cx: width / 2,
                cy: height / 2,
                u: Math.min(width, height) / 1000,
                phase: frame / durationInFrames,
                seconds: durationInFrames / fps,
                portrait: height > width,
              ratio,
                colors,
              };

              ctx.save();
              draw(ctx, s);
              ctx.restore();

              if (finish === 'full') {
                drawVignette(ctx, width, height, colors.bg, 0.55);
                drawGrain(ctx, width, height, frame, 0.02);
              }
            }, [frame, width, height, fps, durationInFrames, colors, draw, finish]);

            return (
              <AbsoluteFill style={{ background: colors.bg }}>
                <canvas ref={ref} width={width} height={height} style={{ width: '100%', height: '100%' }} />
              </AbsoluteFill>
            );
          };
