name: Render Neural Genesis Stock Video

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag'
        required: true
        default: 'v1.0.0'
      primaryColor:
        description: 'Primary color (hex)'
        required: false
        default: '#6366f1'
      secondaryColor:
        description: 'Secondary color (hex)'
        required: false
        default: '#06b6d4'
      bgColor:
        description: 'Background color (hex)'
        required: false
        default: '#020617'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - comp: 'HorizontalStock'
            output: 'neural-genesis-1920x1080.mp4'
          - comp: 'VerticalStock'
            output: 'neural-genesis-1080x1920.mp4'
          - comp: 'SquareStock'
            output: 'neural-genesis-1080x1080.mp4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scaffold Remotion project
        run: |
          mkdir -p remotion-project/src
          cd remotion-project

          cat > package.json <<'EOF'
          {
            "name": "neural-genesis",
            "version": "1.0.0",
            "private": true,
            "scripts": { "start": "remotion studio src/index.ts" },
            "dependencies": {
              "@remotion/cli": "4.0.290",
              "remotion": "4.0.290",
              "react": "18.3.1",
              "react-dom": "18.3.1"
            },
            "devDependencies": {
              "@types/react": "18.3.12",
              "typescript": "5.6.3"
            }
          }
          EOF

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "module": "ESNext",
              "jsx": "react-jsx",
              "strict": true,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "moduleResolution": "bundler",
              "lib": ["DOM", "ES2020"]
            }
          }
          EOF

          cat > src/index.ts <<'EOF'
          import { registerRoot } from 'remotion';
          import { RemotionRoot } from './Root';
          registerRoot(RemotionRoot);
          EOF

          cat > src/Root.tsx <<'EOF'
          import React, { useMemo } from 'react';
          import {
            Composition,
            AbsoluteFill,
            useCurrentFrame,
            useVideoConfig,
            interpolate,
            spring,
            Easing,
          } from 'remotion';

          const colors = {
            primary: process.env.REMOTION_PRIMARY_COLOR || '#6366f1',
            secondary: process.env.REMOTION_SECONDARY_COLOR || '#06b6d4',
            bg: process.env.REMOTION_BG_COLOR || '#020617',
          };

          // Deterministic seeded random
          const seeded = (i: number, seed: number) => {
            const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
            return x - Math.floor(x);
          };

          // === NEURAL NODE GENERATOR ===
          // Mensimulasikan neuron yang tumbuh dan saling terhubung
          interface Neuron {
            x: number; y: number; size: number;
            growthDelay: number; pulseOffset: number;
          }
          interface Synapse {
            from: number; to: number;
            delay: number; strength: number;
          }

          const generateNetwork = (count: number, width: number, height: number) => {
            const neurons: Neuron[] = [];
            const synapses: Synapse[] = [];

            for (let i = 0; i < count; i++) {
              const angle = seeded(i, 1) * Math.PI * 2;
              const radius = Math.sqrt(seeded(i, 2)) * Math.min(width, height) * 0.38;
              const jitterX = (seeded(i, 10) - 0.5) * width * 0.15;
              const jitterY = (seeded(i, 11) - 0.5) * height * 0.15;
              neurons.push({
                x: width / 2 + Math.cos(angle) * radius + jitterX,
                y: height / 2 + Math.sin(angle) * radius * 0.85 + jitterY,
                size: 2 + seeded(i, 3) * 4,
                growthDelay: seeded(i, 4) * 0.6,
                pulseOffset: seeded(i, 5) * Math.PI * 2,
              });
            }

            // Buat sinapsis: hubungkan neuron yang berdekatan
            for (let i = 0; i < neurons.length; i++) {
              for (let j = i + 1; j < neurons.length; j++) {
                const dx = neurons[i].x - neurons[j].x;
                const dy = neurons[i].y - neurons[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxDist = Math.min(width, height) * 0.22;
                if (dist < maxDist && seeded(i * 100 + j, 20) > 0.55) {
                  synapses.push({
                    from: i, to: j,
                    delay: seeded(i * 100 + j, 21) * 0.5,
                    strength: 1 - dist / maxDist,
                  });
                }
              }
            }
            return { neurons, synapses };
          };

          const NeuralScene: React.FC<{ width: number; height: number }> = ({ width, height }) => {
            const frame = useCurrentFrame();
            const { fps, durationInFrames } = useVideoConfig();
            const isVertical = height > width;

            // === TIMELINE (18 detik) ===
            // 0-5s   : neuron muncul satu per satu (growth)
            // 5-8s   : sinapsis terbentuk (connections)
            // 8-15s  : data flow + pulsing (aktivitas)
            // 15-18s : fade out sinematik

            const network = useMemo(() => generateNetwork(90, width, height), [width, height]);

            const globalProgress = interpolate(
              frame,
              [0, fps * 5],
              [0, 1],
              { extrapolateRight: 'clamp', easing: Easing.out(Easing.cubic) }
            );

            const synapseProgress = interpolate(
              frame,
              [fps * 4, fps * 8],
              [0, 1],
              { extrapolateLeft: 'clamp', extrapolateRight: 'clamp', easing: Easing.inOut(Easing.quad) }
            );

            // Data flow: partikel kecil yang bergerak sepanjang sinapsis
            const dataFlowProgress = interpolate(
              frame,
              [fps * 7, fps * 14],
              [0, 1],
              { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' }
            );

            const exitOpacity = interpolate(
              frame,
              [durationInFrames - fps * 2, durationInFrames - fps * 0.3],
              [1, 0],
              { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' }
            );

            // Camera drift halus
            const camX = Math.sin(frame / 100) * width * 0.008;
            const camY = Math.cos(frame / 120) * height * 0.006;
            const camZoom = 1 + Math.sin(frame / 160) * 0.006;

            // Background gradient breathing
            const gradientAngle = interpolate(frame, [0, durationInFrames], [135, 225]);

            return (
              <AbsoluteFill style={{ background: colors.bg, overflow: 'hidden', opacity: exitOpacity }}>
                {/* Layer 1: gradient background */}
                <AbsoluteFill style={{
                  background: `linear-gradient(${gradientAngle}deg, ${colors.bg} 0%, ${colors.bg} 50%, ${colors.primary}12 100%)`,
                }} />

                {/* Layer 2: radial glow di tengah */}
                <AbsoluteFill style={{
                  background: `radial-gradient(circle at 50% 50%, ${colors.primary}10 0%, transparent 65%)`,
                }} />

                {/* Layer 3: SVG Network */}
                <AbsoluteFill style={{
                  transform: `translate(${camX}px, ${camY}px) scale(${camZoom})`,
                }}>
                  <svg width={width} height={height} style={{ position: 'absolute' }}>
                    <defs>
                      <filter id="glow">
                        <feGaussianBlur stdDeviation="4" result="coloredBlur" />
                        <feMerge>
                          <feMergeNode in="coloredBlur" />
                          <feMergeNode in="SourceGraphic" />
                        </feMerge>
                      </filter>
                      <linearGradient id="synapseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stopColor={colors.primary} stopOpacity="0.2" />
                        <stop offset="50%" stopColor={colors.secondary} stopOpacity="0.8" />
                        <stop offset="100%" stopColor={colors.primary} stopOpacity="0.2" />
                      </linearGradient>
                    </defs>

                    {/* Synapses */}
                    {network.synapses.map((s, i) => {
                      const from = network.neurons[s.from];
                      const to = network.neurons[s.to];
                      const localProgress = Math.max(0, Math.min(1, (synapseProgress - s.delay) / (1 - s.delay)));
                      if (localProgress <= 0) return null;
                      const drawProgress = 1 - Math.pow(1 - localProgress, 2);

                      // Data flow: partikel bergerak sepanjang garis
                      const flowT = (dataFlowProgress + s.delay * 0.5) % 1;
                      const flowX = from.x + (to.x - from.x) * flowT;
                      const flowY = from.y + (to.y - from.y) * flowT;
                      const flowOpacity = dataFlowProgress > 0 && dataFlowProgress < 1 ? 0.9 : 0;

                      return (
                        <g key={`s-${i}`}>
                          <line
                            x1={from.x} y1={from.y}
                            x2={from.x + (to.x - from.x) * drawProgress}
                            y2={from.y + (to.y - from.y) * drawProgress}
                            stroke="url(#synapseGrad)"
                            strokeWidth={1.2 * s.strength}
                            opacity={0.6 * localProgress}
                          />
                          {flowOpacity > 0 && (
                            <circle cx={flowX} cy={flowY} r={2.5 * s.strength} fill={colors.secondary} opacity={flowOpacity} filter="url(#glow)" />
                          )}
                        </g>
                      );
                    })}

                    {/* Neurons */}
                    {network.neurons.map((n, i) => {
                      const localProgress = Math.max(0, Math.min(1, (globalProgress - n.growthDelay) / (1 - n.growthDelay)));
                      if (localProgress <= 0) return null;
                      const scale = 1 - Math.pow(1 - localProgress, 3);
                      const pulse = 0.7 + Math.sin(frame / 18 + n.pulseOffset) * 0.3;
                      const size = n.size * scale * pulse;

                      return (
                        <g key={`n-${i}`}>
                          {/* Outer glow */}
                          <circle cx={n.x} cy={n.y} r={size * 4} fill={colors.primary} opacity={0.08 * localProgress} />
                          {/* Core */}
                          <circle cx={n.x} cy={n.y} r={size} fill={i % 3 === 0 ? colors.secondary : colors.primary} opacity={0.9 * localProgress} filter="url(#glow)" />
                          {/* Inner bright dot */}
                          <circle cx={n.x} cy={n.y} r={size * 0.4} fill="#ffffff" opacity={0.8 * localProgress} />
                        </g>
                      );
                    })}
                  </svg>
                </AbsoluteFill>

                {/* Layer 4: vignette */}
                <AbsoluteFill style={{
                  background: `radial-gradient(ellipse at center, transparent 50%, ${colors.bg} 110%)`,
                  mixBlendMode: 'multiply',
                  pointerEvents: 'none',
                }} />
              </AbsoluteFill>
            );
          };

          export const RemotionRoot: React.FC = () => {
            return (
              <>
                <Composition id="HorizontalStock" component={NeuralScene} durationInFrames={540} fps={30} width={1920} height={1080} defaultProps={{ width: 1920, height: 1080 }} />
                <Composition id="VerticalStock" component={NeuralScene} durationInFrames={540} fps={30} width={1080} height={1920} defaultProps={{ width: 1080, height: 1920 }} />
                <Composition id="SquareStock" component={NeuralScene} durationInFrames={540} fps={30} width={1080} height={1080} defaultProps={{ width: 1080, height: 1080 }} />
              </>
            );
          };
          EOF

      - name: Install dependencies
        working-directory: remotion-project
        run: npm install

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Render ${{ matrix.comp }}
        working-directory: remotion-project
        env:
          REMOTION_PRIMARY_COLOR: ${{ inputs.primaryColor }}
          REMOTION_SECONDARY_COLOR: ${{ inputs.secondaryColor }}
          REMOTION_BG_COLOR: ${{ inputs.bgColor }}
        run: |
          npx remotion render ${{ matrix.comp }} out/${{ matrix.output }} \
            --codec=h264 \
            --concurrency=2 \
            --jpeg-quality=95 \
            --crf=16

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "Neural Genesis ${{ inputs.version }}"
          files: remotion-project/out/${{ matrix.output }}
          draft: false
          prerelease: false
          generate_release_notes: true
