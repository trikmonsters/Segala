              "lineWeight": "outline weight if any, e.g. none or 3 units", "motionLanguage": "tempo, easing, signature motion", "durationSeconds": 12
            },
            "subjects": [ exactly ${COUNT} x {
              "subject": "specific noun concept", "buyerSearchPhrase": "exact phrase a buyer would type", "useCase": "who uses it and for what",
              "metaphorTwist": "the fresh angle", "wowBeat": "the memorable ANIMATED moment, mechanism named", "iconHints": ["1-2 icon names"],
              "id": "lowercase-kebab-case-max-50", "title": "short internal title",
              "stockTitle": "Adobe Stock title, 15-35 words, max 190 chars", "description": "1-2 commercial sentences",
              "keywords": ["30-49 terms, MOST important first; first 10 = strongest buyer terms; include illustration, animation, motion graphics, 4K, loop, concept; no brand names"],
              "demand": { "score": 1-10, "evidence": "..." }, "saturation": { "score": 1-10, "evidence": "..." },
              "visualSpec": {
                "composition": "layout of hero and supporting elements, composed natively for the chosen ratio",
                "storyboard": ["0.0-3.0 s: ... (easing, principle)", "3.0-7.0 s: ...", "7.0-12.0 s: ... returns to the starting pose"],
                "animationPrinciples": ["anticipation", "stagger", "..."],
                "colorRoles": "which palette colour fills what"
