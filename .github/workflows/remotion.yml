           5. SHAPES MUST READ: primary vs background contrast ≥ 4.5:1, secondary and accent ≥ 3.5:1. Light backgrounds → deep saturated fills;
              dark backgrounds → bright fills. Outlines (if any) are a darker shade of their fill.
