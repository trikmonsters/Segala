            "color-field": { bg: null, finish: "full",
              rule: "A rich, deep but not black colour field as background (e.g. deep teal, indigo, plum) with light/bright filled illustration elements on top; soft shadows allowed (the harness adds a subtle backdrop, vignette and fine grain)." },
            "dark-gradient": { bg: null, finish: "full",
