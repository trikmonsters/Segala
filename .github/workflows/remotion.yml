          const ICON_NAMES = ["folder", "document", "cross", "cloud", "shield", "lock", "heart", "ecg", "phone", "magnifier",
            "gear", "chart", "database", "check", "user", "envelope", "globe", "chip", "bolt"];

          // ── Hemat & jaga limit API ──
          const RPM = Number(process.env.GEMINI_RPM) || 6;                 // batas request per menit PER MODEL
          const MAX_CALLS = Number(process.env.GEMINI_MAX_CALLS) || 30;    // anggaran total request per run
