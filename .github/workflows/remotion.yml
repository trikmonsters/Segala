            { name: "isometric illustration: a hero object built from shaded isometric blocks and filled icons on a floating tile, soft shadows, satisfying build/stack motion (kit: isoBox, filledIcon)", background: "light-soft" },
            { name: "paper-cut layered illustration: stacked filled shapes with soft drop shadows creating real depth, gentle parallax between layers", background: "light-soft" },
            { name: "bold duotone gradient illustration: big geometric filled shapes and a circular backdrop on a rich colour field, explainer-video look", background: "color-field" },
            { name: "glassmorphism illustration: frosted translucent filled cards with gradient tints floating over soft colour blobs, each card carrying a filled icon", background: "color-field" },
            { name: "premium dark-mode illustration: filled gradient shapes with soft inner light and thin rim highlights on a deep background, subtle ambient glow behind the hero", background: "dark-gradient" },
            { name: "matte 3D-look isolated object on chroma-key green: shaded isometric facets in solid fills, gentle bounce/turn, no glow, no shadow on the green", background: "chroma-green" },
          ];

