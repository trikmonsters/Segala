          }

          const KIT_DOC = `── from '../lib/kit' ──
          TAU, clamp(v,a,b), lerp(a,b,t), smoothstep(a,b,x), easeInOut(t), easeOutCubic(t), easeOutBack(t), easeOutElastic(t)
          seg(phase,a,b)        // 0 before a, 1 after b — stage beats inside a cycle
          cycle(phase,k=1)      // 0..1 repeating k times per loop (k integer => seamless)
          stagger(p,i,n,spread=0.5) // local progress of element i of n when p runs 0..1 (cascade / domino)
          breathe(phase,k=1)    // 0..1..0, k whole cycles per loop
          mulberry32(seed)      // seeded random 0..1
          noise(x,y,z=0,w=0), loopNoise(x,y,phase,r=1), fbm(x,y,phase,oct=4,r=1), curl(x,y,phase,oct=3,r=1)   // loopNoise/fbm/curl loop perfectly
          hexToRgb(hex), rgba(hex,alpha), mixHex(a,b,t), shade(hex,t)   // shade: t<0 darker, t>0 lighter
          luminance(hex), contrast(a,b) // WCAG contrast ratio 1..21
          ensureContrast(fg,bg,min=3.5) // nudges fg until it reads against bg — use on ANY colour you derive
          getBuffer(key,w,h)    // cached offscreen canvas {canvas, ctx}; not cleared automatically
          ── from '../lib/shapes' ──
          type Pt=[number,number]; type Poly={pts:Pt[]; closed?:boolean}
          Constructors (unit coords, y down, roughly -1..1): polyP(pts,closed?), lineP(x1,y1,x2,y2), arcP(cx,cy,r,a0,a1), ellipseP(cx,cy,rx,ry),
            ellipseArcP(cx,cy,rx,ry,a0,a1), circleP(cx,cy,r), rectP(x,y,w,h), roundRectP(x,y,w,h,r), bezierP(p0,p1,p2,p3): Pt[]
          ICONS[name]() -> Poly[] (outline geometry)   names: ${ICON_NAMES.join(", ")}
          place(polys,cx,cy,scale,rot=0): Poly[]     // unit coords -> pixels (scale = half-size in px)
          FILLED ILLUSTRATION:
            iconPalette(s.colors): IconPalette {main, light, dark, accent, second, line}
            filledIcon(ctx,name,cx,cy,scale,palette,lw?)   // ready-made colourful flat-gradient icon (all ICONS names)
            linGrad(ctx,x0,y0,x1,y1,c0,c1): CanvasGradient
            fillPoly(ctx,poly) / fillPolys(ctx,polys,fill) / fillEvenOdd(ctx,polys,fill)   // set ctx.fillStyle first for fillPoly; fill = colour or gradient
            roundCard(ctx,x,y,w,h,r,fill,shadowPx=0,shadowAlpha=0.14)   // rounded card with layered soft shadow
            shadowEllipse(ctx,cx,cy,rx,ry,alpha=0.2,color)   // soft contact shadow (NOT on chroma-key backgrounds)
            morphPolys(A: Poly[], B: Poly[], t): Poly[]      // shape tween between two icons (t 0..1)
          LINES & EFFECTS: strokePoly(ctx,poly,t0=0,t1=1), pathPoly(ctx,poly,t0,t1), neon(ctx,polys,color,width,t0,t1,intensity), glowDot(ctx,x,y,r,color,alpha)
          polyLen(poly), samplePoly(poly,n,inclusive=false): Pt[]
          ISOMETRIC: isoPt(x,y,z,cx,cy,s): Pt  |  isoBox(ctx,x,y,z,w,d,h,color,cx,cy,s)   // shaded 3-face box; draw back-to-front (ascending x+y+z)`;

          const EXAMPLE = `import { TAU, breathe, mixHex } from '../lib/kit';
          import { filledIcon, iconPalette, shadowEllipse } from '../lib/shapes';
          import type { DrawFn } from '../lib/CanvasScene';

          // EXAMPLE ONLY — structure, API use and loop discipline. Do NOT copy its look, composition or motion.
          export const draw: DrawFn = (ctx, s) => {
            const { cx, cy, u, phase, colors, w, h } = s;
            const m = Math.min(w, h);
            const pal = iconPalette(colors);
            const bob = Math.sin(phase * TAU) * 9 * u;                       // integer cycle => seamless

            ctx.fillStyle = mixHex(colors.bg, colors.secondary, 0.25);        // soft backdrop disc
            ctx.beginPath(); ctx.arc(cx, cy, m * 0.36, 0, TAU); ctx.fill();

            shadowEllipse(ctx, cx, cy + m * 0.27, m * 0.15, m * 0.02, 0.18);  // contact shadow
            filledIcon(ctx, 'folder', cx, cy + bob, m * 0.22, pal);           // filled hero icon

            const k = 1 + 0.1 * breathe(phase, 2);                            // badge pulses twice per loop
            ctx.fillStyle = colors.accent;
            ctx.beginPath(); ctx.arc(cx + m * 0.2, cy - m * 0.17, m * 0.035 * k, 0, TAU); ctx.fill();
          };`;

          const MOTION_TOOLBOX = `Creative animation toolbox (use the principles that serve THIS asset; a loop must end in its starting pose):
           - Anticipation → action → settle: pull back a little (negative offset), then easeOutBack / easeOutElastic, then rest.
           - Stagger / cascade: stagger(p, i, n, 0.5) so parts activate one after another (domino, chain reaction).
           - Meaningful morph: morphPolys(ICONS.a(), ICONS.b(), easeInOut(breathe(phase,1))) — one idea transforms into the next.
           - Follow-through & overlap: child parts lag the parent (phase offsets) and keep moving after the parent stops.
           - Arcs, not straight lines: move along orbits / curves; vary tempo (fast action, slow settle, brief holds).
           - Secondary action: small supporting motion (satellites, sparkles, rings) timed to the main beat — never competing with it.
           - Inside a cycle: const p = cycle(phase, 1); seg(p, a, b) stages beats; use easings per beat.`;

          // Bagian statis di AWAL, spesifik-aset di AKHIR → awalan sama antar aset memungkinkan implicit caching (lebih murah)
          function codePrompt(plan, idea, prevCode, feedback) {
            const B = BACKGROUNDS[plan.style.background];
            const f = plan.format;
            const seriesCtx = {
              canvas: `${f.ratio} = ${f.width}x${f.height}`, look: plan.style.look, outlineWeight: plan.style.lineWeight,
              motionLanguage: plan.style.motionLanguage, background: plan.style.background, backgroundRule: B.rule,
              palette: { primary: plan.style.primaryColor, secondary: plan.style.secondaryColor, accent: plan.style.accentColor, bg: plan.style.bgColor },
              colorHarmony: plan.style.harmony, colorMeaning: plan.style.colorMeaning, topic: plan.topic,
            };
            const safe = f.ratio === "9:16"
              ? "Keep key content inside the central safe area (avoid the top ~12% and bottom ~20%: platform UI overlays) and stack elements vertically."
              : "Keep ~6% title-safe margins; use the horizontal space deliberately.";
            const asset = {
              subject: idea.subject, title: idea.title, iconsAvailable: idea.iconHints, wowBeat: idea.concept,
              visualSpec: idea.visualSpec,
            };
            const repair = prevCode ? `
          ═══ YOUR PREVIOUS VERSION NEEDS CHANGES ═══
          ${feedback}

          Previous code:
          ${FENCE}ts
          ${prevCode}
          ${FENCE}
          Fix every point and return the COMPLETE corrected file.
          ` : "";
            return `You are an elite motion designer and creative coder writing ONE Canvas 2D draw function for a premium 4K stock-video
          ANIMATED ILLUSTRATION with rich colour fills (professional vector-illustration look). Remotion renders it frame by frame.
          This code IS the product: creative, beautiful, precise and technically flawless.

          ═══ FILE CONTRACT ═══
          Return ONE TypeScript file in a single ${FENCE}ts block and nothing else. It must:
           1. import ONLY from '../lib/kit', '../lib/shapes' and (type only) from '../lib/CanvasScene';
           2. export const draw: DrawFn = (ctx, s) => { ... };
          The harness paints the background colour (and, for non-clean backgrounds, a soft backdrop, vignette and grain). Never fill the whole
          frame yourself.

          State s: s.w, s.h (EXACTLY the canvas below), s.cx, s.cy, s.u (unit scale ≈ min(w,h)/1000 — multiply EVERY pixel size by it),
          s.phase (0..1 loop position — the ONLY time source), s.seconds, s.portrait, s.ratio, s.colors {primary, secondary, accent, bg}.

          KIT:
          ${KIT_DOC}

          ${MOTION_TOOLBOX}

          ═══ SERIES CONTEXT (identical for every asset of this series) ═══
          ${JSON.stringify(seriesCtx, null, 2)}

          ═══ NON-NEGOTIABLE RULES ═══
          1. COMPOSE NATIVELY for ${f.ratio} (${f.width}x${f.height}) — the only format that will exist. ${safe}
             The subject must be IMMEDIATELY recognisable at thumbnail size: one clear hero, centred, about 35–55% of min(w,h). Use filledIcon /
             ICONS where they fit, combine several, or build custom filled shapes with the constructors. Never let effects hide the subject.
             No text, letters, numbers, people, faces or logos.
          2. Obey the background rule exactly: ${B.rule}
          3. ILLUSTRATION QUALITY (professional flat/gradient vector look, FILLED shapes — not thin outlines):
             - Build the hero from filled shapes: base fill + a darker shade on the shadow side + a lighter tint on the highlight side
               (shade()/mixHex()), consistent light from the top-left; subtle gradient fills via linGrad; outlines only where they help
               (a darker shade of the fill, width >= 2.5*u).
             - Add depth and richness without clutter: a large soft backdrop shape (disc/blob) behind the hero, a soft contact shadow
               (shadowEllipse / roundCard shadow — never on chroma-key), a few small satellites (dots, plus signs, rings, leaves).
             - Palette roles: primary = hero fills (~30%), secondary = supporting fills, accent = ONE focal highlight (~10%), background ≈ 60%.
               Do NOT invent new hues: tints/shades only. Run ensureContrast(color, s.colors.bg, 3.5) on every derived colour used for strokes,
               small details or text-like marks. Every shape must read clearly against what is behind it; avoid saturated complementary fills touching.
          4. ANIMATION IS THE STAR: stage the WOW BEAT as a precise, creative, satisfying piece of animation (toolbox: anticipation, overshoot,
             stagger, morph, follow-through, arcs, secondary action). Vary tempo; include a brief hold so the eye rests. Never just pulse or
             rotate everything uniformly. One surprising idea executed perfectly beats many effects.
          5. Deterministic: no Math.random, Date, performance, window, document, fetch, timers. Create const rnd = mulberry32(CONSTANT) INSIDE draw().
          6. SEAMLESS LOOP. Every moving quantity must return to its start value at phase = 1 (sin/cos(TAU*phase*k) with INTEGER k, breathe(phase,k),
             cycle(), loopNoise/fbm/curl, circular motion). Frame 0 must already show a complete, recognisable subject. Build-up effects are allowed
             only if the piece un-builds to exactly its starting pose. No one-way drift or growth.
          7. Performance budget ≈ 10 s per 4K frame on a CPU: <= 400k path segments, <= 8000 particles, no per-pixel loops at full resolution,
             avoid shadowBlur.
          8. Complete, runnable code. No placeholders, no TODOs. It must work the first time.

          ═══ STRUCTURE EXAMPLE ═══
          ${FENCE}ts
          ${EXAMPLE}
          ${FENCE}

          ═══ THE ASSET TO BUILD (this call) ═══
          ${JSON.stringify(asset, null, 2)}
          ${repair}`;
          }

          // SATU panggilan menilai SEMUA aset sekaligus (hemat request)
          function critiqueBatchPrompt(items, plan) {
            const list = items.map((v, i) => `${i + 1}. id=${v.id} | ${v.subject} — ${v.concept}`).join("\n");
            return `You are a strict, experienced art director reviewing a series of animated illustrations for Adobe Stock before they ship.
          For each asset you get 3 frames of the SAME animation (start, middle, end of a ${plan.format.ratio} loop). Compare them to judge motion too:
          identical frames mean weak or no animation.

          SERIES LOOK: ${plan.style.look}
          BACKGROUND: ${plan.style.background}
          PALETTE: primary ${plan.style.primaryColor}, secondary ${plan.style.secondaryColor}, accent ${plan.style.accentColor}, bg ${plan.style.bgColor} (${plan.style.harmony || "harmony not specified"})

          ASSETS (images follow in this order, 3 per asset):
          ${list}

          Score each asset 1-10 on (be demanding; 7 = shippable, 9 = exceptional):
           legibility (recognisable in 1 s at thumbnail size, centred, well sized, composed for the ratio), shapeVisibility (fills/lines read clearly
           against the background and each other), colorHarmony (harmonious, meaningful, no clashing), composition (balance, margins, hierarchy,
           no clutter), polish (professional illustration finish, consistent shading), motion (real creative animation visible across the frames).

          Output ONLY valid JSON:
          { "assets": [ { "id": "...", "scores": { "legibility": 0, "shapeVisibility": 0, "colorHarmony": 0, "composition": 0, "polish": 0, "motion": 0 },
             "overall": 0, "issues": ["concrete problems"], "fixes": ["concrete, code-level fixes (colours, sizes, positions, motion changes)"] } ] }
          "overall" = the LOWEST score of that asset.`;
          }

          // ═══════════════════════════════════════════════════════════
          // PEMANGGILAN GEMINI — rate limiter per model, anggaran request, model "mati" tidak dicoba ulang
          // ═══════════════════════════════════════════════════════════
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          class Soft extends Error {}
          const callLog = new Map();         // model -> timestamp request dalam 60 detik terakhir
          const lastCall = new Map();
          const deadModels = new Set();
          const usage = { total: 0, byModel: {}, waitedMs: 0, retries429: 0 };
          let budgetWarned = false;

          async function throttle(model) {
            const log = callLog.get(model) || [];
            callLog.set(model, log);
            for (;;) {
              const now = Date.now();
              while (log.length && now - log[0] >= 60000) log.shift();
              const gap = now - (lastCall.get(model) || 0);
              let wait = 0;
              if (log.length >= RPM) wait = 60000 - (now - log[0]) + 300;
              else if (gap < MIN_GAP_MS) wait = MIN_GAP_MS - gap;
              if (wait <= 0) { log.push(now); lastCall.set(model, now); return; }
              if (wait > 2000) console.log(`[RATE] ${model}: batas ${RPM} RPM, menunggu ${(wait / 1000).toFixed(0)}s`);
              usage.waitedMs += wait;
              await sleep(wait);
            }
          }
          const retryAfterMs = msg => {
            const m = String(msg).match(/retry(?:Delay)?\D{0,15}(\d+(?:\.\d+)?)\s*s/i);
            return (m ? parseFloat(m[1]) : 30) * 1000 + 1000;
          };

          // prompt boleh string atau array "parts" (teks + gambar)
          async function callModel({ prompt, parse, json = false, search = false, label, softRetries = 1 }) {
            if (!ai) return null;
            const contents = typeof prompt === "string" ? prompt : [{ role: "user", parts: prompt }];
            for (const model of MODELS) {
              if (deadModels.has(model)) continue;
              let soft = 0, transient = 0;
              for (;;) {
                if (usage.total >= MAX_CALLS) {
                  if (!budgetWarned) { console.warn(`[BUDGET] anggaran ${MAX_CALLS} request/run habis — sisa pekerjaan memakai fallback`); budgetWarned = true; }
                  return null;
                }
                await throttle(model);
                usage.total++; usage.byModel[model] = (usage.byModel[model] || 0) + 1;
                try {
                  console.log(`[API ${usage.total}/${MAX_CALLS}] ${label} — ${model}`);
                  const config = { temperature: 1.0, topP: 0.95 };
                  if (search) config.tools = [{ googleSearch: {} }];
                  else if (json) config.responseMimeType = "application/json";
                  const res = await ai.models.generateContent({ model, contents, config });
                  try { return parse(res.text || ""); } catch (pe) { throw new Soft(pe.message); }
                } catch (e) {
                  const msg = String(e?.message || e);
                  console.warn(`[FAILED] ${label} ${model}: ${msg.slice(0, 260)}`);
                  if (e instanceof Soft) { if (++soft <= softRetries) continue; break; }
                  if (/404|NOT_FOUND|not found|401|403|API key|PERMISSION_DENIED/i.test(msg)) { deadModels.add(model); break; }
                  if (/429|RESOURCE_EXHAUSTED|quota/i.test(msg)) {
                    usage.retries429++;
                    if (/PerDay|per day|daily/i.test(msg)) { deadModels.add(model); break; }
                    const wait = retryAfterMs(msg);
                    if (++transient <= 2 && wait <= 120000) { console.log(`[RATE] 429 — tunggu ${(wait / 1000).toFixed(0)}s`); usage.waitedMs += wait; await sleep(wait); continue; }
                    break;
                  }
                  if (/\b5\d\d\b|UNAVAILABLE|DEADLINE|timeout|fetch failed/i.test(msg)) { if (++transient <= 1) { await sleep(4000); continue; } break; }
                  break;
                }
              }
            }
            return null;
          }

          function usageSummary() {
            const lines = [`Request Gemini: ${usage.total}/${MAX_CALLS} (batas ${RPM} RPM per model)`,
              ...Object.entries(usage.byModel).map(([m, n]) => `  - ${m}: ${n}`),
              `Menunggu rate limit: ${(usage.waitedMs / 1000).toFixed(0)}s | 429: ${usage.retries429} | model dinonaktifkan: ${[...deadModels].join(", ") || "-"}`];
            console.log("[USAGE] " + lines.join("\n"));
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Gemini usage\n```\n" + lines.join("\n") + "\n```\n");
          }

          // ═══════════════════════════════════════════════════════════
          // HELPERS & PARSING
          // ═══════════════════════════════════════════════════════════
          const sanitizeId = s => String(s || "").toLowerCase()
            .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50);
          function uniqueId(base, seen) {
            let id = base, n = 2;
            while (seen.has(id)) id = `${base}-${n++}`;
            return id;
          }
          const stripFence = t => String(t).trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();
          const cleanIcons = a => (Array.isArray(a) ? a : []).map(x => String(x).toLowerCase().trim()).filter(x => ICON_NAMES.includes(x)).slice(0, 2);

          function parseSeries(raw, styleAssign) {
            const d = JSON.parse(stripFence(raw));
            if (!Array.isArray(d.subjects) || d.subjects.length < COUNT) throw new Error(`need ${COUNT} subjects`);
            d.subjects = d.subjects.slice(0, COUNT);
            if (!d.topic || typeof d.topic !== "string") throw new Error("missing topic");

            const fm = d.format || {};
            let ratio = String(fm.aspectRatio || "").replace(/\s/g, "");
            if (!RATIOS[ratio]) { console.warn(`[WARN] rasio "${fm.aspectRatio}" tidak valid → 16:9`); ratio = "16:9"; }
            d.format = { ratio, ...RATIOS[ratio], reasoning: String(fm.reasoning || "default landscape"),
              platforms: Array.isArray(fm.platforms) ? fm.platforms : [], targetAudience: String(fm.targetAudience || "") };

            const st = d.style || {};
            for (const k of ["primaryColor", "secondaryColor"]) if (!HEX.test(st[k] || "")) throw new Error(`invalid style.${k}`);
            const B = BACKGROUNDS[styleAssign.background];
            const bg0 = B.bg || st.bgColor;
            if (!HEX.test(bg0 || "")) throw new Error("invalid style.bgColor");
            const pal = fixPalette({ ...st, bgColor: bg0 }, styleAssign.background);
            if (pal.notes.length) console.log(`[PALETTE] ${pal.notes.join("; ")}`);
            d.style = {
              ...st, ...pal, background: styleAssign.background, finish: B.finish, assigned: styleAssign.name,
              durationSeconds: Math.min(15, Math.max(8, Math.round(Number(st.durationSeconds) || 12))),
            };

            const seen = new Set();
            for (const s of d.subjects) {
              for (const k of ["subject", "buyerSearchPhrase", "wowBeat"])
                if (!s[k] || typeof s[k] !== "string") throw new Error(`subject missing ${k}`);
              const key = s.subject.toLowerCase().trim();
              if (seen.has(key)) throw new Error("duplicate subject");
              seen.add(key);
            }
            d.seriesName = d.seriesName || d.topic;
            return d;
          }

          const GENERIC_KW = ["illustration", "animation", "motion graphics", "4K", "loop", "concept", "icon", "symbol", "technology", "business",
            "digital", "modern", "explainer", "presentation", "app", "video", "graphic", "element", "flat design", "vector style", "colorful"];

          function composeKeywords(kws, bgMode, ratio) {
            const extra = [...(BG_KEYWORDS[bgMode] || [])];
            if (ratio === "9:16") extra.push("vertical video", "9:16");
            const base = [...new Set((kws || []).map(k => String(k).toLowerCase().trim()).filter(Boolean))];
            let merged = [...new Set([...base.slice(0, 5), ...extra, ...base.slice(5)])];
            if (merged.length < 25) merged = [...new Set([...merged, ...GENERIC_KW.map(k => k.toLowerCase())])];
            return merged.slice(0, 49);
          }

          function baseComposition(plan) {
            const s = plan.style;
            return { primaryColor: s.primaryColor, secondaryColor: s.secondaryColor, accentColor: s.accentColor, bgColor: s.bgColor, durationSeconds: s.durationSeconds };
          }

          // Membangun objek aset dari subjek rencana — LENIEN (tanpa panggilan API tambahan, tanpa reroll)
          function buildIdea(plan, subj, siblings) {
            const seen = new Set([...previousIds, ...siblings.map(s => s.id)]);
            const id = uniqueId(sanitizeId(subj.id || subj.title || subj.subject) || `asset-${RUN}`, seen);
            const fmtNote = plan.format.ratio === "9:16" ? " Vertical video." : "";
            const demand = Number(subj.demand?.score);
            if (Number.isFinite(demand) && demand < 6) console.warn(`[NOTE] ${id}: demand estimasi rendah (${demand})`);
            return {
              id,
              title: String(subj.title || subj.subject).slice(0, 60),
              stockTitle: String(subj.stockTitle || `${subj.subject} flat illustration animation, ${plan.topic} concept.${fmtNote} 4K video motion graphic, seamless loop.`).slice(0, 200),
              description: String(subj.description || `${subj.subject} animated illustration for ${subj.useCase || plan.topic}.`),
              subject: subj.subject,
              concept: subj.wowBeat,
              keywords: composeKeywords([subj.buyerSearchPhrase, ...(subj.keywords || [])], plan.style.background, plan.format.ratio),
              iconHints: cleanIcons(subj.iconHints),
              visualSpec: subj.visualSpec || { composition: "hero centred", storyboard: [], wowBeat: subj.wowBeat },
              demand: subj.demand, saturation: subj.saturation,
              composition: baseComposition(plan), format: plan.format, finish: plan.style.finish, background: plan.style.background,
              creative: { topic: plan.topic, style: plan.style.assigned, motion: plan.style.motionDna, series: plan.seriesName },
            };
          }

          // ── Pemeriksaan statis kode AI ──
          const BANNED = [
            [/\bMath\.random\b/, "Math.random"],
            [/\bDate\b/, "Date"],
            [/\bperformance\b/, "performance"],
            [/\bwindow\b/, "window"],
            [/\bdocument\b/, "document (use getBuffer from the kit)"],
            [/\bglobalThis\b/, "globalThis"],
            [/\bfetch\s*\(/, "fetch"],
            [/\b(XMLHttpRequest|WebSocket|localStorage|sessionStorage)\b/, "network/storage API"],
            [/\beval\s*\(|\bnew\s+Function\b|\bFunction\s*\(/, "eval/Function"],
            [/\brequire\s*\(|\bimport\s*\(/, "dynamic import/require"],
            [/\bprocess\s*\./, "process"],
            [/\b(setTimeout|setInterval|requestAnimationFrame)\b/, "timers"],
          ];

          function staticCheck(code) {
            if (code.length < 400) return "code too short";
            if (code.length > 30000) return "code too long";
            if (!/export\s+const\s+draw\b/.test(code)) return "must contain: export const draw: DrawFn = (ctx, s) => { ... }";
            if (/^\s*import\s+['"]/m.test(code)) return "side-effect imports are not allowed";
            const imports = [...code.matchAll(/^\s*import\s+[^;]*?from\s+['"]([^'"]+)['"]/gm)].map(m => m[1]);
            const bad = imports.filter(p => !ALLOWED_IMPORTS.includes(p));
            if (bad.length) return `imports not allowed: ${bad.join(", ")}`;
            const bare = code.replace(/\/\*[\s\S]*?\*\//g, "").replace(/(^|[^:])\/\/.*$/gm, "$1");
            for (const [re, name] of BANNED) if (re.test(bare)) return `forbidden API used: ${name}`;
            return null;
          }

          function parseCode(raw) {
            const m = String(raw).match(/```(?:ts|typescript|tsx|js)?\s*\n([\s\S]*?)```/);
            const code = (m ? m[1] : String(raw)).trim();
            const err = staticCheck(code);
            if (err) throw new Error(err);
            return code;
          }

          function parseCritiqueBatch(raw) {
            const d = JSON.parse(stripFence(raw));
            if (!Array.isArray(d.assets)) throw new Error("missing assets");
            const out = new Map();
            for (const a of d.assets) {
              const vals = Object.values(a.scores || {}).map(Number).filter(v => v >= 0 && v <= 10);
              const overall = Number(a.overall) > 0 ? Number(a.overall) : (vals.length ? Math.min(...vals) : NaN);
              if (a.id && Number.isFinite(overall))
                out.set(String(a.id), { overall, scores: a.scores || {}, issues: Array.isArray(a.issues) ? a.issues : [], fixes: Array.isArray(a.fixes) ? a.fixes : [] });
            }
            if (!out.size) throw new Error("no scores");
            return out;
          }

          // ── Validasi runtime (child process tanpa API key) ──
          function runtimeValidate(idea, stillsDir) {
            const c = idea.composition, f = idea.format;
            const colors = { primary: c.primaryColor, secondary: c.secondaryColor, accent: c.accentColor, bg: c.bgColor };
            const frames = Math.round(c.durationSeconds * 30);
            fs.rmSync(stillsDir, { recursive: true, force: true });
            const env = { ...process.env };
            delete env.GEMINI_API_KEY;
            const r = spawnSync("node", ["validate.mjs", idea.id, JSON.stringify(colors), String(frames), idea.finish, String(f.width), String(f.height), stillsDir], {
              cwd: RP, env, encoding: "utf8", timeout: 10 * 60 * 1000,
            });
            if (r.status === 0) {
              console.log(`[VALIDATE OK] ${idea.id} ${(r.stdout || "").trim().slice(-120)}`);
              return null;
            }
            return ((r.stderr || "") + (r.stdout || "")).trim().slice(-1800) || "unknown validation error";
          }

          // Generate kode + validasi teknis (1 percobaan + 1 perbaikan bila error)
          async function buildCode(idea, plan) {
            const file = `${CUSTOM_DIR}/${idea.id}.ts`;
            const stillsDir = path.join(STILLS_ROOT, idea.id);
            let prevCode = "", feedback = "";
            for (let attempt = 1; attempt <= CODE_ATTEMPTS; attempt++) {
              const code = await callModel({ prompt: codePrompt(plan, idea, prevCode, feedback), label: `code ${idea.id} #${attempt}`, parse: parseCode });
              if (!code) break;
              fs.writeFileSync(file, code);
              const err = runtimeValidate(idea, stillsDir);
              if (!err) return true;
              console.warn(`[CODE FAIL] ${idea.id} #${attempt}: ${err.slice(0, 500)}`);
              prevCode = code;
              feedback = `The code failed technical validation:\n${err}`;
            }
            fs.rmSync(file, { force: true });
            return false;
          }

          // Art Director: SATU panggilan untuk semua aset (3 still per aset)
          async function critiqueAll(items, plan) {
            const parts = [{ text: critiqueBatchPrompt(items, plan) }];
            for (const v of items) {
              const dir = path.join(STILLS_ROOT, v.id);
              if (!fs.existsSync(dir)) continue;
              const files = fs.readdirSync(dir).filter(f => f.endsWith(".jpg")).sort();
              parts.push({ text: `Frames of asset id=${v.id}: start, middle, end` });
              for (const f of files) parts.push({ inlineData: { mimeType: "image/jpeg", data: fs.readFileSync(path.join(dir, f)).toString("base64") } });
            }
            if (parts.length < 3) return null;
            return callModel({ prompt: parts, json: true, label: "art-director (batch)", softRetries: 0, parse: parseCritiqueBatch });
          }

          async function reviseAsset(idea, plan, r) {
            const file = `${CUSTOM_DIR}/${idea.id}.ts`;
            const old = fs.readFileSync(file, "utf8");
            const feedback = `An art director reviewed rendered frames and scored it ${r.overall}/10.\nISSUES:\n- ${r.issues.join("\n- ")}\nREQUIRED FIXES:\n- ${r.fixes.join("\n- ")}`;
            const code = await callModel({ prompt: codePrompt(plan, idea, old, feedback), label: `revise ${idea.id}`, parse: parseCode });
            if (!code) return;
            fs.writeFileSync(file, code);
            const err = runtimeValidate(idea, path.join(STILLS_ROOT, idea.id));
            if (err) { console.warn(`[REVISE FAIL] ${idea.id} → versi lama dipertahankan`); fs.writeFileSync(file, old); }
            else console.log(`[REVISED] ${idea.id}`);
          }

          // ── Mode template (ilustrasi bawaan, tetap memakai palet & latar series) ──
          function toTemplate(v) {
            v.codeMode = "template";
            const fmt = v.format?.ratio === "9:16" ? " Vertical video." : "";
            v.stockTitle = `${v.subject} flat vector illustration animation. ${v.creative?.topic || "Business"} concept icon.${fmt} 4K video motion graphic, seamless loop.`.slice(0, 200);
            return v;
          }

          // ── Rencana statis bila AI sama sekali tidak tersedia ──
          function staticPlan() {
            const mk = (subject, phrase, icons, use) => ({ subject, buyerSearchPhrase: phrase, useCase: use, metaphorTwist: "", wowBeat: "hero floats while satellites orbit", iconHints: icons });
            const pal = fixPalette({ primaryColor: "#2563eb", secondaryColor: "#14b8a6", accentColor: "#f59e0b", bgColor: "#e8f3fb" }, "light-soft");
            return {
              seriesName: `illustration-series-${RUN}`, topic: "cloud computing & cybersecurity",
              format: { ratio: "16:9", ...RATIOS["16:9"], reasoning: "default landscape (no AI decision available)", platforms: [], targetAudience: "" },
              style: { look: "flat vector illustration", harmony: "analogous cool + warm accent", ...pal, background: "light-soft", finish: "full",
                durationSeconds: 12, assigned: STYLES[0].name, motionDna: "floating hero with orbiting satellites" },
              subjects: [
                mk("cloud data storage", "cloud storage illustration", ["cloud", "database"], "cloud computing explainers and SaaS promos"),
                mk("cybersecurity shield", "cyber security shield illustration", ["shield", "check"], "security and privacy videos"),
                mk("medical record folder", "medical record folder illustration", ["folder", "cross"], "healthcare and patient data videos"),
                mk("data analytics chart", "data analytics chart illustration", ["chart", "magnifier"], "business intelligence presentations"),
                mk("telemedicine phone", "telemedicine app illustration", ["phone", "heart"], "online doctor and health app promos"),
              ],
            };
          }

          function writeRegistries(videos) {
            const make = (templateOnly) => {
              const custom = videos.filter(v => v.codeMode === "custom" && !templateOnly);
              const imports = custom.map((v, i) => `import { draw as d${i} } from './custom/${v.id}';`).join("\n");
              const tpl = videos.filter(v => !custom.includes(v));
              const tplDecl = tpl.map((v, i) =>
                `const t${i} = makeIllustrationDraw(${JSON.stringify(v.iconHints && v.iconHints.length ? v.iconHints : ["cloud"])});`).join("\n");
              const colorsOf = v => {
                const c = v.composition;
                return JSON.stringify({ primary: c.primaryColor, secondary: c.secondaryColor, accent: c.accentColor, bg: c.bgColor });
              };
              const entries = videos.map(v => {
                const ci = custom.indexOf(v);
                const draw = ci >= 0 ? `d${ci}` : `t${tpl.indexOf(v)}`;
                return `  '${v.id}': () => <CanvasScene draw={${draw}} colors={${colorsOf(v)}} finish="${v.finish}" />,`;
              }).join("\n");
              return `import React from 'react';\nimport { CanvasScene } from './lib/CanvasScene';\nimport { makeIllustrationDraw } from './lib/fallbackDraw';\n${imports}\n\n${tplDecl}\n\n` +
                `export const CUSTOM: Record<string, React.FC> = {\n${entries}\n};\n`;
            };
            fs.writeFileSync(`${RP}/src/registry.tsx`, make(false));
            fs.writeFileSync(`${RP}/src/registry.safe.tsx`, make(true));
          }

          // ═══════════════════════════════════════════════════════════
          // MAIN — alur hemat: research(1) + plan(1) + code(5) + art-director(1) + revisi(0–n)
          // ═══════════════════════════════════════════════════════════
          async function main() {
            fs.mkdirSync(CUSTOM_DIR, { recursive: true });
            fs.mkdirSync(STILLS_ROOT, { recursive: true });
            const videos = [];
            const style = pickStyle();
            const motion = pickMotion();
            const domains = pickDomains(4);
            console.log(`[PICK] style: ${style.name}\n[PICK] motion: ${motion}\n[PICK] domains: ${domains.join(" | ")}`);
            console.log(`[LIMIT] ${RPM} RPM/model, anggaran ${MAX_CALLS} request/run, model: ${MODELS.join(", ")}`);
            if (CLIENT) console.log("[CLIENT] client-data.json terbaca dan dipakai sebagai data utama");

            let plan = null, aiPlan = false;
            if (!ai) {
              console.warn("[WARN] GEMINI_API_KEY tidak diset — memakai rencana statis.");
            } else {
              const brief = await callModel({
                prompt: researchPrompt(domains), search: true, label: "research", softRetries: 0,
                parse: t => { if (String(t).trim().length < 200) throw new Error("research too short"); return String(t).trim(); },
              });
              console.log(brief ? `[RESEARCH OK] ${brief.length} chars` : "[RESEARCH] tidak tersedia — lanjut tanpa brief");
              plan = await callModel({
                prompt: seriesPrompt(style, motion, domains, brief || ""), json: true, label: "series plan + listings",
                parse: raw => parseSeries(raw, style),
              });
              aiPlan = !!plan;
              if (plan) plan.style.motionDna = motion;
            }
            if (!plan) { console.warn("[FALLBACK] memakai rencana series statis"); plan = staticPlan(); }
            console.log(`[PLAN] topic: ${plan.topic} | format: ${plan.format.ratio} (${plan.format.reasoning.slice(0, 160)})`);

            for (const subj of plan.subjects) {
              const idea = buildIdea(plan, subj, videos);
              if (aiPlan && await buildCode(idea, plan)) idea.codeMode = "custom";
              else { if (aiPlan) console.warn(`[TEMPLATE] ${idea.id} → template ilustrasi bawaan`); toTemplate(idea); }
              console.log(`[ASSET] ${idea.id} → ${idea.codeMode}`);
              videos.push(idea);
            }

            // Art Director (1 panggilan untuk semua) → revisi hanya aset yang skornya rendah
            const custom = videos.filter(v => v.codeMode === "custom");
            if (aiPlan && custom.length) {
              const res = await critiqueAll(custom, plan);
              if (res) {
                for (const v of custom) {
                  const r = res.get(v.id);
                  if (!r) continue;
                  v.artScore = r.overall;
                  console.log(`[ART DIRECTOR] ${v.id}: ${r.overall}/10 ${JSON.stringify(r.scores)}`);
                  if (r.overall < CRITIQUE_MIN) await reviseAsset(v, plan, r);
                }
              } else console.log("[ART DIRECTOR] dilewati");
            }

            writeRegistries(videos);
            fs.writeFileSync(OUTPUT_PATH, JSON.stringify({
              series: { name: plan.seriesName, topic: plan.topic, format: plan.format, style: plan.style }, videos,
            }, null, 2));
            usageSummary();
            console.log(`Selesai: ${videos.map(v => `${v.id}(${v.codeMode})`).join(", ")}`);
          }

          export { staticCheck, parseCode, parseSeries, parseCritiqueBatch, buildIdea, fixPalette, staticPlan, toTemplate };
          if (!process.env.GEN_NO_MAIN) await main();
          GENEOF

      - name: Write Remotion code
        run: |
          cd remotion-project

          cat > src/index.ts <<'EOF'
          import { registerRoot } from 'remotion';
          import { RemotionRoot } from './Root';
          registerRoot(RemotionRoot);
          EOF

          cat > src/Root.tsx <<'EOF'
          import React from 'react';
          import { Composition } from 'remotion';
          import { IDEAS } from './ideas';
          import { CUSTOM } from './registry';

          // Satu rasio per aset (ditentukan AI per series): id = <id>-<key>-4k
          export const RemotionRoot: React.FC = () => (
            <>
              {IDEAS.filter((idea: any) => CUSTOM[idea.id]).map((idea: any) => (
                <Composition
                  key={idea.id}
                  id={`${idea.id}-${idea.key}-4k`}
                  component={CUSTOM[idea.id]}
                  durationInFrames={Math.round(idea.duration * 30)}
                  fps={30}
                  width={idea.width}
                  height={idea.height}
                />
              ))}
            </>
          );
          EOF

      # SECRET hanya tersedia di step ini; kode AI divalidasi di child process TANPA API key
      - name: Generate series + AI code (research → plan → metadata → code → validate)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd generator
          node gen.mjs

      - name: Generate ideas.ts
        run: |
          cd remotion-project
          cat > gen-ideas.mjs <<'EOF'
          import fs from "fs";
          const data = JSON.parse(fs.readFileSync("video-ideas.json","utf8"));
          const ideas = data.videos.map(v => ({
            id: v.id,
            duration: v.composition.durationSeconds || 12,
            key: v.format.key,
            width: v.format.width,
            height: v.format.height,
          }));
          fs.writeFileSync("src/ideas.ts",
            "export const IDEAS = " + JSON.stringify(ideas, null, 2) + ";\n");
          EOF
          node gen-ideas.mjs

      # Safety net: bila project gagal dimuat karena kode custom, kosongkan registry → pakai engine bawaan
      - name: Verify project compiles (safety net)
        run: |
          cd remotion-project
          if ! npx remotion compositions src/index.ts; then
            echo "::warning::Registry bermasalah — fallback ke template ilustrasi bawaan untuk semua aset"
            cp src/registry.safe.tsx src/registry.tsx
            npx remotion compositions src/index.ts
          fi

      - name: Build composition list
        id: comps
        run: |
          cd remotion-project
          node -e "
            const d = require('./video-ideas.json');
            const list = [];
            d.videos.forEach(v => {
              list.push(v.id + '-' + v.format.key + '-4k');
            });
            if (list.length === 0) { console.error('Daftar komposisi kosong'); process.exit(1); }
            require('fs').writeFileSync('comps.json', JSON.stringify(list));
          "
          echo "list=$(cat comps.json)" >> $GITHUB_OUTPUT

      # node_modules TIDAK ikut (artifact tidak menyimpan permission +x). Install bersih di job render.
      - name: Pack project (tanpa node_modules)
        run: tar --exclude='node_modules' -czf project.tgz remotion-project

      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-project
          path: project.tgz
          retention-days: 1

      - name: Upload ideas metadata
        uses: actions/upload-artifact@v4
        with:
          name: ideas-meta
          path: remotion-project/video-ideas.json
          retention-days: 1

  # ══════════════════════════════════════════════════════════
  # JOB 2 — RENDER PARALEL (max-parallel: 5)
  # ══════════════════════════════════════════════════════════
  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        comp: ${{ fromJSON(needs.prepare.outputs.comps) }}
    steps:
      - name: Download project
        uses: actions/download-artifact@v4
        with:
          name: remotion-project

      - name: Extract project
        run: tar -xzf project.tgz

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: remotion-project/package-lock.json

      - name: Install dependencies
        run: |
          cd remotion-project
          npm ci

      - name: Install system dependencies (Chrome + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libnss3 libdbus-1-3 libatk1.0-0 \
            libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 \
            libcairo2 libcups2

      - name: Render ${{ matrix.comp }}
        run: |
          cd remotion-project
          npx remotion render "${{ matrix.comp }}" "out/${{ matrix.comp }}.mp4" \
            --codec=h264 \
            --concurrency=2 \
            --jpeg-quality=92 \
            --crf=18 \
            --x264-preset=slow \
            --pixel-format=yuv420p

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.comp }}
          path: remotion-project/out/${{ matrix.comp }}.mp4
          retention-days: 1

  # ══════════════════════════════════════════════════════════
  # JOB 3 — RELEASE (tetap jalan walau sebagian render gagal)
  # ══════════════════════════════════════════════════════════
  release:
    needs: [prepare, render]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download all rendered videos
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: video-*
          merge-multiple: true
          path: final-output

      - name: Download ideas metadata
        uses: actions/download-artifact@v4
        with:
          name: ideas-meta
          path: ideas-meta

      - name: Verify output
        run: |
          mkdir -p final-output
          if ! ls final-output/*.mp4 >/dev/null 2>&1; then
            echo "::error::Tidak ada video yang berhasil dirender"
            exit 1
          fi
          ls -lh final-output/
          cp ideas-meta/video-ideas.json final-output/batch-metadata.json

      # CSV metadata siap pakai untuk upload (judul ≤ 200 karakter, keyword ≤ 49)
      - name: Build upload CSV
        run: |
          cat > make-csv.mjs <<'EOF'
          import fs from "fs";
          const ideas = JSON.parse(fs.readFileSync("ideas-meta/video-ideas.json", "utf8")).videos;
          const files = fs.readdirSync("final-output").filter(f => f.endsWith(".mp4")).sort();
          const esc = s => '"' + String(s).replace(/"/g, '""') + '"';
          const rows = ["Filename,Title,Keywords,Category,Releases"];
          for (const f of files) {
            const v = ideas.find(x => f.startsWith(x.id + "-"));
            if (!v) continue;
            const k9 = f.includes("-9x16-");
            const extra = k9 ? ["vertical", "9:16", "portrait"] : ["horizontal", "16:9"];
            const base = (v.keywords || []).slice(0, 49 - extra.length);
            const kws = [...new Set([...base, ...extra])].slice(0, 49);
            const title = ((v.stockTitle || v.title) + (k9 ? ", vertical 9:16" : "")).slice(0, 200);
            rows.push([esc(f), esc(title), esc(kws.join(",")), "", ""].join(","));
          }
          fs.writeFileSync("final-output/adobe-stock-upload.csv", rows.join("\n") + "\n");
          console.log("CSV rows:", rows.length - 1);
          EOF
          node make-csv.mjs

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: batch-${{ github.run_number }}
          name: "Stock 4K Batch ${{ github.run_number }}"
          files: |
            final-output/*.mp4
            final-output/batch-metadata.json
            final-output/adobe-stock-upload.csv
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # History hanya mencatat ide yang videonya benar-benar dirender & dirilis
      - name: Update history
        run: |
          [ -f history.json ] || echo '{"rendered":[],"version":1}' > history.json
          node -e "
            const fs = require('fs');
            const hist = JSON.parse(fs.readFileSync('./history.json','utf8'));
            const ideas = JSON.parse(fs.readFileSync('./ideas-meta/video-ideas.json','utf8'));
            const files = fs.readdirSync('./final-output');
            const done = ideas.videos.filter(v => files.some(f => f.startsWith(v.id + '-')));
            const rendered = done.map(v => ({
              id: v.id,
              concept: v.concept || v.title,
              topic: v.creative && v.creative.topic,
              motion: v.creative && v.creative.motion,
              ratio: v.format && v.format.ratio,
              artScore: v.artScore,
              style: v.creative && v.creative.style,
              subject: v.subject,
              stockTitle: v.stockTitle,
              codeMode: v.codeMode,
              renderedAt: new Date().toISOString(),
              run: process.env.GITHUB_RUN_NUMBER,
            }));
            hist.rendered = hist.rendered.concat(rendered);
            if (hist.rendered.length > 500) hist.rendered = hist.rendered.slice(-500);
            fs.writeFileSync('./history.json', JSON.stringify(hist, null, 2));
            console.log('Ditambahkan', rendered.length, 'ide. Total history:', hist.rendered.length);
          "

      - name: Commit history to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --staged --quiet; then
            echo "No history change"
          else
            git commit -m "chore: update idea history [skip ci]"
            git push
          fi
