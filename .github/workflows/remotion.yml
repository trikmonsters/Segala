          }
          const pickStyle = () => pickFrom(STYLES, "style", s => s.name);
          const pickMotion = () => pickFrom(MOTIONS, "motion");
          function pickDomains(n) {
            if (CLIENT && Array.isArray(CLIENT.domains) && CLIENT.domains.length) return CLIENT.domains.slice(0, Math.max(n, 1));
            const used = recentSet("topic");
            const free = DOMAINS.filter(d => !used.has(d));
            return shuffle(free.length >= n ? free : DOMAINS).slice(0, n);
          }

          // ═══════════════════════════════════════════════════════════
          // WARNA — teori warna + kontras otomatis (bentuk & garis harus selalu terbaca)
          // ═══════════════════════════════════════════════════════════
          const hexToRgb = h => { const n = parseInt(h.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
          const rgbToHex = ([r, g, b]) => "#" + [r, g, b].map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");
          const lum = h => {
            const [r, g, b] = hexToRgb(h).map(v => { const c = v / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
            return 0.2126 * r + 0.7152 * g + 0.0722 * b;
          };
          const contrastR = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
          function rgbToHsl(hex) {
            const [r, g, b] = hexToRgb(hex).map(v => v / 255);
            const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
            let h = 0, s = 0;
            if (d) {
              s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
              if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
              else if (mx === g) h = (b - r) / d + 2;
              else h = (r - g) / d + 4;
              h *= 60;
            }
            return [h, s, l];
          }
          function hslToHex(h, s, l) {
            h = ((h % 360) + 360) % 360;
            const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
            let r = 0, g = 0, b = 0;
            if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
            else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
            return rgbToHex([(r + m) * 255, (g + m) * 255, (b + m) * 255]);
          }
          const hueDiff = (a, b) => { const d = Math.abs(rgbToHsl(a)[0] - rgbToHsl(b)[0]) % 360; return d > 180 ? 360 - d : d; };
          function shiftL(c, dir, step = 0.025) {            // geser kecerahan (hue & saturasi tetap)
            const [h, sat, l] = rgbToHsl(c);
            return hslToHex(h, sat, Math.max(0, Math.min(1, l + dir * step)));
          }
          function ensureC(fg, bg, min) {
            const dir = contrastR("#ffffff", bg) >= contrastR("#000000", bg) ? 1 : -1;
            let c = fg;
            for (let i = 0; i < 60 && contrastR(c, bg) < min; i++) c = shiftL(c, dir);
            return c;
          }
          const offGreen = c => { const [h, s, l] = rgbToHsl(c); return (s > 0.2 && h >= 70 && h <= 200) ? hslToHex(215, Math.max(s, 0.5), l) : c; };

          // Memperbaiki palet dari AI: bg sesuai mode, kontras, tidak mirip, tidak "bertabrakan", aman untuk chroma key
          function fixPalette(st, bgMode) {
            const notes = [];
            let bg = st.bgColor;
            if (bgMode === "dark-gradient") for (let i = 0; i < 40 && lum(bg) > 0.05; i++) bg = shiftL(bg, -1);
            if (bgMode === "light-soft") for (let i = 0; i < 40 && lum(bg) < 0.6; i++) bg = shiftL(bg, 1);
            if (bgMode === "color-field") for (let i = 0; i < 40 && lum(bg) > 0.3; i++) bg = shiftL(bg, -1);

            let p = st.primaryColor, s = st.secondaryColor;
            let a = HEX.test(st.accentColor || "") ? st.accentColor : (() => { const [h, sat, l] = rgbToHsl(s); return hslToHex(h + 35, Math.min(sat, 0.75), Math.min(0.7, l + 0.1)); })();
            if (bgMode === "chroma-green") { p = offGreen(p); s = offGreen(s); a = offGreen(a); }

            const [hs, ss, ls] = rgbToHsl(s);
            if (hueDiff(p, s) < 20 && Math.abs(lum(p) - lum(s)) < 0.12) {
