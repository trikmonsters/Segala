          Refine them into a precise signature look and motion language for THIS series.

          ═══ 5. COLOUR SYSTEM — designed, never guessed ═══
           1. MEANING first: healthcare → teal/cyan (calm, clean, trust) + warm coral/amber accent (human care); finance/payments → deep blue (trust)
              + gold/amber (value); security/privacy → blue/indigo + small signal-green accent; cloud/data/AI → blue-violet + cyan;
              energy/sustainability → green + warm amber; logistics/e-commerce → blue + orange accent; education → blue/violet + yellow accent;
              legal/insurance → navy + muted teal/gold. Adapt to the client's brand tone if given.
