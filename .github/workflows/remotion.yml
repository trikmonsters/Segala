          const MOTIONS = [
            "anticipation → overshoot → settle: parts pull back slightly, snap forward with easeOutBack/easeOutElastic, then rest",
            "domino cascade: elements activate in a stagger() sequence, each triggering the next like a chain reaction",
            "meaningful shape morph: one icon fluidly transforms into the icon of the next idea (morphPolys) and returns",
            "orbital choreography: satellites travel on arcs and elegant ellipses, handing energy to the hero at precise beats",
            "clockwork meshing: interlocking parts rotate with different speeds that re-align exactly at the loop point",
            "liquid wobble: shapes breathe with low-amplitude travelling sine waves; hero settles with damped follow-through",
            "reveal-and-assemble: layers slide, scale and fade into place one after another, then softly release back",
            "magnetic attract/repel: small shapes are pulled into the hero, absorbed with a pulse, then expelled in a ring",
            "breathing rhythm with overlap: each layer lags the previous by a phase offset, creating a soft wave through the object",
          ];

          const shuffle = arr => {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
          };
          const recentSet = key => new Set(history.rendered.slice(-20).map(r => r[key]).filter(Boolean));
          function pickFrom(bank, key, getName = x => x) {
            const used = recentSet(key);
            const free = bank.filter(x => !used.has(getName(x)));
