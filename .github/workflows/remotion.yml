             4K video motion graphic, seamless loop." (adapt — never copy). For chroma-key include chroma key, green screen, green background;
             for vertical format mention vertical video. No brand names, no "AI generated".

          ═══ 7. PREMIUM BAR ═══
          Crisp, clean, professional vector-illustration finish; consistent shading and palette across the series; smooth eased motion; no flicker;
          no clutter; seamless loop of 10–15 s. No text, letters, numbers, people/faces, brand logos or trademarks, no medical/financial claims.

          ═══ 8. ALREADY SHIPPED — do not repeat ═══
          ${shipped.length ? shipped.join("\n") : "  (none yet)"}

          ═══ OUTPUT ═══ Output ONLY valid JSON:
          {
            "seriesName": "short internal name",
            "topic": "the chosen domain, copied exactly from the candidates",
            "topicEvidence": "why buyers want this now, citing the data",
            "format": { "aspectRatio": "16:9 | 9:16", "reasoning": "which use cases/functions/audience/platforms justify this ratio",
