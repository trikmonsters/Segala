          // ═══════════════════════════════════════════════════════════
          // BANKS — dipilih SCRIPT (bukan LLM) agar tiap run beda topik, gaya, dan gaya gerak
          // ═══════════════════════════════════════════════════════════
          const DOMAINS = [
