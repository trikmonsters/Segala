            const serveUrl = await bundle({ entryPoint: entryFile });

            // still kecil untuk dinilai Art Director (a=awal, b=tengah, c=akhir) — nama diurutkan alfabet
            const picks = [['a_first', 0], ['b_mid', Math.floor(frames / 2)], ['c_last', frames - 1]];
            for (const [name, f] of picks) await still(serveUrl, f, 0.25, path.join(stillsDir, `${name}.jpg`));

            const secs = await still(serveUrl, Math.floor(frames / 3), 1, path.join(tmpDir, 'full.jpg'));
            if (secs > MAX_FRAME_SECONDS) {
              throw new Error(
                `Terlalu berat: 1 frame ${width}x${height} butuh ${secs.toFixed(1)}s (maks ${MAX_FRAME_SECONDS}s). ` +
                `Kurangi jumlah path/noise call, gunakan getBuffer() resolusi rendah untuk field, hindari shadowBlur.`
              );
            }
            console.log(JSON.stringify({ ok: true, frameSeconds: secs }));
          } catch (e) {
            console.error(String(e?.stack || e).slice(0, 1800));
            code = 1;
          } finally {
            fs.rmSync(entryFile, { force: true });
            fs.rmSync(tmpDir, { recursive: true, force: true });
          }
          process.exit(code);
          EOF

      - name: Install system dependencies (Chrome + fonts)
