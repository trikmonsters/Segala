          }

          const KIT_DOC = `TAU, type Pt = [number, number]
          mulberry32(seed): () => number                     // seeded random 0..1
          noise(x,y,z=0,w=0): number                         // 4D value noise, -1..1
          loopNoise(x,y,phase,r=1) / fbm(x,y,phase,octaves=4,r=1): number   // periodic in phase
          curl(x,y,phase,octaves=3,r=1): [number, number]    // flow vector (raw), periodic
          clamp(v,a,b)  lerp(a,b,t)  smoothstep(a,b,x)
          seg(phase,a,b): number                             // 0..1 progress between phase a and b (timelines)
          easeInOut(t)  easeOutCubic(t)  easeOutBack(t)
