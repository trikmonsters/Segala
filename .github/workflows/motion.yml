name: Auto Stock Concept Motion Graphics (4K)

on:
  schedule:
    - cron: '0 */8 * * *'   # 3x sehari
  workflow_dispatch:
    inputs:
      count:
        description: 'Jumlah ide per batch (tiap ide = 4 video)'
        default: '4'

permissions:
  contents: write

concurrency:
  group: stock-render
  cancel-in-progress: false

env:
  IDEA_COUNT: ${{ github.event.inputs.count || '4' }}
  # Daftar model Gemini (dicoba berurutan). Override lewat repo Variables: GEMINI_MODELS
  GEMINI_MODELS: ${{ vars.GEMINI_MODELS || 'gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-2.5-flash,gemini-2.5-flash-lite' }}

jobs:
  # ══════════════════════════════════════════════════════════
  # JOB 1 — PREPARE
  #   riset pasar → ide konsep (topik jelas × eksekusi mind-blowing)
  #   → kode Canvas dari AI → validasi otomatis (render, piksel, loop, performa)
  # ══════════════════════════════════════════════════════════
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      comps: ${{ steps.comps.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Init history if missing
        run: |
          if [ ! -f history.json ]; then
            echo '{"rendered":[],"version":1}' > history.json
          fi
          echo "History entries: $(node -e "console.log(require('./history.json').rendered.length)")"

      - name: Scaffold Remotion project
        run: |
          mkdir -p remotion-project/src/lib remotion-project/src/custom
          cd remotion-project
          npm init -y
          npm install remotion@4.0.290 @remotion/cli@4.0.290 \
            @remotion/bundler@4.0.290 @remotion/renderer@4.0.290 \
            react@18.3.1 react-dom@18.3.1 jpeg-js
          npm install -D typescript@5.6.3 @types/react@18.3.12

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2020", "module": "ESNext", "jsx": "react-jsx",
              "strict": true, "esModuleInterop": true, "skipLibCheck": true,
              "moduleResolution": "bundler", "lib": ["DOM", "ES2020"]
            }
          }
          EOF

      # ── Toolkit untuk kode buatan AI ──
      - name: Write creative-coding kit
        run: |
          cd remotion-project

          cat > src/lib/kit.ts <<'EOF'
          export const TAU = Math.PI * 2;
          export type Pt = [number, number];

          export const clamp = (v: number, a: number, b: number) => Math.min(b, Math.max(a, v));
          export const lerp = (a: number, b: number, t: number) => a + (b - a) * t;
          export const smoothstep = (a: number, b: number, x: number) => {
            const t = clamp((x - a) / (b - a || 1), 0, 1);
            return t * t * (3 - 2 * t);
          };
          // Progres 0..1 antara phase a dan b (untuk membuat timeline)
          export const seg = (phase: number, a: number, b: number) => clamp((phase - a) / (b - a || 1), 0, 1);
          export const easeInOut = (t: number) =>
            t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          export const easeOutCubic = (t: number) => 1 - Math.pow(1 - t, 3);
          export const easeOutBack = (t: number) => {
            const c1 = 1.70158, c3 = c1 + 1;
            return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
          };
          // 0 → 1 → 0, sebanyak k siklus penuh per loop
          export const breathe = (phase: number, k = 1) => 0.5 - 0.5 * Math.cos(TAU * phase * k);

          export function mulberry32(seed: number) {
            let a = seed | 0;
            return () => {
              a = (a + 0x6d2b79f5) | 0;
              let t = Math.imul(a ^ (a >>> 15), 1 | a);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          function hash4(x: number, y: number, z: number, w: number) {
            let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^
                    Math.imul(z, 1274126177) ^ Math.imul(w, 2246822519);
            h = Math.imul(h ^ (h >>> 13), 1274126177);
            h ^= h >>> 16;
            return (h >>> 0) / 4294967296;
          }
          const fade = (t: number) => t * t * t * (t * (t * 6 - 15) + 10);

          // 4D value noise, -1..1
          export function noise(x: number, y: number, z = 0, w = 0): number {
            const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), wi = Math.floor(w);
            const xf = fade(x - xi), yf = fade(y - yi), zf = fade(z - zi), wf = fade(w - wi);
            let sum = 0;
            for (let dw = 0; dw < 2; dw++) {
              const ww = dw ? wf : 1 - wf;
              for (let dz = 0; dz < 2; dz++) {
                const wz = ww * (dz ? zf : 1 - zf);
                for (let dy = 0; dy < 2; dy++) {
                  const wy = wz * (dy ? yf : 1 - yf);
                  for (let dx = 0; dx < 2; dx++) {
                    sum += wy * (dx ? xf : 1 - xf) * hash4(xi + dx, yi + dy, zi + dz, wi + dw);
                  }
                }
              }
            }
            return sum * 2 - 1;
          }

          // Noise yang berulang sempurna tiap phase = 1
          export const loopNoise = (x: number, y: number, phase: number, r = 1) =>
            noise(x, y, Math.cos(TAU * phase) * r, Math.sin(TAU * phase) * r);

          export function fbm(x: number, y: number, phase: number, octaves = 4, r = 1): number {
            let amp = 0.5, freq = 1, sum = 0, norm = 0;
            for (let o = 0; o < octaves; o++) {
              sum += amp * loopNoise(x * freq + o * 17.3, y * freq - o * 9.1, phase, r);
              norm += amp;
              amp *= 0.5;
              freq *= 2;
            }
            return sum / norm;
          }

          export function curl(x: number, y: number, phase: number, octaves = 3, r = 1): [number, number] {
            const e = 0.02;
            const dy = (fbm(x, y + e, phase, octaves, r) - fbm(x, y - e, phase, octaves, r)) / (2 * e);
            const dx = (fbm(x + e, y, phase, octaves, r) - fbm(x - e, y, phase, octaves, r)) / (2 * e);
            return [dy, -dx];
          }

          // ── Warna ──
          export function hexToRgb(hex: string): [number, number, number] {
            const h = hex.replace('#', '');
            const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
          }
          export const rgba = (hex: string, a: number) => {
            const [r, g, b] = hexToRgb(hex);
            return `rgba(${r},${g},${b},${clamp(a, 0, 1)})`;
          };
          export function mixHex(a: string, b: string, t: number): string {
            const A = hexToRgb(a), B = hexToRgb(b);
            const c = (i: number) => Math.round(lerp(A[i], B[i], clamp(t, 0, 1))).toString(16).padStart(2, '0');
            return `#${c(0)}${c(1)}${c(2)}`;
          }
          // amt > 0 → lebih terang, amt < 0 → lebih gelap
          export const shade = (hex: string, amt: number) =>
            mixHex(hex, amt > 0 ? '#ffffff' : '#000000', Math.abs(amt));

          // ── Geometri untuk ikon (polyline bisa digambar bertahap, di-morph, dan di-resample) ──
          export const pol = (cx: number, cy: number, r: number, a: number): Pt => [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
          // Proyeksi isometrik (satuan bebas; kalikan sendiri dengan ukuran)
          export const iso = (x: number, y: number, z = 0): Pt => [(x - y) * 0.866025, (x + y) * 0.5 - z];

          export function circlePts(cx: number, cy: number, r: number, n = 64, start = -Math.PI / 2): Pt[] {
            const out: Pt[] = [];
            for (let i = 0; i < n; i++) out.push(pol(cx, cy, r, start + (i / n) * TAU));
            return out;
          }

          export function roundedRectPts(cx: number, cy: number, w: number, h: number, r: number, steps = 8): Pt[] {
            const rr = Math.min(r, w / 2, h / 2);
            const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - h / 2, y1 = cy + h / 2;
            const out: Pt[] = [];
            const arc = (ax: number, ay: number, a0: number) => {
              for (let i = 0; i <= steps; i++) {
                const a = a0 + (i / steps) * (Math.PI / 2);
                out.push([ax + Math.cos(a) * rr, ay + Math.sin(a) * rr]);
              }
            };
            arc(x1 - rr, y0 + rr, -Math.PI / 2);
            arc(x1 - rr, y1 - rr, 0);
            arc(x0 + rr, y1 - rr, Math.PI / 2);
            arc(x0 + rr, y0 + rr, Math.PI);
            return out; // path tertutup
          }

          // Resample polyline menjadi n titik berjarak sama → memungkinkan morph antar bentuk apa pun
          export function resample(pts: Pt[], n: number, close = false): Pt[] {
            const P = close ? [...pts, pts[0]] : pts;
            if (P.length < 2) return Array.from({ length: n }, () => (P[0] || [0, 0]) as Pt);
            const cum = [0];
            for (let i = 1; i < P.length; i++) {
              cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
            }
            const total = cum[cum.length - 1] || 1;
            const out: Pt[] = [];
            for (let k = 0; k < n; k++) {
              const d = (close ? k / n : k / (n - 1)) * total;
              let i = 1;
              while (i < cum.length - 1 && cum[i] < d) i++;
              const sl = cum[i] - cum[i - 1] || 1;
              const t = (d - cum[i - 1]) / sl;
              out.push([P[i - 1][0] + (P[i][0] - P[i - 1][0]) * t, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * t]);
            }
            return out;
          }

          export const lerpPts = (a: Pt[], b: Pt[], t: number): Pt[] =>
            a.map((p, i) => [lerp(p[0], b[i][0], t), lerp(p[1], b[i][1], t)] as Pt);

          // Menambahkan sebagian (0..1) panjang polyline ke path aktif (untuk efek draw-on)
          export function tracePolyline(ctx: CanvasRenderingContext2D, pts: Pt[], t = 1, close = false) {
            const P = close ? [...pts, pts[0]] : pts;
            if (P.length < 2) return;
            const seglen: number[] = [];
            let total = 0;
            for (let i = 1; i < P.length; i++) {
              const d = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
              seglen.push(d);
              total += d;
            }
            let remain = total * clamp(t, 0, 1);
            ctx.moveTo(P[0][0], P[0][1]);
            for (let i = 1; i < P.length && remain > 0; i++) {
              const d = seglen[i - 1];
              if (remain >= d) {
                ctx.lineTo(P[i][0], P[i][1]);
                remain -= d;
              } else {
                const k = remain / (d || 1);
                ctx.lineTo(P[i - 1][0] + (P[i][0] - P[i - 1][0]) * k, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * k);
                remain = 0;
              }
            }
          }

          // Garis neon: halo berlapis (tanpa shadowBlur yang lambat) + inti terang.
          // `trace` adalah fungsi yang membangun path (moveTo/lineTo/tracePolyline) tanpa beginPath/stroke.
          export function neonStroke(ctx: CanvasRenderingContext2D, trace: () => void, color: string, lw: number, intensity = 1) {
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalCompositeOperation = 'lighter';
            const halo: [number, number][] = [[7, 0.04], [4, 0.09], [2.2, 0.2]];
            for (const [k, a] of halo) {
              ctx.lineWidth = lw * k;
              ctx.strokeStyle = rgba(color, a * intensity);
              ctx.beginPath();
              trace();
              ctx.stroke();
            }
            ctx.globalCompositeOperation = 'source-over';
            ctx.lineWidth = lw;
            ctx.strokeStyle = rgba(mixHex(color, '#ffffff', 0.5), clamp(0.95 * intensity, 0, 1));
            ctx.beginPath();
            trace();
            ctx.stroke();
            ctx.restore();
          }

          // Canvas offscreen resolusi rendah. Tidak dibersihkan otomatis.
          const buffers = new Map<string, { canvas: HTMLCanvasElement; ctx: CanvasRenderingContext2D }>();
          export function getBuffer(key: string, w: number, h: number) {
            const id = `${key}:${w}x${h}`;
            let b = buffers.get(id);
            if (!b) {
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              b = { canvas, ctx: canvas.getContext('2d')! };
              buffers.set(id, b);
            }
            return b;
          }

          // ── Finishing (dipanggil harness untuk varian 'dark', bukan oleh kode AI) ──
          export function drawVignette(ctx: CanvasRenderingContext2D, w: number, h: number, bg: string, strength = 0.5) {
            const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.hypot(w, h) * 0.55);
            g.addColorStop(0, rgba(bg, 0));
            g.addColorStop(1, rgba(bg, strength));
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
          }

          // Grain halus = dithering anti-banding
          const grainTiles = new Map<number, HTMLCanvasElement>();
          export function drawGrain(ctx: CanvasRenderingContext2D, w: number, h: number, frame: number, amount = 0.02) {
            const k = frame % 8;
            let tile = grainTiles.get(k);
            if (!tile) {
              tile = document.createElement('canvas');
              tile.width = tile.height = 256;
              const g = tile.getContext('2d')!;
              const img = g.createImageData(256, 256);
              const rnd = mulberry32(1234 + k * 77);
              for (let i = 0; i < img.data.length; i += 4) {
                const v = (rnd() * 255) | 0;
                img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
                img.data[i + 3] = 255;
              }
              g.putImageData(img, 0, 0);
              grainTiles.set(k, tile);
            }
            const pat = ctx.createPattern(tile, 'repeat');
            if (!pat) return;
            ctx.save();
            ctx.globalAlpha = amount;
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = pat;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
          }
          EOF

          cat > src/lib/CanvasScene.tsx <<'EOF'
          import React, { useLayoutEffect, useRef } from 'react';
          import { AbsoluteFill, useCurrentFrame, useVideoConfig } from 'remotion';
          import { drawGrain, drawVignette, mixHex } from './kit';

          export type Colors = { primary: string; secondary: string; bg: string };
          // dark  = backdrop gelap premium (vignette + grain)
          // black = hitam murni datar (untuk overlay screen/add)
          // green = hijau chroma key datar (tanpa efek apa pun di latar)
          export type Variant = 'dark' | 'black' | 'green';

          const FLAT_BG: Record<'black' | 'green', string> = { black: '#000000', green: '#00B140' };

          export type DrawState = {
            w: number;
            h: number;
            cx: number;
            cy: number;
            u: number;          // unit skala ≈ min(w,h)/1000
            hero: number;       // sisi persegi aman di tengah untuk subjek utama
            phase: number;      // 0..1 posisi loop (satu-satunya sumber waktu)
            seconds: number;    // durasi loop dalam detik
            portrait: boolean;
            variant: Variant;
            bg: string;         // warna latar efektif
            colors: Colors;
          };

          export type DrawFn = (ctx: CanvasRenderingContext2D, s: DrawState) => void;

          export const CanvasScene: React.FC<{ draw: DrawFn; colors: Colors; variant?: Variant }> = ({
            draw, colors, variant = 'dark',
          }) => {
            const ref = useRef<HTMLCanvasElement>(null);
            const frame = useCurrentFrame();
            const { width, height, fps, durationInFrames } = useVideoConfig();
            const bg = variant === 'dark' ? colors.bg : FLAT_BG[variant];

            useLayoutEffect(() => {
              const canvas = ref.current;
              if (!canvas) return;
              const ctx = canvas.getContext('2d');
              if (!ctx) return;

              ctx.setTransform(1, 0, 0, 1, 0, 0);
              ctx.globalAlpha = 1;
              ctx.globalCompositeOperation = 'source-over';
              ctx.fillStyle = bg;
              ctx.fillRect(0, 0, width, height);

              if (variant === 'dark') {
                const g = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height) * 0.7);
                g.addColorStop(0, mixHex(bg, colors.primary, 0.12));
                g.addColorStop(1, bg);
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, width, height);
              }

              const portrait = height > width;
              const s: DrawState = {
                w: width,
                h: height,
                cx: width / 2,
                cy: height / 2,
                u: Math.min(width, height) / 1000,
                hero: portrait ? width * 0.7 : height * 0.6,
                phase: frame / durationInFrames,
                seconds: durationInFrames / fps,
                portrait,
                variant,
                bg,
                colors,
              };

              ctx.save();
              draw(ctx, s);
              ctx.restore();

              if (variant === 'dark') {
                drawVignette(ctx, width, height, bg, 0.55);
                drawGrain(ctx, width, height, frame, 0.02);
              }
            }, [frame, width, height, fps, durationInFrames, colors, draw, variant, bg]);

            return (
              <AbsoluteFill style={{ background: bg }}>
                <canvas ref={ref} width={width} height={height} style={{ width: '100%', height: '100%' }} />
              </AbsoluteFill>
            );
          };
          EOF

      # ── Validator: bundle + still (3 varian) + cek piksel, animasi, loop, spill hijau, performa ──
      - name: Write validator
        run: |
          cd remotion-project
          cat > validate.mjs <<'EOF'
          import { bundle } from '@remotion/bundler';
          import * as R from '@remotion/renderer';
          import jpeg from 'jpeg-js';
          import fs from 'fs';
          import os from 'os';
          import path from 'path';

          const [id, colorsJson, framesStr] = process.argv.slice(2);
          const colors = JSON.parse(colorsJson);
          const F = parseInt(framesStr, 10);
          const MAX_FRAME_SECONDS = 18;
          const GREEN = [0, 177, 64];
          const entryFile = path.resolve('src/_validate-entry.tsx');
          const outDir = fs.mkdtempSync(path.join(os.tmpdir(), 'val-'));

          const entry = `import React from 'react';
          import { registerRoot, Composition } from 'remotion';
          import { CanvasScene } from './lib/CanvasScene';
          import { draw } from './custom/${id}';
          const colors = ${JSON.stringify(colors)};
          const Dark: React.FC = () => <CanvasScene draw={draw} colors={colors} variant="dark" />;
          const Black: React.FC = () => <CanvasScene draw={draw} colors={colors} variant="black" />;
          const Green: React.FC = () => <CanvasScene draw={draw} colors={colors} variant="green" />;
          registerRoot(() => (
            <>
              <Composition id="dark-land" component={Dark} durationInFrames={${F}} fps={30} width={3840} height={2160} />
              <Composition id="dark-port" component={Dark} durationInFrames={${F}} fps={30} width={2160} height={3840} />
              <Composition id="black-land" component={Black} durationInFrames={${F}} fps={30} width={3840} height={2160} />
              <Composition id="green-land" component={Green} durationInFrames={${F}} fps={30} width={3840} height={2160} />
            </>
          ));
          `;

          async function still(serveUrl, compId, frame, scale, name) {
            const composition = await R.selectComposition({ serveUrl, id: compId });
            const t0 = Date.now();
            await R.renderStill({
              composition, serveUrl, frame, scale,
              output: path.join(outDir, name),
              imageFormat: 'jpeg', jpegQuality: 80,
            });
            return (Date.now() - t0) / 1000;
          }

          const load = name => jpeg.decode(fs.readFileSync(path.join(outDir, name)), { useTArray: true });

          // Fraksi piksel yang berbeda dari warna latar
          function diffFraction(img, rgb, tol) {
            const d = img.data;
            let n = 0;
            for (let i = 0; i < d.length; i += 4) {
              const diff = Math.abs(d[i] - rgb[0]) + Math.abs(d[i + 1] - rgb[1]) + Math.abs(d[i + 2] - rgb[2]);
              if (diff > tol) n++;
            }
            return n / (d.length / 4);
          }
          // Rata-rata selisih absolut per kanal (0..255)
          function meanAbs(a, b) {
            const da = a.data, db = b.data;
            let s = 0, c = 0;
            for (let i = 0; i < da.length; i += 4) {
              s += Math.abs(da[i] - db[i]) + Math.abs(da[i + 1] - db[i + 1]) + Math.abs(da[i + 2] - db[i + 2]);
              c += 3;
            }
            return s / c;
          }
          // Dari piksel subjek (bukan latar hijau), berapa fraksi yang dominan hijau (spill key)
          function greenSpill(img) {
            const d = img.data;
            let subject = 0, greenish = 0;
            for (let i = 0; i < d.length; i += 4) {
              const diff = Math.abs(d[i] - GREEN[0]) + Math.abs(d[i + 1] - GREEN[1]) + Math.abs(d[i + 2] - GREEN[2]);
              if (diff > 60) {
                subject++;
                if (d[i + 1] > d[i] + 35 && d[i + 1] > d[i + 2] + 35) greenish++;
              }
            }
            return { subject: subject / (d.length / 4), greenRatio: subject ? greenish / subject : 0 };
          }

          let code = 0;
          try {
            fs.writeFileSync(entryFile, entry);
            if (R.ensureBrowser) await R.ensureBrowser();
            const serveUrl = await bundle({ entryPoint: entryFile });

            const q = Math.floor(F * 0.25), m = Math.floor(F * 0.5), last = F - 1;
            await still(serveUrl, 'black-land', 0, 0.25, 'b0.jpg');
            await still(serveUrl, 'black-land', q, 0.25, 'bq.jpg');
            await still(serveUrl, 'black-land', m, 0.25, 'bm.jpg');
            await still(serveUrl, 'black-land', last, 0.25, 'bl.jpg');
            await still(serveUrl, 'green-land', 0, 0.25, 'g0.jpg');
            await still(serveUrl, 'dark-port', Math.floor(F / 3), 0.25, 'p.jpg');

            const b0 = load('b0.jpg'), bq = load('bq.jpg'), bm = load('bm.jpg'), bl = load('bl.jpg'), g0 = load('g0.jpg');

            // 1) Subjek harus terlihat di phase 0 (thumbnail) dan tidak memenuhi seluruh frame
            const cover = diffFraction(b0, [0, 0, 0], 40);
            if (cover < 0.003 || cover > 0.6) {
              throw new Error(
                `Phase 0 (thumbnail): subjek menutupi ${(cover * 100).toFixed(2)}% frame (harus 0.3%–60%). ` +
                `Gambar hero yang jelas, utuh, dan terlihat di tengah frame pada phase 0 (varian black).`);
            }
            // 2) Harus ada animasi nyata
            const motion = Math.max(meanAbs(b0, bq), meanAbs(b0, bm));
            if (motion < 0.25) {
              throw new Error(`Animasi nyaris tidak terlihat (selisih frame ${motion.toFixed(2)}). Buat transformasi yang jelas di tengah loop.`);
            }
            // 3) Loop mulus: frame terakhir harus hampir sama dengan frame pertama
            const dLast = meanAbs(b0, bl);
            if (dLast > 0.35 * motion + 0.1) {
              throw new Error(
                `Loop tidak mulus: frame terakhir berbeda dari frame pertama (${dLast.toFixed(2)} vs gerak ${motion.toFixed(2)}). ` +
                `Semua gerak harus kembali persis ke keadaan phase 0 pada phase 1.`);
            }
            // 4) Varian green: subjek terlihat dan tidak mengandung warna hijau (spill key)
            const sp = greenSpill(g0);
            if (sp.subject < 0.002) {
              throw new Error(`Varian green: subjek hampir tidak terlihat (${(sp.subject * 100).toFixed(2)}%). Pastikan hero tergambar di latar hijau.`);
            }
            if (sp.greenRatio > 0.35) {
              throw new Error(
                `Varian green: ${(sp.greenRatio * 100).toFixed(0)}% piksel subjek berwarna hijau — akan ikut ter-key. ` +
                `Pada variant === 'green' pakai warna non-hijau/teal dan tanpa glow aditif.`);
            }

            // 5) Performa: satu frame 4K penuh
            const secs = await still(serveUrl, 'dark-land', Math.floor(F / 2), 1, 'full.jpg');
            if (secs > MAX_FRAME_SECONDS) {
              throw new Error(
                `Terlalu berat: 1 frame 4K butuh ${secs.toFixed(1)}s (maks ${MAX_FRAME_SECONDS}s). ` +
                `Kurangi jumlah path/noise call, pakai getBuffer() resolusi rendah, hindari shadowBlur.`);
            }
            console.log(JSON.stringify({ ok: true, frameSeconds: secs, cover, motion, dLast, greenRatio: sp.greenRatio }));
          } catch (e) {
            console.error(String(e?.stack || e).slice(0, 1800));
            code = 1;
          } finally {
            fs.rmSync(entryFile, { force: true });
            fs.rmSync(outDir, { recursive: true, force: true });
          }
          process.exit(code);
          EOF

