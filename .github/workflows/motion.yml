          import React, { useLayoutEffect, useRef } from 'react';
          import { AbsoluteFill, useCurrentFrame, useVideoConfig } from 'remotion';
          import { drawGrain, drawVignette, mixHex } from './kit';

          export type Colors = { primary: string; secondary: string; bg: string };

          export type DrawState = {
            w: number;
            h: number;
            cx: number;
            cy: number;
            u: number;          // unit scale ≈ min(w,h)/1000
            phase: number;      // 0..1, posisi loop (satu-satunya sumber waktu)
            seconds: number;    // durasi loop dalam detik
            portrait: boolean;
            colors: Colors;
          };

          export type DrawFn = (ctx: CanvasRenderingContext2D, s: DrawState) => void;

          // finish: 'full' = backdrop + vignette + grain | 'clean' = hanya warna latar polos (hitam / chroma green)
          export const CanvasScene: React.FC<{ draw: DrawFn; colors: Colors; finish?: 'full' | 'clean' }> = ({ draw, colors, finish = 'full' }) => {
            const ref = useRef<HTMLCanvasElement>(null);
            const frame = useCurrentFrame();
            const { width, height, fps, durationInFrames } = useVideoConfig();

            useLayoutEffect(() => {
              const canvas = ref.current;
              if (!canvas) return;
              const ctx = canvas.getContext('2d');
              if (!ctx) return;

              ctx.setTransform(1, 0, 0, 1, 0, 0);
              ctx.globalAlpha = 1;
              ctx.globalCompositeOperation = 'source-over';
              ctx.fillStyle = colors.bg;
              ctx.fillRect(0, 0, width, height);

              if (finish === 'full') {
                const g = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height) * 0.7);
                g.addColorStop(0, mixHex(colors.bg, colors.primary, 0.1));
                g.addColorStop(1, colors.bg);
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, width, height);
              }

              const s: DrawState = {
                w: width,
                h: height,
                cx: width / 2,
                cy: height / 2,
                u: Math.min(width, height) / 1000,
                phase: frame / durationInFrames,
                seconds: durationInFrames / fps,
                portrait: height > width,
                colors,
              };

              ctx.save();
              draw(ctx, s);
              ctx.restore();

              if (finish === 'full') {
                drawVignette(ctx, width, height, colors.bg, 0.55);
                drawGrain(ctx, width, height, frame, 0.02);
              }
            }, [frame, width, height, fps, durationInFrames, colors, draw, finish]);

            return (
              <AbsoluteFill style={{ background: colors.bg }}>
                <canvas ref={ref} width={width} height={height} style={{ width: '100%', height: '100%' }} />
              </AbsoluteFill>
            );
          };
          EOF

      # ── Validator: bundle + render still (landscape & portrait) + ukur waktu per frame 4K ──
      - name: Write validator
        run: |
          cd remotion-project
          cat > validate.mjs <<'EOF'
          import { bundle } from '@remotion/bundler';
          import * as R from '@remotion/renderer';
          import fs from 'fs';
          import os from 'os';
          import path from 'path';

          const [id, colorsJson, framesStr, finish = 'full'] = process.argv.slice(2);
          const colors = JSON.parse(colorsJson);
          const frames = parseInt(framesStr, 10);
          const MAX_FRAME_SECONDS = 18; // satu frame 4K; 450 frame / concurrency 2 masih muat di timeout render
          const entryFile = path.resolve('src/_validate-entry.tsx');
          const outDir = fs.mkdtempSync(path.join(os.tmpdir(), 'val-'));

          const entry = `import React from 'react';
          import { registerRoot, Composition } from 'remotion';
          import { CanvasScene } from './lib/CanvasScene';
          import { draw } from './custom/${id}';
          const colors = ${JSON.stringify(colors)};
          const Comp: React.FC = () => <CanvasScene draw={draw} colors={colors} finish="${finish}" />;
          registerRoot(() => (
            <>
              <Composition id="t-land" component={Comp} durationInFrames={${frames}} fps={30} width={3840} height={2160} />
              <Composition id="t-port" component={Comp} durationInFrames={${frames}} fps={30} width={2160} height={3840} />
            </>
          ));
          `;

          async function still(serveUrl, compId, frame, scale, name) {
            const composition = await R.selectComposition({ serveUrl, id: compId });
            const t0 = Date.now();
            await R.renderStill({
              composition, serveUrl, frame, scale,
              output: path.join(outDir, name),
              imageFormat: 'jpeg', jpegQuality: 70,
            });
            return (Date.now() - t0) / 1000;
          }

          let code = 0;
          try {
            fs.writeFileSync(entryFile, entry);
            if (R.ensureBrowser) await R.ensureBrowser();
            const serveUrl = await bundle({ entryPoint: entryFile });

            for (const f of [0, Math.floor(frames / 2), frames - 1]) {
              await still(serveUrl, 't-land', f, 0.25, `l${f}.jpg`);
            }
            await still(serveUrl, 't-port', Math.floor(frames / 3), 0.25, 'p.jpg');

            const secs = await still(serveUrl, 't-land', Math.floor(frames / 2), 1, 'full.jpg');
            if (secs > MAX_FRAME_SECONDS) {
              throw new Error(
                `Terlalu berat: 1 frame 4K butuh ${secs.toFixed(1)}s (maks ${MAX_FRAME_SECONDS}s). ` +
                `Kurangi jumlah path/noise call, gunakan getBuffer() resolusi rendah untuk field, hindari shadowBlur.`
              );
            }
            console.log(JSON.stringify({ ok: true, frameSeconds: secs }));
          } catch (e) {
            console.error(String(e?.stack || e).slice(0, 1800));
            code = 1;
          } finally {
            fs.rmSync(entryFile, { force: true });
            fs.rmSync(outDir, { recursive: true, force: true });
          }
          process.exit(code);
          EOF

