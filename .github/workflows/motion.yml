name: Auto Stock 4K Generator (Concept Assets)

on:
  schedule:
    - cron: '0 */8 * * *'   # 3x sehari
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-render
  cancel-in-progress: false

env:
  # Daftar model Gemini (dicoba berurutan). Override lewat repo Variables: GEMINI_MODELS
  GEMINI_MODELS: ${{ vars.GEMINI_MODELS || 'gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-2.5-flash,gemini-2.5-flash-lite' }}

jobs:
  # ══════════════════════════════════════════════════════════
  # JOB 1 — PREPARE
  #   riset topik (Google Search grounding) → rencana SERIES → metadata → kode Canvas dari AI
  #   → validasi otomatis (compile + render still + cek performa)
  # ══════════════════════════════════════════════════════════
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      comps: ${{ steps.comps.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Init history if missing
        run: |
          if [ ! -f history.json ]; then
            echo '{"rendered":[],"version":1}' > history.json
          fi
          echo "History entries: $(node -e "console.log(require('./history.json').rendered.length)")"

      - name: Scaffold Remotion project
        run: |
          mkdir -p remotion-project/src/lib remotion-project/src/custom
          cd remotion-project
          npm init -y
          npm install remotion@4.0.290 @remotion/cli@4.0.290 \
            @remotion/bundler@4.0.290 @remotion/renderer@4.0.290 \
            react@18.3.1 react-dom@18.3.1
          npm install -D typescript@5.6.3 @types/react@18.3.12

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2020", "module": "ESNext", "jsx": "react-jsx",
              "strict": true, "esModuleInterop": true, "skipLibCheck": true,
              "moduleResolution": "bundler", "lib": ["DOM", "ES2020"]
            }
          }
          EOF

      # ── Toolkit yang dipakai kode buatan AI (noise yang bisa loop, warna, grain, dll.) ──
      - name: Write creative-coding kit
        run: |
          cd remotion-project

          cat > src/lib/kit.ts <<'EOF'
          export const TAU = Math.PI * 2;

          export const clamp = (v: number, a: number, b: number) => Math.min(b, Math.max(a, v));
          export const lerp = (a: number, b: number, t: number) => a + (b - a) * t;
          export const smoothstep = (a: number, b: number, x: number) => {
            const t = clamp((x - a) / (b - a || 1), 0, 1);
            return t * t * (3 - 2 * t);
          };
          export const easeInOut = (t: number) =>
            t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          // 0 → 1 → 0, sebanyak k siklus penuh per loop
          export const breathe = (phase: number, k = 1) => 0.5 - 0.5 * Math.cos(TAU * phase * k);

          export function mulberry32(seed: number) {
            let a = seed | 0;
            return () => {
              a = (a + 0x6d2b79f5) | 0;
              let t = Math.imul(a ^ (a >>> 15), 1 | a);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          function hash4(x: number, y: number, z: number, w: number) {
            let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^
                    Math.imul(z, 1274126177) ^ Math.imul(w, 2246822519);
            h = Math.imul(h ^ (h >>> 13), 1274126177);
            h ^= h >>> 16;
            return (h >>> 0) / 4294967296;
          }
          const fade = (t: number) => t * t * t * (t * (t * 6 - 15) + 10);

          // 4D value noise, -1..1
          export function noise(x: number, y: number, z = 0, w = 0): number {
            const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), wi = Math.floor(w);
            const xf = fade(x - xi), yf = fade(y - yi), zf = fade(z - zi), wf = fade(w - wi);
            let sum = 0;
            for (let dw = 0; dw < 2; dw++) {
              const ww = dw ? wf : 1 - wf;
              for (let dz = 0; dz < 2; dz++) {
                const wz = ww * (dz ? zf : 1 - zf);
                for (let dy = 0; dy < 2; dy++) {
                  const wy = wz * (dy ? yf : 1 - yf);
                  for (let dx = 0; dx < 2; dx++) {
                    sum += wy * (dx ? xf : 1 - xf) * hash4(xi + dx, yi + dy, zi + dz, wi + dw);
                  }
                }
              }
            }
            return sum * 2 - 1;
          }

          // Noise yang berulang sempurna tiap phase = 1 (berjalan melingkar di dimensi z,w)
          export const loopNoise = (x: number, y: number, phase: number, r = 1) =>
            noise(x, y, Math.cos(TAU * phase) * r, Math.sin(TAU * phase) * r);

          export function fbm(x: number, y: number, phase: number, octaves = 4, r = 1): number {
            let amp = 0.5, freq = 1, sum = 0, norm = 0;
            for (let o = 0; o < octaves; o++) {
              sum += amp * loopNoise(x * freq + o * 17.3, y * freq - o * 9.1, phase, r);
              norm += amp;
              amp *= 0.5;
              freq *= 2;
            }
            return sum / norm;
          }

          // Vektor aliran divergence-free (mentah, normalisasi sendiri), loop sempurna
          export function curl(x: number, y: number, phase: number, octaves = 3, r = 1): [number, number] {
            const e = 0.02;
            const dy = (fbm(x, y + e, phase, octaves, r) - fbm(x, y - e, phase, octaves, r)) / (2 * e);
            const dx = (fbm(x + e, y, phase, octaves, r) - fbm(x - e, y, phase, octaves, r)) / (2 * e);
            return [dy, -dx];
          }

          export function hexToRgb(hex: string): [number, number, number] {
            const h = hex.replace('#', '');
            const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
          }
          export const rgba = (hex: string, a: number) => {
            const [r, g, b] = hexToRgb(hex);
            return `rgba(${r},${g},${b},${clamp(a, 0, 1)})`;
          };
          export function mixHex(a: string, b: string, t: number): string {
            const A = hexToRgb(a), B = hexToRgb(b);
            const c = (i: number) => Math.round(lerp(A[i], B[i], clamp(t, 0, 1))).toString(16).padStart(2, '0');
            return `#${c(0)}${c(1)}${c(2)}`;
          }

          // Canvas offscreen resolusi rendah (untuk efek field/permukaan). Tidak dibersihkan otomatis.
          const buffers = new Map<string, { canvas: HTMLCanvasElement; ctx: CanvasRenderingContext2D }>();
          export function getBuffer(key: string, w: number, h: number) {
            const id = `${key}:${w}x${h}`;
            let b = buffers.get(id);
            if (!b) {
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              b = { canvas, ctx: canvas.getContext('2d')! };
              buffers.set(id, b);
            }
            return b;
          }

          // ── Finishing (dipanggil harness, bukan oleh kode AI) ──
          export function drawVignette(ctx: CanvasRenderingContext2D, w: number, h: number, bg: string, strength = 0.5) {
            const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.hypot(w, h) * 0.55);
            g.addColorStop(0, rgba(bg, 0));
            g.addColorStop(1, rgba(bg, strength));
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
          }

          // Grain halus = dithering untuk mencegah banding pada gradient gelap (penyebab reject umum)
          const grainTiles = new Map<number, HTMLCanvasElement>();
          export function drawGrain(ctx: CanvasRenderingContext2D, w: number, h: number, frame: number, amount = 0.02) {
            const k = frame % 8;
            let tile = grainTiles.get(k);
            if (!tile) {
              tile = document.createElement('canvas');
              tile.width = tile.height = 256;
              const g = tile.getContext('2d')!;
              const img = g.createImageData(256, 256);
              const rnd = mulberry32(1234 + k * 77);
              for (let i = 0; i < img.data.length; i += 4) {
                const v = (rnd() * 255) | 0;
                img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
                img.data[i + 3] = 255;
              }
              g.putImageData(img, 0, 0);
              grainTiles.set(k, tile);
            }
            const pat = ctx.createPattern(tile, 'repeat');
            if (!pat) return;
            ctx.save();
            ctx.globalAlpha = amount;
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = pat;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
          }

          // ── Helper timeline & warna tambahan ──
          // seg(phase, a, b): 0 sebelum a, 1 setelah b — dipakai untuk koreografi animasi
          export const seg = (p: number, a: number, b: number) => clamp((p - a) / (b - a || 1), 0, 1);
          export const easeOutCubic = (t: number) => 1 - Math.pow(1 - t, 3);
          export const easeOutBack = (t: number) => {
            const c1 = 1.70158, c3 = c1 + 1;
            return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
          };
          // shade(hex, t): t -1..0 gelapkan (ke hitam), 0..1 terangkan (ke putih)
          export function shade(hex: string, t: number): string {
            return t < 0 ? mixHex(hex, '#000000', -t) : mixHex(hex, '#ffffff', t);
          }
          EOF

          cat > src/lib/shapes.ts <<'EOF'
          import { TAU, clamp, lerp, rgba, mixHex, shade } from './kit';

          export type Pt = [number, number];
          export type Poly = { pts: Pt[]; closed?: boolean };

          // ═══════════ Konstruktor bentuk (koordinat satuan, y ke bawah, sekitar -1..1) ═══════════
          export const polyP = (pts: Pt[], closed = false): Poly => ({ pts, closed });
          export const lineP = (x1: number, y1: number, x2: number, y2: number): Poly => ({ pts: [[x1, y1], [x2, y2]] });

          export function ellipseArcP(cx: number, cy: number, rx: number, ry: number, a0: number, a1: number, n = 48): Poly {
            const pts: Pt[] = [];
            for (let i = 0; i <= n; i++) {
              const a = lerp(a0, a1, i / n);
              pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
            }
            return { pts };
          }
          export const arcP = (cx: number, cy: number, r: number, a0: number, a1: number, n = 48) =>
            ellipseArcP(cx, cy, r, r, a0, a1, n);

          export function ellipseP(cx: number, cy: number, rx: number, ry: number, n = 72): Poly {
            const pts: Pt[] = [];
            for (let i = 0; i < n; i++) {
              const a = (i / n) * TAU;
              pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
            }
            return { pts, closed: true };
          }
          export const circleP = (cx: number, cy: number, r: number, n = 72) => ellipseP(cx, cy, r, r, n);
          export const rectP = (x: number, y: number, w: number, h: number): Poly =>
            ({ pts: [[x, y], [x + w, y], [x + w, y + h], [x, y + h]], closed: true });

          export function roundRectP(x: number, y: number, w: number, h: number, r: number, n = 10): Poly {
            r = Math.min(r, w / 2, h / 2);
            const pts: Pt[] = [];
            const corner = (cx: number, cy: number, a0: number) => {
              for (let i = 0; i <= n; i++) {
                const a = a0 + (i / n) * (Math.PI / 2);
                pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
              }
            };
            corner(x + w - r, y + r, -Math.PI / 2);   // kanan-atas
            corner(x + w - r, y + h - r, 0);          // kanan-bawah
            corner(x + r, y + h - r, Math.PI / 2);    // kiri-bawah
            corner(x + r, y + r, Math.PI);            // kiri-atas
            return { pts, closed: true };
          }

          export function bezierP(p0: Pt, p1: Pt, p2: Pt, p3: Pt, n = 28): Pt[] {
            const out: Pt[] = [];
            for (let i = 0; i <= n; i++) {
              const t = i / n, m = 1 - t;
              out.push([
                m * m * m * p0[0] + 3 * m * m * t * p1[0] + 3 * m * t * t * p2[0] + t * t * t * p3[0],
                m * m * m * p0[1] + 3 * m * m * t * p1[1] + 3 * m * t * t * p2[1] + t * t * t * p3[1],
              ]);
            }
            return out;
          }

          // ═══════════ Transform & ukur ═══════════
          // place: petakan koordinat satuan (-1..1) ke piksel. scale = setengah ukuran dalam px.
          export function place(polys: Poly[], cx: number, cy: number, scale: number, rot = 0): Poly[] {
            const c = Math.cos(rot), s = Math.sin(rot);
            return polys.map(p => ({
              closed: p.closed,
              pts: p.pts.map(([x, y]) => [cx + (x * c - y * s) * scale, cy + (x * s + y * c) * scale] as Pt),
            }));
          }

          export function polyLen(p: Poly): number {
            const pts = p.closed ? [...p.pts, p.pts[0]] : p.pts;
            let t = 0;
            for (let i = 1; i < pts.length; i++) t += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
            return t;
          }

          // n titik merata sepanjang garis (untuk efek partikel yang membentuk ikon)
          export function samplePoly(p: Poly, n: number): Pt[] {
            const pts = p.closed ? [...p.pts, p.pts[0]] : p.pts;
            const segs: number[] = [];
            let total = 0;
            for (let i = 1; i < pts.length; i++) {
              const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
              segs.push(d);
              total += d;
            }
            const out: Pt[] = [];
            if (total === 0 || n <= 0) return out;
            let si = 0, acc = 0;
            for (let k = 0; k < n; k++) {
              const target = (k / n) * total;
              while (si < segs.length - 1 && acc + segs[si] < target) { acc += segs[si]; si++; }
              const f = segs[si] ? (target - acc) / segs[si] : 0;
              out.push([lerp(pts[si][0], pts[si + 1][0], f), lerp(pts[si][1], pts[si + 1][1], f)]);
            }
            return out;
          }

          // ═══════════ Menggambar ═══════════
          // Membuat path sebagian garis (t0..t1 = 0..1 sepanjang garis). Pakai untuk animasi "draw-on".
          export function pathPoly(ctx: CanvasRenderingContext2D, poly: Poly, t0 = 0, t1 = 1) {
            const pts = poly.closed ? [...poly.pts, poly.pts[0]] : poly.pts;
            const segs: number[] = [];
            let total = 0;
            for (let i = 1; i < pts.length; i++) {
              const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
              segs.push(d);
              total += d;
            }
            const a = clamp(t0, 0, 1) * total, b = clamp(t1, 0, 1) * total;
            ctx.beginPath();
            if (total === 0 || b - a <= 0) return;
            let acc = 0, started = false;
            for (let i = 0; i < segs.length; i++) {
              const s0 = acc, s1 = acc + segs[i];
              acc = s1;
              if (s1 < a || s0 > b) continue;
              const ta = Math.max(a, s0), tb = Math.min(b, s1);
              const d = segs[i] || 1;
              const k0 = (ta - s0) / d, k1 = (tb - s0) / d;
              const x0 = lerp(pts[i][0], pts[i + 1][0], k0), y0 = lerp(pts[i][1], pts[i + 1][1], k0);
              const x1 = lerp(pts[i][0], pts[i + 1][0], k1), y1 = lerp(pts[i][1], pts[i + 1][1], k1);
              if (!started) { ctx.moveTo(x0, y0); started = true; }
              ctx.lineTo(x1, y1);
            }
          }
          export function strokePoly(ctx: CanvasRenderingContext2D, poly: Poly, t0 = 0, t1 = 1) {
            pathPoly(ctx, poly, t0, t1);
            ctx.stroke();
          }
          export function fillPoly(ctx: CanvasRenderingContext2D, poly: Poly) {
            if (!poly.pts.length) return;
            ctx.beginPath();
            poly.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
            ctx.closePath();
            ctx.fill();
          }

          // Garis neon: halo berlapis (tanpa shadowBlur, cepat di 4K) + inti terang. t0..t1 = bagian garis yang tampil.
          export function neon(ctx: CanvasRenderingContext2D, polys: Poly[], color: string, width: number,
                               t0 = 0, t1 = 1, intensity = 1) {
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalCompositeOperation = 'lighter';
            const layers: [number, number, string][] = [
              [9, 0.035, color], [5, 0.07, color], [2.6, 0.16, color],
              [1, 0.95, color], [0.38, 0.9, mixHex(color, '#ffffff', 0.72)],
            ];
            for (const [mult, alpha, col] of layers) {
              ctx.lineWidth = width * mult;
              ctx.strokeStyle = rgba(col, alpha * intensity);
              for (const p of polys) strokePoly(ctx, p, t0, t1);
            }
            ctx.restore();
          }

          export function glowDot(ctx: CanvasRenderingContext2D, x: number, y: number, r: number, color: string, alpha = 1) {
            const g = ctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0, rgba(color, alpha));
            g.addColorStop(0.35, rgba(color, alpha * 0.35));
            g.addColorStop(1, rgba(color, 0));
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = g;
            ctx.fillRect(x - r, y - r, r * 2, r * 2);
            ctx.restore();
          }

          // ═══════════ Isometrik pseudo-3D ═══════════
          // Sumbu: x ke kanan-bawah, y ke kiri-bawah, z ke atas. s = px per satuan.
          export function isoPt(x: number, y: number, z: number, cx: number, cy: number, s: number): Pt {
            return [cx + (x - y) * s * 0.866, cy + (x + y) * s * 0.5 - z * s];
          }
          // Kotak isometrik 3 sisi dengan shading. Gambar dari belakang ke depan (urut x+y+z naik).
          export function isoBox(ctx: CanvasRenderingContext2D, x: number, y: number, z: number,
                                 w: number, d: number, h: number, color: string, cx: number, cy: number, s: number) {
            const P = (px: number, py: number, pz: number) => isoPt(px, py, pz, cx, cy, s);
            const face = (pts: Pt[], col: string) => {
              ctx.beginPath();
              pts.forEach(([a, b], i) => (i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)));
              ctx.closePath();
              ctx.fillStyle = col;
              ctx.fill();
            };
            face([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)], shade(color, -0.18)); // depan-kiri
            face([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)], shade(color, -0.38)); // depan-kanan
            face([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], shade(color, 0.22));  // atas
          }

          // ═══════════ Pustaka ikon (koordinat -1..1) ═══════════
          function cloudOutline(): Poly {
            const circles: [number, number, number][] = [[-0.45, 0.15, 0.3], [-0.05, -0.1, 0.45], [0.4, 0.1, 0.35]];
            const inRect = (x: number, y: number) => x > -0.45 && x < 0.4 && y > 0.15 && y < 0.45;
            const inCircle = (x: number, y: number, c: [number, number, number], eps: number) =>
              Math.hypot(x - c[0], y - c[1]) < c[2] - eps;
            const pts: Pt[] = [];
            circles.forEach((c, ci) => {
              for (let i = 0; i < 160; i++) {
                const a = (i / 160) * TAU;
                const x = c[0] + Math.cos(a) * c[2], y = c[1] + Math.sin(a) * c[2];
                const hidden = circles.some((o, oi) => oi !== ci && inCircle(x, y, o, 0.004)) || inRect(x, y);
                if (!hidden) pts.push([x, y]);
              }
            });
            for (let i = 0; i <= 24; i++) pts.push([lerp(-0.45, 0.4, i / 24), 0.45]);
            pts.sort((p, q) => Math.atan2(p[1] - 0.1, p[0]) - Math.atan2(q[1] - 0.1, q[0]));
            return { pts, closed: true };
          }

          function shieldOutline(): Poly {
            const right: Pt[] = [[0, -0.9], [0.78, -0.62], [0.78, 0.02], ...bezierP([0.78, 0.02], [0.78, 0.5], [0.38, 0.76], [0, 0.94], 24).slice(1)];
            const left: Pt[] = right.slice(1, -1).map(([x, y]) => [-x, y] as Pt).reverse();
            return { pts: [...right, ...left], closed: true };
          }

          function heartOutline(): Poly {
            const pts: Pt[] = [];
            for (let i = 0; i < 120; i++) {
              const t = (i / 120) * TAU;
              const x = 16 * Math.pow(Math.sin(t), 3);
              const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
              pts.push([(x / 16) * 0.85, ((y - 2.5) / 17) * 0.9]);
            }
            return { pts, closed: true };
          }

          function gearOutline(): Poly {
            const teeth = 8, pts: Pt[] = [];
            for (let k = 0; k < teeth; k++) {
              const a = (k / teeth) * TAU;
              const prof: [number, number][] = [[-0.2, 0.66], [-0.11, 0.86], [0.11, 0.86], [0.2, 0.66]];
              for (const [da, r] of prof) pts.push([Math.cos(a + da) * r, Math.sin(a + da) * r]);
            }
            return { pts, closed: true };
          }

          export const ICONS: Record<string, () => Poly[]> = {
            folder: () => [roundRectP(-0.9, -0.45, 1.8, 1.25, 0.1), polyP([[-0.9, -0.45], [-0.9, -0.66], [-0.3, -0.66], [-0.12, -0.45]])],
