          import { TAU, mulberry32, rgba, mixHex, breathe, seg, easeOutCubic } from './kit';
          import { ICONS, neon, place, glowDot, type Poly } from './shapes';
          import type { DrawFn } from './CanvasScene';

          // Template neon bawaan: dipakai bila kode AI gagal validasi. Ikon utama + ikon lencana,
          // garis cahaya berjalan, cincin gelombang, dan titik orbit. Loop sempurna.
          export function makeNeonIconDraw(keys: string[]): DrawFn {
            return (ctx, s) => {
              const { w, h, u, phase, colors, cx, cy } = s;
              const m = Math.min(w, h);
              const hero = (ICONS[keys[0]] || ICONS.cloud)();
              const badge = keys[1] && ICONS[keys[1]] ? ICONS[keys[1]]() : null;
              const float = Math.sin(phase * TAU) * 7 * u;
              const size = m * 0.25;
              const hy = cy + float;

              glowDot(ctx, cx, hy, m * 0.55, colors.primary, 0.16 + 0.05 * breathe(phase, 1));

              // cincin gelombang
              for (let i = 0; i < 3; i++) {
                const p = (phase * 1 + i / 3) % 1;
                const r = m * (0.2 + 0.28 * easeOutCubic(p));
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.lineWidth = 1.4 * u;
                ctx.strokeStyle = rgba(colors.secondary, 0.35 * (1 - p));
                ctx.beginPath();
                ctx.arc(cx, hy, r, 0, TAU);
                ctx.stroke();
                ctx.restore();
              }

              const polys: Poly[] = place(hero, cx, hy, size);
              const lw = 3.2 * u;
              neon(ctx, polys, colors.primary, lw);

              // cahaya berjalan sepanjang garis ikon
              const t0 = phase, t1 = phase + 0.14;
              const lit = (a: number, b: number) => neon(ctx, polys, colors.secondary, lw * 1.15, a, b, 1.1);
              if (t1 <= 1) lit(t0, t1); else { lit(t0, 1); lit(0, t1 - 1); }

              // ikon lencana
              if (badge) {
                const bx = cx + size * 0.95, by = hy + size * 0.85;
                glowDot(ctx, bx, by, size * 0.7, colors.secondary, 0.14);
                neon(ctx, place(badge, bx, by, size * 0.34), colors.secondary, lw * 0.8);
              }

              // titik orbit
              const N = 14;
              for (let i = 0; i < N; i++) {
                const a = (i / N) * TAU + phase * TAU;
                const rx = m * 0.42, ry = m * 0.3;
                const x = cx + Math.cos(a) * rx, y = hy + Math.sin(a) * ry;
                const back = Math.sin(a) < 0 ? 0.45 : 1;
                glowDot(ctx, x, y, (11 + 8 * back) * u, i % 2 ? colors.primary : colors.secondary, 0.95 * back);
              }
            };
          }
          EOF

