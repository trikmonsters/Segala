          Previous code:
          ${FENCE}ts
          ${prevCode}
          ${FENCE}
          Fix the problem and return the COMPLETE corrected file.
          ` : "";
            return `You are an elite motion-graphics coder (think top icon-animation studios and Shadertoy-level craft)
          writing ONE Canvas 2D draw function for a premium 4K stock motion graphic. Remotion renders it frame by
          frame, three times: on a dark premium backdrop, on pure black, and on chroma-key green.

          ═══ THE IDEA ═══
          ${JSON.stringify(spec, null, 2)}

          ═══ FILE CONTRACT ═══
          Return ONE TypeScript file in a single ${FENCE}ts block and nothing else. It must:
           1. import ONLY from '../lib/kit' and (type only) from '../lib/CanvasScene';
           2. export const draw: DrawFn = (ctx, s) => { ... };
          The harness paints the background BEFORE draw(). Do not fill the whole frame, and do not add a vignette
          or grain (the harness does that for the dark variant only).

          State s: s.w, s.h (3840x2160 landscape or 2160x3840 portrait), s.cx, s.cy (centre), s.u (unit scale ≈
          min(w,h)/1000 — multiply EVERY pixel size by it), s.hero (side of the centred safe square for the hero),
          s.phase (0..1 loop position — the ONLY time source), s.seconds, s.portrait, s.variant
          ('dark' | 'black' | 'green'), s.bg (effective background colour), s.colors {primary, secondary, bg}.

          KIT (from '../lib/kit'):
          ${KIT_DOC}

          ═══ NON-NEGOTIABLE RULES ═══
          1. Deterministic. No Math.random, Date, performance, window, document, fetch, timers. Create
             const rnd = mulberry32(CONSTANT) INSIDE draw() so each frame gets the same layout.
          2. SEAMLESS LOOP + THUMBNAIL. Phase 0 (= phase 1) is the fully formed, beautiful hero — it becomes the
             stock thumbnail. The transformation / assembly / flow happens in between and returns EXACTLY to the
             phase-0 state. Build timelines with seg(phase, a, b) + easing, e.g. hold 0–0.25, transform 0.25–0.55,
             re-form 0.55–0.85, hold 0.85–1. Ambient motion must be periodic too (integer cycles per loop).
             No linear drift, no one-way growth. An automatic check compares frame 0 with the last frame.
          3. CLARITY. Readable at 320 px wide: one hero, bold silhouette, at most 4 supporting elements. The hero
             fits inside a centred square of side s.hero. Works in landscape AND portrait. No tiny clutter.
          4. VARIANTS (same composition and motion in all; only the rendering of light differs):
             - 'dark' and 'black': bright, light-based look; additive glow allowed ('lighter', neonStroke). On
               'black' nothing important may be near-black (it vanishes under screen blending).
             - 'green': background is flat chroma green. NO green/teal/yellow-green hues anywhere in the subject,
               NO additive blending, NO soft glow halos or blurry shadows (they ruin keying). Crisp, opaque edges,
               flat or gradient fills with hard silhouettes. Use key-safe colours (blue, magenta, orange, white,
               violet…), derived from s.colors by hue choice if its palette is green-ish. An automatic check
               counts green-dominant subject pixels on the green variant.
          5. Performance budget ≈ 10 s per 4K frame on a CPU: <= 400k path segments, <= 3M noise() calls, NO
             per-pixel loops at full resolution. For field/surface looks use getBuffer(key, 240, 135) and drawImage
             it upscaled (imageSmoothingQuality='high'). Avoid shadowBlur — fake glow with neonStroke or
             layered radial gradients.
          6. Premium craft: stroke widths in multiples of s.u, precise geometry via the kit point helpers, palette of
             at most 3 hues + neutrals derived from s.colors, one focal highlight, never clipped pure white,
             easing on every transition, nothing flickers or pops.
          7. No text, letters, numbers, logos, brands, people, faces, real app interfaces.
          8. Mind-blowing but readable: implement the motion story and visual language from the spec with real
             invention — the viewer should wonder how it was made — while the subject stays instantly recognisable.
          9. Complete, runnable code. No placeholders, no TODOs. It must work the first time.

          ═══ STRUCTURE EXAMPLE ═══
          ${FENCE}ts
          ${EXAMPLE}
          ${FENCE}
          ${repair}`;
          }

          // ═══════════════════════════════════════════════════════════
          // HELPERS
          // ═══════════════════════════════════════════════════════════
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          class Soft extends Error {}

          const sanitizeId = s => String(s || "").toLowerCase()
            .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50);
          function uniqueId(base, seen) {
            let id = base, n = 2;
            while (seen.has(id)) id = `${base}-${n++}`;
            return id;
          }
          const stripFence = t => String(t).trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();

          async function callModel({ prompt, parse, json = false, search = false, label, attempts = ATTEMPTS_PER_MODEL }) {
            if (!ai) return null;
            for (const model of MODELS) {
              for (let a = 1; a <= attempts; a++) {
                try {
                  console.log(`[INFO] ${label} — ${model} (${a}/${attempts})`);
                  const config = { temperature: 1.0, topP: 0.95 };
                  if (search) config.tools = [{ googleSearch: {} }];
                  else if (json) config.responseMimeType = "application/json";
                  const res = await ai.models.generateContent({ model, contents: prompt, config });
                  try {
                    return parse(res.text || "");
                  } catch (pe) {
                    throw new Soft(pe.message);
                  }
                } catch (e) {
                  const msg = String(e?.message || e);
                  console.warn(`[FAILED] ${label} ${model} #${a}: ${msg.slice(0, 300)}`);
                  if (!(e instanceof Soft) && /404|NOT_FOUND|not found|401|403|API key|PERMISSION_DENIED/i.test(msg)) break;
                  if (a < attempts) await sleep(2000 * 2 ** (a - 1));
                }
              }
            }
            return null;
          }

          // ── Idea parsing / validation ──
          function parseIdea(raw, a, siblings) {
            const d = JSON.parse(stripFence(raw));
            const c = d.composition;
            if (!c) throw new Error("missing composition");
            if (!TYPES.includes(c.type)) c.type = "geometric-transform";
            for (const k of ["primaryColor", "secondaryColor", "bgColor"])
              if (!HEX.test(c[k] || "")) throw new Error(`invalid ${k}: ${c[k]}`);
            for (const k of ["title", "stockTitle", "description", "concept", "topic", "primarySearchIntent", "useCase", "editorUsage"])
              if (!d[k] || typeof d[k] !== "string") throw new Error(`missing ${k}`);
            if (!d.visualSpec || typeof d.visualSpec.heroSubject !== "string") throw new Error("missing visualSpec.heroSubject");
            if (!(Number(d.demand?.score) >= 6)) throw new Error(`demand score too low: ${d.demand?.score}`);

            const kws = [...new Set((d.keywords || []).map(k => String(k).toLowerCase().trim()).filter(Boolean))].slice(0, 49);
            if (kws.length < 20) throw new Error("not enough keywords");

            const seen = new Set([...previousIds, ...siblings.map(s => s.id)]);
            const base = sanitizeId(d.id || d.title);
            if (!base) throw new Error("empty id");

            d.id = uniqueId(base, seen);
            d.sector = a.sector;
            d.keywords = kws;
            d.stockTitle = d.stockTitle.slice(0, 200);
            c.durationSeconds = Math.min(12, Math.max(8, Math.round(Number(c.durationSeconds) || 10)));
            d.creative = { ...a };
            return d;
          }

          // ── Code parsing / static safety check ──
          const BANNED = [
            [/\bMath\.random\b/, "Math.random"],
            [/\bDate\b/, "Date"],
            [/\bperformance\b/, "performance"],
            [/\bwindow\b/, "window"],
            [/\bdocument\b/, "document (use getBuffer from the kit)"],
            [/\bglobalThis\b/, "globalThis"],
            [/\bfetch\s*\(/, "fetch"],
            [/\b(XMLHttpRequest|WebSocket|localStorage|sessionStorage)\b/, "network/storage API"],
            [/\beval\s*\(|\bnew\s+Function\b|\bFunction\s*\(/, "eval/Function"],
            [/\brequire\s*\(|\bimport\s*\(/, "dynamic import/require"],
            [/\bprocess\s*\./, "process"],
            [/\b(setTimeout|setInterval|requestAnimationFrame)\b/, "timers"],
          ];

          function staticCheck(code) {
            if (code.length < 400) return "code too short";
            if (code.length > 30000) return "code too long";
            if (!/export\s+const\s+draw\b/.test(code)) return "must contain: export const draw: DrawFn = (ctx, s) => { ... }";
            if (/^\s*import\s+['"]/m.test(code)) return "side-effect imports are not allowed";
            const imports = [...code.matchAll(/^\s*import\s+[^;]*?from\s+['"]([^'"]+)['"]/gm)].map(m => m[1]);
            const bad = imports.filter(p => !ALLOWED_IMPORTS.includes(p));
            if (bad.length) return `imports not allowed: ${bad.join(", ")}`;
            const bare = code.replace(/\/\*[\s\S]*?\*\//g, "").replace(/(^|[^:])\/\/.*$/gm, "$1");
            for (const [re, name] of BANNED) if (re.test(bare)) return `forbidden API used: ${name}`;
            return null;
          }

          function parseCode(raw) {
            const m = String(raw).match(/```(?:ts|typescript|tsx|js)?\s*\n([\s\S]*?)```/);
            const code = (m ? m[1] : String(raw)).trim();
            const err = staticCheck(code);
            if (err) throw new Error(err);
            return code;
          }

          // ── Runtime validation (child process TANPA API key) ──
          function runtimeValidate(id, colors, frames) {
            const env = { ...process.env };
            delete env.GEMINI_API_KEY;
            const r = spawnSync("node", ["validate.mjs", id, JSON.stringify(colors), String(frames)], {
              cwd: RP, env, encoding: "utf8", timeout: 10 * 60 * 1000,
            });
            if (r.status === 0) {
              console.log(`[VALIDATE OK] ${id} ${(r.stdout || "").trim().slice(-200)}`);
              return null;
            }
            return ((r.stderr || "") + (r.stdout || "")).trim().slice(-1800) || "unknown validation error";
          }

          async function buildCode(idea) {
            const c = idea.composition;
            const colors = { primary: c.primaryColor, secondary: c.secondaryColor, bg: c.bgColor };
            const frames = Math.round(c.durationSeconds * 30);
            const file = `${CUSTOM_DIR}/${idea.id}.ts`;
            let prevCode = "", lastError = "";

            for (let attempt = 1; attempt <= CODE_ATTEMPTS; attempt++) {
              const code = await callModel({
                prompt: codePrompt(idea, prevCode, lastError),
                label: `code ${idea.id} #${attempt}`,
                parse: parseCode,
              });
              if (!code) break;
              fs.writeFileSync(file, code);
              const err = runtimeValidate(idea.id, colors, frames);
              if (!err) return true;
              console.warn(`[CODE FAIL] ${idea.id} #${attempt}: ${err.slice(0, 500)}`);
              prevCode = code;
              lastError = err;
            }
            fs.rmSync(file, { force: true });
            return false;
          }

          // ── Fallback statis (engine abstrak bawaan; hanya varian dark) ──
          const FALLBACK = [
            { id: "neural-bloom", title: "Neural Bloom", concept: "GROWTH vs DECAY — neurons unfurl like bioluminescent roots",
              description: "Abstract neural network unfurling organically like bioluminescent roots.",
              keywords: ["neural network", "abstract background", "motion", "loop", "4K", "ai", "technology", "growth", "digital", "brain", "connection", "synapse", "data", "future", "innovation", "conceptual", "organic", "science", "dark background", "glow", "vertical"],
              composition: { type: "neural-network", primaryColor: "#6366f1", secondaryColor: "#22d3ee", bgColor: "#020617", animationStyle: "organic", durationSeconds: 15, elements: [] } },
            { id: "tidal-fragments", title: "Tidal Fragments", concept: "ORDER vs CHAOS — particles snap into a perfect ring then dissolve",
              description: "Particles converge into a luminous ring before dissolving into chaos.",
              keywords: ["particles", "abstract background", "motion", "loop", "4K", "ring", "transformation", "innovation", "digital", "future", "conceptual", "glow", "dynamic", "fluid", "energy", "orbit", "cinematic", "science", "dark background", "technology", "vertical"],
              composition: { type: "particle-morph", primaryColor: "#f59e0b", secondaryColor: "#ec4899", bgColor: "#0a0a0a", animationStyle: "fluid", durationSeconds: 15, elements: [] } },
            { id: "data-river", title: "Data River", concept: "SPEED vs STILLNESS — packets rush while the background holds perfectly still",
              description: "Streaming data packets with luminous trails across a calm field.",
              keywords: ["data flow", "abstract background", "motion", "loop", "4K", "stream", "network", "technology", "speed", "digital", "information", "future", "connection", "cyber", "conceptual", "bandwidth", "signal", "transmission", "dark background", "lines", "vertical"],
              composition: { type: "data-flow", primaryColor: "#10b981", secondaryColor: "#3b82f6", bgColor: "#030712", animationStyle: "mechanical", durationSeconds: 15, elements: [] } },
            { id: "root-memory", title: "Root Memory", concept: "FRAGILITY vs STRENGTH — thin branches thicken into a resilient root system",
              description: "Fractal branches growing and thickening like an ancient root system.",
              keywords: ["organic growth", "abstract background", "motion", "loop", "4K", "branches", "roots", "fractal", "nature", "life", "green", "evolution", "conceptual", "botanical", "tree", "structure", "biology", "cinematic", "macro", "dark background", "vertical"],
              composition: { type: "organic-growth", primaryColor: "#22c55e", secondaryColor: "#a3e635", bgColor: "#0c1510", animationStyle: "organic", durationSeconds: 15, elements: [] } },
            { id: "prism-fold", title: "Prism Fold", concept: "ISOLATION vs CONNECTION — nested polygons fold inward until they intersect",
              description: "Nested polygons rotating and folding inward until their edges intersect.",
              keywords: ["geometric", "abstract background", "motion", "loop", "4K", "polygon", "shape", "geometry", "structure", "business", "strategy", "minimal", "modern", "conceptual", "digital", "design", "symmetry", "kaleidoscope", "mathematics", "dark background", "vertical"],
              composition: { type: "geometric-transform", primaryColor: "#a855f7", secondaryColor: "#f472b6", bgColor: "#0b0614", animationStyle: "mechanical", durationSeconds: 15, elements: [] } },
          ];

          function fallbackIdea(i, a, siblings) {
            const v = JSON.parse(JSON.stringify(FALLBACK[i % FALLBACK.length]));
            const seen = new Set([...previousIds, ...siblings.map(s => s.id)]);
            v.id = uniqueId(`${v.id}-${RUN}`, seen);
            v.stockTitle = `${v.title} abstract motion background. 4K video, seamless loop.`;
            v.sector = "abstract backgrounds";
            v.topic = v.title;
            v.creative = { ...a, sector: "abstract backgrounds" };
            v.codeMode = "builtin";
            return v;
          }

          function writeRegistry(videos) {
            const custom = videos.filter(v => v.codeMode === "custom");
            if (custom.length === 0) {
              fs.writeFileSync(`${RP}/src/registry.tsx`,
                `import React from 'react';\nexport const CUSTOM: Record<string, React.FC<any>> = {};\n`);
              return;
            }
            const imports = custom.map((v, i) => `import { draw as d${i} } from './custom/${v.id}';`).join("\n");
            const entries = custom.map((v, i) => {
              const c = v.composition;
              const colors = JSON.stringify({ primary: c.primaryColor, secondary: c.secondaryColor, bg: c.bgColor });
              return `  '${v.id}': ({ variant }: { variant: Variant }) => <CanvasScene draw={d${i}} colors={${colors}} variant={variant} />,`;
            }).join("\n");
            fs.writeFileSync(`${RP}/src/registry.tsx`,
              `import React from 'react';\nimport { CanvasScene } from './lib/CanvasScene';\nimport type { Variant } from './lib/CanvasScene';\n${imports}\n\n` +
              `export const CUSTOM: Record<string, React.FC<{ variant: Variant }>> = {\n${entries}\n};\n`);
          }

          // ═══════════════════════════════════════════════════════════
          // MAIN
          // ═══════════════════════════════════════════════════════════
          async function main() {
            fs.mkdirSync(CUSTOM_DIR, { recursive: true });
            const videos = [];

            if (!ai) {
              console.warn("[WARN] GEMINI_API_KEY tidak diset — memakai fallback statis.");
              for (let i = 0; i < COUNT; i++) videos.push(fallbackIdea(i, assignments[i], videos));
            } else {
              const research = await callModel({
                prompt: RESEARCH_PROMPT, search: true, label: "research", attempts: 1,
                parse: t => { if (String(t).trim().length < 200) throw new Error("research too short"); return String(t).trim(); },
              });
              console.log(research ? `[RESEARCH OK] ${research.length} chars` : "[RESEARCH] tidak tersedia");
              if (marketData) console.log(`[MARKET DATA] market-data.txt dipakai (${marketData.length} chars)`);

              const brief = [
                marketData ? `CONTRIBUTOR'S OWN MARKET DATA (highest-trust signal — weigh it above everything else):\n${marketData}` : "",
                research || "",
              ].filter(Boolean).join("\n\n");

              for (let i = 0; i < COUNT; i++) {
                const a = assignments[i];
                const idea = await callModel({
                  prompt: ideaPrompt(a, brief, videos), json: true, label: `idea ${i + 1}`,
                  parse: raw => parseIdea(raw, a, videos),
                });
                if (!idea) {
                  console.warn(`[FALLBACK] ide ${i + 1} memakai template statis`);
                  videos.push(fallbackIdea(i, a, videos));
                  continue;
                }
                idea.codeMode = (await buildCode(idea)) ? "custom" : "builtin";
                console.log(`[IDEA] ${idea.id} (${idea.sector} / ${idea.topic}) → ${idea.codeMode}`);
                videos.push(idea);
              }
            }

            writeRegistry(videos);
            fs.writeFileSync(OUTPUT_PATH, JSON.stringify({ videos }, null, 2));
            console.log(`Selesai: ${videos.map(v => `${v.id}(${v.codeMode})`).join(", ")}`);
          }

          await main();
          GENEOF

      - name: Write Remotion code
        run: |
          cd remotion-project

          cat > src/index.ts <<'EOF'
          import { registerRoot } from 'remotion';
          import { RemotionRoot } from './Root';
          registerRoot(RemotionRoot);
          EOF

          # Engine abstrak bawaan: fallback bila ide/kode AI gagal
          cat > src/Scene.tsx <<'EOF'
          import React, { useMemo } from 'react';
          import { AbsoluteFill, useCurrentFrame, useVideoConfig, interpolate, Easing } from 'remotion';

          const seeded = (i: number, s: number) => {
            const x = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453;
            return x - Math.floor(x);
          };

          type Idea = { id: string; type: string; colors: { primary: string; secondary: string; bg: string }; duration: number };
          type C = { primary: string; secondary: string };

          const Defs: React.FC = () => (
            <defs>
              <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="b" />
                <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
            </defs>
          );

          const NeuralNetwork: React.FC<{ w: number; h: number; c: C }> = ({ w, h, c }) => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();
            const nodes = useMemo(() => Array.from({ length: 70 }, (_, i) => {
              const a = seeded(i, 1) * Math.PI * 2;
              const r = Math.sqrt(seeded(i, 2)) * Math.min(w, h) * 0.38;
              return { x: w / 2 + Math.cos(a) * r, y: h / 2 + Math.sin(a) * r * 0.85,
                size: 2 + seeded(i, 3) * 4, delay: seeded(i, 4) * 0.5, pulse: seeded(i, 5) * 6.28 };
            }), [w, h]);
            const links = useMemo(() => {
              const out: any[] = [];
              for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
                const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < Math.min(w, h) * 0.2 && seeded(i * 100 + j, 20) > 0.65)
                  out.push({ from: i, to: j, delay: seeded(i * 100 + j, 21) * 0.4 });
              }
              return out;
            }, [nodes, w, h]);
            const prog = interpolate(frame, [0, fps * 5], [0, 1], { extrapolateRight: 'clamp', easing: Easing.out(Easing.cubic) });
            return (
              <svg width={w} height={h} style={{ position: 'absolute' }}>
                <Defs />
                {links.map((l, i) => {
                  const f = nodes[l.from], t = nodes[l.to];
                  const p = Math.max(0, Math.min(1, (prog - 0.35 - l.delay) / 0.4));
                  if (p <= 0) return null;
                  return <line key={i} x1={f.x} y1={f.y} x2={f.x + (t.x - f.x) * p} y2={f.y + (t.y - f.y) * p} stroke={c.secondary} strokeWidth={1.2} opacity={0.5 * p} />;
                })}
                {nodes.map((n, i) => {
                  const p = Math.max(0, Math.min(1, (prog - n.delay) / 0.5));
                  if (p <= 0) return null;
                  const pulse = 0.7 + Math.sin(frame / 18 + n.pulse) * 0.3;
                  return (
                    <g key={i}>
                      <circle cx={n.x} cy={n.y} r={n.size * 4 * p} fill={c.primary} opacity={0.08 * p} />
                      <circle cx={n.x} cy={n.y} r={n.size * p * pulse} fill={i % 3 === 0 ? c.secondary : c.primary} opacity={0.9 * p} filter="url(#glow)" />
                      <circle cx={n.x} cy={n.y} r={n.size * 0.35 * p} fill="#fff" opacity={0.85 * p} />
                    </g>
                  );
                })}
              </svg>
            );
          };

          const ParticleMorph: React.FC<{ w: number; h: number; c: C }> = ({ w, h, c }) => {
            const frame = useCurrentFrame();
            const { fps, durationInFrames } = useVideoConfig();
            const particles = useMemo(() => Array.from({ length: 200 }, (_, i) => {
              const sx = seeded(i, 1) * w, sy = seeded(i, 2) * h;
              const a = seeded(i, 3) * Math.PI * 2;
              const r = Math.min(w, h) * 0.28;
              return { sx, sy, tx: w / 2 + Math.cos(a) * r, ty: h / 2 + Math.sin(a) * r,
                size: 1.5 + seeded(i, 4) * 2.5, delay: seeded(i, 5) * 0.5, hue: seeded(i, 6) };
            }), [w, h]);
            const inP = interpolate(frame, [0, fps * 3.5], [0, 1], { extrapolateRight: 'clamp', easing: Easing.inOut(Easing.cubic) });
            const outP = interpolate(frame, [durationInFrames - fps * 2, durationInFrames], [0, 1], { extrapolateLeft: 'clamp' });
            return (
              <>
                {particles.map((p, i) => {
                  const local = Math.max(0, Math.min(1, (inP - p.delay) / (1 - p.delay)));
                  const e = 1 - Math.pow(1 - local, 3);
                  const orbit = Math.sin(frame / 30 + p.delay * 10) * 8;
                  const x = p.sx + (p.tx - p.sx) * e + Math.cos(orbit) * orbit;
                  const y = p.sy + (p.ty - p.sy) * e + Math.sin(orbit) * orbit;
                  const col = p.hue > 0.5 ? c.primary : c.secondary;
                  return <div key={i} style={{
                    position: 'absolute', left: x, top: y, width: p.size, height: p.size,
                    borderRadius: '50%', background: col,
                    opacity: Math.min(1, local * 2) * (1 - outP * 0.5) }} />;
                })}
              </>
            );
          };

          const DataFlow: React.FC<{ w: number; h: number; c: C }> = ({ w, h, c }) => {
            const frame = useCurrentFrame();
            const streams = useMemo(() => Array.from({ length: 18 }, (_, i) => ({
              y: (i + 0.5) * (h / 18), speed: 0.3 + seeded(i, 1) * 0.9,
              offset: seeded(i, 2) * w, thickness: 1 + seeded(i, 3) * 2, hue: seeded(i, 4),
            })), [h]);
            return (
              <>
                {streams.map((s, i) => (
                  <div key={`l${i}`} style={{ position: 'absolute', left: 0, top: s.y, width: w, height: s.thickness,
                    background: `linear-gradient(90deg, transparent, ${s.hue > 0.5 ? c.primary : c.secondary}22, transparent)` }} />
                ))}
                {streams.map((s, i) => {
                  const x = (s.offset + frame * s.speed * 6) % (w + 200) - 100;
                  const col = s.hue > 0.5 ? c.primary : c.secondary;
                  return (
                    <div key={`d${i}`}>
                      {[0,1,2,3,4].map(k => {
                        const size = 6 - k * 0.9;
                        return <div key={k} style={{ position: 'absolute', left: x - k * 12, top: s.y - size / 2,
                          width: size, height: size, borderRadius: '50%', background: col,
                          opacity: (1 - k / 5) * 0.9 }} />;
                      })}
                    </div>
                  );
                })}
                {[0,1,2].map(i => (
                  <div key={`v${i}`} style={{ position: 'absolute', left: w * (0.3 + i * 0.2), top: 0,
                    width: 1.5, height: h,
                    background: `linear-gradient(180deg, transparent, ${c.secondary}33, transparent)` }} />
                ))}
              </>
            );
          };

          const OrganicGrowth: React.FC<{ w: number; h: number; c: C }> = ({ w, h, c }) => {
            const frame = useCurrentFrame();
            const { fps } = useVideoConfig();
            const branches = useMemo(() => {
              const out: any[] = [];
              const grow = (x: number, y: number, a: number, len: number, d: number, id: number, delay: number) => {
                const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len;
                out.push({ x1: x, y1: y, x2: ex, y2: ey, d, delay });
                if (d < 5) {
                  const nl = len * 0.72;
                  grow(ex, ey, a - 0.4 - seeded(id, 1) * 0.3, nl, d + 1, id * 2, delay + 0.05);
                  grow(ex, ey, a + 0.4 + seeded(id, 2) * 0.3, nl, d + 1, id * 2 + 1, delay + 0.05);
                }
              };
              grow(w / 2, h * 0.9, -Math.PI / 2, Math.min(w, h) * 0.14, 0, 1, 0);
              return out;
            }, [w, h]);
            const prog = interpolate(frame, [0, fps * 5.5], [0, 1], { extrapolateRight: 'clamp', easing: Easing.inOut(Easing.quad) });
            return (
              <svg width={w} height={h} style={{ position: 'absolute' }}>
                {branches.map((b, i) => {
                  const p = Math.max(0, Math.min(1, (prog - b.delay) / (1 - b.delay)));
                  if (p <= 0) return null;
                  return <line key={i} x1={b.x1} y1={b.y1} x2={b.x1 + (b.x2 - b.x1) * p} y2={b.y1 + (b.y2 - b.y1) * p}
                    stroke={b.d % 2 === 0 ? c.primary : c.secondary} strokeWidth={3 - b.d * 0.4} opacity={0.7 - b.d * 0.1} strokeLinecap="round" />;
                })}
                {branches.filter(b => b.d === 5).map((b, i) => {
                  const p = Math.max(0, Math.min(1, (prog - b.delay) / (1 - b.delay)));
                  if (p <= 0) return null;
                  return <circle key={`t${i}`} cx={b.x2} cy={b.y2} r={3 + Math.sin(frame / 15 + i) * 0.8} fill={c.secondary} opacity={0.7 * p} />;
                })}
              </svg>
            );
          };

          const GeometricTransform: React.FC<{ w: number; h: number; c: C }> = ({ w, h, c }) => {
            const frame = useCurrentFrame();
            const { durationInFrames } = useVideoConfig();
            const shapes = useMemo(() => Array.from({ length: 5 }, (_, i) => ({
              sides: 3 + i, radius: Math.min(w, h) * (0.12 + i * 0.06),
              rotation: seeded(i, 1) * Math.PI, speed: (seeded(i, 2) - 0.5) * 0.02, hue: seeded(i, 3),
            })), [w, h]);
            const prog = interpolate(frame, [0, durationInFrames], [0, 1]);
            const poly = (cx: number, cy: number, r: number, sides: number, rot: number) => {
              const pts: string[] = [];
              for (let k = 0; k < sides; k++) {
                const a = rot + (k / sides) * Math.PI * 2;
                pts.push(`${cx + Math.cos(a) * r},${cy + Math.sin(a) * r}`);
              }
              return pts.join(' ');
            };
            return (
              <svg width={w} height={h} style={{ position: 'absolute' }}>
                <Defs />
                {shapes.map((s, i) => {
                  const rot = s.rotation + frame * s.speed;
                  const scale = 0.7 + Math.sin(frame / 40 + i) * 0.15 + prog * 0.4;
                  const r = s.radius * scale;
                  const col = s.hue > 0.5 ? c.primary : c.secondary;
                  return (
                    <g key={i} filter="url(#glow)">
                      <polygon points={poly(w / 2, h / 2, r, s.sides, rot)} fill="none" stroke={col} strokeWidth={2} opacity={0.7} />
                      <polygon points={poly(w / 2, h / 2, r * 0.96, s.sides, rot + 0.1)} fill="none" stroke={col} strokeWidth={1} opacity={0.3} />
                    </g>
                  );
                })}
                {shapes.map((s, i) => {
                  const rot = s.rotation + frame * s.speed;
                  const r = s.radius * (0.7 + Math.sin(frame / 40 + i) * 0.15 + prog * 0.4);
                  const col = s.hue > 0.5 ? c.primary : c.secondary;
                  return (
                    <g key={`v${i}`}>
                      {Array.from({ length: s.sides }).map((_, k) => {
                        const a = rot + (k / s.sides) * Math.PI * 2;
                        return <circle key={k} cx={w / 2 + Math.cos(a) * r} cy={h / 2 + Math.sin(a) * r} r={3} fill={col} opacity={0.9} />;
                      })}
                    </g>
                  );
                })}
              </svg>
            );
          };

          export const Scene: React.FC<{ idea: Idea }> = ({ idea }) => {
            const frame = useCurrentFrame();
            const { fps, durationInFrames, width, height } = useVideoConfig();
            const { primary, secondary, bg } = idea.colors;
            const camX = Math.sin(frame / 100) * width * 0.008;
            const camY = Math.cos(frame / 120) * height * 0.006;
            const camZoom = 1 + Math.sin(frame / 160) * 0.006;
            const gradAngle = interpolate(frame, [0, durationInFrames], [135, 225]);
            const exitOp = interpolate(frame, [durationInFrames - fps * 1.5, durationInFrames - fps * 0.3], [1, 0], { extrapolateLeft: 'clamp', extrapolateRight: 'clamp' });
            const c = { primary, secondary };
            const engine = (() => {
              switch (idea.type) {
                case 'particle-morph': return <ParticleMorph w={width} h={height} c={c} />;
                case 'data-flow': return <DataFlow w={width} h={height} c={c} />;
                case 'organic-growth': return <OrganicGrowth w={width} h={height} c={c} />;
                case 'geometric-transform': return <GeometricTransform w={width} h={height} c={c} />;
                default: return <NeuralNetwork w={width} h={height} c={c} />;
              }
            })();
            return (
              <AbsoluteFill style={{ background: bg, overflow: 'hidden', opacity: exitOp }}>
                <AbsoluteFill style={{ background: `linear-gradient(${gradAngle}deg, ${bg} 0%, ${bg} 50%, ${primary}12 100%)` }} />
                <AbsoluteFill style={{ background: `radial-gradient(circle at 50% 50%, ${primary}08 0%, transparent 65%)` }} />
                <AbsoluteFill style={{ transform: `translate(${camX}px, ${camY}px) scale(${camZoom})` }}>
                  {engine}
                </AbsoluteFill>
                <AbsoluteFill style={{ background: `radial-gradient(ellipse at center, transparent 50%, ${bg} 110%)`, mixBlendMode: 'multiply', pointerEvents: 'none' }} />
              </AbsoluteFill>
            );
          };
          EOF

          # Ide custom → 4 render (dark 16:9, dark 9:16, green 16:9, black 16:9). Ide fallback → 2 render (dark).
          cat > src/Root.tsx <<'EOF'
          import React from 'react';
          import { Composition } from 'remotion';
          import { Scene } from './Scene';
          import { IDEAS } from './ideas';
          import { CUSTOM } from './registry';

          const ASPECTS: Record<string, [number, number]> = {
            '16x9': [3840, 2160],
            '9x16': [2160, 3840],
          };

          const jobsFor = (custom: boolean): [string, string][] =>
            custom
              ? [['dark', '16x9'], ['dark', '9x16'], ['green', '16x9'], ['black', '16x9']]
              : [['dark', '16x9'], ['dark', '9x16']];

          export const RemotionRoot: React.FC = () => (
            <>
              {IDEAS.map((idea: any) => {
                const Custom = CUSTOM[idea.id];
                const frames = Math.round(idea.duration * 30);
                return (
                  <React.Fragment key={idea.id}>
                    {jobsFor(!!Custom).map(([variant, aspect]) => {
                      const [width, height] = ASPECTS[aspect];
                      const id = `${idea.id}-${variant}-${aspect}-4k`;
                      return Custom ? (
                        <Composition
                          key={id}
                          id={id}
                          component={Custom as any}
                          durationInFrames={frames}
                          fps={30}
                          width={width}
                          height={height}
                          defaultProps={{ variant } as any}
                        />
                      ) : (
                        <Composition
                          key={id}
                          id={id}
                          component={Scene as any}
                          durationInFrames={frames}
                          fps={30}
                          width={width}
                          height={height}
                          defaultProps={{ idea } as any}
                        />
                      );
                    })}
                  </React.Fragment>
                );
              })}
            </>
          );
          EOF

      # SECRET hanya tersedia di step ini; kode AI divalidasi di child process TANPA API key
      - name: Generate ideas + AI code (research → ideate → code → validate)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd generator
          node gen.mjs

      - name: Generate ideas.ts
        run: |
          cd remotion-project
          cat > gen-ideas.mjs <<'EOF'
          import fs from "fs";
          const data = JSON.parse(fs.readFileSync("video-ideas.json","utf8"));
          const ideas = data.videos.map(v => ({
            id: v.id,
            type: v.composition.type,
            colors: {
              primary: v.composition.primaryColor,
              secondary: v.composition.secondaryColor,
              bg: v.composition.bgColor,
            },
            duration: v.composition.durationSeconds || 15,
          }));
          fs.writeFileSync("src/ideas.ts",
            "export const IDEAS = " + JSON.stringify(ideas, null, 2) + ";\n");
          EOF
          node gen-ideas.mjs

      # Safety net: bila project gagal dimuat karena kode custom, kosongkan registry → engine bawaan
      - name: Verify project compiles (safety net)
        run: |
          cd remotion-project
          if ! npx remotion compositions src/index.ts; then
            echo "::warning::Registry bermasalah — fallback ke engine bawaan untuk semua ide"
            printf "import React from 'react';\nexport const CUSTOM: Record<string, React.FC<any>> = {};\n" > src/registry.tsx
            npx remotion compositions src/index.ts
          fi

      # Daftar render dibaca dari registry final, supaya selalu sinkron dengan Root.tsx
      - name: Build composition list
        id: comps
        run: |
          cd remotion-project
          cat > build-comps.mjs <<'EOF'
          import fs from "fs";
          const data = JSON.parse(fs.readFileSync("video-ideas.json", "utf8"));
          const reg = fs.readFileSync("src/registry.tsx", "utf8");
          const custom = new Set([...reg.matchAll(/^\s*'([a-z0-9-]+)':/gm)].map(m => m[1]));
          const list = [];
          for (const v of data.videos) {
            v.codeMode = custom.has(v.id) ? "custom" : "builtin";
            list.push(`${v.id}-dark-16x9-4k`, `${v.id}-dark-9x16-4k`);
            if (custom.has(v.id)) list.push(`${v.id}-green-16x9-4k`, `${v.id}-black-16x9-4k`);
          }
          if (list.length === 0) { console.error("Daftar komposisi kosong"); process.exit(1); }
          fs.writeFileSync("video-ideas.json", JSON.stringify(data, null, 2));
          fs.writeFileSync("comps.json", JSON.stringify(list));
          console.log(`${list.length} render:`, list.join(", "));
          EOF
          node build-comps.mjs
          echo "list=$(cat comps.json)" >> $GITHUB_OUTPUT

      # node_modules TIDAK ikut (artifact tidak menyimpan permission +x). Install bersih di job render.
      - name: Pack project (tanpa node_modules)
        run: tar --exclude='node_modules' -czf project.tgz remotion-project

      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-project
          path: project.tgz
          retention-days: 1

      - name: Upload ideas metadata
        uses: actions/upload-artifact@v4
        with:
          name: ideas-meta
          path: remotion-project/video-ideas.json
          retention-days: 1

  # ══════════════════════════════════════════════════════════
  # JOB 2 — RENDER PARALEL (max-parallel: 5)
  # ══════════════════════════════════════════════════════════
  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        comp: ${{ fromJSON(needs.prepare.outputs.comps) }}
    steps:
      - name: Download project
        uses: actions/download-artifact@v4
        with:
          name: remotion-project

      - name: Extract project
        run: tar -xzf project.tgz

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: remotion-project/package-lock.json

      - name: Install dependencies
        run: |
          cd remotion-project
          npm ci

      - name: Install system dependencies (Chrome + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libnss3 libdbus-1-3 libatk1.0-0 \
            libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 \
            libcairo2 libcups2

      - name: Render ${{ matrix.comp }}
        run: |
          cd remotion-project
          npx remotion render "${{ matrix.comp }}" "out/${{ matrix.comp }}.mp4" \
            --codec=h264 \
            --concurrency=2 \
            --jpeg-quality=92 \
            --crf=14 \
            --pixel-format=yuv420p

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.comp }}
          path: remotion-project/out/${{ matrix.comp }}.mp4
          retention-days: 1

  # ══════════════════════════════════════════════════════════
  # JOB 3 — RELEASE (tetap jalan walau sebagian render gagal)
  # ══════════════════════════════════════════════════════════
  release:
    needs: [prepare, render]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download all rendered videos
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: video-*
          merge-multiple: true
          path: final-output

      - name: Download ideas metadata
        uses: actions/download-artifact@v4
        with:
          name: ideas-meta
          path: ideas-meta

      - name: Verify output
        run: |
          mkdir -p final-output
          if ! ls final-output/*.mp4 >/dev/null 2>&1; then
            echo "::error::Tidak ada video yang berhasil dirender"
            exit 1
          fi
          ls -lh final-output/
          cp ideas-meta/video-ideas.json final-output/batch-metadata.json

      # CSV metadata siap pakai (judul ≤ 200 karakter, keyword ≤ 49), disesuaikan per varian
      - name: Build upload CSV
        run: |
          cat > make-csv.mjs <<'EOF'
          import fs from "fs";
          const ideas = JSON.parse(fs.readFileSync("ideas-meta/video-ideas.json", "utf8")).videos;
          const files = fs.readdirSync("final-output").filter(f => f.endsWith(".mp4")).sort();
          const esc = s => '"' + String(s).replace(/"/g, '""') + '"';
          const rows = ["Filename,Title,Keywords,Category,Releases"];
          for (const f of files) {
            const v = ideas.find(x => f.startsWith(x.id + "-"));
            if (!v) continue;
            let suffix = "", extra = [];
            if (f.includes("-green-")) {
              suffix = " Chroma key, green screen, green background.";
              extra = ["chroma key", "green screen", "greenscreen", "green background", "keying"];
            } else if (f.includes("-black-")) {
              suffix = " Isolated on black background.";
              extra = ["black background", "isolated on black", "overlay", "screen blend"];
            } else if (f.includes("-9x16-")) {
              suffix = " Vertical 9:16.";
              extra = ["vertical", "9:16", "portrait", "social media"];
            }
            const base = (v.keywords || []).slice(0, 49 - extra.length);
            const kws = [...new Set([...base, ...extra])].slice(0, 49);
            const title = ((v.stockTitle || v.title) + suffix).slice(0, 200);
            rows.push([esc(f), esc(title), esc(kws.join(",")), "", ""].join(","));
          }
          fs.writeFileSync("final-output/adobe-stock-upload.csv", rows.join("\n") + "\n");
          console.log("CSV rows:", rows.length - 1);
          EOF
          node make-csv.mjs

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: batch-${{ github.run_number }}
          name: "Stock 4K Batch ${{ github.run_number }}"
          files: |
            final-output/*.mp4
            final-output/batch-metadata.json
            final-output/adobe-stock-upload.csv
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # History hanya mencatat ide yang videonya benar-benar dirender & dirilis
      - name: Update history
        run: |
          [ -f history.json ] || echo '{"rendered":[],"version":1}' > history.json
          node -e "
            const fs = require('fs');
            const hist = JSON.parse(fs.readFileSync('./history.json','utf8'));
            const ideas = JSON.parse(fs.readFileSync('./ideas-meta/video-ideas.json','utf8'));
            const files = fs.readdirSync('./final-output');
            const done = ideas.videos.filter(v => files.some(f => f.startsWith(v.id + '-')));
            const rendered = done.map(v => ({
              id: v.id,
              type: v.composition.type,
              concept: v.concept || v.title,
              sector: v.sector,
              topic: v.topic,
              style: v.creative && v.creative.style,
              material: v.creative && v.creative.material,
              stockTitle: v.stockTitle,
              codeMode: v.codeMode,
              renderedAt: new Date().toISOString(),
              run: process.env.GITHUB_RUN_NUMBER,
            }));
            hist.rendered = hist.rendered.concat(rendered);
            if (hist.rendered.length > 500) hist.rendered = hist.rendered.slice(-500);
            fs.writeFileSync('./history.json', JSON.stringify(hist, null, 2));
            console.log('Ditambahkan', rendered.length, 'ide. Total history:', hist.rendered.length);
          "

      - name: Commit history to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --staged --quiet; then
            echo "No history change"
          else
            git commit -m "chore: update idea history [skip ci]"
            git push
          fi
