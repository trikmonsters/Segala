          Siblings in this batch:
          ${sib}

          ═══ OUTPUT ═══
          Output ONLY valid JSON, this exact shape:
          {
            "id": "lowercase-kebab-case-unique-max-50-chars",
            "title": "evocative artistic title, max 60 chars",
            "stockTitle": "Adobe Stock title in plain buyer language, 1–3 short sentences separated by periods, max 180 chars. Pattern: '<look> <subject> icon, <synonym phrases>. <use-case phrase>. 4K video motion graphic, seamless loop.' Do NOT mention the background (it is added per variant). No brand names, no 'AI generated'.",
            "description": "1–2 commercial sentences about the look and typical uses",
            "sector": "${a.sector}",
            "topic": "the specific topic, e.g. 'telemedicine video consultation'",
            "primarySearchIntent": "the exact phrase a buyer would type",
            "relatedSearchPhrases": ["5-8 phrases"],
            "targetBuyers": ["3-5 buyer types"],
            "useCase": "one sentence: where and how this clip is used",
            "editorUsage": "how an editor places it (overlay, key, intro element, transition...)",
            "concept": "visual metaphor in one line",
