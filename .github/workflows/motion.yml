              ? siblings.map(s => `  - ${s.sector} / ${s.topic} | ${s.creative?.style}`).join("\n")
              : "  (none yet)";
            return `You are the head of creative of a top-selling Adobe Stock motion-graphics studio. Your best sellers are
          concept animations such as: "Glowing neon line medical health record folder icon isolated on black background",
          "3D office box with folders, job search and resume sending, chroma key green screen", "cloud computing storage
