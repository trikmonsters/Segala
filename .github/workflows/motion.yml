          resample(pts,n,close=false): Pt[]                  // n evenly spaced points → morph any shape into any other
          lerpPts(a: Pt[], b: Pt[], t): Pt[]                 // morph between equal-length polylines
          tracePolyline(ctx,pts,t=1,close=false)             // adds first t (0..1) of the polyline to the current path (draw-on)
          neonStroke(ctx, trace, color, lw, intensity=1)     // glowing line; trace = () => { ctx.moveTo...; tracePolyline(...) } (no beginPath/stroke inside)
          getBuffer(key,w,h): { canvas, ctx }                // cached offscreen canvas, NOT cleared automatically`;

          const EXAMPLE = `import { mulberry32, rgba, seg, easeInOut, resample, roundedRectPts, tracePolyline, neonStroke, TAU } from '../lib/kit';
          import type { DrawFn } from '../lib/CanvasScene';

          // EXAMPLE ONLY — shows structure, kit use, variant handling and loop discipline.
          // Do NOT reuse its subject or its look.
          export const draw: DrawFn = (ctx, s) => {
            const { cx, cy, hero, u, phase, variant, colors } = s;
            const glow = variant !== 'green';                       // additive light only on dark / black
            const color = glow ? colors.primary : '#ff4d8d';        // key-safe colour on green

            // hold complete 0–0.25 · breaks apart 0.25–0.55 · re-forms 0.55–0.85 · hold 0.85–1
            const apart = easeInOut(seg(phase, 0.25, 0.55)) - easeInOut(seg(phase, 0.55, 0.85));

            const rnd = mulberry32(42);                             // same seed every frame
            const body = resample(roundedRectPts(cx, cy, hero * 0.8, hero * 0.55, hero * 0.06), 140, true)
              .map(([x, y]) => {
                const a = rnd() * TAU, d = rnd() * hero * 0.25 * apart;
                return [x + Math.cos(a) * d, y + Math.sin(a) * d] as [number, number];
              });

            const lw = 5 * u;
            const trace = () => tracePolyline(ctx, body, 1, true);
            if (glow) {
              neonStroke(ctx, trace, color, lw, 1 - 0.4 * apart);
            } else {
              ctx.lineWidth = lw;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.strokeStyle = color;
              ctx.beginPath();
              trace();
              ctx.stroke();
            }
          };`;

          function codePrompt(idea, prevCode, error) {
            const spec = {
              topic: idea.topic, useCase: idea.useCase, concept: idea.concept, noveltyHook: idea.noveltyHook,
