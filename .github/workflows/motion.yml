            "description": "1-2 commercial sentences: the look and typical uses",
            "primarySearchIntent": "${subj.buyerSearchPhrase}",
            "relatedSearchPhrases": ["5-8 phrases"],
            "demand": { "score": 1-10, "evidence": "why buyers want this" },
            "saturation": { "score": 1-10, "evidence": "how crowded this exact look is" },
            "noveltyHook": "what makes this one special",
            "keywords": ["30-49 terms, MOST important first; first 10 = strongest buyer search terms; include icon, animation, motion graphics, 4K, loop, concept; no brand names"],
            "iconHints": ["1-2 names from: ${ICON_NAMES.join(", ")}"],
            "visualSpec": {
              "composition": "layout of the hero and supporting elements (works in landscape and portrait)",
              "storyboard": ["beat 1: ...", "beat 2: ...", "beat 3: ..."],
              "wowBeat": "the memorable animated moment, precisely staged",
              "lightingNotes": ""
            }
          }
          Rules: demand.score MUST be >= 6.`;
          }

          const KIT_DOC = `── from '../lib/kit' ──
          TAU, clamp(v,a,b), lerp(a,b,t), smoothstep(a,b,x), easeInOut(t), easeOutCubic(t), easeOutBack(t)
          seg(phase,a,b)        // 0 before a, 1 after b — stage beats inside the loop
          breathe(phase,k=1)    // 0..1..0, k whole cycles per loop
          mulberry32(seed)      // seeded random 0..1
          noise(x,y,z=0,w=0), loopNoise(x,y,phase,r=1), fbm(x,y,phase,oct=4,r=1), curl(x,y,phase,oct=3,r=1)   // loopNoise/fbm/curl loop perfectly
          hexToRgb(hex), rgba(hex,alpha), mixHex(a,b,t), shade(hex,t)   // shade: t<0 darker, t>0 lighter
          getBuffer(key,w,h)    // cached offscreen canvas {canvas, ctx}; not cleared automatically
          ── from '../lib/shapes' ──
          type Pt=[number,number]; type Poly={pts:Pt[]; closed?:boolean}
          Constructors (unit coords, y down, roughly -1..1): polyP(pts,closed?), lineP(x1,y1,x2,y2), arcP(cx,cy,r,a0,a1), ellipseP(cx,cy,rx,ry),
            ellipseArcP(cx,cy,rx,ry,a0,a1), circleP(cx,cy,r), rectP(x,y,w,h), roundRectP(x,y,w,h,r), bezierP(p0,p1,p2,p3): Pt[]
          ICONS[name]() -> Poly[]   names: ${ICON_NAMES.join(", ")}
          place(polys,cx,cy,scale,rot=0): Poly[]     // unit coords -> pixels (scale = half-size in px)
          polyLen(poly), samplePoly(poly,n): Pt[]    // n evenly spaced points along a line (particle assembly)
          strokePoly(ctx,poly,t0=0,t1=1), pathPoly(ctx,poly,t0,t1), fillPoly(ctx,poly)   // t0..t1 = portion of the line drawn (draw-on / traces)
          neon(ctx,polys,color,width,t0=0,t1=1,intensity=1)   // layered-glow neon lines (no shadowBlur)
          glowDot(ctx,x,y,r,color,alpha=1)                    // soft light blob
          isoPt(x,y,z,cx,cy,s): Pt                            // isometric projection (x right-down, y left-down, z up; s = px per unit)
          isoBox(ctx,x,y,z,w,d,h,color,cx,cy,s)               // shaded isometric box; draw back-to-front (ascending x+y+z)`;

          const EXAMPLE = `import { breathe, rgba } from '../lib/kit';
          import { ICONS, place, neon, glowDot } from '../lib/shapes';
          import type { DrawFn } from '../lib/CanvasScene';

          // EXAMPLE ONLY — structure, API use and loop discipline. Do NOT copy its look or composition.
          export const draw: DrawFn = (ctx, s) => {
            const { cx, cy, u, phase, colors, w, h } = s;
            const m = Math.min(w, h);
            const folder = place(ICONS.folder(), cx, cy, m * 0.24);

            glowDot(ctx, cx, cy, m * 0.5, colors.primary, 0.12 + 0.06 * breathe(phase, 1));
            neon(ctx, folder, colors.primary, 3 * u, 0, 1, 0.45);            // dim base: ALWAYS fully visible, so frame 0 is recognisable

            const t = (phase * 2) % 1;                                        // 2 laps per loop (integer => seamless)
            neon(ctx, folder, colors.secondary, 3.4 * u, t, Math.min(1, t + 0.2), 1.2);   // travelling bright trace

            const k = 1 + 0.08 * breathe(phase, 2);
            neon(ctx, place(ICONS.cross(), cx, cy + m * 0.04, m * 0.09 * k), colors.secondary, 3 * u);
          };`;

          function codePrompt(idea, plan, prevCode, error) {
            const B = BACKGROUNDS[plan.style.background];
            const spec = {
              subject: idea.subject, title: idea.title, series: plan.seriesName, topic: plan.topic,
              look: plan.style.look, lineWeight: plan.style.lineWeight, motionLanguage: plan.style.motionLanguage,
              background: plan.style.background, backgroundRule: B.rule, palette: idea.composition,
              iconsAvailable: idea.iconHints, visualSpec: idea.visualSpec, noveltyHook: idea.noveltyHook,
            };
            const repair = prevCode ? `
          ═══ YOUR PREVIOUS ATTEMPT FAILED ═══
          Error:
          ${error}

          Previous code:
          ${FENCE}ts
          ${prevCode}
          ${FENCE}
          Fix the problem and return the COMPLETE corrected file.
          ` : "";
            return `You are an elite motion designer and creative coder writing ONE Canvas 2D draw function for a premium 4K
          stock-video motion-graphic asset. Remotion renders it frame by frame.

          ═══ THE ASSET ═══
          ${JSON.stringify(spec, null, 2)}

          ═══ FILE CONTRACT ═══
          Return ONE TypeScript file in a single ${FENCE}ts block and nothing else. It must:
           1. import ONLY from '../lib/kit', '../lib/shapes' and (type only) from '../lib/CanvasScene';
           2. export const draw: DrawFn = (ctx, s) => { ... };
          The harness paints the background colour (and, for non-clean backgrounds, a soft backdrop, vignette and grain). Never fill the
          whole frame yourself.

          State s: s.w, s.h (3840x2160 landscape or 2160x3840 portrait), s.cx, s.cy, s.u (unit scale ≈ min(w,h)/1000 — multiply EVERY
          pixel size by it), s.phase (0..1 loop position — the ONLY time source), s.seconds, s.portrait, s.colors {primary, secondary, bg}.

          KIT:
          ${KIT_DOC}

          ═══ NON-NEGOTIABLE RULES ═══
          1. The subject must be IMMEDIATELY recognisable at thumbnail size: one clear hero object, centred, about 35–55% of min(w,h),
             generous margins. Use ICONS where they fit, combine several, or build custom shapes with the constructors. Never let effects
             hide the subject. No text, letters, numbers, people, faces or logos.
          2. Obey the background rule exactly: ${B.rule}
          3. Stay in the series style (palette from s.colors, the stated line weight and motion language). Premium finish: crisp edges,
             consistent line weight, restrained glow, a clear luminance hierarchy, never clipped pure white.
          4. Mind-blowing but legible: stage the WOW BEAT from the spec as a precise, satisfying animated moment (anticipation → action →
             settle) with easing (easeOutBack, easeInOut, ...). One surprising idea executed perfectly beats many effects.
          5. Deterministic: no Math.random, Date, performance, window, document, fetch, timers. Create const rnd = mulberry32(CONSTANT)
             INSIDE draw().
          6. SEAMLESS LOOP. Every moving quantity must return to its start value at phase = 1 (sin/cos(TAU*phase*k) with INTEGER k,
             breathe(phase,k), loopNoise/fbm/curl, circular motion). Frame 0 must already show a complete, recognisable subject. Build-up
             effects (draw-on, assembly) are allowed as a bright layer over an always-visible dim version, or if the piece un-builds to
             exactly its starting state. No one-way drift or growth.
          7. Works in landscape AND portrait: position relative to s.cx/s.cy and min(s.w,s.h); never rely on s.w alone.
          8. Performance budget ≈ 10 s per 4K frame on a CPU: <= 400k path segments, <= 8000 particles, no per-pixel loops at full
             resolution, avoid shadowBlur.
          9. Complete, runnable code. No placeholders, no TODOs. It must work the first time.

          ═══ STRUCTURE EXAMPLE ═══
          ${FENCE}ts
          ${EXAMPLE}
          ${FENCE}
          ${repair}`;
          }

          // ═══════════════════════════════════════════════════════════
          // HELPERS
          // ═══════════════════════════════════════════════════════════
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          class Soft extends Error {}

          const sanitizeId = s => String(s || "").toLowerCase()
            .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50);
          function uniqueId(base, seen) {
            let id = base, n = 2;
            while (seen.has(id)) id = `${base}-${n++}`;
            return id;
          }
          const stripFence = t => String(t).trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();
          const cleanIcons = a => (Array.isArray(a) ? a : []).map(x => String(x).toLowerCase().trim()).filter(x => ICON_NAMES.includes(x)).slice(0, 2);

          async function callModel({ prompt, parse, json = false, search = false, label, attempts = ATTEMPTS_PER_MODEL }) {
            if (!ai) return null;
            for (const model of MODELS) {
              for (let a = 1; a <= attempts; a++) {
                try {
                  console.log(`[INFO] ${label} — ${model} (${a}/${attempts})`);
                  const config = { temperature: 1.0, topP: 0.95 };
                  if (search) config.tools = [{ googleSearch: {} }];
                  else if (json) config.responseMimeType = "application/json";
                  const res = await ai.models.generateContent({ model, contents: prompt, config });
                  try {
                    return parse(res.text || "");
                  } catch (pe) {
                    throw new Soft(pe.message);
                  }
                } catch (e) {
                  const msg = String(e?.message || e);
                  console.warn(`[FAILED] ${label} ${model} #${a}: ${msg.slice(0, 300)}`);
                  if (!(e instanceof Soft) && /404|NOT_FOUND|not found|401|403|API key|PERMISSION_DENIED/i.test(msg)) break;
                  if (a < attempts) await sleep(2000 * 2 ** (a - 1));
                }
              }
            }
            return null;
          }

          // ── Parsing / validasi ──
          function parseSeries(raw, styleAssign) {
            const d = JSON.parse(stripFence(raw));
            if (!Array.isArray(d.subjects) || d.subjects.length !== COUNT) throw new Error(`need exactly ${COUNT} subjects`);
            if (!d.topic || typeof d.topic !== "string") throw new Error("missing topic");
            const st = d.style || {};
            for (const k of ["primaryColor", "secondaryColor"]) if (!HEX.test(st[k] || "")) throw new Error(`invalid style.${k}`);
            const B = BACKGROUNDS[styleAssign.background];
            const bg = B.bg || st.bgColor;
            if (!HEX.test(bg || "")) throw new Error("invalid style.bgColor");
            d.style = {
              ...st, bgColor: bg, background: styleAssign.background, finish: B.finish, assigned: styleAssign.name,
              durationSeconds: Math.min(15, Math.max(8, Math.round(Number(st.durationSeconds) || 12))),
            };
            const seen = new Set();
            for (const s of d.subjects) {
              for (const k of ["subject", "buyerSearchPhrase", "useCase", "wowBeat"])
                if (!s[k] || typeof s[k] !== "string") throw new Error(`subject missing ${k}`);
              const key = s.subject.toLowerCase().trim();
              if (seen.has(key)) throw new Error("duplicate subject");
              seen.add(key);
              s.iconHints = cleanIcons(s.iconHints);
              if (!s.metaphorTwist) s.metaphorTwist = "";
            }
            d.seriesName = d.seriesName || d.topic;
            return d;
          }

          function composeKeywords(kws, bgMode) {
            const extra = BG_KEYWORDS[bgMode] || [];
            const base = [...new Set(kws.map(k => String(k).toLowerCase().trim()).filter(Boolean))];
            return [...new Set([...base.slice(0, 5), ...extra, ...base.slice(5)])].slice(0, 49);
          }

          function baseComposition(plan) {
            return {
              primaryColor: plan.style.primaryColor, secondaryColor: plan.style.secondaryColor, bgColor: plan.style.bgColor,
              durationSeconds: plan.style.durationSeconds,
            };
          }

          function parseIdea(raw, plan, subj, siblings) {
            const d = JSON.parse(stripFence(raw));
            for (const k of ["title", "stockTitle", "description"]) if (!d[k] || typeof d[k] !== "string") throw new Error(`missing ${k}`);
            if (!(Number(d.demand?.score) >= 6)) throw new Error(`demand score too low: ${d.demand?.score}`);
            if (!Array.isArray(d.keywords) || d.keywords.length < 20) throw new Error("not enough keywords");

            const seen = new Set([...previousIds, ...siblings.map(s => s.id)]);
            const base = sanitizeId(d.id || d.title || subj.subject);
            if (!base) throw new Error("empty id");

            d.id = uniqueId(base, seen);
            d.subject = subj.subject;
            d.concept = subj.wowBeat;
            d.stockTitle = d.stockTitle.slice(0, 200);
            d.keywords = composeKeywords(d.keywords, plan.style.background);
            d.iconHints = cleanIcons(d.iconHints).length ? cleanIcons(d.iconHints) : subj.iconHints;
            d.composition = baseComposition(plan);
            d.finish = plan.style.finish;
            d.background = plan.style.background;
            d.creative = { topic: plan.topic, style: plan.style.assigned, series: plan.seriesName };
            return d;
          }

          // ── Pemeriksaan statis kode AI ──
          const BANNED = [
            [/\bMath\.random\b/, "Math.random"],
            [/\bDate\b/, "Date"],
            [/\bperformance\b/, "performance"],
            [/\bwindow\b/, "window"],
            [/\bdocument\b/, "document (use getBuffer from the kit)"],
            [/\bglobalThis\b/, "globalThis"],
            [/\bfetch\s*\(/, "fetch"],
            [/\b(XMLHttpRequest|WebSocket|localStorage|sessionStorage)\b/, "network/storage API"],
            [/\beval\s*\(|\bnew\s+Function\b|\bFunction\s*\(/, "eval/Function"],
            [/\brequire\s*\(|\bimport\s*\(/, "dynamic import/require"],
            [/\bprocess\s*\./, "process"],
            [/\b(setTimeout|setInterval|requestAnimationFrame)\b/, "timers"],
          ];

          function staticCheck(code) {
            if (code.length < 400) return "code too short";
            if (code.length > 30000) return "code too long";
            if (!/export\s+const\s+draw\b/.test(code)) return "must contain: export const draw: DrawFn = (ctx, s) => { ... }";
            if (/^\s*import\s+['"]/m.test(code)) return "side-effect imports are not allowed";
            const imports = [...code.matchAll(/^\s*import\s+[^;]*?from\s+['"]([^'"]+)['"]/gm)].map(m => m[1]);
            const bad = imports.filter(p => !ALLOWED_IMPORTS.includes(p));
            if (bad.length) return `imports not allowed: ${bad.join(", ")}`;
            const bare = code.replace(/\/\*[\s\S]*?\*\//g, "").replace(/(^|[^:])\/\/.*$/gm, "$1");
            for (const [re, name] of BANNED) if (re.test(bare)) return `forbidden API used: ${name}`;
            return null;
          }

          function parseCode(raw) {
            const m = String(raw).match(/```(?:ts|typescript|tsx|js)?\s*\n([\s\S]*?)```/);
            const code = (m ? m[1] : String(raw)).trim();
            const err = staticCheck(code);
            if (err) throw new Error(err);
            return code;
          }

          // ── Validasi runtime (child process tanpa API key) ──
          function runtimeValidate(id, colors, frames, finish) {
            const env = { ...process.env };
            delete env.GEMINI_API_KEY;
            const r = spawnSync("node", ["validate.mjs", id, JSON.stringify(colors), String(frames), finish], {
              cwd: RP, env, encoding: "utf8", timeout: 10 * 60 * 1000,
            });
            if (r.status === 0) {
              console.log(`[VALIDATE OK] ${id} ${(r.stdout || "").trim().slice(-120)}`);
              return null;
            }
            return ((r.stderr || "") + (r.stdout || "")).trim().slice(-1800) || "unknown validation error";
          }

          async function buildCode(idea, plan) {
            const c = idea.composition;
            const colors = { primary: c.primaryColor, secondary: c.secondaryColor, bg: c.bgColor };
            const frames = Math.round(c.durationSeconds * 30);
            const file = `${CUSTOM_DIR}/${idea.id}.ts`;
            let prevCode = "", lastError = "";

            for (let attempt = 1; attempt <= CODE_ATTEMPTS; attempt++) {
              const code = await callModel({
                prompt: codePrompt(idea, plan, prevCode, lastError),
                label: `code ${idea.id} #${attempt}`,
                parse: parseCode,
              });
              if (!code) break;
              fs.writeFileSync(file, code);
              const err = runtimeValidate(idea.id, colors, frames, idea.finish);
              if (!err) return true;
              console.warn(`[CODE FAIL] ${idea.id} #${attempt}: ${err.slice(0, 500)}`);
              prevCode = code;
              lastError = err;
            }
            fs.rmSync(file, { force: true });
            return false;
          }

          // ── Mode template (neon bawaan) — metadata dibuat jujur sesuai tampilan template ──
          function toTemplate(v) {
            v.codeMode = "template";
            v.finish = "clean";
            v.background = "black";
            v.composition = { ...v.composition, bgColor: "#000000" };
            const kws = (v.keywords || []).filter(k => !["chroma key", "green screen", "green background", "light background", "dark background"].includes(k));
            v.keywords = composeKeywords(kws.length ? kws : ["icon", "animation", "motion graphics", "4K", "loop"], "black");
            v.stockTitle = `Glowing neon line ${v.subject} icon animation on black background. ${v.creative?.topic || "Business"} concept symbol. 4K video motion graphic, seamless loop.`.slice(0, 200);
            return v;
          }

          function ideaFromSubject(plan, subj, siblings) {
            const seen = new Set([...previousIds, ...siblings.map(s => s.id)]);
            const phraseWords = subj.buyerSearchPhrase.toLowerCase().split(/\s+/).filter(w => w.length > 2);
            const v = {
              id: uniqueId(sanitizeId(subj.subject) || `asset-${RUN}`, seen),
              title: subj.subject.slice(0, 60),
              description: `${subj.subject} animated icon for ${subj.useCase}.`,
              subject: subj.subject, concept: subj.wowBeat,
              keywords: [subj.buyerSearchPhrase.toLowerCase(), ...phraseWords, "icon", "animation", "motion graphics", "4K", "loop", "concept",
                "symbol", "technology", "business", "digital", "modern", "explainer", "presentation", "app", "video", "graphic", "element", "overlay"],
              iconHints: subj.iconHints,
              visualSpec: { composition: "hero icon centred", storyboard: [], wowBeat: subj.wowBeat },
              composition: baseComposition(plan), finish: plan.style.finish, background: plan.style.background,
              creative: { topic: plan.topic, style: plan.style.assigned, series: plan.seriesName },
            };
            return toTemplate(v);
          }

          // ── Rencana statis bila AI sama sekali tidak tersedia ──
          function staticPlan() {
            const mk = (subject, phrase, icons, use) => ({ subject, buyerSearchPhrase: phrase, useCase: use, metaphorTwist: "", wowBeat: "light trace runs around the icon", iconHints: icons });
            return {
              seriesName: `neon-series-${RUN}`, topic: "cloud computing & cybersecurity",
              style: { look: "neon line icons on black", primaryColor: "#22d3ee", secondaryColor: "#a78bfa", bgColor: "#000000",
                background: "black", finish: "clean", durationSeconds: 12, assigned: STYLES[0].name },
              subjects: [
                mk("cloud data storage", "cloud storage icon", ["cloud", "database"], "cloud computing explainers and SaaS promos"),
                mk("cybersecurity shield", "cyber security shield icon", ["shield", "check"], "security and privacy videos"),
                mk("medical record folder", "medical record folder icon", ["folder", "cross"], "healthcare and patient data videos"),
                mk("data analytics chart", "data analytics chart icon", ["chart", "magnifier"], "business intelligence presentations"),
                mk("telemedicine phone", "telemedicine app icon", ["phone", "heart"], "online doctor and health app promos"),
              ],
            };
          }

          function writeRegistries(videos) {
            const make = (templateOnly) => {
              const custom = videos.filter(v => v.codeMode === "custom" && !templateOnly);
              const imports = custom.map((v, i) => `import { draw as d${i} } from './custom/${v.id}';`).join("\n");
              const tpl = videos.filter(v => !custom.includes(v));
              const tplDecl = tpl.map((v, i) =>
                `const t${i} = makeNeonIconDraw(${JSON.stringify(v.iconHints && v.iconHints.length ? v.iconHints : ["cloud"])});`).join("\n");
              const colorsOf = v => JSON.stringify({ primary: v.composition.primaryColor, secondary: v.composition.secondaryColor, bg: templateOnly || v.codeMode === "template" ? "#000000" : v.composition.bgColor });
              const entries = videos.map(v => {
                const ci = custom.indexOf(v);
                const draw = ci >= 0 ? `d${ci}` : `t${tpl.indexOf(v)}`;
                const finish = ci >= 0 ? v.finish : "clean";
                return `  '${v.id}': () => <CanvasScene draw={${draw}} colors={${colorsOf(v)}} finish="${finish}" />,`;
              }).join("\n");
              return `import React from 'react';\nimport { CanvasScene } from './lib/CanvasScene';\nimport { makeNeonIconDraw } from './lib/fallbackDraw';\n${imports}\n\n${tplDecl}\n\n` +
                `export const CUSTOM: Record<string, React.FC> = {\n${entries}\n};\n`;
            };
            fs.writeFileSync(`${RP}/src/registry.tsx`, make(false));
            fs.writeFileSync(`${RP}/src/registry.safe.tsx`, make(true));
          }

          // ═══════════════════════════════════════════════════════════
          // MAIN
          // ═══════════════════════════════════════════════════════════
          async function main() {
            fs.mkdirSync(CUSTOM_DIR, { recursive: true });
            const videos = [];
            const style = pickStyle();
            const domains = pickDomains(4);
            console.log(`[PICK] style: ${style.name}\n[PICK] domains: ${domains.join(" | ")}`);

            let plan = null, aiPlan = false;
            if (!ai) {
              console.warn("[WARN] GEMINI_API_KEY tidak diset — memakai rencana statis.");
            } else {
              const brief = await callModel({
                prompt: researchPrompt(domains), search: true, label: "research", attempts: 1,
                parse: t => { if (String(t).trim().length < 200) throw new Error("research too short"); return String(t).trim(); },
              });
              console.log(brief ? `[RESEARCH OK] ${brief.length} chars` : "[RESEARCH] tidak tersedia — lanjut tanpa brief");
              plan = await callModel({
                prompt: seriesPrompt(style, domains, brief || ""), json: true, label: "series plan",
                parse: raw => parseSeries(raw, style),
              });
              aiPlan = !!plan;
            }
            if (!plan) { console.warn("[FALLBACK] memakai rencana series statis"); plan = staticPlan(); }

            for (let i = 0; i < plan.subjects.length; i++) {
              const subj = plan.subjects[i];
              let idea = null;
              if (aiPlan) {
                idea = await callModel({
                  prompt: subjectPrompt(plan, subj, videos), json: true, label: `asset ${i + 1}: ${subj.subject}`,
                  parse: raw => parseIdea(raw, plan, subj, videos),
                });
              }
              if (!idea) {
                console.warn(`[TEMPLATE] ${subj.subject} → template neon bawaan`);
                idea = ideaFromSubject(plan, subj, videos);
              } else if (await buildCode(idea, plan)) {
                idea.codeMode = "custom";
              } else {
                console.warn(`[TEMPLATE] kode AI gagal untuk ${idea.id} → template neon bawaan`);
                toTemplate(idea);
              }
              console.log(`[ASSET] ${idea.id} → ${idea.codeMode}`);
              videos.push(idea);
            }

            writeRegistries(videos);
            fs.writeFileSync(OUTPUT_PATH, JSON.stringify({ series: { name: plan.seriesName, topic: plan.topic, style: plan.style }, videos }, null, 2));
            console.log(`Selesai: ${videos.map(v => `${v.id}(${v.codeMode})`).join(", ")}`);
          }

          export { staticCheck, parseCode, parseSeries, parseIdea, staticPlan, ideaFromSubject, toTemplate };
          if (!process.env.GEN_NO_MAIN) await main();
          GENEOF

      - name: Write Remotion code
        run: |
          cd remotion-project

          cat > src/index.ts <<'EOF'
          import { registerRoot } from 'remotion';
          import { RemotionRoot } from './Root';
          registerRoot(RemotionRoot);
          EOF

          cat > src/Root.tsx <<'EOF'
          import React from 'react';
          import { Composition } from 'remotion';
          import { IDEAS } from './ideas';
          import { CUSTOM } from './registry';

          const SIZES = [
            { suffix: '16x9-4k', width: 3840, height: 2160 },
            { suffix: '9x16-4k', width: 2160, height: 3840 },
          ];

          export const RemotionRoot: React.FC = () => (
            <>
              {IDEAS.filter((idea: any) => CUSTOM[idea.id]).map((idea: any) => (
                <React.Fragment key={idea.id}>
                  {SIZES.map((sz) => (
                    <Composition
                      key={sz.suffix}
                      id={`${idea.id}-${sz.suffix}`}
                      component={CUSTOM[idea.id]}
                      durationInFrames={Math.round(idea.duration * 30)}
                      fps={30}
                      width={sz.width}
                      height={sz.height}
                    />
                  ))}
                </React.Fragment>
              ))}
            </>
          );
          EOF

      # SECRET hanya tersedia di step ini; kode AI divalidasi di child process TANPA API key
      - name: Generate series + AI code (research → plan → metadata → code → validate)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd generator
          node gen.mjs

      - name: Generate ideas.ts
        run: |
          cd remotion-project
          cat > gen-ideas.mjs <<'EOF'
          import fs from "fs";
          const data = JSON.parse(fs.readFileSync("video-ideas.json","utf8"));
          const ideas = data.videos.map(v => ({
            id: v.id,
            duration: v.composition.durationSeconds || 12,
          }));
          fs.writeFileSync("src/ideas.ts",
            "export const IDEAS = " + JSON.stringify(ideas, null, 2) + ";\n");
          EOF
          node gen-ideas.mjs

      # Safety net: bila project gagal dimuat karena kode custom, kosongkan registry → pakai engine bawaan
      - name: Verify project compiles (safety net)
        run: |
          cd remotion-project
          if ! npx remotion compositions src/index.ts; then
            echo "::warning::Registry bermasalah — fallback ke template neon bawaan untuk semua aset"
            cp src/registry.safe.tsx src/registry.tsx
            npx remotion compositions src/index.ts
          fi

      - name: Build composition list
        id: comps
        run: |
          cd remotion-project
          node -e "
            const d = require('./video-ideas.json');
            const list = [];
            d.videos.forEach(v => {
              list.push(v.id + '-16x9-4k');
              list.push(v.id + '-9x16-4k');
            });
            if (list.length === 0) { console.error('Daftar komposisi kosong'); process.exit(1); }
            require('fs').writeFileSync('comps.json', JSON.stringify(list));
          "
          echo "list=$(cat comps.json)" >> $GITHUB_OUTPUT

      # node_modules TIDAK ikut (artifact tidak menyimpan permission +x). Install bersih di job render.
      - name: Pack project (tanpa node_modules)
        run: tar --exclude='node_modules' -czf project.tgz remotion-project

      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-project
          path: project.tgz
          retention-days: 1

      - name: Upload ideas metadata
        uses: actions/upload-artifact@v4
        with:
          name: ideas-meta
          path: remotion-project/video-ideas.json
          retention-days: 1

  # ══════════════════════════════════════════════════════════
  # JOB 2 — RENDER PARALEL (max-parallel: 5)
  # ══════════════════════════════════════════════════════════
  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        comp: ${{ fromJSON(needs.prepare.outputs.comps) }}
    steps:
      - name: Download project
        uses: actions/download-artifact@v4
        with:
          name: remotion-project

      - name: Extract project
        run: tar -xzf project.tgz

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: remotion-project/package-lock.json

      - name: Install dependencies
        run: |
          cd remotion-project
          npm ci

      - name: Install system dependencies (Chrome + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libnss3 libdbus-1-3 libatk1.0-0 \
            libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 \
            libcairo2 libcups2

      - name: Render ${{ matrix.comp }}
        run: |
          cd remotion-project
          npx remotion render "${{ matrix.comp }}" "out/${{ matrix.comp }}.mp4" \
            --codec=h264 \
            --concurrency=2 \
            --jpeg-quality=92 \
            --crf=14 \
            --pixel-format=yuv420p

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.comp }}
          path: remotion-project/out/${{ matrix.comp }}.mp4
          retention-days: 1

  # ══════════════════════════════════════════════════════════
  # JOB 3 — RELEASE (tetap jalan walau sebagian render gagal)
  # ══════════════════════════════════════════════════════════
  release:
    needs: [prepare, render]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download all rendered videos
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: video-*
          merge-multiple: true
          path: final-output

      - name: Download ideas metadata
        uses: actions/download-artifact@v4
        with:
          name: ideas-meta
          path: ideas-meta

      - name: Verify output
        run: |
          mkdir -p final-output
          if ! ls final-output/*.mp4 >/dev/null 2>&1; then
            echo "::error::Tidak ada video yang berhasil dirender"
            exit 1
          fi
          ls -lh final-output/
          cp ideas-meta/video-ideas.json final-output/batch-metadata.json

      # CSV metadata siap pakai untuk upload (judul ≤ 200 karakter, keyword ≤ 49)
      - name: Build upload CSV
        run: |
          cat > make-csv.mjs <<'EOF'
          import fs from "fs";
          const ideas = JSON.parse(fs.readFileSync("ideas-meta/video-ideas.json", "utf8")).videos;
          const files = fs.readdirSync("final-output").filter(f => f.endsWith(".mp4")).sort();
          const esc = s => '"' + String(s).replace(/"/g, '""') + '"';
          const rows = ["Filename,Title,Keywords,Category,Releases"];
          for (const f of files) {
            const v = ideas.find(x => f.startsWith(x.id + "-"));
            if (!v) continue;
            const portrait = f.includes("-9x16-");
            const extra = portrait ? ["vertical", "9:16", "portrait"] : ["horizontal", "16:9"];
            const base = (v.keywords || []).slice(0, 49 - extra.length);
            const kws = [...new Set([...base, ...extra])].slice(0, 49);
            const title = ((v.stockTitle || v.title) + (portrait ? ", vertical 9:16" : "")).slice(0, 200);
            rows.push([esc(f), esc(title), esc(kws.join(",")), "", ""].join(","));
          }
          fs.writeFileSync("final-output/adobe-stock-upload.csv", rows.join("\n") + "\n");
          console.log("CSV rows:", rows.length - 1);
          EOF
          node make-csv.mjs

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: batch-${{ github.run_number }}
          name: "Stock 4K Batch ${{ github.run_number }}"
          files: |
            final-output/*.mp4
            final-output/batch-metadata.json
            final-output/adobe-stock-upload.csv
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # History hanya mencatat ide yang videonya benar-benar dirender & dirilis
      - name: Update history
        run: |
          [ -f history.json ] || echo '{"rendered":[],"version":1}' > history.json
          node -e "
            const fs = require('fs');
            const hist = JSON.parse(fs.readFileSync('./history.json','utf8'));
            const ideas = JSON.parse(fs.readFileSync('./ideas-meta/video-ideas.json','utf8'));
            const files = fs.readdirSync('./final-output');
            const done = ideas.videos.filter(v => files.some(f => f.startsWith(v.id + '-')));
            const rendered = done.map(v => ({
              id: v.id,
              concept: v.concept || v.title,
              topic: v.creative && v.creative.topic,
              style: v.creative && v.creative.style,
              subject: v.subject,
              stockTitle: v.stockTitle,
              codeMode: v.codeMode,
              renderedAt: new Date().toISOString(),
              run: process.env.GITHUB_RUN_NUMBER,
            }));
            hist.rendered = hist.rendered.concat(rendered);
            if (hist.rendered.length > 500) hist.rendered = hist.rendered.slice(-500);
            fs.writeFileSync('./history.json', JSON.stringify(hist, null, 2));
            console.log('Ditambahkan', rendered.length, 'ide. Total history:', hist.rendered.length);
          "

      - name: Commit history to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --staged --quiet; then
            echo "No history change"
          else
            git commit -m "chore: update idea history [skip ci]"
            git push
          fi
