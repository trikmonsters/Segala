name: Dola.com Verification with Parallel Proxy Test

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Start Fortress via Docker
        run: |
          docker run -d --rm -p 9222:9222 --name fortress tilion/fortress:latest
          echo "Menunggu Fortress siap..."
          sleep 10
          curl -s http://localhost:9222/json/version && echo "Fortress siap!"

      - name: Run Dola.com Verification (Parallel)
        env:
          DOLA_COOKIES: ${{ secrets.DOLA_COOKIES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cat > /tmp/dola_verify.py << 'PYEOF'
          import asyncio
          import os
          import requests
          from datetime import datetime
          from playwright.async_api import async_playwright

          PROXY_LIST_URL = "https://raw.githubusercontent.com/iplocate/free-proxy-list/main/all-proxies.txt"
          MAX_PARALLEL = 7
          MAX_TEST = 60  # Batasi jumlah proxy yang dites

          def parse_netscape_cookies(content):
              cookies = []
              for line in content.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith('#HttpOnly_'):
                      line = line[10:]
                  elif line.startswith('#'):
                      continue
                  parts = line.split('\t')
                  if len(parts) < 7:
                      continue
                  domain = parts[0]
                  if not domain.startswith('.'):
                      domain = '.' + domain
                  cookie = {
                      'name': parts[5],
                      'value': parts[6],
                      'domain': domain,
                      'path': parts[2],
                      'secure': parts[3].upper() == 'TRUE',
                      'httpOnly': False,
                      'sameSite': 'Lax',
                  }
                  try:
                      expires = int(parts[4])
                      if expires > 0:
                          cookie['expires'] = expires
                  except:
                      pass
                  cookies.append(cookie)
              return cookies

          def fetch_proxies():
              try:
                  r = requests.get(PROXY_LIST_URL, timeout=20)
                  r.raise_for_status()
                  proxies = [line.strip() for line in r.text.splitlines() if line.strip()]
                  print(f"Total proxy dari daftar: {len(proxies)}")
                  return proxies
              except Exception as e:
                  print(f"Gagal fetch proxy list: {e}")
                  return []

          def test_proxy_quick(proxy, timeout=6):
              """Tes cepat pakai requests (sinkron, dijalankan di thread pool)."""
              try:
                  r = requests.get(
                      "https://api.ipify.org?format=json",
                      proxies={"http": proxy, "https": proxy},
                      timeout=timeout
                  )
                  if r.status_code == 200:
                      return r.json().get("ip")
              except:
                  pass
              return None

          async def check_proxy_async(proxy, cookies, screenshot_filename, semaphore):
              """Cek satu proxy: tes koneksi + akses Dola. Return (success, proxy, info)."""
              async with semaphore:
                  # Tes cepat di thread pool (biar tidak block event loop)
                  loop = asyncio.get_event_loop()
                  ip = await loop.run_in_executor(None, test_proxy_quick, proxy, 6)
                  if not ip:
                      return False, proxy, "dead"
                  
                  print(f"[{proxy}] Hidup, IP: {ip}")
                  
                  # Tes akses Dola via Playwright
                  try:
                      async with async_playwright() as p:
                          browser = await p.chromium.connect_over_cdp("http://localhost:9222")
                          try:
                              context = await browser.new_context(
                                  proxy={"server": proxy}
                              )
                              await context.add_cookies(cookies)
                              page = await context.new_page()
                              
                              await page.goto("https://api.ipify.org?format=json", timeout=15000)
                              
                              target_url = "https://www.dola.com/chat/38417525406339601"
                              await page.goto(target_url, wait_until="networkidle", timeout=35000)
                              await page.wait_for_timeout(4000)
                              
                              current_url = page.url
                              body_text = await page.inner_text("body")
                              
                              if "tidak tersedia" in body_text.lower() or "not available" in body_text.lower():
                                  print(f"[{proxy}] Geo-block")
                                  await browser.close()
                                  return False, proxy, "geo_block"
                              
                              if "login" in current_url.lower() or "signin" in current_url.lower():
                                  print(f"[{proxy}] Login redirect")
                                  await browser.close()
                                  return False, proxy, "login_redirect"
                              
                              # Sukses! Simpan screenshot
                              await page.screenshot(path=screenshot_filename, full_page=True)
                              print(f"[{proxy}] ✅ SUKSES! Screenshot tersimpan")
                              await browser.close()
                              return True, proxy, "success"
                              
                          except Exception as e:
                              print(f"[{proxy}] Error: {str(e)[:100]}")
                              try:
                                  await browser.close()
                              except:
                                  pass
                              return False, proxy, str(e)[:60]
                  except Exception as e:
                      return False, proxy, f"browser_error: {str(e)[:50]}"

          async def main():
              cookie_content = os.environ.get("DOLA_COOKIES", "")
              github_token = os.environ.get("GITHUB_TOKEN")
              repo = os.environ.get("GITHUB_REPOSITORY")

              cookies = parse_netscape_cookies(cookie_content)
              print(f"Parsed {len(cookies)} cookies")

              timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
              screenshot_filename = f"dola_verify_{timestamp}.png"
              success = False
              used_proxy = None

              # Fetch proxy
              print("\n=== FETCHING PROXY LIST ===")
              all_proxies = fetch_proxies()
              if not all_proxies:
                  print("Tidak ada proxy. Keluar.")
                  return

              proxies_to_test = all_proxies[:MAX_TEST]
              print(f"\nMenguji {len(proxies_to_test)} proxy dengan paralel {MAX_PARALLEL}...")

              semaphore = asyncio.Semaphore(MAX_PARALLEL)
              tasks = [
                  check_proxy_async(proxy, cookies, screenshot_filename, semaphore)
                  for proxy in proxies_to_test
              ]

              # Jalankan semua tugas paralel, proses hasil saat selesai
              for coro in asyncio.as_completed(tasks):
                  try:
                      ok, proxy, info = await coro
                      if ok and not success:
                          success = True
                          used_proxy = proxy
                          print(f"\n✅ BERHASIL dengan proxy: {proxy}")
                          # Batalkan sisa tugas (opsional, biarkan selesai)
                      elif not ok:
                          pass  # Log sudah dicetak di dalam
                  except Exception as e:
                      print(f"Task error: {e}")

              if not success:
                  print("\n❌ Semua proxy gagal.")
                  print("Mengambil screenshot fallback tanpa proxy...")
                  async with async_playwright() as p:
                      browser = await p.chromium.connect_over_cdp("http://localhost:9222")
                      context = await browser.new_context()
                      await context.add_cookies(cookies)
                      page = await context.new_page()
                      try:
                          await page.goto("https://www.dola.com/chat/38417525406339601",
                                         wait_until="domcontentloaded", timeout=30000)
                          await page.wait_for_timeout(3000)
                          await page.screenshot(path=screenshot_filename, full_page=True)
                      except Exception as e:
                          print(f"Fallback error: {e}")
                      await browser.close()

              # Upload ke GitHub Release
              if os.path.exists(screenshot_filename):
                  print("\nMengupload ke GitHub Release...")
                  tag_name = f"dola-verify-{timestamp}"
                  headers = {
                      "Authorization": f"token {github_token}",
                      "Accept": "application/vnd.github.v3+json"
                  }

                  release_data = {
                      "tag_name": tag_name,
                      "name": f"Dola Verification - {timestamp}",
                      "body": f"Success: {success}\nProxy: {used_proxy}",
                      "draft": False,
                      "prerelease": False
                  }

                  check_url = f"https://api.github.com/repos/{repo}/releases/tags/{tag_name}"
                  check_resp = requests.get(check_url, headers=headers)
                  if check_resp.status_code == 200:
                      release_id = check_resp.json()["id"]
                      requests.delete(f"https://api.github.com/repos/{repo}/releases/{release_id}", headers=headers)

                  release_url = f"https://api.github.com/repos/{repo}/releases"
                  resp = requests.post(release_url, headers=headers, json=release_data)

                  if resp.status_code == 201:
                      release = resp.json()
                      upload_url = release["upload_url"].replace("{?name,label}", "")

                      with open(screenshot_filename, 'rb') as f:
                          upload_headers = {
                              "Authorization": f"token {github_token}",
                              "Content-Type": "image/png"
                          }
                          upload_resp = requests.post(
                              f"{upload_url}?name={screenshot_filename}",
                              headers=upload_headers,
                              data=f
                          )

                          if upload_resp.status_code == 201:
                              print(f"Screenshot berhasil diupload!")
                              print(f"URL: {upload_resp.json()['browser_download_url']}")
                          else:
                              print(f"Gagal upload: {upload_resp.status_code}")
                  else:
                      print(f"Gagal buat release: {resp.status_code}")

          if __name__ == "__main__":
              asyncio.run(main())
          PYEOF

          python /tmp/dola_verify.py

      - name: Stop Fortress
        if: always()
        run: docker stop fortress || true
