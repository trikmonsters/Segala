name: Billiard Daily Image Post + Optional Reels Upload

on:
  workflow_dispatch:
    inputs:
      manual_override_prompt:
        description: 'Override prompt (kosongkan untuk pakai AI)'
        required: false
        default: ''
      upload_facebook:
        description: 'Upload video ke Facebook Reels? (true/false)'
        required: false
        default: 'false'
  schedule:
    - cron: '0 1 * * *'   # 08:00 WIB - pagi
    - cron: '0 6 * * *'   # 13:00 WIB - siang
    - cron: '0 12 * * *'  # 19:00 WIB - malam

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests google-genai pydantic
          playwright install --with-deps chromium

      - name: Start Fortress via Docker
        run: |
          docker run -d --rm -p 9222:9222 --shm-size=2gb --name fortress \
            tilion/fortress:latest --disable-dev-shm-usage
          echo "Menunggu Fortress siap..."
          sleep 10
          curl -s http://localhost:9222/json/version && echo "Fortress siap!"

      - name: Generate Content with Gemini
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          MANUAL_PROMPT: ${{ github.event.inputs.manual_override_prompt }}
        run: |
          cat > gemini_content.py << 'PYEOF'
          import os, json, re, time
          from datetime import datetime, timedelta
          from google import genai
          from google.genai import types
          from google.genai.errors import ServerError, ClientError

          def load_recent_topics(days=7):
              try:
                  with open('used_topics.json', 'r') as f:
                      data = json.load(f)
                  cutoff = (datetime.now() - timedelta(days=days)).isoformat()
                  recent = [item['topic'] for item in data if item.get('date', '') > cutoff]
                  return recent[-10:]
              except:
                  return []

          def save_topic(topic):
              try:
                  with open('used_topics.json', 'r') as f:
                      data = json.load(f)
              except:
                  data = []
              data.append({'topic': topic, 'date': datetime.now().isoformat()})
              cutoff = (datetime.now() - timedelta(days=30)).isoformat()
              data = [d for d in data if d.get('date', '') > cutoff]
              with open('used_topics.json', 'w') as f:
                  json.dump(data, f)

          def generate_with_retry(api_keys, prompt, schema):
              last_err = None
              for key in api_keys:
                  if not key:
                      continue
                  for attempt in range(5):
                      try:
                          print(f"Percobaan {attempt+1}/5...")
                          client = genai.Client(api_key=key)
                          return client.models.generate_content(
                              model='gemini-3.8-flash',
                              contents=prompt,
                              config=types.GenerateContentConfig(
                                  response_mime_type='application/json',
                                  response_schema=schema
                              )
                          )
                      except ServerError as e:
                          last_err = e
                          wait = 2 ** (attempt + 1)
                          print(f"503 sibuk, retry dalam {wait}s...")
                          time.sleep(wait)
                      except ClientError as e:
                          print(f"ClientError (tidak retry): {e}")
                          last_err = e
                          break
                      except Exception as e:
                          last_err = e
                          break
              raise last_err if last_err else RuntimeError("Semua key dan retry gagal")

          def main():
              manual = os.environ.get('MANUAL_PROMPT', '').strip()
              if manual:
                  print("Menggunakan prompt manual override.")
                  result = {
                      "image_prompt": manual,
                      "title": "Billiard Moment",
                      "caption": "Enjoy the game.",
                      "hashtags": ["#billiards", "#pool"]
                  }
                  with open('gemini_result.json', 'w') as f:
                      json.dump(result, f)
                  return

              api_keys = [
                  os.environ.get('GEMINI_API_KEY'),
                  os.environ.get('GEMINI_API_KEY_2')
              ]
              today = datetime.now().strftime('%Y-%m-%d')
              recent_topics = load_recent_topics()
              recent_str = ', '.join(recent_topics) if recent_topics else 'Belum ada topik sebelumnya.'

              prompt = f"""Kamu adalah content strategist untuk akun Facebook Page billiard/pool.
                  Hari ini: {today}.
                  Tugas: Hasilkan konten harian untuk posting gambar billiard yang memiliki nilai SEO tinggi dan solusi bagi audiens.

                  Fokus pada topik billiard yang relevan dan memiliki nilai pencarian tinggi:
                  - Tips/trik billiard untuk pemula hingga mahir
                  - Perawatan meja/stik/aksesoris billiard
                  - Tren komunitas billiard terkini
                  - Angle, teknik pukulan, atau strategi permainan

                  Hindari topik berikut yang sudah dipakai 7 hari terakhir: {recent_str}
                  Jika topik mirip, berikan sudut pandang/momen yang benar-benar berbeda dan lebih baru.

                  Kembalikan JSON dengan field:
                  1. image_prompt: Deskripsi bahasa Inggris yang sangat detail untuk AI image generator (gaya visual, subjek, latar, pencahayaan, suasana). Harus bisa langsung dipakai generate gambar billiard yang menarik.
                  2. title: Judul caption Facebook. WAJIB diawali keyword utama (contoh: "Teknik Spin Bola Billiard..."), jelas, menarik, dan mengandung solusi/manfaat.
                  3. caption: Caption lengkap 2-4 kalimat. Sertakan solusi/tips praktis. Nada hangat dan mengundang interaksi.
                  4. hashtags: Array 5-10 hashtag relevan, campuran keyword utama dan turunannya (contoh: ["#billiard", "#tipsbilliard", "#teknikspin"]).

                  Pastikan keyword utama SEO muncul di awal title dan di caption.
                  """
              schema = {
                  "type": "OBJECT",
                  "properties": {
                      "image_prompt": {"type": "STRING"},
                      "title": {"type": "STRING"},
                      "caption": {"type": "STRING"},
                      "hashtags": {"type": "ARRAY", "items": {"type": "STRING"}}
                  },
                  "required": ["image_prompt", "title", "caption", "hashtags"]
              }

              response = generate_with_retry(api_keys, prompt, schema)
              result = json.loads(response.text)
              with open('gemini_result.json', 'w') as f:
                  json.dump(result, f)
              save_topic(result['title'][:50])
              print("Gemini result:", json.dumps(result, indent=2)[:500])

          if __name__ == '__main__':
              main()
          PYEOF
          python gemini_content.py

      - name: Run Duck.ai Image Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cat > duckai_image.py << 'PYEOF'
          import asyncio, os, json, base64, re, requests
          from datetime import datetime
          from playwright.async_api import async_playwright

          def slugify(text, max_len=80):
              text = text.lower().strip()
              text = re.sub(r'[^\w\s-]', '', text)
              text = re.sub(r'[\s_-]+', '-', text)
              text = re.sub(r'^-+|-+$', '', text)
              return text[:max_len].rstrip('-')

          def unique_filename(base, ext=".png"):
              filename = f"{base}{ext}"
              counter = 2
              while os.path.exists(filename):
                  filename = f"{base}-{counter}{ext}"
                  counter += 1
              return filename

          async def try_generate(page, prompt, image_filename):
              try:
                  await page.goto("https://duck.ai", wait_until="networkidle")
                  await page.wait_for_timeout(3000)
                  try:
                      new_image_btn = page.locator('text=New Image')
                      if await new_image_btn.count() > 0:
                          await new_image_btn.first.click()
                          await page.wait_for_timeout(2000)
                  except Exception as e:
                      print(f"New Image menu: {e}")

                  selectors = ['textarea[placeholder*="Ask"]', 'textarea[placeholder*="message"]',
                               'textarea[placeholder*="image"]', 'textarea', 'input[type="text"]']
                  input_found = False
                  for sel in selectors:
                      try:
                          await page.wait_for_selector(sel, timeout=5000)
                          await page.fill(sel, prompt)
                          await page.keyboard.press("Enter")
                          input_found = True
                          break
                      except:
                          continue
                  if not input_found:
                      await page.screenshot(path="debug_no_input.png")
                      return False

                  await page.wait_for_timeout(2000)
                  try:
                      cont = page.locator('button:has-text("Continue")')
                      if await cont.count() > 0:
                          await cont.first.click()
                          await page.wait_for_timeout(3000)
                  except:
                      pass

                  print("Menunggu gambar...")
                  await page.wait_for_timeout(25000)

                  try:
                      images = await page.locator('img').all()
                      for img in images:
                          src = await img.get_attribute('src')
                          if src and ('data:image' in src or 'blob:' in src):
                              w = await img.evaluate('el => el.naturalWidth')
                              h = await img.evaluate('el => el.naturalHeight')
                              if w > 200 and h > 200:
                                  if 'data:image' in src:
                                      b64 = src.split(',')[1]
                                      with open(image_filename, 'wb') as f:
                                          f.write(base64.b64decode(b64))
                                  else:
                                      await img.screenshot(path=image_filename)
                                  print(f"Gambar disimpan: {image_filename}")
                                  return True
                  except Exception as e:
                      print(f"Error cari gambar: {e}")

                  await page.screenshot(path=image_filename, full_page=True)
                  print("Fallback screenshot full page.")
                  return True
              except Exception as e:
                  print(f"try_generate error: {e}")
                  return False

          async def main():
              with open('gemini_result.json', 'r') as f:
                  meta = json.load(f)
              prompt = meta['image_prompt']
              slug = slugify(meta['title'])
              image_filename = unique_filename(slug)
              print(f"Nama file gambar: {image_filename}")

              image_saved = False
              async with async_playwright() as p:
                  browser = await p.chromium.connect_over_cdp("http://localhost:9222")
                  page = await browser.new_page()
                  try:
                      image_saved = await try_generate(page, prompt, image_filename)
                  except Exception as e:
                      print(f"Percobaan 1 gagal: {e}")
                  finally:
                      try:
                          await page.close()
                      except:
                          pass

                  if not image_saved:
                      print("Percobaan 1 gagal, mencoba halaman baru...")
                      try:
                          page2 = await browser.new_page()
                          image_saved = await try_generate(page2, prompt, image_filename)
                          await page2.close()
                      except Exception as e:
                          print(f"Percobaan 2 gagal: {e}")

                  await browser.close()

              if image_saved and os.path.exists(image_filename):
                  github_token = os.environ.get("GITHUB_TOKEN")
                  repo = os.environ.get("GITHUB_REPOSITORY")
                  tag_name = f"{slug}-{datetime.now().strftime('%Y%m%d%H%M%S')}"
                  headers = {"Authorization": f"token {github_token}", "Accept": "application/vnd.github.v3+json"}
                  check = requests.get(f"https://api.github.com/repos/{repo}/releases/tags/{tag_name}", headers=headers)
                  if check.status_code == 200:
                      rid = check.json()["id"]
                      requests.delete(f"https://api.github.com/repos/{repo}/releases/{rid}", headers=headers)
                  release_data = {
                      "tag_name": tag_name,
                      "name": f"Billiard - {meta['title'][:80]}",
                      "body": f"Prompt: {prompt[:200]}",
                      "draft": False
                  }
                  resp = requests.post(f"https://api.github.com/repos/{repo}/releases", headers=headers, json=release_data)
                  if resp.status_code == 201:
                      upload_url = resp.json()["upload_url"].replace("{?name,label}", "")
                      with open(image_filename, 'rb') as f:
                          requests.post(f"{upload_url}?name={image_filename}",
                                        headers={"Authorization": f"token {github_token}", "Content-Type": "image/png"},
                                        data=f)
                  print("GitHub Release selesai.")
                  with open('image_path.txt', 'w') as f:
                      f.write(image_filename)

          if __name__ == "__main__":
              asyncio.run(main())
          PYEOF
          python duckai_image.py

      - name: Post to Facebook Page
        env:
          FB_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          cat > post_facebook.py << 'PYEOF'
          import json, os, requests
          FB_PAGE_ID = "1347514741786031"
          with open('gemini_result.json', 'r') as f:
              meta = json.load(f)
          with open('image_path.txt', 'r') as f:
              image_path = f.read().strip()
          message = meta['title'] + "\n\n" + meta['caption'] + "\n\n" + " ".join(meta['hashtags'])
          token = os.environ['FB_TOKEN']
          url = f"https://graph.facebook.com/v21.0/{FB_PAGE_ID}/photos"
          with open(image_path, 'rb') as img:
              resp = requests.post(url, data={"access_token": token, "message": message, "published": "true"}, files={"source": img})
          print("Status:", resp.status_code)
          print("Response:", resp.text[:500])
          if resp.status_code == 200:
              data = resp.json()
              print(f"✅ Berhasil posting! Post ID: {data.get('post_id', data.get('id'))}")
          else:
              print("❌ Gagal posting.")
          PYEOF
          python post_facebook.py

      # Simpan metadata agar bisa dipakai job Reels
      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-metadata
          path: gemini_result.json
          retention-days: 3

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-screenshots
          path: |
            debug_no_input.png
            debug_full_page.png
            *.png
          retention-days: 3

      - name: Commit used_topics.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json || true
          git commit -m "chore: update used topics [skip ci]" || true
          git push || true

      - name: Stop Fortress
        if: always()
        run: docker stop fortress || true

  # ============================================================
  # JOB TAMBAHAN: Upload Video ke Facebook Reels (opsional)
  # Metadata diambil otomatis dari artifact gemini-metadata
  # ============================================================
  upload-facebook-reels:
    needs: generate-and-post
    if: ${{ github.event.inputs.upload_facebook == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requests
        run: pip install requests

      - name: Download Rendered Video Artifact
        uses: actions/download-artifact@v4
        with:
          name: rendered-video
          path: media

      - name: Download Metadata Artifact
        uses: actions/download-artifact@v4
        with:
          name: gemini-metadata
          path: metadata

      - name: Write upload_facebook.py
        run: |
          cat > upload_facebook.py << 'PYEOF'
          #!/usr/bin/env python3
          import os, sys, json, argparse, requests

          GRAPH_API_VERSION = "v19.0"
          GRAPH_BASE = f"https://graph.facebook.com/{GRAPH_API_VERSION}"

          def init_upload_session(page_id, access_token, file_size, title):
              print("📋 Inisialisasi Facebook upload session...")
              url = f"{GRAPH_BASE}/{page_id}/video_reels"
              payload = {"upload_phase": "start", "access_token": access_token}
              resp = requests.post(url, data=payload)
              data = resp.json()
              if "error" in data:
                  print(f"❌ Gagal init session: {data['error'].get('message', data)}")
                  sys.exit(1)
              print(f"✅ Session OK — Video ID: {data.get('video_id')}")
              return {"video_id": data.get("video_id"), "upload_url": data.get("upload_url")}

          def upload_video_binary(upload_url, file_path, access_token):
              file_size = os.path.getsize(file_path)
              print(f"📤 Uploading ({file_size / (1024*1024):.1f} MB)...")
              with open(file_path, "rb") as f:
                  headers = {"Authorization": f"OAuth {access_token}", "offset": "0", "file_size": str(file_size)}
                  resp = requests.post(upload_url, headers=headers, data=f)
              if resp.status_code not in [200, 201]:
                  print(f"❌ Upload binary gagal: {resp.status_code} — {resp.text[:300]}")
                  sys.exit(1)
              print("✅ Binary upload berhasil!")
              return True

          def publish_reel(page_id, access_token, video_id, title, description):
              print("📢 Publishing sebagai Facebook Reel...")
              url = f"{GRAPH_BASE}/{page_id}/video_reels"
              payload = {
                  "video_id": video_id, "upload_phase": "finish", "access_token": access_token,
                  "video_state": "PUBLISHED", "description": description, "title": title[:255],
              }
              resp = requests.post(url, data=payload)
              data = resp.json()
              if "error" in data:
                  print(f"❌ Publish gagal: {data['error'].get('message', data)}")
                  sys.exit(1)
              reel_url = f"https://www.facebook.com/reel/{video_id}"
              print(f"✅ Facebook Reel published! URL: {reel_url}")
              return {"platform": "facebook", "video_id": video_id, "url": reel_url}

          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--file", required=True)
              parser.add_argument("--page-id", required=True)
              parser.add_argument("--access-token", required=True)
              parser.add_argument("--title", required=True)
              parser.add_argument("--description", default="")
              args = parser.parse_args()

              if not os.path.exists(args.file):
                  print(f"❌ File tidak ditemukan: {args.file}")
                  sys.exit(1)
              if not args.access_token or not args.access_token.strip():
                  print("❌ Facebook access token kosong!")
                  sys.exit(1)
              if not args.page_id or not args.page_id.strip():
                  print("❌ Facebook page ID kosong!")
                  sys.exit(1)

              session = init_upload_session(args.page_id, args.access_token, os.path.getsize(args.file), args.title)
              upload_video_binary(session["upload_url"], args.file, args.access_token)
              result = publish_reel(args.page_id, args.access_token, session["video_id"], args.title, args.description)

              results = []
              if os.path.exists("upload_results.json"):
                  with open("upload_results.json") as f:
                      results = json.load(f)
              results.append(result)
              with open("upload_results.json", "w") as f:
                  json.dump(results, f, indent=2)

              github_output = os.environ.get("GITHUB_OUTPUT", "")
              if github_output:
                  with open(github_output, "a") as f:
                      f.write(f"facebook_url={result['url']}\n")
                      f.write(f"facebook_video_id={result['video_id']}\n")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Upload to Facebook Reels
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          set -e
          VIDEO_FILE=$(find media -type f \( -name "*.mp4" -o -name "*.mov" \) | head -n 1)
          if [ -z "$VIDEO_FILE" ]; then
            echo "❌ Tidak ada file video di artifact media/"
            exit 1
          fi
          echo "Video ditemukan: $VIDEO_FILE"

          # Baca metadata dari Gemini secara otomatis
          TITLE=$(python3 -c "import json; print(json.load(open('metadata/gemini_result.json'))['title'])")
          CAPTION=$(python3 -c "import json; print(json.load(open('metadata/gemini_result.json'))['caption'])")
          HASHTAGS=$(python3 -c "import json; print(' '.join(json.load(open('metadata/gemini_result.json'))['hashtags']))")
          DESCRIPTION="$CAPTION\n\n$HASHTAGS"

          echo "Title: $TITLE"
          echo "Description: $DESCRIPTION"

          python3 upload_facebook.py \
            --file "$VIDEO_FILE" \
            --page-id "$FB_PAGE_ID" \
            --access-token "$FB_TOKEN" \
            --title "$TITLE" \
            --description "$DESCRIPTION"
