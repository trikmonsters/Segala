name: Google Vids Login Page Test

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email untuk diisi di halaman login'
        required: true
        default: 'kucingpaskib@gmail.com'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Start Fortress via Docker
        run: |
          docker run -d --rm -p 9222:9222 --name fortress tilion/fortress:latest
          echo "Menunggu Fortress siap..."
          sleep 10
          curl -s http://localhost:9222/json/version && echo "Fortress siap!"

      - name: Test Google Vids Login Page
        env:
          TEST_EMAIL: ${{ github.event.inputs.email }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cat > test_login.py << 'EOF'
          import asyncio
          import os
          import requests
          from datetime import datetime
          from playwright.async_api import async_playwright

          async def main():
              email = os.environ.get("TEST_EMAIL", "test@example.com")
              github_token = os.environ.get("GITHUB_TOKEN")
              repo = os.environ.get("GITHUB_REPOSITORY")
              
              timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
              screenshot_before = f"login_before_{timestamp}.png"
              screenshot_after = f"login_after_{timestamp}.png"
              
              async with async_playwright() as p:
                  browser = await p.chromium.connect_over_cdp("http://localhost:9222")
                  context = await browser.new_context()
                  page = await context.new_page()
                  
                  # 1. Buka halaman Google Vids (akan redirect ke login)
                  target_url = "https://docs.google.com/videos/u/4/"
                  print(f"Membuka {target_url}...")
                  await page.goto(target_url, wait_until="domcontentloaded")
                  await page.wait_for_timeout(5000)
                  
                  current_url = page.url
                  print(f"URL setelah redirect: {current_url}")
                  
                  # 2. Screenshot halaman login sebelum diisi
                  await page.screenshot(path=screenshot_before, full_page=True)
                  print(f"Screenshot sebelum: {screenshot_before}")
                  
                  # 3. Cari field email dan isi
                  print(f"Mengisi email: {email}")
                  email_selectors = [
                      'input[type="email"]',
                      'input[name="identifier"]',
                      'input[type="text"]',
                      'input[aria-label*="Email"]',
                      'input[aria-label*="email"]'
                  ]
                  
                  email_filled = False
                  for selector in email_selectors:
                      try:
                          await page.wait_for_selector(selector, timeout=3000)
                          await page.fill(selector, email)
                          email_filled = True
                          print(f"Email diisi dengan selector: {selector}")
                          break
                      except:
                          continue
                  
                  if not email_filled:
                      print("⚠️ Field email tidak ditemukan.")
                      await page.screenshot(path=screenshot_after, full_page=True)
                  else:
                      # 4. Klik tombol Next
                      print("Mengklik tombol Next...")
                      next_selectors = [
                          'button:has-text("Next")',
                          'button:has-text("Berikutnya")',
                          'button[type="submit"]',
                          '#identifierNext'
                      ]
                      
                      for selector in next_selectors:
                          try:
                              btn = page.locator(selector).first
                              if await btn.count() > 0:
                                  await btn.click()
                                  print(f"Tombol Next diklik dengan selector: {selector}")
                                  break
                          except:
                              continue
                      
                      # 5. Tunggu respons setelah klik Next
                      await page.wait_for_timeout(5000)
                      current_url_after = page.url
                      print(f"URL setelah klik Next: {current_url_after}")
                      
                      await page.screenshot(path=screenshot_after, full_page=True)
                      print(f"Screenshot setelah: {screenshot_after}")
                  
                  await browser.close()
              
              # === UPLOAD KE GITHUB RELEASE ===
              print("Mengupload ke GitHub Release...")
              tag_name = f"google-vids-test-{timestamp}"
              
              headers = {
                  "Authorization": f"token {github_token}",
                  "Accept": "application/vnd.github.v3+json"
              }
              
              release_data = {
                  "tag_name": tag_name,
                  "name": f"Google Vids Login Test - {timestamp}",
                  "body": f"Email yang diuji: {email}\nTimestamp: {timestamp}",
                  "draft": False,
                  "prerelease": False
              }
              
              release_url = f"https://api.github.com/repos/{repo}/releases"
              resp = requests.post(release_url, headers=headers, json=release_data)
              
              if resp.status_code == 201:
                  release = resp.json()
                  upload_url = release["upload_url"].replace("{?name,label}", "")
                  
                  for filename in [screenshot_before, screenshot_after]:
                      if os.path.exists(filename):
                          with open(filename, 'rb') as f:
                              upload_headers = {
                                  "Authorization": f"token {github_token}",
                                  "Content-Type": "image/png"
                              }
                              upload_resp = requests.post(
                                  f"{upload_url}?name={filename}",
                                  headers=upload_headers,
                                  data=f
                              )
                              
                              if upload_resp.status_code == 201:
                                  print(f"✅ {filename} berhasil diupload!")
                                  print(f"URL: {upload_resp.json()['browser_download_url']}")
                              else:
                                  print(f"❌ Gagal upload {filename}: {upload_resp.status_code}")
              else:
                  print(f"❌ Gagal buat release: {resp.status_code}")
                  print(resp.text)

          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          python test_login.py

      - name: Stop Fortress
        if: always()
        run: docker stop fortress || true
