name: Google Vids Login - Wait for Manual Confirmation

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email Google'
        required: true
        default: 'monscliped@gmail.com'

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # Batas maksimal 15 menit (cukup untuk konfirmasi manual)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Start Fortress via Docker
        run: |
          docker run -d --rm -p 9222:9222 --name fortress tilion/fortress:latest
          echo "Menunggu Fortress siap..."
          sleep 10
          curl -s http://localhost:9222/json/version && echo "Fortress siap!"

      - name: Login and Wait for Confirmation
        env:
          TEST_EMAIL: ${{ github.event.inputs.email }}
          TEST_PASSWORD: "Muntakul1967#"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cat > login_wait.py << 'EOF'
          import asyncio
          import os
          import requests
          from datetime import datetime
          from playwright.async_api import async_playwright

          async def main():
              email = os.environ.get("TEST_EMAIL", "")
              password = os.environ.get("TEST_PASSWORD", "")
              github_token = os.environ.get("GITHUB_TOKEN")
              repo = os.environ.get("GITHUB_REPOSITORY")
              
              timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
              screenshots = []
              is_logged_in = False
              
              async with async_playwright() as p:
                  browser = await p.chromium.connect_over_cdp("http://localhost:9222")
                  context = await browser.new_context()
                  page = await context.new_page()
                  
                  # 1. Buka Google Vids (redirect ke login)
                  print(f"Membuka https://docs.google.com/videos/u/4/ ...")
                  await page.goto("https://docs.google.com/videos/u/4/", wait_until="domcontentloaded")
                  await page.wait_for_timeout(5000)
                  print(f"URL: {page.url}")
                  
                  # 2. Isi email
                  print(f"Mengisi email: {email}")
                  email_selectors = [
                      'input[type="email"]',
                      'input[name="identifier"]',
                      'input[type="text"]',
                      'input[aria-label*="Email"]'
                  ]
                  email_filled = False
                  for selector in email_selectors:
                      try:
                          await page.wait_for_selector(selector, timeout=3000)
                          await page.fill(selector, email)
                          email_filled = True
                          print(f"✅ Email diisi: {selector}")
                          break
                      except:
                          continue
                  
                  if not email_filled:
                      print("❌ Field email tidak ditemukan.")
                      await browser.close()
                      return
                  
                  # 3. Klik Next
                  next_selectors = [
                      'button:has-text("Next")',
                      'button:has-text("Berikutnya")',
                      'button[type="submit"]',
                      '#identifierNext'
                  ]
                  for selector in next_selectors:
                      try:
                          btn = page.locator(selector).first
                          if await btn.count() > 0:
                              await btn.click()
                              print(f"✅ Next diklik: {selector}")
                              break
                      except:
                          continue
                  
                  # 4. Tunggu halaman password
                  await page.wait_for_timeout(5000)
                  print(f"URL setelah Next: {page.url}")
                  
                  # 5. Isi password
                  print("Mengisi password...")
                  password_selectors = [
                      'input[type="password"]',
                      'input[name="password"]',
                      'input[aria-label*="password"]',
                      'input[aria-label*="Password"]'
                  ]
                  password_filled = False
                  for selector in password_selectors:
                      try:
                          await page.wait_for_selector(selector, timeout=5000)
                          await page.fill(selector, password)
                          password_filled = True
                          print(f"✅ Password diisi: {selector}")
                          break
                      except:
                          continue
                  
                  if not password_filled:
                      print("❌ Field password tidak ditemukan.")
                      await browser.close()
                      return
                  
                  # 6. Klik Next untuk login
                  for selector in next_selectors:
                      try:
                          btn = page.locator(selector).first
                          if await btn.count() > 0:
                              await btn.click()
                              print(f"✅ Next diklik: {selector}")
                              break
                      except:
                          continue
                  
                  # 7. TUNGGU KONFIRMASI MANUAL (polling)
                  print("=" * 60)
                  print("MENUNGGU KONFIRMASI DARI HP ANDA...")
                  print("Silakan buka notifikasi Google di HP Anda,")
                  print("tap 'Yes' lalu tap angka yang muncul.")
                  print("Script akan terus memeriksa setiap 5 detik.")
                  print("=" * 60)
                  
                  max_wait = 600          # Maksimal 10 menit
                  elapsed = 0
                  check_interval = 5      # Cek setiap 5 detik
                  
                  while elapsed < max_wait:
                      current_url = page.url
                      title = await page.title()
                      print(f"[{elapsed}s] URL: {current_url[:80]}... | Title: {title[:50]}")
                      
                      # Cek apakah sudah masuk Google Vids
                      if "docs.google.com/videos" in current_url:
                          is_logged_in = True
                          print("✅ LOGIN BERHASIL! Konfirmasi diterima.")
                          break
                      
                      # Cek apakah masih di halaman verifikasi
                      if "accounts.google.com" in current_url:
                          if "challenge" in current_url.lower() or "verify" in title.lower():
                              # Masih menunggu konfirmasi
                              pass
                          else:
                              print("⚠️ Masih di halaman login Google.")
                      
                      # Ambil screenshot berkala (setiap 1 menit)
                      if elapsed % 60 == 0 and elapsed > 0:
                          ss = f"waiting_{elapsed}s_{timestamp}.png"
                          await page.screenshot(path=ss, full_page=True)
                          screenshots.append(ss)
                          print(f"📸 Screenshot progres: {ss}")
                      
                      await page.wait_for_timeout(check_interval * 1000)
                      elapsed += check_interval
                  
                  # 8. Screenshot akhir
                  final_ss = f"final_{timestamp}.png"
                  await page.screenshot(path=final_ss, full_page=True)
                  screenshots.append(final_ss)
                  print(f"📸 Screenshot akhir: {final_ss}")
                  print(f"URL akhir: {page.url}")
                  
                  if is_logged_in:
                      print("🎉 BERHASIL masuk ke Google Vids!")
                  else:
                      print("⏰ Waktu habis atau konfirmasi tidak diterima.")
                  
                  await browser.close()
              
              # === UPLOAD KE GITHUB RELEASE ===
              print("Upload ke GitHub Release...")
              tag_name = f"google-vids-login-{timestamp}"
              
              headers = {
                  "Authorization": f"token {github_token}",
                  "Accept": "application/vnd.github.v3+json"
              }
              
              release_data = {
                  "tag_name": tag_name,
                  "name": f"Google Vids Login - {timestamp}",
                  "body": f"Email: {email}\nStatus: {'BERHASIL' if is_logged_in else 'MENUNGGU/GAGAL'}\nTimestamp: {timestamp}",
                  "draft": False,
                  "prerelease": False
              }
              
              resp = requests.post(
                  f"https://api.github.com/repos/{repo}/releases",
                  headers=headers,
                  json=release_data
              )
              
              if resp.status_code == 201:
                  upload_url = resp.json()["upload_url"].replace("{?name,label}", "")
                  for filename in screenshots:
                      if os.path.exists(filename):
                          with open(filename, 'rb') as f:
                              upload_resp = requests.post(
                                  f"{upload_url}?name={filename}",
                                  headers={"Authorization": f"token {github_token}", "Content-Type": "image/png"},
                                  data=f
                              )
                              if upload_resp.status_code == 201:
                                  print(f"✅ {filename} diupload!")
                                  print(f"URL: {upload_resp.json()['browser_download_url']}")
                              else:
                                  print(f"❌ Gagal upload {filename}")
              else:
                  print(f"❌ Gagal buat release: {resp.status_code}")

          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          python login_wait.py

      - name: Stop Fortress
        if: always()
        run: docker stop fortress || true
