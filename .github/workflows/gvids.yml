name: Google Vids Login - Show All Elements Real-Time

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email Google'
        required: true
        default: 'monscliped@gmail.com'

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Start Fortress via Docker
        run: |
          docker run -d --rm -p 9222:9222 --name fortress tilion/fortress:latest
          echo "Menunggu Fortress siap..."
          sleep 10
          curl -s http://localhost:9222/json/version && echo "Fortress siap!"

      - name: Login and Dump All Elements
        env:
          TEST_EMAIL: ${{ github.event.inputs.email }}
          TEST_PASSWORD: "Muntakul1967#"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cat > dump_elements.py << 'EOF'
          import asyncio
          import os
          import re
          import requests
          from datetime import datetime
          from playwright.async_api import async_playwright

          def write_summary(text, append=True):
              """Tulis ke GitHub Step Summary."""
              summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_file:
                  mode = "a" if append else "w"
                  with open(summary_file, mode) as f:
                      f.write(text + "\n")

          async def dump_page_elements(page):
              """Ambil SEMUA elemen teks di halaman dan kembalikan sebagai list."""
              elements_data = []
              try:
                  # Ambil semua elemen yang punya teks langsung
                  elements = await page.locator(
                      'div, span, p, h1, h2, h3, h4, h5, h6, '
                      'button, a, label, strong, b, em, li, td, th'
                  ).all()
                  
                  for el in elements:
                      try:
                          text = await el.inner_text()
                          text = text.strip()
                          if not text or len(text) > 100:
                              continue
                          
                          # Ambil info tambahan
                          tag = await el.evaluate('el => el.tagName')
                          font_size = await el.evaluate(
                              'el => window.getComputedStyle(el).fontSize'
                          )
                          size_px = int(font_size.replace('px', '')) if font_size else 0
                          
                          # Cek apakah hanya angka 2 digit
                          is_code_candidate = bool(re.fullmatch(r'\d{2}', text))
                          
                          elements_data.append({
                              "tag": tag,
                              "text": text,
                              "font_size": size_px,
                              "is_code": is_code_candidate,
                          })
                      except:
                          continue
              except Exception as e:
                  print(f"Error dump: {e}")
              
              # Urutkan: kandidat kode dulu (angka 2 digit, font besar)
              elements_data.sort(
                  key=lambda x: (not x["is_code"], -x["font_size"])
              )
              return elements_data

          def format_elements(elements_data, title="ELEMEN HALAMAN"):
              """Format elemen jadi teks untuk summary."""
              lines = [f"### {title}", ""]
              lines.append("| # | Tag | Teks | Font | Kandidat Kode |")
              lines.append("|---|-----|------|------|---------------|")
              for i, el in enumerate(elements_data[:50]):  # Batasi 50 elemen
                  marker = "✅" if el["is_code"] else ""
                  # Escape pipe di teks
                  safe_text = el["text"].replace("|", "\\|")[:50]
                  lines.append(
                      f"| {i+1} | `{el['tag']}` | `{safe_text}` | "
                      f"{el['font_size']}px | {marker} |"
                  )
              return "\n".join(lines)

          async def main():
              email = os.environ.get("TEST_EMAIL", "")
              password = os.environ.get("TEST_PASSWORD", "")
              github_token = os.environ.get("GITHUB_TOKEN")
              repo = os.environ.get("GITHUB_REPOSITORY")
              
              timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
              screenshots = []
              is_logged_in = False
              last_url = ""
              last_element_count = 0
              
              # Inisialisasi summary
              write_summary(
                  f"# 🔐 Google Vids Login\n\n"
                  f"**Email:** `{email}`\n"
                  f"**Status:** ⏳ Berjalan...\n\n"
                  f"---\n",
                  append=False
              )
              
              async with async_playwright() as p:
                  browser = await p.chromium.connect_over_cdp("http://localhost:9222")
                  context = await browser.new_context()
                  page = await context.new_page()
                  
                  # 1. Buka Google Vids
                  print(f"[INFO] Membuka https://docs.google.com/videos/u/4/ ...")
                  await page.goto(
                      "https://docs.google.com/videos/u/4/",
                      wait_until="domcontentloaded"
                  )
                  await page.wait_for_timeout(5000)
                  print(f"[INFO] URL: {page.url}")
                  
                  # 2. Isi email
                  print(f"[INFO] Mengisi email: {email}")
                  for selector in [
                      'input[type="email"]',
                      'input[name="identifier"]',
                      'input[type="text"]',
                      'input[aria-label*="Email"]'
                  ]:
                      try:
                          await page.wait_for_selector(selector, timeout=3000)
                          await page.fill(selector, email)
                          print(f"[OK] Email diisi: {selector}")
                          break
                      except:
                          continue
                  
                  # 3. Klik Next
                  for selector in [
                      'button:has-text("Next")',
                      'button:has-text("Berikutnya")',
                      'button[type="submit"]',
                      '#identifierNext'
                  ]:
                      try:
                          btn = page.locator(selector).first
                          if await btn.count() > 0:
                              await btn.click()
                              print(f"[OK] Next diklik: {selector}")
                              break
                      except:
                          continue
                  
                  await page.wait_for_timeout(5000)
                  
                  # 4. Isi password
                  print(f"[INFO] Mengisi password...")
                  for selector in [
                      'input[type="password"]',
                      'input[name="password"]',
                      'input[aria-label*="password"]'
                  ]:
                      try:
                          await page.wait_for_selector(selector, timeout=5000)
                          await page.fill(selector, password)
                          print(f"[OK] Password diisi: {selector}")
                          break
                      except:
                          continue
                  
                  # 5. Klik Next
                  for selector in [
                      'button:has-text("Next")',
                      'button:has-text("Berikutnya")',
                      'button[type="submit"]',
                      '#identifierNext'
                  ]:
                      try:
                          btn = page.locator(selector).first
                          if await btn.count() > 0:
                              await btn.click()
                              print(f"[OK] Next diklik: {selector}")
                              break
                      except:
                          continue
                  
                  # 6. Tunggu halaman verifikasi
                  print(f"[INFO] Menunggu halaman verifikasi...")
                  await page.wait_for_timeout(8000)
                  
                  # === LOOP UTAMA: DUMP ELEMEN REAL-TIME ===
                  print("\n" + "=" * 70)
                  print("MEMANTAU HALAMAN VERIFIKASI SECARA REAL-TIME")
                  print("Semua elemen teks akan ditampilkan di Step Summary.")
                  print("Silakan cek tab 'Summary' di halaman Actions.")
                  print("=" * 70 + "\n")
                  
                  max_wait = 900       # 15 menit
                  elapsed = 0
                  dump_interval = 10   # Dump setiap 10 detik
                  last_dump_time = -999
                  
                  while elapsed < max_wait:
                      current_url = page.url
                      
                      # Cek apakah sudah login
                      if "docs.google.com/videos" in current_url:
                          is_logged_in = True
                          print(f"\n[SUCCESS] LOGIN BERHASIL pada detik ke-{elapsed}!")
                          write_summary(
                              f"\n---\n\n## ✅ LOGIN BERHASIL\n\n"
                              f"URL: `{current_url}`\n",
                              append=True
                          )
                          break
                      
                      # Dump elemen setiap interval
                      if elapsed - last_dump_time >= dump_interval:
                          last_dump_time = elapsed
                          
                          print(f"\n[{elapsed}s] URL: {current_url[:80]}")
                          print(f"[{elapsed}s] Mengambil semua elemen...")
                          
                          elements_data = await dump_page_elements(page)
                          print(f"[{elapsed}s] Total elemen: {len(elements_data)}")
                          
                          # Tampilkan kandidat kode di log
                          code_candidates = [
                              e for e in elements_data if e["is_code"]
                          ]
                          if code_candidates:
                              print(f"[{elapsed}s] 🎯 Kandidat kode (angka 2 digit):")
                              for c in code_candidates:
                                  print(
                                      f"    - '{c['text']}' "
                                      f"(font: {c['font_size']}px, tag: {c['tag']})"
                                  )
                          
                          # Tampilkan semua elemen di log (max 30)
                          print(f"[{elapsed}s] Semua elemen (max 30):")
                          for i, el in enumerate(elements_data[:30]):
                              marker = "🎯" if el["is_code"] else "  "
                              print(
                                  f"  {marker} [{i+1}] <{el['tag']}> "
                                  f"font={el['font_size']}px | '{el['text'][:60]}'"
                              )
                          
                          # Update Step Summary
                          write_summary(
                              f"\n---\n\n"
                              f"## ⏱️ Update @ {elapsed}s\n\n"
                              f"**URL:** `{current_url[:100]}`\n\n"
                              f"**Total elemen:** {len(elements_data)}\n\n"
                              f"**Kandidat kode (angka 2 digit):** "
                              f"{len(code_candidates)}\n\n",
                              append=True
                          )
                          
                          # Tabel elemen kandidat kode
                          if code_candidates:
                              write_summary(
                                  "### 🎯 Kandidat Kode Verifikasi\n\n"
                                  "| # | Angka | Font | Tag |\n"
                                  "|---|-------|------|-----|\n",
                                  append=True
                              )
                              for i, c in enumerate(code_candidates):
                                  write_summary(
                                      f"| {i+1} | **`{c['text']}`** | "
                                      f"{c['font_size']}px | `{c['tag']}` |",
                                      append=True
                                  )
                          
                          # Tabel semua elemen (max 40)
                          write_summary(
                              f"\n<details>\n<summary>📋 Semua Elemen "
                              f"(klik untuk expand)</summary>\n\n"
                              f"| # | Tag | Teks | Font | Kode? |\n"
                              f"|---|-----|------|------|-------|\n",
                              append=True
                          )
                          for i, el in enumerate(elements_data[:40]):
                              marker = "✅" if el["is_code"] else ""
                              safe_text = el["text"].replace("|", "\\|").replace(
                                  "\n", " "
                              )[:60]
                              write_summary(
                                  f"| {i+1} | `{el['tag']}` | `{safe_text}` | "
                                  f"{el['font_size']}px | {marker} |",
                                  append=True
                              )
                          write_summary("</details>\n", append=True)
                          
                          # Screenshot setiap 2 menit
                          if elapsed > 0 and elapsed % 120 == 0:
                              ss = f"progress_{elapsed}s_{timestamp}.png"
                              await page.screenshot(path=ss, full_page=True)
                              screenshots.append(ss)
                              print(f"[{elapsed}s] 📸 Screenshot: {ss}")
                      
                      await page.wait_for_timeout(5000)
                      elapsed += 5
                  
                  # Screenshot akhir
                  final_ss = f"final_{timestamp}.png"
                  await page.screenshot(path=final_ss, full_page=True)
                  screenshots.append(final_ss)
                  print(f"\n[INFO] Screenshot akhir: {final_ss}")
                  print(f"[INFO] URL akhir: {page.url}")
                  
                  if is_logged_in:
                      print("[SUCCESS] 🎉 BERHASIL masuk ke Google Vids!")
                  else:
                      print("[TIMEOUT] ⏰ Waktu habis.")
                  
                  await browser.close()
              
              # Upload ke Release
              print("\n[INFO] Upload ke GitHub Release...")
              tag_name = f"google-vids-login-{timestamp}"
              
              headers = {
                  "Authorization": f"token {github_token}",
                  "Accept": "application/vnd.github.v3+json"
              }
              
              body_text = f"Email: {email}\n"
              body_text += f"Status: {'BERHASIL' if is_logged_in else 'TIMEOUT'}\n"
              
              resp = requests.post(
                  f"https://api.github.com/repos/{repo}/releases",
                  headers=headers,
                  json={
                      "tag_name": tag_name,
                      "name": f"Google Vids Login - {timestamp}",
                      "body": body_text,
                      "draft": False,
                      "prerelease": False
                  }
              )
              
              if resp.status_code == 201:
                  upload_url = resp.json()["upload_url"].replace("{?name,label}", "")
                  for filename in screenshots:
                      if os.path.exists(filename):
                          with open(filename, 'rb') as f:
                              upload_resp = requests.post(
                                  f"{upload_url}?name={filename}",
                                  headers={
                                      "Authorization": f"token {github_token}",
                                      "Content-Type": "image/png"
                                  },
                                  data=f
                              )
                              if upload_resp.status_code == 201:
                                  print(f"[OK] {filename} diupload!")
              else:
                  print(f"[ERROR] Gagal buat release: {resp.status_code}")

          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          python dump_elements.py

      - name: Stop Fortress
        if: always()
        run: docker stop fortress || true
