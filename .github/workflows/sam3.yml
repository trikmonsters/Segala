name: Full Subtitle Detect, SAM2 Refine & LaMa AI Inpaint Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'image.png'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python Environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      # 3. Install System Dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      # 4. Install Python Dependencies (Torch, EasyOCR, SAM2, & LaMa Inpaint Cleaner)
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install easyocr opencv-python-headless pillow numpy ultralytics IOPaint

      # 5. Buat dan Jalankan Script Python In-line
      - name: Run Subtitle Detection, SAM2 Refine & LaMa AI Inpaint
        run: |
          cat << 'EOF' > process_lama_pipeline.py
          import os
          import sys
          import torch
          import numpy as np
          import cv2
          from PIL import Image
          import easyocr
          from ultralytics import SAM
          from iopaint.model_manager import ModelManager
          from iopaint.schema import InpaintRequest, HDStrategy

          def main():
              input_path = "image.png"
              output_mask_path = "output_mask.png"
              output_image_path = "output_masked.png"

              if not os.path.exists(input_path):
                  print(f"Error: File '{input_path}' tidak ditemukan di root repository!")
                  sys.exit(1)

              device = "cuda" if torch.cuda.is_available() else "cpu"
              print(f"Menggunakan device: {device}")

              # 1. DETECT: Deteksi lokasi Subtitle menggunakan EasyOCR
              print("\n1. Mendeteksi lokasi subtitle/teks dengan EasyOCR...")
              reader = easyocr.Reader(['en', 'id'], gpu=False)
              results_ocr = reader.readtext(input_path)

              bboxes = []
              for (bbox, text, prob) in results_ocr:
                  if prob > 0.15:
                      pts = np.array(bbox, dtype=np.int32)
                      x_min = int(np.min(pts[:, 0]))
                      y_min = int(np.min(pts[:, 1]))
                      x_max = int(np.max(pts[:, 0]))
                      y_max = int(np.max(pts[:, 1]))
                      
                      # Tambahkan margin padding agar area teks terjangkau sempurna
                      h_pad = int((y_max - y_min) * 0.12)
                      w_pad = int((x_max - x_min) * 0.05)
                      
                      bboxes.append([
                          max(0, x_min - w_pad), 
                          max(0, y_min - h_pad), 
                          x_max + w_pad, 
                          y_max + h_pad
                      ])
                      print(f"Text terdeteksi: '{text}' (Confidence: {prob:.2f})")

              image_cv = cv2.imread(input_path)
              h, w, _ = image_cv.shape

              if not bboxes:
                  print("Tidak ada subtitle terdeteksi.")
                  cv2.imwrite(output_image_path, image_cv)
                  cv2.imwrite(output_mask_path, np.zeros((h, w), dtype=np.uint8))
                  return

              # 2. REFINE: Presisi mask menggunakan SAM 2 Model
              print(f"\n2. Memperhalus mask dengan SAM 2...")
              sam_model = SAM("sam2_b.pt")

              combined_sam2_mask = np.zeros((h, w), dtype=np.uint8)
              results = sam_model(input_path, bboxes=bboxes, device=device)

              for result in results:
                  if result.masks is not None:
                      for mask_tensor in result.masks.data:
                          mask_np = mask_tensor.cpu().numpy().astype(np.uint8)
                          if mask_np.shape != (h, w):
                              mask_np = cv2.resize(mask_np, (w, h), interpolation=cv2.INTER_NEAREST)
                          combined_sam2_mask |= mask_np

              combined_sam2_mask = (combined_sam2_mask * 255).astype(np.uint8)

              # Dilasi tipis untuk mengambil sisa stroke/bayangan huruf
              kernel = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (5, 5))
              refined_mask = cv2.dilate(combined_sam2_mask, kernel, iterations=1)

              # Simpan mask biner
              cv2.imwrite(output_mask_path, refined_mask)

              # 3. DRAW / INPAINT: Rekonstruksi latar belakang menggunakan AI Model LaMa
              print("\n3. Memuat Model AI LaMa untuk merekonstruksi latar belakang...")
              # IOPaint akan mengunduh bobot model 'lama' secara otomatis saat pertama kali dijalankan
              lama_manager = ModelManager(name="lama", device=torch.device(device))
              
              img_pil = Image.open(input_path).convert("RGB")
              mask_pil = Image.fromarray(refined_mask).convert("L")

              # Eksekusi AI Drawing / Inpainting
              config = InpaintRequest(hd_strategy=HDStrategy.ORIGINAL)
              inpainted_pil = lama_manager(img_pil, mask_pil, config)

              # Simpan hasil akhir gambar yang di-draw ulang
              inpainted_pil.save(output_image_path)
              print(f"\nSelesai! Gambar berhasil digambar ulang oleh AI LaMa dan disimpan di '{output_image_path}'.")

          if __name__ == "__main__":
              main()
          EOF

          python process_lama_pipeline.py

      # 6. Upload Hasil sebagai Artifact
      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lama-ai-inpainted-result
          path: |
            output_masked.png
            output_mask.png
          retention-days: 7
