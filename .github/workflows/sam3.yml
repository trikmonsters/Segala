name: Full Subtitle Detect, SAM2 Refine & Resolution-Robust LaMa Inpaint

on:
  push:
    branches:
      - main
    paths:
      - 'image.png'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # refine=True is CPU-heavy, give it room

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python Environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
        

      # 3. Install System Dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 unzip

      # 4. Install Python Dependencies for detection/mask refinement
      - name: Install Detection/SAM2 Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install easyocr opencv-python-headless pillow numpy ultralytics

      # 5. Detect subtitle + refine mask with SAM2 (same as before, but write
      #    output in the naming convention the official lama repo expects)
      - name: Run Subtitle Detection & SAM2 Mask Refine
        run: |
          cat << 'EOF' > detect_and_mask.py
          import os
          import sys
          import numpy as np
          import cv2
          import easyocr
          from ultralytics import SAM

          def main():
              input_path = "image.png"
              indir = "lama_input"
              os.makedirs(indir, exist_ok=True)

              if not os.path.exists(input_path):
                  print(f"Error: File '{input_path}' tidak ditemukan di root repository!")
                  sys.exit(1)

              device = "cpu"
              print(f"Menggunakan device: {device}")

              print("\n1. Mendeteksi lokasi subtitle/teks dengan EasyOCR...")
              reader = easyocr.Reader(['en', 'id'], gpu=False)
              results_ocr = reader.readtext(input_path)

              bboxes = []
              for (bbox, text, prob) in results_ocr:
                  if prob > 0.15:
                      pts = np.array(bbox, dtype=np.int32)
                      x_min = int(np.min(pts[:, 0]))
                      y_min = int(np.min(pts[:, 1]))
                      x_max = int(np.max(pts[:, 0]))
                      y_max = int(np.max(pts[:, 1]))

                      h_pad = int((y_max - y_min) * 0.15)
                      w_pad = int((x_max - x_min) * 0.05)

                      bboxes.append([
                          max(0, x_min - w_pad),
                          max(0, y_min - h_pad),
                          x_max + w_pad,
                          y_max + h_pad
                      ])
                      print(f"Text terdeteksi: '{text}' (Confidence: {prob:.2f})")

              image_cv = cv2.imread(input_path)
              h, w, _ = image_cv.shape

              if not bboxes:
                  print("Tidak ada subtitle terdeteksi. Menyalin gambar asli sebagai output.")
                  cv2.imwrite("output_masked.png", image_cv)
                  cv2.imwrite("output_mask.png", np.zeros((h, w), dtype=np.uint8))
                  sys.exit(0)

              print(f"\n2. Memperhalus mask dengan SAM 2...")
              sam_model = SAM("sam2_b.pt")

              combined_sam2_mask = np.zeros((h, w), dtype=np.uint8)
              results = sam_model(input_path, bboxes=bboxes, device=device)

              for result in results:
                  if result.masks is not None:
                      for mask_tensor in result.masks.data:
                          mask_np = mask_tensor.cpu().numpy().astype(np.uint8)
                          if mask_np.shape != (h, w):
                              mask_np = cv2.resize(mask_np, (w, h), interpolation=cv2.INTER_NEAREST)
                          combined_sam2_mask |= mask_np

              combined_sam2_mask = (combined_sam2_mask * 255).astype(np.uint8)

              kernel = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (5, 5))
              refined_mask = cv2.dilate(combined_sam2_mask, kernel, iterations=1)

              # Keep a copy at repo root too, for the artifact upload step
              cv2.imwrite("output_mask.png", refined_mask)

              # Official lama predict.py pairs files by name: "image.png" +
              # "image_mask000.png" living together in the same indir.
              cv2.imwrite(os.path.join(indir, "image.png"), image_cv)
              cv2.imwrite(os.path.join(indir, "image_mask000.png"), refined_mask)

              print("\nMask siap di 'lama_input/' untuk diproses oleh LaMa resolution-robust refine.")

          if __name__ == "__main__":
              main()
          EOF

          python detect_and_mask.py

      # 6. Clone the official advimman/lama repo (this is the actual
      #    resolution-robust implementation, not the pip wrapper)
      - name: Clone official LaMa repository
        run: |
          git clone https://github.com/advimman/lama.git lama_repo

      # 7. Install LaMa's own dependencies. We already have a CPU torch/
      #    torchvision installed above; reinstall it last so requirements.txt
      #    doesn't silently pull a mismatched/CUDA build over it.
      - name: Install LaMa Dependencies
        run: |
          # lama_repo/requirements.txt was written for the NumPy 1.x era.
          # scikit-image==0.17.2 (and other old pins in that file) fail to
          # build against NumPy 2.x inside pip's isolated build sandbox, so
          # we pin numpy back down and disable build isolation first.
          pip install "numpy<2" Cython wheel setuptools
          pip install --no-build-isolation -r lama_repo/requirements.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu --force-reinstall
          pip install wldhx.yadisk-direct

      # 8. Download the real big-lama checkpoint (config + weights), not a
      #    single traced .pt file. Official distribution lives on Yandex
      #    Disk; wldhx.yadisk-direct resolves it to a direct download URL.
      #    NOTE: this is the same link the authors' own Colab notebook uses.
      #    If it ever goes stale, grab the current share link from
      #    https://github.com/advimman/lama#inference- and swap it in below.
      - name: Download big-lama checkpoint
        run: |
          curl -L $(yadisk-direct https://disk.yandex.ru/d/ouP6l8VJ0HpMZg) -o big-lama.zip
          unzip -o big-lama.zip -d .
          ls -la big-lama

      # 9. Run resolution-robust inpainting via refine=True
      - name: Run LaMa Inpainting (refine=True)
        run: |
          export TORCH_HOME=$(pwd)
          export PYTHONPATH=$(pwd)/lama_repo
          python3 lama_repo/bin/predict.py \
            model.path=$(pwd)/big-lama \
            indir=$(pwd)/lama_input \
            outdir=$(pwd)/lama_output \
            dataset.img_suffix=.png \
            refine=True

          # Normalize output filename for the artifact step
          cp lama_output/image.png output_masked.png

      # 10. Upload Hasil sebagai Artifact
      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lama-inpainted-result
          path: |
            output_masked.png
            output_mask.png
          retention-days: 7
