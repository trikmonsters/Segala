name: Full Resolution Robust Subtitle Removal (EasyOCR + SAM2 + Official LaMa)

on:
  push:
    branches:
      - main
    paths:
      - 'image.png'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python Environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          

      # 3. Install System Dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 wget unzip

      # 4. Clone Official LaMa Repo & Download Big-LaMa Model
      - name: Setup Official LaMa Environment
        run: |
          git clone https://github.com/advimman/lama.git
          cd lama
          # Download Pretrained Model 'big-lama' resmi dari Samsung AI
          mkdir -p checkpoints
          wget -q https://github.com/advimman/lama/releases/download/v0.1.0/big-lama.zip
          unzip -q big-lama.zip -d checkpoints/
          cd ..

      # 5. Install Python Dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install easyocr opencv-python-headless pillow numpy ultralytics omegaconf pytorch-lightning hydra-core

      # 6. Jalankan Script OCR + SAM2 untuk Membuat High-Res Mask
      - name: Run Subtitle Detection & SAM2 Mask Refine
        run: |
          cat << 'EOF' > generate_mask.py
          import os
          import sys
          import torch
          import numpy as np
          import cv2
          from PIL import Image
          import easyocr
          from ultralytics import SAM

          def main():
              input_path = "image.png"
              
              # Buat direktori input khusus untuk LaMa resmi
              os.makedirs("lama_input", exist_ok=True)
              
              if not os.path.exists(input_path):
                  print(f"Error: File '{input_path}' tidak ditemukan!")
                  sys.exit(1)

              device = "cpu"
              
              # Save copy image ke folder lama_input
              img_pil = Image.open(input_path).convert("RGB")
              img_pil.save("lama_input/image.png")
              w, h = img_pil.size

              print("1. Mendeteksi lokasi subtitle menggunakan EasyOCR...")
              reader = easyocr.Reader(['en', 'id'], gpu=False)
              results_ocr = reader.readtext(input_path)

              bboxes = []
              for (bbox, text, prob) in results_ocr:
                  if prob > 0.15:
                      pts = np.array(bbox, dtype=np.int32)
                      x_min = int(np.min(pts[:, 0]))
                      y_min = int(np.min(pts[:, 1]))
                      x_max = int(np.max(pts[:, 0]))
                      y_max = int(np.max(pts[:, 1]))
                      
                      # Margin padding tipis
                      h_pad = int((y_max - y_min) * 0.15)
                      w_pad = int((x_max - x_min) * 0.05)
                      
                      bboxes.append([
                          max(0, x_min - w_pad), 
                          max(0, y_min - h_pad), 
                          min(w, x_max + w_pad), 
                          min(h, y_max + h_pad)
                      ])
                      print(f"Text terdeteksi: '{text}' (Conf: {prob:.2f})")

              if not bboxes:
                  print("Tidak ada subtitle terdeteksi.")
                  # Buat mask kosong
                  empty_mask = np.zeros((h, w), dtype=np.uint8)
                  cv2.imwrite("lama_input/image_mask.png", empty_mask)
                  return

              print(f"\n2. Memperhalus mask dengan SAM 2...")
              sam_model = SAM("sam2_b.pt")

              combined_sam2_mask = np.zeros((h, w), dtype=np.uint8)
              results = sam_model(input_path, bboxes=bboxes, device=device)

              for result in results:
                  if result.masks is not None:
                      for mask_tensor in result.masks.data:
                          mask_np = mask_tensor.cpu().numpy().astype(np.uint8)
                          if mask_np.shape != (h, w):
                              mask_np = cv2.resize(mask_np, (w, h), interpolation=cv2.INTER_NEAREST)
                          combined_sam2_mask |= mask_np

              combined_sam2_mask = (combined_sam2_mask * 255).astype(np.uint8)

              # Dilasi tipis untuk mengambil sisa stroke/glow
              kernel = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (5, 5))
              refined_mask = cv2.dilate(combined_sam2_mask, kernel, iterations=1)

              # Format nama file mask sesuai requirement advimman/lama (harus image_mask.png)
              cv2.imwrite("lama_input/image_mask.png", refined_mask)
              cv2.imwrite("output_mask.png", refined_mask)
              print("Mask resolusi tinggi berhasil dibuat.")

          if __name__ == "__main__":
              main()
          EOF

          python generate_mask.py

      # 7. Run Official LaMa Inpainting Engine
      - name: Run Official LaMa High-Res Inpainting
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/lama
          python lama/bin/predict.py \
            model.path=$(pwd)/lama/checkpoints/big-lama \
            indir=$(pwd)/lama_input \
            outdir=$(pwd)/lama_output \
            dataset.img_suffix=.png \
            device=cpu

          # Copy hasil akhir ke root dengan nama output_masked.png
          cp lama_output/image_mask.png output_masked.png || cp image.png output_masked.png

      # 8. Upload Hasil sebagai Artifact
      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: highres-lama-result
          path: |
            output_masked.png
            output_mask.png
          retention-days: 7
