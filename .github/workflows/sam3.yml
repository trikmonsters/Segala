name: Full Subtitle Detect, SAM2 Refine & LaMa Resolution-Robust Inpaint

on:
  push:
    branches:
      - main
    paths:
      - 'image.png'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
    

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install easyocr opencv-python-headless pillow numpy ultralytics omegaconf hydra-core

      - name: Run Subtitle Detection, SAM2 Refine & LaMa Inpaint
        run: |
          cat << 'EOF' > process_lama_robust.py
          import os
          import sys
          import torch
          import numpy as np
          import cv2
          from PIL import Image
          import easyocr
          from ultralytics import SAM
          import urllib.request
          import yaml
          from omegaconf import OmegaConf

          # Download LaMa model files
          def download_lama_model():
              model_dir = "lama_models"
              os.makedirs(model_dir, exist_ok=True)
              
              # Download pre-trained weights
              model_url = "https://huggingface.co/smartywu/lama-cleaner-coarse/resolve/main/lama_mpe.pt"
              model_path = os.path.join(model_dir, "lama_mpe.pt")
              
              if not os.path.exists(model_path):
                  print(f"Downloading LaMa model... (ini akan memakan waktu)")
                  urllib.request.urlretrieve(model_url, model_path)
              
              return model_path

          # Load custom LaMa model
          def load_lama_model(model_path, device):
              model = torch.jit.load(model_path, map_location=device)
              model.eval()
              return model

          def main():
              input_path = "image.png"
              output_mask_path = "output_mask.png"
              output_image_path = "output_masked.png"

              if not os.path.exists(input_path):
                  print(f"Error: File '{input_path}' tidak ditemukan!")
                  sys.exit(1)

              device = "cpu"
              print(f"Menggunakan device: {device}")

              # 1. DETECT Subtitle dengan EasyOCR
              print("\n1. Mendeteksi lokasi subtitle/teks dengan EasyOCR...")
              reader = easyocr.Reader(['en', 'id'], gpu=False)
              results_ocr = reader.readtext(input_path)

              bboxes = []
              for (bbox, text, prob) in results_ocr:
                  if prob > 0.15:
                      pts = np.array(bbox, dtype=np.int32)
                      x_min = int(np.min(pts[:, 0]))
                      y_min = int(np.min(pts[:, 1]))
                      x_max = int(np.max(pts[:, 0]))
                      y_max = int(np.max(pts[:, 1]))
                      
                      h_pad = int((y_max - y_min) * 0.15)
                      w_pad = int((x_max - x_min) * 0.05)
                      
                      bboxes.append([
                          max(0, x_min - w_pad), 
                          max(0, y_min - h_pad), 
                          x_max + w_pad, 
                          y_max + h_pad
                      ])
                      print(f"Text: '{text}' (Confidence: {prob:.2f})")

              image_cv = cv2.imread(input_path)
              h, w, _ = image_cv.shape

              if not bboxes:
                  print("Tidak ada subtitle terdeteksi.")
                  cv2.imwrite(output_image_path, image_cv)
                  cv2.imwrite(output_mask_path, np.zeros((h, w), dtype=np.uint8))
                  return

              # 2. REFINE Mask dengan SAM 2
              print(f"\n2. Memperhalus mask dengan SAM 2...")
              sam_model = SAM("sam2_b.pt")

              combined_sam2_mask = np.zeros((h, w), dtype=np.uint8)
              results = sam_model(input_path, bboxes=bboxes, device=device)

              for result in results:
                  if result.masks is not None:
                      for mask_tensor in result.masks.data:
                          mask_np = mask_tensor.cpu().numpy().astype(np.uint8)
                          if mask_np.shape != (h, w):
                              mask_np = cv2.resize(mask_np, (w, h), interpolation=cv2.INTER_NEAREST)
                          combined_sam2_mask |= mask_np

              combined_sam2_mask = (combined_sam2_mask * 255).astype(np.uint8)

              kernel = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (5, 5))
              refined_mask = cv2.dilate(combined_sam2_mask, kernel, iterations=1)

              cv2.imwrite(output_mask_path, refined_mask)

              # 3. INPAINT dengan LaMa Resolution-Robust
              print("\n3. Inpainting dengan model LaMa resolution-robust...")
              
              # Download dan load model
              model_path = download_lama_model()
              lama_model = load_lama_model(model_path, device)

              # Normalize input
              img_np = cv2.cvtColor(image_cv, cv2.COLOR_BGR2RGB)
              img_normalized = img_np.astype(np.float32) / 255.0

              # Prepare mask (normalize ke 0-1)
              mask_normalized = refined_mask.astype(np.float32) / 255.0

              # Convert ke tensor (batch, channels, height, width)
              img_tensor = torch.from_numpy(img_normalized).permute(2, 0, 1).unsqueeze(0)
              mask_tensor = torch.from_numpy(mask_normalized).unsqueeze(0).unsqueeze(0)

              # Process inpainting
              with torch.no_grad():
                  output_tensor = lama_model(img_tensor, mask_tensor)
              
              # Convert output back to image
              output_np = output_tensor.squeeze(0).permute(1, 2, 0).cpu().numpy()
              output_np = (output_np * 255).astype(np.uint8)
              output_cv = cv2.cvtColor(output_np, cv2.COLOR_RGB2BGR)

              cv2.imwrite(output_image_path, output_cv)
              print(f"Selesai! Hasil inpainting disimpan di '{output_image_path}'.")

          if __name__ == "__main__":
              main()
          EOF

          python process_lama_robust.py

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lama-inpainted-result
          path: |
            output_masked.png
            output_mask.png
          retention-days: 7
