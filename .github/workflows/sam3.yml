name: Full Subtitle Detect, SAM2 Refine & LaMa Inpainting (Optimized)

on:
  push:
    branches:
      - main
    paths:
      - 'image.png'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install easyocr opencv-python-headless pillow numpy ultralytics lama-cleaner

      - name: Run Full Pipeline
        run: |
          cat << 'EOF' > process_lama_optimized.py
          import os
          import sys
          import torch
          import numpy as np
          import cv2
          from PIL import Image
          import easyocr
          from ultralytics import SAM
          from pathlib import Path

          # Import lama_cleaner models
          from lama_cleaner.model.lama import LaMa
          from lama_cleaner.device import Device

          def main():
              input_path = "image.png"
              output_mask_path = "output_mask.png"
              output_image_path = "output_masked.png"

              if not os.path.exists(input_path):
                  print(f"Error: File '{input_path}' tidak ditemukan!")
                  sys.exit(1)

              device = Device.CPU
              print(f"Menggunakan device: {device}")

              # 1. DETECT Subtitle dengan EasyOCR
              print("\n1. Mendeteksi subtitle/teks dengan EasyOCR...")
              reader = easyocr.Reader(['en', 'id'], gpu=False)
              results_ocr = reader.readtext(input_path)

              bboxes = []
              for (bbox, text, prob) in results_ocr:
                  if prob > 0.15:
                      pts = np.array(bbox, dtype=np.int32)
                      x_min = int(np.min(pts[:, 0]))
                      y_min = int(np.min(pts[:, 1]))
                      x_max = int(np.max(pts[:, 0]))
                      y_max = int(np.max(pts[:, 1]))
                      
                      h_pad = int((y_max - y_min) * 0.15)
                      w_pad = int((x_max - x_min) * 0.05)
                      
                      bboxes.append([
                          max(0, x_min - w_pad), 
                          max(0, y_min - h_pad), 
                          x_max + w_pad, 
                          y_max + h_pad
                      ])
                      print(f"CompleteText: '{text}' (Confidence: {prob:.2f})")

              image_cv = cv2.imread(input_path)
              h, w, _ = image_cv.shape

              if not bboxes:
                  print("Tidak ada subtitle terdeteksi.")
                  cv2.imwrite(output_image_path, image_cv)
                  cv2.imwrite(output_mask_path, np.zeros((h, w), dtype=np.uint8))
                  return

              # 2. REFINE Mask dengan SAM 2
              print(f"\n2. Memperhalus mask dengan SAM 2...")
              sam_model = SAM("sam2_b.pt")

              combined_sam2_mask = np.zeros((h, w), dtype=np.uint8)
              results = sam_model(input_path, bboxes=bboxes, device='cpu')

              for result in results:
                  if result.masks is not None:
                      for mask_tensor in result.masks.data:
                          mask_np = mask_tensor.cpu().numpy().astype(np.uint8)
                          if mask_np.shape != (h, w):
                              mask_np = cv2.resize(mask_np, (w, h), interpolation=cv2.INTER_NEAREST)
                          combined_sam2_mask |= mask_np

              combined_sam2_mask = (combined_sam2_mask * 255).astype(np.uint8)

              # Morphological operations untuk hasil lebih halus
              kernel = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (7, 7))
              refined_mask = cv2.morphologyEx(combined_sam2_mask, cv2.MORPH_CLOSE, kernel)
              refined_mask = cv2.GaussianBlur(refined_mask, (5, 5), 0)
              _, refined_mask = cv2.threshold(refined_mask, 127, 255, cv2.THRESH_BINARY)

              cv2.imwrite(output_mask_path, refined_mask)
              print(f"Mask disimpan ke '{output_mask_path}'")

              # 3. INPAINT dengan LaMa dari lama_cleaner
              print("\n3. Inpainting dengan LaMa (resolution-robust)...")
              
              # Load LaMa model
              model = LaMa(device=device)

              # Load images
              img_pil = Image.open(input_path).convert("RGB")
              mask_pil = Image.fromarray(refined_mask).convert("L")

              # Convert to numpy arrays (LaMa expects numpy)
              img_np = np.array(img_pil)
              mask_np = np.array(mask_pil)

              # Ensure mask is binary
              mask_np = (mask_np > 127).astype(np.uint8) * 255

              print("Processing inpainting... (ini mungkin memakan waktu beberapa menit di CPU)")
              
              # Inpaint dengan LaMa
              output_np = model(img_np, mask_np)

              # Convert back to PIL
              output_pil = Image.fromarray(output_np.astype(np.uint8))

              # Optional: Sharpening untuk mengurangi blur
              from PIL import ImageEnhance
              enhancer = ImageEnhance.Sharpness(output_pil)
              output_pil = enhancer.enhance(1.2)

              output_pil.save(output_image_path)
              print(f"\n✅ Selesai! Hasil disimpan ke '{output_image_path}'")

          if __name__ == "__main__":
              main()
          EOF

          python process_lama_optimized.py

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lama-inpainted-result
          path: |
            output_masked.png
            output_mask.png
          retention-days: 7
