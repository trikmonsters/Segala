name: Full Pipeline - EasyOCR + SAM2 + Official LaMa Inpainting

on:
  push:
    branches:
      - main
    paths:
      - 'image.png'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Clear Pip Cache & Install Dependencies (NumPy 2.x Compatible)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # CLEAR pip cache completely
          pip cache purge
          # Uninstall any existing torch/torchvision
          pip uninstall -y torch torchvision torchaudio
          # Install NumPy FIRST, explicitly <2
          pip install "numpy<2" --force-reinstall --no-cache-dir
          # Install PyTorch 2.x LAST with explicit CPU index
          pip install --no-cache-dir --force-reinstall \
            torch==2.1.2 torchvision==0.16.2 \
            --index-url https://download.pytorch.org/whl/cpu
          # Verify versions
          python -c "import torch; import numpy as np; print(f'PyTorch: {torch.__version__}'); print(f'NumPy: {np.__version__}')"
          # Install other deps
          pip install --no-cache-dir \
            easyocr opencv-python-headless pillow \
            ultralytics \
            omegaconf hydra-core pyyaml scikit-image scikit-learn \
            tqdm easydict matplotlib pandas joblib \
            albumentations==0.5.2 pytorch-lightning==1.2.9 \
            kornia==0.5.0 webdataset packaging
          echo "✅ Semua dependencies terinstall dengan PyTorch 2.1.2 + NumPy <2"

      - name: Clone LaMa Repository
        run: |
          git clone https://github.com/advimman/lama.git
          cd lama && pwd && ls -la

      - name: Download LaMa Model (big-lama)
        run: |
          cd lama
          mkdir -p models
          echo "📥 Downloading big-lama model from HuggingFace..."
          curl -L -o big-lama.zip https://huggingface.co/smartywu/big-lama/resolve/main/big-lama.zip
          echo "📦 Extracting..."
          unzip -q big-lama.zip -d models/
          ls -la models/
          echo "✅ Model LaMa sudah didownload dan diekstrak"

      - name: Run Full Pipeline
        run: |
          export TORCH_HOME=$(pwd)/lama
          export PYTHONPATH=$(pwd)/lama:$PYTHONPATH
          
          cat << 'EOFPYTHON' > run_pipeline.py
          import os
          import sys
          import torch
          import numpy as np
          import cv2
          from PIL import Image, ImageEnhance
          import easyocr
          from ultralytics import SAM
          
          # Add lama to path
          sys.path.insert(0, './lama')

          def main():
              input_path = "image.png"
              output_mask_path = "output_mask.png"
              output_image_path = "output_masked.png"

              if not os.path.exists(input_path):
                  print(f"❌ Error: File '{input_path}' tidak ditemukan!")
                  sys.exit(1)

              device = "cpu"
              print(f"🔧 Device: {device}")
              print(f"NumPy version: {np.__version__}")
              print(f"PyTorch version: {torch.__version__}")

              # ============================================================
              # 1. DETECT Subtitle dengan EasyOCR
              # ============================================================
              print("\n📝 [1] Mendeteksi subtitle/teks dengan EasyOCR...")
              reader = easyocr.Reader(['en', 'id'], gpu=False)
              results_ocr = reader.readtext(input_path)

              bboxes = []
              for (bbox, text, prob) in results_ocr:
                  if prob > 0.15:
                      pts = np.array(bbox, dtype=np.int32)
                      x_min = int(np.min(pts[:, 0]))
                      y_min = int(np.min(pts[:, 1]))
                      x_max = int(np.max(pts[:, 0]))
                      y_max = int(np.max(pts[:, 1]))
                      
                      h_pad = int((y_max - y_min) * 0.15)
                      w_pad = int((x_max - x_min) * 0.05)
                      
                      bbox_padded = [
                          max(0, x_min - w_pad), 
                          max(0, y_min - h_pad), 
                          x_max + w_pad, 
                          y_max + h_pad
                      ]
                      bboxes.append(bbox_padded)
                      print(f"   ✓ '{text}' (Confidence: {prob:.2f})")

              image_cv = cv2.imread(input_path)
              h, w, _ = image_cv.shape

              if not bboxes:
                  print("   ⚠️  Tidak ada subtitle terdeteksi.")
                  cv2.imwrite(output_image_path, image_cv)
                  cv2.imwrite(output_mask_path, np.zeros((h, w), dtype=np.uint8))
                  return

              # ============================================================
              # 2. REFINE Mask dengan SAM 2
              # ============================================================
              print(f"\n🎯 [2] Memperhalus mask dengan SAM 2...")
              sam_model = SAM("sam2_b.pt")

              combined_sam2_mask = np.zeros((h, w), dtype=np.uint8)
              results = sam_model(input_path, bboxes=bboxes, device=device)

              for result in results:
                  if result.masks is not None:
                      for mask_tensor in result.masks.data:
                          mask_np = mask_tensor.cpu().numpy().astype(np.uint8)
                          if mask_np.shape != (h, w):
                              mask_np = cv2.resize(mask_np, (w, h), interpolation=cv2.INTER_NEAREST)
                          combined_sam2_mask |= mask_np

              combined_sam2_mask = (combined_sam2_mask * 255).astype(np.uint8)

              # Morphological refinement
              kernel = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (7, 7))
              refined_mask = cv2.morphologyEx(combined_sam2_mask, cv2.MORPH_CLOSE, kernel)
              refined_mask = cv2.GaussianBlur(refined_mask, (5, 5), 0)
              _, refined_mask = cv2.threshold(refined_mask, 127, 255, cv2.THRESH_BINARY)

              cv2.imwrite(output_mask_path, refined_mask)
              print(f"   ✓ Mask disimpan ke '{output_mask_path}'")

              # ============================================================
              # 3. INPAINT dengan Official LaMa
              # ============================================================
              print(f"\n🦙 [3] Inpainting dengan Official LaMa Model...")
              
              try:
                  import yaml
                  from saicinpainting.training.modules.build import build_model

                  # Load model config
                  config_file = './lama/models/big-lama/config.yaml'
                  with open(config_file, 'r') as f:
                      model_cfg = yaml.safe_load(f)

                  print("   📦 Building LaMa model...")
                  model = build_model(model_cfg)

                  # Load checkpoint
                  checkpoint_path = './lama/models/big-lama/best.ckpt'
                  print(f"   📥 Loading checkpoint from {checkpoint_path}...")
                  checkpoint = torch.load(checkpoint_path, map_location=device)
                  
                  if 'state_dict' in checkpoint:
                      state_dict = checkpoint['state_dict']
                  else:
                      state_dict = checkpoint

                  model.load_state_dict(state_dict, strict=False)
                  model = model.to(device)
                  model.eval()
                  print("   ✓ Model loaded successfully")

                  # Prepare image and mask
                  img_np = cv2.imread(input_path)
                  img_np = cv2.cvtColor(img_np, cv2.COLOR_BGR2RGB)
                  mask_np = cv2.imread(output_mask_path, cv2.IMREAD_GRAYSCALE)
                  mask_np = (mask_np > 127).astype(np.float32)

                  # Normalize image to [0, 1]
                  img_tensor = torch.from_numpy(img_np).float() / 255.0
                  img_tensor = img_tensor.permute(2, 0, 1).unsqueeze(0)
                  
                  # LaMa expects [-1, 1] normalization
                  img_tensor = img_tensor * 2 - 1
                  mask_tensor = torch.from_numpy(mask_np).float().unsqueeze(0).unsqueeze(0)

                  img_tensor = img_tensor.to(device)
                  mask_tensor = mask_tensor.to(device)

                  # Inpaint
                  print("   ⏳ Processing inpainting (bisa memakan waktu di CPU)...")
                  with torch.no_grad():
                      output_tensor = model(img_tensor, mask_tensor)

                  # Denormalize
                  output_tensor = (output_tensor + 1) / 2
                  output_np = output_tensor.squeeze(0).permute(1, 2, 0).cpu().numpy()
                  output_np = np.clip(output_np * 255, 0, 255).astype(np.uint8)

                  # Sharpening untuk reduce blur
                  output_pil = Image.fromarray(output_np)
                  enhancer = ImageEnhance.Sharpness(output_pil)
                  output_pil = enhancer.enhance(1.3)
                  output_pil.save(output_image_path)

                  print(f"   ✓ Hasil inpainting disimpan ke '{output_image_path}'")
                  print(f"\n✅ SELESAI! Semua hasil sudah diproses dengan LaMa.")

              except Exception as e:
                  print(f"❌ Error di LaMa inpainting: {e}")
                  import traceback
                  traceback.print_exc()
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOFPYTHON

          python run_pipeline.py

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lama-inpainted-result
          path: |
            output_masked.png
            output_mask.png
          retention-days: 7
