name: VibeVoice Custom Voice Cloning

on:
  workflow_dispatch: # Mengizinkan Anda memicu proses ini secara manual

jobs:
  run-tts:
    # Catatan: Jika Anda menggunakan PC sendiri dengan GPU, ubah 'ubuntu-latest' menjadi 'self-hosted'
    runs-on: ubuntu-latest 
    
    steps:
      - name: 1. Checkout Repository Anda
        uses: actions/checkout@v4
        
      - name: 2. Setup Python Lingkungan
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 3. Install Dependensi Sistem (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
      - name: 4. Clone Repositori VibeVoice
        run: |
          git clone https://github.com/vibevoice-community/VibeVoice.git
          
      - name: 5. Install VibeVoice (Pip)
        run: |
          cd VibeVoice
          pip install -e .
          
      - name: 6. Siapkan Custom Voice dan Teks Anda
        run: |
          # Model VibeVoice akan mendeteksi file suara di dalam direktori voices/
          mkdir -p VibeVoice/demo/voices
          
          # Salin file .wav suara Anda ke dalam folder voices VibeVoice
          cp MyVoice.wav VibeVoice/demo/voices/MyVoice.wav
          
          # Salin file naskah teks Anda
          cp input_text.txt VibeVoice/input_text.txt
          
      - name: 7. Jalankan Inferensi (Proses Cloning Suara)
        run: |
          cd VibeVoice
          python demo/inference_from_file.py \
            --model_path vibevoice/VibeVoice-1.5B \
            --txt_path input_text.txt \
            --speaker_names MyVoice
            
      - name: 8. Upload Hasil Audio
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Cloning-Suara
          # Menangkap semua file .wav hasil generate agar bisa Anda unduh
          path: VibeVoice/*.wav
