name: VibeVoice Custom Voice Cloning

on:
  workflow_dispatch: 

jobs:
  run-tts:
    runs-on: ubuntu-latest 
    
    steps:
      - name: 1. Checkout Repository Anda
        uses: actions/checkout@v4
        
      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 3. Install Dependensi (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
      - name: 4. Clone Repositori VibeVoice
        run: |
          git clone https://github.com/vibevoice-community/VibeVoice.git
          
      - name: 5. Install VibeVoice (Pip)
        run: |
          cd VibeVoice
          pip install -e .
          
      - name: 6. Siapkan Custom Voice & Generate Teks Otomatis
        run: |
          mkdir -p VibeVoice/demo/voices
          
          # Kita copy file suara Anda (apapun namanya yang berawalan MyVoi) 
          # lalu kita paksa ubah namanya menjadi MyVoice.wav agar rapi
          cp MyVoi*.wav VibeVoice/demo/voices/MyVoice.wav
          
          # Masuk ke folder VibeVoice
          cd VibeVoice
          
          # Kita BUAT file teks otomatis di sini dengan format yang 100% benar.
          # Anda bisa mengubah kalimat di dalam tanda kutip ini nanti:
          echo "[MyVoice] Halo, ini adalah percobaan cloning suara menggunakan GitHub Actions dan model Vibe Voice." > input_text.txt
          
          # Tampilkan isi teks ke log untuk verifikasi
          echo "=== ISI FILE TEKS ==="
          cat input_text.txt
          echo "====================="
          
      - name: 7. Jalankan Inferensi (Proses Cloning Suara)
        run: |
          cd VibeVoice
          python demo/inference_from_file.py \
            --model_path vibevoice/VibeVoice-1.5B \
            --txt_path input_text.txt \
            --speaker_names MyVoice
            
      - name: 8. Upload Hasil Audio
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Cloning-Suara
          path: VibeVoice/*.wav
