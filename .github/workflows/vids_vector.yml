name: Stock Video Factory

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of videos per category"
        required: false
        default: "8"
      duration:
        description: "Duration in seconds"
        required: false
        default: "5"
      fps:
        description: "FPS"
        required: false
        default: "30"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Create generator
        shell: bash
        run: |
          cat > generator.py <<'PYTHON'
          import os
          import csv
          import math
          import random
          import shutil
          import subprocess
          from pathlib import Path

          WIDTH = 1920
          HEIGHT = 1080

          FPS = int(os.environ.get("FPS", "30"))
          DURATION = float(os.environ.get("DURATION", "5"))
          COUNT = int(os.environ.get("COUNT", "8"))

          FRAMES = int(FPS * DURATION)

          ROOT = Path("stock_output")
          FRAMES_DIR = ROOT / "_frames"

          ROOT.mkdir(exist_ok=True)
          FRAMES_DIR.mkdir(exist_ok=True)

          PALETTES = [
              {
                  "main": "#EF4444",
                  "secondary": "#B91C1C",
                  "accent": "#FFFFFF",
                  "background": "#FFF7F7"
              },
              {
                  "main": "#F97316",
                  "secondary": "#C2410C",
                  "accent": "#FFFFFF",
                  "background": "#FFF7ED"
              },
              {
                  "main": "#EAB308",
                  "secondary": "#A16207",
                  "accent": "#FFFFFF",
                  "background": "#FEFCE8"
              },
              {
                  "main": "#22C55E",
                  "secondary": "#15803D",
                  "accent": "#FFFFFF",
                  "background": "#F0FDF4"
              },
              {
                  "main": "#3B82F6",
                  "secondary": "#1D4ED8",
                  "accent": "#FFFFFF",
                  "background": "#EFF6FF"
              },
              {
                  "main": "#8B5CF6",
                  "secondary": "#6D28D9",
                  "accent": "#FFFFFF",
                  "background": "#F5F3FF"
              },
              {
                  "main": "#EC4899",
                  "secondary": "#BE185D",
                  "accent": "#FFFFFF",
                  "background": "#FDF2F8"
              },
              {
                  "main": "#0891B2",
                  "secondary": "#0E7490",
                  "accent": "#FFFFFF",
                  "background": "#F8FAFC"
              },
          ]

          SHAPES = [
              "circle",
              "burst",
              "ribbon",
              "rounded",
              "star",
              "hexagon",
              "ticket",
              "pill",
          ]

          ANIMATIONS = [
              "pop",
              "bounce",
              "rotate",
              "slide",
              "scale",
              "shake",
              "elastic",
              "fade",
          ]

          POSITIONS = [
              (960, 540),
              (960, 430),
              (960, 650),
              (760, 540),
              (1160, 540),
          ]


          def esc(value):
              return (
                  str(value)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;")
              )


          def clamp(value, minimum, maximum):
              return max(minimum, min(maximum, value))


          def ease_out(t):
              return 1 - (1 - t) ** 3


          def ease_in_out(t):
              return t * t * (3 - 2 * t)


          def animation_value(name, t):
              if name == "pop":
                  if t < 0.25:
                      return 0.65 + ease_out(t / 0.25) * 0.5
                  return 1.15 - ease_in_out((t - 0.25) / 0.75) * 0.15

              if name == "bounce":
                  return 1 + abs(math.sin(t * math.pi * 3)) * (1 - t) * 0.15

              if name == "rotate":
                  return 1

              if name == "slide":
                  return 1

              if name == "scale":
                  return 0.75 + ease_out(t) * 0.25

              if name == "shake":
                  return 1

              if name == "elastic":
                  return 1 + math.sin(t * math.pi * 4) * (1 - t) * 0.12

              if name == "fade":
                  return clamp(t * 4, 0, 1)

              return 1


          def shape_svg(shape, x, y, size, color, secondary):
              if shape == "circle":
                  return f"""
                  <circle
                      cx="{x}"
                      cy="{y}"
                      r="{size}"
                      fill="{color}"
                  />
                  """

              if shape == "rounded":
                  return f"""
                  <rect
                      x="{x-size}"
                      y="{y-size*0.72}"
                      width="{size*2}"
                      height="{size*1.44}"
                      rx="{size*0.28}"
                      fill="{color}"
                  />
                  """

              if shape == "pill":
                  return f"""
                  <rect
                      x="{x-size*1.35}"
                      y="{y-size*0.55}"
                      width="{size*2.7}"
                      height="{size*1.1}"
                      rx="{size*0.55}"
                      fill="{color}"
                  />
                  """

              if shape == "hexagon":
                  points = []

                  for i in range(6):
                      angle = math.radians(i * 60 - 30)
                      px = x + math.cos(angle) * size
                      py = y + math.sin(angle) * size
                      points.append(f"{px:.2f},{py:.2f}")

                  return f"""
                  <polygon
                      points="{' '.join(points)}"
                      fill="{color}"
                  />
                  """

              if shape == "star":
                  points = []

                  for i in range(10):
                      angle = math.radians(i * 36 - 90)
                      radius = size if i % 2 == 0 else size * 0.48
                      px = x + math.cos(angle) * radius
                      py = y + math.sin(angle) * radius
                      points.append(f"{px:.2f},{py:.2f}")

                  return f"""
                  <polygon
                      points="{' '.join(points)}"
                      fill="{color}"
                  />
                  """

              if shape == "burst":
                  points = []

                  for i in range(24):
                      angle = math.radians(i * 15)
                      radius = size if i % 2 == 0 else size * 0.72
                      px = x + math.cos(angle) * radius
                      py = y + math.sin(angle) * radius
                      points.append(f"{px:.2f},{py:.2f}")

                  return f"""
                  <polygon
                      points="{' '.join(points)}"
                      fill="{color}"
                  />
                  """

              if shape == "ticket":
                  return f"""
                  <path
                      d="
                      M {x-size} {y-size*0.65}
                      H {x+size}
                      V {y+size*0.65}
                      H {x-size}
                      Z
                      "
                      fill="{color}"
                  />
                  """

              if shape == "ribbon":
                  return f"""
                  <path
                      d="
                      M {x-size*1.2} {y-size*0.6}
                      H {x+size*1.2}
                      L {x+size*0.9} {y+size*0.6}
                      H {x-size*0.9}
                      Z
                      "
                      fill="{color}"
                  />
                  """

              return f"""
              <circle
                  cx="{x}"
                  cy="{y}"
                  r="{size}"
                  fill="{color}"
              />
              """


          def text_svg(text, x, y, size, color, weight=800):
              return f"""
              <text
                  x="{x}"
                  y="{y}"
                  text-anchor="middle"
                  dominant-baseline="middle"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="{size}px"
                  font-weight="{weight}"
                  fill="{color}"
              >{esc(text)}</text>
              """


          def background_svg(color):
              return f"""
              <rect
                  x="0"
                  y="0"
                  width="{WIDTH}"
                  height="{HEIGHT}"
                  fill="{color}"
              />
              """


          def sale_frame(index, total, rng, variant):
              t = index / max(1, total - 1)

              palette = PALETTES[variant % len(PALETTES)]

              shape = SHAPES[variant % len(SHAPES)]
              animation = ANIMATIONS[variant % len(ANIMATIONS)]

              x, y = POSITIONS[variant % len(POSITIONS)]

              scale = animation_value(animation, t)

              if animation == "rotate":
                  rotation = -12 + t * 24
              else:
                  rotation = 0

              if animation == "slide":
                  x = -350 + ease_out(t) * (x + 350)

              if animation == "shake":
                  x += math.sin(t * math.pi * 10) * 30

              size = 310 * scale

              shape = shape_svg(
                  shape,
                  x,
                  y,
                  size,
                  palette["main"],
                  palette["secondary"],
              )

              label = [
                  "SALE",
                  "SALE",
                  "50% OFF",
                  "SALE",
                  "SPECIAL",
                  "OFFER",
                  "SALE",
                  "DEAL",
              ][variant % 8]

              text = text_svg(
                  label,
                  x,
                  y,
                  125 if len(label) <= 6 else 90,
                  palette["accent"],
              )

              return f"""
              <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="{WIDTH}"
                  height="{HEIGHT}"
                  viewBox="0 0 {WIDTH} {HEIGHT}"
              >
                  {background_svg(palette["background"])}

                  <g transform="rotate({rotation} {x} {y})">
                      {shape}
                      {text}
                  </g>
              </svg>
              """


          def discount_frame(index, total, rng, variant):
              t = index / max(1, total - 1)

              palette = PALETTES[(variant + 2) % len(PALETTES)]

              x, y = POSITIONS[(variant + 1) % len(POSITIONS)]

              animation = ANIMATIONS[(variant + 2) % len(ANIMATIONS)]

              scale = animation_value(animation, t)

              discount_values = [
                  "10%",
                  "20%",
                  "30%",
                  "40%",
                  "50%",
                  "60%",
                  "70%",
                  "80%",
              ]

              value = discount_values[variant % len(discount_values)]

              shape = shape_svg(
                  SHAPES[(variant + 3) % len(SHAPES)],
                  x,
                  y,
                  300 * scale,
                  palette["main"],
                  palette["secondary"],
              )

              discount = text_svg(
                  value,
                  x,
                  y - 25,
                  145,
                  palette["accent"],
              )

              sub = text_svg(
                  "DISCOUNT",
                  x,
                  y + 120,
                  52,
                  palette["accent"],
                  700,
              )

              return f"""
              <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="{WIDTH}"
                  height="{HEIGHT}"
                  viewBox="0 0 {WIDTH} {HEIGHT}"
              >
                  {background_svg(palette["background"])}

                  {shape}

                  {discount}

                  {sub}
              </svg>
              """


          def cta_frame(index, total, rng, variant):
              t = index / max(1, total - 1)

              palette = PALETTES[(variant + 4) % len(PALETTES)]

              labels = [
                  "SHOP NOW",
                  "BUY NOW",
                  "LEARN MORE",
                  "GET STARTED",
                  "SIGN UP",
                  "SUBSCRIBE",
                  "DOWNLOAD",
                  "WATCH NOW",
              ]

              label = labels[variant % len(labels)]

              x, y = POSITIONS[(variant + 2) % len(POSITIONS)]

              animation = ANIMATIONS[(variant + 4) % len(ANIMATIONS)]

              scale = animation_value(animation, t)

              width = 650 * scale
              height = 190 * scale

              if animation == "slide":
                  x = -400 + ease_out(t) * (x + 400)

              if animation == "shake":
                  x += math.sin(t * math.pi * 12) * 20

              button = f"""
              <rect
                  x="{x-width/2}"
                  y="{y-height/2}"
                  width="{width}"
                  height="{height}"
                  rx="55"
                  fill="{palette["main"]}"
              />
              """

              text = text_svg(
                  label,
                  x,
                  y,
                  58 if len(label) <= 10 else 48,
                  palette["accent"],
                  800,
              )

              arrow_x = x + width * 0.34

              arrow = f"""
              <path
                  d="
                  M {arrow_x-30} {y}
                  L {arrow_x+30} {y}
                  M {arrow_x+5} {y-25}
                  L {arrow_x+30} {y}
                  L {arrow_x+5} {y+25}
                  "
                  fill="none"
                  stroke="{palette["accent"]}"
                  stroke-width="8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
              />
              """

              return f"""
              <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="{WIDTH}"
                  height="{HEIGHT}"
                  viewBox="0 0 {WIDTH} {HEIGHT}"
              >
                  {background_svg(palette["background"])}

                  {button}

                  {text}

                  {arrow}
              </svg>
              """


          def render_video(category, variant, seed):
              rng = random.Random(seed)

              name = f"{category}_{variant+1:02d}"

              work = FRAMES_DIR / name

              if work.exists():
                  shutil.rmtree(work)

              work.mkdir(parents=True)

              if category == "sale":
                  frame_function = sale_frame

              elif category == "discount":
                  frame_function = discount_frame

              else:
                  frame_function = cta_frame

              for frame in range(FRAMES):
                  svg = frame_function(
                      frame,
                      FRAMES,
                      rng,
                      variant,
                  )

                  svg_file = work / f"{frame:05d}.svg"
                  png_file = work / f"{frame:05d}.png"

                  svg_file.write_text(
                      svg,
                      encoding="utf-8",
                  )

                  subprocess.run(
                      [
                          "rsvg-convert",
                          "-o",
                          str(png_file),
                          str(svg_file),
                      ],
                      check=True,
                      stdout=subprocess.DEVNULL,
                  )

                  svg_file.unlink()

              output = ROOT / f"{name}.mp4"

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-loglevel",
                      "error",
                      "-framerate",
                      str(FPS),
                      "-i",
                      str(work / "%05d.png"),
                      "-c:v",
                      "libx264",
                      "-preset",
                      "medium",
                      "-crf",
                      "18",
                      "-pix_fmt",
                      "yuv420p",
                      "-movflags",
                      "+faststart",
                      str(output),
                  ],
                  check=True,
              )

              shutil.rmtree(work)

              return output


          def main():
              categories = [
                  ("sale", "Sale Badge"),
                  ("discount", "Discount Element"),
                  ("cta", "Call To Action"),
              ]

              manifest = []

              for category, description in categories:
                  for variant in range(COUNT):
                      seed = (
                          variant * 1000
                          + len(category) * 77
                      )

                      print(
                          f"Generating {category} "
                          f"{variant + 1}/{COUNT}"
                      )

                      output = render_video(
                          category,
                          variant,
                          seed,
                      )

                      manifest.append(
                          {
                              "filename": output.name,
                              "category": category,
                              "description": description,
                              "variant": variant + 1,
                              "width": WIDTH,
                              "height": HEIGHT,
                              "fps": FPS,
                              "duration": DURATION,
                          }
                      )

              manifest_file = ROOT / "manifest.csv"

              with manifest_file.open(
                  "w",
                  newline="",
                  encoding="utf-8",
              ) as f:

                  writer = csv.DictWriter(
                      f,
                      fieldnames=manifest[0].keys(),
                  )

                  writer.writeheader()
                  writer.writerows(manifest)

              print()
              print("Generation completed.")
              print(f"Videos: {len(manifest)}")
              print(f"Output: {ROOT}")


          if __name__ == "__main__":
              main()
          PYTHON

      - name: Generate videos
        env:
          COUNT: ${{ github.event.inputs.count || '8' }}
          DURATION: ${{ github.event.inputs.duration || '5' }}
          FPS: ${{ github.event.inputs.fps || '30' }}
        run: |
          python generator.py

      - name: Create ZIP
        run: |
          cd stock_output
          zip -r ../stock-videos.zip *.mp4 manifest.csv

      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: stock-videos
          path: stock-videos.zip
          retention-days: 7
