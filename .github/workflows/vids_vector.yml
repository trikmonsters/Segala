name: Adobe Stock Vector Video Factory

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Video duration in seconds"
        required: true
        default: "5"
      fps:
        description: "Frames per second"
        required: true
        default: "30"
      variants:
        description: "Variants per category"
        required: true
        default: "8"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. INSTALL TOOLS
      # =========================================================

      - name: Install rendering tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            python3 \
            python3-pip \
            ffmpeg \
            librsvg2-bin

          python3 --version
          ffmpeg -version
          rsvg-convert --version


      # =========================================================
      # 3. CREATE EVERYTHING FROM ONE PYTHON SCRIPT
      # =========================================================

      - name: Generate stock videos
        env:
          DURATION: ${{ inputs.duration }}
          FPS: ${{ inputs.fps }}
          VARIANTS: ${{ inputs.variants }}

        run: |

          cat > generator.py <<'PYTHON'

          import os
          import math
          import random
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path
          from xml.sax.saxutils import escape


          # =====================================================
          # CONFIG
          # =====================================================

          WIDTH = 1920
          HEIGHT = 1080

          FPS = int(os.environ.get("FPS", "30"))
          DURATION = int(os.environ.get("DURATION", "5"))
          VARIANTS = int(os.environ.get("VARIANTS", "8"))

          ROOT = Path("stock_output")

          SVG_DIR = ROOT / "svg"
          PNG_DIR = ROOT / "png"
          VIDEO_DIR = ROOT / "videos"

          SVG_DIR.mkdir(parents=True, exist_ok=True)
          PNG_DIR.mkdir(parents=True, exist_ok=True)
          VIDEO_DIR.mkdir(parents=True, exist_ok=True)


          # =====================================================
          # COLOR PALETTES
          # =====================================================

          PALETTES = [
              {
                  "main": "#E63946",
                  "secondary": "#C1121F",
                  "accent": "#FFFFFF",
                  "background": "#111111"
              },

              {
                  "main": "#2563EB",
                  "secondary": "#1D4ED8",
                  "accent": "#FFFFFF",
                  "background": "#F8FAFC"
              },

              {
                  "main": "#16A34A",
                  "secondary": "#15803D",
                  "accent": "#FFFFFF",
                  "background": "#111111"
              },

              {
                  "main": "#F59E0B",
                  "secondary": "#D97706",
                  "accent": "#111111",
                  "background": "#FFFFFF"
              },

              {
                  "main": "#7C3AED",
                  "secondary": "#6D28D9",
                  "accent": "#FFFFFF",
                  "background": "#111111"
              },

              {
                  "main": "#EC4899",
                  "secondary": "#DB2777",
                  "accent": "#FFFFFF",
                  "background": "#111111"
              },

              {
                  "main": "#0891B2",
                  "secondary": "#0E7490",
                  "accent": "#FFFFFF",
                  "background": "#F8FAFC"
              ],

              {
                  "main": "#111827",
                  "secondary": "#374151",
                  "accent": "#FFFFFF",
                  "background": "#F3F4F6"
              }
          ]


          # =====================================================
          # VARIATION SYSTEM
          # =====================================================

          SHAPES = [
              "circle",
              "burst",
              "ribbon",
              "rounded",
              "star",
              "hexagon",
              "ticket",
              "pill"
          ]

          ANIMATIONS = [
              "pop",
              "bounce",
              "rotate",
              "slide",
              "scale",
              "shake",
              "elastic",
              "fade"
          ]

          POSITIONS = [
              "center",
              "left",
              "right",
              "top",
              "bottom",
              "top_left",
              "top_right",
              "bottom_right"
          ]


          # =====================================================
          # UTILITIES
          # =====================================================

          def clamp(x, a=0.0, b=1.0):
              return max(a, min(b, x))


          def ease_out_back(x):

              x = clamp(x)

              c1 = 1.70158
              c3 = c1 + 1

              return (
                  1
                  + c3 * (x - 1) ** 3
                  + c1 * (x - 1) ** 2
              )


          def ease_in_out(x):

              x = clamp(x)

              return x * x * (3 - 2 * x)


          def ease_out_cubic(x):

              x = clamp(x)

              return 1 - (1 - x) ** 3


          def position_xy(position):

              margin = 300

              if position == "center":
                  return WIDTH / 2, HEIGHT / 2

              if position == "left":
                  return WIDTH * 0.28, HEIGHT / 2

              if position == "right":
                  return WIDTH * 0.72, HEIGHT / 2

              if position == "top":
                  return WIDTH / 2, HEIGHT * 0.28

              if position == "bottom":
                  return WIDTH / 2, HEIGHT * 0.72

              if position == "top_left":
                  return margin, margin

              if position == "top_right":
                  return WIDTH - margin, margin

              if position == "bottom_right":
                  return WIDTH - margin, HEIGHT - margin

              return WIDTH / 2, HEIGHT / 2


          def background_svg(color):

              return f"""
              <rect
                  x="0"
                  y="0"
                  width="{WIDTH}"
                  height="{HEIGHT}"
                  fill="{color}"
              />
              """


          def save_svg(path, body):

              svg = f"""
              <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="{WIDTH}"
                  height="{HEIGHT}"
                  viewBox="0 0 {WIDTH} {HEIGHT}">

                  {body}

              </svg>
              """

              path.write_text(svg, encoding="utf-8")


          # =====================================================
          # SALE BADGE SHAPES
          # =====================================================

          def badge_shape(shape, r, main, secondary):

              if shape == "circle":

                  return f"""
                  <circle
                      cx="0"
                      cy="0"
                      r="{r}"
                      fill="{main}"
                  />

                  <circle
                      cx="0"
                      cy="0"
                      r="{r - 20}"
                      fill="none"
                      stroke="{secondary}"
                      stroke-width="14"
                  />
                  """


              if shape == "rounded":

                  return f"""
                  <rect
                      x="-300"
                      y="-220"
                      width="600"
                      height="440"
                      rx="80"
                      fill="{main}"
                  />
                  """


              if shape == "pill":

                  return f"""
                  <rect
                      x="-360"
                      y="-150"
                      width="720"
                      height="300"
                      rx="150"
                      fill="{main}"
                  />
                  """


              if shape == "hexagon":

                  points = []

                  for i in range(6):

                      a = math.radians(i * 60 - 30)

                      points.append(
                          f"{math.cos(a) * r},{math.sin(a) * r}"
                      )

                  return f"""
                  <polygon
                      points="{' '.join(points)}"
                      fill="{main}"
                  />
                  """


              if shape == "star":

                  points = []

                  for i in range(16):

                      radius = r if i % 2 == 0 else r * 0.65

                      a = math.radians(i * 22.5 - 90)

                      points.append(
                          f"{math.cos(a) * radius},"
                          f"{math.sin(a) * radius}"
                      )

                  return f"""
                  <polygon
                      points="{' '.join(points)}"
                      fill="{main}"
                  />
                  """


              if shape == "burst":

                  points = []

                  for i in range(32):

                      radius = r if i % 2 == 0 else r * 0.82

                      a = math.radians(i * 11.25)

                      points.append(
                          f"{math.cos(a) * radius},"
                          f"{math.sin(a) * radius}"
                      )

                  return f"""
                  <polygon
                      points="{' '.join(points)}"
                      fill="{main}"
                  />
                  """


              if shape == "ribbon":

                  return f"""
                  <path
                      d="
                      M -380 -180
                      L 380 -180
                      L 300 0
                      L 380 180
                      L -380 180
                      L -300 0
                      Z"
                      fill="{main}"
                  />
                  """


              if shape == "ticket":

                  return f"""
                  <path
                      d="
                      M -360 -180
                      H 360
                      V -80
                      A 80 80 0 0 0 360 80
                      V 180
                      H -360
                      V 80
                      A 80 80 0 0 0 -360 -80
                      Z"
                      fill="{main}"
                  />
                  """

              return ""


          # =====================================================
          # SALE BADGE ANIMATION
          # =====================================================

          def sale_badge_frame(t, variant):

              palette = PALETTES[variant % len(PALETTES)]

              shape = SHAPES[variant % len(SHAPES)]

              animation = ANIMATIONS[
                  (variant * 2) % len(ANIMATIONS)
              ]

              position = POSITIONS[
                  variant % len(POSITIONS)
              ]

              cx, cy = position_xy(position)

              r = 270

              # -----------------------------------------------
              # Animation
              # -----------------------------------------------

              p = clamp(t / 1.0)

              if animation == "pop":

                  scale = ease_out_back(p)

              elif animation == "bounce":

                  scale = (
                      1
                      - math.exp(-5 * p)
                      * math.cos(10 * p)
                  )

              elif animation == "rotate":

                  scale = ease_out_back(p)

              elif animation == "slide":

                  scale = ease_out_cubic(p)

              elif animation == "scale":

                  scale = ease_in_out(p)

              elif animation == "shake":

                  scale = ease_out_back(p)

              elif animation == "elastic":

                  scale = (
                      1
                      + 0.15
                      * math.sin(p * math.pi * 4)
                      * (1 - p)
                  )

              else:

                  scale = ease_in_out(p)


              # Keep animation sensible
              scale = max(0.05, min(scale, 1.15))


              rotation = 0

              if animation == "rotate":

                  rotation = 360 * ease_out_cubic(p)

              elif animation == "shake":

                  rotation = (
                      8
                      * math.sin(t * 45)
                      * max(0, 1 - t)
                  )

              else:

                  rotation = (
                      2
                      * math.sin(t * math.pi * 2)
                  )


              # -----------------------------------------------
              # Content
              # -----------------------------------------------

              if variant % 4 == 0:
                  title = "SALE"
                  discount = "50% OFF"

              elif variant % 4 == 1:
                  title = "BIG SALE"
                  discount = "30% OFF"

              elif variant % 4 == 2:
                  title = "SPECIAL"
                  discount = "40% OFF"

              else:
                  title = "OFFER"
                  discount = "20% OFF"


              title = escape(title)
              discount = escape(discount)


              shape_svg = badge_shape(
                  shape,
                  r,
                  palette["main"],
                  palette["secondary"]
              )


              return f"""

              {background_svg(palette["background"])}

              <g
                  transform="
                  translate({cx} {cy})
                  rotate({rotation})
                  scale({scale})">

                  {shape_svg}

                  <text
                      x="0"
                      y="-35"
                      text-anchor="middle"
                      font-family="DejaVu Sans"
                      font-size="68"
                      font-weight="700"
                      fill="{palette['accent']}">
                      {title}
                  </text>

                  <text
                      x="0"
                      y="85"
                      text-anchor="middle"
                      font-family="DejaVu Sans"
                      font-size="88"
                      font-weight="800"
                      fill="{palette['accent']}">
                      {discount}
                  </text>

              </g>

              """


          # =====================================================
          # DISCOUNT ELEMENT
          # =====================================================

          def discount_frame(t, variant):

              palette = PALETTES[
                  (variant + 2) % len(PALETTES)
              ]

              cx, cy = position_xy(
                  POSITIONS[(variant + 2) % len(POSITIONS)]
              )

              p = clamp(t / 1.0)

              slide = ease_out_back(p)

              x_offset = -1200 + 1200 * slide

              if variant % 3 == 0:

                  element = f"""
                  <rect
                      x="-480"
                      y="-180"
                      width="960"
                      height="360"
                      rx="55"
                      fill="{palette['main']}"
                  />

                  <line
                      x1="0"
                      y1="-150"
                      x2="0"
                      y2="150"
                      stroke="{palette['accent']}"
                      stroke-width="6"
                      stroke-dasharray="14 14"
                  />

                  <text
                      x="-240"
                      y="-15"
                      text-anchor="middle"
                      font-family="DejaVu Sans"
                      font-size="48"
                      font-weight="600"
                      fill="{palette['accent']}">
                      LIMITED
                  </text>

                  <text
                      x="-240"
                      y="55"
                      text-anchor="middle"
                      font-family="DejaVu Sans"
                      font-size="48"
                      font-weight="600"
                      fill="{palette['accent']}">
                      DISCOUNT
                  </text>

                  <text
                      x="230"
                      y="40"
                      text-anchor="middle"
                      font-family="DejaVu Sans"
                      font-size="105"
                      font-weight="800"
                      fill="{palette['accent']}">
                      30%
                  </text>
                  """

              elif variant % 3 == 1:

                  element = f"""
                  <polygon
                      points="
                      -520,0
                      -350,-170
                      350,-170
                      520,0
                      350,170
                      -350,170"
                      fill="{palette['main']}"
                  />

                  <text
                      x="0"
                      y="-25"
                      text-anchor="middle"
                      font-family="DejaVu Sans"
                      font-size="52"
                      font-weight="700"
                      fill="{palette['accent']}">
                      DISCOUNT
                  </text>

                  <text
                      x="0"
                      y="90"
                      text-anchor="middle"
                      font-family="DejaVu Sans"
                      font-size="110"
                      font-weight="800"
                      fill="{palette['accent']}">
                      40% OFF
                  </text>
                  """

              else:

                  element = f"""
                  <g>

                      <circle
                          cx="-260"
                          cy="0"
                          r="170"
                          fill="{palette['main']}"
                      />

                      <text
                          x="-260"
                          y="38"
                          text-anchor="middle"
                          font-family="DejaVu Sans"
                          font-size="88"
                          font-weight="800"
                          fill="{palette['accent']}">
                          50%
                      </text>

                      <text
                          x="180"
                          y="-20"
                          font-family="DejaVu Sans"
                          font-size="58"
                          font-weight="700"
                          fill="{palette['main']}">
                          PRICE
                      </text>

                      <text
                          x="180"
                          y="55"
                          font-family="DejaVu Sans"
                          font-size="58"
                          font-weight="700"
                          fill="{palette['main']}">
                          DROP
                      </text>

                  </g>
                  """


              return f"""

              {background_svg(palette["background"])}

              <g
                  transform="
                  translate({cx + x_offset} {cy})
                  rotate({4 * math.sin(t * 2)})
                  ">

                  {element}

              </g>

              """


          # =====================================================
          # CTA GRAPHICS
          # =====================================================

          def cta_frame(t, variant):

              palette = PALETTES[
                  (variant + 4) % len(PALETTES)
              ]

              position = POSITIONS[
                  (variant + 3) % len(POSITIONS)
              ]

              cx, cy = position_xy(position)

              p = clamp(t / 0.9)

              scale = ease_out_back(p)

              # Different CTA messages
              messages = [
                  "SHOP NOW",
                  "BUY NOW",
                  "LEARN MORE",
                  "GET STARTED",
                  "SIGN UP",
                  "SUBSCRIBE",
                  "DOWNLOAD",
                  "WATCH NOW"
              ]

              message = escape(
                  messages[variant % len(messages)]
              )


              # -----------------------------------------------
              # Button shapes
              # -----------------------------------------------

              if variant % 4 == 0:

                  button = f"""
                  <rect
                      x="-340"
                      y="-105"
                      width="680"
                      height="210"
                      rx="105"
                      fill="{palette['main']}"
                  />
                  """

              elif variant % 4 == 1:

                  button = f"""
                  <rect
                      x="-360"
                      y="-110"
                      width="720"
                      height="220"
                      rx="35"
                      fill="{palette['main']}"
                  />
                  """

              elif variant % 4 == 2:

                  button = f"""
                  <path
                      d="
                      M -390 -110
                      H 230
                      L 390 0
                      L 230 110
                      H -390
                      Z"
                      fill="{palette['main']}"
                  />
                  """

              else:

                  button = f"""
                  <circle
                      cx="0"
                      cy="0"
                      r="190"
                      fill="{palette['main']}"
                  />
                  """


              # -----------------------------------------------
              # Pulse
              # -----------------------------------------------

              pulse = (
                  1
                  + 0.025
                  * math.sin(t * math.pi * 2)
              )


              # -----------------------------------------------
              # Cursor
              # -----------------------------------------------

              cursor_progress = clamp(
                  (t - 1.5) / 0.8
              )

              cursor_x = (
                  cx
                  + 500
                  - 500 * ease_in_out(cursor_progress)
              )

              cursor_y = (
                  cy
                  + 300
                  - 300 * ease_in_out(cursor_progress)
              )


              # -----------------------------------------------
              # Click effect
              # -----------------------------------------------

              click = clamp(
                  (t - 2.35) / 0.45
              )

              click_radius = 100 + 350 * click

              click_opacity = 1 - click


              # Circle CTA has different text positioning
              if variant % 4 == 3:

                  text_svg = f"""
                  <text
                      x="0"
                      y="-10"
                      text-anchor="middle"
                      font-family="DejaVu Sans"
                      font-size="42"
                      font-weight="800"
                      fill="{palette['accent']}">
                      {message}
                  </text>

                  <text
                      x="0"
                      y="60"
                      text-anchor="middle"
                      font-family="DejaVu Sans"
                      font-size="55"
                      font-weight="800"
                      fill="{palette['accent']}">
                      →
                  </text>
                  """

              else:

                  text_svg = f"""
                  <text
                      x="0"
                      y="24"
                      text-anchor="middle"
                      font-family="DejaVu Sans"
                      font-size="58"
                      font-weight="800"
                      fill="{palette['accent']}">
                      {message}
                  </text>
                  """


              return f"""

              {background_svg(palette["background"])}

              <g
                  transform="
                  translate({cx} {cy})
                  scale({scale * pulse})">

                  {button}

                  {text_svg}

              </g>


              <!-- Click ripple -->

              <circle
                  cx="{cx}"
                  cy="{cy}"
                  r="{click_radius}"
                  fill="none"
                  stroke="{palette['main']}"
                  stroke-width="12"
                  opacity="{click_opacity}"
              />


              <!-- Cursor -->

              <g
                  transform="
                  translate({cursor_x} {cursor_y})
                  scale(1.25)">

                  <path
                      d="
                      M 0 0
                      L 0 130
                      L 34 96
                      L 75 160
                      L 108 140
                      L 67 76
                      L 115 74
                      Z"
                      fill="white"
                      stroke="black"
                      stroke-width="7"
                  />

              </g>

              """


          # =====================================================
          # RENDER ONE VIDEO
          # =====================================================

          def render_video(
              category,
              variant,
              frame_function
          ):

              name = (
                  f"{category}_"
                  f"{variant + 1:02d}"
              )

              svg_folder = SVG_DIR / name
              png_folder = PNG_DIR / name

              svg_folder.mkdir(
                  parents=True,
                  exist_ok=True
              )

              png_folder.mkdir(
                  parents=True,
                  exist_ok=True
              )


              total_frames = FPS * DURATION

              print(
                  f"Generating {name} "
                  f"({total_frames} frames)"
              )


              # -----------------------------------------------
              # Generate frames
              # -----------------------------------------------

              for frame in range(total_frames):

                  t = frame / FPS

                  body = frame_function(
                      t,
                      variant
                  )

                  svg_path = (
                      svg_folder
                      / f"frame_{frame:05d}.svg"
                  )

                  png_path = (
                      png_folder
                      / f"frame_{frame:05d}.png"
                  )

                  save_svg(
                      svg_path,
                      body
                  )


                  subprocess.run(
                      [
                          "rsvg-convert",
                          "-w",
                          str(WIDTH),
                          "-h",
                          str(HEIGHT),
                          str(svg_path),
                          "-o",
                          str(png_path)
                      ],
                      check=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )


              # -----------------------------------------------
              # Render MP4
              # -----------------------------------------------

              output = (
                  VIDEO_DIR
                  / f"{name}.mp4"
              )


              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-framerate",
                      str(FPS),
                      "-i",
                      str(
                          png_folder
                          / "frame_%05d.png"
                      ),
                      "-c:v",
                      "libx264",
                      "-preset",
                      "medium",
                      "-crf",
                      "18",
                      "-pix_fmt",
                      "yuv420p",
                      "-movflags",
                      "+faststart",
                      str(output)
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL
              )


              print(
                  f"READY: {output}"
              )


          # =====================================================
          # GENERATE ALL ASSETS
          # =====================================================

          categories = [

              (
                  "sale_badge",
                  sale_badge_frame
              ),

              (
                  "discount_element",
                  discount_frame
              ),

              (
                  "cta_graphic",
                  cta_frame
              )

          ]


          for category, function in categories:

              for variant in range(VARIANTS):

                  render_video(
                      category,
                      variant,
                      function
                  )


          # =====================================================
          # CREATE SIMPLE MANIFEST
          # =====================================================

          manifest = ROOT / "manifest.csv"

          lines = [
              "filename,category,variant,duration,fps,width,height"
          ]


          for category, _ in categories:

              for variant in range(VARIANTS):

                  filename = (
                      f"{category}_"
                      f"{variant + 1:02d}.mp4"
                  )

                  lines.append(
                      f"{filename},"
                      f"{category},"
                      f"{variant + 1},"
                      f"{DURATION},"
                      f"{FPS},"
                      f"{WIDTH},"
                      f"{HEIGHT}"
                  )


          manifest.write_text(
              "\n".join(lines),
              encoding="utf-8"
          )


          print("")
          print("====================================")
          print("STOCK FACTORY COMPLETE")
          print("====================================")

          print(
              f"Total videos: "
              f"{len(categories) * VARIANTS}"
          )

          print(
              f"Resolution: "
              f"{WIDTH}x{HEIGHT}"
          )

          print(
              f"FPS: {FPS}"
          )

          print(
              f"Duration: {DURATION}s"
          )

          PYTHON


          # =====================================================
          # RUN FACTORY
          # =====================================================

          python3 generator.py


      # =========================================================
      # 4. ZIP RESULTS
      # =========================================================

      - name: Package videos
        run: |

          cd stock_output

          zip -r ../adobe-stock-videos.zip videos manifest.csv

          cd ..


      # =========================================================
      # 5. UPLOAD ARTIFACT
      # =========================================================

      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        with:
          name: adobe-stock-videos
          path: adobe-stock-videos.zip
          retention-days: 7
