name: Whop Screenshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install --with-deps chromium

      - name: Create Netscape cookie file
        env:
          WHOP_COOKIES: ${{ secrets.WHOP_COOKIES }}
        run: |
          printf '%s' "$WHOP_COOKIES" > cookies.txt
          chmod 600 cookies.txt

      - name: Open Whop and take screenshot
        run: |
          cat > run.js <<'EOF'
          const fs = require("fs");
          const { chromium } = require("playwright-extra");
          const StealthPlugin = require("puppeteer-extra-plugin-stealth");

          chromium.use(StealthPlugin());

          function parseCookies(text) {
            const cookies = [];

            for (const line of text.split(/\r?\n/)) {
              const l = line.trim();

              if (!l || l.startsWith("#")) continue;

              const p = l.split("\t");

              if (p.length < 7) continue;

              const [
                domain,
                flag,
                path,
                secure,
                expiration,
                name,
                value
              ] = p;

              const cookie = {
                name,
                value,
                domain,
                path: path || "/",
                secure: secure.toUpperCase() === "TRUE"
              };

              const exp = Number(expiration);

              if (Number.isFinite(exp) && exp > 0) {
                cookie.expires = exp;
              }

              cookies.push(cookie);
            }

            return cookies;
          }

          (async () => {
            const cookieText = fs.readFileSync(
              "cookies.txt",
              "utf8"
            );

            const cookies = parseCookies(cookieText);

            if (!cookies.length) {
              throw new Error("No valid Netscape cookies found.");
            }

            console.log(`Loaded ${cookies.length} cookies`);

            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              viewport: {
                width: 1440,
                height: 1000
              },
              deviceScaleFactor: 1
            });

            await context.addCookies(cookies);

            const page = await context.newPage();

            const target =
              "https://whop.com/tikcut/exp_1r3Q9rIouuXK1L/app/";

            console.log("Opening target...");

            await page.goto(target, {
              waitUntil: "domcontentloaded",
              timeout: 120000
            });

            await page.waitForTimeout(7000);

            console.log("Final URL:", page.url());
            console.log("Title:", await page.title());

            await page.screenshot({
              path: "whop-screenshot.png",
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node run.js

      - name: Delete sensitive files
        if: always()
        run: |
          rm -f cookies.txt
          rm -f run.js

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="whop-screenshot-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            whop-screenshot.png \
            --title "Whop Screenshot #${GITHUB_RUN_NUMBER}" \
            --notes "Screenshot generated by GitHub Actions."

      - name: Delete local screenshot
        if: always()
        run: |
          rm -f whop-screenshot.png
