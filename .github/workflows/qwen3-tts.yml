name: Qwen3 TTS Voice Clone (CPU/GGML)

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Text to synthesize'
        required: true
        default: 'Hello, this is a test of my cloned voice on GitHub Actions.'
      ref_text:
        description: 'Transcript of MyVoice.wav (REQUIRED for ICL clone)'
        required: true
        default: 'This is the exact transcript of what is said in MyVoice.wav.'
      output_name:
        description: 'Output filename'
        required: false
        default: 'output.wav'

jobs:
  tts-cpu:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Verify MyVoice.wav exists
        run: |
          if [ ! -f "./MyVoice.wav" ]; then
            echo "❌ ERROR: MyVoice.wav not found in root!"
            exit 1
          fi
          echo "✅ MyVoice.wav found"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip & HF models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-qwen3-ggml-v2

      - name: Install faster-qwen3-tts with GGML backend (CPU)
        run: |
          # Install CPU-only PyTorch first (smaller footprint)
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          
          # Install package + GGML extra dari PyPI (bukan git clone!)
          pip install "faster-qwen3-tts[ggml]"
          
          # Verifikasi instalasi
          faster-qwen3-tts --help || true

      - name: Run TTS Voice Clone via GGML Backend
        run: |
          faster-qwen3-tts --backend ggml --quant BF16 clone \
            --model Qwen/Qwen3-TTS-12Hz-0.6B-Base \
            --ref-audio ./MyVoice.wav \
            --ref-text "${{ github.event.inputs.ref_text }}" \
            --text "${{ github.event.inputs.text }}" \
            --language English \
            --output "${{ github.event.inputs.output_name }}"

      - name: Upload Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-output
          path: ${{ github.event.inputs.output_name }}
          retention-days: 7
