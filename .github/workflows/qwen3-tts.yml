name: Qwen3 TTS Voice Clone (CPU/GGML)

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Text to synthesize'
        required: true
        default: 'Hello, this is a test of my cloned voice on GitHub Actions.'
      ref_text:
        description: 'Exact transcript of MyVoice.wav'
        required: true
        default: 'This is the exact transcript of what is said in MyVoice.wav.'
      output_name:
        description: 'Output filename'
        required: false
        default: 'output.wav'

jobs:
  tts-cpu:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Verify MyVoice.wav exists
        run: |
          if [ ! -f "./MyVoice.wav" ]; then
            echo "❌ ERROR: MyVoice.wav not found in root!"
            exit 1
          fi
          echo "✅ MyVoice.wav found"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ✅ FIX: Find libcudart.so.12 reliably from pip package
      - name: Install CUDA Runtime Library via pip
        run: |
          pip install nvidia-cuda-runtime-cu12
          
          # Search for libcudart.so.12 in site-packages
          LIBCUDART=$(find /opt/hostedtoolcache/Python -name "libcudart.so.12*" 2>/dev/null | head -1)
          
          if [ -z "$LIBCUDART" ]; then
            # Fallback: search broader
            LIBCUDART=$(python -c "import site; import os; [print(os.path.join(p, 'nvidia', 'cuda_runtime', 'lib', 'libcudart.so.12')) for p in site.getsitepackages()]" | while read f; do [ -f "$f" ] && echo "$f" && break; done)
          fi
          
          if [ -z "$LIBCUDART" ] || [ ! -f "$LIBCUDART" ]; then
            echo "❌ Could not find libcudart.so.12"
            find / -name "libcudart*" 2>/dev/null | head -20
            exit 1
          fi
          
          echo "✅ Found: $LIBCUDART"
          sudo ln -sf "$LIBCUDART" /usr/lib/x86_64-linux-gnu/libcudart.so.12
          sudo ldconfig
          ldconfig -p | grep libcudart

      - name: Cache pip & HF models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-qwen3-ggml-v5

      - name: Install faster-qwen3-tts with GGML backend
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install "faster-qwen3-tts[ggml]"
          faster-qwen3-tts --help

      - name: Run TTS Voice Clone via GGML (CPU fallback)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          faster-qwen3-tts --backend ggml --quant BF16 clone \
            --model Qwen/Qwen3-TTS-12Hz-0.6B-Base \
            --ref-audio ./MyVoice.wav \
            --ref-text "${{ github.event.inputs.ref_text }}" \
            --text "${{ github.event.inputs.text }}" \
            --language English \
            --output "${{ github.event.inputs.output_name }}"

      - name: Upload Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-output
          path: ${{ github.event.inputs.output_name }}
          retention-days: 7
