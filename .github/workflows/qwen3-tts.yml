name: Qwen3 TTS Voice Clone (CPU)

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Text to synthesize'
        required: true
        default: 'Hello, this is a test of my cloned voice on GitHub Actions.'
      ref_text:
        description: 'Exact transcript of MyVoice.wav'
        required: true
        default: 'This is the exact transcript of what is said in MyVoice.wav.'
      output_name:
        description: 'Output filename'
        required: false
        default: 'output.wav'

jobs:
  tts-cpu:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Verify MyVoice.wav exists
        run: |
          if [ ! -f "./MyVoice.wav" ]; then
            echo "❌ ERROR: MyVoice.wav not found in root!"
            exit 1
          fi
          echo "✅ MyVoice.wav found ($(du -h ./MyVoice.wav | cut -f1))"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip & HF models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-qwen3-torch-cpu-v1

      - name: Install faster-qwen3-tts (Torch CPU only)
        run: |
          # CPU-only PyTorch (much smaller, no CUDA deps)
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          # Install package TANPA ggml extra
          pip install faster-qwen3-tts
          pip install soundfile
          echo "✅ Installation complete"

      - name: Run TTS Voice Clone (Torch CPU)
        env:
          CUDA_VISIBLE_DEVICES: ""
          TRANSFORMERS_VERBOSITY: info
        run: |
          python << 'PYEOF'
          import os, sys, time
          os.environ["CUDA_VISIBLE_DEVICES"] = ""
          
          from faster_qwen3_tts import FasterQwen3TTS
          import soundfile as sf
          
          text = """${{ github.event.inputs.text }}"""
          ref_text = """${{ github.event.inputs.ref_text }}"""
          output = "${{ github.event.inputs.output_name }}"
          
          print("⏳ Loading Qwen3-TTS-0.6B on CPU...")
          start = time.time()
          model = FasterQwen3TTS.from_pretrained(
              "Qwen/Qwen3-TTS-12Hz-0.6B-Base",
              device="cpu"
          )
          print(f"✅ Model loaded in {time.time()-start:.1f}s")
          
          print("🎙️ Generating voice clone...")
          start = time.time()
          audio, sr = model.generate_voice_clone(
              text=text,
              language="English",
              ref_audio="./MyVoice.wav",
              ref_text=ref_text,
          )
          elapsed = time.time() - start
          print(f"✅ Generated in {elapsed:.1f}s")
          
          sf.write(output, audio[0], sr)
          print(f"💾 Saved to {output} ({sr}Hz)")
          PYEOF

      - name: Upload Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-output
          path: ${{ github.event.inputs.output_name }}
          retention-days: 7
