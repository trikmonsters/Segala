name: Qwen3 TTS Voice Clone (CPU)

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Text to synthesize'
        required: true
        default: 'Hello, this is a test of my cloned voice on GitHub Actions.'
      ref_text:
        description: 'Exact transcript of MyVoice.wav'
        required: true
        default: 'This is the exact transcript of what is said in MyVoice.wav.'
      output_name:
        description: 'Output filename'
        required: false
        default: 'output.wav'

jobs:
  tts-cpu:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Verify MyVoice.wav exists
        run: |
          if [ ! -f "./MyVoice.wav" ]; then
            echo "❌ ERROR: MyVoice.wav not found in root!"
            exit 1
          fi
          echo "✅ MyVoice.wav found ($(du -h ./MyVoice.wav | cut -f1))"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip & HF models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-qwen3-base-cpu-v1

      - name: Install Qwen3-TTS base + deps (CPU only)
        run: |
          pip install torch torchaudio transformers --index-url https://download.pytorch.org/whl/cpu
          pip install soundfile librosa accelerate
          # Install faster-qwen3-tts HANYA untuk ambil dependency utils-nya
          pip install faster-qwen3-tts --no-deps
          echo "✅ Installation complete"

      - name: Run TTS Voice Clone (Base Model on CPU)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          python << 'PYEOF'
          import os, sys, time
          os.environ["CUDA_VISIBLE_DEVICES"] = ""
          
          import torch
          import soundfile as sf
          from transformers import AutoModel, AutoTokenizer
          
          text = """${{ github.event.inputs.text }}"""
          ref_text = """${{ github.event.inputs.ref_text }}"""
          output = "${{ github.event.inputs.output_name }}"
          model_id = "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
          
          print(f"⏳ Loading {model_id} on CPU...")
          start = time.time()
          
          # Load base model directly (bypass FasterQwen3TTS wrapper)
          tokenizer = AutoTokenizer.from_pretrained(model_id, trust_remote_code=True)
          model = AutoModel.from_pretrained(
              model_id, 
              trust_remote_code=True,
              torch_dtype=torch.float32,
              device_map="cpu"
          )
          model.eval()
          print(f"✅ Model loaded in {time.time()-start:.1f}s")
          
          print("🎙️ Generating voice clone...")
          start = time.time()
          
          # Use model's native generate API for voice cloning
          inputs = tokenizer(
              text=text,
              ref_text=ref_text,
              return_tensors="pt"
          ).to("cpu")
          
          # Load reference audio
          import librosa
          ref_audio, sr = librosa.load("./MyVoice.wav", sr=24000)
          ref_audio_tensor = torch.tensor(ref_audio).unsqueeze(0)
          
          with torch.no_grad():
              audio_output = model.generate(
                  **inputs,
                  ref_audio=ref_audio_tensor,
                  max_new_tokens=1024,
                  do_sample=True,
                  temperature=0.8,
              )
          
          elapsed = time.time() - start
          print(f"✅ Generated in {elapsed:.1f}s")
          
          # Save output
          audio_np = audio_output.cpu().numpy().squeeze()
          sf.write(output, audio_np, sr)
          print(f"💾 Saved to {output} ({sr}Hz, {len(audio_np)/sr:.1f}s)")
          PYEOF

      - name: Upload Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-output
          path: ${{ github.event.inputs.output_name }}
          retention-days: 7
