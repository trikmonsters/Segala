          export const Caption: React.FC<{text: string; sub?: string; color?: string}> = ({text, sub, color='#FFD93D'}) => (
            <div style={{position:'absolute', left:0, right:0, top: 110, textAlign:'center', zIndex: 50, padding: '0 40px'}}>
