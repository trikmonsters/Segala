name: reel-3d-toilet-kecoa
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system deps
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser || sudo apt-get install -y ffmpeg chromium
      - name: Write project - 3D Toilet Kecoa Lamaran
        run: |
          set -e
          rm -rf src scripts public out chunks
          mkdir -p src/lib scripts public out chunks
          python3 - <<'PY'
          import json, pathlib
          font_pkg = "@fontsource/" + "".join(chr(c) for c in [105,110,116,101,114])
          pkg = {
            "name": "reel-3d-toilet-kecoa",
            "version": "1.0.0",
            "private": True,
            "dependencies": {
              "@react-three/fiber": "^8.17.10",
              "@remotion/bundler": "^4.0.250",
              "@remotion/cli": "^4.0.250",
              "@remotion/renderer": "^4.0.250",
              "@remotion/three": "^4.0.250",
              "@types/react": "18.3.3",
              "@types/three": "0.169.0",
              "react": "^18.3.1",
              "react-dom": "^18.3.1",
              "remotion": "^4.0.250",
              "three": "^0.169.0",
              "typescript": "5.5.4",
              "@fontsource/montserrat": "^5.1.0",
              "@fontsource/oswald": "^5.1.0",
              "@fontsource/caveat": "^5.1.0",
            },
            "overrides": {"webpack": "5.83.1"}
          }
          pkg["dependencies"][font_pkg] = "^5.1.0"
          pathlib.Path("package.json").write_text(json.dumps(pkg, indent=1))
          fam = ["Montserrat","Oswald","".join(chr(c) for c in [73,110,116,101,114]),"Caveat"]
          imp = "\n".join([
            "import '@fontsource/montserrat/800.css';",
            "import '@fontsource/montserrat/700.css';",
            "import '@fontsource/oswald/700.css';",
            f"import '@fontsource/{fam[2].lower()}/400.css';",
            f"import '@fontsource/{fam[2].lower()}/600.css';",
            f"import '@fontsource/{fam[2].lower()}/700.css';",
            "import '@fontsource/caveat/600.css';",
            "import '@fontsource/caveat/700.css';",
          ])
          pathlib.Path("src/fonts.generated.ts").write_text(imp + f"\nexport const FAMILIES: string[] = {json.dumps(fam)};\n")
          print("package OK")
          PY
          cat > tsconfig.json <<'EOF'
          {"compilerOptions":{"target":"ES2020","module":"ESNext","moduleResolution":"bundler","jsx":"react-jsx","strict":false,"skipLibCheck":true,"esModuleInterop":true,"types":["react"]}}
          EOF
          cat > src/fonts.ts <<'EOF'
          import {FAMILIES} from './fonts.generated';
          export const loadFonts = async () => {
            const d: any = document;
            await Promise.all(FAMILIES.flatMap((f: string) =>
              [800, 700, 600, 400].map(w => d.fonts.load(`${w} 40px "${f}"`, 'Aa0123456789').catch(() => null))));
            await d.fonts.ready;
          };
          EOF
          cat > src/index.ts <<'EOF'
          import './fonts.generated';
          import {registerRoot} from 'remotion';
          import {Root} from './Root';
          registerRoot(Root);
          EOF
          cat > src/Root.tsx <<'EOF'
          import React from 'react';
          import {Composition} from 'remotion';
          import {Reel} from './Reel';
          import {TOTAL_S} from './timeline';
          export const Root: React.FC = () => <Composition id="Reel" component={Reel}
            durationInFrames={Math.max(30, Math.ceil(TOTAL_S * 30))} fps={30} width={1080} height={1920} />;
          EOF
          cat > src/timeline.ts <<'EOF'
          import {SHOTS} from './shots';
          import {CamSpec} from './lib/core';
          export type TLEntry = { a: number; D: number; dd: number; d: number; cam: (p: number, u: number) => CamSpec; Scene: React.FC<{p: number; u: number}>; g?: any; hh?: number };
          let cursor = 0;
          export const TL: TLEntry[] = SHOTS.map((s: any) => {
            const e = { a: cursor, D: s.d, dd: s.d, d: s.d, cam: s.cam, Scene: s.Scene, g: s.g, hh: s.hh };
            cursor += s.d; return e;
          });
          export const TOTAL_S = cursor;
          EOF
          cat > src/lib/core.tsx <<'EOF'
          import * as THREE from 'three';
          export type V3 = [number, number, number];
          export type CamSpec = {p: V3; l: V3; fov: number; roll?: number};
          export const eo3 = (p: number) => { const c = Math.min(1, Math.max(0, p)); return c < .5 ? 2*c*c : 1 - Math.pow(-2*c+2, 2)/2; };
          export const lerp = (a: number, b: number, t: number) => a + (b-a)*t;
          export const clamp = (x: number, a: number, b: number) => Math.min(b, Math.max(a, x));
          export const camLerp = (a: CamSpec, b: CamSpec, t: number): CamSpec => ({
            p: [lerp(a.p[0], b.p[0], t), lerp(a.p[1], b.p[1], t), lerp(a.p[2], b.p[2], t)],
            l: [lerp(a.l[0], b.l[0], t), lerp(a.l[1], b.l[1], t), lerp(a.l[2], b.l[2], t)],
            fov: lerp(a.fov, b.fov, t), roll: lerp(a.roll||0, b.roll||0, t)
          });
          // Handheld micro shake ala video referensi - kamera HP goyang dikit
          export const handheld = (c: CamSpec, t: number, amp = .008): CamSpec => ({
            ...c,
            p: [c.p[0]+Math.sin(t*1.9)*amp, c.p[1]+Math.sin(t*2.4+1)*amp, c.p[2]+Math.sin(t*1.2+2)*amp],
            l: [c.l[0]+Math.sin(t*1.4)*amp*.4, c.l[1]+Math.sin(t*2.0+1)*amp*.4, c.l[2]]
          });
          // Squash & Stretch - kunci gerak kartun referensi
          export const squash = (p: number, power = .22) => {
            // p 0..1 siklus lompat: 0 = anticipation crouch, .3 = stretch, .6 = squash landing
            const s = Math.sin(p * Math.PI * 2);
            const sy = 1 + s * power;
            const sxz = 1 - s * power * .55;
            return {sx: sxz, sy, sz: sxz};
          };
          const matCache = new Map<string, THREE.MeshStandardMaterial>();
          export const MAT = (color: string, opts: any = {}) => {
            const key = `${color}|${opts.roughness ?? .55}|${opts.metalness ?? 0}|${opts.emissive ?? '#000'}|${opts.emissiveIntensity ?? 0}|${opts.transparent ?? false}|${opts.opacity ?? 1}`;
            let m = matCache.get(key);
            if (!m) {
              m = new THREE.MeshStandardMaterial({
                color: new THREE.Color(color), roughness: opts.roughness ?? .55, metalness: opts.metalness ?? 0,
                emissive: new THREE.Color(opts.emissive ?? '#000000'), emissiveIntensity: opts.emissiveIntensity ?? 0,
                transparent: opts.transparent ?? false, opacity: opts.opacity ?? 1,
              });
              matCache.set(key, m);
            }
            return m;
          };
          // Material PBR khusus - biar tidak flat kayak 2D
          export const MAT_PORCELAIN = () => MAT('#FFFFFF', {roughness:.12, metalness:.05});
          export const MAT_SKIN = (c: string) => MAT(c, {roughness:.62, metalness:0});
          export const MAT_CLOTH = (c: string) => MAT(c, {roughness:.85, metalness:0});
          export const MAT_CHITIN = (c: string) => MAT(c, {roughness:.28, metalness:.25});
          export const MAT_EYE = () => new THREE.MeshPhysicalMaterial({color:'#111111', roughness:.05, metalness:0, clearcoat:1, clearcoatRoughness:.08});
          export {THREE};
          EOF
          cat > src/lib/Character3D.tsx <<'EOF'
          import React from 'react';
          import * as THREE from 'three';
          import {MAT, MAT_SKIN, MAT_CLOTH, MAT_CHITIN, MAT_EYE, V3, squash} from './core';

          // --- FACE TEXTURE - ekspresi lebay kayak referensi ---
          const faceTexes = new Map<string, THREE.CanvasTexture>();
          const FW = 512, FH = 256;
          const fx = (x: number) => 128 + Math.asin(Math.max(-1, Math.min(1, x/.14)))*(FW/360)*0.92;
          const fy = (y: number) => 128 - Math.asin(Math.max(-1, Math.min(1, y/.14)))*(FH/180)*0.92;
          export type Face = {eyes?: 'dot'|'wide'|'happy'|'sleepy'|'closed'|'angry'; mouth?: 'grin'|'smile'|'flat'|'frown'|'o'|'scream'|'tongue'|'talk'; brow?: number; blush?: boolean};
          const drawFace = (c: CanvasRenderingContext2D, skin: string, f: Face, t: number) => {
            c.fillStyle = skin; c.fillRect(0,0,FW,FH);
            const g = c.createRadialGradient(128,120,20,128,120,150); g.addColorStop(0,'rgba(255,235,210,.18)'); g.addColorStop(1,'rgba(120,60,40,.28)'); c.fillStyle = g; c.fillRect(0,0,FW,FH);
            const eyes = f.eyes || 'dot', blink = Math.sin(t*2.1) > .985 || eyes === 'closed';
            if (f.blush) for (const sx of [-1,1]) { c.fillStyle = 'rgba(230,110,100,.45)'; c.beginPath(); c.ellipse(fx(sx*.055), fy(-.035), 26, 15, 0, 0, 6.3); c.fill(); }
            for (const sx of [-1,1]) {
              const cx = fx(sx*.055), cy = fy(.022), rx = 26;
              if (blink || eyes==='sleepy') { c.strokeStyle='#221310'; c.lineWidth=7; c.beginPath(); c.moveTo(cx-rx,cy); c.quadraticCurveTo(cx,cy+7,cx+rx,cy); c.stroke(); }
              else if (eyes==='happy') { c.strokeStyle='#221310'; c.lineWidth=7; c.beginPath(); c.arc(cx,cy+7,rx*.95,Math.PI*1.1,Math.PI*1.9); c.stroke(); }
              else {
                // mata besar kayak referensi - putih besar + pupil besar + highlight
                c.fillStyle='#fff'; c.beginPath(); c.ellipse(cx,cy,rx,rx*.72,0,0,6.3); c.fill();
                const pupR = eyes==='wide' ? rx*.55 : rx*.42;
                c.fillStyle='#1a0f0e'; c.beginPath(); c.arc(cx,cy,pupR,0,6.3); c.fill();
                c.fillStyle='#fff'; c.beginPath(); c.arc(cx-pupR*.35,cy-pupR*.4,pupR*.32,0,6.3); c.fill();
                c.strokeStyle='#221310'; c.lineWidth=5; c.beginPath(); c.ellipse(cx,cy,rx,rx*.74,0,Math.PI*1.05,Math.PI*1.95); c.stroke();
              }
              if (f.brow) { c.strokeStyle='#221310'; c.lineWidth=6; const by=fy(.068), s2=f.brow*sx*10; c.beginPath(); c.moveTo(cx-18,by+s2); c.lineTo(cx+18,by-s2); c.stroke(); }
            }
            const m = f.mouth || 'smile', mx = fx(0), my = fy(-.055);
            c.strokeStyle='#7a2e2e'; c.lineWidth=7; c.fillStyle='#d27a74';
            if (m==='smile') { c.beginPath(); c.moveTo(mx-28,my); c.quadraticCurveTo(mx,my+20,mx+28,my); c.stroke(); }
            else if (m==='grin') { c.fillStyle='#4a1518'; c.beginPath(); c.ellipse(mx,my+9,36,18,0,0,6.3); c.fill(); c.fillStyle='#f6f2ea'; c.fillRect(mx-33,my-2,66,10); }
            else if (m==='flat') { c.beginPath(); c.moveTo(mx-24,my); c.lineTo(mx+24,my); c.stroke(); }
            else if (m==='frown') { c.beginPath(); c.moveTo(mx-24,my+7); c.quadraticCurveTo(mx,my-7,mx+24,my+7); c.stroke(); }
            else if (m==='tongue') { c.fillStyle='#e86a7a'; c.beginPath(); c.ellipse(mx,my+14,16,22,0,0,6.3); c.fill(); c.strokeStyle='#7a2e2e'; c.beginPath(); c.moveTo(mx-26,my); c.quadraticCurveTo(mx,my+10,mx+26,my); c.stroke(); }
            else if (m==='talk') { const o=.4+.6*Math.abs(Math.sin(t*13)); c.fillStyle='#3a1218'; c.beginPath(); c.ellipse(mx,my+7,16,11*o,0,0,6.3); c.fill(); }
            else if (m==='o') { c.fillStyle='#3a1218'; c.beginPath(); c.ellipse(mx,my+7,14,17,0,0,6.3); c.fill(); }
            else if (m==='scream') { c.fillStyle='#4a1426'; c.beginPath(); c.ellipse(mx,my+9,30,34,0,0,6.3); c.fill(); }
          };
          const useFaceTex = (id: string, skin: string, f: Face, t: number) => {
            let tx = faceTexes.get(id);
            if (!tx) { const cv = document.createElement('canvas'); cv.width=FW; cv.height=FH; tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; faceTexes.set(id, tx); }
            const ctx = (tx.image as HTMLCanvasElement).getContext('2d')!; drawFace(ctx, skin, f, t); tx.needsUpdate = true; return tx;
          };

          const Bone: React.FC<{a: THREE.Vector3; b: THREE.Vector3; r: number; c: string; mat?: any}> = ({a,b,r,c,mat}) => {
            const len = Math.max(.001, a.distanceTo(b));
            const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), b.clone().sub(a).normalize());
            const mid = a.clone().add(b).multiplyScalar(.5);
            return <group position={mid.toArray() as V3} quaternion={q}><mesh material={mat || MAT(c,{roughness:.6})} castShadow><capsuleGeometry args={[r,len,4,12]} /></mesh></group>;
          };
          const Joint: React.FC<{p: THREE.Vector3; r: number; c: string}> = ({p,r,c}) => <mesh position={p.toArray() as V3} material={MAT(c,{roughness:.6})} castShadow><sphereGeometry args={[r*1.1,14,12]} /></mesh>;

          // --- MAN 3D - botak + kaos teal, duduk di toilet, main HP ---
          export type ManP = {pos: V3; rotY?: number; s?: number; face?: Face; t?: number; pose?: 'sit'|'stand'|'shake'|'jump'|'cry'|'angry'; holdPhone?: boolean; withSandal?: boolean};
          export const Man3D: React.FC<ManP> = ({pos, rotY=0, s=1, face, t=0, pose='sit', holdPhone=true}) => {
            const sq = pose==='jump' ? squash((t*1.4)%1, .28) : pose==='shake' ? squash((t*3)%1, .12) : {sx:1,sy:1,sz:1};
            const skin = '#FFC79A', shirt = '#2EC4B6', pants = '#2B2B3A';
            const faceTex = useFaceTex('man-'+(face?.mouth||'smile')+'-'+(face?.eyes||'dot'), skin, face||{}, t);
            const hipY = pose==='sit' ? .78 : 1.02;
            const headY = hipY + .62;
            return (
              <group position={pos} rotation={[0,rotY,0]} scale={[s*sq.sx, s*sq.sy, s*sq.sz]}>
                {/* legs - duduk menekuk */}
                <mesh position={[-.12, .42, .18]} rotation={[-1.25,0,0]} material={MAT_SKIN(skin)} castShadow><capsuleGeometry args={[.065,.32,4,12]} /></mesh>
                <mesh position={[.12, .42, .18]} rotation={[-1.25,0,0]} material={MAT_SKIN(skin)} castShadow><capsuleGeometry args={[.065,.32,4,12]} /></mesh>
                <mesh position={[-.12, .14, .32]} material={MAT('#111',{roughness:.3})} castShadow><boxGeometry args={[.14,.07,.28]} /></mesh>
                <mesh position={[.12, .14, .32]} material={MAT('#111',{roughness:.3})} castShadow><boxGeometry args={[.14,.07,.28]} /></mesh>
                {/* torso - kaos teal */}
                <mesh position={[0, hipY+.28, 0]} material={MAT_CLOTH(shirt)} castShadow receiveShadow><boxGeometry args={[.42,.52,.26]} /></mesh>
                <mesh position={[0, hipY+.38, .135]} material={MAT('#fff',{roughness:.5})}><planeGeometry args={[.16,.08]} /></mesh>
                <mesh position={[0, hipY+.38, .138]} material={MAT('#FFD93D',{roughness:.4, emissive:'#FFD93D', emissiveIntensity:.2})}><planeGeometry args={[.06,.06]} /></mesh>
                {/* arms ke HP */}
                <mesh position={[-.26, hipY+.28, .14]} rotation={[.5,0,.35]} material={MAT_CLOTH(shirt)} castShadow><capsuleGeometry args={[.055,.28,4,10]} /></mesh>
                <mesh position={[.26, hipY+.28, .14]} rotation={[.5,0,-.35]} material={MAT_CLOTH(shirt)} castShadow><capsuleGeometry args={[.055,.28,4,10]} /></mesh>
                <mesh position={[-.28, hipY+.05, .22]} material={MAT_SKIN(skin)} castShadow><sphereGeometry args={[.06,12,10]} /></mesh>
                <mesh position={[.28, hipY+.05, .22]} material={MAT_SKIN(skin)} castShadow><sphereGeometry args={[.06,12,10]} /></mesh>
                {/* phone - layar menyala */}
                {holdPhone && <group position={[0, hipY+.08, .28]} rotation={[.25,0,0]}>
                  <mesh material={MAT('#111',{roughness:.15, metalness:.6})} castShadow><boxGeometry args={[.17,.26,.02]} /></mesh>
                  <mesh position={[0,0,.012]} material={MAT('#2E86FF',{emissive:'#2E86FF', emissiveIntensity:1.2, roughness:.2})}><planeGeometry args={[.15,.24]} /></mesh>
                  <mesh position={[0,.06,.014]} material={MAT('#FFD93D',{emissive:'#FFD93D', emissiveIntensity:1})}><planeGeometry args={[.08,.05]} /></mesh>
                </group>}
                {/* head - botak, mata besar */}
                <group position={[0, headY, 0]}>
                  <mesh scale={[1,1.08,1]} castShadow><sphereGeometry args={[.21,28,20]} /><meshStandardMaterial map={faceTex} roughness={.68} /></mesh>
                  {/* telinga */}
                  {[-1,1].map(sx => <mesh key={sx} position={[sx*.21,0,0]} scale={[.5,1,.7]} material={MAT_SKIN(skin)}><sphereGeometry args={[.06,10,8]} /></mesh>)}
                  {/* rambut samping tipis ala referensi */}
                  {[-1,1].map(sx => <mesh key={sx} position={[sx*.19,-.02,-.02]} material={MAT('#111',{roughness:.9})}><boxGeometry args={[.03,.12,.1]} /></mesh>)}
                </group>
              </group>
            );
          };

          // --- ROACH 3D - kecoa dengan sayap transparan, antena follow-through ---
          export type RoachP = {pos: V3; rotY?: number; s?: number; female?: boolean; mood?: 'love'|'happy'|'shock'|'angry'; t?: number; pose?: 'stand'|'walk'|'jump'|'fly'|'kiss'; withRose?: boolean};
          export const Roach3D: React.FC<RoachP> = ({pos, rotY=0, s=1, female=false, mood='love', t=0, pose='stand', withRose=false}) => {
            const bounce = pose==='jump' ? Math.abs(Math.sin(t*6))* .22 : pose==='walk' ? Math.abs(Math.sin(t*10))* .04 : pose==='fly' ? Math.sin(t*8)*.05 : 0;
            const sq = pose==='jump' ? squash((t*1.8)%1, .18) : {sx:1,sy:1,sz:1};
            const bodyCol = female ? '#8B5A2B' : '#6B3A1A';
            const antSwing = Math.sin(t*7)*.25 + Math.sin(t*3)*.15;
            return (
              <group position={[pos[0], pos[1]+bounce, pos[2]]} rotation={[0,rotY,0]} scale={[s*sq.sx, s*sq.sy, s*sq.sz]}>
                {/* body - elips 3D bervolume */}
                <mesh position={[0,.14,0]} scale={[1,.62,1.45]} material={MAT_CHITIN(bodyCol)} castShadow receiveShadow><sphereGeometry args={[.19,24,18]} /></mesh>
                {/* sayap transparan - PBR */}
                <mesh position={[0,.20,-.02]} rotation={[-.15,0,0]} scale={[1,.08,1.35]} material={MAT('#D9A066',{roughness:.35, transparent:true, opacity:.85})}><sphereGeometry args={[.16,18,14]} /></mesh>
                {/* kepala */}
                <mesh position={[0,.18,.26]} scale={[1,.85,1]} material={MAT_CHITIN(bodyCol)} castShadow><sphereGeometry args={[.13,20,16]} /></mesh>
                {/* mata besar - physical material mengkilap */}
                {[-1,1].map(sx => <group key={sx} position={[sx*.06,.24,.35]}>
                  <mesh material={MAT('#fff',{roughness:.2})}><sphereGeometry args={[.055,16,12]} /></mesh>
                  <mesh position={[0,0,.035]} material={MAT_EYE()}><sphereGeometry args={[.028,12,10]} /></mesh>
                  <mesh position={[-.012,.012,.055]} material={MAT('#fff',{emissive:'#fff', emissiveIntensity:1})}><sphereGeometry args={[.008,8,6]} /></mesh>
                </group>)}
                {/* mulut */}
                <mesh position={[0,.10,.36]} material={MAT('#3A1A0A',{roughness:.6})}><sphereGeometry args={[.02,10,8]} /></mesh>
                {/* pita cewek */}
                {female && <group position={[0,.32,.24]}>
                  <mesh rotation={[0,0,.7]} material={MAT('#FF6B9D',{roughness:.5})}><boxGeometry args={[.08,.03,.01]} /></mesh>
                  <mesh rotation={[0,0,-.7]} material={MAT('#FF6B9D',{roughness:.5})}><boxGeometry args={[.08,.03,.01]} /></mesh>
                  <mesh material={MAT('#FF6B9D',{roughness:.5})}><sphereGeometry args={[.02,8,6]} /></mesh>
                </group>}
                {/* antena - follow-through */}
                {[-1,1].map(sx => <group key={sx} position={[sx*.05,.28,.30]} rotation={[.4,0,sx*(.5+antSwing)]}>
                  <mesh position={[sx*.02,.08,0]} rotation={[.2,0,sx*.3]} material={MAT('#111',{roughness:.7})}><capsuleGeometry args={[.008,.16,4,6]} /></mesh>
                  <mesh position={[sx*.04,.17,0]} material={MAT('#111',{roughness:.7})}><sphereGeometry args={[.014,8,6]} /></mesh>
                </group>)}
                {/* kaki 6 - sendi */}
                {[-1,1].map(sx => [0,1,2].map(i => <group key={`${sx}-${i}`} position={[sx*.16,.08,-.12+i*.12]} rotation={[0,0,sx*.6]}>
                  <mesh position={[sx*.06,-.06,0]} rotation={[0,0,sx*1.1]} material={MAT('#111',{roughness:.6})} castShadow><capsuleGeometry args={[.012,.14,4,6]} /></mesh>
                  <mesh position={[sx*.11,-.12,0]} rotation={[0,0,sx*.4]} material={MAT('#111',{roughness:.6})}><capsuleGeometry args={[.01,.10,4,6]} /></mesh>
                </group>))}
                {/* mawar */}
                {withRose && <group position={[-.22,.22,.28]} rotation={[0,0,.4]}>
                  <mesh position={[0,-.08,0]} material={MAT('#2E7D32',{roughness:.7})}><capsuleGeometry args={[.012,.16,4,6]} /></mesh>
                  <mesh material={MAT('#E63946',{roughness:.35, emissive:'#E63946', emissiveIntensity:.3})}><sphereGeometry args={[.06,14,12]} /></mesh>
                  <mesh position={[0,.03,0]} material={MAT('#FF6B8A',{roughness:.4})}><sphereGeometry args={[.03,10,8]} /></mesh>
                </group>}
                {/* hati melayang */}
                {mood==='love' && <mesh position={[.18,.38,.1]} material={MAT('#FF4D6D',{roughness:.3, emissive:'#FF4D6D', emissiveIntensity:.5})}><sphereGeometry args={[.03,10,8]} /></mesh>}
              </group>
            );
          };
          EOF
          cat > src/lib/Set3D.tsx <<'EOF'
          import React, {useMemo} from 'react';
          import * as THREE from 'three';
          import {MAT, MAT_PORCELAIN} from './core';

          // Tile texture prosedural - ubin kamar mandi
          const tileTex = () => {
            const cv = document.createElement('canvas'); cv.width=512; cv.height=512;
            const c = cv.getContext('2d')!;
            c.fillStyle='#A8D8F0'; c.fillRect(0,0,512,512);
            for (let y=0;y<4;y++) for (let x=0;x<4;x++) {
              const gx = x*128, gy=y*128;
