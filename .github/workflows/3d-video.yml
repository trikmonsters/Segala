          import React, {useMemo} from 'react';
          import * as THREE from 'three';
          import {MAT, V3} from './core';

          export const PALS: Record<string, any> = {
            dusk: {wall:'#2a2038', floor:'#1a1424', accent:'#ff9a5a', l1:'#ffd6a0', l2:'#7a6aff'},
          };

          export const Room: React.FC<{w:number;d:number;h:number;pal:string}> = ({w,d,h,pal}) => {
            const P = PALS[pal] || PALS.dusk;
            return (
              <group>
                <mesh rotation={[-Math.PI/2,0,0]} position={[0,0,d/2]} receiveShadow>
                  <planeGeometry args={[w,d]} /><meshStandardMaterial color={P.floor} roughness={.8} metalness={.1} /></mesh>
                <mesh position={[0,h/2,0]} receiveShadow>
                  <planeGeometry args={[w,h]} /><meshStandardMaterial color={P.wall} roughness={.9} /></mesh>
                <mesh rotation={[0,Math.PI/2,0]} position={[-w/2,h/2,d/2]} receiveShadow>
                  <planeGeometry args={[d,h]} /><meshStandardMaterial color={P.wall} roughness={.9} /></mesh>
                <mesh rotation={[0,-Math.PI/2,0]} position={[w/2,h/2,d/2]} receiveShadow>
                  <planeGeometry args={[d,h]} /><meshStandardMaterial color={P.wall} roughness={.9} /></mesh>
              </group>
            );
          };

          export const Lights: React.FC<{pal?:string}> = ({pal='dusk'}) => {
            const P = PALS[pal] || PALS.dusk;
            return (
              <>
                <ambientLight intensity={.35} color="#9a8ab0" />
                <directionalLight position={[3,5,4]} intensity={1.2} color={P.l1} castShadow shadow-mapSize={[512,512]} />
                <pointLight position={[-2,2.5,3]} intensity={.8} color={P.l2} distance={8} />
                <pointLight position={[2,2,1.5]} intensity={.5} color={P.accent} distance={6} />
              </>
            );
          };

          export const Pt: React.FC<{color:string; intensity:number; distance:number; position:V3}> = (p) =>
            <pointLight {...p} castShadow />;

          export const Pendant: React.FC<{pos: V3}> = ({pos}) => (
            <group position={pos}>
              <mesh position={[0,.6,0]}><cylinderGeometry args={[.005,.005,1.2,8]} /><meshStandardMaterial color="#222" /></mesh>
              <mesh material={MAT('#333', {metalness:.7, roughness:.3})}><coneGeometry args={[.12,.14,24,1,true]} /></mesh>
              <pointLight position={[0,-.05,0]} intensity={1.2} color="#ffd9a0" distance={4} castShadow />
            </group>
          );

          export const Desk: React.FC<{pos:V3; w:number; d:number; col:string}> = ({pos,w,d,col}) => (
            <group position={pos}>
              <mesh position={[0,.77,0]} material={MAT(col, {roughness:.4})} castShadow receiveShadow>
                <boxGeometry args={[w,.05,d]} /></mesh>
              {[[-1,-1],[1,-1],[-1,1],[1,1]].map(([x,z],i) => (
                <mesh key={i} position={[x*(w/2-.06), .38, z*(d/2-.06)]} material={MAT('#1a1525', {metalness:.6, roughness:.4})} castShadow>
                  <boxGeometry args={[.04,.76,.04]} /></mesh>
              ))}
            </group>
          );

          export const Chair: React.FC<{pos:V3; rot?:number; col?:string}> = ({pos, rot=0, col='#2a2038'}) => (
            <group position={pos} rotation={[0,rot,0]}>
              <mesh position={[0,.44,0]} material={MAT(col,{roughness:.7})} castShadow><boxGeometry args={[.42,.06,.42]} /></mesh>
              <mesh position={[0,.7,-.18]} material={MAT(col,{roughness:.7})} castShadow><boxGeometry args={[.42,.5,.06]} /></mesh>
              <mesh position={[0,.22,0]} material={MAT('#1a1525',{metalness:.7,roughness:.3})}><cylinderGeometry args={[.03,.03,.44,12]} /></mesh>
            </group>
          );

          const makeScreenTex = (type: string) => {
            const cv = document.createElement('canvas'); cv.width = 512; cv.height = 320;
            const c = cv.getContext('2d')!;
            c.fillStyle = '#0a1020'; c.fillRect(0,0,512,320);
            if (type === 'chat') {
              c.fillStyle = '#1e2a45'; c.fillRect(0,0,512,50);
              c.fillStyle = '#e0e8ff'; c.font = 'bold 22px Inter'; c.fillText('Messages', 20, 34);
              const msgs = [['AI HATE?', '#ff5577'], ['#trending', '#ffaa44'], ['Explain yourself', '#88bbff']];
              msgs.forEach(([txt,col], i) => {
                c.fillStyle = '#2a3a5a'; c.beginPath(); c.roundRect(20, 80+i*70, 380, 50, 20); c.fill();
                c.fillStyle = col as string; c.font = '18px Inter'; c.fillText(txt as string, 40, 110+i*70);
              });
            } else if (type === 'chart') {
              c.fillStyle = '#e0e8ff'; c.font = 'bold 28px Inter'; c.fillText('ENGAGEMENT', 30, 50);
              const pts = [40,120,80,180,220,280,320,400];
              c.strokeStyle = '#4ac0b0'; c.lineWidth = 6; c.beginPath();
              pts.forEach((y,i) => { const x = 40+i*60; if(i===0)c.moveTo(x,320-y); else c.lineTo(x,320-y); }); c.stroke();
              c.fillStyle = '#4ac0b0'; pts.forEach((y,i) => { c.beginPath(); c.arc(40+i*60,320-y,8,0,6.3); c.fill(); });
            } else if (type === 'slide') {
              c.fillStyle = '#1a2040'; c.fillRect(0,0,512,320);
              c.fillStyle = '#ffd9a0'; c.font = 'bold 36px Inter'; c.fillText('PROBLEM SOLVING', 40, 90);
              c.fillStyle = '#88bbff'; c.font = '22px Inter';
              ['1. Understand', '2. Break down', '3. Prompt clearly', '4. Verify'].forEach((s,i) => c.fillText(s, 50, 150+i*38));
            } else if (type === 'whiteboard') {
              c.fillStyle = '#f4f4ee'; c.fillRect(0,0,512,320);
              c.strokeStyle = '#3a6a9a'; c.lineWidth = 4;
              c.strokeRect(30,40,450,240);
              c.fillStyle = '#2a4060'; c.font = 'bold 28px Montserrat';
              c.fillText('AI PROBLEM', 60, 100); c.fillText('SOLVING', 60, 140);
              c.strokeStyle = '#aa3355'; c.beginPath(); c.moveTo(80,180); c.lineTo(420,180); c.stroke();
              c.fillStyle = '#2a4060'; c.font = '20px Inter';
              c.fillText('1. Listen  2. Analyze  3. Act', 80, 230);
            }
            const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; return tx;
          };

          export const Monitor: React.FC<{pos:V3; rot?:V3; kind:string; s?:number}> = ({pos, rot=[0,0,0], kind, s=1}) => {
            const tex = useMemo(() => makeScreenTex(kind), [kind]);
            return (
              <group position={pos} rotation={rot} scale={s}>
                <mesh material={MAT('#0a0a12',{roughness:.2,metalness:.4})} castShadow><boxGeometry args={[.62,.42,.03]} /></mesh>
                <mesh position={[0,0,.017]} material={new THREE.MeshBasicMaterial({map: tex, toneMapped: false})}>
                  <planeGeometry args={[.58,.38]} /></mesh>
                <mesh position={[0,-.22,0]} material={MAT('#1a1a22',{metalness:.8,roughness:.3})}>
                  <cylinderGeometry args={[.02,.03,.06,12]} /></mesh>
                <mesh position={[0,-.26,.02]} material={MAT('#1a1a22',{metalness:.8,roughness:.3})}>
                  <boxGeometry args={[.18,.015,.12]} /></mesh>
              </group>
            );
          };

          export const Art: React.FC<{kind:string; data?:any; pos:V3; rot?:V3; w:number}> = ({kind,pos,rot=[0,0,0],w}) => {
            const tex = useMemo(() => makeScreenTex(kind), [kind]);
            const h = w*0.625;
            return (
              <group position={pos} rotation={rot}>
                <mesh material={MAT('#2a2038',{roughness:.5})}><boxGeometry args={[w+.04,h+.04,.02]} /></mesh>
                <mesh position={[0,0,.012]} material={new THREE.MeshBasicMaterial({map: tex, toneMapped: false})}>
                  <planeGeometry args={[w,h]} /></mesh>
              </group>
            );
          };
          EOF

