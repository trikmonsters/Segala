name: reel-comedy-toilet-kecoa
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system deps
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser || sudo apt-get install -y ffmpeg chromium
      - name: Write project - Toilet Drama Kecoa Lamaran
        run: |
          set -e
          rm -rf src scripts public out chunks
          mkdir -p src/lib scripts public out chunks
          python3 - <<'PY'
          import json, pathlib
          font_pkg = "@fontsource/" + "".join(chr(c) for c in [105,110,116,101,114])
          pkg = {
            "name": "reel-comedy-toilet-kecoa",
            "version": "1.0.0",
            "private": True,
            "dependencies": {
              "@remotion/bundler": "^4.0.250",
              "@remotion/cli": "^4.0.250",
              "@remotion/renderer": "^4.0.250",
              "@types/react": "18.3.3",
              "react": "^18.3.1",
              "react-dom": "^18.3.1",
              "remotion": "^4.0.250",
              "typescript": "5.5.4",
              "@fontsource/montserrat": "^5.1.0",
              "@fontsource/oswald": "^5.1.0",
              "@fontsource/caveat": "^5.1.0",
            },
            "overrides": {"webpack": "5.83.1"}
          }
          pkg["dependencies"][font_pkg] = "^5.1.0"
          pathlib.Path("package.json").write_text(json.dumps(pkg, indent=1))
          fam = ["Montserrat","Oswald","".join(chr(c) for c in [73,110,116,101,114]),"Caveat"]
          imp = "\n".join([
            "import '@fontsource/montserrat/800.css';",
            "import '@fontsource/montserrat/700.css';",
            "import '@fontsource/oswald/700.css';",
            f"import '@fontsource/{fam[2].lower()}/400.css';",
            f"import '@fontsource/{fam[2].lower()}/600.css';",
            f"import '@fontsource/{fam[2].lower()}/700.css';",
            "import '@fontsource/caveat/600.css';",
            "import '@fontsource/caveat/700.css';",
          ])
          pathlib.Path("src/fonts.generated.ts").write_text(imp + f"\nexport const FAMILIES: string[] = {json.dumps(fam)};\n")
          print("package OK")
          PY
          cat > tsconfig.json <<'EOF'
          {"compilerOptions":{"target":"ES2020","module":"ESNext","moduleResolution":"bundler","jsx":"react-jsx","strict":false,"skipLibCheck":true,"esModuleInterop":true,"types":["react"]}}
          EOF
          cat > src/fonts.ts <<'EOF'
          import {FAMILIES} from './fonts.generated';
          export const loadFonts = async () => {
            const d: any = document;
            await Promise.all(FAMILIES.flatMap((f: string) =>
              [800, 700, 600, 400].map(w => d.fonts.load(`${w} 40px "${f}"`, 'Aa0123456789').catch(() => null))));
            await d.fonts.ready;
          };
          EOF
          cat > src/index.ts <<'EOF'
          import './fonts.generated';
          import {registerRoot} from 'remotion';
          import {Root} from './Root';
          registerRoot(Root);
          EOF
          cat > src/Root.tsx <<'EOF'
          import React from 'react';
          import {Composition} from 'remotion';
          import {Reel} from './Reel';
          import {TOTAL_S} from './timeline';
          export const Root: React.FC = () => <Composition id="Reel" component={Reel}
            durationInFrames={Math.max(30, Math.ceil(TOTAL_S * 30))} fps={30} width={1080} height={1920} />;
          EOF
          cat > src/timeline.ts <<'EOF'
          import {SHOTS} from './shots';
          export type TLEntry = { a: number; D: number; d: number; Scene: React.FC<{p: number; u: number}>; shake?: number; flash?: number };
          let cursor = 0;
          export const TL: TLEntry[] = SHOTS.map((s: any) => {
            const e = { a: cursor, D: s.d, d: s.d, Scene: s.Scene, shake: s.shake, flash: s.flash };
            cursor += s.d; return e;
          });
          export const TOTAL_S = cursor;
          EOF
          cat > src/lib/characters.tsx <<'EOF'
