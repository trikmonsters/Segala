            </Bathroom>
          );
          const S13: React.FC<{p:number;u:number}> = ({p,u}) => (
            <Bathroom><Man x={300} y={920} mood="cry" />
              <Roach x={650} y={1350} female={false} mood="love" withRose />
              <Roach x={800} y={1380} female mood="love" />
              <div style={{position:'absolute', left: 90, right: 90, top: 380, textAlign:'center', background:'#FFD93D', border:'6px solid #111', borderRadius: 28, padding: '20px 10px'}}>
                <div style={{fontFamily:'Montserrat', fontWeight: 900, fontSize: 50, lineHeight: 1.05}}>JANGAN GANGGU<br/>ORANG PACARAN!</div>
                <div style={{fontFamily:'Caveat', fontSize: 40}}>- kata kecoa -</div>
              </div>
              <div style={{position:'absolute', left: 180, right: 180, bottom: 380, textAlign:'center', background:'#111', color:'#fff', borderRadius: 30, padding: '18px 10px', fontFamily:'Montserrat', fontWeight: 900, fontSize: 36}}>FOLLOW BIAR GAK<br/>DIGANGGU KECOA 😹</div>
