name: reel-ai-sosmed
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system deps
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser || sudo apt-get install -y ffmpeg chromium

      - name: Write project (self-contained)
        run: |
          set -e
          rm -rf src scripts public out chunks
          mkdir -p src/lib scripts public out chunks

          cat > package.json <<'EOF'
          {
           "name": "reel-cartoon-3d",
           "version": "1.0.0",
           "private": true,
           "dependencies": {
            "@react-three/fiber": "^8.17.10",
            "@remotion/bundler": "^4.0.250",
            "@remotion/cli": "^4.0.250",
            "@remotion/renderer": "^4.0.250",
            "@remotion/three": "^4.0.250",
            "@types/react": "18.3.3",
            "@types/three": "0.169.0",
            "react": "^18.3.1",
            "react-dom": "^18.3.1",
            "remotion": "^4.0.250",
            "three": "^0.169.0",
            "typescript": "5.5.4",
            "@fontsource/montserrat": "^5.1.0",
            "@fontsource/oswald": "^5.1.0",
            "@fontsource/inter": "^5.1.0",
            "@fontsource/caveat": "^5.1.0"
           },
           "overrides": { "webpack": "5.83.1" }
          }
          EOF

          cat > tsconfig.json <<'EOF'
          {"compilerOptions":{"target":"ES2020","module":"ESNext","moduleResolution":"bundler","jsx":"react-jsx","strict":false,"skipLibCheck":true,"esModuleInterop":true,"types":["react"]}}
          EOF

          cat > src/fonts.generated.ts <<'EOF'
          import '@fontsource/montserrat/800.css';
          import '@fontsource/montserrat/700.css';
          import '@fontsource/oswald/700.css';
          import '@fontsource/inter/400.css';
          import '@fontsource/inter/600.css';
          import '@fontsource/inter/700.css';
          import '@fontsource/caveat/600.css';
          import '@fontsource/caveat/700.css';
          export const FAMILIES: string[] = ["Montserrat","Oswald","Inter","Caveat"];
          export const CAPTION_STACK = 'Montserrat, Inter, sans-serif';
          EOF

          cat > src/fonts.ts <<'EOF'
          import {FAMILIES} from './fonts.generated';
          export const loadFonts = async () => {
            const d: any = document;
            await Promise.all(FAMILIES.flatMap((f: string) =>
              [800, 700, 600, 400].map(w => d.fonts.load(`${w} 40px "${f}"`, 'Aa0123456789').catch(() => null))));
            await d.fonts.ready;
          };
          EOF

          cat > src/index.ts <<'EOF'
          import './fonts.generated';
          import {registerRoot} from 'remotion';
          import {Root} from './Root';
          registerRoot(Root);
          EOF

          cat > src/captions.json <<'EOF'
          { "lang": "en", "duration": 0, "source": "none", "speech": {}, "words": [] }
          EOF

          cat > src/Root.tsx <<'EOF'
          import React from 'react';
          import {Composition} from 'remotion';
          import {Reel} from './Reel';
          import {TOTAL_S} from './timeline';
          export const Root: React.FC = () => <Composition id="Reel" component={Reel}
            durationInFrames={Math.max(30, Math.ceil(TOTAL_S * 30))} fps={30} width={1080} height={1920} />;
          EOF

          cat > src/Reel.tsx <<'EOF'
          import React, {useLayoutEffect} from 'react';
          import * as THREE from 'three';
          import {AbsoluteFill, useCurrentFrame, useVideoConfig, delayRender, continueRender} from 'remotion';
          import {ThreeCanvas} from '@remotion/three';
          import {useThree} from '@react-three/fiber';
          import {TL, TOTAL_S} from './timeline';
          import {CamSpec, handheld, setStyle} from './lib/core';
          import {loadFonts} from './fonts';

          const CameraRig: React.FC<{cam: CamSpec}> = ({cam}) => {
            const {camera} = useThree();
            useLayoutEffect(() => {
              const c = camera as THREE.PerspectiveCamera;
              c.position.set(...cam.p); c.up.set(0, 1, 0); c.lookAt(...cam.l);
              c.rotateZ(cam.roll || 0); c.fov = cam.fov; c.near = .05; c.far = 80; c.updateProjectionMatrix();
            });
            return null;
          };
          const speed = (t: number, n = 30) => {
            let d = '';
            for (let i = 0; i < n; i++) {
              const a = i / n * 6.2832 + Math.sin(i * 7.7) * .2,
                r0 = 330 + ((t * 7 + i) % 3) * 20 + (Math.sin(i * 3.1) + 1) * 90,
                r1 = r0 + 280 + (Math.sin(i * 5.3) + 1) * 220;
              d += `M${540 + Math.cos(a) * r0} ${960 + Math.sin(a) * r0 * 1.5}L${540 + Math.cos(a) * r1} ${960 + Math.sin(a) * r1 * 1.5}`;
            }
            return d;
          };
          export const Reel: React.FC = () => {
            setStyle('toon');
            const [ready, setReady] = React.useState(false);
            const [hnd] = React.useState(() => delayRender('fonts'));
            React.useEffect(() => {
              loadFonts().then(() => setReady(true)).catch(() => setReady(true)).finally(() => continueRender(hnd));
            }, []);
            const f = useCurrentFrame(); const {width, height, fps} = useVideoConfig();
            const t = Math.min(f / fps, TOTAL_S - .001);
            if (!ready || !TL.length) return null;
            let sh = TL[TL.length - 1];
            for (const s of TL) if (t >= s.a && t < s.a + s.D) { sh = s; break; }
            const ua = t - sh.a, p = Math.min(1, ua / sh.D), u = p * sh.dd;
            const cam = handheld(sh.cam(p, u), u, sh.hh ?? .01);
            const g: any = sh.g || {};
            const flash = g.flash ? Math.max(0, 1 - ua / .2) * g.flash : 0;
            const lines = g.lines ? g.lines(p, u) : 0;
            return (
              <AbsoluteFill style={{background: '#000'}}>
                <ThreeCanvas width={width} height={height} shadows
                  gl={{antialias: true, toneMapping: THREE.NoToneMapping, preserveDrawingBuffer: true}}
                  camera={{fov: cam.fov, position: cam.p, near: .05, far: 80}}>
                  <CameraRig cam={cam} />
                  <sh.Scene p={p} u={u} />
                </ThreeCanvas>
                {g.tint && <AbsoluteFill style={{background: g.tint, opacity: g.ti ?? .15, mixBlendMode: 'multiply'}} />}
                <AbsoluteFill style={{background: 'linear-gradient(to bottom, rgba(255,255,255,.10), rgba(255,255,255,0) 45%, rgba(0,0,0,.25))'}} />
                <AbsoluteFill style={{background: `radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 52%, rgba(0,0,0,${g.vig ?? .5}) 100%)`}} />
                {lines > 0 && <svg width={width} height={height} style={{position: 'absolute', inset: 0, opacity: lines}}>
                  <path d={speed(u)} stroke="#fff" strokeWidth="5" strokeLinecap="round" fill="none" opacity=".55" /></svg>}
                {flash > 0 && <AbsoluteFill style={{background: '#fff', opacity: flash}} />}
              </AbsoluteFill>
            );
          };
          EOF

          cat > src/timeline.ts <<'EOF'
          import {SHOTS} from './shots';
          import {CamSpec} from './lib/core';
          export type TLEntry = { a: number; D: number; dd: number; d: number; cam: (p: number, u: number) => CamSpec; Scene: React.FC<{p: number; u: number}>; g?: any; hh?: number };
          const FALLBACK_D = 2.0;
          let cursor = 0;
          export const TL: TLEntry[] = SHOTS.map((s: any) => {
            const d = s.d || FALLBACK_D;
            const e = { a: cursor, D: d, dd: d, d, cam: s.cam, Scene: s.Scene, g: s.g, hh: s.hh };
            cursor += d; return e;
          });
          export const TOTAL_S = cursor;
          EOF

          cat > src/lib/core.tsx <<'EOF'
          import * as THREE from 'three';
          export type V3 = [number, number, number];
          export type CamSpec = {p: V3; l: V3; fov: number; roll?: number};
          export const eo3 = (p: number) => { const c = Math.min(1, Math.max(0, p)); return c < .5 ? 2*c*c : 1 - Math.pow(-2*c+2, 2)/2; };
          export const lerp = (a: number, b: number, t: number) => a + (b-a)*t;
          export const clamp = (x: number, a: number, b: number) => Math.min(b, Math.max(a, x));
          export const prog = (u: number, a: number, b: number) => clamp((u-a)/(b-a), 0, 1);
          export const camLerp = (a: CamSpec, b: CamSpec, t: number): CamSpec => ({
            p: [lerp(a.p[0], b.p[0], t), lerp(a.p[1], b.p[1], t), lerp(a.p[2], b.p[2], t)],
            l: [lerp(a.l[0], b.l[0], t), lerp(a.l[1], b.l[1], t), lerp(a.l[2], b.l[2], t)],
            fov: lerp(a.fov, b.fov, t), roll: lerp(a.roll||0, b.roll||0, t)
          });
          export const handheld = (c: CamSpec, t: number, amp = .008): CamSpec => ({
            ...c,
            p: [c.p[0]+Math.sin(t*1.7)*amp, c.p[1]+Math.sin(t*2.3+1)*amp, c.p[2]+Math.sin(t*1.1+2)*amp],
            l: [c.l[0]+Math.sin(t*1.3)*amp*.4, c.l[1]+Math.sin(t*1.9+1)*amp*.4, c.l[2]]
          });
          export const MAT = (color: string, opts: any = {}) => new THREE.MeshStandardMaterial({
            color: new THREE.Color(color), roughness: opts.roughness ?? .55, metalness: opts.metalness ?? 0,
            emissive: new THREE.Color(opts.emissive ?? '#000000'), emissiveIntensity: opts.emissiveIntensity ?? 0,
          });
          export const setStyle = (_s: string) => {};
          export const getStyle = () => 'toon';
          export const INK = '#1a1424';
          export {THREE};
          EOF

          cat > src/lib/Character.tsx <<'EOF'
          import React from 'react';
          import * as THREE from 'three';
          import {MAT, V3} from './core';

          export type Arm = [number, number, number];
          export type Pose = {sitH: number; lean: number; hx: number; hy: number; hz: number; aL: Arm; aR: Arm; lL: Arm; lR: Arm};
          const d = (x: number) => (x * Math.PI) / 180;
          const base = (o: Partial<Pose>): Pose => ({sitH: 0, lean: 0, hx: 0, hy: 0, hz: 0, aL: [d(4), d(10), d(12)], aR: [d(4), d(10), d(12)], lL: [0, d(2), 0], lR: [0, d(2), 0], ...o});
          export const POSE: Record<string, Pose> = {
            stand: base({}),
            hold: base({lean: d(3), hx: d(4)}),
            sit: base({sitH: 1, aL: [d(25), d(8), d(70)], aR: [d(25), d(8), d(70)], lL: [d(90), d(3), d(90)], lR: [d(90), d(3), d(90)]}),
            cheer: base({hx: d(-8), aL: [d(10), d(150), d(10)], aR: [d(10), d(150), d(10)]}),
            desk: base({lean: d(6), hx: d(4)}),
            push: base({lean: d(20), hx: d(10)}),
            wave: base({aR: [d(10), d(150), d(70)]}),
          };
          export const mixPose = (a: Pose, b: Pose, t: number): Pose => {
            const o: any = {};
            for (const k in a) o[k] = Array.isArray((a as any)[k]) ? (a as any)[k].map((v: number, i: number) => v + ((b as any)[k][i]-v)*t) : (a as any)[k] + ((b as any)[k]-a[k])*t;
            return o;
          };
          export const walkPose = (ph: number): Pose => {
            const s = Math.sin(ph);
            return base({lean: d(4), lL: [d(32)*s, d(2), Math.max(0,-s)*d(55)], lR: [-d(32)*s, d(2), Math.max(0,s)*d(55)], aL: [-d(26)*s, d(8), d(16)], aR: [d(26)*s, d(8), d(16)]});
          };

          const DM = {headR: .135, SY: 1.12, torsoW: .38, torsoH: .48, torsoD: .24, shX: .215, arm1: .30, arm2: .27, hand: .05,
                      thigh: .45, shin: .43, ankle: .06, hipX: .1, rL1: .075, rL2: .058, foot: [.1,.08,.27], neckL: .08, rN: .052, pelW: .35, pelH: .2, seat: .485};

          const ik2 = (S: THREE.Vector3, W0: THREE.Vector3, L1: number, L2: number, pole: THREE.Vector3) => {
            const dv = W0.clone().sub(S); let dist = dv.length(); const dMax = L1+L2-1e-3, W = W0.clone();
            if (dist > dMax) { W.copy(S).add(dv.multiplyScalar(dMax/dist)); dist = dMax; }
            dist = Math.max(dist, Math.abs(L1-L2)+1e-3);
            const dir = W.clone().sub(S).normalize(), a = (L1*L1-L2*L2+dist*dist)/(2*dist), h = Math.sqrt(Math.max(0, L1*L1-a*a));
            const mid = S.clone().add(dir.clone().multiplyScalar(a)); const pp = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir)));
            if (pp.lengthSq() < 1e-6) pp.set(0,0,1); pp.normalize();
            return {E: mid.add(pp.multiplyScalar(h)), W};
          };
          const fkArm = (S: THREE.Vector3, side: number, a: Arm, L1: number, L2: number) => {
            const q1 = new THREE.Quaternion().setFromEuler(new THREE.Euler(-a[0], 0, side*a[1], 'XYZ'));
            const q2 = new THREE.Quaternion().setFromEuler(new THREE.Euler(-a[2], 0, 0, 'XYZ'));
            const E = S.clone().add(new THREE.Vector3(0,-1,0).applyQuaternion(q1).multiplyScalar(L1));
            const W = E.clone().add(new THREE.Vector3(0,-1,0).applyQuaternion(q2).applyQuaternion(q1).multiplyScalar(L2));
            return {E, W};
          };
          const fkLeg = (H: THREE.Vector3, side: number, l: Arm, L1: number, L2: number) => {
            const q1 = new THREE.Quaternion().setFromEuler(new THREE.Euler(-l[0], 0, side*l[1], 'XYZ'));
            const q2 = new THREE.Quaternion().setFromEuler(new THREE.Euler(l[2], 0, 0, 'XYZ'));
            const K = H.clone().add(new THREE.Vector3(0,-1,0).applyQuaternion(q1).multiplyScalar(L1));
            const A = K.clone().add(new THREE.Vector3(0,-1,0).applyQuaternion(q2).applyQuaternion(q1).multiplyScalar(L2));
            return {E: K, W: A};
          };

          const Bone: React.FC<{a: THREE.Vector3; b: THREE.Vector3; r: number; c: string}> = ({a, b, r, c}) => {
            const dv = b.clone().sub(a), len = dv.length(), q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dv.clone().normalize());
            return <mesh position={a.clone().add(b).multiplyScalar(.5).toArray() as V3} quaternion={q} material={MAT(c, {roughness:.6})} castShadow>
              <capsuleGeometry args={[r, Math.max(.001, len-2*r), 6, 12]} /></mesh>;
          };
          const Ball: React.FC<{p: THREE.Vector3; r: number; c: string}> = ({p, r, c}) =>
            <mesh position={p.toArray() as V3} material={MAT(c, {roughness:.65})} castShadow><sphereGeometry args={[r, 16, 12]} /></mesh>;

          const faceTexes = new Map<string, THREE.CanvasTexture>();
          const FW = 512, FH = 256;
          const fx = (x: number) => 128 + Math.asin(Math.max(-1, Math.min(1, x/.135)))*(FW/360)*0.9;
          const fy = (y: number) => 128 - Math.asin(Math.max(-1, Math.min(1, y/.135)))*(FH/180)*0.9;
          export type Face = {eyes?: 'dot'|'wide'|'happy'|'sleepy'|'closed'; mouth?: 'grin'|'smile'|'flat'|'frown'|'wobble'|'o'|'scream'|'talk'; brow?: number; blush?: boolean; look?: [number, number]};
          const drawFace = (c: CanvasRenderingContext2D, skin: string, f: Face, t: number) => {
            c.fillStyle = skin; c.fillRect(0,0,FW,FH);
            const g = c.createRadialGradient(128,120,20,128,120,140); g.addColorStop(0,'rgba(255,235,210,.18)'); g.addColorStop(1,'rgba(120,60,40,.25)'); c.fillStyle = g; c.fillRect(0,0,FW,FH);
            const eyes = f.eyes || 'dot', blink = Math.sin(t*2.3) > .985 || eyes === 'closed', lk = f.look || [0,0];
            if (f.blush) for (const sx of [-1,1]) { c.fillStyle = 'rgba(230,120,110,.4)'; c.beginPath(); c.ellipse(fx(sx*.05), fy(-.03), 22, 13, 0, 0, 6.3); c.fill(); }
            for (const sx of [-1,1]) {
              const cx = fx(sx*.05), cy = fy(.02), rx = 22;
              if (blink || eyes === 'sleepy') { c.strokeStyle = '#2a1a16'; c.lineWidth = 6; c.beginPath(); c.moveTo(cx-rx,cy); c.quadraticCurveTo(cx,cy+6,cx+rx,cy); c.stroke(); }
              else if (eyes === 'happy') { c.strokeStyle = '#2a1a16'; c.lineWidth = 6; c.beginPath(); c.arc(cx,cy+6,rx*.9,Math.PI*1.1,Math.PI*1.9); c.stroke(); }
              else {
                c.fillStyle = '#f4efe8'; c.beginPath(); c.ellipse(cx,cy,rx,rx*.6,0,0,6.3); c.fill();
                c.fillStyle = '#2a1a10'; c.beginPath(); c.arc(cx+lk[0]*6, cy+lk[1]*5, rx*.42, 0, 6.3); c.fill();
                c.fillStyle = '#000'; c.beginPath(); c.arc(cx+lk[0]*6, cy+lk[1]*5, rx*.2, 0, 6.3); c.fill();
                c.fillStyle = '#fff'; c.beginPath(); c.arc(cx+lk[0]*6-rx*.14, cy+lk[1]*5-rx*.16, rx*.1, 0, 6.3); c.fill();
                c.strokeStyle = '#22140f'; c.lineWidth = 5; c.beginPath(); c.ellipse(cx,cy,rx,rx*.62,0,Math.PI*1.05,Math.PI*1.95); c.stroke();
              }
              if (f.brow) { c.strokeStyle = '#2a1a16'; c.lineWidth = 5; const by = fy(.06), s2 = f.brow*sx*8; c.beginPath(); c.moveTo(cx-16, by+s2); c.lineTo(cx+16, by-s2); c.stroke(); }
            }
            const m = f.mouth || 'smile', mx = fx(0), my = fy(-.05);
            c.strokeStyle = '#7a3a38'; c.fillStyle = '#d27a74'; c.lineWidth = 6;
            if (m === 'smile') { c.beginPath(); c.moveTo(mx-26,my); c.quadraticCurveTo(mx,my+18,mx+26,my); c.stroke(); }
            else if (m === 'grin') { c.fillStyle = '#4a1a1c'; c.beginPath(); c.ellipse(mx,my+8,32,16,0,0,6.3); c.fill(); c.fillStyle = '#f6f2ea'; c.fillRect(mx-30,my-2,60,9); }
            else if (m === 'flat') { c.beginPath(); c.moveTo(mx-22,my); c.lineTo(mx+22,my); c.stroke(); }
            else if (m === 'frown') { c.beginPath(); c.moveTo(mx-22,my+6); c.quadraticCurveTo(mx,my-6,mx+22,my+6); c.stroke(); }
            else if (m === 'talk') { const o = .4+.6*Math.abs(Math.sin(t*13)); c.fillStyle = '#3a1218'; c.beginPath(); c.ellipse(mx,my+6,14,10*o,0,0,6.3); c.fill(); }
            else if (m === 'o' || m === 'wobble') { c.fillStyle = '#3a1218'; c.beginPath(); c.ellipse(mx,my+6,12,14,0,0,6.3); c.fill(); }
            else if (m === 'scream') { c.fillStyle = '#4a1426'; c.beginPath(); c.ellipse(mx,my+8,26,30,0,0,6.3); c.fill(); }
          };
          const useFaceTex = (id: string, skin: string, f: Face, t: number) => {
            let tx = faceTexes.get(id);
            if (!tx) { const cv = document.createElement('canvas'); cv.width = FW; cv.height = FH; tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; faceTexes.set(id, tx); }
            const ctx = (tx.image as HTMLCanvasElement).getContext('2d')!; drawFace(ctx, skin, f, t); tx.needsUpdate = true; return tx;
          };

          export type CharP = {
            id: string; pos: V3; rotY?: number; s?: number; pose?: Pose;
            skin?: string; top?: string; pants?: string; shoe?: string; hairCol?: string; hair?: 'short'|'spiky'|'bun'|'bald';
            face?: Face; t?: number; prop?: 'phone'|'cup'|'case'|'env'; sweat?: boolean;
            wL?: V3; wR?: V3; fL?: V3; fR?: V3;
          };

          export const Character: React.FC<CharP> = (p) => {
            const t = p.t || 0, D = DM, pose = p.pose || POSE.stand;
            const skin = p.skin || '#e8b98f', top = p.top || '#3a7ca5', pants = p.pants || '#2c3550', shoe = p.shoe || '#1a1825';
            const hc = p.hairCol || '#2a1d18', hair = p.hair || 'short';
            const face = useFaceTex(p.id, skin, p.face || {}, t);
            const bob = Math.sin(t*1.8)*.006;
            const stand = D.thigh+D.shin+D.ankle, hip = stand + (D.seat-stand)*pose.sitH + bob;
            const P = new THREE.Vector3(0, hip, 0), qT = new THREE.Quaternion().setFromEuler(new THREE.Euler(-pose.lean,0,0));
            const toChar = (v: THREE.Vector3) => v.clone().applyQuaternion(qT).add(P);
            const shY = .07+D.torsoH-.05, neckBase = .07+D.torsoH, headC = neckBase+D.neckL+D.headR*D.SY*.88;
            const sL = toChar(new THREE.Vector3(-D.shX,shY,0)), sR = toChar(new THREE.Vector3(D.shX,shY,0));
            let tL: THREE.Vector3|null = p.wL ? new THREE.Vector3(...p.wL) : null, tR: THREE.Vector3|null = p.wR ? new THREE.Vector3(...p.wR) : null;
            if (p.prop === 'phone') tR = toChar(new THREE.Vector3(.1, neckBase+.03, D.torsoD/2+.16));
            if (p.prop === 'cup') tR = toChar(new THREE.Vector3(.1, .07+D.torsoH*.75, D.torsoD/2+.16));
            const aL = tL ? ik2(sL, tL, D.arm1, D.arm2, new THREE.Vector3(-.8,.2,-.3)) : fkArm(sL,-1,pose.aL,D.arm1,D.arm2);
            const aR = tR ? ik2(sR, tR, D.arm1, D.arm2, new THREE.Vector3(.8,.2,-.3)) : fkArm(sR,1,pose.aR,D.arm1,D.arm2);
            const hL = new THREE.Vector3(-D.hipX, hip-.01, 0), hR = new THREE.Vector3(D.hipX, hip-.01, 0);
            const lL = p.fL ? ik2(hL, new THREE.Vector3(...p.fL), D.thigh, D.shin, new THREE.Vector3(0,1,.4)) : fkLeg(hL,-1,pose.lL,D.thigh,D.shin);
            const lR = p.fR ? ik2(hR, new THREE.Vector3(...p.fR), D.thigh, D.shin, new THREE.Vector3(0,1,.4)) : fkLeg(hR,1,pose.lR,D.thigh,D.shin);

            return (
              <group position={p.pos} rotation={[0,p.rotY||0,0]} scale={p.s||1}>
                <Ball p={hL} r={D.rL1} c={pants} /><Ball p={hR} r={D.rL1} c={pants} />
