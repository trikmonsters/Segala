          // --- BATHROOM ala Toonkart + LaughByAnimation ---
          export const Bathroom: React.FC<{children?: React.ReactNode}> = ({children}) => (
            <div style={{position:'absolute', inset:0, background:'#BFE8F5', overflow:'hidden'}}>
              {/* tiles */}
              <div style={{position:'absolute', left:0, right:0, top:0, height: 1250, background: 'repeating-linear-gradient(0deg, #A8D8F0 0 90px, #fff 90px 96px), repeating-linear-gradient(90deg, #A8D8F0 0 90px, #fff 90px 96px)'}} />
              <div style={{position:'absolute', left:0, right:0, top:0, height: 1250, background:'rgba(255,255,255,.15)'}} />
