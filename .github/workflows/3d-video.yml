          cat > src/Reel.tsx <<'EOF'
          import React from 'react';
          import {AbsoluteFill, useCurrentFrame, useVideoConfig, delayRender, continueRender} from 'remotion';
          import {TL, TOTAL_S} from './timeline';
          import {loadFonts} from './fonts';
          export const Reel: React.FC = () => {
            const [ready, setReady] = React.useState(false);
            const [hnd] = React.useState(() => delayRender('fonts'));
            React.useEffect(() => { loadFonts().then(()=>setReady(true)).catch(()=>setReady(true)).finally(()=>continueRender(hnd)); }, []);
            const f = useCurrentFrame(); const {fps} = useVideoConfig();
            const t = Math.min(f / fps, TOTAL_S - .001);
            if (!ready || !TL.length) return null;
            let sh = TL[TL.length - 1];
            for (const s of TL) if (t >= s.a && t < s.a + s.D) { sh = s; break; }
            const ua = t - sh.a, p = Math.min(1, ua / sh.D), u = ua;
            const shake = sh.shake ? Math.sin(u * 40) * sh.shake : 0;
            const flash = sh.flash ? Math.max(0, 1 - ua / .3) * sh.flash : 0;
            return (
              <AbsoluteFill style={{background:'#000', overflow:'hidden'}}>
                <div style={{position:'absolute', inset:0, transform:`translate(${shake}px, ${shake*0.5}px)`}}>
                  <sh.Scene p={p} u={u} />
                </div>
                <AbsoluteFill style={{background: 'radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%)', pointerEvents:'none'}} />
                {flash > 0 && <AbsoluteFill style={{background:'#fff', opacity: flash}} />}
                {/* progress bar bottom like Reels */}
                <div style={{position:'absolute', left: 0, right: 0, bottom: 0, height: 10, background:'rgba(255,255,255,.25)'}}>
                  <div style={{height: '100%', width: `${(t / TOTAL_S)*100}%`, background:'#FFD93D'}} />
                </div>
                <div style={{position:'absolute', left: 24, bottom: 28, background:'rgba(0,0,0,.6)', color:'#fff', fontFamily:'Montserrat', fontWeight: 800, fontSize: 22, padding: '6px 12px', borderRadius: 20}}>ANAK KOS VS KUCING OREN • 45s</div>
              </AbsoluteFill>
            );
          };
          EOF
