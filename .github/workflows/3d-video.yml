          import React from 'react';
          import * as THREE from 'three';
          import {AbsoluteFill, useCurrentFrame, useVideoConfig, delayRender, continueRender} from 'remotion';
          import {ThreeCanvas} from '@remotion/three';
          import {useThree} from '@react-three/fiber';
          import {TL, TOTAL_S} from './timeline';
          import {CamSpec, handheld} from './lib/core';
          import {loadFonts} from './fonts';
          const CameraRig: React.FC<{cam: CamSpec}> = ({cam}) => {
            const {camera} = useThree();
            React.useLayoutEffect(() => {
              const c = camera as THREE.PerspectiveCamera;
              c.position.set(...cam.p); c.up.set(0,1,0); c.lookAt(...cam.l);
              c.rotateZ(cam.roll||0); c.fov=cam.fov; c.near=.05; c.far=30; c.updateProjectionMatrix();
            });
            return null;
          };
          const buildSpeed = (t: number, n=24) => {
            let d='';
            for (let i=0;i<n;i++){
              const a=i/n*6.2832+Math.sin(i*7.7)*.2, r0=330+((t*7+i)%3)*20+(Math.sin(i*3.1)+1)*90, r1=r0+280+(Math.sin(i*5.3)+1)*220;
              d+=`M${540+Math.cos(a)*r0} ${960+Math.sin(a)*r0*1.5}L${540+Math.cos(a)*r1} ${960+Math.sin(a)*r1*1.5}`;
            }
            return d;
          };
          export const Reel: React.FC = () => {
            const [ready, setReady] = React.useState(false);
            const [hnd] = React.useState(() => delayRender('fonts'));
            React.useEffect(() => { loadFonts().then(()=>setReady(true)).catch(()=>setReady(true)).finally(()=>continueRender(hnd)); }, []);
            const f = useCurrentFrame(); const {width, height, fps} = useVideoConfig();
            const t = Math.min(f/fps, TOTAL_S-.001);
            const speedPath = React.useMemo(()=>buildSpeed(Math.floor(t*30)/30), [Math.floor(t*30)]);
            if (!ready || !TL.length) return null;
            let sh = TL[TL.length-1];
            for (const s of TL) if (t>=s.a && t < s.a+s.D) { sh=s; break; }
            const ua = t-sh.a, p = Math.min(1, ua/sh.D), u = p*sh.dd;
            const cam = handheld(sh.cam(p,u), u, sh.hh ?? .01);
            const g: any = sh.g || {};
            const flash = g.flash ? Math.max(0,1-ua/.2)*g.flash : 0;
            const lines = g.lines ? g.lines(p,u) : 0;
            return (
              <AbsoluteFill style={{background:'#000'}}>
                <ThreeCanvas width={width} height={height} shadows
                  gl={{antialias:true, toneMapping: THREE.ACESFilmicToneMapping, toneMappingExposure:1.15, outputColorSpace: THREE.SRGBColorSpace, preserveDrawingBuffer:true, shadowMap:{type: THREE.PCFSoftShadowMap} as any}}
                  camera={{fov:cam.fov, position:cam.p, near:.05, far:30}}>
                  <CameraRig cam={cam} />
                  <sh.Scene p={p} u={u} />
                </ThreeCanvas>
                {g.tint && <AbsoluteFill style={{background:g.tint, opacity:g.ti ?? .12, mixBlendMode:'multiply'}} />}
                <AbsoluteFill style={{background:'linear-gradient(to bottom, rgba(255,255,255,.08), rgba(255,255,255,0) 45%, rgba(0,0,0,.22))'}} />
                <AbsoluteFill style={{background:`radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 52%, rgba(0,0,0,${g.vig ?? .45}) 100%)`}} />
                {lines>0 && <svg width={width} height={height} style={{position:'absolute', inset:0, opacity:lines}}><path d={speedPath} stroke="#fff" strokeWidth="5" strokeLinecap="round" fill="none" opacity=".55" /></svg>}
                {flash>0 && <AbsoluteFill style={{background:'#fff', opacity:flash}} />}
              </AbsoluteFill>
            );
          };
          EOF
