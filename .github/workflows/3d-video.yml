          #!/bin/sh
          set -e
          OUT="${1:-final.mp4}"
          FRAMES=$(node -e "const fs=require('fs');const t=fs.readFileSync('src/shots.tsx','utf8');const ds=[...t.matchAll(/d:\s*([\d.]+)/g)].map(m=>parseFloat(m[1]));console.log(Math.ceil((ds.reduce((a,b)=>a+b,0)||24)*30))")
          echo "FRAMES=$FRAMES"
          CHR="${CHROME:-$(ls /opt/pw-browsers/chromium-*/chrome-linux64/chrome 2>/dev/null | head -1)}"
          echo "CHROME=$CHR"
          mkdir -p chunks out; s=0; i=0; FAIL=0
          while [ $s -lt $FRAMES ]; do
            e=$((s+50)); [ $e -ge $FRAMES ] && e=$((FRAMES-1)); f=chunks/c_$(printf %03d $i).mp4
            if [ ! -f $f ]; then
              echo "=== render chunk $i frames $s-$e ==="
              if npx remotion render src/index.ts Reel chunks/tmp_$i.mp4 --frames=$s-$e --muted \
                  ${CHR:+--browser-executable=$CHR} --gl=${GL:-swangle} --concurrency=${CONC:-1} \
                  --codec=h264 --crf=17 --log=info > chunks/log_$i.txt 2>&1; then
                mv chunks/tmp_$i.mp4 $f
              else
                echo "RENDER GAGAL chunk $i. Log:"; cat chunks/log_$i.txt; FAIL=1; break
              fi
            fi
            i=$((i+1)); s=$((e+1))
          done
          if [ $FAIL -ne 0 ]; then echo "Berhenti karena render gagal"; exit 1; fi
          COUNT=$(ls chunks/c_*.mp4 2>/dev/null | wc -l)
          echo "chunks berhasil: $COUNT"
          if [ "$COUNT" -eq 0 ]; then echo "Tidak ada chunk yang dirender"; exit 1; fi
          ls chunks/c_*.mp4 | sort | sed "s#chunks/##; s/^/file '/; s/$/'/" > chunks/list.txt
          ffmpeg -v error -y -f concat -safe 0 -i chunks/list.txt -c copy "out/$OUT"
          echo "SELESAI (tanpa audio): out/$OUT"
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of default=nw=1 "out/$OUT"
          EOF
          chmod +x scripts/render.sh
          ls -l scripts/render.sh
          ls -l src src/lib

      - name: Install deps
        run: |
          set -e
          npm install --no-audit --no-fund
          npm ls @react-three/fiber three remotion @remotion/three || true

      - name: Smoke test 1 frame
        env:
          GL: 'swangle'
        run: |
          set -e
          npx remotion still src/index.ts Reel out/test.png --frame=10 \
            --gl=swangle --concurrency=1 --log=info || { echo "SMOKE TEST GAGAL"; exit 1; }
          ls -l out/test.png

      - name: Render (tanpa audio, single-thread)
        env:
          CONC: '1'
          GL: 'swangle'
        run: |
          set -e
          sh scripts/render.sh ai_sosmed.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-ai-sosmed
          path: |
            out/ai_sosmed.mp4
            out/test.png
          retention-days: 7
