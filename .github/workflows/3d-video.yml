              <Bowl x={560} y={1180} />
              <Cat x={760} y={1280} mood="sneaky" pose="sit" />
              <div style={{position:'absolute', left: 720, top: 1150, background:'#111', color:'#fff', padding: '8px 14px', borderRadius: 18, fontFamily:'Montserrat', fontWeight: 800}}>ngintip...</div>
              <Caption text="ADA YANG NGINTIP" sub="si oren udah cium bau mie" />
              <SFX text="MEONG?" x={700} y={900} color="#FF9A2B" rot={6} />
            </Room>
          );
          const S5: React.FC<{p:number;u:number}> = ({p,u}) => {
            const tug = Math.sin(u*14)*18;
            return (
              <Room><Boy x={260 + tug} y={1020} mood="angry" pose="hold" />
                <Cat x={620 - tug} y={1200} mood="angry" pose="jump" jump={u} />
                <Bowl x={440} y={1200} rot={tug*0.4} />
                <Caption text="REBUTAN MIE!" sub="siapa cepat dia dapat" />
                <SFX text="TARIK!" x={380} y={780} />
                <SFX text="LEPASIN!" x={600} y={950} color="#2E86FF" rot={8} />
              </Room>
            );
          };
          const S6: React.FC<{p:number;u:number}> = ({p,u}) => (
            <Room><Boy x={280} y={1020} mood="shock" pose="shock" />
              <Cat x={650} y={1200} mood="shock" pose="jump" jump={u} />
              <Bowl x={420 + p*40} y={1050 - Math.sin(p*Math.PI)*220} rot={p*180} flying />
              <div style={{position:'absolute', left: 400, top: 900, fontSize: 80}}>🍜💨</div>
              <Caption text="MIE-NYA TERBANG!" sub="slow-mo drama 3 detik" color="#FF6B6B" />
              <SFX text="GUBRAK!!" x={360} y={700} />
            </Room>
          );
          const S7: React.FC<{p:number;u:number}> = ({u}) => (
            <Room><Boy x={260} y={1020} mood="cry" pose="cry" cry jump={u} />
              <Cat x={620} y={1280} mood="happy" pose="eat" />
              <div style={{position:'absolute', left: 600, top: 1450, width: 300, height: 80, background:'#fff', borderRadius: 20, border:'4px solid #111', textAlign:'center', fontFamily:'Montserrat', fontWeight: 900, paddingTop: 16}}>SLURP... ENAK! 😻</div>
              <Caption text="KUCING YANG MAKAN" sub="anak kos cuma bisa nangis" color="#FF6B6B" />
            </Room>
          );
          const S8: React.FC<{p:number;u:number}> = ({u}) => (
            <Room><Boy x={380} y={1000} mood="happy" pose="cheer" jump={u} />
              <div style={{position:'absolute', left: 620, top: 1300, fontSize: 110}}>🍜👀</div>
              <Bubble text="HA! MASIH ADA 1 LAGI DI BAWAH KASUR!" x={90} y={430} w={440} />
              <Caption text="PLOT TWIST!" sub="mie cadangan anak kos sejati" />
              <SFX text="ADA LAGI!" x={580} y={800} color="#2ECC71" />
            </Room>
          );
          const S9: React.FC<{p:number;u:number}> = ({p,u}) => {
            const x = 200 + Math.sin(u*6)*280;
            return (
              <Room><Boy x={x} y={1020} mood="shock" pose="run" flip={Math.cos(u*6)<0} />
                <Cat x={x+180} y={1250} mood="angry" pose="run" jump={u} flip={Math.cos(u*6)<0} />
                <div style={{position:'absolute', left: 300, top: 1480, fontSize: 50}}>💨💨💨</div>
                <Caption text="KEJAR-KEJARAN!" sub="kosan jadi arena balap" />
              </Room>
            );
          };
          const S10: React.FC<{p:number;u:number}> = ({u}) => (
            <Room><Boy x={250} y={1020} mood="cry" pose="stand" />
              <Cat x={580} y={1250} mood="smug" pose="sit" />
              <Bowl x={600} y={1450} s={0.9} />
              <Bubble text="PUNYAKU. TITIK." x={560} y={1050} w={320} />
              <Caption text="KUCING MENANG" sub="anak kos pasrah total" />
            </Room>
          );
          const S11: React.FC<{p:number;u:number}> = ({u}) => (
            <Room><Boy x={250} y={1020} mood="happy" pose="hold" />
              <Cat x={600} y={1250} mood="happy" pose="sit" />
              <Bowl x={380} y={1250} s={1.1} />
              <div style={{position:'absolute', left: 380, top: 1450, fontSize: 60}}>🥢🥢</div>
              <Bubble text="YA UDAH, MAKAN BARENG AJA" x={80} y={420} w={420} />
              <Caption text="DAMAI!" sub="mie dibagi dua, hati dibagi satu" color="#2ECC71" />
            </Room>
          );
          const S12: React.FC<{p:number;u:number}> = ({u}) => (
            <Room><Boy x={280} y={1020} mood="shock" pose="shock" />
              <Cat x={620} y={1250} mood="happy" pose="jump" jump={u} />
              <Bubble text="TAMBAH LAGI DONG!" x={560} y={1050} w={340} />
              <Caption text="KUCING NAGIH!" sub="ini kucing apa preman?" />
              <SFX text="LAGI?!" x={300} y={760} />
            </Room>
          );
          const S13: React.FC<{p:number;u:number}> = ({p,u}) => (
            <Room><Boy x={320} y={1020} mood="cry" pose="cry" />
              <Cat x={620} y={1250} mood="smug" pose="sit" />
              <div style={{position:'absolute', left: 90, right: 90, top: 380, textAlign:'center', background:'#FFD93D', border:'6px solid #111', borderRadius: 28, padding: '20px 10px'}}>
                <div style={{fontFamily:'Montserrat', fontWeight: 900, fontSize: 52, lineHeight: 1.05}}>BESOK KAMU<br/>YANG BELI MIE!</div>
                <div style={{fontFamily:'Caveat', fontSize: 42}}>- kata kucing oren -</div>
              </div>
              <div style={{position:'absolute', left: 180, right: 180, bottom: 380, textAlign:'center', background:'#111', color:'#fff', borderRadius: 30, padding: '18px 10px', fontFamily:'Montserrat', fontWeight: 900, fontSize: 38}}>FOLLOW BIAR OREN<br/>GAK LAPAR LAGI 😹</div>
              <div style={{position:'absolute', left: 0, right: 0, bottom: 180, textAlign:'center', fontSize: 44}}>❤️ 🔁 💬</div>
            </Room>
          );
          export const SHOTS: any[] = [
            {d:3.0, Scene:S1, cap:'jam 2 pagi'},
            {d:3.5, Scene:S2, cap:'ketemu mie'},
            {d:3.5, Scene:S3, cap:'masak mie'},
            {d:3.5, Scene:S4, cap:'kucing ngintip'},
            {d:3.5, Scene:S5, cap:'rebutan', shake: 6},
            {d:3.5, Scene:S6, cap:'mie terbang', shake: 10, flash: .3},
            {d:3.5, Scene:S7, cap:'kucing makan'},
            {d:3.5, Scene:S8, cap:'plot twist'},
            {d:3.5, Scene:S9, cap:'kejar-kejaran', shake: 4},
            {d:3.5, Scene:S10, cap:'kucing menang'},
            {d:3.5, Scene:S11, cap:'damai'},
            {d:3.5, Scene:S12, cap:'kucing nagih'},
            {d:3.5, Scene:S13, cap:'punchline + CTA'},
          ];
          EOF
          cat > scripts/render.sh <<'EOF'
          #!/bin/sh
          set -e
          OUT="${1:-final.mp4}"
          FRAMES=$(node -e "const fs=require('fs');const t=fs.readFileSync('src/shots.tsx','utf8');const ds=[...t.matchAll(/d:\s*([\d.]+)/g)].map(m=>parseFloat(m[1]));console.log(Math.ceil((ds.reduce((a,b)=>a+b,0)||45)*30))")
          echo "FRAMES=$FRAMES"
          CHR="${CHROME:-$(ls /opt/pw-browsers/chromium-*/chrome-linux64/chrome 2>/dev/null | head -1)}"
          echo "CHROME=$CHR"
          CONC="${CONC:-$(nproc 2>/dev/null || echo 2)}"
          echo "CONC=$CONC"
          mkdir -p chunks out; s=0; i=0; FAIL=0
          while [ $s -lt $FRAMES ]; do
            e=$((s+90)); [ $e -ge $FRAMES ] && e=$((FRAMES-1)); f=chunks/c_$(printf %03d $i).mp4
            if [ ! -f $f ]; then
              echo "=== render chunk $i frames $s-$e ==="
              if npx remotion render src/index.ts Reel chunks/tmp_$i.mp4 --frames=$s-$e --muted \
                  ${CHR:+--browser-executable=$CHR} --gl=${GL:-swangle} --concurrency=$CONC \
                  --codec=h264 --crf=17 --log=info > chunks/log_$i.txt 2>&1; then
                mv chunks/tmp_$i.mp4 $f
              else
                echo "RENDER GAGAL chunk $i. Log:"; cat chunks/log_$i.txt; FAIL=1; break
              fi
            fi
            i=$((i+1)); s=$((e+1))
          done
          if [ $FAIL -ne 0 ]; then echo "Berhenti karena render gagal"; exit 1; fi
          COUNT=$(ls chunks/c_*.mp4 2>/dev/null | wc -l)
          echo "chunks berhasil: $COUNT"
          if [ "$COUNT" -eq 0 ]; then echo "Tidak ada chunk yang dirender"; exit 1; fi
          ls chunks/c_*.mp4 | sort | sed "s#chunks/##; s/^/file '/; s/$/'/" > chunks/list.txt
          ffmpeg -v error -y -f concat -safe 0 -i chunks/list.txt -c copy -movflags +faststart "out/$OUT"
          echo "SELESAI (tanpa audio): out/$OUT"
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of default=nw=1 "out/$OUT"
          EOF
          chmod +x scripts/render.sh
          ls -l scripts/render.sh
          ls -l src src/lib
      - name: Install deps
        run: |
          set -e
          npm install --no-audit --no-fund
          npm ls remotion || true
      - name: Smoke test 1 frame
        env:
          GL: 'swangle'
        run: |
          set -e
          npx remotion still src/index.ts Reel out/test.png --frame=10 --gl=swangle --concurrency=1 --log=info || { echo "SMOKE TEST GAGAL"; exit 1; }
          ls -l out/test.png
      - name: Render 45s
        env:
          CONC: '1'
          GL: 'swangle'
        run: |
          set -e
          sh scripts/render.sh comedy_anak_kos_vs_kucing_oren.mp4
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-comedy-2d-45s
          path: |
            out/comedy_anak_kos_vs_kucing_oren.mp4
            out/test.png
          retention-days: 7
