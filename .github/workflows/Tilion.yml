name: Duck.ai Scraper with Fortress

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt untuk dikirim ke Duck.ai'
        required: true
        default: 'Apa itu kecerdasan buatan?'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Start Fortress via Docker
        run: |
          docker run -d --rm -p 9222:9222 --name fortress tilion/fortress:latest
          echo "Menunggu Fortress siap..."
          sleep 10
          curl -s http://localhost:9222/json/version && echo "Fortress siap!"

      - name: Run Duck.ai scraper
        env:
          DUCKAI_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          cat > duckai_scraper.py << 'EOF'
          import asyncio
          import os
          from playwright.async_api import async_playwright

          async def main():
              prompt = os.environ.get("DUCKAI_PROMPT", "Hello")
              
              async with async_playwright() as p:
                  browser = await p.chromium.connect_over_cdp("http://localhost:9222")
                  page = await browser.new_page()

                  # Buka Duck.ai
                  print("Membuka Duck.ai...")
                  await page.goto("https://duck.ai", wait_until="networkidle")
                  await page.wait_for_timeout(3000)

                  # Cari input chat dan kirim prompt
                  print(f"Mengirim prompt: {prompt}")
                  
                  selectors = [
                      'textarea[placeholder*="Ask"]',
                      'textarea[placeholder*="message"]',
                      'textarea',
                      'input[type="text"]'
                  ]
                  
                  input_found = False
                  for selector in selectors:
                      try:
                          await page.wait_for_selector(selector, timeout=5000)
                          await page.fill(selector, prompt)
                          await page.keyboard.press("Enter")
                          input_found = True
                          print(f"Input ditemukan dengan selector: {selector}")
                          break
                      except:
                          continue
                  
                  if not input_found:
                      print("Input chat tidak ditemukan. Cek screenshot untuk debugging.")
                      await page.screenshot(path="debug_no_input.png")
                      await browser.close()
                      return

                  # === HANDLE TOMBOL CONTINUE (PERSETUJUAN ToS) ===
                  print("Memeriksa tombol Continue...")
                  await page.wait_for_timeout(2000)  # Beri waktu untuk UI render
                  
                  try:
                      continue_button = page.locator('button:has-text("Continue")')
                      if await continue_button.count() > 0:
                          print("Tombol Continue ditemukan. Mengklik...")
                          await continue_button.first.click()
                          await page.wait_for_timeout(3000)
                          print("Tombol Continue berhasil diklik.")
                      else:
                          print("Tombol Continue tidak ditemukan, melanjutkan...")
                  except Exception as e:
                      print(f"Error saat menangani tombol Continue: {e}")

                  # Tunggu respons AI
                  print("Menunggu respons AI...")
                  await page.wait_for_timeout(12000)  # Perpanjang waktu tunggu

                  # Ambil screenshot hasil
                  await page.screenshot(path="duckai_result.png", full_page=True)
                  print("Screenshot disimpan: duckai_result.png")

                  # Ekstrak teks respons
                  try:
                      response_text = await page.inner_text("body")
                      print("=== Respons Duck.ai ===")
                      print(response_text[:3000])
                  except Exception as e:
                      print(f"Gagal ekstrak teks: {e}")

                  await browser.close()

          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          python duckai_scraper.py

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duckai-screenshot
          path: |
            duckai_result.png
            debug_no_input.png
          retention-days: 7

      - name: Stop Fortress
        if: always()
        run: docker stop fortress || true
