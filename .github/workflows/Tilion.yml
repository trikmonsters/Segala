name: Google Vids Login - Stream to Log

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email Google'
        required: true
        default: 'kucingpaskib@gmail.com'

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Start Fortress via Docker
        run: |
          docker run -d --rm -p 9222:9222 --name fortress tilion/fortress:latest
          echo "Menunggu Fortress siap..."
          sleep 10
          curl -s http://localhost:9222/json/version && echo "Fortress siap!"

      # ===== STEP 1: JALANKAN LOGIN DI BACKGROUND =====
      - name: Step 1 - Start Login in Background
        env:
          TEST_EMAIL: ${{ github.event.inputs.email }}
          TEST_PASSWORD: "MASUKKAN_PASSWORD_ANDA_DISINI"
        run: |
          cat > login_bg.py << 'EOF'
          import asyncio
          import os
          import re
          import json
          import sys
          from datetime import datetime
          from playwright.async_api import async_playwright

          # File untuk komunikasi antar step
          STATE_FILE = "/tmp/login_state.json"
          LOG_FILE = "/tmp/login_log.txt"
          ELEMENTS_FILE = "/tmp/elements.json"

          def log(msg):
              """Tulis ke log file DAN stdout, flush langsung."""
              timestamp = datetime.now().strftime("%H:%M:%S")
              line = f"[{timestamp}] {msg}"
              print(line, flush=True)
              with open(LOG_FILE, "a") as f:
                  f.write(line + "\n")

          def save_state(state):
              with open(STATE_FILE, "w") as f:
                  json.dump(state, f)

          async def dump_page_elements(page):
              elements_data = []
              try:
                  elements = await page.locator(
                      'div, span, p, h1, h2, h3, h4, h5, h6, '
                      'button, a, label, strong, b, em, li, td, th'
                  ).all()
                  
                  for el in elements:
                      try:
                          text = await el.inner_text()
                          text = text.strip()
                          if not text or len(text) > 100:
                              continue
                          tag = await el.evaluate('el => el.tagName')
                          font_size = await el.evaluate(
                              'el => window.getComputedStyle(el).fontSize'
                          )
                          size_px = int(font_size.replace('px', '')) if font_size else 0
                          is_code = bool(re.fullmatch(r'\d{2}', text))
                          elements_data.append({
                              "tag": tag, "text": text,
                              "font_size": size_px, "is_code": is_code
                          })
                      except:
                          continue
              except Exception as e:
                  log(f"Error dump: {e}")
              
              elements_data.sort(key=lambda x: (not x["is_code"], -x["font_size"]))
              return elements_data

          async def main():
              email = os.environ.get("TEST_EMAIL", "")
              password = os.environ.get("TEST_PASSWORD", "")
              
              # Reset log
              open(LOG_FILE, "w").close()
              
              save_state({"status": "starting", "url": "", "logged_in": False})
              
              async with async_playwright() as p:
                  browser = await p.chromium.connect_over_cdp("http://localhost:9222")
                  context = await browser.new_context()
                  page = await context.new_page()
                  
                  # 1. Buka Google Vids
                  log("Membuka https://docs.google.com/videos/u/4/ ...")
                  await page.goto(
                      "https://docs.google.com/videos/u/4/",
                      wait_until="domcontentloaded"
                  )
                  await page.wait_for_timeout(5000)
                  log(f"URL: {page.url}")
                  
                  # 2. Isi email
                  log(f"Mengisi email: {email}")
                  for selector in [
                      'input[type="email"]', 'input[name="identifier"]',
                      'input[type="text"]', 'input[aria-label*="Email"]'
                  ]:
                      try:
                          await page.wait_for_selector(selector, timeout=3000)
                          await page.fill(selector, email)
                          log(f"Email diisi: {selector}")
                          break
                      except:
                          continue
                  
                  # 3. Klik Next
                  for selector in [
                      'button:has-text("Next")', 'button:has-text("Berikutnya")',
                      'button[type="submit"]', '#identifierNext'
                  ]:
                      try:
                          btn = page.locator(selector).first
                          if await btn.count() > 0:
                              await btn.click()
                              log(f"Next diklik: {selector}")
                              break
                      except:
                          continue
                  
                  await page.wait_for_timeout(5000)
                  
                  # 4. Isi password
                  log("Mengisi password...")
                  for selector in [
                      'input[type="password"]', 'input[name="password"]',
                      'input[aria-label*="password"]'
                  ]:
                      try:
                          await page.wait_for_selector(selector, timeout=5000)
                          await page.fill(selector, password)
                          log("Password diisi")
                          break
                      except:
                          continue
                  
                  # 5. Klik Next
                  for selector in [
                      'button:has-text("Next")', 'button:has-text("Berikutnya")',
                      'button[type="submit"]', '#identifierNext'
                  ]:
                      try:
                          btn = page.locator(selector).first
                          if await btn.count() > 0:
                              await btn.click()
                              log("Next diklik")
                              break
                      except:
                          continue
                  
                  # 6. Tunggu halaman verifikasi
                  log("Menunggu halaman verifikasi...")
                  await page.wait_for_timeout(8000)
                  log(f"URL verifikasi: {page.url}")
                  
                  save_state({
                      "status": "waiting",
                      "url": page.url,
                      "logged_in": False
                  })
                  
                  # === LOOP UTAMA: DUMP SETIAP 10 DETIK ===
                  max_wait = 900
                  elapsed = 0
                  last_dump = -999
                  
                  while elapsed < max_wait:
                      current_url = page.url
                      
                      # Update state
                      save_state({
                          "status": "waiting",
                          "url": current_url,
                          "logged_in": False,
                          "elapsed": elapsed
                      })
                      
                      # Cek login berhasil
                      if "docs.google.com/videos" in current_url:
                          log(f"LOGIN BERHASIL pada detik ke-{elapsed}!")
                          save_state({
                              "status": "success",
                              "url": current_url,
                              "logged_in": True,
                              "elapsed": elapsed
                          })
                          break
                      
                      # Dump elemen setiap 10 detik
                      if elapsed - last_dump >= 10:
                          last_dump = elapsed
                          
                          log(f"--- Dump @ {elapsed}s ---")
                          elements_data = await dump_page_elements(page)
                          
                          # Simpan ke file
                          with open(ELEMENTS_FILE, "w") as f:
                              json.dump({
                                  "elapsed": elapsed,
                                  "url": current_url,
                                  "elements": elements_data
                              }, f, indent=2)
                          
                          # Print kandidat kode ke log
                          code_candidates = [
                              e for e in elements_data if e["is_code"]
                          ]
                          if code_candidates:
                              log(f"KANDIDAT KODE ({len(code_candidates)}):")
                              for c in code_candidates:
                                  log(f"  >>> {c['text']} <<< "
                                      f"(font {c['font_size']}px, {c['tag']})")
                          
                          # Print semua elemen ke log (max 20)
                          log(f"Semua elemen ({len(elements_data)}, max 20):")
                          for i, el in enumerate(elements_data[:20]):
                              marker = ">>" if el["is_code"] else "  "
                              log(f"  {marker} [{i+1}] <{el['tag']}> "
                                  f"font={el['font_size']}px | '{el['text'][:50]}'")
                      
                      await page.wait_for_timeout(5000)
                      elapsed += 5
                  
                  # Screenshot akhir
                  await page.screenshot(
                      path=f"/tmp/final.png", full_page=True
                  )
                  
                  if elapsed >= max_wait:
                      log(f"TIMEOUT setelah {elapsed}s")
                      save_state({
                          "status": "timeout",
                          "url": page.url,
                          "logged_in": False
                      })
                  
                  await browser.close()

          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          
          # Jalankan di background
          nohup python login_bg.py > /tmp/login_bg.log 2>&1 &
          echo "Login script berjalan di background (PID: $!)"

      # ===== STEP 2: TUNGGU SEBENTAR, LALU TAMPILKAN LOG =====
      - name: Step 2 - Show Initial Log
        if: always()
        run: |
          echo "Menunggu 60 detik agar login sampai halaman verifikasi..."
          sleep 60
          echo "=== LOG SAAT INI ==="
          cat /tmp/login_log.txt 2>/dev/null || echo "Log belum ada"
          echo ""
          echo "=== ELEMENTS ==="
          cat /tmp/elements.json 2>/dev/null | head -100 || echo "Elements belum ada"

      # ===== STEP 3: LOOP MONITORING (LIHAT LOG BERKALA) =====
      - name: Step 3 - Monitor Loop
        if: always()
        run: |
          # Loop 12 kali, setiap 30 detik, tampilkan log
          for i in $(seq 1 12); do
            echo ""
            echo "═══════════════════════════════════════"
            echo "MONITORING ROUND $i @ $(date +%H:%M:%S)"
            echo "═══════════════════════════════════════"
            
            # Cek state
            if [ -f /tmp/login_state.json ]; then
              echo "--- STATE ---"
              cat /tmp/login_state.json
              echo ""
            fi
            
            # Tampilkan log terbaru
            if [ -f /tmp/login_log.txt ]; then
              echo "--- LOG (20 baris terakhir) ---"
              tail -20 /tmp/login_log.txt
            fi
            
            # Tampilkan kandidat kode
            if [ -f /tmp/elements.json ]; then
              echo ""
              echo "--- KANDIDAT KODE ---"
              python3 -c "
          import json
          try:
              with open('/tmp/elements.json') as f:
                  data = json.load(f)
              codes = [e for e in data['elements'] if e.get('is_code')]
              print(f'Elapsed: {data[\"elapsed\"]}s')
              for c in codes[:5]:
                  print(f'  🎯 {c[\"text\"]} (font {c[\"font_size\"]}px)')
          except Exception as e:
              print(f'Error: {e}')
          " 2>/dev/null || echo "Belum ada kandidat"
            fi
            
            # Cek apakah sudah login
            if [ -f /tmp/login_state.json ]; then
              STATUS=$(python3 -c "import json; print(json.load(open('/tmp/login_state.json')).get('status',''))" 2>/dev/null)
              if [ "$STATUS" = "success" ]; then
                echo ""
                echo "🎉 LOGIN BERHASIL! Berhenti monitoring."
                break
              fi
            fi
            
            sleep 30
          done

      # ===== STEP 4: TAMPILKAN HASIL AKHIR =====
      - name: Step 4 - Final Result
        if: always()
        run: |
          echo "═══════════════════════════════════════"
          echo "HASIL AKHIR"
          echo "═══════════════════════════════════════"
          cat /tmp/login_state.json 2>/dev/null
          echo ""
          echo "--- LOG LENGKAP ---"
          cat /tmp/login_log.txt 2>/dev/null || echo "Log tidak ditemukan"

      # ===== STEP 5: UPLOAD SCREENSHOT KE RELEASE =====
      - name: Step 5 - Upload to Release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f /tmp/final.png ]; then
            TAG="google-vids-$(date +%Y%m%d_%H%M%S)"
            
            # Buat release
            RELEASE_RESP=$(curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/$GITHUB_REPOSITORY/releases \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Google Vids Login\",\"body\":\"Auto-generated\"}")
            
            UPLOAD_URL=$(echo "$RELEASE_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'].replace('{?name,label}',''))" 2>/dev/null)
            
            if [ -n "$UPLOAD_URL" ]; then
              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: image/png" \
                --data-binary @/tmp/final.png \
                "$UPLOAD_URL?name=final.png"
              echo "Screenshot diupload ke release: $TAG"
            fi
          fi

      - name: Stop Fortress
        if: always()
        run: docker stop fortress || true
