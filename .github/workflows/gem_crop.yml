name: Detect and Crop Video Edge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  detect-and-crop:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        
    - name: Install Python dependencies
      run: |
        pip install opencv-python-headless numpy
        
    - name: Run detection and crop
      run: |
        python << 'EOF'
        import cv2
        import numpy as np
        import os
        import subprocess

        def find_video_borders(input_path):
            """
            Find the actual video content borders by detecting where pixels start changing
            """
            cap = cv2.VideoCapture(input_path)
            
            if not cap.isOpened():
                print(f"Error: Could not open video {input_path}")
                return None
            
            width = int(cap.get(cv2.CAP_PROP_FRAME_WIDTH))
            height = int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
            total_frames = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))
            
            print(f"Video: {width}x{height}, {total_frames} frames")
            
            # Collect border positions from multiple frames
            all_borders = []
            
            # Sample frames (first, middle, last)
            sample_positions = [0, total_frames // 4, total_frames // 2, 3 * total_frames // 4, total_frames - 1]
            
            for pos in sample_positions:
                cap.set(cv2.CAP_PROP_POS_FRAMES, pos)
                ret, frame = cap.read()
                if not ret:
                    continue
                
                # Convert to grayscale for easier analysis
                gray = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY)
                
                # Find top border
                top = 0
                for y in range(height):
                    # Check if row has significant pixel variation (not solid color)
                    row = gray[y, :]
                    if np.std(row) > 10:  # Significant variation means content
                        top = y
                        break
                
                # Find bottom border
                bottom = height - 1
                for y in range(height - 1, -1, -1):
                    row = gray[y, :]
                    if np.std(row) > 10:
                        bottom = y
                        break
                
                # Find left border
                left = 0
                for x in range(width):
                    col = gray[:, x]
                    if np.std(col) > 10:
                        left = x
                        break
                
                # Find right border
                right = width - 1
                for x in range(width - 1, -1, -1):
                    col = gray[:, x]
                    if np.std(col) > 10:
                        right = x
                        break
                
                all_borders.append((left, top, right, bottom))
                print(f"Frame {pos}: Borders ({left}, {top}, {right}, {bottom})")
            
            cap.release()
            
            if not all_borders:
                print("No content detected")
                return None
            
            # Calculate average borders
            avg_left = int(np.mean([b[0] for b in all_borders]))
            avg_top = int(np.mean([b[1] for b in all_borders]))
            avg_right = int(np.mean([b[2] for b in all_borders]))
            avg_bottom = int(np.mean([b[3] for b in all_borders]))
            
            # Add small margin to avoid cutting content
            margin = 5
            left = max(0, avg_left - margin)
            top = max(0, avg_top - margin)
            right = min(width, avg_right + margin)
            bottom = min(height, avg_bottom + margin)
            
            print(f"\nFinal crop coordinates: ({left}, {top}, {right}, {bottom})")
            print(f"Crop size: {right-left}x{bottom-top}")
            
            return (left, top, right, bottom)

        def crop_video(input_path, output_path, x1, y1, x2, y2):
            """
            Crop video using ffmpeg
            """
            crop_width = x2 - x1
            crop_height = y2 - y1
            
            if crop_width <= 0 or crop_height <= 0:
                print(f"Invalid crop dimensions: {crop_width}x{crop_height}")
                return False
            
            print(f"Cropping to: {crop_width}x{crop_height} at position ({x1}, {y1})")
            
            # Use ffmpeg for high-quality cropping
            cmd = f'ffmpeg -i "{input_path}" -vf "crop={crop_width}:{crop_height}:{x1}:{y1}" -c:a copy "{output_path}" -y'
            
            result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
            
            if result.returncode == 0:
                print(f"Successfully cropped video to {output_path}")
                return True
            else:
                print(f"Error cropping video: {result.stderr}")
                return False

        def main():
            input_file = "igvids.mp4"
            output_file = "output_cropped.mp4"
            
            if not os.path.exists(input_file):
                print(f"Error: Input file {input_file} not found")
                return
            
            print("Starting video border detection...")
            crop_coords = find_video_borders(input_file)
            
            if crop_coords:
                x1, y1, x2, y2 = crop_coords
                success = crop_video(input_file, output_file, x1, y1, x2, y2)
                
                if success:
                    print("Video cropping completed successfully!")
                    print(f"Output: {output_file}")
                else:
                    print("Failed to crop video")
            else:
                print("Could not find video content borders")

        if __name__ == "__main__":
            main()
        EOF
        
    - name: Upload cropped video
      uses: actions/upload-artifact@v4
      with:
        name: cropped-video
        path: output_cropped.mp4
