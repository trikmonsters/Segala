name: Detect and Crop Video Edge with RT-DETR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  detect-and-crop:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsm6 libxext6 libxrender-dev libgomp1
        
    - name: Install Python dependencies
      run: |
        pip install ultralytics opencv-python-headless numpy
        
    - name: Run detection and crop with RT-DETR
      run: |
        python << 'EOF'
        import cv2
        import numpy as np
        from ultralytics import RTDETR
        import os
        import subprocess

        def detect_video_content_with_rtdetr(input_path, output_path):
            """
            Detect video content using RT-DETR and crop exactly to content boundaries
            """
            # Load RT-DETR model (more accurate for boundary detection)
            model = RTDETR('rtdetr-l.pt')  # Using large model for best accuracy
            
            # Open video
            cap = cv2.VideoCapture(input_path)
            
            if not cap.isOpened():
                print(f"Error: Could not open video {input_path}")
                return False
            
            # Get video properties
            width = int(cap.get(cv2.CAP_PROP_FRAME_WIDTH))
            height = int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
            total_frames = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))
            fps = int(cap.get(cv2.CAP_PROP_FPS))
            
            print(f"Video: {width}x{height}, {fps} FPS, {total_frames} frames")
            
            # Collect detection boxes from multiple frames
            all_boxes = []
            confidence_threshold = 0.3  # Lower threshold to catch more objects
            
            # Sample frames evenly throughout video
            sample_frames = min(15, total_frames)
            frame_step = max(1, total_frames // sample_frames)
            
            for frame_num in range(0, total_frames, frame_step):
                cap.set(cv2.CAP_PROP_POS_FRAMES, frame_num)
                ret, frame = cap.read()
                if not ret:
                    continue
                
                # Detect with RT-DETR
                results = model(frame, conf=confidence_threshold)
                
                if len(results) > 0 and len(results[0].boxes) > 0:
                    boxes = results[0].boxes.xyxy.cpu().numpy()
                    confidences = results[0].boxes.conf.cpu().numpy()
                    
                    # Filter by confidence
                    high_conf_boxes = boxes[confidences > 0.5]
                    
                    if len(high_conf_boxes) > 0:
                        # Find the largest detection (likely the main video content)
                        areas = (high_conf_boxes[:, 2] - high_conf_boxes[:, 0]) * \
                               (high_conf_boxes[:, 3] - high_conf_boxes[:, 1])
                        largest_box = high_conf_boxes[np.argmax(areas)]
                        
                        x1, y1, x2, y2 = largest_box
                        all_boxes.append((int(x1), int(y1), int(x2), int(y2)))
                        print(f"Frame {frame_num}: Detected ({x1:.0f}, {y1:.0f}, {x2:.0f}, {y2:.0f})")
            
            cap.release()
            
            if not all_boxes:
                print("No content detected with RT-DETR. Using full frame.")
                return crop_video(input_path, output_path, 0, 0, width, height)
            
            # Calculate average crop coordinates
            avg_x1 = int(np.mean([b[0] for b in all_boxes]))
            avg_y1 = int(np.mean([b[1] for b in all_boxes]))
            avg_x2 = int(np.mean([b[2] for b in all_boxes]))
            avg_y2 = int(np.mean([b[3] for b in all_boxes]))
            
            # Calculate standard deviation to check consistency
            std_x1 = np.std([b[0] for b in all_boxes])
            std_y1 = np.std([b[1] for b in all_boxes])
            std_x2 = np.std([b[2] for b in all_boxes])
            std_y2 = np.std([b[3] for b in all_boxes])
            
            print(f"\nAverage detection: ({avg_x1}, {avg_y1}) to ({avg_x2}, {avg_y2})")
            print(f"Standard deviations: x1={std_x1:.1f}, y1={std_y1:.1f}, x2={std_x2:.1f}, y2={std_y2:.1f}")
            
            # If detections are consistent (low std dev), use exact coordinates
            if std_x1 < 50 and std_y1 < 50 and std_x2 < 50 and std_y2 < 50:
                print("Detections are consistent. Using exact coordinates.")
                x1, y1, x2, y2 = avg_x1, avg_y1, avg_x2, avg_y2
            else:
                # If inconsistent, find the smallest bounding box that contains all detections
                print("Detections vary. Using union of all detections.")
                x1 = min([b[0] for b in all_boxes])
                y1 = min([b[1] for b in all_boxes])
                x2 = max([b[2] for b in all_boxes])
                y2 = max([b[3] for b in all_boxes])
            
            # Ensure coordinates are within frame bounds
            x1 = max(0, min(width, x1))
            y1 = max(0, min(height, y1))
            x2 = max(0, min(width, x2))
            y2 = max(0, min(height, y2))
            
            print(f"\nFinal crop coordinates: ({x1}, {y1}) to ({x2}, {y2})")
            print(f"Crop size: {x2-x1}x{y2-y1}")
            
            # Crop the video
            return crop_video(input_path, output_path, x1, y1, x2, y2)

        def crop_video(input_path, output_path, x1, y1, x2, y2):
            """
            Crop video using ffmpeg
            """
            crop_width = x2 - x1
            crop_height = y2 - y1
            
            if crop_width <= 0 or crop_height <= 0:
                print(f"Invalid crop dimensions: {crop_width}x{crop_height}")
                return False
            
            print(f"Cropping to: {crop_width}x{crop_height} at position ({x1}, {y1})")
            
            cmd = f'ffmpeg -i "{input_path}" -vf "crop={crop_width}:{crop_height}:{x1}:{y1}" -c:a copy "{output_path}" -y'
            
            result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
            
            if result.returncode == 0:
                print(f"Successfully cropped video to {output_path}")
                return True
            else:
                print(f"Error cropping video: {result.stderr}")
                return False

        def main():
            input_file = "igvids.mp4"
            output_file = "output_cropped.mp4"
            
            if not os.path.exists(input_file):
                print(f"Error: Input file {input_file} not found")
                return
            
            print("Using RT-DETR for video content detection...")
            success = detect_video_content_with_rtdetr(input_file, output_file)
            
            if success:
                print("Video cropping completed successfully!")
                print(f"Output: {output_file}")
            else:
                print("Failed to crop video")

        if __name__ == "__main__":
            main()
        EOF
        
    - name: Upload cropped video
      uses: actions/upload-artifact@v4
      with:
        name: cropped-video
        path: output_cropped.mp4
        
    - name: Check file existence
      run: |
        echo "Output files:"
        ls -la *.mp4 || echo "No MP4 files found"
        echo "Current directory:"
        ls -la
