name: Detect and Crop Video Edge

on:
  workflow_dispatch:

jobs:
  detect-and-crop:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsm6 libxext6 libxrender-dev libgomp1
        
    - name: Install Python dependencies
      run: |
        pip install ultralytics opencv-python-headless numpy
        
    - name: Run detection and crop
      run: |
        python << 'EOF'
        import cv2
        import numpy as np
        from ultralytics import YOLO
        import os
        import subprocess

        def detect_video_edge_and_crop(input_path, output_path, model='yolov8n.pt'):
            """
            Detect video content edges and crop only the video portion
            NO PADDING - Exact crop based on detection
            """
            # Load YOLO model
            model = YOLO(model)
            
            # Open video
            cap = cv2.VideoCapture(input_path)
            
            if not cap.isOpened():
                print(f"Error: Could not open video {input_path}")
                return False
            
            # Get video properties
            width = int(cap.get(cv2.CAP_PROP_FRAME_WIDTH))
            height = int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
            total_frames = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))
            
            print(f"Video info: {width}x{height}, {total_frames} frames")
            
            # Collect crop coordinates from multiple frames
            crop_coords_list = []
            
            # Sample frames to find consistent video area
            frame_count = 0
            sample_frames = min(30, total_frames)
            
            while frame_count < sample_frames:
                ret, frame = cap.read()
                if not ret:
                    break
                
                # Detect objects in frame
                results = model(frame)
                
                if len(results) > 0 and len(results[0].boxes) > 0:
                    boxes = results[0].boxes.xyxy.cpu().numpy()
                    
                    # Get the largest detection (likely the main video content)
                    if len(boxes) > 0:
                        areas = (boxes[:, 2] - boxes[:, 0]) * (boxes[:, 3] - boxes[:, 1])
                        largest_box = boxes[np.argmax(areas)]
                        
                        x1, y1, x2, y2 = largest_box
                        crop_coords_list.append((int(x1), int(y1), int(x2), int(y2)))
                
                frame_count += 1
            
            cap.release()
            
            if not crop_coords_list:
                print("No objects detected. Using fallback edge detection.")
                return detect_edge_fallback(input_path, output_path)
            
            # Calculate average crop coordinates
            avg_x1 = int(np.mean([c[0] for c in crop_coords_list]))
            avg_y1 = int(np.mean([c[1] for c in crop_coords_list]))
            avg_x2 = int(np.mean([c[2] for c in crop_coords_list]))
            avg_y2 = int(np.mean([c[3] for c in crop_coords_list]))
            
            # NO PADDING - Exact crop coordinates
            x1 = avg_x1
            y1 = avg_y1
            x2 = avg_x2
            y2 = avg_y2
            
            print(f"Detected video area (EXACT): ({x1}, {y1}) to ({x2}, {y2})")
            
            # Crop the video
            return crop_video(input_path, output_path, x1, y1, x2, y2)

        def detect_edge_fallback(input_path, output_path):
            """
            Fallback method: Use edge detection to find content boundaries
            NO PADDING - Exact crop based on detection
            """
            cap = cv2.VideoCapture(input_path)
            
            # Sample frames for edge detection
            edges_list = []
            
            for _ in range(10):
                ret, frame = cap.read()
                if not ret:
                    break
                
                # Convert to grayscale
                gray = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY)
                
                # Apply Gaussian blur
                blurred = cv2.GaussianBlur(gray, (5, 5), 0)
                
                # Detect edges
                edges = cv2.Canny(blurred, 50, 150)
                
                # Find non-zero points
                points = cv2.findNonZero(edges)
                if points is not None:
                    x, y, w, h = cv2.boundingRect(points)
                    edges_list.append((x, y, x + w, y + h))
            
            cap.release()
            
            if not edges_list:
                print("Could not detect edges. Using full video.")
                return False
            
            # Average the edge detection results
            avg_x1 = int(np.mean([e[0] for e in edges_list]))
            avg_y1 = int(np.mean([e[1] for e in edges_list]))
            avg_x2 = int(np.mean([e[2] for e in edges_list]))
            avg_y2 = int(np.mean([e[3] for e in edges_list]))
            
            # NO PADDING - Exact crop coordinates
            x1 = avg_x1
            y1 = avg_y1
            x2 = avg_x2
            y2 = avg_y2
            
            print(f"Edge detection found area (EXACT): ({x1}, {y1}) to ({x2}, {y2})")
            
            return crop_video(input_path, output_path, x1, y1, x2, y2)

        def crop_video(input_path, output_path, x1, y1, x2, y2):
            """
            Crop video using ffmpeg for better quality
            """
            crop_width = x2 - x1
            crop_height = y2 - y1
            
            if crop_width <= 0 or crop_height <= 0:
                print(f"Invalid crop dimensions: {crop_width}x{crop_height}")
                return False
            
            print(f"Cropping to: {crop_width}x{crop_height} at position ({x1}, {y1})")
            
            # Use ffmpeg for high-quality cropping
            cmd = f'ffmpeg -i "{input_path}" -vf "crop={crop_width}:{crop_height}:{x1}:{y1}" -c:a copy "{output_path}" -y'
            
            result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
            
            if result.returncode == 0:
                print(f"Successfully cropped video to {output_path}")
                return True
            else:
                print(f"Error cropping video: {result.stderr}")
                return False

        def main():
            input_file = "igvids.mp4"
            output_file = "output_cropped.mp4"
            
            if not os.path.exists(input_file):
                print(f"Error: Input file {input_file} not found")
                return
            
            print(f"Processing video: {input_file}")
            
            # Try YOLO detection first
            success = detect_video_edge_and_crop(input_file, output_file)
            
            if success:
                print("Video cropping completed successfully!")
                print(f"Output: {output_file}")
            else:
                print("Failed to crop video")
                # Try with a different YOLO model
                print("Retrying with YOLOv8m model...")
                success = detect_video_edge_and_crop(input_file, output_file, model='yolov8m.pt')
                
                if success:
                    print("Video cropping completed successfully with YOLOv8m!")
                else:
                    print("Failed to crop video with all methods")
                    # Try with edge detection only
                    print("Retrying with edge detection only...")
                    success = detect_edge_fallback(input_file, output_file)
                    
                    if success:
                        print("Video cropping completed successfully with edge detection!")
                    else:
                        print("Failed to crop video with all methods")

        if __name__ == "__main__":
            main()
        EOF
        
    - name: Upload cropped video
      uses: actions/upload-artifact@v4
      with:
        name: cropped-video
        path: output_cropped.mp4
        
    - name: Check file existence
      run: |
        echo "Checking output files:"
        ls -la *.mp4 || echo "No MP4 files found"
