name: Dola AI Video Generation with Botright Captcha Solver

on:
  workflow_dispatch:

permissions:
  contents: write   # wajib agar softprops/action-gh-release bisa membuat release

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Botright + Playwright + OpenCV
        run: |
          pip install botright playwright opencv-python-headless numpy
          playwright install chromium
          playwright install-deps chromium

      - name: Setup WireGuard Config
        run: |
          sudo mkdir -p /etc/wireguard
          echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Connect to ProtonVPN
        run: |
          sudo wg-quick up wg0
          echo "✅ VPN terhubung"
          curl -s ifconfig.me

      - name: Generate AI Video on Dola
        env:
          DOLA_COOKIES: ${{ secrets.DOLA_COOKIES }}
        run: python dola_bot.py

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 2>/dev/null || true

      - name: Upload Result to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dola-video-${{ github.run_number }}
          name: "Dola AI Video #${{ github.run_number }}"
          body_path: result_status.txt
          files: |
            dola_video_result.png
            dola_debug.png
            captcha_try*.png
            result.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Result Status
        if: always()
        run: cat result_status.txt 2>/dev/null || echo "Status file tidak ditemukan"
