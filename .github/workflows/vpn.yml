name: dola.com Screenshot - VPN + Playwright Only

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf

      - name: Setup WireGuard Config
        run: |
          sudo mkdir -p /etc/wireguard
          echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Connect to ProtonVPN
        run: |
          sudo wg-quick up wg0
          echo "✅ VPN terhubung"
          curl -s ifconfig.me

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Screenshot dola.com
        run: |
          python - <<'PYEOF'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  # 使用普通 Chromium，无任何 stealth 修改
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page()

                  print("[+] Membuka https://dola.com...")
                  response = await page.goto("https://dola.com", wait_until="domcontentloaded", timeout=60000)

                  status = response.status if response else 'No response'
                  print(f"[+] HTTP Status: {status}")

                  await page.wait_for_timeout(5000)

                  # 截图
                  await page.screenshot(path="dola_screenshot.png", full_page=True)
                  print("[+] Screenshot saved")

                  # 检测是否被屏蔽
                  title = await page.title()
                  content = await page.content()
                  print(f"[+] Title: {title}")

                  blocked_kw = ["access denied", "blocked", "cloudflare", "captcha", "forbidden", "403", "just a moment"]
                  is_blocked = any(kw in title.lower() or kw in content.lower() for kw in blocked_kw)

                  with open("block_status.txt", "w") as f:
                      f.write(f"status={'BLOCKED' if is_blocked else 'OK'}\n")
                      f.write(f"title={title}\n")
                      f.write(f"http_status={status}\n")

                  if is_blocked:
                      print("[!] KEMUNGKINAN MASIH TERBLOCK")
                  else:
                      print("[✓] Halaman terlihat NORMAL")

                  await browser.close()

          asyncio.run(main())
          PYEOF

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 2>/dev/null || true

      - name: Upload Screenshot to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dola-playwright-${{ github.run_number }}
          name: "dola.com Playwright #${{ github.run_number }}"
          body_path: block_status.txt
          files: dola_screenshot.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
