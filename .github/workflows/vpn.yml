name: Dola AI Beauty Affiliate Video (Patchright + ddddocr)

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: "Nama/deskripsi produk (kosongkan = produk di gambar referensi)"
        required: false
        default: ""
      style_notes:
        description: "Arahan tambahan (opsional), mis. 'bathroom setting, pink palette'"
        required: false
        default: ""
      send_rules:
        description: "Kirim prompt aturan dulu (anti-konfirmasi / OVERLOAD)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cek gambar referensi produk
        run: |
          if [ ! -f produk.png ]; then
            echo "::error::produk.png tidak ditemukan di root repo"
            exit 1
          fi
          ls -la produk.png

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf xvfb

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install patchright ddddocr opencv-python-headless numpy 2>&1 | tee install.log
          patchright install chromium --with-deps 2>&1 | tee -a install.log

      - name: Setup WireGuard Config
        run: |
          sudo mkdir -p /etc/wireguard
          echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Connect to ProtonVPN
        run: |
          sudo wg-quick up wg0
          echo "VPN terhubung, IP:"
          curl -s ifconfig.me

      - name: Generate AI video on Dola
        env:
          DOLA_COOKIES: ${{ secrets.DOLA_COOKIES }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          STYLE_NOTES: ${{ inputs.style_notes }}
          SEND_RULES: ${{ inputs.send_rules && '1' || '0' }}
          PRODUCT_IMAGE: produk.png
          MAX_ATTEMPTS: "3"
        run: |
          cat > dola_bot.py <<'PYEOF'
          import asyncio
          import base64
          import json
          import os
          import random
          import traceback

          import cv2
          import numpy as np
          from patchright.async_api import async_playwright

          TARGET_URL = "https://www.dola.com/chat"
          IMAGE_PATH = os.path.abspath(os.environ.get("PRODUCT_IMAGE", "produk.png"))
          PRODUCT_NAME = os.environ.get("PRODUCT_NAME", "").strip() or "the beauty product in the reference image"
          STYLE_NOTES = os.environ.get("STYLE_NOTES", "").strip()

          SENT_OVERLOAD = "VIDEO_OVERLOAD"
          SENT_READY = "RULES_READY"
          # Pesan overload dari Dola sendiri (bukan dari AI)
          DEMAND_PATTERNS = ["high demand", "try again later", "experiencing high"]
          MAX_ATTEMPTS = int(os.environ.get("MAX_ATTEMPTS", "3"))
          SEND_RULES = os.environ.get("SEND_RULES", "1") == "1"
          MAX_CAPTCHA_TRIES = 5
          VIDEO_TIMEOUT_S = 600       # batas tunggu per percobaan (generate biasanya 2-5 menit)
          POLL_S = 10
          STABLE_S = 90               # halaman diam selama ini TANPA proses generate = hanya teks
          BACKOFF_S = [60, 180, 300]  # jeda sebelum kirim ulang saat overload

          NET_VIDEOS = []             # URL video yang terlihat di jaringan (berurutan)

          # --------------------------------------------------------------------------
          # Log ringkas
          # --------------------------------------------------------------------------
          def log(msg=""):
              print(msg, flush=True)


          def step(msg):
              log(f"\n▶ {msg}")


          def ok(msg):
              log(f"  ✓ {msg}")


          def warn(msg):
              log(f"  ! {msg}")


          def info(msg):
              log(f"  · {msg}")


          # --------------------------------------------------------------------------
          # PROMPT
          # --------------------------------------------------------------------------
          RULES_PROMPT = (
              "RULES for this whole chat. Follow them for every message from now on.\n"
              "1) When I ask for a video, generate it immediately with your video generation "
              "tool and attach the finished video file in your reply.\n"
              "2) When I attach a product image, treat it as the exact visual reference of the "
              "product and keep the product identical in the video.\n"
              "3) Never ask me questions, never ask for confirmation, never offer options or "
              "alternatives. If something is unspecified, choose a sensible default yourself.\n"
              "4) Never answer with only a script, storyboard, description or apology instead "
              "of the video.\n"
              "5) If you cannot produce the video for any reason (tool busy, queue full, rate "
              f"limit, quota, error), reply with exactly this one word and nothing else: {SENT_OVERLOAD}\n"
              "6) Never say the video is ready unless the video file is actually attached.\n"
              f"To confirm you understood, reply with exactly: {SENT_READY}"
          )

          VIDEO_BRIEF = (
              f"Create a premium 15-second vertical (9:16) UGC-style beauty ad video for TikTok/Reels "
              f"featuring {PRODUCT_NAME}, exactly as shown in the attached reference image.\n\n"
              "PRODUCT FIDELITY (highest priority): reproduce the product from the reference image "
              "exactly: same shape, proportions, color, cap or pump, packaging and label layout. "
              "Do not redesign, recolor or invent any text. Keep the label sharp, legible and "
              "unaltered. The product must be clearly visible in most shots.\n\n"
              "TALENT & SETTING: one natural-looking woman with realistic skin texture (visible pores, "
              "no plastic or over-smoothed skin), clean minimal vanity or bathroom-shelf background, "
              "soft neutral tones, tidy and aspirational.\n\n"
              "SHOT LIST:\n"
              "0-2s HOOK: close-up of her hand picking up the product and turning it to camera, "
              "then a quick glance and a soft smile at the lens.\n"
              "2-6s APPLICATION: macro of the texture, then smooth, realistic application on cheek "
              "or hand.\n"
              "6-11s RESULT: soft glowing skin in natural light, gentle head turn, relaxed "
              "satisfied expression, macro of skin detail.\n"
              "11-15s HERO: she holds the product beside her face with the label facing the camera, "
              "slow push-in, ends on a clean stable hero frame of the product.\n\n"
              "STYLE: natural window light, warm soft highlights, shallow depth of field, "
              "handheld smartphone feel with gentle stabilization, smooth continuous motion, "
              "consistent lighting and exposure, high-end beauty commercial look, sharp 4K detail.\n\n"
              "AUDIO: soft upbeat lo-fi background music, no speech. No captions, subtitles, "
              "watermarks or logos other than the product's own label.\n\n"
              "COMPLIANCE: no medical or miracle claims, no exaggerated before/after, "
              "only believable everyday results.\n\n"
              "AVOID: distorted hands or extra fingers, warped or morphing packaging, garbled text, "
              "flicker, sudden cuts, uncanny face."
          )
          if STYLE_NOTES:
              VIDEO_BRIEF += f"\n\nEXTRA DIRECTION: {STYLE_NOTES}"

          GENERATE_PROMPT = (
              "Generate this video now and attach the video file in this reply. "
              "No questions, no confirmation. "
              f"If you cannot, reply with exactly: {SENT_OVERLOAD}\n\n" + VIDEO_BRIEF
          )
          NUDGE_PROMPT = (
              "Do not ask or explain anything. Generate the video now and attach the video file. "
              f"If you cannot, reply with exactly: {SENT_OVERLOAD}"
          )


          # --------------------------------------------------------------------------
          # Cookie & captcha
          # --------------------------------------------------------------------------
          def load_cookies():
              raw = os.environ.get("DOLA_COOKIES", "").strip()
              if not raw:
                  return []
              out = []
              for c in json.loads(raw):
                  if "name" not in c or "value" not in c:
                      continue
                  ck = {
                      "name": c["name"],
                      "value": c["value"],
                      "domain": c.get("domain", ".dola.com"),
                      "path": c.get("path", "/"),
                  }
                  ss = str(c.get("sameSite", "")).capitalize()
                  if ss in ("Strict", "Lax", "None"):
                      ck["sameSite"] = ss
                  exp = c.get("expires", c.get("expirationDate"))
                  if isinstance(exp, (int, float)) and exp > 0:
                      ck["expires"] = exp
                  if c.get("secure") is not None:
                      ck["secure"] = bool(c["secure"])
                  if c.get("httpOnly") is not None:
                      ck["httpOnly"] = bool(c["httpOnly"])
                  out.append(ck)
              return out


          _slide_det = None


          def get_slide_det():
              """Dimuat hanya saat captcha muncul (menghindari log onnxruntime yang berisik)."""
              global _slide_det
              if _slide_det is None:
                  import ddddocr
                  _slide_det = ddddocr.DdddOcr(det=False, ocr=False, show_ad=False)
              return _slide_det


          async def captcha_visible(page):
              for ctx in [page] + list(page.frames):
                  try:
                      if await ctx.locator("text=Verify to continue").count() > 0:
                          return True
                  except Exception:
                      pass
              return False


          async def fetch_bytes(page, src):
              if src.startswith("data:"):
                  return base64.b64decode(src.split(",", 1)[1])
              resp = await page.context.request.get(src)
              return await resp.body()


          def gap_x_ddddocr(piece_bytes, bg_bytes):
              res = get_slide_det().slide_match(piece_bytes, bg_bytes, simple_target=True)
              return res["target"][0]


          def gap_x_opencv(piece_bytes, bg_bytes):
              bg = cv2.imdecode(np.frombuffer(bg_bytes, np.uint8), cv2.IMREAD_COLOR)
              pc = cv2.imdecode(np.frombuffer(piece_bytes, np.uint8), cv2.IMREAD_UNCHANGED)
              if pc.ndim == 3 and pc.shape[2] == 4:
                  ys, xs = np.where(pc[:, :, 3] > 20)
                  if len(xs):
                      pc = pc[ys.min():ys.max() + 1, xs.min():xs.max() + 1]
                  pc = cv2.cvtColor(pc[:, :, :3], cv2.COLOR_BGR2GRAY)
              elif pc.ndim == 3:
                  pc = cv2.cvtColor(pc, cv2.COLOR_BGR2GRAY)
              res = cv2.matchTemplate(
                  cv2.Canny(cv2.cvtColor(bg, cv2.COLOR_BGR2GRAY), 100, 200),
                  cv2.Canny(pc, 100, 200),
                  cv2.TM_CCOEFF_NORMED,
              )
              return cv2.minMaxLoc(res)[3][0]


          async def solve_slider_once(page):
              ctx = None
              for c in [page] + list(page.frames):
                  try:
                      if await c.locator("[class*='captcha' i] img").count() >= 2:
                          ctx = c
                          break
                  except Exception:
                      pass
              if ctx is None:
                  warn("gambar captcha tidak ditemukan (cek selector)")
                  return False

              imgs = ctx.locator("[class*='captcha' i] img")
              items = []
              for i in range(await imgs.count()):
                  el = imgs.nth(i)
                  box = await el.bounding_box()
                  src = await el.get_attribute("src")
                  if box and src and box["width"] > 5:
                      items.append((box["width"] * box["height"], box, src))
              if len(items) < 2:
                  warn("gambar captcha kurang dari 2")
                  return False
              items.sort(key=lambda t: t[0], reverse=True)
              _, bg_box, bg_src = items[0]
              _, pc_box, pc_src = items[-1]

              bg_bytes = await fetch_bytes(page, bg_src)
              pc_bytes = await fetch_bytes(page, pc_src)
              bg_w = cv2.imdecode(np.frombuffer(bg_bytes, np.uint8), cv2.IMREAD_COLOR).shape[1]

              try:
                  gx, how = gap_x_ddddocr(pc_bytes, bg_bytes), "ddddocr"
              except Exception:
                  gx, how = gap_x_opencv(pc_bytes, bg_bytes), "opencv"

              scale = bg_box["width"] / bg_w
              distance = gx * scale - (pc_box["x"] - bg_box["x"])
              info(f"slider ({how}): geser {distance:.0f}px")

              handle = ctx.locator(
                  "[class*='captcha' i] [class*='slider' i], "
                  "[class*='captcha' i] [class*='drag' i], "
                  "[class*='captcha' i] [class*='knob' i]"
              ).last
              hb = await handle.bounding_box()
              if not hb:
                  warn("handle slider tidak ditemukan")
                  return False

              x0, y0 = hb["x"] + hb["width"] / 2, hb["y"] + hb["height"] / 2
              await page.mouse.move(x0 - 40, y0 + 25, steps=10)
              await page.mouse.move(x0, y0, steps=8)
              await page.wait_for_timeout(random.randint(250, 600))
              await page.mouse.down()
              steps = random.randint(28, 45)
              for i in range(1, steps + 1):
                  t = i / steps
                  ease = 1 - (1 - t) ** 3
                  await page.mouse.move(
                      x0 + distance * ease + random.uniform(-0.6, 0.6),
                      y0 + random.uniform(-1.5, 1.5),
                  )
                  await page.wait_for_timeout(random.randint(8, 30))
              await page.mouse.move(x0 + distance + random.uniform(2, 4), y0)
              await page.wait_for_timeout(random.randint(60, 140))
              await page.mouse.move(x0 + distance, y0)
              await page.wait_for_timeout(random.randint(120, 260))
              await page.mouse.up()
              await page.wait_for_timeout(2500)
              return not await captcha_visible(page)


          async def handle_captcha(page):
              for attempt in range(1, MAX_CAPTCHA_TRIES + 1):
                  if not await captcha_visible(page):
                      return True
                  info(f"captcha terdeteksi (percobaan {attempt}/{MAX_CAPTCHA_TRIES})")
                  await page.screenshot(path=f"captcha_try{attempt}.png")
                  try:
                      if await solve_slider_once(page):
                          ok("captcha lolos")
                          return True
                  except Exception as e:
                      warn(f"captcha error: {type(e).__name__}: {str(e)[:100]}")
                  for ctx in [page] + list(page.frames):
                      try:
                          r = ctx.locator("[class*='refresh' i]").first
                          if await r.count():
                              await r.click(timeout=2000)
                              break
                      except Exception:
                          pass
                  await page.wait_for_timeout(2000)
              return not await captcha_visible(page)


          # --------------------------------------------------------------------------
          # Upload gambar (copy + Ctrl+V)
          # --------------------------------------------------------------------------
          ATTACH_SIGNAL_JS = """() => document.querySelectorAll(
              "img, canvas, video, [class*='attach' i], [class*='preview' i], [class*='thumb' i], [class*='file' i]"
          ).length"""

          UPLOADING_JS = """() => [...document.querySelectorAll(
              "[class*='uploading' i], [class*='progress' i], [role='progressbar']"
          )].filter(e => e.offsetParent !== null).length"""

          CLIPBOARD_WRITE_JS = """async (b64) => {
              const bin = atob(b64); const arr = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
              const blob = new Blob([arr], {type: 'image/png'});
              await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
              return true;
          }"""

          SYNTH_PASTE_JS = """(b64) => {
              const bin = atob(b64); const arr = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
              const file = new File([arr], 'produk.png', {type: 'image/png'});
              const dt = new DataTransfer(); dt.items.add(file);
              const t = document.activeElement || document.querySelector('[contenteditable=true],textarea');
              t.dispatchEvent(new ClipboardEvent('paste', {clipboardData: dt, bubbles: true, cancelable: true}));
              return true;
          }"""


          def image_png_b64(path):
              data = open(path, "rb").read()
              if os.path.splitext(path)[1].lower() != ".png":
                  im = cv2.imdecode(np.frombuffer(data, np.uint8), cv2.IMREAD_COLOR)
                  data = cv2.imencode(".png", im)[1].tobytes()
              return base64.b64encode(data).decode()


          async def attach_signal(page):
              try:
                  return await page.evaluate(ATTACH_SIGNAL_JS)
              except Exception:
                  return 0


          async def wait_upload_done(page, max_s=40):
              await page.wait_for_timeout(6000)
              waited = 6
              while waited < max_s:
                  try:
                      n = await page.evaluate(UPLOADING_JS)
                  except Exception:
                      n = 0
                  if n == 0:
                      break
                  await page.wait_for_timeout(2000)
                  waited += 2
              ok(f"gambar ter-upload ({waited}s)")


          async def attach_image(page, path):
              if not os.path.exists(path):
                  warn(f"file gambar tidak ada: {path}")
                  return False
              b64 = image_png_b64(path)
              before = await attach_signal(page)

              try:  # cara 1: clipboard asli + Ctrl+V
                  await page.evaluate(CLIPBOARD_WRITE_JS, b64)
                  await page.keyboard.press("Control+V")
                  await page.wait_for_timeout(5000)
                  if await attach_signal(page) > before:
                      await wait_upload_done(page)
                      return True
                  info("Ctrl+V tidak terdeteksi, coba paste sintetis")
              except Exception as e:
                  info(f"clipboard gagal: {str(e)[:100]}")

              try:  # cara 2: event paste sintetis
                  await page.evaluate(SYNTH_PASTE_JS, b64)
                  await page.wait_for_timeout(5000)
                  if await attach_signal(page) > before:
                      await wait_upload_done(page)
                      return True
                  info("paste sintetis tidak terdeteksi, coba menu upload")
              except Exception as e:
                  info(f"paste sintetis gagal: {str(e)[:100]}")

              try:  # cara 3: menu "+" -> Upload File or Image
                  item = page.get_by_text("Upload File or Image", exact=False)
                  if await item.count() == 0:
                      plus = page.locator("div[contenteditable='true'], textarea").first.locator(
                          "xpath=ancestor::*[.//button][1]"
                      ).locator("button").first
                      await plus.click(timeout=3000)
                      await page.wait_for_timeout(800)
                  async with page.expect_file_chooser(timeout=6000) as fc_info:
                      await page.get_by_text("Upload File or Image", exact=False).first.click()
                  chooser = await fc_info.value
                  await chooser.set_files(path)
                  await wait_upload_done(page)
                  return True
              except Exception as e:
                  warn(f"menu upload gagal: {str(e)[:100]}")
                  try:
                      await page.keyboard.press("Escape")
                  except Exception:
                      pass
              return False


          async def dump_ui(page):
              try:
                  rows = await page.evaluate("""() => [...document.querySelectorAll('button,input,[role=button]')]
                      .slice(0, 40).map(e => [e.tagName, e.type || '', e.getAttribute('aria-label') || '',
                      (e.className && e.className.toString().slice(0, 50)) || '',
                      (e.innerText || '').slice(0, 20)].join(' | '))""")
                  info("elemen interaktif:\n      " + "\n      ".join(rows))
              except Exception as e:
                  info(f"dump UI gagal: {e}")


          async def send_message(page, text, image=None):
              for sel in ("textarea", "div[contenteditable='true']"):
                  loc = page.locator(sel)
                  if await loc.count() == 0:
                      continue
                  el = loc.first
                  await el.click()
                  await el.fill(text)
                  await page.wait_for_timeout(500)
                  if image:
                      await el.focus()
                      if not await attach_image(page, image):
                          await page.screenshot(path="attach_failed.png", full_page=True)
                          await dump_ui(page)
                          return False
                      await page.screenshot(path="after_attach.png")
                      await el.focus()
                  await page.wait_for_timeout(1000)
                  await page.keyboard.press("Enter")
                  return True
              await page.screenshot(path="dola_debug.png", full_page=True)
              await dump_ui(page)
              return False


          async def dismiss_banners(page):
              for name in ("OK", "Accept", "Got it", "Agree"):
                  try:
                      btn = page.get_by_role("button", name=name, exact=True)
                      if await btn.count() > 0:
                          await btn.first.click(timeout=2000)
                          info(f"banner ditutup ({name})")
                          await page.wait_for_timeout(500)
                          return
                  except Exception:
                      pass


          # --------------------------------------------------------------------------
          # Deteksi respons chat (teks / sedang generate / video / overload)
          # --------------------------------------------------------------------------
          BIGIMG_JS = """() => [...document.querySelectorAll('img')]
              .filter(i => i.naturalWidth >= 200 && i.offsetParent !== null).length"""

          VIDEO_SRC_JS = """() => [...document.querySelectorAll('video')].map(v =>
              v.currentSrc || v.src || (v.querySelector('source') && v.querySelector('source').src) || '')"""

          VIDEO_HTML_JS = """() => [...document.querySelectorAll('video')].slice(-3)
              .map(v => v.outerHTML.slice(0, 220))"""

          LAST_BIGIMG_POS_JS = """() => {
              const imgs = [...document.querySelectorAll('img')]
                  .filter(i => i.naturalWidth >= 200 && i.offsetParent !== null);
              const e = imgs[imgs.length - 1];
              if (!e) return null;
              e.scrollIntoView({block: 'center'});
              const r = e.getBoundingClientRect();
              return {x: r.x + r.width / 2, y: r.y + r.height / 2};
          }"""


          async def body_text(page):
              try:
                  return await page.evaluate("document.body.innerText")
              except Exception:
                  return ""


          def overload_score(text):
              low = text.lower()
              return text.count(SENT_OVERLOAD) + sum(low.count(p) for p in DEMAND_PATTERNS)


          async def snapshot(page):
              text = await body_text(page)
              try:
                  vids = await page.evaluate(VIDEO_SRC_JS)
              except Exception:
                  vids = []
              try:
                  big = await page.evaluate(BIGIMG_JS)
              except Exception:
                  big = 0
              urls = []
              for u in [v for v in vids if v] + NET_VIDEOS:
                  if u not in urls:
                      urls.append(u)
              return {
                  "text": text, "vcount": len(vids), "urls": urls, "big": big,
                  "overload": overload_score(text),
                  "generating": "generating" in text.lower(),
              }


          async def wait_idle_after_rules(page, base_ready, max_s=240):
              elapsed, stable, seen = 0, 0, False
              last = await body_text(page)
              while elapsed < max_s:
                  await page.wait_for_timeout(5000)
                  elapsed += 5
                  text = await body_text(page)
                  if text.count(SENT_READY) > base_ready:
                      seen = True
                  stable = stable + 5 if text == last else 0
                  last = text
                  if seen and stable >= 10:
                      ok("aturan diterima AI")
                      return
                  if stable >= 45:
                      warn("tidak ada RULES_READY, lanjut saja")
                      return
              warn("batas waktu menunggu aturan, lanjut saja")


          async def wait_reply(page, base, limit_s):
              """Return (state, snapshot). state: video | video_poster | overload |
              done_no_media | text_only | timeout"""
              elapsed = stable = finished_for = last_print = 0
              seen_gen = False
              last_text = base["text"]
              s = base
              while elapsed < limit_s:
                  await page.wait_for_timeout(POLL_S * 1000)
                  elapsed += POLL_S
                  if await captcha_visible(page):
                      await handle_captcha(page)
                  s = await snapshot(page)

                  if [u for u in s["urls"] if u not in base["urls"]] or s["vcount"] > base["vcount"]:
                      return "video", s
                  if s["overload"] > base["overload"]:
                      return "overload", s

                  if s["generating"]:
                      if not seen_gen:
                          info(f"Dola mulai generate video ({elapsed}s)")
                      seen_gen, stable, finished_for = True, 0, 0
                  else:
                      stable = stable + POLL_S if s["text"] == last_text else 0
                      if seen_gen:
                          finished_for += POLL_S
                  last_text = s["text"]

                  if seen_gen and not s["generating"]:
                      if s["big"] > base["big"] and finished_for >= 10:
                          return "video_poster", s
                      if finished_for >= 60:
                          return "done_no_media", s
                  elif not seen_gen and stable >= STABLE_S:
                      return "text_only", s

                  if elapsed - last_print >= 30:
                      last_print = elapsed
                      label = "generate video" if s["generating"] else (
                          "menunggu balasan" if not seen_gen else "generate selesai, cari video")
                      info(f"{elapsed}s · {label}")
              return "timeout", s


          # --------------------------------------------------------------------------
          # Ambil video
          # --------------------------------------------------------------------------
          async def describe_media(page, snap, base):
              new = [u for u in snap["urls"] if u not in base["urls"]]
              info(f"elemen <video>: {snap['vcount']} | gambar besar baru: {snap['big'] - base['big']} | URL baru: {len(new)}")
              for u in new[-3:]:
                  info("url: " + u[:120])
              try:
                  for h in await page.evaluate(VIDEO_HTML_JS):
                      info("html: " + h)
              except Exception:
                  pass


          async def activate_media(page):
              """Klik gambar hasil terakhir supaya player memuat video (memicu request jaringan)."""
              try:
                  pos = await page.evaluate(LAST_BIGIMG_POS_JS)
                  if pos:
                      await page.mouse.move(pos["x"], pos["y"])
                      await page.wait_for_timeout(500)
                      await page.mouse.click(pos["x"], pos["y"])
                      await page.wait_for_timeout(6000)
              except Exception as e:
                  info(f"aktivasi media gagal: {str(e)[:80]}")


          async def save_video(context, page, src):
              if not src:
                  return False
              try:
                  if src.startswith("blob:"):
                      b64 = await page.evaluate(
                          """async (u) => { const r = await fetch(u); const b = await r.blob();
                          return await new Promise(res => { const f = new FileReader();
                          f.onload = () => res(f.result.split(',')[1]); f.readAsDataURL(b); }); }""",
                          src,
                      )
                      data = base64.b64decode(b64)
                  else:
                      data = await (await context.request.get(src)).body()
                  if len(data) < 10_000:
                      warn(f"file terlalu kecil ({len(data)} B), kemungkinan bukan video")
                      return False
                  with open("result.mp4", "wb") as f:
                      f.write(data)
                  ok(f"video disimpan: result.mp4 ({len(data) // 1024} KB)")
                  return True
              except Exception as e:
                  warn(f"gagal unduh video: {str(e)[:120]}")
                  return False


          def on_response(resp):
              try:
                  url = resp.url
                  ct = resp.headers.get("content-type", "")
                  if (ct.startswith("video/") or ".mp4" in url.split("?")[0]) and url not in NET_VIDEOS:
                      NET_VIDEOS.append(url)
              except Exception:
                  pass


          # --------------------------------------------------------------------------
          # Main
          # --------------------------------------------------------------------------
          async def main():
              status = {"captcha_solved": "NO", "video_found": "NO", "video_saved": "NO",
                        "error": "NO", "attempts": "0", "final_state": "none"}
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=False, args=["--no-sandbox", "--disable-dev-shm-usage"]
                  )
                  context = await browser.new_context(
                      viewport={"width": 1366, "height": 768}, locale="en-US"
                  )
                  try:
                      await context.grant_permissions(
                          ["clipboard-read", "clipboard-write"], origin="https://www.dola.com"
                      )
                  except Exception:
                      pass
                  page = await context.new_page()
                  page.on("response", on_response)
                  try:
                      step("Buka Dola")
                      cookies = load_cookies()
                      if cookies:
                          await context.add_cookies(cookies)
                          info(f"{len(cookies)} cookie dipasang")
                      resp = await page.goto(TARGET_URL, wait_until="domcontentloaded", timeout=60000)
                      info(f"HTTP {resp.status if resp else '-'}")
                      await page.wait_for_timeout(8000)
                      status["captcha_solved"] = "YES" if await handle_captcha(page) else "NO"
                      await page.wait_for_timeout(3000)
                      await dismiss_banners(page)
                      await page.screenshot(path="start_page.png")

                      if SEND_RULES:
                          step("Prompt 1: aturan chat")
                          if not await send_message(page, RULES_PROMPT):
                              warn("gagal mengirim prompt aturan")
                              status["error"] = "YES"
                              return
                          await page.wait_for_timeout(4000)
                          base_ready = (await body_text(page)).count(SENT_READY)
                          await wait_idle_after_rules(page, base_ready)

                      info("jeda 3 detik")
                      await page.wait_for_timeout(3000)

                      prompt, use_image, nudges = GENERATE_PROMPT, True, 0
                      state, snap, base = "none", None, None
                      for attempt in range(1, MAX_ATTEMPTS + 1):
                          status["attempts"] = str(attempt)
                          step(f"Prompt 2: generate video (percobaan {attempt}/{MAX_ATTEMPTS})")
                          if not await send_message(page, prompt, IMAGE_PATH if use_image else None):
                              warn("gagal mengirim prompt (lihat attach_failed.png)")
                              status["error"] = "YES"
                              break
                          ok("prompt terkirim")
                          await page.wait_for_timeout(4000)
                          base = await snapshot(page)

                          state, snap = await wait_reply(page, base, VIDEO_TIMEOUT_S)
                          (ok if state.startswith("video") else warn)(f"hasil: {state}")
                          await page.screenshot(path=f"attempt{attempt}_{state}.png", full_page=True)
                          with open("dola_text.txt", "a") as f:
                              f.write(f"\n===== attempt {attempt} / {state} =====\n")
                              f.write(snap["text"][-4000:])

                          if state in ("video", "video_poster", "done_no_media", "timeout"):
                              break
                          if state == "overload":
                              wait_s = BACKOFF_S[min(attempt - 1, len(BACKOFF_S) - 1)]
                              info(f"Dola overload, tunggu {wait_s}s lalu kirim ulang")
                              await page.wait_for_timeout(wait_s * 1000)
                              prompt, use_image = GENERATE_PROMPT, True
                          elif state == "text_only":
                              if nudges >= 1:
                                  warn("sudah di-nudge sekali, berhenti")
                                  break
                              nudges += 1
                              info("AI hanya membalas teks, kirim nudge")
                              prompt, use_image = NUDGE_PROMPT, False
                      status["final_state"] = state

                      if state in ("video", "video_poster", "done_no_media"):
                          step("Ambil video")
                          status["video_found"] = "YES" if state != "done_no_media" else "UNSURE"
                          await describe_media(page, snap, base)
                          new = [u for u in snap["urls"] if u not in base["urls"]]
                          if not new:
                              info("belum ada URL video, coba klik hasil untuk memuat player")
                              await activate_media(page)
                              snap = await snapshot(page)
                              await describe_media(page, snap, base)
                              new = [u for u in snap["urls"] if u not in base["urls"]]
                          web = [u for u in new if not u.startswith("blob:")]
                          src = (web or new or [None])[-1]
                          if await save_video(context, page, src):
                              status["video_saved"] = "YES"
                          else:
                              warn("video terdeteksi tapi belum bisa diunduh, cek screenshot & log di atas")

                      await page.screenshot(path="dola_video_result.png", full_page=True)
                  except Exception:
                      warn("error fatal:\n" + traceback.format_exc())
                      status["error"] = "YES"
                      try:
                          await page.screenshot(path="dola_debug.png", full_page=True)
                      except Exception:
                          pass
                  finally:
                      with open("result_status.txt", "w") as f:
                          f.write(f"target_url={TARGET_URL}\n")
                          for k, v in status.items():
                              f.write(f"{k}={v}\n")
                      log("\n══ RINGKASAN ══")
                      for k, v in status.items():
                          log(f"  {k:15s}: {v}")
                      await browser.close()


          asyncio.run(main())
          PYEOF
          xvfb-run -a python -u dola_bot.py 2>&1 | tee dola.log

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 2>/dev/null || true

      - name: Upload logs & screenshots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dola-debug-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            install.log
            dola.log
            dola_text.txt
            result_status.txt
            *.png
            result.mp4

      - name: Upload Result to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dola-video-${{ github.run_number }}
          name: "Dola Beauty Video #${{ github.run_number }}"
          body_path: result_status.txt
          files: |
            result.mp4
            dola_video_result.png
            dola_debug.png
            attach_failed.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Result Status
        if: always()
        run: cat result_status.txt 2>/dev/null || echo "Status file tidak ditemukan"
