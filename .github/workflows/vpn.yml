name: Dola AI Video Generation (Patchright + ddddocr)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf xvfb

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install patchright ddddocr opencv-python-headless numpy 2>&1 | tee install.log
          patchright install chromium --with-deps 2>&1 | tee -a install.log

      - name: Setup WireGuard Config
        run: |
          sudo mkdir -p /etc/wireguard
          echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Connect to ProtonVPN
        run: |
          sudo wg-quick up wg0
          echo "VPN terhubung, IP:"
          curl -s ifconfig.me

      - name: Generate AI Video on Dola
        env:
          DOLA_COOKIES: ${{ secrets.DOLA_COOKIES }}
        run: xvfb-run -a python -u dola_bot.py 2>&1 | tee dola.log

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 2>/dev/null || true

      # Log tetap bisa diunduh walau tampilan log GitHub bermasalah
      - name: Upload logs & screenshots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dola-debug-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            install.log
            dola.log
            result_status.txt
            *.png
            result.mp4

      - name: Upload Result to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dola-video-${{ github.run_number }}
          name: "Dola AI Video #${{ github.run_number }}"
          body_path: result_status.txt
          files: |
            dola_video_result.png
            dola_debug.png
            captcha_try*.png
            result.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Result Status
        if: always()
        run: cat result_status.txt 2>/dev/null || echo "Status file tidak ditemukan"
