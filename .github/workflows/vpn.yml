name: dola.com Screenshot with Cookie Login (Fixed)

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================
      # FASE 1: INSTALL SEMUA DULU
      # ============================================

      - name: Install WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      # ============================================
      # FASE 2: CONNECT VPN
      # ============================================

      - name: Setup WireGuard Config
        run: |
          sudo mkdir -p /etc/wireguard
          echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Connect to ProtonVPN
        run: |
          sudo wg-quick up wg0
          echo "✅ VPN terhubung"
          curl -s ifconfig.me

      # ============================================
      # FASE 3: PLAYWRIGHT + COOKIE LOGIN
      # ============================================

      - name: Screenshot dola.com with Cookie
        env:
          DOLA_COOKIES: ${{ secrets.DOLA_COOKIES }}
        run: |
          python - <<'PYEOF'
          import asyncio
          import json
          import os
          from playwright.async_api import async_playwright

          async def main():
              raw_cookies = os.environ.get("DOLA_COOKIES", "").strip()
              if not raw_cookies:
                  print("[!] DOLA_COOKIES kosong")
                  cookies = []
              else:
                  try:
                      cookies = json.loads(raw_cookies)
                      print(f"[+] Berhasil parse {len(cookies)} cookie")
                  except json.JSONDecodeError as e:
                      print(f"[!] Gagal parse JSON: {e}")
                      cookies = []

              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      viewport={"width": 1280, "height": 720},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                                 "AppleWebKit/537.36 (KHTML, like Gecko) "
                                 "Chrome/120.0.0.0 Safari/537.36"
                  )

                  # 1. Inject cookie SEBELUM navigasi
                  if cookies:
                      normalized = []
                      for c in cookies:
                          if "name" in c and "value" in c:
                              cookie = {
                                  "name": c["name"],
                                  "value": c["value"],
                                  "domain": c.get("domain", ".dola.com"),
                                  "path": c.get("path", "/"),
                              }
                              if c.get("sameSite") in ("Strict", "Lax", "None"):
                                  cookie["sameSite"] = c["sameSite"]
                              if "expires" in c and isinstance(c["expires"], (int, float)):
                                  cookie["expires"] = c["expires"]
                              if c.get("secure") is not None:
                                  cookie["secure"] = c["secure"]
                              if c.get("httpOnly") is not None:
                                  cookie["httpOnly"] = c["httpOnly"]
                              normalized.append(cookie)

                      await context.add_cookies(normalized)
                      print(f"[+] {len(normalized)} cookie disuntikkan")
                      # Print nama cookie untuk debug (tanpa value)
                      print(f"[+] Nama cookie: {[c['name'] for c in normalized]}")

                  page = await context.new_page()

                  # 2. Buka dola.com
                  print("[+] Membuka https://dola.com...")
                  response = await page.goto(
                      "https://dola.com",
                      wait_until="domcontentloaded",
                      timeout=60000
                  )
                  status = response.status if response else 'No response'
                  print(f"[+] HTTP Status: {status}")

                  # 3. JEDA 15 DETIK - biarkan session ter-load penuh
                  print("[+] Menunggu 15 detik agar session ter-load...")
                  await page.wait_for_timeout(15000)

                  # 4. Tunggu network idle (semua request selesai)
                  try:
                      await page.wait_for_load_state("networkidle", timeout=30000)
                      print("[+] Network idle tercapai")
                  except Exception as e:
                      print(f"[!] Network idle timeout: {e}")

                  # 5. Screenshot
                  await page.screenshot(path="dola_screenshot.png", full_page=True)
                  print("[+] Screenshot disimpan")

                  # 6. Deteksi login yang BENAR
                  title = await page.title()
                  content = await page.content()
                  print(f"[+] Title: {title}")

                  # Cek apakah tombol "Log In" MASIH ada di halaman
                  # Jika ada, berarti BELUM login
                  has_login_button = await page.locator("text=Log In").count() > 0

                  # Cek elemen yang menandakan sudah login
                  # (avatar, menu profil, tombol logout, dll)
                  logged_in_indicators = [
                      "[data-testid*='avatar']",
                      "[class*='avatar']",
                      "text=Log out",
                      "text=Sign out",
                      "text=Settings",
                      "text=My Account"
                  ]
                  logged_in_signals = 0
                  for sel in logged_in_indicators:
                      try:
                          cnt = await page.locator(sel).count()
                          if cnt > 0:
                              logged_in_signals += cnt
                      except Exception:
                          pass

                  # Logika final
                  if has_login_button:
                      actually_logged_in = False
                      print("[!] Tombol 'Log In' MASIH terlihat → BELUM login")
                  elif logged_in_signals > 0:
                      actually_logged_in = True
                      print(f"[✓] Ditemukan {logged_in_signals} indikator login")
                  else:
                      actually_logged_in = False
                      print("[?] Tidak ada tombol Log In, tapi tidak ada indikator login jelas")

                  # Deteksi blokir wilayah
                  blocked_kw = [
                      "not available in this country",
                      "access denied",
                      "captcha",
                      "just a moment"
                  ]
                  is_blocked = any(
                      kw in title.lower() or kw in content.lower()
                      for kw in blocked_kw
                  )

                  with open("block_status.txt", "w") as f:
                      f.write(f"status={'BLOCKED' if is_blocked else 'OK'}\n")
                      f.write(f"logged_in={'YES' if actually_logged_in else 'NO'}\n")
                      f.write(f"login_button_visible={'YES' if has_login_button else 'NO'}\n")
                      f.write(f"title={title}\n")
                      f.write(f"http_status={status}\n")

                  if is_blocked:
                      print("[!] TERBLOCK WILAYAH")
                  elif actually_logged_in:
                      print("[✓] SUKSES: sudah login")
                  else:
                      print("[!] GAGAL: belum login, cookie tidak valid / expired")

                  await browser.close()

          asyncio.run(main())
          PYEOF

      # ============================================
      # FASE 4: CLEANUP & UPLOAD
      # ============================================

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 2>/dev/null || true

      - name: Upload Screenshot to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dola-cookie-${{ github.run_number }}
          name: "dola.com Cookie Test #${{ github.run_number }}"
          body_path: block_status.txt
          files: dola_screenshot.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Status
        if: always()
        run: cat block_status.txt
