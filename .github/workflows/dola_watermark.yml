name: Remove Watermark (Manual Coords)

on:
  workflow_dispatch:
    inputs:
      x: { description: 'X', required: true, default: '560' }
      y: { description: 'Y', required: true, default: '1220' }
      w: { description: 'W', required: true, default: '155' }
      h: { description: 'H', required: true, default: '55' }

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Remove watermark
        run: |
          ffmpeg -y -i vid_water.mp4 \
            -vf "delogo=x=${{ inputs.x }}:y=${{ inputs.y }}:w=${{ inputs.w }}:h=${{ inputs.h }}" \
            -c:v libx264 -crf 18 -preset medium \
            -c:a copy -movflags +faststart \
            vid_water_clean.mp4
          ls -lh vid_water_clean.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: cleaned-video
          path: vid_water_clean.mp4
          retention-days: 7
