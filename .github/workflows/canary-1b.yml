name: Auto Subtitle (Canary-1B-v2, word-by-word SRT)

# Generates a word-by-word .srt subtitle file from an audio/video file
# using NVIDIA's Canary-1b-v2 ASR model (word-level timestamps).
#
# HOW TO USE:
#   1. Put your audio/video file in the repo (any format ffmpeg can read:
#      wav, mp3, mp4, m4a, etc.), e.g. media/input.mp4
#   2. Go to Actions -> "Auto Subtitle (Canary-1B-v2, word-by-word SRT)" -> Run workflow
#   3. Fill in the input file path (and language if not English)
#   4. Download the generated .srt from the workflow's Artifacts section
#
# NOTE: Canary-1b-v2 is a ~1B parameter model. GitHub-hosted "ubuntu-latest"
# runners are CPU-only, so inference will be slow (fine for short clips,
# but for long audio consider pointing `runs-on` at a self-hosted GPU runner).

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "Path (in repo) to the audio/video file to transcribe"
        required: true
        default: "example-tts-v2.wav"
      source_lang:
        description: "Language of the audio (en, de, es, fr)"
        required: false
        default: "en"
      output_name:
        description: "Filename for the generated SRT"
        required: false
        default: "subtitle.srt"

jobs:
  generate-subtitle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies (ffmpeg, libsndfile)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-canary-${{ hashFiles('**/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-canary-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # main branch of NeMo is required for Canary-1b-v2 word-level timestamps
          pip install "nemo_toolkit[asr] @ git+https://github.com/NVIDIA/NeMo.git@main"
          pip install soundfile

      - name: Convert input to 16kHz mono WAV
        run: |
          mkdir -p work
          ffmpeg -y -i "${{ inputs.input_file }}" -ar 16000 -ac 1 -c:a pcm_s16le work/audio_16k.wav

      - name: Write transcription script
        run: |
          cat << 'PYEOF' > work/transcribe.py
          import sys
          import soundfile as sf
          import nemo.collections.asr as nemo_asr

          SOURCE_LANG = sys.argv[1]
          OUT_SRT = sys.argv[2]
          WAV_PATH = "work/audio_16k.wav"

          def fmt_ts(seconds: float) -> str:
              """Convert seconds -> SRT timestamp HH:MM:SS,mmm"""
              if seconds < 0:
                  seconds = 0
              ms_total = round(seconds * 1000)
              hh, rem = divmod(ms_total, 3_600_000)
              mm, rem = divmod(rem, 60_000)
              ss, ms = divmod(rem, 1000)
              return f"{hh:02d}:{mm:02d}:{ss:02d},{ms:03d}"

          print("Loading nvidia/canary-1b-v2 ...")
          asr_model = nemo_asr.models.ASRModel.from_pretrained("nvidia/canary-1b-v2")

          print("Transcribing with word-level timestamps ...")
          output = asr_model.transcribe(
              [WAV_PATH],
              source_lang=SOURCE_LANG,
              target_lang=SOURCE_LANG,  # ASR (transcription), not translation
              timestamps=True,
          )

          word_stamps = output[0].timestamp["word"]

          if not word_stamps:
              raise RuntimeError("No words were transcribed - check the input audio.")

          with open(OUT_SRT, "w", encoding="utf-8") as f:
              for i, w in enumerate(word_stamps, start=1):
                  start = fmt_ts(w["start"])
                  end = fmt_ts(w["end"])
                  word = w.get("word", w.get("char", "")).strip()
                  f.write(f"{i}\n{start} --> {end}\n{word}\n\n")

          print(f"Wrote {len(word_stamps)} word-level subtitle entries to {OUT_SRT}")
          PYEOF

      - name: Run transcription (Canary-1b-v2)
        run: |
          python work/transcribe.py "${{ inputs.source_lang }}" "${{ inputs.output_name }}"

      - name: Upload SRT artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-by-word-srt
          path: ${{ inputs.output_name }}
          if-no-files-found: error
