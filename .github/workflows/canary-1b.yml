name: Canary-1B-v2 Transcribe with Timestamps Test

on:
  workflow_dispatch:

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install PyTorch CPU + NeMo
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://pytorch.org
          pip install "nemo_toolkit[asr] @ git+https://github.com"
          pip install soundfile librosa

      - name: Convert audio to mono 16kHz
        run: |
          ffmpeg -y -i example-tts-v2.wav -ar 16000 -ac 1 -c:a pcm_s16le example-tts-v2-mono.wav
          ls -lh example-tts-v2-mono.wav

      - name: Transcribe
        run: |
          python - << 'EOF'
          import torch
          from nemo.collections.asr.models import EncDecMultiTaskModel
          import os

          audio_path = "example-tts-v2-mono.wav"

          if not os.path.exists(audio_path):
              print(f"File {audio_path} tidak ditemukan!")
              exit(1)

          print("Loading Canary-1B-v2 on CPU...")
          # Menggunakan EncDecMultiTaskModel bawaan NeMo ASR untuk Canary-1B-v2
          model = EncDecMultiTaskModel.from_pretrained("nvidia/canary-1b-v2")
          model = model.to(torch.device("cpu")).eval()

          # Mengatur parameter decoding (Bahasa sumber & target harus ditentukan)
          # Ganti "en" sesuai bahasa audio Anda jika bukan bahasa Inggris (cth: "es", "de", "fr")
          decode_cfg = model.cfg.decoding
          decode_cfg.beam.beam_size = 1
          
          # Aktifkan timestamps (Kemampuan deteksi segmen / kata)
          decode_cfg.timestamps = True 

          print(f"\nTranscribing: {audio_path}")
          try:
              # Jalankan inferensi dengan konfigurasi multi-task Canary
              res = model.transcribe(
                  paths2audio_files=[audio_path],
                  batch_size=1,
                  return_hypotheses=True,
                  override_config=decode_cfg
              )
              
              # Mengambil hasil transkrip teks murni dan detail timestamps-nya
              hypothesis = res[0]
              text_output = hypothesis.text if hasattr(hypothesis, 'text') else str(hypothesis)
              
              print("\n========== TRANSCRIPT ==========")
              print(text_output)
              print("================================")

              # Menampilkan informasi penanda waktu kata (jika tersedia dari objek hipotesis)
              print("\n========== TIMESTAMPS DETAIL ==========")
              if hasattr(hypothesis, 'timestep') and hypothesis.timestep is not None:
                  print(f"Detail Timestamps Semantik: {hypothesis.timestep}")
              else:
                  print("Catatan: Untuk ekstraksi Word-Level Timestamps penuh yang presisi tinggi,")
                  print("disarankan menggunakan library pendukung 'NeMo Forced Aligner (NFA)'.")
              print("=======================================")

              with open("transcript.txt", "w", encoding="utf-8") as f:
                  f.write(text_output)
              print("\nHasil disimpan ke transcript.txt")

          except Exception as e:
              print(f"Error saat transcribe: {e}")
              raise
          EOF

      - name: Upload transcript
        uses: actions/upload-artifact@v4
        with:
          name: transcript
          path: transcript.txt
