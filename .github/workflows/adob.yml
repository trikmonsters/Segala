name: Adobe Stock Contributor - Upload Video (secret.mp4)

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check video file
        run: |
          if [ ! -f secret.mp4 ]; then
            echo "❌ secret.mp4 tidak ditemukan di root repo"; exit 1
          fi
          ls -la secret.mp4
          echo "--- ffprobe (hanya info, tidak menggagalkan job) ---"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate:format=duration,size \
            -of default=nw=1 secret.mp4 || echo "ffprobe tidak tersedia / gagal baca"

      - name: Upload video to Adobe Stock
        env:
          ADOBE_COOKIE: ${{ secrets.ADOBE_COOKIE }}
        run: |
          mkdir -p shots
          cat > upload.py << 'PYEOF'
          import asyncio, os, json, base64, sys, time
          from playwright.async_api import async_playwright

          VIDEO = "secret.mp4"
          UPLOADS_URL = "https://contributor.stock.adobe.com/en/uploads"
          FAILURE_URL = "https://contributor.stock.adobe.com/en/uploads/logs/failure"
          SHOTS = "shots"
          WAIT_UPLOAD_SECONDS = 600  # video besar butuh waktu

          def log(m): print(f"[UPLOAD] {m}", flush=True)

          # ---------------- Cookie parser ----------------
          def parse_cookies(raw):
              raw = raw.strip()
              try:
                  dec = base64.b64decode(raw).decode("utf-8", errors="ignore")
                  if dec.strip().startswith("[") or dec.strip().startswith("{"):
                      raw = dec
              except Exception:
                  pass
              out = []
              if raw.startswith("[") or raw.startswith("{"):
                  data = json.loads(raw)
                  if isinstance(data, dict):
                      data = [data]
                  for c in data:
                      if not c.get("name") or not c.get("domain"):
                          continue
                      it = {"name": c["name"], "value": c.get("value", ""),
                            "domain": c["domain"], "path": c.get("path", "/")}
                      ss = c.get("sameSite")
                      it["sameSite"] = ss if ss in ("Strict", "Lax", "None") else "Lax"
                      if "expirationDate" in c:
                          it["expires"] = int(c["expirationDate"])
                      elif c.get("expires") not in (-1, None):
                          it["expires"] = int(c["expires"])
                      if "secure" in c:
                          it["secure"] = bool(c["secure"])
                      if "httpOnly" in c:
                          it["httpOnly"] = bool(c["httpOnly"])
                      out.append(it)
                  return out
              # Format Netscape cookies.txt
              for ln in raw.splitlines():
                  ln = ln.strip()
                  if not ln or ln.startswith("#"):
                      continue
                  p = ln.split("\t")
                  if len(p) != 7:
                      continue
                  d, _, pa, se, ex, n, v = p
                  it = {"name": n, "value": v, "domain": d, "path": pa,
                        "secure": se.upper() == "TRUE", "sameSite": "Lax"}
                  try:
                      e = int(ex)
                      if e > 0:
                          it["expires"] = e
                  except Exception:
                      pass
                  out.append(it)
              return out

          # ---------------- Helpers ----------------
          async def shot(page, name, full=False):
              try:
                  await page.screenshot(path=os.path.join(SHOTS, f"{name}.png"),
                                        full_page=full)
                  html = await page.content()
                  with open(os.path.join(SHOTS, f"{name}.html"), "w",
                            encoding="utf-8") as f:
                      f.write(html)
                  log(f"📸 {name}")
              except Exception as e:
                  log(f"❌ shot {name}: {e}")

          async def open_uploads_page(page):
              log("Buka halaman uploads...")
              await page.goto(UPLOADS_URL, wait_until="domcontentloaded")
              try:
                  await page.wait_for_load_state("networkidle", timeout=30000)
              except Exception:
                  log("networkidle timeout (lanjut)")
              await shot(page, "01_uploads")

              if "/signin" in page.url or "auth.services.adobe.com" in page.url:
                  log("❌ Cookie tidak valid / expired (redirect ke sign-in)")
                  return False

              try:
                  await page.wait_for_selector(
                      '[data-t="submit-moderation-button"]',
                      state="attached", timeout=45000)
                  log("✅ Halaman uploads siap")
              except Exception:
                  log("❌ Halaman tidak render (blank / diblokir?)")
                  await shot(page, "02_not_ready", full=True)
                  return False

              # Tutup banner kalau ada
              try:
                  await page.keyboard.press("Escape")
              except Exception:
                  pass
              return True

          async def is_uploaded(page):
              try:
                  txt = (await page.locator(
                      '[data-t="submit-moderation-button"]').inner_text()).strip().lower()
                  if txt and not txt.startswith("submit 0"):
                      return True
              except Exception:
                  pass
              try:
                  n = await page.locator(
                      '[data-t="assets-content-grid"] > *').count()
                  if n > 0:
                      return True
              except Exception:
                  pass
              return False

          async def wait_result(page, label):
              start = time.time()
              last_shot = 0
              while time.time() - start < WAIT_UPLOAD_SECONDS:
                  if await is_uploaded(page):
                      log(f"✅ [{label}] File terdeteksi di UI")
                      return True
                  elapsed = int(time.time() - start)
                  if elapsed - last_shot >= 60:
                      last_shot = elapsed
                      log(f"  ...menunggu ({elapsed}s)")
                      await shot(page, f"progress_{label}_{elapsed}s")
                  await page.wait_for_timeout(3000)
              log(f"⚠️ [{label}] Tidak ada perubahan setelah {WAIT_UPLOAD_SECONDS}s")
              return False

          # ---------------- Strategi upload ----------------
          async def upload_file(page, path):
              # Strategi A: isi input[type=file] tersembunyi langsung
              log("[A] set_input_files ke input tersembunyi...")
              try:
                  await page.wait_for_selector('input[type="file"]',
                                               state="attached", timeout=15000)
                  fi = page.locator('input[type="file"]').first
                  await fi.set_input_files(path, timeout=120000)
                  log("  file di-set, menunggu proses...")
                  await shot(page, "10_A_setelah_set")
                  if await wait_result(page, "A"):
                      return True
              except Exception as e:
                  log(f"  A gagal: {e}")

              # Strategi B: klik Upload -> (Browse) -> file chooser
              log("[B] Klik tombol Upload + file chooser...")
              try:
                  btn = page.locator('button:has-text("Upload")').first
                  box = await btn.bounding_box()
                  if box:
                      await page.mouse.move(box["x"] + box["width"] / 2,
                                            box["y"] + box["height"] / 2, steps=10)
                  async with page.expect_file_chooser(timeout=15000) as fc:
                      await btn.click()
                      try:
                          await page.get_by_role("button", name="Browse").first.click(
                              timeout=4000, force=True)
                      except Exception:
                          pass
                  chooser = await fc.value
                  await chooser.set_files(path)
                  await shot(page, "11_B_setelah_chooser")
                  if await wait_result(page, "B"):
                      return True
              except Exception as e:
                  log(f"  B gagal: {e}")

              return False

          # ---------------- Main ----------------
          async def main():
              if not os.path.isfile(VIDEO):
                  log(f"❌ {VIDEO} tidak ada")
                  return False
              log(f"Video: {VIDEO} ({os.path.getsize(VIDEO)/1024/1024:.1f} MB)")

              cookies = parse_cookies(os.environ["ADOBE_COOKIE"])
              log(f"Loaded {len(cookies)} cookies")

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox",
                            "--disable-blink-features=AutomationControlled",
                            "--disable-dev-shm-usage"])
                  context = await browser.new_context(
                      user_agent=("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                                  "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"),
                      viewport={"width": 1366, "height": 900},
                      locale="en-US")
                  await context.add_cookies(cookies)
                  await context.add_init_script("""
                      Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
                      window.chrome = {runtime: {}};
                  """)

                  page = await context.new_page()

                  # Log request upload untuk debug
                  def on_response(r):
                      try:
                          u = r.url.lower()
                          if r.request.method in ("POST", "PUT") and any(
                                  k in u for k in ("upload", "ingest", "contributor", "s3")):
                              log(f"🌐 {r.request.method} {r.status} {r.url[:110]}")
                      except Exception:
                          pass
                  page.on("response", on_response)

                  ok = False
                  if await open_uploads_page(page):
                      ok = await upload_file(page, VIDEO)

                  log(f"HASIL UPLOAD: {ok}")
                  await page.wait_for_timeout(5000)
                  await shot(page, "20_final", full=True)

                  if not ok:
                      try:
                          await page.goto(FAILURE_URL, wait_until="domcontentloaded")
                          await page.wait_for_timeout(5000)
                          await shot(page, "21_upload_issues")
                      except Exception as e:
                          log(f"gagal buka upload issues: {e}")

                  try:
                      await browser.close()
                  except Exception:
                      pass
                  return ok

          if __name__ == "__main__":
              sys.exit(0 if asyncio.run(main()) else 1)
          PYEOF

          python upload.py

      - name: Upload Screenshots + HTML to Release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -d shots ] || [ -z "$(ls -A shots 2>/dev/null)" ]; then
            echo "Tidak ada file, skip."; exit 0
          fi

          OLD=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases?per_page=100" \
            | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              for r in data:
                  if r.get('tag_name','').startswith('adobe-upload-'):
                      print(r['id'])
          except: pass
          ")
          for id in $OLD; do
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$id" > /dev/null
          done

          TAG="adobe-upload-$(date +%Y%m%d_%H%M%S)"
          RESP=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Adobe Upload $TAG\",\"body\":\"Step screenshots + HTML\"}")

          UPLOAD_URL=$(echo "$RESP" | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['upload_url'].replace('{?name,label}',''))")

          for f in shots/*; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f")
            case "$NAME" in
              *.png) CT="image/png" ;;
              *.html) CT="text/html" ;;
              *) CT="application/octet-stream" ;;
            esac
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: $CT" \
              --data-binary @"$f" \
              "$UPLOAD_URL?name=$NAME" > /dev/null
            echo "Uploaded: $NAME"
          done

          echo "✅ Release: $TAG"
