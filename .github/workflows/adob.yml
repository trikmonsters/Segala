name: Adobe Stock Contributor - Visit with Cookie (Tilion)

on:
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright tilion
          # Playwright chromium sebagai fallback kalau Fortress gagal start
          playwright install --with-deps chromium

      - name: Start Fortress & Visit Adobe
        env:
          ADOBE_COOKIE: ${{ secrets.ADOBE_COOKIE }}
        run: |
          cat > visit.py << 'EOF'
          import asyncio
          import os
          import json
          import base64
          import traceback
          from playwright.async_api import async_playwright

          def parse_cookies(raw):
              raw = raw.strip()
              try:
                  decoded = base64.b64decode(raw).decode("utf-8", errors="ignore")
                  if decoded.strip().startswith("[") or decoded.strip().startswith("{"):
                      raw = decoded
              except Exception:
                  pass

              if raw.startswith("[") or raw.startswith("{"):
                  data = json.loads(raw)
                  if isinstance(data, dict):
                      data = [data]
                  out = []
                  for c in data:
                      if not c.get("name"):
                          continue
                      item = {
                          "name": c.get("name"),
                          "value": c.get("value"),
                          "domain": c.get("domain"),
                          "path": c.get("path", "/"),
                      }
                      ss = c.get("sameSite")
                      item["sameSite"] = ss if ss in ("Strict", "Lax", "None") else "Lax"
                      if "expirationDate" in c:
                          item["expires"] = int(c["expirationDate"])
                      elif "expires" in c and c["expires"] not in (-1, None):
                          item["expires"] = int(c["expires"])
                      if "secure" in c:
                          item["secure"] = bool(c["secure"])
                      if "httpOnly" in c:
                          item["httpOnly"] = bool(c["httpOnly"])
                      out.append(item)
                  return out

              cookies = []
              for line in raw.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  parts = line.split("\t")
                  if len(parts) != 7:
                      continue
                  domain, _, path, secure, expires, name, value = parts
                  item = {
                      "name": name, "value": value,
                      "domain": domain, "path": path,
                      "secure": secure.upper() == "TRUE",
                      "sameSite": "Lax",
                  }
                  try:
                      exp = int(expires)
                      if exp > 0:
                          item["expires"] = exp
                  except ValueError:
                      pass
                  cookies.append(item)
              return cookies

          def start_fortress():
              """Coba start Tilion Fortress, return cdp_url atau None."""
              try:
                  from tilion import Tilion
                  fortress = Tilion()
                  # Tilion biasanya expose .cdp_url atau .ws_endpoint
                  cdp = getattr(fortress, "cdp_url", None) or \
                        getattr(fortress, "ws_endpoint", None)
                  print(f"[Tilion] Fortress CDP: {cdp}")
                  return fortress, cdp
              except Exception as e:
                  print(f"[Tilion] Gagal start Fortress: {e}")
                  traceback.print_exc()
                  return None, None

          async def main():
              raw = os.environ["ADOBE_COOKIE"]
              cookies = parse_cookies(raw)
              print(f"[Cookie] Loaded {len(cookies)} cookies")

              fortress, cdp = start_fortress()

              async with async_playwright() as p:
                  if cdp:
                      print(f"[Browser] Connect over CDP: {cdp}")
                      browser = await p.chromium.connect_over_cdp(cdp)
                      context = await browser.new_context()
                  else:
                      print("[Browser] Fallback: Playwright chromium launch")
                      browser = await p.chromium.launch(
                          headless=True,
                          args=["--no-sandbox",
                                "--disable-blink-features=AutomationControlled"],
                      )
                      context = await browser.new_context(
                          user_agent=("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                                      "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"),
                          viewport={"width": 1366, "height": 900},
                          locale="en-US",
                      )

                  await context.add_cookies(cookies)

                  page = await context.new_page()
                  await page.goto(
                      "https://contributor.stock.adobe.com/en/portfolio",
                      wait_until="domcontentloaded",
                  )
                  await page.wait_for_timeout(6000)

                  print(f"[Result] URL: {page.url}")
                  print(f"[Result] Title: {await page.title()}")

                  await page.screenshot(path="adobe.png", full_page=True)

                  try:
                      await browser.close()
                  except Exception:
                      pass

          if __name__ == "__main__":
              asyncio.run(main())
          EOF

          python visit.py

      - name: Upload Screenshot to Release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f adobe.png ]; then
            echo "Screenshot tidak ada, skip."
            exit 0
          fi

          # Hapus release lama dengan prefix adobe-shot-
          OLD=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases?per_page=100" \
            | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              for r in data:
                  if r.get('tag_name','').startswith('adobe-shot-'):
                      print(r['id'])
          except: pass
          ")
          for id in $OLD; do
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$id" > /dev/null
          done

          TAG="adobe-shot-$(date +%Y%m%d_%H%M%S)"
          RESP=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Adobe Shot $TAG\",\"body\":\"Auto-generated screenshot\"}")

          UPLOAD_URL=$(echo "$RESP" | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['upload_url'].replace('{?name,label}',''))")

          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: image/png" \
            --data-binary @adobe.png \
            "$UPLOAD_URL?name=adobe.png"

          echo "✅ Uploaded to release: $TAG"
