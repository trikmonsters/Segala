name: Adobe Stock Contributor - Upload Video (secret.mp4)

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check video file
        run: |
          test -f secret.mp4 || { echo "❌ secret.mp4 tidak ditemukan di root repo"; exit 1; }
          ls -la secret.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate:format=duration \
            -of default=nw=1 secret.mp4 || true

      - name: Upload video to Adobe Stock
        env:
          ADOBE_COOKIE: ${{ secrets.ADOBE_COOKIE }}
        run: |
          mkdir -p shots
          cat > upload.py << 'PYEOF'
          import asyncio, os, json, base64, sys, time, re
          from playwright.async_api import async_playwright

          VIDEO = "secret.mp4"
          UPLOADS_URL = "https://contributor.stock.adobe.com/en/uploads"
          FAILURE_URL = "https://contributor.stock.adobe.com/en/uploads/logs/failure"
          SHOTS = "shots"

          def log(m): print(f"[UPLOAD] {m}", flush=True)

          # ---------- Cookie parser ----------
          def parse_cookies(raw):
              raw = raw.strip()
              try:
                  dec = base64.b64decode(raw).decode("utf-8", errors="ignore")
                  if dec.strip().startswith(("[", "{")):
                      raw = dec
              except Exception:
                  pass
              out = []
              if raw.startswith(("[", "{")):
                  data = json.loads(raw)
                  if isinstance(data, dict):
                      data = [data]
                  for c in data:
                      if not c.get("name") or not c.get("domain"):
                          continue
                      it = {"name": c["name"], "value": c.get("value", ""),
                            "domain": c["domain"], "path": c.get("path", "/")}
                      ss = c.get("sameSite")
                      it["sameSite"] = ss if ss in ("Strict", "Lax", "None") else "Lax"
                      if "expirationDate" in c:
                          it["expires"] = int(c["expirationDate"])
                      elif c.get("expires") not in (-1, None):
                          it["expires"] = int(c["expires"])
                      if "secure" in c:
                          it["secure"] = bool(c["secure"])
                      if "httpOnly" in c:
                          it["httpOnly"] = bool(c["httpOnly"])
                      out.append(it)
                  return out
              for ln in raw.splitlines():
                  ln = ln.strip()
                  if not ln or ln.startswith("#"):
                      continue
                  p = ln.split("\t")
                  if len(p) != 7:
                      continue
                  d, _, pa, se, ex, n, v = p
                  it = {"name": n, "value": v, "domain": d, "path": pa,
                        "secure": se.upper() == "TRUE", "sameSite": "Lax"}
                  try:
                      e = int(ex)
                      if e > 0:
                          it["expires"] = e
                  except Exception:
                      pass
                  out.append(it)
              return out

          # ---------- Helpers ----------
          async def shot(page, name):
              try:
                  await page.screenshot(path=os.path.join(SHOTS, f"{name}.png"), full_page=True)
                  html = await page.content()
                  with open(os.path.join(SHOTS, f"{name}.html"), "w", encoding="utf-8") as f:
                      f.write(html)
              except Exception:
                  pass

          async def count_items(page):
              n_grid, n_label = 0, 0
              try:
                  n_grid = await page.locator('[data-t="assets-content-grid"] > *').count()
              except Exception:
                  pass
              try:
                  t = await page.locator('[data-t="content-filter-menu"]').first.inner_text(timeout=2000)
                  m = re.search(r"\((\d+)\)", t)
                  if m:
                      n_label = int(m.group(1))
              except Exception:
                  pass
              return max(n_grid, n_label)

          async def stable_count(page, max_wait=30):
              last, same = -1, 0
              for _ in range(max_wait // 2):
                  c = await count_items(page)
                  same = same + 1 if c == last else 0
                  last = c
                  if same >= 2:
                      break
                  await page.wait_for_timeout(2000)
              return last

          async def open_uploads_page(page):
              await page.goto(UPLOADS_URL, wait_until="domcontentloaded")
              try:
                  await page.wait_for_load_state("networkidle", timeout=20000)
              except Exception:
                  pass
              if "/signin" in page.url or "auth.services.adobe.com" in page.url:
                  log("❌ Cookie tidak valid / expired")
                  return False
              try:
                  await page.wait_for_selector('[data-t="submit-moderation-button"]',
                                               state="attached", timeout=45000)
              except Exception:
                  log("❌ Halaman uploads tidak render")
                  await shot(page, "02_not_ready")
                  return False
              try:
                  await page.keyboard.press("Escape")
              except Exception:
                  pass
              return True

          async def upload_once(page, s3, timeout_s):
              baseline = await stable_count(page)
              log(f"Item sebelum upload: {baseline}")
              await shot(page, "01_sebelum_upload")

              # Klik Upload -> overlay -> Browse -> file chooser
              btn = page.locator('button:has-text("Upload")').first
              box = await btn.bounding_box()
              if box:
                  await page.mouse.move(box["x"] + box["width"] / 2,
                                        box["y"] + box["height"] / 2, steps=10)
              await btn.click()
              await page.wait_for_timeout(2000)
              await shot(page, "02_overlay_upload")

              async with page.expect_file_chooser(timeout=15000) as fc:
                  await page.get_by_text("Browse", exact=True).first.click(force=True)
              chooser = await fc.value
              await chooser.set_files(VIDEO)
              log("File dipilih, menunggu muncul di daftar...")

              start = time.time()
              while time.time() - start < timeout_s:
                  c = await count_items(page)
                  if c > baseline:
                      log(f"Item bertambah: {baseline} -> {c}")
                      break
                  await page.wait_for_timeout(3000)
              else:
                  log("❌ Item tidak bertambah")
                  return False

              # Tunggu upload ke S3 benar-benar selesai
              start = time.time()
              while not s3["done"] and time.time() - start < timeout_s:
                  await page.wait_for_timeout(2000)
              log("Upload ke server selesai" if s3["done"] else "⚠️ Konfirmasi upload server tidak terlihat")
              await page.wait_for_timeout(5000)
              return True

          async def main():
              size_mb = os.path.getsize(VIDEO) / 1024 / 1024
              timeout_s = min(600, max(90, int(size_mb * 4)))
              log(f"Video: {VIDEO} ({size_mb:.1f} MB)")

              cookies = parse_cookies(os.environ["ADOBE_COOKIE"])
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-blink-features=AutomationControlled",
                            "--disable-dev-shm-usage"])
                  context = await browser.new_context(
                      user_agent=("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                                  "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"),
                      viewport={"width": 1366, "height": 900}, locale="en-US")
                  await context.add_cookies(cookies)
                  await context.add_init_script("""
                      Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
                      window.chrome = {runtime: {}};
                  """)
                  page = await context.new_page()

                  s3 = {"done": False}
                  def on_response(r):
                      try:
                          if (r.request.method == "POST" and "amazonaws.com" in r.url
                                  and r.status in (200, 201, 204)):
                              s3["done"] = True
                      except Exception:
                          pass
                  page.on("response", on_response)

                  ok = False
                  for attempt in (1, 2):
                      try:
                          if await open_uploads_page(page):
                              ok = await upload_once(page, s3, timeout_s)
                      except Exception as e:
                          log(f"Percobaan {attempt} error: {str(e)[:150]}")
                      if ok:
                          break
                      if attempt == 1:
                          log("Mencoba lagi...")

                  await shot(page, "03_hasil_akhir")
                  if not ok:
                      try:
                          await page.goto(FAILURE_URL, wait_until="domcontentloaded")
                          await page.wait_for_timeout(4000)
                          await shot(page, "04_upload_issues")
                      except Exception:
                          pass
                  log("HASIL: BERHASIL ✅" if ok else "HASIL: GAGAL ❌")
                  await browser.close()
                  return ok

          if __name__ == "__main__":
              sys.exit(0 if asyncio.run(main()) else 1)
          PYEOF

          python upload.py

      - name: Upload Screenshots + HTML to Release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -d shots ] || [ -z "$(ls -A shots 2>/dev/null)" ]; then
            echo "Tidak ada screenshot."; exit 0
          fi

          # Hapus release lama (beserta tag-nya)
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases?per_page=100" \
            | python3 -c "
          import sys, json
          try:
              for r in json.load(sys.stdin):
                  if r.get('tag_name','').startswith('adobe-upload-'):
                      print(r['id'], r['tag_name'])
          except: pass
          " | while read id tag; do
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$id" > /dev/null
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/git/refs/tags/$tag" > /dev/null
          done

          TAG="adobe-upload-$(date +%Y%m%d_%H%M%S)"
          RESP=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Adobe Upload $TAG\",\"body\":\"Screenshots + HTML\"}")

          UPLOAD_URL=$(echo "$RESP" | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['upload_url'].replace('{?name,label}',''))")
          REL_URL=$(echo "$RESP" | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['html_url'])")

          for f in shots/*; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f")
            case "$NAME" in
              *.png) CT="image/png" ;;
              *.html) CT="text/html" ;;
              *) CT="application/octet-stream" ;;
            esac
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: $CT" \
              --data-binary @"$f" \
              "$UPLOAD_URL?name=$NAME" > /dev/null
          done

          echo ""
          echo "🔗 Release: $REL_URL"
          for f in shots/*.png; do
            [ -f "$f" ] || continue
            echo "🖼️  $(basename "$f"): https://github.com/$REPO/releases/download/$TAG/$(basename "$f")"
          done

          {
            echo "### Hasil screenshot"
            echo "Release: $REL_URL"
          } >> "$GITHUB_STEP_SUMMARY"
