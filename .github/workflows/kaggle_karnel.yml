name: Kaggle Text Detection & Mask Refine Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  KERNEL_ID: "kucingpaskib/propainter"
  DATASET_ID: "kucingpaskib/text-mask-input"
  INPUT_IMAGE_PATH: "image.png"                     # file ada di root repo, tanpa folder
  KERNEL_DIR: "kaggle_kernel"
  DATASET_DIR: "kaggle_dataset"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        # Kaggle sekarang pakai sistem API Token baru (KGAT_...) yang butuh
        # CLI >= 1.8.0. Versi lama (1.6.x) tidak kompatibel dengan token ini.
        run: pip install --upgrade "kaggle>=1.8.0"

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          # Cek dulu secret tidak kosong (tanpa nampilin isinya)
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN kosong. Cek lagi di Settings > Secrets."
            echo "Ambil token baru di kaggle.com/settings > API Tokens > Create New Token"
            exit 1
          fi

          # Bersihkan whitespace/newline tersembunyi dari hasil copy-paste
          CLEAN_TOKEN=$(echo -n "$KAGGLE_API_TOKEN" | tr -d '[:space:]')

          mkdir -p ~/.kaggle
          printf '%s' "$CLEAN_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

          echo "Panjang token: ${#CLEAN_TOKEN} karakter"

      - name: Verify Kaggle authentication
        run: |
          # Test ringan pakai operasi baca dulu
          kaggle datasets list -s titanic --max-size 1 || {
            echo "ERROR: Autentikasi Kaggle gagal. Generate token baru di kaggle.com/settings > API Tokens > Create New Token, lalu update secret KAGGLE_API_TOKEN."
            exit 1
          }

      # --- Upload gambar ke Kaggle sebagai Dataset ---
      - name: Prepare dataset folder
        run: |
          mkdir -p ${DATASET_DIR}
          cp "${{ env.INPUT_IMAGE_PATH }}" ${DATASET_DIR}/
          cat > ${DATASET_DIR}/dataset-metadata.json <<EOF
          {
            "title": "text-mask-input",
            "id": "${{ env.DATASET_ID }}",
            "licenses": [{ "name": "CC0-1.0" }]
          }
          EOF

      - name: Create or update dataset on Kaggle
        run: |
          if kaggle datasets status "${{ env.DATASET_ID }}" > /dev/null 2>&1; then
            echo "Dataset sudah ada, update versi baru..."
            kaggle datasets version -p ${DATASET_DIR} -m "update image $(date +%s)" -r zip
          else
            echo "Dataset belum ada, membuat baru..."
            kaggle datasets create -p ${DATASET_DIR} -r zip
          fi

      # --- Siapkan kernel: metadata + script ---
      - name: Generate kernel-metadata.json
        run: |
          mkdir -p ${KERNEL_DIR}
          cat > ${KERNEL_DIR}/kernel-metadata.json <<EOF
          {
            "id": "${{ env.KERNEL_ID }}",
            "title": "Text Detection and Mask Refine",
            "code_file": "main.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": ["${{ env.DATASET_ID }}"],
            "competition_sources": [],
            "kernel_sources": []
          }
          EOF

      - name: Generate main.py (PaddleOCR detect + mask refine)
        run: |
          cat > ${KERNEL_DIR}/main.py <<'EOF'
          import os
          import sys
          import subprocess

          # install paddleocr di environment Kaggle (belum pre-installed)
          subprocess.run([sys.executable, "-m", "pip", "install", "-q",
                           "paddlepaddle", "paddleocr"], check=True)

          import cv2
          import numpy as np
          from paddleocr import PaddleOCR

          INPUT_DIR = "/kaggle/input"
          OUTPUT_DIR = "/kaggle/working"

          # cari file gambar pertama di dataset input
          image_path = None
          for root, dirs, files in os.walk(INPUT_DIR):
              for f in files:
                  if f.lower().endswith((".jpg", ".jpeg", ".png")):
                      image_path = os.path.join(root, f)
                      break
              if image_path:
                  break

          if image_path is None:
              raise FileNotFoundError("Tidak ada gambar ditemukan di /kaggle/input")

          print(f"Memproses gambar: {image_path}")
          img = cv2.imread(image_path)
          h, w = img.shape[:2]

          # 1. Detect text pakai PaddleOCR
          ocr = PaddleOCR(use_angle_cls=True, lang="en", show_log=False)
          result = ocr.ocr(image_path, cls=True)

          # 2. Buat mask awal dari bounding box teks
          mask = np.zeros((h, w), dtype=np.uint8)
          for line in result:
              if line is None:
                  continue
              for box_info in line:
                  box = box_info[0]
                  pts = np.array(box, dtype=np.int32)
                  cv2.fillPoly(mask, [pts], 255)

          # 3. Refine mask: dilasi biar nutup tepi huruf + smoothing
          kernel = np.ones((7, 7), np.uint8)
          mask_refined = cv2.dilate(mask, kernel, iterations=2)
          mask_refined = cv2.GaussianBlur(mask_refined, (5, 5), 0)
          _, mask_refined = cv2.threshold(mask_refined, 127, 255, cv2.THRESH_BINARY)

          # 4. Simpan hasil
          cv2.imwrite(os.path.join(OUTPUT_DIR, "mask_raw.png"), mask)
          cv2.imwrite(os.path.join(OUTPUT_DIR, "mask_refined.png"), mask_refined)

          overlay = img.copy()
          overlay[mask_refined == 255] = (0, 0, 255)
          blended = cv2.addWeighted(img, 0.7, overlay, 0.3, 0)
          cv2.imwrite(os.path.join(OUTPUT_DIR, "overlay_preview.png"), blended)

          print("Selesai! Output: mask_raw.png, mask_refined.png, overlay_preview.png")
          EOF

      # --- Push kernel & jalankan ---
      - name: Push kernel to Kaggle
        run: kaggle kernels push -p ${KERNEL_DIR}

      - name: Wait for kernel to finish
        run: |
          python3 << 'PYSCRIPT'
          import subprocess
          import json
          import time
          
          kernel_id = "${{ env.KERNEL_ID }}"
          max_attempts = 40
          wait_seconds = 20
          
          for attempt in range(1, max_attempts + 1):
            try:
              result = subprocess.run(
                ["kaggle", "kernels", "status", kernel_id],
                capture_output=True,
                text=True,
                check=True
              )
              status_data = json.loads(result.stdout)
              status = status_data.get("status", "unknown")
              
              print(f"Attempt {attempt}/{max_attempts} - Status: {status}")
              
              if status == "complete":
                print("✓ Kernel selesai dengan sukses!")
                exit(0)
              elif status in ["error", "cancelAcknowledged"]:
                print(f"✗ Kernel gagal dengan status: {status}")
                exit(1)
              
              if attempt < max_attempts:
                time.sleep(wait_seconds)
            
            except json.JSONDecodeError:
              print(f"Warning: Tidak bisa parse response. Raw output:")
              print(result.stdout)
              if attempt < max_attempts:
                time.sleep(wait_seconds)
            except subprocess.CalledProcessError as e:
              print(f"Error calling kaggle CLI: {e.stderr}")
              if attempt < max_attempts:
                time.sleep(wait_seconds)
          
          print("✗ Timeout: Kernel belum selesai setelah 40 attempts.")
          exit(1)
          PYSCRIPT


      - name: Download kernel output
        run: |
          mkdir -p output
          kaggle kernels output "${{ env.KERNEL_ID }}" -p output

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: text-mask-output
          path: output/
