name: Run Code on Google Colab GPU

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Memungkinkan Anda memicu manual dari tombol di GitHub UI

jobs:
  execute-on-colab:
    runs-on: ubuntu-latest

    steps:
    # 1. Ambil kode dari repositori GitHub Anda
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Python di lingkungan GitHub Actions runner (Sudah diperbaiki)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. Autentikasi ke Google Cloud Platform (GCP)
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # 4. Instal Google Colab CLI resmi
    - name: Install Google Colab CLI
      run: |
        pip install google-colab-cli

    - name: Run Script on Colab GPU
      run: |
        # Membuat file train.py langsung di runner untuk memastikan file pasti ada
        cat << 'EOF' > train.py
        import torch
        import time

        print("=== Memulai Pengecekan Hardware di Colab ===")
        gpu_tersedia = torch.cuda.is_available()
        print(f"Apakah GPU Terdeteksi? {gpu_tersedia}")

        if gpu_tersedia:
            nama_gpu = torch.cuda.get_device_name(0)
            print(f"Model GPU: {nama_gpu}")
            x = torch.randn(5000, 5000, device="cuda")
            y = torch.randn(5000, 5000, device="cuda")
            z = torch.matmul(x, y)
            torch.cuda.synchronize()
            with open("hasil_output.txt", "w") as f:
                f.write(f"Eksekusi Sukses menggunakan GPU: {nama_gpu}\n")
        else:
            print("GPU tidak terdeteksi!")
            with open("hasil_output.txt", "w") as f:
                f.write("Eksekusi gagal menggunakan GPU.\n")
        EOF

        # Menjalankan colab setelah file dipastikan terbuat
        colab run --gpu T4 train.py --keep -s sesi-otomatisasi
        
    # 6. Unduh file hasil output dari dalam virtual machine Colab ke GitHub runner
    - name: Download Results from Colab
      run: |
        colab download -s sesi-otomatisasi hasil_output.txt ./hasil_output.txt

    # 7. Tampilkan isi file teks hasil di log GitHub Actions
    - name: Display Output Log
      run: cat ./hasil_output.txt

    # 8. Hancurkan sesi runtime Colab agar unit komputasi (quota) Anda tidak terus berkurang
    - name: Terminate Colab Session
      if: always()
      run: |
        colab stop -s sesi-otomatisasi
