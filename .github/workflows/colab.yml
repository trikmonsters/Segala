name: Run AI job on Colab GPU

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  run-on-colab:
    runs-on: ubuntu-latest   # Colab CLI hanya support Linux & macOS
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv & Colab CLI
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"

          # Bersihkan cache uv supaya tidak menarik resolusi/paket lama yang basi
          uv cache clean

          # PENTING (root cause terkonfirmasi dari pyproject.toml resmi mereka):
          # google-colab-cli mengunci jupyter-kernel-client ke fork resmi Google lewat
          # [tool.uv.sources], TAPI mapping ini hanya terbaca kalau di-resolve dari
          # source tree GitHub-nya langsung -- TIDAK ikut ke metadata wheel yang
          # dipublish ke PyPI. Jadi "uv tool install google-colab-cli" (dari PyPI,
          # sesuai README) salah tarik "jupyter-kernel-client" versi datalayer di PyPI
          # yang API-nya beda -> AttributeError: no attribute 'KernelClient'.
          # Fix: install langsung dari source GitHub supaya [tool.uv.sources] terbaca.
          uv tool install --reinstall --force "git+https://github.com/googlecolab/google-colab-cli"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Debug - cek versi jupyter_kernel_client yang benar-benar terpasang
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          COLAB_TOOL_DIR="$HOME/.local/share/uv/tools/google-colab-cli"
          "$COLAB_TOOL_DIR/bin/python" -c "import jupyter_kernel_client; print('path:', jupyter_kernel_client.__file__); print('has KernelClient:', hasattr(jupyter_kernel_client, 'KernelClient'))"

      - name: Restore Colab auth token (dari secret, hasil login manual sekali)
        env:
          COLAB_TOKEN_JSON_B64: ${{ secrets.COLAB_TOKEN_JSON_B64 }}
        run: |
          mkdir -p ~/.config/colab-cli
          echo "$COLAB_TOKEN_JSON_B64" | base64 -d > ~/.config/colab-cli/token.json

      - name: Buat requirements.txt (inline, EOF)
        run: |
          cat > requirements.txt << 'EOF'
          torch
          transformers
          accelerate
          EOF

      - name: Buat train.py (inline, EOF)
        run: |
          cat > train.py << 'EOF'
          import torch

          def main():
              print("CUDA available:", torch.cuda.is_available())
              if torch.cuda.is_available():
                  print("GPU:", torch.cuda.get_device_name(0))

              # ganti bagian ini dengan job AI kamu yang sesungguhnya
              x = torch.rand(3, 3, device="cuda" if torch.cuda.is_available() else "cpu")
              y = x @ x
              print("Hasil hitung tensor:")
              print(y)

              with open("output.txt", "w") as f:
                  f.write(str(y.tolist()))

          if __name__ == "__main__":
              main()
          EOF

      - name: Provision GPU, jalankan script, ambil hasil, matikan VM
        run: |
          colab new -s ciJob --gpu T4
          colab install -s ciJob -r requirements.txt
          colab exec -s ciJob -f train.py
          colab download -s ciJob output.txt ./output.txt
          colab log -s ciJob -o run_log.ipynb
          colab stop -s ciJob

      - name: Upload hasil sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: colab-output
          path: |
            output.txt
            run_log.ipynb
