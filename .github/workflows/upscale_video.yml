name: Video Upscale RealESRGAN (17 Parallel Jobs)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # TAHAP 1: Memotong video secara cerdas menjadi ~17 bagian secara dinamis
  # =========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      chunk_matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (FFmpeg & jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Split Video into Exactly ~17 Dynamic Chunks
        id: split
        run: |
          mkdir chunks
          
          # 1. Baca total durasi video secara akurat
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 video.mp4)
          echo "Durasi video asli: $DURATION detik"
          
          # 2. Patok jumlah job = 17. Hitung durasi per potongannya secara otomatis.
          CHUNK_TIME=$(awk "BEGIN {print $DURATION/17}")
          echo "Sistem akan memotong setiap $CHUNK_TIME detik agar pas menjadi 17 bagian"
          
          # 3. Potong video dengan render kilat & paksa keyframe agar potongan sangat presisi
          ffmpeg -y -i video.mp4 \
            -c:v libx264 -preset ultrafast -crf 10 \
            -force_key_frames "expr:gte(t,n_forced*$CHUNK_TIME)" \
            -c:a copy -map 0 -f segment -segment_time $CHUNK_TIME \
            -reset_timestamps 1 chunks/chunk_%03d.mp4
          
          # 4. Buat daftar array JSON untuk dikirim ke Matrix Jobs
          cd chunks
          JSON_ARRAY=$(ls chunk_*.mp4 | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT

      - name: Upload Raw Chunks as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-video-chunks
          path: chunks/chunk_*.mp4
          retention-days: 1


  # =========================================================================
  # TAHAP 2: Menjalankan 17 Mesin (Jobs) secara bersamaan
  # =========================================================================
  upscale:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Jika 1 chunk gagal, mesin lain akan terus memproses chunk mereka
      matrix:
        chunk_file: ${{ fromJson(needs.prepare.outputs.chunk_matrix) }}
    steps:
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download Specific Chunk from Artifact
        uses: actions/download-artifact@v4
        with:
          name: raw-video-chunks
          path: inputs/

      - name: Clone Real-ESRGAN & Install Packages
        run: |
          git clone https://github.com/xinntao/Real-ESRGAN.git
          cd Real-ESRGAN
          pip install -r requirements.txt
          pip install ffmpeg-python basicsr facexlib gfpgan
          python setup.py develop

      - name: Patch BasicSR & Real-ESRGAN for CPU
        run: |
          # Patch Torchvision (BasicSR fix)
          DEGRAD_FILE=$(python -c "import site; print(site.getsitepackages()[0])")/basicsr/data/degradations.py
          if [ -f "$DEGRAD_FILE" ]; then
            sed -i 's/from torchvision.transforms.functional_tensor import rgb_to_grayscale/from torchvision.transforms.functional import rgb_to_grayscale/g' "$DEGRAD_FILE"
          fi
          
          # Patch Cuda check untuk CPU Mode
          cd Real-ESRGAN
          sed -i 's/num_gpus = torch.cuda.device_count()/num_gpus = max(1, torch.cuda.device_count())/' inference_realesrgan_video.py
          python3 - <<'EOF'
          import re
          path = "inference_realesrgan_video.py"
          with open(path, "r") as f:
              content = f.read()
          new_content = re.sub(r"^(\s*)torch\.cuda\.synchronize\((.*)\)\s*$", r"\1if torch.cuda.is_available():\n\1    torch.cuda.synchronize(\2)", content, flags=re.MULTILINE)
          with open(path, "w") as f:
              f.write(new_content)
          EOF

      - name: Download Model Weights
        run: |
          cd Real-ESRGAN
          mkdir -p weights gfpgan/weights
          wget -q https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth -P weights/
          wget -q https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-wdn-x4v3.pth -P weights/
          wget -q https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.3.pth -P gfpgan/weights/

      - name: Process Chunk ${{ matrix.chunk_file }}
        run: |
          cd Real-ESRGAN
          mkdir -p final_result
          
          # Salin HANYA file bagian milik job/mesin ini ke ruang eksekusi
          cp ../inputs/${{ matrix.chunk_file }} input_video.mp4
          
          # Jalankan Upscaler
          python inference_realesrgan_video.py \
            -i input_video.mp4 \
            -n realesr-general-x4v3 \
            -o final_result/ \
            -s 2 \
            -dn 0.7 \
            -t 256 \
            --fp32 \
            --face_enhance
            
          # Ubah nama agar tidak bentrok saat digabung (contoh: jadi upscaled_chunk_000.mp4)
          mv final_result/input_video_out.mp4 final_result/upscaled_${{ matrix.chunk_file }}

      - name: Upload Processed Chunk
        uses: actions/upload-artifact@v4
        with:
          name: finished-${{ matrix.chunk_file }}
          path: Real-ESRGAN/final_result/upscaled_${{ matrix.chunk_file }}
          retention-days: 1


  # =========================================================================
  # TAHAP 3: Menggabungkan 17 video hasil, memoles gambar, dan menambah Audio
  # =========================================================================
  merge_and_release:
    needs: [prepare, upscale]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (For Original Audio)
        uses: actions/checkout@v4

      - name: Install System Dependencies (FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download All Upscaled Chunks
        uses: actions/download-artifact@v4
        with:
          pattern: finished-*
          merge-multiple: true
          path: all_upscaled_chunks/

      - name: Combine Chunks and Add Polish
        run: |
          cd all_upscaled_chunks
          
          # Membuat list urutan video
          rm -f concat_list.txt
          for f in $(ls upscaled_chunk_*.mp4 | sort); do
            echo "file '$f'" >> concat_list.txt
          done
          
          # Gabungkan video
          ffmpeg -y -f concat -safe 0 -i concat_list.txt -c copy merged_video_no_audio.mp4
          
          # Pindahkan ke folder utama untuk post-process
          mv merged_video_no_audio.mp4 ../
          cd ..
          
          # Post-process Denoise, Pertajam (Unsharp), Perbaikan Warna, & Masukkan Audio asli
          ffmpeg -y -i merged_video_no_audio.mp4 -i video.mp4 \
            -vf "hqdn3d=2:1.5:3:2,unsharp=5:5:1.2:5:5:0.0,eq=saturation=1.15:contrast=1.05" \
            -c:v libx264 -preset fast -pix_fmt yuv420p \
            -c:a copy -map 0:v:0 -map 1:a:0? ULTRA_CLEAR_video.mp4

      - name: Delete Old Tag & Release (If Exists)
        run: |
          gh release delete v1.0-result --yes || true
          git push --delete origin v1.0-result || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Direct MP4 Video to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-result
          name: "Hasil Upscale Video Ultra Clear"
          body: "Berikut adalah video mp4 hasil perbaikan dengan sistem distribusi 17 Paralel Job."
          files: ULTRA_CLEAR_video.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
