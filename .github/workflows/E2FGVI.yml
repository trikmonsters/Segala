name: Video Subtitle/Watermark Removal (E2FGVI Fast)

on:
  push:
  
    paths:
      - 'video.mp4'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 wget curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install easyocr opencv-python-headless pillow numpy ultralytics onnxruntime

      - name: Download E2FGVI ONNX Model (Direct Mirror)
        run: |
          mkdir -p models
          echo "Mengunduh E2FGVI ONNX asli..."
          
          # Direct mirror release E2FGVI ONNX (~36MB)
          wget -q --show-progress -O models/e2fgvi.onnx "https://github.com/Vewo/E2FGVI-ONNX/releases/download/v1.0.0/e2fgvi_hq.onnx" || \
          curl -L -o models/e2fgvi.onnx "https://github.com/Vewo/E2FGVI-ONNX/releases/download/v1.0.0/e2fgvi_hq.onnx"

          FILESIZE=$(stat -c%s "models/e2fgvi.onnx" || echo 0)
          echo "Ukuran file terunduh: $FILESIZE bytes"
          
          if [ $FILESIZE -lt 10000000 ]; then
            echo "Gagal mengunduh file biner E2FGVI!"
            exit 1
          fi
          echo "Model E2FGVI ONNX berhasil diunduh!"

      - name: Extract Frames & Audio
        run: |
          mkdir -p frames masks output_frames
          FPS=$(ffprobe -v 0 -of csv=p=0 -select_streams v:0 -show_entries stream=r_frame_rate video.mp4)
          echo "Detected FPS: $FPS"
          echo "$FPS" > fps.txt
          ffmpeg -y -i video.mp4 -qscale:v 2 frames/frame_%06d.png
          ffmpeg -y -i video.mp4 -vn -acodec copy audio.aac || echo "Tidak ada audio track, skip."

      - name: Detect Text & Build Precise Mask
        env:
          PYTHONWARNINGS: "ignore"
        run: |
          cat << 'EOF' > detect_and_mask.py
          import os, glob
          import numpy as np
          import cv2
          import easyocr

          def main():
              frame_paths = sorted(glob.glob("frames/frame_*.png"))
              if not frame_paths:
                  return

              reader = easyocr.Reader(['en', 'id'], gpu=False)

              for i, fp in enumerate(frame_paths):
                  img = cv2.imread(fp)
                  h, w = img.shape[:2]
                  mask = np.zeros((h, w), dtype=np.uint8)

                  # 1. OCR Detection
                  results_ocr = reader.readtext(fp)
                  for (bbox, text, prob) in results_ocr:
                      if prob > 0.15:
                          pts = np.array(bbox, dtype=np.int32)
                          x_min, y_min = int(np.min(pts[:, 0])), int(np.min(pts[:, 1]))
                          x_max, y_max = int(np.max(pts[:, 0])), int(np.max(pts[:, 1]))
                          cv2.rectangle(mask, (max(0, x_min-5), max(0, y_min-5)),
                                              (min(w, x_max+5), min(h, y_max+5)), 255, -1)

                  # 2. Static Box Watermark TikTok (Pojok Kanan & Kiri Bawah)
                  cv2.rectangle(mask, (int(w * 0.65), int(h * 0.82)), (int(w * 0.98), int(h * 0.98)), 255, -1)
                  cv2.rectangle(mask, (int(w * 0.02), int(h * 0.82)), (int(w * 0.35), int(h * 0.98)), 255, -1)

                  kernel = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (3, 3))
                  mask = cv2.dilate(mask, kernel, iterations=1)

                  out_path = f"masks/frame_{i+1:06d}.png"
                  cv2.imwrite(out_path, mask)

              print(f"Selesai membuat {len(frame_paths)} mask.")

          if __name__ == "__main__":
              main()
          EOF

          python detect_and_mask.py

      - name: Fast E2FGVI ONNX Inpainting
        env:
          PYTHONWARNINGS: "ignore"
        run: |
          cat << 'EOF' > e2fgvi_inpaint.py
          import os, glob
          import cv2
          import numpy as np
          import onnxruntime as ort

          def prepare_inputs(img, mask, target_size=(432, 240)):
              h_orig, w_orig = img.shape[:2]
              img_resized = cv2.resize(img, target_size)
              mask_resized = cv2.resize(mask, target_size, interpolation=cv2.INTER_NEAREST)

              img_tensor = img_resized.astype(np.float32) / 255.0
              img_tensor = np.transpose(img_tensor, (2, 0, 1))[None, ...]
              mask_tensor = (mask_resized > 0).astype(np.float32)[None, None, ...]
              return img_tensor, mask_tensor, h_orig, w_orig

          def main():
              model_path = "models/e2fgvi.onnx"
              if not os.path.exists(model_path):
                  raise FileNotFoundError("Model E2FGVI ONNX tidak ditemukan!")

              opts = ort.SessionOptions()
              opts.intra_op_num_threads = 2
              opts.execution_mode = ort.ExecutionMode.ORT_SEQUENTIAL

              session = ort.InferenceSession(model_path, opts, providers=['CPUExecutionProvider'])
              input_names = [inp.name for inp in session.get_inputs()]
              output_name = session.get_outputs()[0].name

              frame_paths = sorted(glob.glob("frames/frame_*.png"))
              mask_paths = sorted(glob.glob("masks/frame_*.png"))
              os.makedirs("output_frames", exist_ok=True)

              for fp, mp in zip(frame_paths, mask_paths):
                  out_path = os.path.join("output_frames", os.path.basename(fp))
                  frame = cv2.imread(fp)
                  mask = cv2.imread(mp, cv2.IMREAD_GRAYSCALE)

                  if mask is None or np.count_nonzero(mask) == 0:
                      cv2.imwrite(out_path, frame)
                      continue

                  img_rgb = cv2.cvtColor(frame, cv2.COLOR_BGR2RGB)
                  img_t, mask_t, orig_h, orig_w = prepare_inputs(img_rgb, mask)

                  inputs = {input_names[0]: img_t, input_names[1]: mask_t}
                  res = session.run([output_name], inputs)[0]

                  res_img = np.clip(res[0], 0, 255).astype(np.uint8)
                  res_img = np.transpose(res_img, (1, 2, 0))
                  res_img = cv2.resize(res_img, (orig_w, orig_h))
                  res_bgr = cv2.cvtColor(res_img, cv2.COLOR_RGB2BGR)

                  mask_3c = cv2.merge([(mask > 0).astype(np.uint8)] * 3)
                  final_frame = np.where(mask_3c == 1, res_bgr, frame)

                  cv2.imwrite(out_path, final_frame)

              print("Selesai inpainting cepat dengan E2FGVI ONNX.")

          if __name__ == "__main__":
              main()
          EOF

          python e2fgvi_inpaint.py

      - name: Reassemble Video & Mux Audio Back
        run: |
          FPS=$(cat fps.txt)

          ffmpeg -y -framerate "$FPS" -i output_frames/frame_%06d.png \
            -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            output_video_noaudio.mp4

          if [ -s audio.aac ]; then
            ffmpeg -y -i output_video_noaudio.mp4 -i audio.aac \
              -c:v copy -c:a aac -shortest output_final.mp4
          else
            cp output_video_noaudio.mp4 output_final.mp4
          fi

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-subtitle-watermark-removed
          path: |
            output_final.mp4
          retention-days: 3
